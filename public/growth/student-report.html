  function renderEmotionCard(report, areaData) {
    const emotions = report.emotionDevelopment || [];
    const total = emotions.reduce((s, e) => s + e.cnt, 0);
    const positiveEmotions = emotions.filter(e => ['happy','excited','good','great','calm'].includes(e.emotion));
    const negativeEmotions = emotions.filter(e => ['sad','angry','anxious','tired','frustrated'].includes(e.emotion));
    const positiveCount = positiveEmotions.reduce((s, e) => s + e.cnt, 0);
    const negativeCount = negativeEmotions.reduce((s, e) => s + e.cnt, 0);
    const noneCount = total - positiveCount - negativeCount;

    const act = actionLinkFor('emotion');
    const headerHtml = makeDomainHeader('emotion', '💛', '정서 발달', {
      actionHref: act.href, actionLabel: act.label
    });

    // 빈 상태 — 5블록 placeholder 유지
    if (total === 0) {
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, { empty: true, label: '체크인 없음' }) +
          '<div class="domain-details">' +
            '<div class="domain-insight emotion">아직 감정 체크인 데이터가 없습니다. 출석 시 감정을 표현하면 정서 발달 점수가 표시됩니다.</div>' +
            '<div class="domain-chips">' +
              '<span class="domain-chip is-sample" title="감정출석부에서 행복·설렘·좋음·최고·편안 등 긍정 감정으로 체크인한 횟수입니다."><span class="legend-dot positive" style="display:inline-block;margin-right:4px;"></span>긍정 0회</span>' +
              '<span class="domain-chip is-sample" title="감정출석부에서 슬픔·화남·불안·피곤·답답 등 부정 감정으로 체크인한 횟수입니다."><span class="legend-dot negative" style="display:inline-block;margin-right:4px;"></span>부정 0회</span>' +
              '<span class="domain-chip is-sample" title="해당 기간 중 감정 체크인을 하지 않은(미응답) 횟수입니다."><span class="legend-dot none" style="display:inline-block;margin-right:4px;"></span>무응답 0회</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📅 최근 감정 흐름 (0건)</div>' +
          '<div class="domain-flow-empty">아직 감정 기록이 없습니다.</div>' +
        '</div>' +
      '</div>';
    }

    const posRatio = Math.round(positiveCount / total * 100);
    const negRatio = Math.round(negativeCount / total * 100);
    const posDeg = Math.round(posRatio / 100 * 360);
    const negDeg = Math.round(negRatio / 100 * 360);

    // Find most common emotion
    let topEmotion = '';
    if (emotions.length > 0) {
      const sorted = [...emotions].sort((a, b) => b.cnt - a.cnt);
      topEmotion = sorted[0].emotion;
    }
    const emotionKo = { happy: '행복해요', excited: '설레요', good: '좋아요', great: '최고예요', calm: '편안해요', sad: '슬퍼요', angry: '화나요', anxious: '불안해요', tired: '피곤해요', frustrated: '답답해요' };
    const emotionEmoji = { happy: '😊', excited: '🤩', great: '🥳', good: '🙂', calm: '😌', tired: '😴', sad: '😢', angry: '😠', anxious: '😰', frustrated: '😫' };

    // 인사이트 텍스트 (3분기 + top 감정 극성)
    const insightText = (function(){
      const posSet = ['happy','excited','good','great','calm'];
      const negSet = ['sad','angry','anxious','tired','frustrated'];
      const topLabel = topEmotion ? (emotionKo[topEmotion] || '기타') : '';
      const topIsPos = posSet.indexOf(topEmotion) >= 0;
      const topIsNeg = negSet.indexOf(topEmotion) >= 0;
      let topText = '';
      if (topEmotion) {
        if (topIsPos) topText = '"<strong>' + topLabel + '</strong>" 등 긍정 감정을 자주 표현했어요. ';
        else if (topIsNeg) topText = '"<strong>' + topLabel + '</strong>" 감정이 자주 나타났어요. ';
        else topText = '"<strong>' + topLabel + '</strong>" 감정을 자주 표현했어요. ';
      }
      let stateText;
      if (posRatio >= 70) stateText = '전반적으로 안정적인 정서 상태를 보이고 있습니다.';
      else if (posRatio >= 40) stateText = '긍정과 부정 감정이 비슷한 비율로 나타나 정서적 관심이 도움이 됩니다.';
      else stateText = '부정 감정 비율이 높아 감정적 지원이 필요한 상태입니다.';
      return topText + stateText;
    })();

    // 정서 도넛 (긍/부 2색)
    const donutHtml =
      '<div class="domain-donut-wrap">' +
        '<div class="domain-donut" style="background: conic-gradient(var(--secondary) 0deg ' + posDeg + 'deg, var(--warning) ' + posDeg + 'deg ' + (posDeg + negDeg) + 'deg, var(--gray-200) ' + (posDeg + negDeg) + 'deg 360deg);">' +
          '<div class="domain-donut-inner">' +
            '<div class="domain-donut-value" style="color:var(--secondary);">' + posRatio + '<span class="unit">%</span></div>' +
            '<div class="domain-donut-label">긍정 비율</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    // 최근 감정 흐름 (블록 E)
    const recents = report.recentEmotions || [];
    let flowListHtml;
    if (recents.length === 0) {
      flowListHtml = '<div class="domain-flow-empty">아직 감정 기록이 없습니다.</div>';
    } else {
      const renderEmoRow = function(e, idx) {
        const emoji = emotionEmoji[e.emotion] || '❓';
        const label = emotionKo[e.emotion] || '기타';
        const isLatest = idx === 0;
        const dateFmt = (e.attendance_date || '').replace(/-/g, '.');
        const reasonHtml = e.emotion_reason ? '<div class="domain-flow-row-desc">' + escapeHtml(e.emotion_reason) + '</div>' : '';
        const badge = isLatest ? '<span class="domain-flow-row-badge">최근</span>' : '';
        return '<div class="domain-flow-row">' +
          '<div class="domain-flow-row-icon">' + emoji + '</div>' +
          '<div class="domain-flow-row-body">' +
            '<div class="domain-flow-row-head"><span class="domain-flow-row-label">' + label + '</span>' + badge + '<span class="domain-flow-row-date">' + dateFmt + '</span></div>' +
            reasonHtml +
          '</div>' +
        '</div>';
      };
      const SUMMARY_N = 5;
      const headRows = recents.slice(0, SUMMARY_N).map(renderEmoRow).join('');
      let extraHtml = '';
      if (recents.length > SUMMARY_N) {
        const extraRows = recents.slice(SUMMARY_N).map(function(e, i){ return renderEmoRow(e, i + SUMMARY_N); }).join('');
        extraHtml =
          '<div class="emo-flow-extra" id="emoFlowExtra" style="display:none;">' + extraRows + '</div>' +
          '<button type="button" class="emo-flow-toggle" id="emoFlowToggle" ' +
            'onclick="toggleEmotionFlow(this)">' +
            '<i class="fas fa-chevron-down"></i> 전체 ' + recents.length + '건 보기' +
          '</button>';
      }
      flowListHtml = '<div class="domain-flow-list">' + headRows + extraHtml + '</div>';
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        donutHtml +
        '<div class="domain-details">' +
          '<div class="domain-insight emotion">' + insightText + '</div>' +
          '<div class="domain-chips">' +
            '<span class="domain-chip" title="감정출석부에서 행복·설렘·좋음·최고·편안 등 긍정 감정으로 체크인한 횟수입니다."><span class="legend-dot positive" style="display:inline-block;margin-right:4px;"></span>긍정 ' + positiveCount + '회</span>' +
            '<span class="domain-chip" title="감정출석부에서 슬픔·화남·불안·피곤·답답 등 부정 감정으로 체크인한 횟수입니다."><span class="legend-dot negative" style="display:inline-block;margin-right:4px;"></span>부정 ' + negativeCount + '회</span>' +
            '<span class="domain-chip" title="해당 기간 중 감정 체크인을 하지 않은(미응답) 횟수입니다."><span class="legend-dot none" style="display:inline-block;margin-right:4px;"></span>무응답 ' + noneCount + '회</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📅 최근 감정 흐름 (' + recents.length + '건)</div>' +
        flowListHtml +
      '</div>' +
    '</div>';
  }

  // ---- 참여도 카드 (5블록 통일) ----
  function renderParticipationCard(report, areaData) {
    const ad = areaData || {};
    const hasData = ad.hasData !== false;
    const score = ad.score != null ? Math.round(ad.score) : null;
    const p = ad.participation || {};

    const act = actionLinkFor('participation');
    const headerHtml = makeDomainHeader('learning', '🤝', '참여도', {
      actionHref: act.href, actionLabel: act.label
    });

    const metrics = [
      { key: 'homework', label: '과제 제출', c: '#2563eb',
        tip: '채움클래스에서 배정받은 과제 대비 제출 비율입니다. (제출 ÷ 배정)' },
      { key: 'exam',     label: '평가 응시', c: '#8b5cf6',
        tip: '채움클래스에서 배정받은 평가 대비 응시 비율입니다. (응시 ÷ 배정)' },
      { key: 'daily',    label: '오늘학습',  c: '#10b981',
        tip: '스스로채움 > 오늘의 학습 배정 대비 완료 비율입니다. (완료 ÷ 배정)' },
      { key: 'lesson',   label: '수업 이수', c: '#f59e0b',
        tip: '수업을 듣고 셀프 점검(이해도·집중도·소감)까지 완료한 수업 개수 ÷ 개설 수업 수입니다.' }
    ];

    if (!hasData || score == null) {
      let barsEmpty = '';
      metrics.forEach(m => {
        barsEmpty += '<div class="subject-item" title="' + escapeHtml(m.tip) + '">' +
          '<span class="subject-name" style="flex:0 0 64px;">' + m.label + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:0%;background:var(--gray-300)"></div></div>' +
          '<span class="subject-value" style="color:var(--gray-400);">-</span></div>';
      });
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, { empty: true, label: '참여 없음' }) +
          '<div class="domain-details">' +
            '<div class="domain-insight participation">아직 참여 데이터가 없습니다. 과제·평가·오늘의 학습·수업에 참여하면 종합 참여도가 표시됩니다.</div>' +
            '<div class="subject-growth">' + barsEmpty + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📋 최근 참여 활동</div>' +
          '<div class="domain-flow-empty">아직 참여 활동 기록이 없습니다.</div>' +
        '</div>' +
      '</div>';
    }

    let barsHtml = '';
    metrics.forEach(m => {
      const v = p[m.key];
      const w = v != null ? Math.min(v, 100) : 0;
      barsHtml += '<div class="subject-item" title="' + escapeHtml(m.tip) + '">' +
        '<span class="subject-name" style="flex:0 0 64px;">' + m.label + '</span>' +
        '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + w + '%;background:' + m.c + '"></div></div>' +
        '<span class="subject-value">' + (v != null ? v + '%' : '-') + '</span></div>';
    });

    // 3분기 인사이트
    let insight;
    if (score >= 80) insight = '<strong>적극적으로 참여</strong>하고 있어요. 학습 활동에 꾸준히 응하고 있습니다.';
    else if (score >= 50) insight = '꾸준히 참여하고 있어요. 일부 활동을 늘리면 참여도가 더 향상됩니다.';
    else if (score >= 25) insight = '참여를 조금 더 늘려보세요. 과제·평가·오늘의 학습 등에 응해보면 좋아요.';
    else insight = '참여가 부족합니다. 과제·평가·수업 이수에 참여해 보세요.';

    // 블록 E — 최근 참여 활동 (learningCapacity 활용)
    const lc = report.learningCapacity || [];
    const participationTypes = ['homework_submit','exam_complete','lesson_view','daily_complete','problem_set_complete','lesson_complete','content_view','attendance_checkin','post_create','survey_respond','portfolio_add','lesson_progress','board_view','diagnosis_complete'];
    const recent = lc.filter(l => participationTypes.indexOf(l.activity_type) >= 0 && (l.cnt||0) > 0)
                     .sort((a,b) => (b.cnt||0) - (a.cnt||0))
                     .slice(0, 5);
    const typeIcon = {
      homework_submit: '📝', exam_complete: '🎓', lesson_view: '📚',
      daily_complete: '📋', problem_set_complete: '✏️', lesson_complete: '✅',
      content_view: '🎬', attendance_checkin: '💛', post_create: '🗒️',
      survey_respond: '📋', portfolio_add: '🎨', lesson_progress: '⏳',
      board_view: '👀', diagnosis_complete: '🔎'
    };
    let recentHtml;
    if (recent.length === 0) {
      recentHtml = '<div class="domain-flow-empty">아직 참여 활동 기록이 없습니다.<br>과제·평가·오늘의 학습·수업에 참여하면 활동 유형이 표시됩니다.</div>';
    } else {
      // 활동 유형 Top — 칩 1줄 대신 가로 막대 리스트로 보강(짧은 카드 내부 공백 흡수, 정보량↑)
      const maxCnt = Math.max(...recent.map(l => l.cnt || 0)) || 1;
      recentHtml = '<div class="domain-flow-list activity-type-bars">' + recent.map(l => {
        const ico = typeIcon[l.activity_type] || '📌';
        const lbl = toKoActivityType(l.activity_type) || '활동';
        const cnt = l.cnt || 0;
        const w = Math.round((cnt / maxCnt) * 100);
        return '<div class="atb-row" title="' + escapeHtml(lbl + ' ' + cnt + '회') + '">' +
          '<span class="atb-label">' + ico + ' ' + escapeHtml(lbl) + '</span>' +
          '<div class="atb-track"><div class="atb-fill" style="width:' + w + '%;"></div></div>' +
          '<span class="atb-val">' + cnt + '회</span>' +
        '</div>';
      }).join('') + '</div>';
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        makeScoreDonutHtml(score, {
          unit: '%',
          label: '종합 참여도',
          tip: '과제 제출률 · 평가 응시율 · 오늘의 학습 완료율 · 수업 이수율 4개 지표의 평균입니다.'
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight participation">' + insight + '</div>' +
          '<div class="subject-growth">' + barsHtml + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📈 활동 유형 Top ' + recent.length + '</div>' +
        recentHtml +
      '</div>' +
    '</div>';
  }

  // ---- 성취수준 카드 (5블록 통일) ----
  function renderAchievementCard(report, areaData) {
    const ad = areaData || {};
    const hasData = ad.hasData !== false;
    const score = ad.score != null ? Math.round(ad.score) : null;
    const a = ad.achievement || {};

    const act = actionLinkFor('achievement');
    const headerHtml = makeDomainHeader('basic', '🎯', '성취수준', {
      actionHref: act.href, actionLabel: act.label
    });

    const sources = [
      { key: 'daily',     label: '오늘의학습', c: '#10b981',
        tip: '스스로채움 > 오늘의 학습에서 푼 퀴즈 문항의 정답률입니다. (정답수 ÷ 응답수)' },
      { key: 'diagnosis', label: '진단평가',   c: '#2563eb',
        tip: 'AI 맞춤학습 > 학습맵에서 응시한 진단평가 세션의 정답률입니다. (60% 이상이면 다음 단원 추천)' },
      { key: 'problem',   label: '문항풀이+평가', c: '#8b5cf6',
        tip: '콘텐츠 플레이어/AI 맞춤학습에서 푼 단발 문항 + 채움클래스에서 응시한 평가 점수를 문항수 가중 평균한 정답률입니다.' }
    ];

    if (!hasData || score == null) {
      let barsEmpty = '';
      sources.forEach(m => {
        barsEmpty += '<div class="subject-item" title="' + escapeHtml(m.tip) + '">' +
          '<span class="subject-name" style="flex:0 0 84px;">' + m.label + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:0%;background:var(--gray-300)"></div></div>' +
          '<span class="subject-value" style="color:var(--gray-400);">-</span></div>';
      });
      const guideMsg = isTeacher
        ? '아직 응시 기록이 없습니다. 학생이 진단평가·오늘의 학습·문항 풀이·평가에 응시하면 성취수준(정답률)이 표시됩니다.'
        : '진단평가에 응시하면 성취수준(정답률)이 표시됩니다. AI 맞춤학습에서 시작해보세요.';
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, {
            empty: true, label: '응시 없음',
            tip: '오늘의 학습 · 진단평가 · (문항풀이+평가) 세 출처의 정답률(%) 평균입니다.'
          }) +
          '<div class="domain-details">' +
            '<div class="domain-insight achievement">' + guideMsg + '</div>' +
            '<div class="subject-growth">' + barsEmpty + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📝 최근 응시 기록</div>' +
          '<div class="domain-flow-empty">아직 응시 기록이 없습니다.</div>' +
        '</div>' +
      '</div>';
    }

    // 문항+평가 출처 상세를 툴팁에 동적 반영
    const pb = a.problemBreakdown || {};
    let barsHtml = '';
    sources.forEach(m => {
      const v = a[m.key];
      const w = v != null ? Math.min(v, 100) : 0;
      let tip = m.tip;
      if (m.key === 'problem' && (pb.contentItems || pb.examQuestions)) {
        tip += ' (콘텐츠 문항 ' + (pb.contentItems || 0) + '개, 평가 문항 ' + (pb.examQuestions || 0) + '개)';
      }
      barsHtml += '<div class="subject-item" title="' + escapeHtml(tip) + '">' +
        '<span class="subject-name" style="flex:0 0 84px;">' + m.label + '</span>' +
        '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + w + '%;background:' + m.c + '"></div></div>' +
        '<span class="subject-value">' + (v != null ? v + '%' : '-') + '</span></div>';
    });

    let insight;
    if (score >= 70) insight = '탄탄한 정답률을 보이고 있습니다. 오늘의 학습·진단평가·문항 풀이·평가 정답률을 종합한 결과입니다.';
    else if (score >= 40) insight = '성장 중인 상태입니다. 꾸준한 학습으로 정답률을 더 높일 수 있어요.';
    else insight = '보충 학습을 권장합니다. AI 맞춤학습에서 약점 영역을 채워보세요.';

    // 블록 E — 최근 응시 기록 (learningCapacity 활용)
    const lc = report.learningCapacity || [];
    const assessTypes = ['exam_complete','diagnosis_complete','problem_set_complete','daily_complete'];
    const recent = lc.filter(l => assessTypes.indexOf(l.activity_type) >= 0 && (l.cnt||0) > 0)
                     .sort((a,b) => (b.cnt||0) - (a.cnt||0))
                     .slice(0, 5);
    let recentHtml;
    if (recent.length === 0) {
      recentHtml = '<div class="domain-flow-empty">아직 응시 기록이 없습니다.</div>';
    } else {
      const typeIcon = { exam_complete: '🎓', diagnosis_complete: '🔎', problem_set_complete: '✏️', daily_complete: '📋' };
      recentHtml = '<div class="domain-flow-list">' + recent.map(l => {
        const ico = typeIcon[l.activity_type] || '📝';
        const lbl = toKoActivityType(l.activity_type) || '활동';
        const avg = l.avg_score != null ? Math.round(l.avg_score * 100) + '점' : '-';
        return '<div class="domain-flow-row">' +
          '<div class="domain-flow-row-icon">' + ico + '</div>' +
          '<div class="domain-flow-row-body">' +
            '<div class="domain-flow-row-head"><span class="domain-flow-row-label">' + escapeHtml(lbl) + '</span><span class="domain-flow-row-date">' + (l.cnt||0) + '회 · 평균 ' + avg + '</span></div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
    }

    // 블록 E 보강 — 콘텐츠 vs 시험 정답률 비교 막대 (problemBreakdown 활용)
    const cItems = pb.contentItems || 0;
    const cCorrect = pb.contentCorrect || 0;
    const eItems = pb.examQuestions || 0;
    const eCorrect = pb.examCorrect || 0;
    let breakdownHtml = '';
    if (cItems > 0 || eItems > 0) {
      const cPct = cItems > 0 ? Math.round(cCorrect / cItems * 100) : 0;
      const ePct = eItems > 0 ? Math.round(eCorrect / eItems * 100) : 0;
      breakdownHtml =
        '<div class="domain-flow" style="margin-top:12px;padding-top:12px;">' +
          '<div class="domain-flow-title">📚 정답률 출처별 구분</div>' +
          '<div class="achievement-breakdown">' +
            (cItems > 0 ?
              '<div class="ach-bd-row" title="채움콘텐츠 문항풀이·오답노트·AI 맞춤학습에서 스스로 푼 문항의 정답률입니다.">' +
                '<span class="ach-bd-label">자기주도 문항풀이</span>' +
                '<div class="ach-bd-bar"><div class="ach-bd-bar-fill" style="width:' + cPct + '%;background:#10b981;"></div></div>' +
                '<span class="ach-bd-meta"><strong>' + cPct + '%</strong> (' + cCorrect + '/' + cItems + ')</span>' +
              '</div>' : '') +
            (eItems > 0 ?
              '<div class="ach-bd-row" title="채움클래스에서 응시한 평가의 정답률입니다.">' +
                '<span class="ach-bd-label">채움클래스 평가</span>' +
                '<div class="ach-bd-bar"><div class="ach-bd-bar-fill" style="width:' + ePct + '%;background:#8b5cf6;"></div></div>' +
                '<span class="ach-bd-meta"><strong>' + ePct + '%</strong> (' + eCorrect + '/' + eItems + ')</span>' +
              '</div>' : '') +
          '</div>' +
        '</div>';
    }

        }) +

        '</div>' +

      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📝 최근 응시 기록 (' + recent.length + '건)</div>' +

    });

    const subMetrics = [
      { label: '저장',  v: saved,  c: '#2563eb',
        tip: '채움콘텐츠에서 "나의 보관함"에 저장한 콘텐츠 수입니다.' },
      { label: '조회',  v: viewed, c: '#10b981',
        tip: '내가 채움콘텐츠/수업을 조회(재생)한 총 횟수입니다.' },
      { label: '좋아요', v: likes,  c: '#ec4899',
        tip: '내가 채움콘텐츠에 누른 좋아요 총 개수입니다.' },
      { label: '구독',  v: subs,   c: '#8b5cf6',
        tip: '내가 구독 중인 채널/큐레이션 수입니다.' }

      subMetrics.forEach(m => {

          '<span class="subject-name" style="flex:0 0 64px;">' + m.label + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:0%;background:var(--gray-300)"></div></div>' +
          '<span class="subject-value" style="color:var(--gray-400);">0건</span></div>';
      });

        '<div class="domain-card-body">' +

            '<div class="subject-growth">' + barsEmpty + '</div>' +
          '</div>' +

        '<div class="domain-flow">' +
          '<div class="domain-flow-title">🔍 자주 검색한 키워드</div>' +

        '</div>' +

    // sub-metric 막대 (절대값 → 100 기준 정규화: 최대값을 100%로)
    const maxVal = Math.max(saved, viewed, likes, subs, 1);

      const w = Math.round((m.v / maxVal) * 100);

        '<span class="subject-value">' + m.v + '건</span></div>';

    else if (score >= 40) insight = '꾸준히 콘텐츠를 둘러보고 있어요. 더 다양한 콘텐츠를 탐색해 보세요.';
    else insight = '콘텐츠를 더 둘러보세요. 채움콘텐츠에서 관심 분야를 탐색할 수 있습니다.';

      { label: '🔔 구독', v: subs, tip: '구독 중인 채널/큐레이션 수' },
      { label: '🎨 포트폴리오', v: portfolioCount, tip: '나도예술가/포트폴리오에 등록한 작품 수' }

    const standards = (cu.achievementStandards || [])

      '<div class="domain-flow">' +
        '<div class="domain-flow-title">🔍 자주 검색한 키워드 (Top ' + Math.min(keywords.length, 8) + ')</div>' +

  function renderBasicAcademicsCard(report, areaData) {
    let diagnoses = report.academicFoundation || [];
    const hasData = diagnoses.length > 0;

    // 예시 데이터 (실제 기록이 없을 때 시연용으로 표시)
    if (!hasData) {
      diagnoses = [
        { target_node_id: '국어', correct_count: 16, total_questions: 20 },
        { target_node_id: '수학', correct_count: 13, total_questions: 20 },
        { target_node_id: '영어', correct_count: 14, total_questions: 20 },
        { target_node_id: '사회', correct_count: 17, total_questions: 20 },
        { target_node_id: '과학', correct_count: 12, total_questions: 20 }
      ];
    }

    let content = '';
    {
      // Group by target_node_id as subject proxy
      const subjectMap = {};
      diagnoses.forEach(d => {
        const key = d.target_node_id || '기타';
        if (!subjectMap[key]) subjectMap[key] = [];
        subjectMap[key].push(d);
      });

      const overallCorrect = diagnoses.reduce((s, d) => s + (d.correct_count || 0), 0);
      const overallTotal = diagnoses.reduce((s, d) => s + (d.total_questions || 0), 0);
      const overallPct = overallTotal > 0 ? Math.round(overallCorrect / overallTotal * 100) : 0;
      const reached = overallPct >= 60;

      let subjectsHtml = '';
      Object.entries(subjectMap).forEach(([subj, items]) => {
        const c = items.reduce((s, d) => s + (d.correct_count || 0), 0);
        const t = items.reduce((s, d) => s + (d.total_questions || 0), 0);
        const pct = t > 0 ? Math.round(c / t * 100) : 0;
        const statusClass = pct >= 80 ? 'reached' : pct >= 60 ? 'warning' : 'not-reached';
        const statusText = pct >= 80 ? '도달' : pct >= 60 ? '주의' : '미달';
        subjectsHtml += '<div class="basic-subject-item">' +
          '<span class="basic-subject-name">' + escapeHtml(subj.length > 4 ? subj.substring(0, 4) : subj) + '</span>' +
          '<div class="basic-subject-bar"><div class="basic-subject-fill" style="width:' + pct + '%;"></div></div>' +
          '<span class="basic-subject-value">' + pct + '%</span>' +
          '<span class="basic-subject-status ' + statusClass + '">' + statusText + '</span></div>';
      });

      content = '<div class="basic-content">' +
        '<div class="basic-status">' +
          '<div class="status-badge ' + (reached ? 'reached' : 'not-reached') + '">' + (reached ? '도달' : '미달') + '</div>' +
          '<div class="status-description">기초학력 진단 결과,<br><strong>기초학력 ' + (reached ? '도달' : '미달') + '</strong> 수준입니다.</div>' +
        '</div>' +
        '<div class="basic-subjects">' + subjectsHtml + '</div>' +
      '</div>';
    }

    const sampleBadge = !hasData ? '<span class="sample-badge" title="현재 표시되는 데이터는 시연용 예시입니다.">예시 데이터</span>' : '';
    return '<div class="section-card">' +
      '<div class="section-header"><div class="section-title"><div class="section-icon basic">\uD83D\uDCCB</div> 기초학력 진단' +
      sampleBadge +
      '</div></div>' +
      content + '</div>';
  }

  function renderLearningCapacityCard(report, areaData) {
    const learningStats = report.learningCapacity || [];
    const hasData = learningStats.length > 0;
    const score = areaData ? areaData.score : 0;

    // 학습 활동 데이터 기반 5축 계산
    const totalCntAll = learningStats.reduce((s, l) => s + l.cnt, 0);
    const avgScoreAll = learningStats.length > 0
      ? learningStats.filter(l => l.avg_score != null).reduce((s, l) => s + (l.avg_score || 0), 0) / Math.max(1, learningStats.filter(l => l.avg_score != null).length) * 100
      : 0;
    const typeVariety = Math.min(100, learningStats.length * 15); // 활동 유형 다양성
    const axes = {
      '학습충실도': Math.min(100, Math.round(totalCntAll > 0 ? Math.min(totalCntAll * 2, 100) : 0)),
      '학습전략': Math.min(100, Math.round(typeVariety)),
      '학습성취': Math.min(100, Math.round(avgScoreAll)),
      '학습집중': Math.min(100, Math.round(score * 0.9)),
      '학업자존감': Math.min(100, Math.round(score > 0 ? score * 0.85 + typeVariety * 0.15 : 0))
    };

    // Build subject usage bars from learningStats
    let subjectHtml = '';
    if (learningStats.length > 0) {
      const totalCnt = learningStats.reduce((s, l) => s + l.cnt, 0);
      const subjectColors = ['var(--primary)', 'var(--warning)', 'var(--danger)', 'var(--secondary)', 'var(--purple)'];
      learningStats.slice(0, 5).forEach((l, i) => {
        const pct = totalCnt > 0 ? Math.round(l.cnt / totalCnt * 100) : 0;
        const avgPct = l.avg_score != null ? Math.round(l.avg_score * 100) : 0;
        subjectHtml += '<div class="subject-item">' +
          '<span class="subject-name">' + escapeHtml(toKoActivityType(l.activity_type) || '기타') + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + pct + '%;background:' + subjectColors[i % subjectColors.length] + '"></div></div>' +
          '<span class="subject-value">' + pct + '%</span></div>';
      });
    }

    if (!hasData) {
      subjectHtml = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:8px;">활동 데이터가 부족합니다.</div>';
    }

    // Insight text
    let insightText = '';
    if (hasData) {
      const topActivity = [...learningStats].sort((a, b) => b.cnt - a.cnt)[0];
      insightText = '<strong>' + escapeHtml(toKoActivityType(topActivity.activity_type) || '학습') + '</strong> 활동이 가장 활발합니다. ';
      if (topActivity.avg_score != null) {
        insightText += '평균 점수 ' + Math.round(topActivity.avg_score * 100) + '%를 기록했습니다.';
      }
    } else {
      insightText = '아직 학습 활동 데이터가 충분하지 않습니다.';
    }

    // 데이터 기반 레이더 폴리곤 좌표 계산 (5축)
    // 중심 (50%, 50%), 반지름 50%. 각 축: top, right(72deg), bottom-right(144deg), bottom-left(216deg), left(288deg)
    const axisKeys = ['학습충실도', '학습전략', '학습성취', '학습집중', '학업자존감'];
    const angles = [-90, -18, 54, 126, 198]; // degrees, 시계방향 위→오→아래오→아래왼→왼
    const pts = axisKeys.map((k, i) => {
      const r = (axes[k] || 0) / 100 * 50; // % 반지름
      const rad = angles[i] * Math.PI / 180;
      const x = 50 + r * Math.cos(rad);
      const y = 50 + r * Math.sin(rad);
      return x.toFixed(1) + '% ' + y.toFixed(1) + '%';
    }).join(', ');
    const hasAxes = Object.values(axes).some(v => v > 0);
    const polygonStyle = hasAxes ? 'clip-path: polygon(' + pts + ');' : 'display:none;';

    let axisListHtml = '';
    axisKeys.forEach(k => {
      axisListHtml += '<div class="subject-item">' +
        '<span class="subject-name">' + k + '</span>' +
        '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + (axes[k] || 0) + '%;background:var(--primary);"></div></div>' +
        '<span class="subject-value">' + (axes[k] || 0) + '</span></div>';
    });

    return '<div class="section-card">' +
      '<div class="section-header"><div class="section-title"><div class="section-icon learning">\uD83D\uDCDA</div> 학습 역량</div></div>' +
      '<div class="learning-content">' +
        '<div class="radar-chart">' +
          '<div class="radar-placeholder">' +
            '<div class="radar-polygon" style="' + polygonStyle + '"></div>' +
            '<div class="radar-labels">' +
              '<span class="radar-label top">학습충실도 ' + (axes['학습충실도'] || 0) + '</span>' +
              '<span class="radar-label right">학습전략 ' + (axes['학습전략'] || 0) + '</span>' +
              '<span class="radar-label bottom-right">학습성취 ' + (axes['학습성취'] || 0) + '</span>' +
              '<span class="radar-label bottom-left">학습집중 ' + (axes['학습집중'] || 0) + '</span>' +
              '<span class="radar-label left">학업자존감 ' + (axes['학업자존감'] || 0) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="learning-details">' +
          '<div class="learning-insight">' + insightText + '</div>' +
          '<div class="subject-growth">' + subjectHtml + '</div>' +
        '</div>' +
      '</div></div>';
  }

  // ── 오늘의 학습 — 폼팩터 보조 함수 3종 ────────────────────────────
  // 로컬 시간대 기준 YYYY-MM-DD 포맷 (UTC 변환 회피)
  function fmtLocalDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  // A. 요일 캘린더 (N <= 14)
  function renderDailyCalendarA(n, completedSet) {
    const dayNames = ['일','월','화','수','목','금','토'];
    const today = new Date();
    let cells = '';
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const ds = fmtLocalDate(d);
      const lbl = dayNames[d.getDay()];
      const done = completedSet.has(ds);
      const tip = ds + ' (' + lbl + ') · ' + (done ? '완료' : '미완료');
      cells += '<div class="calendar-day ' + (done ? 'completed' : 'none') +
               '" data-tip="' + tip + '" aria-label="' + tip + '">' + lbl + '</div>';
    }
    return '<div class="calendar-days">' + cells + '</div>';
  }

  // B. 히트맵 (15 <= N <= 90)
  function renderDailyCalendarB(n, completedSet) {
    const dayNames = ['월','화','수','목','금','토','일'];
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(today); start.setDate(start.getDate() - (n - 1));
    // 시작일이 속한 주의 월요일 (월=0 ... 일=6)
    const startDow = (start.getDay() + 6) % 7;
    const gridStart = new Date(start); gridStart.setDate(gridStart.getDate() - startDow);
    const endDow = (today.getDay() + 6) % 7;
    const gridEnd = new Date(today); gridEnd.setDate(gridEnd.getDate() + (6 - endDow));
    const weeks = Math.round((gridEnd - gridStart) / 86400000 / 7) + 1;
    const wrapCls = 'heatmap-wrap weeks-' + (weeks <= 6 ? 5 : 13);
    // 주차열을 1fr 균등 분할 → 메인 컬럼 폭을 꽉 채움(우측 빈 공간 제거).
    // 셀 상한은 CSS .heatmap-cell { max-width:40px; aspect-ratio:1 }이 담당.
    let html = '<div class="' + wrapCls + '" style="grid-template-columns: 24px repeat(' + weeks + ', minmax(0, 1fr));">';
    // 첫 행: 왼쪽 빈칸 + 주차 라벨 (각 주 월요일 M/D)
    html += '<div></div>';
    for (let w = 0; w < weeks; w++) {
      const colMon = new Date(gridStart); colMon.setDate(colMon.getDate() + w * 7);
      html += '<div class="heatmap-col-label">' + (colMon.getMonth() + 1) + '/' + colMon.getDate() + '</div>';
    }
    // 7행 × weeks열
    for (let row = 0; row < 7; row++) {
      html += '<div class="heatmap-row-label">' + dayNames[row] + '</div>';
      for (let w = 0; w < weeks; w++) {
        const d = new Date(gridStart); d.setDate(d.getDate() + w * 7 + row);
        const ds = fmtLocalDate(d);
        const inRange = d >= start && d <= today;
        const isToday = d.getTime() === today.getTime();
        const done = completedSet.has(ds);
        let cls = 'heatmap-cell';
        if (!inRange) cls += ' out';
        else if (done) cls += ' done';
        if (isToday) cls += ' today';
        const tip = inRange ? ds + ' · ' + (done ? '완료' : '미완료') : '';
        const aria = inRange ? ' aria-label="' + tip + '"' : '';
        html += '<div class="' + cls + '"' + (tip ? ' data-tip="' + tip + '"' : '') + aria + '></div>';
      }
    }
    html += '</div>';

            '<span><span class="lg-dot lg-miss"></span>미완료</span></div>';

  // C. 주/월 요약 막대 (N >= 91 또는 all)
  function renderDailyCalendarC(n, completedSet, periodKey) {
    const today = new Date(); today.setHours(0,0,0,0);
    const buckets = [];
    let startStr = '';
    if (periodKey === 'all') {
      const dates = Array.from(completedSet).sort();
      if (!dates.length) {
        // 빈 데이터: 오늘이 속한 1개월 막대 fallback
        const y = today.getFullYear(), m = today.getMonth();
        const dim = new Date(y, m + 1, 0).getDate();
        buckets.push({ doneCnt: 0, totalCnt: dim, tip: y + '-' + String(m+1).padStart(2,'0') + ' · 완료 0/' + dim + '일' });
        startStr = fmtLocalDate(today);
      } else {
      let cur = new Date(dates[0] + 'T00:00:00');
      cur.setDate(1);
      startStr = dates[0];
      while (cur <= today) {
        const y = cur.getFullYear(), m = cur.getMonth();
        const dim = new Date(y, m + 1, 0).getDate();
        let doneCnt = 0;
        for (let i = 1; i <= dim; i++) {
          const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(i).padStart(2,'0');
          if (completedSet.has(ds)) doneCnt++;
        }
        buckets.push({
          doneCnt, totalCnt: dim,
          tip: y + '-' + String(m+1).padStart(2,'0') + ' · 완료 ' + doneCnt + '/' + dim + '일'
        });
        cur.setMonth(cur.getMonth() + 1);
      }
      } // end else (dates.length>0)
    } else {
      // 주별 (n일 → ceil(n/7) 막대)
      const start = new Date(today); start.setDate(start.getDate() - (n - 1));
      startStr = fmtLocalDate(start);
      const startDow = (start.getDay() + 6) % 7;
      const weekStart = new Date(start); weekStart.setDate(weekStart.getDate() - startDow);
      let cur = new Date(weekStart);
      while (cur <= today) {
        const wkEnd = new Date(cur); wkEnd.setDate(wkEnd.getDate() + 6);
        let doneCnt = 0, totalCnt = 0;
        for (let i = 0; i < 7; i++) {
          const d = new Date(cur); d.setDate(d.getDate() + i);
          if (d < start || d > today) continue;
          totalCnt++;
          const ds = fmtLocalDate(d);
          if (completedSet.has(ds)) doneCnt++;
        }
        buckets.push({
          doneCnt, totalCnt: totalCnt || 7,
          tip: fmtLocalDate(cur) + ' ~ ' + fmtLocalDate(wkEnd) + ' · 완료 ' + doneCnt + '/' + (totalCnt || 7) + '일'
        });
        cur.setDate(cur.getDate() + 7);
      }
    }
    let html = '<div class="weekbar-wrap">';
    let totalDone = 0, totalAll = 0;
    buckets.forEach(b => {
      const rate = b.totalCnt ? b.doneCnt / b.totalCnt : 0;
      const fillCls = rate >= 0.5 ? 'fill-high' : (rate > 0 ? 'fill-low' : '');
      // 막대 높이는 컨테이너(.weekbar-wrap) 높이 대비 비율(%). flex로 폭은 균등.
      const hPct = Math.max(6, Math.round(rate * 100));
      html += '<div class="weekbar-col"><div class="weekbar ' + fillCls + '" style="height:' + hPct + '%;" data-tip="' + b.tip + '" aria-label="' + b.tip + '"></div></div>';
      totalDone += b.doneCnt; totalAll += b.totalCnt;
    });
    html += '</div>';
    const endStr = fmtLocalDate(today);
    html += '<div class="weekbar-meta"><span>' + startStr + '</span><span>' + endStr + '</span></div>';
    const rate = totalAll ? Math.round(totalDone/totalAll*100) : 0;
    html += '<div class="weekbar-summary">완료 <strong>' + totalDone + '일</strong> / ' + totalAll + '일 (' + rate + '%)</div>';
    return html;
  }

  // 오늘의 학습 본문 (section-card 래퍼 제외 — 별도 섹션에서 헤더와 함께 사용)
  function renderDailyLearningBody(report) {
    const daily = report.dailyLearning || {};
    const total = daily.total || 0;
    const completed = daily.completed || 0;
    const rate = total > 0 ? Math.round(completed / total * 100) : 0;
    // 평균 정답률(서버에서 누적 정답수/총 문항수 기반 산출). 데이터 없으면 '-'
    const accuracy = (daily.avgAccuracy != null) ? daily.avgAccuracy : null;

    // 실제 데이터 기반 연속일
    const streak = daily.maxStreak || 0;
    const recentDays = daily.recentDays || [];

    // 기간 동기화 — currentPeriod.days: 7 | 30 | 90 | 180 | 'all'
    const periodDays = currentPeriod.days;
    const completedSet = new Set(recentDays);

    // (1) 라벨 — 기간 동적 표기
    let periodLabel;
    if (periodDays === 'all' || periodDays === null) {
      const sorted = recentDays.slice().sort();
      const todayStr = fmtLocalDate(new Date());
      periodLabel = sorted.length
        ? sorted[0] + ' ~ ' + todayStr + ' 학습 현황'
        : '전체 기간 학습 현황';
    } else {
      const dNum = parseInt(periodDays);
      if (dNum === 180) periodLabel = '최근 6개월 학습 현황';
      else periodLabel = '최근 ' + dNum + '일 학습 현황';
    }

    // (2) 폼팩터 결정
    let N;
    if (periodDays === 'all' || periodDays === null) {
      const sorted = recentDays.slice().sort();
      N = sorted.length
        ? Math.max(1, Math.ceil((Date.now() - new Date(sorted[0] + 'T00:00:00').getTime()) / 86400000) + 1)
        : 30;
    } else {
      N = parseInt(periodDays);
    }
    let calendarBody;
    const isAll = (periodDays === 'all' || periodDays === null);
    if (isAll) {
      // 전체 기간은 N과 무관하게 월별 막대(C형)
      calendarBody = renderDailyCalendarC(N, completedSet, 'all');
    } else if (N <= 14) {
      calendarBody = renderDailyCalendarA(N, completedSet);
    } else if (N <= 90) {
      calendarBody = renderDailyCalendarB(N, completedSet);
    } else {
      calendarBody = renderDailyCalendarC(N, completedSet, periodDays);
    }

    const insightText = total > 0
      ? '이번 기간 <strong>' + completed + '회</strong> 학습을 완료했습니다. 완료율은 <strong>' + rate + '%</strong>입니다.'
      : '아직 오늘의 학습 기록이 없습니다.';

    // 우측 사이드 패널 — 이번 기간 인사이트
    const sortedDates = (recentDays || []).slice().sort();
    const lastDate = sortedDates.length ? sortedDates[sortedDates.length - 1] : null;
    const firstDate = sortedDates.length ? sortedDates[0] : null;
    let sidePanelHtml;
    if (total === 0 && (recentDays || []).length === 0) {
      sidePanelHtml =
        '<div class="daily-side-panel">' +
          '<h4>📊 이번 기간 인사이트</h4>' +
          '<div class="empty-msg">아직 학습 기록이 없습니다.<br>오늘의 학습을 시작해 보세요.</div>' +
        '</div>';
    } else {
      sidePanelHtml =
        '<div class="daily-side-panel">' +
          '<h4>📊 이번 기간 인사이트</h4>' +
          '<div class="insight-row' + (streak === 0 ? ' is-zero' : '') + '" title="기간 내 최대 연속 학습일">' +
            '<span class="ir-label">🔥 최대 연속</span>' +
            '<strong>' + (streak > 0 ? streak + '일' : '—') + '</strong>' +
          '</div>' +
          '<div class="insight-row' + (accuracy == null ? ' is-zero' : '') + '" title="기간 내 오늘의 학습 평균 정답률">' +
            '<span class="ir-label">🎯 평균 정답률</span>' +
            '<strong>' + (accuracy != null ? accuracy + '%' : '—') + '</strong>' +
          '</div>' +
          '<div class="insight-row-stack" title="배정 대비 완료한 비율">' +
            '<div class="irs-head">' +
              '<span class="ir-label">✅ 완료율</span>' +
              '<strong>' + rate + '%</strong>' +
            '</div>' +
            '<div class="insight-bar"><div class="insight-bar-fill" style="width:' + Math.min(100, rate) + '%;"></div></div>' +
            '<span style="font-size:12px;color:var(--gray-500);">' + completed + ' / ' + total + '회</span>' +
          '</div>' +
          (lastDate ?
            '<div class="insight-row" title="최근 학습한 날짜">' +
              '<span class="ir-label">📅 최근 학습</span>' +
              '<strong style="font-size:14px;">' + escapeHtml(lastDate) + '</strong>' +
            '</div>' : '') +
          (firstDate && firstDate !== lastDate ?
            '<div class="insight-row" title="기간 내 첫 학습 시작일">' +
              '<span class="ir-label">⏱️ 시작일</span>' +
              '<strong style="font-size:14px;">' + escapeHtml(firstDate) + '</strong>' +
            '</div>' : '') +
          '<div class="insight-row" title="기간 내 학습한 날짜 수">' +
            '<span class="ir-label">📈 학습일 수</span>' +
            '<strong>' + sortedDates.length + '일</strong>' +
          '</div>' +
        '</div>';
    }

    return '<div class="daily-content-grid">' +
        '<div class="daily-stats">' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + completed + '<span class="daily-stat-unit">회</span></div><div class="daily-stat-label">총 활동횟수</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + (accuracy != null ? accuracy : '-') + '<span class="daily-stat-unit">' + (accuracy != null ? '%' : '') + '</span></div><div class="daily-stat-label">평균 정답률</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + rate + '<span class="daily-stat-unit">%</span></div><div class="daily-stat-label">완료율</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + streak + '<span class="daily-stat-unit">일</span></div><div class="daily-stat-label">최대 연속일</div></div>' +
        '</div>' +
        '<div class="daily-details">' +
          '<div class="daily-insight">' + insightText + '</div>' +
          '<div class="daily-calendar">' +
            '<div class="calendar-label">' + periodLabel + '</div>' +
            calendarBody +
          '</div>' +
        '</div>' +
        sidePanelHtml +
      '</div>';
  }

      const stars = '&#9733;'.repeat(l.rating || 0) + '&#9734;'.repeat(5 - (l.rating || 0));
      return '<div class="reading-card">' +
        '<h4><i class="fas fa-book" style="color:var(--warning)"></i> ' + escapeHtml(l.bookTitle || l.book_title || '') + '</h4>' +
        '<div class="meta">' + escapeHtml(l.author || l.bookAuthor || '') + ' &middot; ' + formatDate(l.readDate || l.read_date || l.created_at) + '</div>' +
        '<div class="star-rating">' + stars + '</div>' +
        (l.review || l.content ? '<div class="review">' + escapeHtml(l.review || l.content) + '</div>' : '') +
      '</div>';
    }).join('');
  }

  // Reading form toggle
  document.getElementById('toggleReadingForm').addEventListener('click', () => {
    const form = document.getElementById('readingForm');
    form.classList.toggle('open');
    if (form.classList.contains('open') && !document.getElementById('readDate').value) {
      document.getElementById('readDate').value = new Date().toISOString().split('T')[0];
    }
  });
  document.getElementById('cancelReadingBtn').addEventListener('click', () => {
    document.getElementById('readingForm').classList.remove('open');
  });

  document.getElementById('submitReadingBtn').addEventListener('click', async () => {
    const bookTitle = document.getElementById('bookTitle').value.trim();
    const author = document.getElementById('bookAuthor').value.trim();
    const readDate = document.getElementById('readDate').value;
    const rating = parseInt(document.getElementById('bookRating').value);
    const review = document.getElementById('bookReview').value.trim();
    if (!bookTitle) { alert('책 제목을 입력하세요.'); return; }
    try {
      const res = await fetchWithAuth('/api/growth/reading', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookTitle, author, readDate, rating, review })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('readingForm').classList.remove('open');
        ['bookTitle','bookAuthor','bookReview'].forEach(id => document.getElementById(id).value = '');
        loadReadingLogs();
      } else { alert(data.message || '저장에 실패했습니다.'); }
    } catch (err) { alert('서버 오류가 발생했습니다.'); }
  });

  // ---- Observations ----
  async function loadObservations() {
    // 교사/관리자에게만 입력 폼을 노출하고, 안내문도 역할에 맞게 조정
    const obsForm = document.getElementById('obsForm');
    const obsNote = document.getElementById('obsSourceNote');
    if (obsForm) obsForm.style.display = isTeacher ? 'block' : 'none';
    if (obsNote) {
      obsNote.textContent = isTeacher
        ? '교사가 이 화면에서 직접 남긴 관찰 기록입니다. 아래 입력란에서 추가할 수 있어요.'
        : '담임·교과 교사가 이 화면에서 직접 남긴 관찰 기록입니다.';
    }
    try {
      const res = await fetchWithAuth('/api/growth/report/observations/' + targetStudentId);
      const data = await res.json();
      allObservations = data.observations || [];
      renderObservations(allObservations);
    } catch (err) {
      document.getElementById('obsTimeline').innerHTML = '<div class="empty-state"><p>관찰 기록을 불러올 수 없습니다.</p></div>';
    }
  }

  // 관찰 기록 저장 (교사) — POST /api/growth/report/observation
  async function submitObservation() {
    const areaEl = document.getElementById('obsArea');
    const textEl = document.getElementById('obsText');
    const text = (textEl.value || '').trim();
    if (!text) { alert('관찰 내용을 입력해 주세요.'); textEl.focus(); return; }
    const classId = new URLSearchParams(location.search).get('classId') || (currentReportData && currentReportData.classId) || null;
    try {
      const res = await fetchWithAuth('/api/growth/report/observation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: targetStudentId,
          classId: classId ? parseInt(classId) : null,
          text: text,
          area: areaEl.value
        })
      });
      const data = await res.json();
      if (res.ok && data.success !== false) {
        textEl.value = '';
        await loadObservations();
      } else {
        alert(data.message || '관찰 기록 저장에 실패했습니다.');
      }
    } catch (err) { alert('서버 오류가 발생했습니다.'); }
  }

  function renderObservations(observations) {
    const timeline = document.getElementById('obsTimeline');
    // Filter by active tag
    let filtered = observations;
    if (activeObsTag !== 'all') {
      filtered = observations.filter(o => {
        const area = (o.area || '').toLowerCase();
        const tags = o.tags || '';
        return area.includes(activeObsTag.toLowerCase()) || tags.toLowerCase().includes(activeObsTag.toLowerCase());
      });
    }

    if (!filtered.length) {
      const emptyMsg = activeObsTag !== 'all'
        ? '"' + activeObsTag + '" 카테고리의 관찰 기록이 없습니다.'
        : (isTeacher ? '아직 관찰 기록이 없습니다. 학생을 관찰한 내용을 남겨보세요.' : '아직 관찰 기록이 없습니다.');
      timeline.innerHTML = '<div class="empty-state" style="padding:20px;"><i class="fas fa-clipboard-list"></i><p>' +
        emptyMsg + '</p></div>';
      return;
    }
    timeline.innerHTML = filtered.map(o => {
      const areaInfo = AREAS.find(a => a.key === o.area) || AREAS[0];
      return '<div class="obs-item">' +
        '<div class="obs-dot" style="background:' + areaInfo.color + '"></div>' +
        '<div class="obs-content">' +
          '<div class="obs-text">' + escapeHtml(o.content) + '</div>' +
          '<div class="obs-meta">' +
            '<span style="color:' + areaInfo.color + ';font-weight:600;">' + (o.area || '') + '</span>' +
            ' &middot; ' + (o.teacherName || o.teacher_name || '교사') +
            ' &middot; ' + formatDate(o.created_at || o.createdAt || o.observation_date) +
          '</div>' +
        '</div></div>';
    }).join('');
  }

  // Observation tag filter
  document.getElementById('obsTagFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('.note-tag');
    if (!btn) return;
    document.querySelectorAll('#obsTagFilter .note-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeObsTag = btn.dataset.tag;
    renderObservations(allObservations);
  });

  // 관찰 기록 저장 버튼
  const submitObsBtn = document.getElementById('submitObsBtn');
  if (submitObsBtn) submitObsBtn.addEventListener('click', submitObservation);

  // ---- PDF 저장 / 인쇄 ----
  // PDF 저장: 외부 라이브러리 없이 브라우저 인쇄 대화상자에서 "PDF로 저장"을 안내한 뒤 print 호출
  function saveAsPdf() {
    showToast('인쇄 대화상자에서 “대상”을 “PDF로 저장”으로 선택하면 PDF 파일로 저장됩니다.');
    setTimeout(function(){ window.print(); }, 600);
  }
  function showToast(msg) {
    let t = document.getElementById('reportToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'reportToast';
      t.className = 'report-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
  const savePdfBtn = document.getElementById('savePdfBtn');
  if (savePdfBtn) savePdfBtn.addEventListener('click', saveAsPdf);
  const printBtn = document.getElementById('printBtn');
  if (printBtn) printBtn.addEventListener('click', function(){ window.print(); });

  // ---- Utilities ----
  function showError(msg) {
    document.querySelector('#individualReportArea .report-container').innerHTML =
      '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>' + msg + '</p></div>';
  }

  function escapeHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    // textContent/innerHTML은 따옴표를 인코딩하지 않으므로 속성 컨텍스트 안전을 위해 추가 변환
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }
})();
</script>
</body>
</html>
