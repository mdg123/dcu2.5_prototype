<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다채움 - 학생 성장 리포트</title>
  <link rel="stylesheet" href="/css/common-nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #2563eb; --primary-light: #dbeafe; --primary-dark: #1d4ed8;
      --secondary: #10b981; --secondary-light: #d1fae5;
      --warning: #f59e0b; --warning-light: #fef3c7;
      --danger: #ef4444; --danger-light: #fee2e2;
      --purple: #8b5cf6; --purple-light: #ede9fe;
      --pink: #ec4899; --pink-light: #fce7f3;
      --cyan: #06b6d4; --cyan-light: #cffafe;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb; --gray-300: #d1d5db;
      --gray-400: #9ca3af; --gray-500: #6b7280; --gray-600: #4b5563; --gray-700: #374151; --gray-800: #1f2937; --gray-900: #111827;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.08); --shadow-md: 0 4px 6px -1px rgba(0,0,0,.1);
      --radius-md: 10px; --radius-lg: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR','Pretendard',system-ui,sans-serif; background: var(--gray-100); color: var(--gray-800); line-height: 1.6; }

    .app-layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar { width: 220px; background: #fff; border-right: 1px solid var(--gray-200); padding: 20px 0; flex-shrink: 0; }
    .sidebar-title { padding: 0 20px 16px; font-size: 15px; font-weight: 700; color: var(--gray-800); display: flex; align-items: center; gap: 8px; }
    .sidebar-menu { list-style: none; }
    .sidebar-menu li { padding: 10px 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--gray-600); transition: all .15s; }
    .sidebar-menu li:hover { background: var(--gray-50); }
    .sidebar-menu li.active { background: var(--primary-light); color: var(--primary); font-weight: 600; border-right: 3px solid var(--primary); }
    .sidebar-menu li i { width: 18px; text-align: center; }
    .sidebar-menu li a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px; width: 100%; }
    .main-content { flex: 1; padding: 24px; overflow-x: hidden; }
    /* 통일 — 다른 페이지와 동일 표준 폭 (--page-max-w 기준) */
    .report-container { max-width: var(--page-max-w, 1800px); margin: 0 auto; }

    /* 공통 카드 — 모든 .section-card 의 흰 배경/라운드/그림자 base */
    .section-card {
      background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; color: var(--gray-800); }
    .section-link { font-size: 14px; font-weight: 600; color: var(--primary); text-decoration: none; }

    /* ===== 조회 기간 필터 ===== */
    .period-filter-card {
      background: white; border-radius: 16px; padding: 16px 20px; margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
    }
    .period-filter-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: var(--gray-700); margin-bottom: 12px; }
    .period-filter-label i { color: var(--primary); }
    .period-helper { color: var(--gray-400); cursor: help; font-size: 13px; }
    .period-chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .period-chip {
      padding: 8px 16px; border: 1.5px solid var(--gray-300); background: #fff;
      border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--gray-600);
      cursor: pointer; font-family: inherit; transition: all .15s; white-space: nowrap;
    }
    .period-chip:hover { background: var(--gray-50); border-color: var(--primary); color: var(--primary); }
    .period-chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
    .period-range { font-size: 14px; color: var(--gray-500); font-family: 'Courier New', monospace; margin-top: 12px; }
    @media (max-width: 768px) {
      .period-range { width: 100%; }
    }

    /* ===== 6카드 통일 — 도메인 카드 공통 스타일 ===== */
    .domain-card-body { display: flex; gap: 20px; align-items: flex-start; }
    .domain-donut-wrap { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; }
    .domain-donut {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; position: relative;
    }
    .domain-donut-inner {
      width: 86px; height: 86px; background: #fff; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .domain-donut-value { font-size: 26px; font-weight: 800; line-height: 1; color: var(--gray-800); }
    .domain-donut-value span { font-size: 14px; font-weight: 600; color: var(--gray-400); margin-left: 1px; }
    .domain-donut-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
    .domain-donut.is-empty { background: var(--gray-200) !important; }
    .domain-donut.is-sample { opacity: 0.85; }

    .domain-details { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    /* 빈/짧은 카드(진로·독서 데이터 없음) — 안내문을 도넛 높이에 맞춰 수직 중앙 정렬해 흰 공백 완화 */
    .domain-details-empty { justify-content: center; min-height: 120px; }
    .domain-insight {
      background: var(--gray-50); border-radius: 12px; padding: 12px 16px;
      font-size: 14px; line-height: 1.6; color: var(--gray-700); border-left: 3px solid var(--primary);
    }
    .domain-insight.emotion { border-left-color: var(--secondary); }
    .domain-insight.participation { border-left-color: var(--primary); }
    .domain-insight.achievement { border-left-color: var(--purple); }
    .domain-insight.career { border-left-color: var(--cyan); }
    .domain-insight.reading { border-left-color: var(--warning); }
    .domain-insight.content { border-left-color: var(--secondary); }

    /* sub-metric 막대 (참여도/성취수준) */
    .subject-growth { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
    .subject-item { display: flex; align-items: center; gap: 10px; }
    .subject-name { flex: 0 0 96px; font-size: 14px; color: var(--gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .subject-bar { flex: 1 1 auto; height: 10px; background: var(--gray-200); border-radius: 6px; overflow: hidden; }
    .subject-bar-fill, .subject-fill { height: 100%; background: var(--primary); border-radius: 6px; transition: width .4s; }
    .subject-value { flex: 0 0 48px; text-align: right; font-size: 14px; font-weight: 700; color: var(--gray-700); }
    .subject-value-note { margin-top: 8px; font-size: 13px; color: var(--gray-500); line-height: 1.5; }
    .subject-value-note strong { color: var(--gray-700); font-weight: 700; }
    .subject-status { flex: 0 0 auto; font-size: 13px; }
    .score-cell { font-weight: 700; }

    /* 칩 (콘텐츠 활용 키워드/성취기준 등) */
    .domain-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .domain-chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 14px; font-size: 13px;
      background: var(--gray-100); color: var(--gray-600);
    }
    .domain-chip-cnt { font-weight: 700; color: var(--primary); }

    /* 세부 흐름 리스트 */
    .domain-flow-title { font-size: 14px; font-weight: 700; color: var(--gray-700); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .domain-flow-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--gray-50); border-radius: 8px; }
    .domain-flow-row-icon { flex: 0 0 auto; font-size: 16px; }
    .domain-flow-row-body { flex: 1 1 auto; min-width: 0; }
    .domain-flow-row-head { display: flex; align-items: center; gap: 6px; }
    .domain-flow-row-label { font-size: 13px; font-weight: 600; color: var(--gray-800); }
    .domain-flow-row-badge { font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--warning-light); color: #92400e; }
    .domain-flow-row-date { margin-left: auto; font-size: 13px; color: var(--gray-400); }
    .domain-flow-row-desc { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
    .domain-flow-more { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--primary); text-decoration: none; }
    .domain-flow-more a { color: var(--primary); text-decoration: none; }
    .domain-action-link { font-size: 14px; font-weight: 600; color: var(--primary); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
    .domain-action-link.is-external { color: var(--gray-400); cursor: default; }

    /* Student Profile Header - prototype style */
    .student-header {
      background: white; border-radius: 16px; padding: 24px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: var(--shadow-sm);
    }
    .student-info { display: flex; align-items: center; gap: 20px; }
    .student-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-light), var(--purple-light));
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; font-weight: 700; color: var(--primary);
    }
    .student-details h1, .student-details h2 { font-size: 22px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
    .student-meta-text { color: var(--gray-500); font-size: 14px; }
    .header-right { display: flex; align-items: center; gap: 16px; }

    /* Visibility toggle */
    .toggle-wrap { display: flex; align-items: center; gap: 10px; }
    .toggle-switch { position: relative; width: 44px; height: 24px; }
    .toggle-switch input { display: none; }
    .toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: var(--gray-300); border-radius: 12px; transition: .3s; }
    .toggle-slider::before { content: ''; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
    .toggle-switch input:checked + .toggle-slider { background: var(--primary); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(20px); }
    .toggle-label { font-size: 13px; color: var(--gray-600); }

    /* AI Growth Summary Banner */
    .growth-summary {
      background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
      border-radius: 16px; padding: 28px; margin-bottom: 24px;
      color: white; position: relative; overflow: hidden;
    }
    .growth-summary::before {
      content: ''; position: absolute; top: -50%; right: -20%;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
      border-radius: 50%;
    }
    .growth-summary-title {
      font-size: 14px; font-weight: 500; opacity: 0.9;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .growth-summary-content {
      font-size: 20px; font-weight: 600; line-height: 1.5;
      position: relative; z-index: 1;
    }
    .highlight-tag {
      display: inline-block; background: rgba(255,255,255,0.2);
      padding: 2px 10px; border-radius: 20px; font-size: 14px;
      margin: 4px 4px 4px 0;
    }

    /* 2-column Report Grid — 행 외곽 높이 일치(stretch) + 짧은 카드 내부 공백 흡수 */
    .report-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 28px;
      align-items: stretch; grid-auto-rows: 1fr;   /* 모든 행 높이 동일 → 6 카드 전부 같은 높이 */
    }
    .report-grid > .section-card {
      margin-bottom: 0;
      display: flex; flex-direction: column;   /* 카드 세로 흐름 — 늘어난 슬랙을 flow가 흡수 */
      min-height: 480px;                        /* 안전망 */
    }
    /* 헤더/도넛/인사이트 등은 고정, domain-flow가 남는 높이를 흡수 */
    .report-grid > .section-card .domain-flow {
      flex: 1 1 auto; margin-top: 8px;
      display: flex; flex-direction: column; gap: 10px;
    }
    /* 빈 flow는 안내문을 카드 중앙에 배치하며 남는 공백을 흡수(흰 void 방지) */
    .report-grid > .section-card .domain-flow .domain-flow-empty {
      flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
      min-height: 80px; color: var(--gray-400); text-align: center;
    }
    /* 리스트가 있는 flow도 남는 높이를 차지하도록 */
    .report-grid > .section-card .domain-flow .domain-flow-list {
      flex: 1 1 auto;
    }
    /* 안전망: 혹시 비어있는 리스트가 남으면 안내 문구를 중앙에 채워 흰 공백 방지 */
    .report-grid > .section-card .domain-flow .domain-flow-list:empty {
      display: flex; align-items: center; justify-content: center; min-height: 80px;
    }
    .report-grid > .section-card .domain-flow .domain-flow-list:empty::after {
      content: "아직 표시할 활동이 없습니다."; color: var(--gray-400); font-size: 14px;
    }
    /* 친절한 빈 상태 placeholder — 아이콘 + 제목 + 안내 + 다음 행동 (흰 void 채움) */
    .domain-empty-rich {
      flex: 1 1 auto; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 8px; padding: 20px 16px; min-height: 120px; color: var(--gray-500);
    }
    .domain-empty-rich .der-icon { font-size: 40px; opacity: 0.45; line-height: 1; }
    .domain-empty-rich .der-title { font-size: 15px; font-weight: 700; color: var(--gray-600); }
    .domain-empty-rich .der-text { font-size: 14px; line-height: 1.6; color: var(--gray-500); max-width: 300px; }
    .domain-empty-rich .der-hint {
      margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--primary);
      background: var(--primary-light); padding: 6px 14px; border-radius: 999px;
    }
    /* 0건 빈상태 박스형 변형 — 보강카드(domain-flow-boost)와 동일한 점선 테두리+gray-50으로 통일.
       stretch 시에도 채워진 영역으로 읽혀 제목/CTA 위·아래 흰 void 제거. */
    .report-grid > .section-card .domain-empty-rich.domain-empty-rich--boxed {
      flex: 1 1 0; margin-top: 0; min-height: 64px;
      border: 1px dashed var(--gray-200); border-radius: 10px;
      background: var(--gray-50);
    }
    @media (max-width: 1024px) {
      .report-grid > .section-card .domain-empty-rich.domain-empty-rich--boxed { flex: 0 0 auto; min-height: 0; }
    }
    /* 보강 카드 — 토글 없는 짧은 카드 리스트 하단에 붙여 흰 void 흡수 (스펙 §4.2 규칙2) */
    /* flex-basis:0 → 자연(미신축) 높이 기여 최소화: 이미 꽉 찬 카드의 그리드 높이를 부풀리지 않음 */
    .report-grid > .section-card .domain-flow .domain-flow-list.has-boost { flex: 0 0 auto; }
    /* 보강 박스 없는 막대 리스트(참여 Top) — flow 잔여 높이를 차지하되 행은 세로 가운데
       배치해 남는 슬랙을 위·아래로 균등 분산(행간 8px 고정, 한 곳 큰 void 방지) */
    .report-grid > .section-card .domain-flow .domain-flow-list.activity-type-bars--fill {
      flex: 1 1 auto; justify-content: center;
    }
    .report-grid > .section-card .domain-flow-boost {
      flex: 1 1 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      gap: 6px; margin-top: 8px; padding: 14px 16px; min-height: 64px;
      border: 1px dashed var(--gray-200); border-radius: 10px;
      background: var(--gray-50); color: var(--gray-500);
    }
    .report-grid > .section-card .domain-flow-boost .dfb-icon { font-size: 26px; opacity: 0.5; line-height: 1; }
    .report-grid > .section-card .domain-flow-boost .dfb-title { font-size: 15px; font-weight: 700; color: var(--gray-600); }
    .report-grid > .section-card .domain-flow-boost .dfb-text { font-size: 14px; line-height: 1.45; color: var(--gray-500); max-width: 360px; }
    .report-grid > .section-card .domain-flow-boost .dfb-hint {
      margin-top: 2px; font-size: 13px; font-weight: 600; color: var(--primary);
      background: var(--primary-light); padding: 6px 14px; border-radius: 999px;
    }
    @media (max-width: 1024px) {
      /* 1열 모드: 카드가 늘어나지 않으므로 보강 카드는 자연 높이로 (거대 공백 방지) */
      .report-grid > .section-card .domain-flow-boost { flex: 0 0 auto; min-height: 0; }
      .report-grid > .section-card .domain-flow .domain-flow-list.has-boost { flex: 0 0 auto; }
    }
    /* ===== 6카드 공통 표준 리스트 행 (스펙 §2) — 행간·골격·폰트 통일 ===== */
    /* 리스트 컨테이너: 모든 목록을 flex column + 동일 행간으로 강제 */
    .report-grid > .section-card .domain-flow-list,
    .report-grid > .section-card .activity-type-bars {
      display: flex; flex-direction: column; gap: 8px;   /* ★ 행간 통일: 0px·60px → 전부 8px */
      margin-top: 0; justify-content: flex-start;          /* ★ space-between 제거(60px 늘임 금지) */
    }
    /* 표준 행 골격 — domain-flow-row · atb-row 공통 */
    .report-grid > .section-card .domain-flow-row,
    .report-grid > .section-card .atb-row {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; min-height: 44px;
      background: var(--gray-50); border-radius: 8px; line-height: 1.4;
    }
    /* 아이콘 */
    .report-grid > .section-card .domain-flow-row-icon,
    .report-grid > .section-card .atb-row .atb-icon {
      flex: 0 0 auto; font-size: 18px; width: 22px; text-align: center;
    }
    /* 라벨(주제목) */
    .report-grid > .section-card .domain-flow-row-label,
    .report-grid > .section-card .atb-row .atb-label {
      font-size: 15px; font-weight: 600; color: var(--gray-800);
    }
    /* 우측 수치/날짜(메타) */
    .report-grid > .section-card .domain-flow-row-date,
    .report-grid > .section-card .atb-row .atb-val {
      margin-left: auto; flex: 0 0 auto; font-size: 14px; font-weight: 600;
      color: var(--gray-500); white-space: nowrap;
    }
    /* 보조 설명(2줄째: 사유/저자/유형) — 1줄 클램프로 행 높이 균일 */
    .report-grid > .section-card .domain-flow-row-desc {
      font-size: 13px; color: var(--gray-500); margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    /* 참여 Top5 — 표준 행 안에 막대 트랙을 본문으로 배치 */
    .report-grid > .section-card .atb-row .atb-body { flex: 1 1 auto; min-width: 0; }
    .report-grid > .section-card .atb-row .atb-track {
      height: 8px; background: var(--gray-200); border-radius: 5px; overflow: hidden; margin-top: 6px;
    }
    .report-grid > .section-card .atb-row .atb-fill { height: 100%; background: var(--primary); border-radius: 5px; }
    /* 표준 행 hover */
    .report-grid > .section-card .domain-flow-row:hover,
    .report-grid > .section-card .atb-row:hover { background: var(--gray-100); transition: background .15s; }

    /* ===== 공통 목록 토글 (스펙 §3.2) — 정서·독서 등 6건↑ 카드 공용 ===== */
    .report-grid > .section-card .report-list-toggle {
      align-self: flex-start; margin-top: 4px; padding: 7px 16px;
      background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 18px;
      font-size: 14px; font-weight: 600; color: var(--primary); cursor: pointer;
      font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
    }
    .report-grid > .section-card .report-list-toggle:hover { background: var(--primary-light); border-color: var(--primary); }
    .report-grid > .section-card .report-list-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .report-grid > .section-card .report-list-toggle i { font-size: 12px; }

    /* ===== 공통 보조지표 타일줄 (스펙 §4.1) — 콘텐츠 cu-stats-grid 리듬 이식 ===== */
    .report-grid > .section-card .report-metric-tiles {
      display: grid; gap: 10px; margin: 12px 0 4px;
      grid-template-columns: repeat(var(--tile-n, 3), 1fr);
    }
    .report-grid > .section-card .report-metric-tile {
      padding: 12px 10px; border-radius: 10px; text-align: center; background: var(--gray-50);
      min-width: 0;
    }
    .report-grid > .section-card .report-metric-tile:hover { transform: translateY(-1px); transition: transform .15s; }
    .report-grid > .section-card .report-metric-tile.is-zero { opacity: .6; }
    .report-grid > .section-card .report-metric-tile .rmt-value { font-size: 20px; font-weight: 800; line-height: 1.1; }
    .report-grid > .section-card .report-metric-tile .rmt-label {
      font-size: 13px; color: var(--gray-500); margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    @media (max-width: 1024px) {
      .report-grid { grid-template-columns: 1fr; align-items: start; }
      .report-grid > .section-card { min-height: 0; }
      .report-grid > .section-card .domain-flow { flex: none; }
    }
    @media (max-width: 768px) {
      .heatmap-wrap { gap: 3px 4px; }
      .heatmap-col-label { font-size: 13px; }
      /* 스펙 §8 — 타일 2열, 도넛 96px (좁은 폭에서 body 줄바꿈·가로스크롤 방지) */
      .report-grid > .section-card .report-metric-tiles { grid-template-columns: repeat(2, 1fr) !important; }
      .report-grid > .section-card .domain-donut { width: 96px; height: 96px; }
      .report-grid > .section-card .domain-donut-inner { width: 68px; height: 68px; }
    }

    /* Reading activity */
    .reading-content { display: flex; gap: 24px; }
    .reading-stats { flex: 0 0 140px; text-align: center; }
    .reading-count { font-size: 48px; font-weight: 700; color: var(--secondary); line-height: 1; }
    .reading-count-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
    .reading-comparison { margin-top: 12px; padding: 8px 12px; background: var(--secondary-light); border-radius: 8px; font-size: 13px; color: var(--secondary); }
    .reading-details { flex: 1; }
    .reading-insight {
      background: var(--gray-50); border-radius: 12px; padding: 16px;
      margin-bottom: 16px; font-size: 14px; color: var(--gray-700);
      border-left: 3px solid var(--secondary);
    }
    .recent-books { display: flex; flex-direction: column; gap: 10px; }
    .book-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 12px; background: var(--gray-50); border-radius: 8px;
    }
    .book-cover {
      width: 36px; height: 48px;
      background: linear-gradient(135deg, var(--secondary-light), var(--primary-light));
      border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .book-info { flex: 1; }
    .book-title-text { font-size: 13px; font-weight: 500; color: var(--gray-800); }
    .book-meta { font-size: 13px; color: var(--gray-500); }

    /* Career exploration */
    .career-content { display: flex; gap: 24px; }
    .career-interests { flex: 1; }
    .career-insight {
      background: var(--gray-50); border-radius: 12px; padding: 16px;
      margin-bottom: 16px; font-size: 14px; color: var(--gray-700);
      border-left: 3px solid var(--purple);
    }
    .interest-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .interest-tag {
      padding: 6px 14px; background: var(--purple-light); color: var(--purple);
      border-radius: 20px; font-size: 13px; font-weight: 500;
    }
    .career-history { flex: 0 0 200px; }
    .history-title { font-size: 13px; font-weight: 600; color: var(--gray-600); margin-bottom: 12px; }
    .history-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--gray-100); }
    .history-item:last-child { border-bottom: none; }
    .history-date { font-size: 13px; color: var(--gray-400); flex: 0 0 58px; }
    .history-content-text { font-size: 13px; color: var(--gray-600); }

    /* "Service not provided" placeholder */
    .no-service {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 32px 16px; text-align: center; color: var(--gray-400);
    }
    .no-service i { font-size: 36px; color: var(--gray-300); }
    .no-service .no-service-title { font-size: 15px; font-weight: 600; color: var(--gray-500); }
    .no-service p { font-size: 13px; line-height: 1.6; max-width: 320px; }

    /* Content Usage Section */
    .content-usage-card {
      background: white; border-radius: 16px; padding: 24px;
      margin-bottom: 24px; box-shadow: var(--shadow-sm);
    }
    .content-usage-body {
      display: flex; flex-direction: column; gap: 20px;
    }
    .cu-stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
    }
    .cu-stat-item {
      padding: 16px 12px; border-radius: 12px; text-align: center;
      transition: transform 0.15s;
    }
    .cu-stat-item:hover { transform: translateY(-2px); }
    .cu-stat-value { font-size: 24px; font-weight: 700; }
    .cu-stat-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }
    .cu-tags-section { margin-top: 4px; }
    .cu-tags-title {
      font-size: 13px; font-weight: 600; color: var(--gray-600); margin-bottom: 10px;
    }
    .cu-tags-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .cu-tag {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 4px 10px; border-radius: 16px; font-size: 13px;
      background: var(--gray-100); color: var(--gray-600);
    }
    .cu-tag-cnt { font-weight: 600; color: var(--primary); }
    .usage-bar-fill { height: 100%; border-radius: 8px; transition: width 0.5s ease; }
    .usage-bar-value { flex: 0 0 40px; font-size: 13px; font-weight: 600; color: var(--gray-700); text-align: right; }
    .usage-summary-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .usage-summary-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--gray-50); border-radius: 12px; }
    .usage-summary-icon { font-size: 20px; }
    .usage-summary-info { flex: 1; }
    .usage-summary-value { font-size: 16px; font-weight: 700; color: var(--gray-800); }
    .usage-summary-label { font-size: 13px; color: var(--gray-500); }
    .usage-insight-area { grid-column: span 2; }
    .usage-insight {
      background: var(--gray-50); border-radius: 12px; padding: 16px;
      font-size: 14px; color: var(--gray-700); border-left: 3px solid var(--secondary);
    }
    .preparing-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 40px 20px; text-align: center; color: var(--gray-400);
    }
    .preparing-placeholder i { font-size: 32px; }

    /* Teacher Observations */
    .obs-source-note {
      font-size: 13px; color: var(--gray-500); line-height: 1.6;
      background: var(--gray-50); border-left: 3px solid var(--primary);
      border-radius: 8px; padding: 10px 14px; margin-bottom: 14px;
    }
    .obs-form {
      padding: 16px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md);
      background: var(--gray-50); margin-bottom: 16px;
    }
    .obs-form .form-row { grid-template-columns: 200px; }
    .obs-timeline { max-height: 400px; overflow-y: auto; }
    .obs-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--gray-100); }
    .obs-item:last-child { border-bottom: none; }
    .obs-dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .obs-content { flex: 1; }
    .obs-content .obs-text { font-size: 13px; color: var(--gray-700); margin-bottom: 4px; line-height: 1.5; }
    .obs-content .obs-meta { font-size: 13px; color: var(--gray-400); }
    .note-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .note-tag {
      padding: 4px 10px; background: var(--gray-100); color: var(--gray-500);
      border-radius: 12px; font-size: 13px; cursor: pointer; transition: all 0.2s; border: none;
    }
    .note-tag:hover { background: var(--primary-light); color: var(--primary); }
    .note-tag.active { background: var(--primary); color: white; }

    /* Reading log cards & form */
    .reading-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .reading-card { background: var(--gray-50); border-radius: var(--radius-md); padding: 14px; border: 1px solid var(--gray-200); }
    .reading-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .reading-card .meta { font-size: 13px; color: var(--gray-500); }
    .reading-card .review { font-size: 13px; color: var(--gray-600); margin-top: 6px; line-height: 1.5; }
    .star-rating { color: var(--warning); font-size: 13px; }
    .reading-form { display: none; padding: 16px; border: 1.5px solid var(--gray-200); border-radius: var(--radius-md); background: var(--gray-50); margin-bottom: 16px; }
    .reading-form.open { display: block; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { font-size: 13px; font-weight: 600; color: var(--gray-700); display: block; margin-bottom: 4px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px 12px; border: 1.5px solid var(--gray-300); border-radius: 8px; font-size: 13px; font-family: inherit; }
    .form-group textarea { min-height: 60px; resize: vertical; }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* Buttons */
    .btn { padding: 8px 16px; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-sm { padding: 6px 12px; font-size: 13px; }
    .btn-outline { background: #fff; color: var(--gray-700); border: 1.5px solid var(--gray-300); }
    .btn-outline:hover { background: var(--gray-50); }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--gray-400); }
    .empty-state i { font-size: 40px; margin-bottom: 10px; display: block; }

    /* Footer actions */
    .report-footer {
      display: flex; justify-content: center; gap: 16px;
      margin-top: 32px; padding-bottom: 40px;
    }
    .footer-btn {
      padding: 14px 28px; border-radius: 12px; font-size: 15px; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 8px; transition: all 0.2s;
      font-family: inherit;
    }
    .footer-btn.secondary { background: white; border: 1px solid var(--gray-300); color: var(--gray-700); }
    .footer-btn.secondary:hover { background: var(--gray-50); }
    .footer-btn.primary { background: var(--primary); border: 1px solid var(--primary); color: white; }
    .footer-btn.primary:hover { background: #1d4ed8; }

    /* Teacher class/student selector */
    .class-selector { background: #fff; border-radius: var(--radius-lg); padding: 20px 24px; margin-bottom: 20px; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 16px; }
    .class-selector label { font-size: 14px; font-weight: 600; color: var(--gray-700); white-space: nowrap; }
    .class-selector select { padding: 8px 14px; border: 1.5px solid var(--gray-300); border-radius: 8px; font-size: 14px; font-family: inherit; background: #fff; min-width: 240px; cursor: pointer; }
    .student-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .student-table th { text-align: left; padding: 12px 10px; border-bottom: 2px solid var(--gray-200); font-weight: 600; color: var(--gray-600); background: var(--gray-50); user-select: none; white-space: nowrap; }
    .student-table th.sortable { cursor: pointer; transition: background .15s; }
    .student-table th.sortable:hover { background: var(--gray-100); }
    .student-table th .sort-icon { margin-left: 4px; font-size: 13px; opacity: 0.3; transition: opacity .15s; }
    .student-table th.sort-active .sort-icon { opacity: 1; color: var(--primary); }
    .student-table td { padding: 12px 10px; border-bottom: 1px solid var(--gray-100); }
    .score-cell { text-align: center; border-radius: 4px; }
    .score-high { background: rgba(16,185,129,0.1); color: #059669; font-weight: 600; }
    .score-mid { background: rgba(59,130,246,0.08); }
    .score-low { background: rgba(245,158,11,0.1); color: #d97706; }
    .score-danger { background: rgba(239,68,68,0.08); color: #dc2626; }
    .student-table tr:hover { background: var(--gray-50); }

    /* Responsive */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }
      .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--gray-200); padding: 10px 0; }
      .sidebar-menu { display: flex; overflow-x: auto; }
      .sidebar-menu li { white-space: nowrap; }
      .main-content { padding: 16px; }
      .report-grid { grid-template-columns: 1fr; }
      .section-card.full-width { grid-column: span 1; }
      .emotion-summary, .learning-content, .reading-content, .career-content, .daily-content, .basic-content { flex-direction: column; }
      .emotion-chart, .radar-chart, .reading-stats, .career-history, .daily-stats, .basic-status { flex: none; margin: 0 auto; }
      .form-row { grid-template-columns: 1fr; }
      .reading-grid { grid-template-columns: 1fr; }
      .student-header { flex-direction: column; gap: 12px; text-align: center; }
      .cu-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .report-footer { flex-direction: column; align-items: center; }
    }

    /* Print — 인쇄/PDF 저장 공용 (외부 라이브러리 없이 print CSS만으로 정돈) */
    @media print {
      @page { margin: 12mm; }
      body { background: white; color: #000; }
      /* 공통 GNB·사이드바·기간칩·푸터버튼·관찰입력폼·태그필터·공유토글·토스트 숨김 */
      #dacheum-gnb-wrapper, .dacheum-gnb-wrapper,
      .sidebar, .header-right, .section-link, .report-footer,
      .note-tags, .period-filter-card, .obs-form, .class-selector,
      .emo-flow-toggle, .report-list-toggle, #backToListBtn, .report-toast,
      .domain-action-link, .reading-form {
        display: none !important;
      }
      .main-content, .page-shell { padding: 0 !important; max-width: 100% !important; }
      .report-container { max-width: 100% !important; }
      .page-header { padding-top: 0; }
      /* 카드: 그림자 제거 + 얇은 테두리 + 페이지 중간 분절 방지 */
      .section-card, .student-header, .growth-summary, .content-usage-card,
      .report-grid > .section-card {
        box-shadow: none !important; border: 1px solid #d1d5db !important;
        break-inside: avoid; page-break-inside: avoid; min-height: 0 !important;
      }
      .growth-summary { color: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .report-grid { grid-template-columns: repeat(2, 1fr); }
      /* 막대·도넛 색상 인쇄 보존 */
      .std-bar-fill, .ach-bd-bar-fill, .subject-bar-fill, .basic-subject-fill,
      .domain-donut, .usage-bar-fill, .insight-bar-fill {
        -webkit-print-color-adjust: exact; print-color-adjust: exact;
      }
      /* 정서 카드 전체 보기 토글 시 가려진 항목도 인쇄 시 전부 노출 */
      .emo-flow-extra, .report-list-extra { display: flex !important; }
      .obs-timeline { max-height: none !important; overflow: visible !important; }
    }

    /* PDF 저장 안내 토스트 */
    .report-toast {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(16px);
      background: rgba(17,24,39,0.95); color: #fff; padding: 12px 20px; border-radius: 10px;
      font-size: 14px; max-width: 460px; box-shadow: 0 8px 24px rgba(0,0,0,.25);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 10000;
    }
    .report-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== 카드 세부 내역 Drill-down 모달 (기획서: 성장리포트_내역_drilldown_스펙.md) ===== */
    /* 클릭 가능 항목 affordance (참여도 활동행·보조타일·성취 출처행·도넛타일·정서/진로/독서/콘텐츠 항목) */
    .is-drillable { cursor: pointer; position: relative; transition: background .15s; outline: none; }
    .is-drillable:hover { background: var(--gray-50); }
    .is-drillable:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    /* 우측 셰브론 affordance — 행/타일 끝에 표시 (hover 시 진하게) */
    .is-drillable .click-affordance {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      color: var(--gray-300); font-size: 14px; opacity: 0; transition: opacity .15s; pointer-events: none;
    }
    .is-drillable:hover .click-affordance, .is-drillable:focus-visible .click-affordance { opacity: 1; }
    /* 타일류는 셰브론을 우상단 모서리로 (중앙정렬 타일 텍스트와 겹침 회피) */
    .report-metric-tile.is-drillable .click-affordance,
    .usage-metric-cell.is-drillable .click-affordance,
    .subject-item.is-drillable .click-affordance { right: 6px; top: 8px; transform: none; }
    /* 우측 값/메타/날짜가 있는 행은 셰브론 공간(우측 22px) 확보 — 겹침 방지 */
    .atb-row.is-drillable, .domain-flow-row.is-drillable { padding-right: 22px; }
    .ach-bd-row.is-drillable { padding-right: 22px; }

    /* 오버레이 + 패널 */
    .dm-overlay {
      position: fixed; inset: 0; background: rgba(17,24,39,.55); z-index: 10000;
      display: none; align-items: center; justify-content: center; padding: 24px;
      opacity: 0; transition: opacity .18s;
    }
    .dm-overlay.open { display: flex; opacity: 1; }
    .dm-panel {
      width: 600px; max-width: calc(100vw - 48px); max-height: 80vh; background: #fff;
      border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
      display: flex; flex-direction: column; overflow: hidden;
      transform: translateY(8px); transition: transform .18s;
    }
    .dm-overlay.open .dm-panel { transform: translateY(0); }
    .dm-header {
      padding: 20px 24px; border-bottom: 1px solid var(--gray-200);
      position: relative; flex: 0 0 auto; background: #fff;
    }
    .dm-title {
      font-size: 19px; font-weight: 700; color: var(--gray-900);
      display: flex; align-items: center; gap: 8px; padding-right: 48px; line-height: 1.35;
    }
    .dm-title .dm-title-ico { font-size: 20px; flex: 0 0 auto; }
    .dm-title .dm-title-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dm-count { font-size: 14px; color: var(--gray-500); margin-top: 4px; }
    .dm-close {
      position: absolute; top: 16px; right: 16px; width: 36px; height: 36px;
      border-radius: 10px; border: none; background: var(--gray-100);
      font-size: 20px; color: var(--gray-600); cursor: pointer; line-height: 1;
      display: flex; align-items: center; justify-content: center; transition: background .15s;
    }
    .dm-close:hover { background: var(--gray-200); }
    .dm-body { padding: 8px 16px 16px; overflow-y: auto; flex: 1 1 auto; }

    .dm-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 12px;
      min-height: 56px; border-radius: 10px; border-bottom: 1px solid var(--gray-100);
    }
    .dm-row:last-child { border-bottom: none; }
    .dm-row-icon { flex: 0 0 auto; font-size: 18px; width: 24px; text-align: center; }
    .dm-row-body { flex: 1 1 auto; min-width: 0; }
    .dm-row-primary {
      font-size: 16px; font-weight: 600; color: var(--gray-800);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-row-meta {
      font-size: 14px; color: var(--gray-500); margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-row-tail { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
    .dm-row-date { font-size: 13px; color: var(--gray-400); white-space: nowrap; }
    .dm-row-badge {
      flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 8px;
      white-space: nowrap; max-width: 120px; overflow: hidden; text-overflow: ellipsis;
    }
    .dm-badge-info { background: var(--primary-light); color: var(--primary-dark); }
    .dm-badge-success { background: var(--secondary-light); color: #047857; }
    .dm-badge-danger { background: var(--danger-light); color: #b91c1c; }
    .dm-badge-warning { background: var(--warning-light); color: #92400e; }
    .dm-badge-neutral { background: var(--gray-100); color: var(--gray-600); }
    /* O/X 결과 칩 */
    .dm-result-chip {
      flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
    }
    .dm-result-correct { background: var(--secondary); }
    .dm-result-incorrect { background: var(--danger); }

    /* 빈 상태 / 로딩 */
    .dm-empty { text-align: center; color: var(--gray-400); padding: 48px 16px; }
    .dm-empty-ico { font-size: 36px; margin-bottom: 12px; }
    .dm-empty-title { font-size: 16px; color: var(--gray-600); font-weight: 600; }
    .dm-empty-text { font-size: 14px; color: var(--gray-400); margin-top: 6px; }
    .dm-note { font-size: 13px; color: var(--gray-400); text-align: center; padding: 10px 8px 4px; }
    .dm-skel-row {
      display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 56px;
    }
    .dm-skel-ico { width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto; }
    .dm-skel-body { flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px; }
    .dm-skel-line { height: 12px; border-radius: 6px; }
    .dm-skel-line.short { width: 40%; }
    .dm-skel-ico, .dm-skel-line {
      background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-200) 37%, var(--gray-100) 63%);
      background-size: 400% 100%; animation: dmShimmer 1.2s ease infinite;
    }
    @keyframes dmShimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    /* 반응형 — <768px 하단 시트 */
    @media (max-width: 768px) {
      .dm-overlay { align-items: flex-end; padding: 0; }
      .dm-panel { width: 100%; max-width: none; max-height: 88vh; border-radius: 16px 16px 0 0; }
    }

    /* ===== 오늘의 학습 현황 — 기간별 "폭 꽉 채움" (cascade 마지막 = 기존 규칙 override) ===== */
    #dailyLearningSection .daily-content-grid {
      display: grid;
      grid-template-columns: 180px minmax(0, 1fr) 240px;  /* 통계 | 본문(꽉채움) | 인사이트 */
      gap: 20px; align-items: stretch; margin-top: 12px;
    }
    @media (max-width: 1024px) {
      #dailyLearningSection .daily-content-grid { grid-template-columns: 1fr; }
    }

    /* 좌: 통계 4칸 */
    #dailyLearningSection .daily-stats { display: flex; flex-direction: column; gap: 10px; }
    #dailyLearningSection .daily-stat-item {
      background: var(--gray-50); border-radius: 12px; padding: 14px 16px; text-align: center;
      flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
    }
    #dailyLearningSection .daily-stat-value { font-size: 26px; font-weight: 700; color: var(--gray-800); line-height: 1.1; }
    #dailyLearningSection .daily-stat-unit  { font-size: 14px; font-weight: 600; color: var(--gray-500); margin-left: 2px; }
    #dailyLearningSection .daily-stat-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

    /* 중간: 본문 — 세로 흐름(인사이트 전폭 상단 → 캘린더 전폭 하단이 남는 높이 흡수) */
    #dailyLearningSection .daily-details { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    #dailyLearningSection .daily-insight {
      background: var(--gray-50); border-left: 3px solid var(--secondary); border-radius: 10px;
      padding: 12px 16px; font-size: 14px; color: var(--gray-700); flex: 0 0 auto;
    }
    #dailyLearningSection .daily-calendar {
      background: var(--gray-50); border-radius: 12px; padding: 16px;
      flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0;
    }
    #dailyLearningSection .calendar-label { font-size: 13px; font-weight: 600; color: var(--gray-600); }

    /* 7일 — A형 요일 그리드 (폭 100% 꽉 채움) */
    #dailyLearningSection .calendar-days {
      display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px;
      width: 100%; flex: 1 1 auto; align-content: center;
    }
    #dailyLearningSection .calendar-day {
      aspect-ratio: 1; max-width: 64px; justify-self: center; align-self: center;
      width: 100%; border-radius: 8px; background: var(--gray-200);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; color: var(--gray-500);
    }
    #dailyLearningSection .calendar-day.completed { background: var(--secondary); color: #fff; font-weight: 600; }
    #dailyLearningSection .calendar-day.none { background: var(--gray-200); }
    #dailyLearningSection .calendar-day.today { outline: 2px solid var(--primary); outline-offset: -1px; }
    #dailyLearningSection .calendar-day .cal-day-num { font-size: 13px; }

    /* 30·90일 — B형 히트맵 (폭 100%, 주차열 1fr 균등 분할) */
    #dailyLearningSection .heatmap-wrap {
      display: grid; gap: 4px 6px; width: 100%; flex: 1 1 auto;
      justify-content: stretch; align-content: center;
    }
    #dailyLearningSection .heatmap-col-label { font-size: 13px; color: var(--gray-400); text-align: center; align-self: end; }
    #dailyLearningSection .heatmap-row-label { font-size: 13px; color: var(--gray-400); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
    #dailyLearningSection .heatmap-cell {
      width: 100%; height: 30px; justify-self: stretch;
      min-width: 0; border-radius: 5px; background: var(--gray-200);
    }
    /* 주가 적은 30일권은 셀을 약간 더 두툼하게(세로), 90일권은 기본 높이 */
    #dailyLearningSection .heatmap-wrap.weeks-5 .heatmap-cell { height: 34px; }
    #dailyLearningSection .heatmap-cell.done  { background: var(--secondary); }
    #dailyLearningSection .heatmap-cell.out   { background: transparent; }
    #dailyLearningSection .heatmap-cell.today { outline: 2px solid var(--primary); outline-offset: -1px; }
    #dailyLearningSection .heatmap-legend { display: flex; gap: 16px; font-size: 13px; color: var(--gray-500); margin-top: auto; flex: 0 0 auto; }
    #dailyLearningSection .heatmap-legend .lg-dot { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    #dailyLearningSection .lg-dot.lg-done { background: var(--secondary); }
    #dailyLearningSection .lg-dot.lg-miss { background: var(--gray-200); }

    /* 180·전체 — C형 주/월 막대 (폭 100% flex 균등 + 세로 꽉 채움) */
    #dailyLearningSection .weekbar-wrap {
      display: flex; align-items: stretch; gap: 8px; width: 100%;
      flex: 1 1 auto; min-height: 150px; align-content: stretch;
    }
    #dailyLearningSection .weekbar-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: stretch; justify-content: flex-end; }
    #dailyLearningSection .weekbar { width: 100%; min-height: 6px; background: var(--gray-200); border-radius: 4px 4px 0 0; }
    #dailyLearningSection .weekbar.fill-low { background: #a7f3d0; }
    #dailyLearningSection .weekbar.fill-high { background: var(--secondary); }
    #dailyLearningSection .weekbar-meta { display: flex; justify-content: space-between; font-size: 13px; color: var(--gray-400); margin-top: 6px; flex: 0 0 auto; }
    #dailyLearningSection .weekbar-summary { font-size: 13px; color: var(--gray-600); margin-top: 6px; flex: 0 0 auto; }

    /* 우: 이번 기간 인사이트 패널 */
    #dailyLearningSection .daily-side-panel { background: var(--gray-50); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    #dailyLearningSection .daily-side-panel h4 { font-size: 14px; font-weight: 700; color: var(--gray-700); margin: 0 0 4px; }
    #dailyLearningSection .insight-row { display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    #dailyLearningSection .insight-row .ir-label { color: var(--gray-500); }
    #dailyLearningSection .insight-row strong { color: var(--gray-800); }
    #dailyLearningSection .insight-row.is-zero strong { color: var(--gray-400); }
    #dailyLearningSection .insight-row-stack { display: flex; flex-direction: column; gap: 6px; }
    #dailyLearningSection .insight-row-stack .irs-head { display: flex; justify-content: space-between; font-size: 14px; color: var(--gray-500); }
    #dailyLearningSection .insight-bar { height: 8px; background: var(--gray-200); border-radius: 5px; overflow: hidden; }
    #dailyLearningSection .insight-bar-fill { height: 100%; background: var(--secondary); border-radius: 5px; }
    #dailyLearningSection .daily-side-panel .empty-msg { font-size: 13px; color: var(--gray-400); line-height: 1.6; }

    @media (max-width: 768px) {
      #dailyLearningSection .heatmap-cell { max-width: 28px; }
    }

    /* ===== 누락 복구 1 — 성취수준: 자주 활용한 성취기준 Top5 (가로 1줄: 코드 | 막대 | 횟수) ===== */
    .standard-list { display: flex; flex-direction: column; gap: 8px; }
    .standard-row { display: flex; align-items: center; gap: 12px; }
    .standard-row code {
      flex: 0 0 96px; font-family: 'Courier New', monospace; font-size: 13px;
      font-weight: 700; color: var(--gray-700); background: var(--gray-100);
      padding: 4px 8px; border-radius: 6px; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .std-bar { flex: 1 1 auto; height: 10px; background: var(--gray-200); border-radius: 6px; overflow: hidden; }
    .std-bar-fill { height: 100%; background: var(--purple); border-radius: 6px; transition: width .4s; }
    .std-cnt { flex: 0 0 48px; text-align: right; font-size: 14px; font-weight: 700; color: var(--gray-700); }

    /* ===== 성취수준: 정답률 출처별 구분 6종 ===== */
    .achievement-breakdown { display: flex; flex-direction: column; gap: 8px; }
    .report-grid > .section-card .domain-flow .achievement-breakdown { flex: 1 1 auto; justify-content: space-between; }
    .ach-bd-row { display: flex; align-items: center; gap: 12px; min-height: 26px; }
    .ach-bd-ico { flex: 0 0 20px; width: 20px; text-align: center; font-size: 16px; line-height: 1; }
    .ach-bd-label { flex: 0 0 138px; font-size: 15px; font-weight: 600; color: var(--gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ach-bd-bar { flex: 1 1 auto; height: 12px; background: var(--gray-200); border-radius: 6px; overflow: hidden; }
    .ach-bd-bar-fill { height: 100%; border-radius: 6px; transition: width .4s; }
    .ach-bd-meta { flex: 0 0 auto; min-width: 96px; text-align: right; font-size: 13px; color: var(--gray-500); white-space: nowrap; }
    .ach-bd-meta strong { font-size: 14px; color: var(--gray-800); }
    .ach-bd-row.is-empty .ach-bd-label { color: var(--gray-400); font-weight: 500; }
    .ach-bd-empty { flex: 1 1 auto; display: flex; align-items: center; gap: 8px; height: 12px; font-size: 13px; color: var(--gray-400); }
    .ach-bd-empty::before { content: ""; flex: 0 0 56px; height: 2px; background: var(--gray-200); border-radius: 2px; }
    @media (max-width: 768px) {
      .ach-bd-row { flex-wrap: wrap; align-items: center; gap: 4px 10px; min-height: 0; padding: 6px 0; }
      .ach-bd-ico { flex: 0 0 18px; font-size: 15px; }
      .ach-bd-label { flex: 1 1 auto; font-size: 14px; }
      .ach-bd-meta { flex: 0 0 auto; min-width: 0; order: 0; }
      .ach-bd-bar { flex: 1 1 100%; order: 1; height: 10px; }
      .ach-bd-empty { flex: 1 1 100%; order: 1; }
    }

    /* ===== 누락 복구 3 — 콘텐츠 활용 지표 4칸 그리드 (저장/조회/구독/포트폴리오) ===== */
    .usage-metric-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 4px; }
    .usage-metric-cell {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 12px 8px; background: var(--gray-50); border-radius: 12px; text-align: center;
    }
    .usage-metric-cell .um-label { font-size: 13px; color: var(--gray-600); white-space: nowrap; }
    .usage-metric-cell strong { font-size: 17px; font-weight: 700; color: var(--gray-800); }
    .usage-metric-cell.is-zero { opacity: .55; }
    .usage-metric-cell.is-zero strong { color: var(--gray-400); }
    @media (max-width: 768px) { .usage-metric-grid { grid-template-columns: repeat(2, 1fr); } }

    /* ===== 누락 복구 4 — 독서 기록 별점 ===== */
    .book-row-stars { color: var(--warning); font-size: 13px; letter-spacing: 1px; white-space: nowrap; }

    /* ===== 정서 카드 — 최근 감정 흐름 요약(5건) + 전체 보기 토글 ===== */
    .emo-flow-extra { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .emo-flow-toggle {
      align-self: flex-start; margin-top: 10px; padding: 6px 14px;
      background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: 18px;
      font-size: 13px; font-weight: 600; color: var(--primary); cursor: pointer;
      font-family: inherit; display: inline-flex; align-items: center; gap: 6px; transition: all .15s;
    }
    .emo-flow-toggle:hover { background: var(--primary-light); border-color: var(--primary); }

    /* ===== 누락 복구 5 — 기초학력 진단 (도달/미달 뱃지 + 과목 막대) ===== */
    .basic-content { display: flex; gap: 24px; align-items: flex-start; }
    .basic-status { flex: 0 0 200px; text-align: center; }
    .status-badge {
      display: inline-block; padding: 8px 20px; border-radius: 20px;
      font-size: 16px; font-weight: 700; margin-bottom: 12px;
    }
    .status-badge.reached { background: var(--secondary-light); color: #047857; }
    .status-badge.not-reached { background: var(--danger-light); color: #b91c1c; }
    .status-description { font-size: 14px; color: var(--gray-600); line-height: 1.6; }
    .status-description strong { color: var(--gray-800); }
    .basic-subjects { flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .basic-subject-item { display: flex; align-items: center; gap: 12px; }
    .basic-subject-name {
      flex: 0 0 64px; font-size: 14px; color: var(--gray-700);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .basic-subject-bar { flex: 1 1 auto; height: 10px; background: var(--gray-200); border-radius: 6px; overflow: hidden; }
    .basic-subject-fill { height: 100%; background: var(--primary); border-radius: 6px; transition: width .4s; }
    .basic-subject-value { flex: 0 0 44px; text-align: right; font-size: 14px; font-weight: 700; color: var(--gray-700); }
    .basic-subject-status { flex: 0 0 auto; font-size: 13px; font-weight: 600; padding: 2px 10px; border-radius: 10px; }
    .basic-subject-status.reached { background: var(--secondary-light); color: #047857; }
    .basic-subject-status.warning { background: var(--warning-light); color: #b45309; }
    .basic-subject-status.not-reached { background: var(--danger-light); color: #b91c1c; }

    /* ===== 누락 복구 6 — 학습 역량 레이더 ===== */
    .learning-content { display: flex; gap: 24px; align-items: flex-start; }
    .radar-chart { flex: 0 0 240px; display: flex; align-items: center; justify-content: center; }
    .radar-placeholder {
      position: relative; width: 200px; height: 200px; border-radius: 50%;
      background:
        radial-gradient(circle, transparent 0, transparent 24%, var(--gray-200) 25%, transparent 26%) center / 100% 100% no-repeat,
        radial-gradient(circle, transparent 0, transparent 49%, var(--gray-200) 50%, transparent 51%) center / 100% 100% no-repeat,
        radial-gradient(circle, transparent 0, transparent 74%, var(--gray-200) 75%, transparent 76%) center / 100% 100% no-repeat,
        radial-gradient(circle, var(--gray-200) 0, var(--gray-200) 99%, transparent 100%) center / 100% 100% no-repeat;
    }
    .radar-polygon { position: absolute; inset: 0; background: rgba(37,99,235,0.28); border: 2px solid var(--primary); }
    .radar-labels { position: absolute; inset: 0; }
    .radar-label {
      position: absolute; font-size: 13px; font-weight: 600; color: var(--gray-600);
      white-space: nowrap; background: rgba(255,255,255,0.85); padding: 1px 4px; border-radius: 4px;
    }
    .radar-label.top { top: -18px; left: 50%; transform: translateX(-50%); }
    .radar-label.right { top: 30%; right: -10px; transform: translateX(100%); }
    .radar-label.bottom-right { bottom: 6%; right: -6px; transform: translateX(70%); }
    .radar-label.bottom-left { bottom: 6%; left: -6px; transform: translateX(-70%); }
    .radar-label.left { top: 30%; left: -10px; transform: translateX(-100%); }
    .learning-details { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
    .learning-insight {
      background: var(--gray-50); border-radius: 12px; padding: 12px 16px;
      font-size: 14px; line-height: 1.6; color: var(--gray-700);
      border-left: 3px solid var(--primary); margin-bottom: 12px;
    }
    @media (max-width: 768px) {
      .radar-chart { flex: none; margin: 0 auto 16px; }
      .basic-status { flex: none; }
    }

    /* ===== 누락 복구 7 — 공통 보조 요소 (legend-dot, sample-badge, section-icon 보정) ===== */
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--gray-300); }
    .legend-dot.positive { background: var(--secondary); }
    .legend-dot.negative { background: var(--warning); }
    .legend-dot.none { background: var(--gray-300); }
    .sample-badge {
      display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 12px;
      font-size: 13px; font-weight: 600; background: var(--gray-100); color: var(--gray-500);
      vertical-align: middle; cursor: help;
    }
    .section-icon {
      width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
    }
    .section-icon.content { background: var(--secondary-light); }
    .section-icon.basic { background: var(--warning-light); }
    .section-icon.learning { background: var(--primary-light); }
  </style>
</head>
<body>
<div class="app-layout">
  <main class="main-content page-shell">
    <header class="page-header">
      <div class="page-header__main">
        <div class="page-header__title-row">
          <span class="page-header__icon" aria-hidden="true">👤</span>
          <h1 class="page-header__title" id="reportPageTitle">학생 성장 리포트</h1>
        </div>
        <p class="page-header__subtitle" id="reportPageSubtitle">학생의 성장 과정을 한눈에 확인하세요.</p>
      </div>
    </header>
    <!-- Teacher: Class select + Student list -->
    <div id="teacherClassView" style="display:none;">
      <div class="report-container">
        <div class="class-selector">
          <label><i class="fas fa-school"></i> 클래스 선택</label>
          <select id="reportClassSelect">
            <option value="">클래스를 선택하세요</option>
          </select>
        </div>
        <div id="studentListArea" style="display:none;">
          <div class="section-card">
            <div class="section-header">
              <div class="section-title"><div class="section-icon" style="background:var(--primary);color:#fff"><i class="fas fa-users"></i></div> 학생 성장 리포트 목록</div>
            </div>
            <table class="student-table" id="reportStudentTable">
              <thead>
                <tr>
                  <th></th>
                  <th class="sortable" onclick="sortReportStudents('이름')">이름 <i class="fas fa-sort sort-icon" id="rsort-이름"></i></th>
                  <th class="sortable" onclick="sortReportStudents('종합점수')">종합 점수 <i class="fas fa-sort sort-icon" id="rsort-종합점수"></i></th>
                  <th class="sortable" onclick="sortReportStudents('정서발달')">정서발달 <i class="fas fa-sort sort-icon" id="rsort-정서발달"></i></th>
                  <th class="sortable" onclick="sortReportStudents('참여도')">참여도 <i class="fas fa-sort sort-icon" id="rsort-참여도"></i></th>
                  <th class="sortable" onclick="sortReportStudents('성취수준')">성취수준 <i class="fas fa-sort sort-icon" id="rsort-성취수준"></i></th>
                  <th class="sortable" onclick="sortReportStudents('진로탐색')">진로탐색 <i class="fas fa-sort sort-icon" id="rsort-진로탐색"></i></th>
                  <th class="sortable" onclick="sortReportStudents('독서활동')">독서활동 <i class="fas fa-sort sort-icon" id="rsort-독서활동"></i></th>
                  <th class="sortable" onclick="sortReportStudents('콘텐츠활용')">콘텐츠활용 <i class="fas fa-sort sort-icon" id="rsort-콘텐츠활용"></i></th>
                </tr>
              </thead>
              <tbody id="studentListBody"></tbody>
            </table>
          </div>
        </div>
        <div id="emptyClassState">
          <div class="empty-state"><i class="fas fa-hand-pointer"></i><p>클래스를 선택하면 학생별 성장 리포트를 확인할 수 있습니다.</p></div>
        </div>
      </div>
    </div>

    <!-- Back button for teacher -->
    <div id="backToListBtn" style="display:none;margin-bottom:12px;">
      <div class="report-container">
        <button class="btn btn-outline" onclick="backToStudentList()"><i class="fas fa-arrow-left"></i> 학생 목록으로</button>
      </div>
    </div>

    <div id="individualReportArea">
      <div class="report-container">

        <!-- Student Profile Header -->
        <div class="student-header" id="profileArea">
          <div class="student-info">
            <div class="student-avatar" id="profileAvatar">?</div>
            <div class="student-details">

<script>
(function() {
  'use strict';

  // 영어 코드값 → 한글 매핑
  const ACTIVITY_TYPE_KO = {
    content_view: '콘텐츠 조회', lesson_view: '수업 조회', homework_submit: '과제 제출',
    homework_graded: '과제 채점', exam_complete: '평가 완료', daily_complete: '오늘의 학습',
    diagnosis_complete: '진단 완료', attendance_checkin: '출석 체크인', post_create: '게시물 작성',
    survey_respond: '설문 응답', portfolio_add: '포트폴리오 추가',
    lesson_progress: '수업 진행', problem_set_complete: '문제풀이 완료',
    lesson_complete: '수업 완료', board_view: '게시판 조회',
    homework: '과제', exam: '평가', lesson: '수업활동', quiz: '퀴즈',
    assignment: '과제물', activity: '활동', external: '외부연동'
  };
  const SOURCE_SERVICE_KO = {
    'class': '채움클래스', content: '채움콘텐츠', 'self-learn': '스스로채움',
    cbt: '채움CBT', growth: '성장기록', portal: '포털'
  };
  const VERB_KO = {
    completed: '완료', submitted: '제출', accessed: '접근', answered: '응답',
    attempted: '시도', attended: '참석', created: '생성', responded: '응답'
  };
  const RESULT_TYPE_KO = { completed: '완료' };
  function toKoActivityType(v) { return (v && ACTIVITY_TYPE_KO[v]) || v; }
  function toKoSource(v) { return (v && SOURCE_SERVICE_KO[v]) || v; }

  // ---- Drill-down: 클릭 가능 항목 마킹 헬퍼 ----
  // 활성(cnt>0)이면 is-drillable + data-type(+data-source) + a11y 속성 + 셰브론 affordance.
  // 비활성(0건)이면 빈 문자열 → 기존 흐리게 처리 유지(클릭 불가).
  // 참여도 활동유형 행(learning_logs.activity_type) → detail type 매핑표(스펙 §3)
  const ACT_TO_DETAIL_TYPE = {
    post_create: 'post', attendance_checkin: 'attendance', survey_respond: 'survey',
    homework_submit: 'homework', exam_complete: 'exam',
    daily_complete: 'today_learning', problem_set_complete: 'today_learning',
    lesson_complete: 'lesson', lesson_view: 'lesson', lesson_progress: 'lesson',
    content_view: 'content_viewed', diagnosis_complete: 'ai_learning',
    portfolio_add: 'content_portfolio'
  };
  // drillClass: 기존 class="..." 안에 덧붙일 ' is-drillable' 조각 (비활성이면 '')
  function drillClass(type, opts) {
    opts = opts || {};
    return (type && opts.active !== false) ? ' is-drillable' : '';
  }
  // drillAttrs: data-type/data-source + a11y 속성 (class는 미포함 — 중복 class 방지)
  function drillAttrs(type, label, opts) {
    opts = opts || {};
    if (!type || opts.active === false) return '';
    let s = ' data-type="' + type + '"';
    if (opts.source) s += ' data-source="' + opts.source + '"';
    s += ' role="button" tabindex="0" aria-label="' + escapeHtml((label || '항목') + ' 내역 보기') + '"';
    return s;
  }
  const DRILL_CHEVRON = '<span class="click-affordance" aria-hidden="true">›</span>';
  function toKoVerb(v) { return (v && VERB_KO[v]) || v; }
  function toKoResultType(v) { return (v && RESULT_TYPE_KO[v]) || v; }

  // 콘텐츠 조회 키워드 — 영문 코드값(Activity·content 등)을 한글 콘텐츠 유형으로 매핑
  const CONTENT_KEYWORD_KO = {
    activity: '학습활동', content: '콘텐츠', video: '동영상', document: '문서',
    image: '이미지', audio: '오디오', quiz: '퀴즈', lesson: '수업', link: '링크',
    pdf: 'PDF', html: '웹페이지', interactive: '인터랙티브'
  };
  // 영문 코드(한글 미포함, 알파벳/숫자만)인지 판별 — 실제 검색어면 그대로 둠
  function isCodeLikeKeyword(v) {
    if (!v) return false;
    if (/[가-힣]/.test(v)) return false; // 한글 포함 → 실제 검색어
    return /^[A-Za-z][A-Za-z0-9_\-]*$/.test(v);
  }
  function toKoContentKeyword(v) {
    if (!v) return v;
    const lower = String(v).toLowerCase();
    if (CONTENT_KEYWORD_KO[lower]) return CONTENT_KEYWORD_KO[lower];
    return v;
  }

  let currentUser = null;
  let targetStudentId = null;
  let isTeacher = false;
  let currentReportData = null;
  let allObservations = [];
  let activeObsTag = 'all';
  let studentRadarInstance = null;

  const AREAS = [
    { key: '정서발달',   icon: 'fas fa-heart',         color: '#ec4899', bg: '#fce7f3', emoji: '\uD83D\uDC9B', iconClass: 'emotion' },
    { key: '참여도',     icon: 'fas fa-people-arrows', color: '#2563eb', bg: '#dbeafe', emoji: '\uD83E\uDD1D', iconClass: 'learning' },
    { key: '성취수준',   icon: 'fas fa-bullseye',      color: '#8b5cf6', bg: '#ede9fe', emoji: '\uD83C\uDFAF', iconClass: 'basic' },
    { key: '진로탐색',   icon: 'fas fa-compass',       color: '#06b6d4', bg: '#cffafe', emoji: '\uD83E\uDDED', iconClass: 'career' },
    { key: '독서활동',   icon: 'fas fa-book-reader',   color: '#f59e0b', bg: '#fef3c7', emoji: '\uD83D\uDCD6', iconClass: 'reading' },
    { key: '콘텐츠활용', icon: 'fas fa-photo-film',    color: '#10b981', bg: '#d1fae5', emoji: '\uD83C\uDFAC', iconClass: 'content' }
  ];

  // 스펙 §3 — 전 카드 공통 목록 요약 표시 수량 (6건↑ 카드만 토글 노출)
  const LIST_SUMMARY_N = 5;

  // 스펙 §3.2 — 공통 목록 토글 (정서·독서 등 6건↑ 카드 공용). data-total 기준 라벨 복원.
  window.toggleReportList = function(btn) {
    if (!btn) return;
    const extra = document.getElementById(btn.getAttribute('data-target') || '');
    if (!extra) return;
    const total = parseInt(btn.getAttribute('data-total'), 10) || 0;
    const opened = extra.style.display !== 'none';
    if (opened) {
      extra.style.display = 'none';
      btn.innerHTML = '<i class="fas fa-chevron-down"></i> 전체 ' + total + '건 보기';
    } else {
      extra.style.display = 'flex';
      btn.innerHTML = '<i class="fas fa-chevron-up"></i> 접기';
    }
  };

  async function fetchWithAuth(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) window.location.href = '/login.html';
    return res;
  }

  function initWithUser(user) {
    if (currentUser) return;
    currentUser = user;
    isTeacher = currentUser.role === 'teacher' || currentUser.role === 'admin';
    const params = new URLSearchParams(window.location.search);
    const studentIdParam = params.get('studentId');

    if (isTeacher && !studentIdParam) {
      document.getElementById('teacherClassView').style.display = '';
      document.getElementById('individualReportArea').style.display = 'none';
      loadTeacherClasses();
    } else {
      targetStudentId = studentIdParam ? parseInt(studentIdParam) : currentUser.id;
      document.getElementById('teacherClassView').style.display = 'none';
      document.getElementById('individualReportArea').style.display = '';
      if (isTeacher && studentIdParam) {
        document.getElementById('backToListBtn').style.display = '';
      }
      if (!isTeacher) {
        document.getElementById('toggleReadingForm').style.display = currentUser.id === targetStudentId ? '' : 'none';
      }
      initPeriodFilter();
      loadStudentReport();
      loadReadingLogs();
      loadObservations();
    }
  }

  window.addEventListener('dacheim:user-loaded', (e) => initWithUser(e.detail));
  if (window.dacheumUser) initWithUser(window.dacheumUser);

  // ---- Teacher: Class & Student list ----
  async function loadTeacherClasses() {
    try {
      const res = await fetchWithAuth('/api/class');
      const data = await res.json();
      if (!data.success) return;
      const select = document.getElementById('reportClassSelect');
      const classes = (data.classes || []).filter(c => c.my_role === 'owner' || c.owner_id === currentUser.id || currentUser.role === 'admin');
      classes.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        select.appendChild(opt);
      });
      if (classes.length > 0) {
        select.value = classes[0].id;
        select.dispatchEvent(new Event('change'));
      }
    } catch (err) { console.error('클래스 목록 로드 실패:', err); }
  }

  document.getElementById('reportClassSelect').addEventListener('change', async (e) => {
    const classId = parseInt(e.target.value);
    if (!classId) {
      document.getElementById('studentListArea').style.display = 'none';
      document.getElementById('emptyClassState').style.display = '';
      return;
    }
    document.getElementById('emptyClassState').style.display = 'none';
    document.getElementById('studentListArea').style.display = '';
    try {
      const res = await fetchWithAuth('/api/growth/report/class/' + classId);
      const data = await res.json();
      if (!data.success) return;
      reportStudents = data.students || [];
      rSortField = null; rSortOrder = 'asc';
      updateReportSortIcons();
      renderStudentList(reportStudents);
    } catch (err) { console.error('학생 목록 로드 실패:', err); }
  });

  // Sort
  let reportStudents = [];
  let rSortField = null;
  let rSortOrder = 'asc';

  window.sortReportStudents = function(field) {
    if (rSortField === field) { rSortOrder = rSortOrder === 'asc' ? 'desc' : 'asc'; }
    else { rSortField = field; rSortOrder = field === '이름' ? 'asc' : 'desc'; }
    const sorted = [...reportStudents].sort((a, b) => {
      let aVal, bVal;
      if (field === '이름') {
        aVal = (a.display_name || a.studentName || '').toLowerCase();
        bVal = (b.display_name || b.studentName || '').toLowerCase();
        return rSortOrder === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
      } else if (field === '종합점수') {
        aVal = a.averageScore ?? -1; bVal = b.averageScore ?? -1;
      } else {
        aVal = a.areas?.[field]?.score ?? -1; bVal = b.areas?.[field]?.score ?? -1;
      }
      return rSortOrder === 'asc' ? aVal - bVal : bVal - aVal;
    });
    updateReportSortIcons();
    renderStudentList(sorted);
  };

  function updateReportSortIcons() {
    document.querySelectorAll('#reportStudentTable th').forEach(th => th.classList.remove('sort-active'));
    document.querySelectorAll('#reportStudentTable .sort-icon').forEach(icon => { icon.className = 'fas fa-sort sort-icon'; });
    if (rSortField) {
      const icon = document.getElementById('rsort-' + rSortField);
      if (icon) {
        icon.className = 'fas fa-sort-' + (rSortOrder === 'asc' ? 'up' : 'down') + ' sort-icon';
        icon.closest('th').classList.add('sort-active');
      }
    }
  }

  function scoreClass(v) {
    if (v === '-' || v == null) return '';
    if (v >= 80) return 'score-high';
    if (v >= 60) return 'score-mid';
    if (v >= 40) return 'score-low';
    return 'score-danger';
  }

  function renderStudentList(students) {
    const tbody = document.getElementById('studentListBody');
    const colors = ['#2563eb','#10b981','#8b5cf6','#ec4899','#f59e0b','#06b6d4','#ef4444'];
    if (!students.length) {
      tbody.innerHTML = '<tr><td colspan="9" class="empty-state">등록된 학생이 없습니다.</td></tr>';
      return;
    }
    tbody.innerHTML = students.map((s, i) => {
      const c = colors[i % colors.length];
      const name = s.display_name || s.studentName || '학생';
      const avg = s.averageScore != null ? Math.round(s.averageScore) : '-';
      const areaScores = AREAS.map(a => {
        const ad = s.areas ? s.areas[a.key] : null;
        if (!ad || ad.hasData === false) return '<td class="score-cell" style="color:var(--gray-300);">-</td>';
        const score = ad.score != null ? Math.round(ad.score) : '-';
        return '<td class="score-cell ' + scoreClass(score) + '">' + score + '</td>';
      }).join('');
      return '<tr style="cursor:pointer;" onclick="showStudentReport(' + (s.studentId || s.id) + ')">' +
        '<td><div style="background:' + c + '20;color:' + c + ';width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;">' + name.charAt(0) + '</div></td>' +
        '<td><strong>' + name + '</strong></td>' +
        '<td class="score-cell ' + scoreClass(avg) + '"><strong>' + avg + '</strong></td>' +
        areaScores + '</tr>';
    }).join('');
  }

  // 정서 카드 — "최근 감정 흐름" 전체 보기/접기 토글
  // ---- Period Filter State ----
  let currentPeriod = { days: 30, startDate: null, endDate: null };

  function computePeriodRange(days) {
    if (days === 'all') return { startDate: null, endDate: null };
    const end = new Date();
    const start = new Date();
    start.setDate(start.getDate() - (parseInt(days) - 1));
    const fmt = (d) => d.toISOString().slice(0, 10);
    return { startDate: fmt(start), endDate: fmt(end) };
  }

  function updatePeriodRangeText() {
    const el = document.getElementById('periodRangeText');
    if (!el) return;
    if (!currentPeriod.startDate) {
      el.textContent = '※ 등록된 모든 활동 데이터';
    } else {
      el.textContent = currentPeriod.startDate + ' ~ ' + currentPeriod.endDate;
    }
  }

  function buildReportQuery() {
    const params = [];
    if (currentPeriod.startDate) {
      params.push('startDate=' + currentPeriod.startDate, 'endDate=' + currentPeriod.endDate);
    }
    // 참여도은 클래스 맥락 지표이므로 classId를 동반해야 교사 테이블과 값이 일치 (감리 REWORK)
    const cid = (typeof currentClassId !== 'undefined' && currentClassId)
      || document.getElementById('reportClassSelect')?.value
      || new URLSearchParams(location.search).get('classId') || '';
    if (cid) params.push('classId=' + cid);
    return params.length ? '?' + params.join('&') : '';
  }

  function initPeriodFilter() {
    const chips = document.querySelectorAll('#periodChips .period-chip');
    if (!chips.length) return;
    // 기본값 적용 — URL ?period= 반영(유효값 7|30|90|180|all), 없으면 30
    const urlPeriod = new URLSearchParams(location.search).get('period');
    const valid = ['7', '30', '90', '180', 'all'];
    const defaultDays = valid.includes(urlPeriod) ? (urlPeriod === 'all' ? 'all' : parseInt(urlPeriod)) : 30;
    chips.forEach(c => c.classList.toggle('active', String(c.dataset.days) === String(defaultDays)));
    Object.assign(currentPeriod, { days: defaultDays }, computePeriodRange(defaultDays));
    updatePeriodRangeText();
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        const days = chip.dataset.days;
        currentPeriod.days = days;
        Object.assign(currentPeriod, computePeriodRange(days));
        updatePeriodRangeText();
        loadStudentReport();
      });
    });
  }

  // ---- Load & Render Student Report ----
  async function loadStudentReport() {
    try {
      const res = await fetchWithAuth('/api/growth/report/student/' + targetStudentId + buildReportQuery());
      // 403 은 "실패"가 아니라 "권한 없음" — 남의 리포트 화면을 감추고 안내로 대체한다
      if (window.DacheumAccess && DacheumAccess.denied(res, {
        what: '다른 학생의 성장 리포트',
        who: '본인과 그 학생을 맡은 선생님',
        backHref: '/growth/student-report.html',
        backLabel: '나의 성장 리포트 보기'
      })) return;
      const data = await res.json();
      if (!data.success) { showError('리포트를 불러올 수 없습니다.'); return; }
      currentReportData = data.report;
      renderProfile(data.report);
      renderGrowthSummary(data.report);
      renderRadarChart(data.report);
      renderDailyLearningSection(data.report);
      renderDomainCards(data.report);
      renderContentUsage(data.report);
    } catch (err) {
      console.error('리포트 로드 실패:', err);
      showError('서버 오류가 발생했습니다.');
    }
  }

  function renderGrowthSummary(report) {
    const el = document.getElementById('growthSummary');
    const name = report.studentName || '학생';
    const areas = report.areas || {};

    // Find best area
    let bestArea = null, bestScore = -1;
    Object.entries(areas).forEach(([key, val]) => {
      if (val.hasData && val.score > bestScore) { bestScore = val.score; bestArea = key; }
    });

    if (!bestArea) { el.style.display = 'none'; return; }
    el.style.display = '';

    document.getElementById('summaryTitle').textContent = name + ' 학생의 성장 이야기';

    // Generate narrative
    let narrative = name + '은(는) <span class="highlight-tag">' + bestArea + '</span> 영역에서 뛰어난 성장을 보이고 있습니다. ';
    narrative += '<span class="highlight-tag">' + bestScore + '점</span>을 기록했으며, ';

    // Emotion info
    const emotionData = report.emotionDevelopment || [];
    const totalEmotions = emotionData.reduce((s, e) => s + e.cnt, 0);
    const positiveEmotions = emotionData.filter(e => ['happy','excited','good','great','calm'].includes(e.emotion));
    const positiveCount = positiveEmotions.reduce((s, e) => s + e.cnt, 0);
    if (totalEmotions > 0) {
      const posRatio = Math.round(positiveCount / totalEmotions * 100);
      if (posRatio >= 60) narrative += '<span class="highlight-tag">긍정적인 감정</span>으로 학교생활에 참여하고 있습니다. ';
      else narrative += '감정적 지원이 필요한 부분이 있습니다. ';
    }

    // Keywords from career exploration interests
    const careerInterests = (report.careerExploration && report.careerExploration.interests) || [];
    if (careerInterests.length > 0) {
      const tags = careerInterests.slice(0, 3).map(s => '<span class="highlight-tag">#' + escapeHtml(s.interest_area) + '</span>').join(' ');
      narrative += '주요 관심 키워드는 ' + tags + ' 입니다.';
    }

    document.getElementById('summaryContent').innerHTML = narrative;
  }

  // ---- 6축 레이더 (class-dashboard와 동일 옵션, '나의 성장') ----
  function renderRadarChart(report) {
    const canvas = document.getElementById('studentRadarChart');
    if (!canvas || !window.Chart) return;
    const areas = report.areas || {};
    const meta = AREAS.map(a => {
      const ad = areas[a.key] || {};
      const hasData = ad.hasData !== false;
      const score = ad.score != null ? ad.score : 0;
      return { key: a.key, score, hasData };
    });
    const labels = meta.map(m => m.hasData ? m.key : (m.key + ' (없음)'));
    const values = meta.map(m => m.hasData ? m.score : 0);
    const pointColors = meta.map(m => m.hasData ? '#2563eb' : '#cbd5e1');
    if (studentRadarInstance) studentRadarInstance.destroy();
    studentRadarInstance = new Chart(canvas.getContext('2d'), {
      type: 'radar',
      data: {
        labels,
        datasets: [{
          label: '나의 성장',
          data: values,
          backgroundColor: 'rgba(37,99,235,.15)',
          borderColor: 'rgba(37,99,235,.7)',
          borderWidth: 2,
          pointBackgroundColor: pointColors,
          pointBorderColor: pointColors,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        scales: { r: { beginAtZero: true, max: 100, ticks: { stepSize: 20, font: { size: 11 } }, pointLabels: { font: { size: 13 } } } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: (c) => meta[c.dataIndex] && !meta[c.dataIndex].hasData
                ? meta[c.dataIndex].key + ': 데이터 없음'
                : meta[c.dataIndex].key + ': ' + Math.round(c.parsed.r) + '점'
            }
          }
        }
      }
    });
  }
