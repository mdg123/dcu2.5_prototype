  // ---- Domain Card Renderers ----

  // 도넛 색 — score 구간별 4단계
  function donutColorForScore(score) {
    if (score == null) return 'var(--gray-300)';
    if (score >= 80) return 'var(--secondary)';
    if (score >= 60) return 'var(--primary)';
    if (score >= 40) return 'var(--warning)';
    return 'var(--danger)';
  }

  // 단색 도넛 (score% 만큼만 채우고 나머지는 회색) — 정서 외 카드에서 사용
  function makeScoreDonutHtml(score, options) {
    options = options || {};
    const isEmpty = options.empty === true;
    const isSample = options.sample === true;
    const unit = options.unit || '점';
    const label = options.label || '';
    const tip = options.tip || '';
    const titleAttr = tip ? ' title="' + escapeHtml(tip) + '"' : '';
    const cursorStyle = tip ? ';cursor:help' : '';

    if (isEmpty) {
      return '<div class="domain-donut-wrap"' + titleAttr + '>' +
        '<div class="domain-donut is-empty">' +
          '<div class="domain-donut-inner">' +
            '<div class="domain-donut-value" style="color:var(--gray-400);">-</div>' +
            '<div class="domain-donut-label">' + escapeHtml(label || '데이터 없음') + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    const v = Math.max(0, Math.min(100, score || 0));
    const color = donutColorForScore(score);
    const deg = Math.round(v / 100 * 360);
    const sampleCls = isSample ? ' is-sample' : '';
    const valueColor = isSample ? 'var(--gray-500)' : color;
    return '<div class="domain-donut-wrap"' + titleAttr + '>' +
      '<div class="domain-donut' + sampleCls + '" style="background: conic-gradient(' + color + ' 0deg ' + deg + 'deg, var(--gray-200) ' + deg + 'deg 360deg)' + cursorStyle + ';">' +
        '<div class="domain-donut-inner">' +
          '<div class="domain-donut-value" style="color:' + valueColor + ';">' + score + '<span class="unit">' + unit + '</span></div>' +
          '<div class="domain-donut-label">' + escapeHtml(label) + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // 헤더 (좌: 아이콘+제목+예시뱃지 / 우: 액션 링크)
  function makeDomainHeader(iconClass, emoji, title, opts) {

      actionHtml = '<a href="' + opts.actionHref + '" class="' + cls + '"' + onclick + '>' +

  // 보강 카드(스펙 §4.2 규칙2) — 토글 없는 짧은 카드 리스트 하단에 붙여 흰 void 흡수
  function makeFlowBoost(icon, title, text, hint) {
    return '<div class="domain-flow-boost">' +
      '<div class="dfb-icon">' + icon + '</div>' +
      '<div class="dfb-title">' + escapeHtml(title) + '</div>' +
      '<div class="dfb-text">' + escapeHtml(text) + '</div>' +
      (hint ? '<div class="dfb-hint">' + escapeHtml(hint) + '</div>' : '') +
    '</div>';
  }

  // 0건 빈상태 통일(스펙 §9·§3-L) — 진로·독서처럼 친절 빈상태로 통일
  function makeEmptyRich(icon, title, text, hint) {
    return '<div class="domain-empty-rich">' +
      '<div class="der-icon">' + icon + '</div>' +
      '<div class="der-title">' + escapeHtml(title) + '</div>' +
      '<div class="der-text">' + escapeHtml(text) + '</div>' +
      (hint ? '<div class="der-hint">' + escapeHtml(hint) + '</div>' : '') +
    '</div>';
  }

  function renderEmotionCard(report, areaData) {
    const emotions = report.emotionDevelopment || [];
    const total = emotions.reduce((s, e) => s + e.cnt, 0);
    const positiveEmotions = emotions.filter(e => ['happy','excited','good','great','calm'].includes(e.emotion));
    const negativeEmotions = emotions.filter(e => ['sad','angry','anxious','tired','frustrated'].includes(e.emotion));
    const positiveCount = positiveEmotions.reduce((s, e) => s + e.cnt, 0);
    const negativeCount = negativeEmotions.reduce((s, e) => s + e.cnt, 0);
    const noneCount = total - positiveCount - negativeCount;

    const act = actionLinkFor('emotion');
    const headerHtml = makeDomainHeader('emotion', '💛', '정서 발달', {
      actionHref: act.href, actionLabel: act.label
    });

    // 빈 상태 — 5블록 placeholder 유지
    if (total === 0) {
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, { empty: true, label: '체크인 없음' }) +
          '<div class="domain-details">' +
            '<div class="domain-insight emotion">아직 감정 체크인 데이터가 없습니다. 출석 시 감정을 표현하면 정서 발달 점수가 표시됩니다.</div>' +
            '<div class="domain-chips">' +
              '<span class="domain-chip is-sample" title="감정출석부에서 행복·설렘·좋음·최고·편안 등 긍정 감정으로 체크인한 횟수입니다."><span class="legend-dot positive" style="display:inline-block;margin-right:4px;"></span>긍정 0회</span>' +
              '<span class="domain-chip is-sample" title="감정출석부에서 슬픔·화남·불안·피곤·답답 등 부정 감정으로 체크인한 횟수입니다."><span class="legend-dot negative" style="display:inline-block;margin-right:4px;"></span>부정 0회</span>' +
              '<span class="domain-chip is-sample" title="해당 기간 중 감정을 기록한 전체 체크인 횟수입니다. (긍정 비율의 분모)"><span class="legend-dot none" style="display:inline-block;margin-right:4px;"></span>전체 체크인 0회</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📅 최근 감정 흐름 (0건)</div>' +
          makeEmptyRich('💛', '오늘 마음은 어떤가요?',
            '출석할 때 감정을 표현하면 최근 감정 흐름과 정서 발달 점수가 여기에 쌓여요.',
            '감정출석부에서 마음 체크인 하기') +
        '</div>' +
      '</div>';
    }

    const posRatio = Math.round(positiveCount / total * 100);
    const negRatio = Math.round(negativeCount / total * 100);
    const posDeg = Math.round(posRatio / 100 * 360);
    const negDeg = Math.round(negRatio / 100 * 360);

    // Find most common emotion
    let topEmotion = '';
    if (emotions.length > 0) {
      const sorted = [...emotions].sort((a, b) => b.cnt - a.cnt);
      topEmotion = sorted[0].emotion;
    }
    const emotionKo = { happy: '행복해요', excited: '설레요', good: '좋아요', great: '최고예요', calm: '편안해요', sad: '슬퍼요', angry: '화나요', anxious: '불안해요', tired: '피곤해요', frustrated: '답답해요' };
    const emotionEmoji = { happy: '😊', excited: '🤩', great: '🥳', good: '🙂', calm: '😌', tired: '😴', sad: '😢', angry: '😠', anxious: '😰', frustrated: '😫' };

    // 인사이트 텍스트 (3분기 + top 감정 극성)
    const insightText = (function(){
      const posSet = ['happy','excited','good','great','calm'];
      const negSet = ['sad','angry','anxious','tired','frustrated'];
      const topLabel = topEmotion ? (emotionKo[topEmotion] || '기타') : '';
      const topIsPos = posSet.indexOf(topEmotion) >= 0;
      const topIsNeg = negSet.indexOf(topEmotion) >= 0;
      let topText = '';
      if (topEmotion) {
        if (topIsPos) topText = '"<strong>' + topLabel + '</strong>" 등 긍정 감정을 자주 표현했어요. ';
        else if (topIsNeg) topText = '"<strong>' + topLabel + '</strong>" 감정이 자주 나타났어요. ';
        else topText = '"<strong>' + topLabel + '</strong>" 감정을 자주 표현했어요. ';
      }
      let stateText;
      if (posRatio >= 70) stateText = '전반적으로 안정적인 정서 상태를 보이고 있습니다.';
      else if (posRatio >= 40) stateText = '긍정과 부정 감정이 비슷한 비율로 나타나 정서적 관심이 도움이 됩니다.';
      else stateText = '부정 감정 비율이 높아 감정적 지원이 필요한 상태입니다.';
      return topText + stateText;
    })();

    // 정서 도넛 (긍/부 2색)
    const donutHtml =
      '<div class="domain-donut-wrap">' +
        '<div class="domain-donut" style="background: conic-gradient(var(--secondary) 0deg ' + posDeg + 'deg, var(--warning) ' + posDeg + 'deg ' + (posDeg + negDeg) + 'deg, var(--gray-200) ' + (posDeg + negDeg) + 'deg 360deg);">' +
          '<div class="domain-donut-inner">' +
            '<div class="domain-donut-value" style="color:var(--secondary);">' + posRatio + '<span class="unit">%</span></div>' +
            '<div class="domain-donut-label">긍정 비율</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    // 최근 감정 흐름 (블록 E)
    const recents = report.recentEmotions || [];
    let flowListHtml;
    if (recents.length === 0) {
      flowListHtml = '<div class="domain-flow-empty">아직 감정 기록이 없습니다.</div>';
    } else {
      const renderEmoRow = function(e, idx) {
        const emoji = emotionEmoji[e.emotion] || '❓';
        const label = emotionKo[e.emotion] || '기타';
        const isLatest = idx === 0;
        const dateFmt = (e.attendance_date || '').replace(/-/g, '.');
        const reasonHtml = e.emotion_reason ? '<div class="domain-flow-row-desc">' + escapeHtml(e.emotion_reason) + '</div>' : '';
        const badge = isLatest ? '<span class="domain-flow-row-badge">최근</span>' : '';
        const dc = drillClass('emotion', { active: true });
        const da = drillAttrs('emotion', '감정 체크인', { active: true, source: 'all' });
        return '<div class="domain-flow-row' + dc + '"' + da + '>' +
          '<div class="domain-flow-row-icon">' + emoji + '</div>' +
          '<div class="domain-flow-row-body">' +
            '<div class="domain-flow-row-head"><span class="domain-flow-row-label">' + label + '</span>' + badge + '<span class="domain-flow-row-date">' + dateFmt + '</span></div>' +
            reasonHtml +
          '</div>' + DRILL_CHEVRON +
        '</div>';
      };
      const headRows = recents.slice(0, LIST_SUMMARY_N).map(renderEmoRow).join('');
      let extraHtml = '';
      if (recents.length > LIST_SUMMARY_N) {
        const extraRows = recents.slice(LIST_SUMMARY_N).map(function(e, i){ return renderEmoRow(e, i + LIST_SUMMARY_N); }).join('');
        extraHtml =
          '<div class="report-list-extra" id="emoFlowExtra" style="display:none;flex-direction:column;gap:8px;">' + extraRows + '</div>' +
          '<button type="button" class="report-list-toggle" id="emoFlowToggle" ' +
            'data-target="emoFlowExtra" data-total="' + recents.length + '" onclick="toggleReportList(this)">' +
            '<i class="fas fa-chevron-down"></i> 전체 ' + recents.length + '건 보기' +
          '</button>';
      }
      flowListHtml = '<div class="domain-flow-list">' + headRows + extraHtml + '</div>';
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        donutHtml +
        '<div class="domain-details">' +
          '<div class="domain-insight emotion">' + insightText + '</div>' +
          '<div class="report-metric-tiles" style="--tile-n:3;">' +
            (function(){ const z = positiveCount === 0; const dc = drillClass('emotion', { active: !z }); const da = drillAttrs('emotion', '긍정 감정', { active: !z, source: 'positive' });
              return '<div class="report-metric-tile' + (z ? ' is-zero' : '') + dc + '"' + da + ' title="감정출석부에서 행복·설렘·좋음·최고·편안 등 긍정 감정으로 체크인한 횟수입니다.">' +
              '<div class="rmt-value" style="color:var(--secondary);">' + positiveCount + '</div><div class="rmt-label">긍정</div>' + (dc ? DRILL_CHEVRON : '') + '</div>'; })() +
            (function(){ const z = negativeCount === 0; const dc = drillClass('emotion', { active: !z }); const da = drillAttrs('emotion', '부정 감정', { active: !z, source: 'negative' });
              return '<div class="report-metric-tile' + (z ? ' is-zero' : '') + dc + '"' + da + ' title="감정출석부에서 슬픔·화남·불안·피곤·답답 등 부정 감정으로 체크인한 횟수입니다.">' +
              '<div class="rmt-value" style="color:var(--warning);">' + negativeCount + '</div><div class="rmt-label">부정</div>' + (dc ? DRILL_CHEVRON : '') + '</div>'; })() +
            (function(){ const z = total === 0; const dc = drillClass('emotion', { active: !z }); const da = drillAttrs('emotion', '전체 체크인', { active: !z, source: 'all' });
              return '<div class="report-metric-tile' + (z ? ' is-zero' : '') + dc + '"' + da + ' title="해당 기간 중 감정을 기록한 전체 체크인 횟수입니다. (긍정 비율의 분모)">' +
              '<div class="rmt-value">' + total + '</div><div class="rmt-label">전체 체크인</div>' + (dc ? DRILL_CHEVRON : '') + '</div>'; })() +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📅 최근 감정 흐름 (' + recents.length + '건)</div>' +
        flowListHtml +
      '</div>' +
    '</div>';
  }

  // ---- 참여도 카드 (5블록 통일) ----
  function renderParticipationCard(report, areaData) {
    const ad = areaData || {};
    const hasData = ad.hasData !== false;
    const score = ad.score != null ? Math.round(ad.score) : null;
    const p = ad.participation || {};

    const act = actionLinkFor('participation');
    const headerHtml = makeDomainHeader('learning', '🤝', '참여도', {
      actionHref: act.href, actionLabel: act.label
    });

    const metrics = [
      { key: 'homework', label: '과제 제출', c: '#2563eb',
        tip: '채움클래스에서 배정받은 과제 대비 제출 비율입니다. (제출 ÷ 배정)' },
      { key: 'exam',     label: '평가 응시', c: '#8b5cf6',
        tip: '채움클래스에서 배정받은 평가 대비 응시 비율입니다. (응시 ÷ 배정)' },
      { key: 'daily',    label: '오늘학습',  c: '#10b981',
        tip: '스스로채움 > 오늘의 학습 배정 대비 완료 비율입니다. (완료 ÷ 배정)' },
      { key: 'lesson',   label: '수업 이수', c: '#f59e0b',
        tip: '수업을 듣고 셀프 점검(이해도·집중도·소감)까지 완료한 수업 개수 ÷ 개설 수업 수입니다.' }
    ];

    // 보조지표 타일줄(스펙 §4.1) — 막대 승격: 과제/평가/오늘/수업 % 4타일
    // 보조타일 → detail type 매핑(스펙 §1-A): 과제 homework / 평가 exam / 오늘학습 today_learning / 수업 lesson
    const tileType = { homework: 'homework', exam: 'exam', daily: 'today_learning', lesson: 'lesson' };
    // 참여도 객체 대응(#6): p[key] 는 {rate,denom,numer} 객체.
    //  denom===0 → 미배정(회색, '-'), denom>0 & numer===0 → 미참여(0%, denom 표기·평균제외),
    //  denom>0 & numer>0 → rate% (numer/denom 표기). drill 활성은 numer>0 인 경우만.
    const buildPartTiles = (showVal) => '<div class="report-metric-tiles" style="--tile-n:4;">' + metrics.map(m => {
      const o = (showVal && p[m.key]) ? p[m.key] : null;
      const denom = o ? (o.denom || 0) : 0;
      const numer = o ? (o.numer || 0) : 0;
      const rate = o ? o.rate : null;
      // 상태 분류
      const unassigned = (denom === 0);                 // 미배정
      const inactive   = (denom > 0 && numer === 0);    // 미참여
      let valTxt, valColor, subTxt;
      if (!showVal || unassigned) {
        valTxt = '-'; valColor = 'var(--gray-400)';
        subTxt = showVal ? '미배정' : '';
      } else if (inactive) {
        valTxt = '0%'; valColor = 'var(--gray-500)';
        subTxt = '미참여 0/' + denom;
      } else {
        valTxt = (rate != null ? rate : 0) + '%'; valColor = m.c;
        subTxt = numer + '/' + denom;
      }
      const isZero = (numer === 0); // 미배정·미참여 모두 흐리게 + drill 비활성
      const zero = isZero ? ' is-zero' : '';
      const dc = drillClass(tileType[m.key], { active: !isZero });
      const da = drillAttrs(tileType[m.key], m.label, { active: !isZero });
      const chev = dc ? DRILL_CHEVRON : '';
      const subHtml = subTxt
        ? '<div class="rmt-sub" style="font-size:13px;color:var(--gray-400);margin-top:2px;">' + escapeHtml(subTxt) + '</div>'
        : '';
      return '<div class="report-metric-tile' + zero + dc + '"' + da + ' title="' + escapeHtml(m.tip) + '">' +
        '<div class="rmt-value" style="color:' + valColor + ';">' + valTxt + '</div>' +
        '<div class="rmt-label">' + m.label + '</div>' + subHtml + chev + '</div>';
    }).join('') + '</div>';

    if (!hasData || score == null) {
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, { empty: true, label: '참여 없음' }) +
          '<div class="domain-details">' +
            '<div class="domain-insight participation">아직 참여 데이터가 없습니다. 과제·평가·오늘의 학습·수업에 참여하면 종합 참여도가 표시됩니다.</div>' +
            buildPartTiles(false) +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📋 최근 참여 활동</div>' +
          '<div class="domain-flow-empty">아직 참여 활동 기록이 없습니다.</div>' +
        '</div>' +
      '</div>';
    }

    const tilesHtml = buildPartTiles(true);

    // 3분기 인사이트
    let insight;
    if (score >= 80) insight = '<strong>적극적으로 참여</strong>하고 있어요. 학습 활동에 꾸준히 응하고 있습니다.';
    else if (score >= 50) insight = '꾸준히 참여하고 있어요. 일부 활동을 늘리면 참여도가 더 향상됩니다.';
    else if (score >= 25) insight = '참여를 조금 더 늘려보세요. 과제·평가·오늘의 학습 등에 응해보면 좋아요.';
    else insight = '참여가 부족합니다. 과제·평가·수업 이수에 참여해 보세요.';

    // 블록 E — 최근 참여 활동 (learningCapacity 활용)
    const lc = report.learningCapacity || [];
    const participationTypes = ['homework_submit','exam_complete','lesson_view','daily_complete','problem_set_complete','lesson_complete','content_view','attendance_checkin','post_create','survey_respond','portfolio_add','lesson_progress','board_view','diagnosis_complete'];
    const recent = lc.filter(l => participationTypes.indexOf(l.activity_type) >= 0 && (l.cnt||0) > 0)
                     .sort((a,b) => (b.cnt||0) - (a.cnt||0))
                     .slice(0, 5);
    const typeIcon = {
      homework_submit: '📝', exam_complete: '🎓', lesson_view: '📚',
      daily_complete: '📋', problem_set_complete: '✏️', lesson_complete: '✅',
      content_view: '🎬', attendance_checkin: '💛', post_create: '🗒️',
      survey_respond: '📋', portfolio_add: '🎨', lesson_progress: '⏳',
      board_view: '👀', diagnosis_complete: '🔎'
    };
    let recentHtml;
    if (recent.length === 0) {
      // 0건 빈상태 통일(스펙 §9) — 친절 빈상태로 교체
      recentHtml = makeEmptyRich('🤝', '참여 활동을 시작해 볼까요?',
        '과제·평가·오늘의 학습·수업에 참여하면 활동 유형별 횟수가 여기에 쌓이고, 종합 참여도 점수도 표시돼요.',
        '나의 클래스에서 새로운 활동 시작하기');
    } else {
      // 활동 유형 Top — 표준 행 골격(아이콘 + 본문(라벨+막대트랙) + 우측 N회)으로 통일(스펙 §2.2)
      // 보강 박스 제거(사족): 리스트가 flow 잔여 높이를 차지하되 행은 세로 가운데로 분산(행간 8px 고정, 헐렁 방지)
      const maxCnt = Math.max(...recent.map(l => l.cnt || 0)) || 1;
      recentHtml = '<div class="domain-flow-list activity-type-bars activity-type-bars--fill">' + recent.map(l => {
        const ico = typeIcon[l.activity_type] || '📌';
        const lbl = toKoActivityType(l.activity_type) || '활동';
        const cnt = l.cnt || 0;
        const w = Math.round((cnt / maxCnt) * 100);
        // 활동유형 → detail type 매핑(스펙 §3). 매핑 없으면 비활성(클릭 불가).
        const dt = ACT_TO_DETAIL_TYPE[l.activity_type];
        const active = !!dt && cnt > 0;
        const dc = drillClass(dt, { active });
        const da = drillAttrs(dt, lbl, { active });
        const chev = dc ? DRILL_CHEVRON : '';
        return '<div class="atb-row' + dc + '"' + da + ' title="' + escapeHtml(lbl + ' ' + cnt + '회') + '">' +
          '<span class="atb-icon">' + ico + '</span>' +
          '<div class="atb-body"><span class="atb-label">' + escapeHtml(lbl) + '</span>' +
          '<div class="atb-track"><div class="atb-fill" style="width:' + w + '%;"></div></div></div>' +
          '<span class="atb-val">' + cnt + '회</span>' + chev +
        '</div>';
      }).join('') + '</div>';
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        makeScoreDonutHtml(score, {
          unit: '점',
          label: '종합 참여도',
          tip: '과제 제출률 · 평가 응시율 · 오늘의 학습 완료율 · 수업 이수율 4개 지표의 평균을 0~100점으로 나타낸 값입니다. (레이더 차트의 참여도 축과 동일)'
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight participation">' + insight + '</div>' +
          tilesHtml +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📈 활동 유형 Top ' + recent.length + '</div>' +
        recentHtml +
      '</div>' +
    '</div>';
  }

  // ---- 성취수준 카드 (정답률 출처별 6종) ----
  function renderAchievementCard(report, areaData) {
    const ad = areaData || {};
    const a = ad.achievement || {};
    const bs = a.bySource || {};
    const score = (ad.donutScore != null) ? Math.round(ad.donutScore)
                : (ad.score != null) ? Math.round(ad.score) : null;
    // 6출처 total 합계로 hasData 판정 (계약 §7.1)
    const SRC_KEYS = ['today_learning','ai_learning','wrong_note','content','class_exam','cbt_exam'];
    const sourceTotal = SRC_KEYS.reduce((s, k) => s + ((bs[k] && bs[k].total) || 0), 0);
    const hasData = (ad.hasData !== false) && (sourceTotal > 0) && (score != null);

    const act = actionLinkFor('achievement');
    const headerHtml = makeDomainHeader('basic', '🎯', '성취수준', {
      actionHref: act.href, actionLabel: act.label
    });

    // 출처별 6종 정의 (스펙 §3)
    const SOURCES = [
      { key: 'today_learning', label: '오늘의 학습',          ico: '📋', c: '#10b981',
        tip: '오늘의 학습에서 푼 퀴즈 문항의 정답률입니다. (정답수 ÷ 응답수)' },
      { key: 'ai_learning',    label: 'AI 맞춤학습',          ico: '🧭', c: '#2563eb',
        tip: 'AI 맞춤학습(진단검사 + 학습맵 추천 경로)에서 푼 문항의 정답률입니다.' },
      { key: 'wrong_note',     label: '오답노트 다시 풀기',   ico: '📝', c: '#f59e0b',
        tip: '오답노트에서 틀린 문항을 다시 풀어 맞힌 비율입니다.' },
      { key: 'content',        label: '콘텐츠 문항 바로 풀기', ico: '🎬', c: '#06b6d4',
        tip: '채움콘텐츠에서 콘텐츠를 보다가 바로 푼 문항의 정답률입니다.' },
      { key: 'class_exam',     label: '채움클래스 평가',      ico: '🎓', c: '#8b5cf6',
        tip: '채움클래스에서 응시한 일반 평가의 정답률입니다.' },
      { key: 'cbt_exam',       label: '채움CBT 감독 평가',    ico: '🛡', c: '#ef4444',
        tip: '채움CBT 감독 모드(이탈 감지)로 응시한 평가의 정답률입니다.' }
    ];

    // 도넛 하단 3타일 재정의 (스펙 §5.3) — tiles 우선, 없으면 bySource 폴백
    const TILES = [
      { key: 'self_directed', label: '자기주도',      c: '#10b981',
        srcs: ['today_learning','ai_learning','content','wrong_note'],
        tip: '오늘의 학습·AI 맞춤학습·콘텐츠 문항·오답노트를 합산한 자기주도 정답률입니다.' },
      { key: 'class_eval',    label: '클래스평가',    c: '#8b5cf6',
        srcs: ['class_exam','cbt_exam'],
        tip: '채움클래스 평가·채움CBT 감독 평가를 합산한 클래스평가 정답률입니다.' },
      { key: 'diagnosis',     label: '진단(기초학력)', c: '#2563eb',
        srcs: ['ai_learning'],
        tip: 'AI 맞춤학습 중 진단검사(기초학력)의 정답률입니다.' }
    ];
    const tileRate = (t) => {
      const td = (a.tiles || {})[t.key];
      if (td && td.rate != null) return td.rate;
      if (td && td.total === 0) return null;
      // 폴백: bySource 가중 평균
      let c = 0, n = 0;
      t.srcs.forEach(k => { const d = bs[k]; if (d && d.total > 0) { c += d.correct; n += d.total; } });
      return n > 0 ? Math.round(c / n * 100) : null;
    };
    // 도넛 3타일 key → detail type 매핑(합산 모달, 스펙 §1-B/§2-2)
    const TILE_DETAIL_TYPE = { self_directed: 'ach_self_directed', class_eval: 'ach_class_eval', diagnosis: 'ach_diagnosis' };
    const buildAchTiles = (showVal) => '<div class="report-metric-tiles" style="--tile-n:3;">' + TILES.map(t => {
      const v = showVal ? tileRate(t) : null;
      const valTxt = (v != null) ? v + '%' : '-';
      const isZero = (v == null);
      const zero = isZero ? ' is-zero' : '';
      const dt = TILE_DETAIL_TYPE[t.key];
      const dc = drillClass(dt, { active: !isZero });
      const da = drillAttrs(dt, t.label, { active: !isZero });
      const chev = dc ? DRILL_CHEVRON : '';
      return '<div class="report-metric-tile' + zero + dc + '"' + da + ' title="' + escapeHtml(t.tip) + '">' +
        '<div class="rmt-value" style="color:' + (v != null ? t.c : 'var(--gray-400)') + ';">' + valTxt + '</div>' +
        '<div class="rmt-label">' + t.label + '</div>' + chev + '</div>';
    }).join('') + '</div>';

    // 출처 6행 key → detail type 매핑(스펙 §1-B). 'content' → content_problem.
    const SRC_DETAIL_TYPE = {
      today_learning: 'today_learning', ai_learning: 'ai_learning', wrong_note: 'wrong_note',
      content: 'content_problem', class_exam: 'class_exam', cbt_exam: 'cbt_exam'
    };
    // 6행 출처별 막대 렌더 (스펙 §7.2)
    const buildSourceRows = () => '<div class="achievement-breakdown">' + SOURCES.map(s => {
      const d = bs[s.key] || { correct: 0, total: 0, rate: null };
      if (d.rate == null || d.total === 0) {
        return '<div class="ach-bd-row is-empty" title="아직 이 출처로 푼 문항이 없습니다.">' +
          '<span class="ach-bd-ico" style="opacity:.5;">' + s.ico + '</span>' +
          '<span class="ach-bd-label">' + s.label + '</span>' +
          '<div class="ach-bd-empty">아직 풀이 기록이 없어요</div></div>';
      }
      const dt = SRC_DETAIL_TYPE[s.key];
      const dc = drillClass(dt, { active: true });
      const da = drillAttrs(dt, s.label, { active: true });
      const chev = dc ? DRILL_CHEVRON : '';
      return '<div class="ach-bd-row' + dc + '"' + da + ' title="' + escapeHtml(s.tip) + '">' +
        '<span class="ach-bd-ico">' + s.ico + '</span>' +
        '<span class="ach-bd-label">' + s.label + '</span>' +
        '<div class="ach-bd-bar"><div class="ach-bd-bar-fill" style="width:' + d.rate + '%;background:' + s.c + ';"></div></div>' +
        '<span class="ach-bd-meta"><strong>' + d.rate + '%</strong> (' + d.correct + '/' + d.total + ')</span>' + chev + '</div>';
    }).join('') + '</div>';

    const donutTip = '오늘의 학습·AI 맞춤학습·콘텐츠 문항·채움클래스 평가·채움CBT 감독 평가에서 푼 전체 문항을 문항수로 가중 평균한 정답률입니다. (오답노트 재풀이는 제외)';

    if (!hasData) {
      const guideMsg = isTeacher
        ? '아직 응시 기록이 없습니다. 학생이 오늘의 학습·AI 맞춤학습·콘텐츠 문항·평가·CBT에 응시하면 출처별 정답률이 표시됩니다.'
        : '오늘의 학습·AI 맞춤학습·콘텐츠 문항·평가·CBT에 응시하면 출처별 정답률이 표시돼요.';
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, {
            empty: true, label: '응시 없음',
            tip: '오늘의 학습·AI 맞춤학습·콘텐츠 문항·평가·CBT에 응시하면 평가 정답률이 표시됩니다.'
          }) +
          '<div class="domain-details">' +
            '<div class="domain-insight achievement">' + guideMsg + '</div>' +
            buildAchTiles(false) +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📚 정답률 출처별 구분 (6종)</div>' +
          makeEmptyRich('🎯', '응시 기록을 쌓아 볼까요?',
            (isTeacher ? '학생이 ' : '') + '오늘의 학습·AI 맞춤학습·콘텐츠 문항·평가·CBT에 응시하면 출처별 정답률이 여기에 표시돼요.',
            'AI 맞춤학습에서 진단검사 시작하기') +
        '</div>' +
      '</div>';
    }

    // 표기 안내 — rate=0%(응시·전부오답)와 회색 안내(미응시)를 구분
    const achNote = '<div class="subject-value-note">표기 안내 · <strong>%</strong> = 응시 후 정답률(0% 포함) · <strong>회색 줄</strong> = 아직 안 풀었어요</div>';

    let insight;
    if (score >= 70) insight = '탄탄한 정답률을 보이고 있습니다. 평가류 문항을 문항수로 가중 평균한 결과입니다.';
    else if (score >= 40) insight = '성장 중인 상태입니다. 꾸준한 학습으로 정답률을 더 높일 수 있어요.';
    else insight = '보충 학습을 권장합니다. AI 맞춤학습에서 약점 영역을 채워보세요.';

    // 보조 flow — 최근 응시 기록 (learningCapacity 활용, ≤3건, 0건이면 제거)
    const lc = report.learningCapacity || [];
    const assessTypes = ['exam_complete','diagnosis_complete','problem_set_complete','daily_complete'];
    const recent = lc.filter(l => assessTypes.indexOf(l.activity_type) >= 0 && (l.cnt||0) > 0)
                     .sort((a,b) => (b.cnt||0) - (a.cnt||0))
                     .slice(0, 3);
    let recentFlowHtml = '';
    if (recent.length > 0) {
      const typeIcon = { exam_complete: '🎓', diagnosis_complete: '🔎', problem_set_complete: '✏️', daily_complete: '📋' };
      const recentRows = '<div class="domain-flow-list">' + recent.map(l => {
        const ico = typeIcon[l.activity_type] || '📝';
        const lbl = toKoActivityType(l.activity_type) || '활동';
        const avg = l.avg_score != null ? Math.round(l.avg_score * 100) + '점' : '-';
        return '<div class="domain-flow-row">' +
          '<div class="domain-flow-row-icon">' + ico + '</div>' +
          '<div class="domain-flow-row-body">' +
            '<div class="domain-flow-row-head"><span class="domain-flow-row-label">' + escapeHtml(lbl) + '</span><span class="domain-flow-row-date">' + (l.cnt||0) + '회 · 평균 ' + avg + '</span></div>' +
          '</div>' +
        '</div>';
      }).join('') + '</div>';
      recentFlowHtml =
        '<div class="domain-flow" style="flex:0 0 auto;margin-top:12px;padding-top:12px;">' +
          '<div class="domain-flow-title">📝 최근 응시 기록 (' + recent.length + '건)</div>' +
          recentRows +
        '</div>';
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        makeScoreDonutHtml(score, {
          unit: '점',
          label: '평가 정답률',
          tip: donutTip
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight achievement">' + insight + '</div>' +
          buildAchTiles(true) +
          achNote +
        '</div>' +
      '</div>' +
      '<div class="domain-flow" style="flex:1 1 auto;">' +
        '<div class="domain-flow-title">📚 정답률 출처별 구분 (6종)</div>' +
        buildSourceRows() +
      '</div>' +
      recentFlowHtml +
    '</div>';
  }

  // ---- 콘텐츠 활용 카드 (5블록 통일) ----
  function renderContentUsageCard(report, areaData) {
    const ad = areaData || {};
    const hasData = ad.hasData !== false;
    const score = ad.score != null ? Math.round(ad.score) : null;
    const cu = report.contentUsage || {};
    const saved = cu.savedContents || 0;
    const viewed = cu.viewedContents || 0;
    const likes = cu.totalLikes || 0;
    const subs = cu.mySubscriptions || 0;
    const keywords = cu.searchKeywords || [];

    const act = actionLinkFor('content');
    const headerHtml = makeDomainHeader('content', '📊', '콘텐츠 활용', {
      actionHref: act.href, actionLabel: act.label
    });

    const subMetrics = [
      { label: '저장',  v: saved,  c: '#2563eb',
        tip: '채움콘텐츠에서 "나의 보관함"에 저장한 콘텐츠 수입니다.' },
      { label: '조회',  v: viewed, c: '#10b981',
        tip: '내가 채움콘텐츠/수업을 조회(재생)한 총 횟수입니다.' },
      { label: '좋아요', v: likes,  c: '#ec4899',
        tip: '내가 채움콘텐츠에 누른 좋아요 총 개수입니다.' },
      { label: '구독',  v: subs,   c: '#8b5cf6',
        tip: '내가 구독 중인 채널/큐레이션 수입니다.' }
    ];

    if (!hasData || score == null) {
      let barsEmpty = '';
      subMetrics.forEach(m => {
        barsEmpty += '<div class="subject-item" title="' + escapeHtml(m.tip) + '">' +
          '<span class="subject-name" style="flex:0 0 64px;">' + m.label + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:0%;background:var(--gray-300)"></div></div>' +
          '<span class="subject-value" style="color:var(--gray-400);">0건</span></div>';
      });
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, { empty: true, label: '활용 없음' }) +
          '<div class="domain-details">' +
            '<div class="domain-insight content">아직 콘텐츠 활용 기록이 없습니다. 채움콘텐츠를 둘러보면 활용 점수가 쌓입니다.</div>' +
            '<div class="subject-growth">' + barsEmpty + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">🔍 자주 조회한 콘텐츠 유형</div>' +
          makeEmptyRich('📊', '콘텐츠를 둘러볼까요?',
            '채움콘텐츠를 조회·저장·구독하면 자주 본 콘텐츠 유형과 활용 점수가 여기에 표시돼요.',
            '채움콘텐츠에서 관심 콘텐츠 찾아보기') +
        '</div>' +
      '</div>';
    }

    // sub-metric 막대 (절대값 → 100 기준 정규화: 최대값을 100%로)
    const maxVal = Math.max(saved, viewed, likes, subs, 1);
    let barsHtml = '';
    subMetrics.forEach(m => {
      const w = Math.round((m.v / maxVal) * 100);
      barsHtml += '<div class="subject-item" title="' + escapeHtml(m.tip) + '">' +
        '<span class="subject-name" style="flex:0 0 64px;">' + m.label + '</span>' +
        '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + w + '%;background:' + m.c + '"></div></div>' +
        '<span class="subject-value">' + m.v + '건</span></div>';
    });

    let insight;
    if (score >= 70) insight = '<strong>활발히 활용</strong>하고 있어요. 총 ' + viewed + '건 조회, ' + saved + '건 저장했습니다.';
    else if (score >= 40) insight = '꾸준히 콘텐츠를 둘러보고 있어요. 더 다양한 콘텐츠를 탐색해 보세요.';
    else insight = '콘텐츠를 더 둘러보세요. 채움콘텐츠에서 관심 분야를 탐색할 수 있습니다.';

    // 추가 활용 지표 (조회·포트폴리오 등 BE에서 가용한 모든 지표를 칩으로)
    //  콘텐츠활용 신호(#4): area.signals.completed/attempted 를 "완료·퀴즈"로 함께 노출.
    const portfolioCount = cu.portfolioCount || 0;
    const sig = (ad.signals) || {};
    const sigCompleted = sig.completed || 0;
    const sigAttempted = sig.attempted || 0;
    const usageMetrics = [
      { label: '📥 저장', v: saved, type: 'content_saved', tip: '나의 보관함에 저장한 콘텐츠 수' },
      { label: '👀 조회', v: viewed, type: 'content_viewed', tip: '채움콘텐츠/수업 누적 조회수' },
      { label: '✅ 완료', v: sigCompleted, type: null, tip: '끝까지 학습을 완료한 콘텐츠 수입니다.' },
      { label: '✏️ 퀴즈', v: sigAttempted, type: null, tip: '콘텐츠 내 퀴즈를 풀어본 콘텐츠 수입니다.' },
      { label: '🔔 구독', v: subs, type: 'content_subscribed', tip: '구독 중인 채널/큐레이션 수' },
      { label: '🎨 포트폴리오', v: portfolioCount, type: 'content_portfolio', tip: '나도예술가/포트폴리오에 등록한 작품 수' }
    ];
    const usageGridHtml = '<div class="usage-metric-grid">' + usageMetrics.map(u => {
      const isZero = (u.v === 0);
      const zero = isZero ? ' is-zero' : '';
      const dc = drillClass(u.type, { active: !isZero });
      const da = drillAttrs(u.type, u.label, { active: !isZero });
      const chev = dc ? DRILL_CHEVRON : '';
      return '<div class="usage-metric-cell' + zero + dc + '"' + da + ' title="' + escapeHtml(u.tip) + '">' +
        '<span class="um-label">' + u.label + '</span>' +
        '<strong>' + (u.v || 0) + '건</strong>' + chev +
      '</div>';
    }).join('') + '</div>';

    // 블록 E — 자주 조회한 콘텐츠 유형 Top 8 (영문 코드값 → 한글 매핑)
    let kwHtml;
    if (keywords.length === 0) {
      kwHtml = '<div class="domain-flow-empty">아직 콘텐츠 조회 기록이 없습니다.</div>';
    } else {
      kwHtml = '<div class="domain-chips">' + keywords.slice(0, 8).map(k => {
        const ko = toKoContentKeyword(k.keyword || '');
        return '<span class="domain-chip" title="내가 자주 조회한 콘텐츠 유형과 조회 횟수입니다.">' + escapeHtml(ko) + '<span class="domain-chip-cnt">' + (k.cnt || 0) + '회</span></span>';
      }).join('') + '</div>';
    }

    // 블록 E 보강 — 자주 활용한 성취기준 Top 5 (achievementStandards 활용)
    const standards = (cu.achievementStandards || [])
      .filter(s => (s.cnt || 0) > 0)
      .sort((a, b) => (b.cnt || 0) - (a.cnt || 0))
      .slice(0, 5);
    let standardsHtml = '';
    if (standards.length > 0) {
      const maxCnt = Math.max.apply(null, standards.map(s => s.cnt || 0));
      standardsHtml =
        '<div class="domain-flow" style="margin-top:12px;padding-top:12px;">' +
          '<div class="domain-flow-title">🏷️ 자주 활용한 성취기준 Top ' + standards.length + '</div>' +
          '<div class="standard-list">' +
            standards.map(s => {
              const pct = maxCnt > 0 ? Math.round((s.cnt || 0) / maxCnt * 100) : 0;
              return '<div class="standard-row" title="' + escapeHtml('성취기준 ' + (s.code || '') + ' · 활용 ' + (s.cnt||0) + '회') + '">' +
                '<code>' + escapeHtml(s.code || '-') + '</code>' +
                '<div class="std-bar"><div class="std-bar-fill" style="width:' + pct + '%;"></div></div>' +
                '<span class="std-cnt">' + (s.cnt || 0) + '회</span>' +
              '</div>';
            }).join('') +
          '</div>' +

    // 콘텐츠가 희박할 때(키워드 적고 성취기준 없음)만 하단 void를 보강 카드로 흡수(스펙 §9·§4.2).
    // 콘텐츠 풍부 카드는 그리드 최대높이 기준이므로 보강 카드를 붙이지 않아 높이를 부풀리지 않음.
    const cuSparse = keywords.length <= 4 && standards.length === 0;

          '조회·저장·구독을 늘리면 활용 점수가 올라가요.',
          '채움콘텐츠에서 관심 콘텐츠 찾아보기')
      : '';

    return '<div class="section-card">' + headerHtml +

        makeScoreDonutHtml(score, {

          label: '활용 점수',
          tip: '저장 · 조회 · 좋아요 · 구독 등 콘텐츠 활용 누적 건수를 구간화한 점수입니다.'
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight content">' + insight + '</div>' +
          '<div class="subject-growth">' + barsHtml + '</div>' +
          usageGridHtml +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">🔍 자주 조회한 콘텐츠 유형 (Top ' + Math.min(keywords.length, 8) + ')</div>' +
        kwHtml +
        cuBoost +
      '</div>' +
      standardsHtml +
    '</div>';
  }

  function renderBasicAcademicsCard(report, areaData) {
    let diagnoses = report.academicFoundation || [];

    // 예시 데이터 (실제 기록이 없을 때 시연용으로 표시)
    if (!hasData) {
      diagnoses = [
        { target_node_id: '국어', correct_count: 16, total_questions: 20 },
        { target_node_id: '수학', correct_count: 13, total_questions: 20 },
        { target_node_id: '영어', correct_count: 14, total_questions: 20 },
        { target_node_id: '사회', correct_count: 17, total_questions: 20 },
        { target_node_id: '과학', correct_count: 12, total_questions: 20 }
      ];
    }

    let content = '';
    {
      // Group by target_node_id as subject proxy
      const subjectMap = {};

        subjectMap[key].push(d);
      });

      const overallCorrect = diagnoses.reduce((s, d) => s + (d.correct_count || 0), 0);

      const reached = overallPct >= 60;

      let subjectsHtml = '';

        const c = items.reduce((s, d) => s + (d.correct_count || 0), 0);
        const t = items.reduce((s, d) => s + (d.total_questions || 0), 0);
        const pct = t > 0 ? Math.round(c / t * 100) : 0;
        const statusClass = pct >= 80 ? 'reached' : pct >= 60 ? 'warning' : 'not-reached';

          '<span class="basic-subject-name">' + escapeHtml(subj.length > 4 ? subj.substring(0, 4) : subj) + '</span>' +

          '<span class="basic-subject-value">' + pct + '%</span>' +
          '<span class="basic-subject-status ' + statusClass + '">' + statusText + '</span></div>';

      content = '<div class="basic-content">' +

        '</div>' +

  function renderLearningCapacityCard(report, areaData) {
    const learningStats = report.learningCapacity || [];
    const hasData = learningStats.length > 0;
    const score = areaData ? areaData.score : 0;

    // 학습 활동 데이터 기반 5축 계산
    const totalCntAll = learningStats.reduce((s, l) => s + l.cnt, 0);
    const avgScoreAll = learningStats.length > 0
      ? learningStats.filter(l => l.avg_score != null).reduce((s, l) => s + (l.avg_score || 0), 0) / Math.max(1, learningStats.filter(l => l.avg_score != null).length) * 100
      : 0;
    const typeVariety = Math.min(100, learningStats.length * 15); // 활동 유형 다양성
    const axes = {
      '학습충실도': Math.min(100, Math.round(totalCntAll > 0 ? Math.min(totalCntAll * 2, 100) : 0)),
      '학습전략': Math.min(100, Math.round(typeVariety)),
      '학습성취': Math.min(100, Math.round(avgScoreAll)),
      '학습집중': Math.min(100, Math.round(score * 0.9)),
      '학업자존감': Math.min(100, Math.round(score > 0 ? score * 0.85 + typeVariety * 0.15 : 0))
    };

    // Build subject usage bars from learningStats
    let subjectHtml = '';
    if (learningStats.length > 0) {
      const totalCnt = learningStats.reduce((s, l) => s + l.cnt, 0);
      const subjectColors = ['var(--primary)', 'var(--warning)', 'var(--danger)', 'var(--secondary)', 'var(--purple)'];
      learningStats.slice(0, 5).forEach((l, i) => {
        const pct = totalCnt > 0 ? Math.round(l.cnt / totalCnt * 100) : 0;
        const avgPct = l.avg_score != null ? Math.round(l.avg_score * 100) : 0;
        subjectHtml += '<div class="subject-item">' +
          '<span class="subject-name">' + escapeHtml(toKoActivityType(l.activity_type) || '기타') + '</span>' +
          '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + pct + '%;background:' + subjectColors[i % subjectColors.length] + '"></div></div>' +
          '<span class="subject-value">' + pct + '%</span></div>';
      });

    if (!hasData) {
      subjectHtml = '<div style="text-align:center;color:var(--gray-400);font-size:13px;padding:8px;">활동 데이터가 부족합니다.</div>';
    }

    // Insight text
    let insightText = '';
    if (hasData) {
      const topActivity = [...learningStats].sort((a, b) => b.cnt - a.cnt)[0];
      insightText = '<strong>' + escapeHtml(toKoActivityType(topActivity.activity_type) || '학습') + '</strong> 활동이 가장 활발합니다. ';
      if (topActivity.avg_score != null) {
        insightText += '평균 점수 ' + Math.round(topActivity.avg_score * 100) + '%를 기록했습니다.';
      }
    } else {
      insightText = '아직 학습 활동 데이터가 충분하지 않습니다.';
    }

    // 데이터 기반 레이더 폴리곤 좌표 계산 (5축)
    // 중심 (50%, 50%), 반지름 50%. 각 축: top, right(72deg), bottom-right(144deg), bottom-left(216deg), left(288deg)
    const axisKeys = ['학습충실도', '학습전략', '학습성취', '학습집중', '학업자존감'];
    const angles = [-90, -18, 54, 126, 198]; // degrees, 시계방향 위→오→아래오→아래왼→왼
    const pts = axisKeys.map((k, i) => {
      const r = (axes[k] || 0) / 100 * 50; // % 반지름
      const rad = angles[i] * Math.PI / 180;
      const x = 50 + r * Math.cos(rad);
      const y = 50 + r * Math.sin(rad);
      return x.toFixed(1) + '% ' + y.toFixed(1) + '%';
    }).join(', ');
    const hasAxes = Object.values(axes).some(v => v > 0);
    const polygonStyle = hasAxes ? 'clip-path: polygon(' + pts + ');' : 'display:none;';

    let axisListHtml = '';
    axisKeys.forEach(k => {
      axisListHtml += '<div class="subject-item">' +
        '<span class="subject-name">' + k + '</span>' +
        '<div class="subject-bar"><div class="subject-bar-fill" style="width:' + (axes[k] || 0) + '%;background:var(--primary);"></div></div>' +
        '<span class="subject-value">' + (axes[k] || 0) + '</span></div>';
    });

    return '<div class="section-card">' +
      '<div class="section-header"><div class="section-title"><div class="section-icon learning">\uD83D\uDCDA</div> 학습 역량</div></div>' +
      '<div class="learning-content">' +
        '<div class="radar-chart">' +
          '<div class="radar-placeholder">' +
            '<div class="radar-polygon" style="' + polygonStyle + '"></div>' +
            '<div class="radar-labels">' +
              '<span class="radar-label top">학습충실도 ' + (axes['학습충실도'] || 0) + '</span>' +
              '<span class="radar-label right">학습전략 ' + (axes['학습전략'] || 0) + '</span>' +
              '<span class="radar-label bottom-right">학습성취 ' + (axes['학습성취'] || 0) + '</span>' +
              '<span class="radar-label bottom-left">학습집중 ' + (axes['학습집중'] || 0) + '</span>' +
              '<span class="radar-label left">학업자존감 ' + (axes['학업자존감'] || 0) + '</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div class="learning-details">' +
          '<div class="learning-insight">' + insightText + '</div>' +
          '<div class="subject-growth">' + subjectHtml + '</div>' +
        '</div>' +
      '</div></div>';
  }

  // ── 오늘의 학습 — 폼팩터 보조 함수 3종 ────────────────────────────
  // 로컬 시간대 기준 YYYY-MM-DD 포맷 (UTC 변환 회피)
  function fmtLocalDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }
  // A. 요일 캘린더 (N <= 14)
  function renderDailyCalendarA(n, completedSet) {
    const dayNames = ['일','월','화','수','목','금','토'];
    const today = new Date();
    let cells = '';
    for (let i = n - 1; i >= 0; i--) {
      const d = new Date(today); d.setDate(d.getDate() - i);
      const ds = fmtLocalDate(d);
      const lbl = dayNames[d.getDay()];
      const done = completedSet.has(ds);
      const tip = ds + ' (' + lbl + ') · ' + (done ? '완료' : '미완료');
      cells += '<div class="calendar-day ' + (done ? 'completed' : 'none') +
               '" data-tip="' + tip + '" aria-label="' + tip + '">' + lbl + '</div>';
    }
    return '<div class="calendar-days">' + cells + '</div>';
  }

  // B. 히트맵 (15 <= N <= 90)
  function renderDailyCalendarB(n, completedSet) {
    const dayNames = ['월','화','수','목','금','토','일'];
    const today = new Date(); today.setHours(0,0,0,0);
    const start = new Date(today); start.setDate(start.getDate() - (n - 1));
    // 시작일이 속한 주의 월요일 (월=0 ... 일=6)
    const startDow = (start.getDay() + 6) % 7;
    const gridStart = new Date(start); gridStart.setDate(gridStart.getDate() - startDow);
    const endDow = (today.getDay() + 6) % 7;
    const gridEnd = new Date(today); gridEnd.setDate(gridEnd.getDate() + (6 - endDow));
    // [2026-08-06] off-by-one 수정 — 빈 주차열이 하나 더 그려지던 것.
    //   결함: `Math.round((gridEnd-gridStart)/86400000/7) + 1`
    //   gridStart(주 월요일)~gridEnd(주 일요일)의 **차이**는 이미 (주수×7 - 1)일이라
    //   7로 나눠 반올림하면 그 자체가 주 수다. 거기에 +1 을 또 더해 **항상 1주 초과**했다.
    //   예) 2026-08-06 기준 30일 → gridStart 7/6 · gridEnd 8/9 → 34/7=4.857→5, +1 = 6주.
    //   실제 필요한 건 5주. 6번째 열의 칸은 전부 범위 밖(.out, 투명)이라 셀은 안 보이고
    //   **머리글 "8/10" 만 덩그러니 남아** 사용자가 "이 열은 뭐냐"고 지적했다.
    //   → 양끝 포함 일수(diff+1)를 7로 나눈다.
    const weeks = Math.round(((gridEnd - gridStart) / 86400000 + 1) / 7);
    const wrapCls = 'heatmap-wrap weeks-' + (weeks <= 6 ? 5 : 13);
    // 주차열을 1fr 균등 분할 → 메인 컬럼 폭을 꽉 채움(우측 빈 공간 제거).
    // 셀 상한은 CSS .heatmap-cell { max-width:40px; aspect-ratio:1 }이 담당.
    let html = '<div class="' + wrapCls + '" style="grid-template-columns: 24px repeat(' + weeks + ', minmax(0, 1fr));">';
    // 첫 행: 왼쪽 빈칸 + 주차 라벨 (각 주 월요일 M/D)
    html += '<div></div>';
    for (let w = 0; w < weeks; w++) {
      const colMon = new Date(gridStart); colMon.setDate(colMon.getDate() + w * 7);
      html += '<div class="heatmap-col-label">' + (colMon.getMonth() + 1) + '/' + colMon.getDate() + '</div>';
    }
    // 7행 × weeks열
    for (let row = 0; row < 7; row++) {
      html += '<div class="heatmap-row-label">' + dayNames[row] + '</div>';
      for (let w = 0; w < weeks; w++) {
        const d = new Date(gridStart); d.setDate(d.getDate() + w * 7 + row);
        const ds = fmtLocalDate(d);
        const inRange = d >= start && d <= today;
        const isToday = d.getTime() === today.getTime();
        const done = completedSet.has(ds);
        let cls = 'heatmap-cell';
        if (!inRange) cls += ' out';
        else if (done) cls += ' done';
        if (isToday) cls += ' today';
        const tip = inRange ? ds + ' · ' + (done ? '완료' : '미완료') : '';
        const aria = inRange ? ' aria-label="' + tip + '"' : '';
        html += '<div class="' + cls + '"' + (tip ? ' data-tip="' + tip + '"' : '') + aria + '></div>';
      }
    }
    html += '</div>';
    html += '<div class="heatmap-legend"><span><span class="lg-dot lg-done"></span>완료</span>' +
            '<span><span class="lg-dot lg-miss"></span>미완료</span></div>';
    return html;
  }

  // C. 주/월 요약 막대 (N >= 91 또는 all)
  function renderDailyCalendarC(n, completedSet, periodKey) {
    const today = new Date(); today.setHours(0,0,0,0);
    const buckets = [];
    let startStr = '';
    if (periodKey === 'all') {
      const dates = Array.from(completedSet).sort();
      if (!dates.length) {
        // 빈 데이터: 오늘이 속한 1개월 막대 fallback
        const y = today.getFullYear(), m = today.getMonth();
        const dim = new Date(y, m + 1, 0).getDate();
        buckets.push({ doneCnt: 0, totalCnt: dim, tip: y + '-' + String(m+1).padStart(2,'0') + ' · 완료 0/' + dim + '일' });
        startStr = fmtLocalDate(today);
      } else {
      let cur = new Date(dates[0] + 'T00:00:00');
      cur.setDate(1);
      startStr = dates[0];
      while (cur <= today) {
        const y = cur.getFullYear(), m = cur.getMonth();
        const dim = new Date(y, m + 1, 0).getDate();
        let doneCnt = 0;
        for (let i = 1; i <= dim; i++) {
          const ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(i).padStart(2,'0');
          if (completedSet.has(ds)) doneCnt++;
        }
        buckets.push({
          doneCnt, totalCnt: dim,
          tip: y + '-' + String(m+1).padStart(2,'0') + ' · 완료 ' + doneCnt + '/' + dim + '일'
        });
        cur.setMonth(cur.getMonth() + 1);
      }
      } // end else (dates.length>0)
    } else {
      // 주별 (n일 → ceil(n/7) 막대)
      const start = new Date(today); start.setDate(start.getDate() - (n - 1));
      startStr = fmtLocalDate(start);
      const startDow = (start.getDay() + 6) % 7;
      const weekStart = new Date(start); weekStart.setDate(weekStart.getDate() - startDow);
      let cur = new Date(weekStart);
      while (cur <= today) {
        const wkEnd = new Date(cur); wkEnd.setDate(wkEnd.getDate() + 6);
        let doneCnt = 0, totalCnt = 0;
        for (let i = 0; i < 7; i++) {
          const d = new Date(cur); d.setDate(d.getDate() + i);
          if (d < start || d > today) continue;
          totalCnt++;
          const ds = fmtLocalDate(d);
          if (completedSet.has(ds)) doneCnt++;
        }
        buckets.push({
          doneCnt, totalCnt: totalCnt || 7,
          tip: fmtLocalDate(cur) + ' ~ ' + fmtLocalDate(wkEnd) + ' · 완료 ' + doneCnt + '/' + (totalCnt || 7) + '일'
        });
        cur.setDate(cur.getDate() + 7);
      }
    }
    let html = '<div class="weekbar-wrap">';
    let totalDone = 0, totalAll = 0;
    buckets.forEach(b => {
      const rate = b.totalCnt ? b.doneCnt / b.totalCnt : 0;
      const fillCls = rate >= 0.5 ? 'fill-high' : (rate > 0 ? 'fill-low' : '');
      // 막대 높이는 컨테이너(.weekbar-wrap) 높이 대비 비율(%). flex로 폭은 균등.
      const hPct = Math.max(6, Math.round(rate * 100));
      html += '<div class="weekbar-col"><div class="weekbar ' + fillCls + '" style="height:' + hPct + '%;" data-tip="' + b.tip + '" aria-label="' + b.tip + '"></div></div>';
      totalDone += b.doneCnt; totalAll += b.totalCnt;
    });
    html += '</div>';
    const endStr = fmtLocalDate(today);
    html += '<div class="weekbar-meta"><span>' + startStr + '</span><span>' + endStr + '</span></div>';
    const rate = totalAll ? Math.round(totalDone/totalAll*100) : 0;
    html += '<div class="weekbar-summary">완료 <strong>' + totalDone + '일</strong> / ' + totalAll + '일 (' + rate + '%)</div>';
    return html;
  }

  // 오늘의 학습 본문 (section-card 래퍼 제외 — 별도 섹션에서 헤더와 함께 사용)
  function renderDailyLearningBody(report) {
    const daily = report.dailyLearning || {};
    const total = daily.total || 0;
    const completed = daily.completed || 0;
    const rate = total > 0 ? Math.round(completed / total * 100) : 0;
    // 평균 정답률(서버에서 누적 정답수/총 문항수 기반 산출). 데이터 없으면 '-'
    const accuracy = (daily.avgAccuracy != null) ? daily.avgAccuracy : null;

    // 실제 데이터 기반 연속일
    const streak = daily.maxStreak || 0;
    const recentDays = daily.recentDays || [];

    // 기간 동기화 — currentPeriod.days: 7 | 30 | 90 | 180 | 'all'
    const periodDays = currentPeriod.days;
    const completedSet = new Set(recentDays);

    // (1) 라벨 — 기간 동적 표기
    let periodLabel;
    if (periodDays === 'all' || periodDays === null) {
      const sorted = recentDays.slice().sort();
      const todayStr = fmtLocalDate(new Date());
      periodLabel = sorted.length
        ? sorted[0] + ' ~ ' + todayStr + ' 학습 현황'
        : '전체 기간 학습 현황';
    } else {
      const dNum = parseInt(periodDays);
      if (dNum === 180) periodLabel = '최근 6개월 학습 현황';
      else periodLabel = '최근 ' + dNum + '일 학습 현황';
    }

    // (2) 폼팩터 결정
    let N;
    if (periodDays === 'all' || periodDays === null) {
      const sorted = recentDays.slice().sort();
      N = sorted.length
        ? Math.max(1, Math.ceil((Date.now() - new Date(sorted[0] + 'T00:00:00').getTime()) / 86400000) + 1)
        : 30;
    } else {
      N = parseInt(periodDays);
    }
    let calendarBody;
    const isAll = (periodDays === 'all' || periodDays === null);
    if (isAll) {
      // 전체 기간은 N과 무관하게 월별 막대(C형)
      calendarBody = renderDailyCalendarC(N, completedSet, 'all');
    } else if (N <= 14) {
      calendarBody = renderDailyCalendarA(N, completedSet);
    } else if (N <= 90) {
      calendarBody = renderDailyCalendarB(N, completedSet);
    } else {
      calendarBody = renderDailyCalendarC(N, completedSet, periodDays);
    }

    const insightText = total > 0
      ? '이번 기간 <strong>' + completed + '회</strong> 학습을 완료했습니다. 완료율은 <strong>' + rate + '%</strong>입니다.'
      : '아직 오늘의 학습 기록이 없습니다.';

    // 우측 사이드 패널 — 이번 기간 인사이트
    const sortedDates = (recentDays || []).slice().sort();
    const lastDate = sortedDates.length ? sortedDates[sortedDates.length - 1] : null;
    const firstDate = sortedDates.length ? sortedDates[0] : null;
    let sidePanelHtml;
    if (total === 0 && (recentDays || []).length === 0) {
      sidePanelHtml =
        '<div class="daily-side-panel">' +
          '<h4>📊 이번 기간 인사이트</h4>' +
          '<div class="empty-msg">아직 학습 기록이 없습니다.<br>오늘의 학습을 시작해 보세요.</div>' +
        '</div>';
    } else {
      sidePanelHtml =
        '<div class="daily-side-panel">' +
          '<h4>📊 이번 기간 인사이트</h4>' +
          '<div class="insight-row' + (streak === 0 ? ' is-zero' : '') + '" title="기간 내 최대 연속 학습일">' +
            '<span class="ir-label">🔥 최대 연속</span>' +
            '<strong>' + (streak > 0 ? streak + '일' : '—') + '</strong>' +
          '</div>' +
          '<div class="insight-row' + (accuracy == null ? ' is-zero' : '') + '" title="기간 내 오늘의 학습 평균 정답률">' +
            '<span class="ir-label">🎯 평균 정답률</span>' +
            '<strong>' + (accuracy != null ? accuracy + '%' : '—') + '</strong>' +
          '</div>' +
          '<div class="insight-row-stack" title="배정 대비 완료한 비율">' +
            '<div class="irs-head">' +
              '<span class="ir-label">✅ 완료율</span>' +
              '<strong>' + rate + '%</strong>' +
            '</div>' +
            '<div class="insight-bar"><div class="insight-bar-fill" style="width:' + Math.min(100, rate) + '%;"></div></div>' +
            '<span style="font-size:13px;color:var(--gray-500);">' + completed + ' / ' + total + '회</span>' +
          '</div>' +
          (lastDate ?
            '<div class="insight-row" title="최근 학습한 날짜">' +
              '<span class="ir-label">📅 최근 학습</span>' +
              '<strong style="font-size:14px;">' + escapeHtml(lastDate) + '</strong>' +
            '</div>' : '') +
          (firstDate && firstDate !== lastDate ?
            '<div class="insight-row" title="기간 내 첫 학습 시작일">' +
              '<span class="ir-label">⏱️ 시작일</span>' +
              '<strong style="font-size:14px;">' + escapeHtml(firstDate) + '</strong>' +
            '</div>' : '') +
          '<div class="insight-row" title="기간 내 학습한 날짜 수">' +
            '<span class="ir-label">📈 학습일 수</span>' +
            '<strong>' + sortedDates.length + '일</strong>' +
          '</div>' +
        '</div>';
    }

    return '<div class="daily-content-grid">' +
        '<div class="daily-stats">' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + completed + '<span class="daily-stat-unit">회</span></div><div class="daily-stat-label">총 활동횟수</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + (accuracy != null ? accuracy : '-') + '<span class="daily-stat-unit">' + (accuracy != null ? '%' : '') + '</span></div><div class="daily-stat-label">평균 정답률</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + rate + '<span class="daily-stat-unit">%</span></div><div class="daily-stat-label">완료율</div></div>' +
          '<div class="daily-stat-item"><div class="daily-stat-value">' + streak + '<span class="daily-stat-unit">일</span></div><div class="daily-stat-label">최대 연속일</div></div>' +
        '</div>' +
        '<div class="daily-details">' +
          '<div class="daily-insight">' + insightText + '</div>' +
          '<div class="daily-calendar">' +
            '<div class="calendar-label">' + periodLabel + '</div>' +
            calendarBody +
          '</div>' +
        '</div>' +
        sidePanelHtml +
      '</div>';
  }

  function renderReadingActivityCard(report, areaData) {
    const ad = areaData || {};
    const hasData = ad.hasData !== false;
    const score = ad.score != null ? Math.round(ad.score) : null;
    const reading = report.readingActivity || {};
    const books = reading.books || [];
    const count = reading.count || books.length || 0;

    const act = actionLinkFor('reading');
    const headerHtml = makeDomainHeader('reading', '📖', '독서 활동', {
      actionHref: act.href, actionLabel: act.label, actionArrow: act.arrow
    });

    // 빈 상태 — 레이더 축(0)과 일치하도록 빈 도넛 + placeholder
    if (!hasData || score == null || count === 0) {
      return '<div class="section-card">' + headerHtml +
        '<div class="domain-card-body">' +
          makeScoreDonutHtml(null, {
            empty: true, label: '독서 기록 없음',
            tip: '우리반 성장기록 > 독서 기록에 등록된 누적 권수를 0~100점으로 환산합니다.'
          }) +
          '<div class="domain-details domain-details-empty">' +
            '<div class="domain-insight reading">아직 독서 기록이 없습니다. 읽은 책을 등록하면 독서 활동 점수가 표시됩니다.</div>' +
          '</div>' +
        '</div>' +
        '<div class="domain-flow">' +
          '<div class="domain-flow-title">📚 최근 읽은 책 (0건)</div>' +
          '<div class="domain-empty-rich">' +
            '<div class="der-icon">📖</div>' +
            '<div class="der-title">아직 읽은 책이 없어요</div>' +
            '<div class="der-text">독서 기록을 남기면 읽은 책과 별점이 여기에 표시됩니다.</div>' +
            '<div class="der-hint">아래 ‘독서 기록’에서 책을 등록해 보세요</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    }

    // 인사이트
    let insight;
    if (count >= 10) insight = '<strong>활발한 독서</strong>를 하고 있어요. 누적 <strong>' + count + '권</strong>을 읽었습니다.';
    else if (count >= 3) insight = '꾸준한 독서를 이어가고 있어요. 누적 <strong>' + count + '권</strong>을 읽었습니다.';
    else insight = '독서 활동을 조금 더 늘려보세요. 책 한 권부터 시작해도 좋아요.';

    // 평균 별점(등록된 별점 보유 책 기준)
    const rated = books.map(b => b.rating != null ? Number(b.rating) : (b.score != null ? Number(b.score) : null)).filter(v => v != null && !isNaN(v));
    const avgRating = rated.length ? Math.round(rated.reduce((s, v) => s + v, 0) / rated.length * 10) / 10 : null;

    // 보조지표 타일줄(스펙 §4.1) — chips 승격: 누적 N권 · 평균 별점 · 등록 N권 3타일
    const readDc = drillClass('reading', { active: count > 0 });
    const readDa = drillAttrs('reading', '독서 기록', { active: count > 0 });
    const subHtml = '<div class="report-metric-tiles" style="--tile-n:3;">' +
      '<div class="report-metric-tile' + readDc + '"' + readDa + ' title="우리반 성장기록 > 독서 기록에 학생이 직접 등록한 책 권수 누적입니다.">' +
        '<div class="rmt-value" style="color:var(--warning);">' + count + '</div><div class="rmt-label">누적(권)</div>' + (readDc ? DRILL_CHEVRON : '') + '</div>' +
      '<div class="report-metric-tile' + (avgRating == null ? ' is-zero' : '') + '" title="별점이 등록된 책들의 평균 별점입니다.">' +
        '<div class="rmt-value">' + (avgRating != null ? avgRating + '★' : '-') + '</div><div class="rmt-label">평균 별점</div></div>' +
      '<div class="report-metric-tile" title="독서 기록에 등록된 책 권수입니다.">' +
        '<div class="rmt-value">' + books.length + '</div><div class="rmt-label">등록(권)</div></div>' +
    '</div>';

    // 블록 E — 읽은 책 (5건 요약 + 공통 토글, 스펙 §3)
    const renderBookRow = function(b) {
      const rating = (b.rating || b.score);
      let starsHtml = '';
      if (rating != null) {
        const r = Math.max(0, Math.min(5, Math.round(Number(rating))));
        starsHtml = '<span class="book-row-stars" title="별점 ' + r + '점">' + '★'.repeat(r) + '☆'.repeat(5 - r) + '</span>';
      }
      const bDc = drillClass('reading', { active: true });
      const bDa = drillAttrs('reading', '독서 기록', { active: true });
      return '<div class="domain-flow-row' + bDc + '"' + bDa + '>' +
        '<div class="domain-flow-row-icon">📗</div>' +
        '<div class="domain-flow-row-body">' +
          '<div class="domain-flow-row-head"><span class="domain-flow-row-label">' + escapeHtml(b.book_title || b.bookTitle || '') + '</span>' + starsHtml + '<span class="domain-flow-row-date">' + formatDate(b.read_date || b.readDate || '') + '</span></div>' +
          '<div class="domain-flow-row-desc">' + escapeHtml(b.author || '') + '</div>' +
        '</div>' + DRILL_CHEVRON +
      '</div>';
    };
    let booksHtml;
    if (books.length === 0) {
      booksHtml = '<div class="domain-flow-empty">아직 독서 기록이 없습니다.</div>';
    } else {
      const headRows = books.slice(0, LIST_SUMMARY_N).map(renderBookRow).join('');
      let extraHtml = '';
      const hasToggle = books.length > LIST_SUMMARY_N;
      if (hasToggle) {
        const extraRows = books.slice(LIST_SUMMARY_N).map(renderBookRow).join('');
        extraHtml =
          '<div class="report-list-extra" id="readingFlowExtra" style="display:none;flex-direction:column;gap:8px;">' + extraRows + '</div>' +
          '<button type="button" class="report-list-toggle" data-target="readingFlowExtra" data-total="' + books.length + '" onclick="toggleReportList(this)">' +
            '<i class="fas fa-chevron-down"></i> 전체 ' + books.length + '건 보기' +
          '</button>';
      }
      // 토글이 없는 짧은 리스트(1~5권)는 has-boost로 잔여 높이를 보강 카드에 양보(스펙 §9)
      booksHtml = '<div class="domain-flow-list' + (hasToggle ? '' : ' has-boost') + '">' + headRows + extraHtml + '</div>';
      if (!hasToggle) {
        booksHtml += makeFlowBoost('📖', '더 읽어 볼까요?',
          '책을 더 읽고 기록하면 독서 활동 점수가 올라가요.',
          '아래 ‘독서 기록’에서 새 책 등록하기');
      }
    }

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        makeScoreDonutHtml(score, {
          unit: '점', label: '독서 활동',
          tip: '우리반 성장기록 > 독서 기록의 누적 권수를 0~100점으로 환산한 값입니다. (레이더 차트의 독서활동 축과 동일)'
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight reading">' + insight + '</div>' +
          subHtml +
        '</div>' +
      '</div>' +
      '<div class="domain-flow">' +
        '<div class="domain-flow-title">📚 최근 읽은 책 (' + books.length + '건)</div>' +
        booksHtml +
      '</div>' +
    '</div>';
  }

  function renderCareerCard(report, areaData) {

    else if (interests.length > 0) insight = '<strong>' + escapeHtml(interests[0].interest_area) + '</strong> 분야에 관심을 보이고 있습니다.';

    const subHtml = '<div class="report-metric-tiles" style="--tile-n:2;">' +
      (function(){ const z = interests.length === 0; const dc = drillClass('career_interest', { active: !z }); const da = drillAttrs('career_interest', '관심 분야', { active: !z });
        return '<div class="report-metric-tile' + (z ? ' is-zero' : '') + dc + '"' + da + ' title="진로진학 활동에서 학생이 입력한 관심 분야 항목 수입니다.">' +
        '<div class="rmt-value" style="color:var(--cyan);">' + interests.length + '</div><div class="rmt-label">관심 분야</div>' + (dc ? DRILL_CHEVRON : '') + '</div>'; })() +
      (function(){ const z = logs.length === 0; const dc = drillClass('career', { active: !z }); const da = drillAttrs('career', '활동 이력', { active: !z });
        return '<div class="report-metric-tile' + (z ? ' is-zero' : '') + dc + '"' + da + ' title="진로 탐색 활동(체험·검사 등) 이력 건수입니다.">' +

      const careerBoost = careerShown < 5;

        return '<div class="domain-flow-row' + careerDc + '"' + careerDa + '>' +
          '<div class="domain-flow-row-icon">📌</div>' +

        logsHtml += makeFlowBoost('🧭', '진로를 더 탐색해 볼까요?',

    return '<div class="section-card">' + headerHtml +
      '<div class="domain-card-body">' +
        makeScoreDonutHtml(score, {
          unit: '점', label: '진로 탐색',
          tip: '진로 탐색 활동(관심 분야 입력·체험·검사 등)을 0~100점으로 환산한 값입니다. (레이더 차트의 진로탐색 축과 동일)'
        }) +
        '<div class="domain-details">' +
          '<div class="domain-insight career">' + insight + '</div>' +
          subHtml +

      '<div class="domain-flow">' +

        logsHtml +
      '</div>' +

    // ---- Reading Logs ----
  async function loadReadingLogs() {
    try {
      const q = targetStudentId !== currentUser.id ? '?studentId=' + targetStudentId : '';
      const res = await fetchWithAuth('/api/growth/reading' + q);
      const data = await res.json();
      renderReadingLogs(data.logs || data.items || []);
    } catch (err) {
      document.getElementById('readingGrid').innerHTML = '<div class="empty-state"><p>독서 기록을 불러올 수 없습니다.</p></div>';
    }
  }

  function renderReadingLogs(logs) {
    const grid = document.getElementById('readingGrid');
    if (!logs.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i class="fas fa-book"></i><p>아직 독서 기록이 없습니다.</p></div>';
      return;
    }
    grid.innerHTML = logs.map(l => {
      const stars = '&#9733;'.repeat(l.rating || 0) + '&#9734;'.repeat(5 - (l.rating || 0));
      return '<div class="reading-card">' +
        '<h4><i class="fas fa-book" style="color:var(--warning)"></i> ' + escapeHtml(l.bookTitle || l.book_title || '') + '</h4>' +
        '<div class="meta">' + escapeHtml(l.author || l.bookAuthor || '') + ' &middot; ' + formatDate(l.readDate || l.read_date || l.created_at) + '</div>' +
        '<div class="star-rating">' + stars + '</div>' +
        (l.review || l.content ? '<div class="review">' + escapeHtml(l.review || l.content) + '</div>' : '') +
      '</div>';
    }).join('');
  }

  // Reading form toggle
  document.getElementById('toggleReadingForm').addEventListener('click', () => {
    const form = document.getElementById('readingForm');
    form.classList.toggle('open');
    if (form.classList.contains('open') && !document.getElementById('readDate').value) {
      document.getElementById('readDate').value = new Date().toISOString().split('T')[0];
    }
  });
  document.getElementById('cancelReadingBtn').addEventListener('click', () => {
    document.getElementById('readingForm').classList.remove('open');
  });

  document.getElementById('submitReadingBtn').addEventListener('click', async () => {
    const bookTitle = document.getElementById('bookTitle').value.trim();
    const author = document.getElementById('bookAuthor').value.trim();
    const readDate = document.getElementById('readDate').value;
    const rating = parseInt(document.getElementById('bookRating').value);
    const review = document.getElementById('bookReview').value.trim();
    if (!bookTitle) { alert('책 제목을 입력하세요.'); return; }
    try {
      const res = await fetchWithAuth('/api/growth/reading', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bookTitle, author, readDate, rating, review })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('readingForm').classList.remove('open');
        ['bookTitle','bookAuthor','bookReview'].forEach(id => document.getElementById(id).value = '');
        loadReadingLogs();
      } else { alert(data.message || '저장에 실패했습니다.'); }
    } catch (err) { alert('서버 오류가 발생했습니다.'); }
  });

  // ---- Observations ----
  async function loadObservations() {
    // 교사/관리자에게만 입력 폼을 노출하고, 안내문도 역할에 맞게 조정
    const obsForm = document.getElementById('obsForm');
    const obsNote = document.getElementById('obsSourceNote');
    if (obsForm) obsForm.style.display = isTeacher ? 'block' : 'none';
    if (obsNote) {
      obsNote.textContent = isTeacher
        ? '교사가 이 화면에서 직접 남긴 관찰 기록입니다. 아래 입력란에서 추가할 수 있어요.'
        : '담임·교과 교사가 이 화면에서 직접 남긴 관찰 기록입니다.';
    }
    try {
      const res = await fetchWithAuth('/api/growth/report/observations/' + targetStudentId);
      const data = await res.json();
      allObservations = data.observations || [];
      renderObservations(allObservations);
    } catch (err) {
      document.getElementById('obsTimeline').innerHTML = '<div class="empty-state"><p>관찰 기록을 불러올 수 없습니다.</p></div>';
    }
  }

  // 관찰 기록 저장 (교사) — POST /api/growth/report/observation
  async function submitObservation() {
    const areaEl = document.getElementById('obsArea');
    const textEl = document.getElementById('obsText');
    const text = (textEl.value || '').trim();
    if (!text) { alert('관찰 내용을 입력해 주세요.'); textEl.focus(); return; }
    const classId = new URLSearchParams(location.search).get('classId') || (currentReportData && currentReportData.classId) || null;
    try {
      const res = await fetchWithAuth('/api/growth/report/observation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          studentId: targetStudentId,
          classId: classId ? parseInt(classId) : null,
          text: text,
          area: areaEl.value
        })
      });
      const data = await res.json();
      if (res.ok && data.success !== false) {
        textEl.value = '';
        await loadObservations();
      } else {
        alert(data.message || '관찰 기록 저장에 실패했습니다.');
      }
    } catch (err) { alert('서버 오류가 발생했습니다.'); }
  }

  function renderObservations(observations) {
    const timeline = document.getElementById('obsTimeline');
    // Filter by active tag
    let filtered = observations;
    if (activeObsTag !== 'all') {
      filtered = observations.filter(o => {
        const area = (o.area || '').toLowerCase();
        const tags = o.tags || '';
        return area.includes(activeObsTag.toLowerCase()) || tags.toLowerCase().includes(activeObsTag.toLowerCase());
      });
    }

    if (!filtered.length) {
      const emptyMsg = activeObsTag !== 'all'
        ? '"' + activeObsTag + '" 카테고리의 관찰 기록이 없습니다.'
        : (isTeacher ? '아직 관찰 기록이 없습니다. 학생을 관찰한 내용을 남겨보세요.' : '아직 관찰 기록이 없습니다.');
      timeline.innerHTML = '<div class="empty-state" style="padding:20px;"><i class="fas fa-clipboard-list"></i><p>' +
        emptyMsg + '</p></div>';
      return;
    }
    timeline.innerHTML = filtered.map(o => {
      const areaInfo = AREAS.find(a => a.key === o.area) || AREAS[0];
      return '<div class="obs-item">' +
        '<div class="obs-dot" style="background:' + areaInfo.color + '"></div>' +
        '<div class="obs-content">' +
          '<div class="obs-text">' + escapeHtml(o.content) + '</div>' +
          '<div class="obs-meta">' +
            '<span style="color:' + areaInfo.color + ';font-weight:600;">' + (o.area || '') + '</span>' +
            ' &middot; ' + (o.teacherName || o.teacher_name || '교사') +
            ' &middot; ' + formatDate(o.created_at || o.createdAt || o.observation_date) +
          '</div>' +
        '</div></div>';
    }).join('');
  }

  // Observation tag filter
  document.getElementById('obsTagFilter').addEventListener('click', (e) => {
    const btn = e.target.closest('.note-tag');
    if (!btn) return;
    document.querySelectorAll('#obsTagFilter .note-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeObsTag = btn.dataset.tag;
    renderObservations(allObservations);
  });

  // 관찰 기록 저장 버튼
  const submitObsBtn = document.getElementById('submitObsBtn');
  if (submitObsBtn) submitObsBtn.addEventListener('click', submitObservation);

  // ---- PDF 저장 / 인쇄 ----
  // PDF 저장: 외부 라이브러리 없이 브라우저 인쇄 대화상자에서 "PDF로 저장"을 안내한 뒤 print 호출
  function saveAsPdf() {
    showToast('인쇄 대화상자에서 “대상”을 “PDF로 저장”으로 선택하면 PDF 파일로 저장됩니다.');
    setTimeout(function(){ window.print(); }, 600);
  }
  function showToast(msg) {
    let t = document.getElementById('reportToast');
    if (!t) {
      t = document.createElement('div');
      t.id = 'reportToast';
      t.className = 'report-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 3000);
  }
  const savePdfBtn = document.getElementById('savePdfBtn');
  if (savePdfBtn) savePdfBtn.addEventListener('click', saveAsPdf);
  const printBtn = document.getElementById('printBtn');
  if (printBtn) printBtn.addEventListener('click', function(){ window.print(); });

  // ---- Utilities ----
  function showError(msg) {
    document.querySelector('#individualReportArea .report-container').innerHTML =
      '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>' + msg + '</p></div>';
  }

  function escapeHtml(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    // textContent/innerHTML은 따옴표를 인코딩하지 않으므로 속성 컨텍스트 안전을 위해 추가 변환
    return d.innerHTML.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function formatDate(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
  }

  // ===== 카드 세부 내역 Drill-down 모달 =====
  // 기획서: 성장리포트_내역_drilldown_스펙.md
  // 단일 #detailModal 컴포넌트를 모든 type이 재사용. 카드 컨테이너에 이벤트 위임 1개.
  const DM_TYPE_ICON = {
    post: '🗒️', attendance: '💛', survey: '📋', homework: '📝', exam: '🎓',
    today_learning: '📋', ai_learning: '🧭', wrong_note: '📝', content_problem: '🎬',
    class_exam: '🎓', cbt_exam: '🛡', lesson: '📚',
    ach_self_directed: '🎯', ach_class_eval: '🎓', ach_diagnosis: '🔎',
    emotion: '😊', career: '🧭', career_interest: '🎯', reading: '📗',
    content_saved: '📥', content_viewed: '👀', content_subscribed: '🔔', content_portfolio: '🎨'
  };
  const DM_TYPE_ROWICON = {
    post: '🗒️', attendance: '📅', survey: '📋', homework: '📝', exam: '🎓',
    today_learning: '📋', ai_learning: '🧭', wrong_note: '📝', content_problem: '🎬',
    class_exam: '🎓', cbt_exam: '🛡', lesson: '📚',
    ach_self_directed: '📚', ach_class_eval: '🎓', ach_diagnosis: '🔎',
    emotion: '😊', career: '📌', career_interest: '🎯', reading: '📗',
    content_saved: '📥', content_viewed: '👀', content_subscribed: '🔔', content_portfolio: '🎨'
  };
  let dmLastTrigger = null;
  let dmReqSeq = 0;

  function dmEl(id) { return document.getElementById(id); }

  function openDetailModal(triggerEl) {
    const type = triggerEl.getAttribute('data-type');
    if (!type) return;
    const source = triggerEl.getAttribute('data-source') || '';
    dmLastTrigger = triggerEl;
    const overlay = dmEl('detailModal');
    // 헤더 즉시 표시(아이콘) + 스켈레톤 로딩
    dmEl('dmTitleIco').textContent = DM_TYPE_ICON[type] || '📋';
    dmEl('dmTitleText').textContent = '불러오는 중…';
    dmEl('dmCount').textContent = '';
    dmEl('dmBody').innerHTML =
      '<div class="dm-loading">' +
        Array(3).fill(0).map(() =>
          '<div class="dm-skel-row"><div class="dm-skel-ico"></div>' +
          '<div class="dm-skel-body"><div class="dm-skel-line"></div><div class="dm-skel-line short"></div></div></div>'
        ).join('') +
      '</div>';
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';

    const seq = ++dmReqSeq;
    let url = '/api/growth/report/student/' + targetStudentId + '/detail' + buildReportQuery();
    url += (url.indexOf('?') >= 0 ? '&' : '?') + 'type=' + encodeURIComponent(type);
    if (source) url += '&source=' + encodeURIComponent(source);

    fetchWithAuth(url)
      .then(r => r.json())
      .then(data => {
        if (seq !== dmReqSeq) return; // 더 최신 요청이 떴으면 무시
        if (!data || !data.success) { renderDetailModal(type, { title: '내역', count: 0, items: [] }); return; }
        renderDetailModal(type, data);
      })
      .catch(() => {
        if (seq !== dmReqSeq) return;
        dmEl('dmBody').innerHTML =
          '<div class="dm-empty"><div class="dm-empty-ico">⚠️</div>' +
          '<div class="dm-empty-title">내역을 불러올 수 없습니다</div>' +
          '<div class="dm-empty-text">잠시 후 다시 시도해 주세요.</div></div>';
      });
  }

  function renderDetailModal(type, data) {
    dmEl('dmTitleIco').textContent = DM_TYPE_ICON[type] || '📋';
    dmEl('dmTitleText').textContent = data.title || '내역';
    const count = (typeof data.count === 'number') ? data.count : (data.items ? data.items.length : 0);
    dmEl('dmCount').textContent = '총 ' + count + '건 · 최신순';

    const items = data.items || [];
    if (items.length === 0) {
      dmEl('dmBody').innerHTML =
        '<div class="dm-empty"><div class="dm-empty-ico">📭</div>' +
        '<div class="dm-empty-title">표시할 내역이 없습니다</div>' +
        '<div class="dm-empty-text">이 기간에는 기록이 없어요.</div></div>';
      return;
    }
    const rowIco = DM_TYPE_ROWICON[type] || '•';
    let rowsHtml = items.map(it => {
      const primary = escapeHtml(it.primary || '제목 없음');
      const meta = it.meta ? '<div class="dm-row-meta">' + escapeHtml(it.meta) + '</div>' : '';
      const dateTxt = it.date ? formatDate(it.date) : '';
      // 우측 꼬리: 결과칩(O/X) → 뱃지 → 날짜
      let tail = '';
      if (it.result === 'correct') tail += '<span class="dm-result-chip dm-result-correct" title="정답">O</span>';
      else if (it.result === 'incorrect') tail += '<span class="dm-result-chip dm-result-incorrect" title="오답">X</span>';
      if (it.badge && it.badge.text) {
        const tone = it.badge.tone || 'neutral';
        tail += '<span class="dm-row-badge dm-badge-' + tone + '">' + escapeHtml(it.badge.text) + '</span>';
      }
      if (dateTxt) tail += '<span class="dm-row-date">' + dateTxt + '</span>';
      return '<div class="dm-row">' +
        '<div class="dm-row-icon">' + rowIco + '</div>' +
        '<div class="dm-row-body"><div class="dm-row-primary">' + primary + '</div>' + meta + '</div>' +
        (tail ? '<div class="dm-row-tail">' + tail + '</div>' : '') +
      '</div>';
    }).join('');
    // 200건 상한 안내 (스펙 §5-3)
    if (count > items.length) {
      rowsHtml += '<div class="dm-note">최근 ' + items.length + '건만 표시합니다 (전체 ' + count + '건)</div>';
    }
    dmEl('dmBody').innerHTML = rowsHtml;
    dmEl('dmBody').scrollTop = 0;
  }

  function closeDetailModal() {
    const overlay = dmEl('detailModal');
    overlay.classList.remove('open');
    document.body.style.overflow = '';
    dmReqSeq++; // 진행 중 요청 무효화
    // 접근성 — 포커스를 트리거 행으로 복귀
    if (dmLastTrigger && typeof dmLastTrigger.focus === 'function') {
      try { dmLastTrigger.focus(); } catch (e) {}
    }
    dmLastTrigger = null;
  }

  // 모달 닫기 핸들러 (×버튼 / 오버레이 빈영역 / Esc)
  (function bindDetailModalClose() {
    const overlay = dmEl('detailModal');
    if (!overlay) return;
    dmEl('dmClose').addEventListener('click', closeDetailModal);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDetailModal(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeDetailModal();
    });
  })();

  // 카드 컨테이너(#reportGrid)에 위임 클릭/키보드 리스너 1개
  (function bindDetailDelegation() {
    const grid = document.getElementById('reportGrid');
    if (!grid) return;
    grid.addEventListener('click', (e) => {
      const t = e.target.closest('.is-drillable');
      if (t && grid.contains(t)) { e.preventDefault(); openDetailModal(t); }
    });
    grid.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const t = e.target.closest('.is-drillable');
      if (t && grid.contains(t)) { e.preventDefault(); openDetailModal(t); }
    });
  })();
})();
</script>
</body>
</html>
