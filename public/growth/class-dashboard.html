        </div>
      </div>
    `).join('');

    const careerRecommendHtml = careerRecommend.map(r => `
      <div style="padding:14px 16px;background:var(--gray-50);border-left:3px solid #8b5cf6;border-radius:8px;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:6px;">
          <strong>${r.name}</strong>
          <span style="color:var(--gray-400);">희망 진로</span>
          <span style="padding:2px 10px;background:#ede9fe;color:#7c3aed;border-radius:12px;font-size:12px;font-weight:600;">${r.dream}</span>
        </div>
        <div style="font-size:13px;color:var(--gray-600);line-height:1.7;">
          ${r.actions.map(a => `<span style="display:inline-block;margin-right:8px;">→ ${a}</span>`).join('')}
        </div>
      </div>
    `).join('');

    document.getElementById('tab-career').innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px;">
        <div>
          <div style="font-size:18px;font-weight:700;color:var(--gray-700);">🧭 학생 진로 탐색 현황</div>
          <div style="font-size:13px;color:var(--gray-500);margin-top:2px;">학생들의 진로 활동과 관심 분야를 한눈에</div>
        </div>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 12px;background:#fef3c7;color:#92400e;border-radius:999px;font-size:13px;font-weight:600;border:1px solid #fde68a;">📊 예시 데이터</span>
      </div>

      <div class="analysis-grid" style="margin-bottom:24px;">
        <div class="analysis-card">
          <div class="analysis-title">관심 분야 분포 <span style="font-size:12px;font-weight:500;color:var(--gray-400);">(상위 5개)</span></div>
          <div style="display:grid;grid-template-columns:160px 1fr;gap:20px;align-items:center;">
            <div style="position:relative;width:160px;height:160px;flex-shrink:0;">
              <canvas id="careerInterestChart"></canvas>
            </div>
            <div>${careerBarsHtml}</div>
          </div>
        </div>
        <div class="analysis-card">
          <div class="analysis-title">진로 활동 이력</div>
          ${careerActivityHtml}
        </div>
      </div>

      <div class="analysis-card" style="background:#fff;border:1px solid var(--gray-100);">
        <div class="analysis-title" style="display:flex;align-items:center;gap:8px;">
          🤖 학생별 추천 진로 활동 <span style="font-size:12px;font-weight:500;color:var(--gray-400);">(AI 분석 기반 예시)</span>
        </div>
        ${careerRecommendHtml}
      </div>
    `;

    // 도넛 차트 렌더 (Chart.js — 다른 탭에서도 사용 중)
    setTimeout(() => {
      const ctx = document.getElementById('careerInterestChart');
      if (ctx && window.Chart) {
        try {
          new Chart(ctx, {
            type: 'doughnut',
            data: {
              labels: careerInterests.map(c => c.name),
              datasets: [{
                data: careerInterests.map(c => c.count),
                backgroundColor: careerInterests.map(c => c.color),
                borderWidth: 2,
                borderColor: '#fff'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: '60%',
              plugins: { legend: { display: false } }
            }
          });
        } catch (e) { /* ignore */ }
      }
    }, 50);

    // --- 7. 콘텐츠 활용 탭 ---
    const cu = data.contentUsage || {};
    const cuByType = cu.byType || [];
    const cuByService = cu.byService || [];
    const cuTotal = cu.totalActivities || 0;
    const cuUnique = cu.uniqueContents || 0;
    if (cuTotal === 0) {
      document.getElementById('tab-content').innerHTML = `
        <div style="text-align:center;padding:60px 20px;">
          <div style="font-size:48px;margin-bottom:16px;opacity:0.3;">&#128187;</div>
          <div style="font-size:18px;font-weight:600;color:var(--gray-500);margin-bottom:8px;">데이터 없음</div>
          <div style="font-size:14px;color:var(--gray-400);">아직 학습 활동 기록이 없습니다</div>
        </div>`;
    } else {
      const typeLabels = { homework: '과제', exam: '평가', lesson: '수업활동', quiz: '퀴즈', assignment: '과제물', activity: '활동', external: '외부연동', '기타': '기타',
        content_view: '콘텐츠 조회', lesson_view: '수업 조회', homework_submit: '과제 제출', homework_graded: '과제 채점',
        exam_complete: '평가 완료', daily_complete: '오늘의 학습', diagnosis_complete: '진단 완료',
        attendance_checkin: '출석 체크인', post_create: '게시물 작성', survey_respond: '설문 응답', portfolio_add: '포트폴리오 추가' };
      const typeMaxCnt = cuByType.length > 0 ? Math.max(...cuByType.map(t => t.cnt)) : 1;
      const typeColors = ['#2563eb','#8b5cf6','#10b981','#f59e0b','#ef4444','#06b6d4','#ec4899','#6366f1'];
      const typeBarsHtml = cuByType.map((t, i) => {
        const label = typeLabels[t.activity_type] || toKoActivityType(t.activity_type) || '기타';
        const pct = Math.round(t.cnt / typeMaxCnt * 100);
        const color = typeColors[i % typeColors.length];
        const avgScore = t.avg_score != null ? Math.round(t.avg_score * 100) + '%' : '-';
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:80px;font-size:13px;color:var(--gray-600);text-align:right;">${label}</div>
          <div style="flex:1;background:var(--gray-100);border-radius:6px;height:22px;overflow:hidden;">
            <div style="width:${pct}%;background:${color};height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;">
              <span style="font-size:11px;color:#fff;font-weight:600;">${t.cnt}건</span>
            </div>
          </div>
          <div style="width:50px;font-size:12px;color:var(--gray-500);text-align:right;">${avgScore}</div>
        </div>`;
      }).join('');

      const svcMaxCnt = cuByService.length > 0 ? Math.max(...cuByService.map(s => s.cnt)) : 1;
      const svcBarsHtml = cuByService.length > 0 ? cuByService.slice(0, 5).map((s, i) => {
        const pct = Math.round(s.cnt / svcMaxCnt * 100);
        const color = typeColors[(i + 3) % typeColors.length];
        return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:100px;font-size:13px;color:var(--gray-600);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${toKoSource(s.source_service)}</div>
          <div style="flex:1;background:var(--gray-100);border-radius:6px;height:22px;overflow:hidden;">
            <div style="width:${pct}%;background:${color};height:100%;border-radius:6px;display:flex;align-items:center;padding-left:8px;">
              <span style="font-size:11px;color:#fff;font-weight:600;">${s.cnt}건</span>
            </div>
          </div>
        </div>`;
      }).join('') : '<div style="color:var(--gray-400);font-size:13px;">서비스별 데이터 없음</div>';

      // 콘텐츠 활용 점수(축6) 클래스 평균 — 구간 점수화 결과
      const contentScores = students.map(s => s.areas?.['콘텐츠활용']).filter(a => a && a.hasData !== false && a.score != null).map(a => a.score);
      const contentAvg = contentScores.length > 0 ? Math.round(contentScores.reduce((a, b) => a + b, 0) / contentScores.length) : null;
      const contentScoreColor = contentAvg == null ? 'var(--gray-400)' : contentAvg >= 80 ? '#10b981' : contentAvg >= 60 ? '#2563eb' : contentAvg >= 40 ? '#f59e0b' : '#ef4444';
      const contentScoreCard = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;padding:16px 20px;background:var(--secondary-light);border-radius:12px;border-left:4px solid #10b981;">
          <div style="text-align:center;flex-shrink:0;">
            <div style="font-size:32px;font-weight:800;color:${contentScoreColor};line-height:1;">${contentAvg != null ? contentAvg : '-'}<span style="font-size:15px;font-weight:500;color:var(--gray-400);">점</span></div>
            <div style="font-size:13px;color:var(--gray-500);margin-top:2px;">콘텐츠 활용 점수</div>
          </div>
          <div style="font-size:14px;color:var(--gray-600);line-height:1.6;">클래스 평균 콘텐츠 활용 점수입니다. 콘텐츠·수업 조회 활동량을 구간 점수화(0~100)하여 산출합니다.</div>
        </div>`;

      document.getElementById('tab-content').innerHTML = `
        ${contentScoreCard}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;">
          <div>
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;">활동 유형별 현황</div>
            <div style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">총 ${cuTotal}건 | ${cuUnique}개 콘텐츠</div>
            ${typeBarsHtml}
          </div>
          <div>
            <div style="font-size:15px;font-weight:700;margin-bottom:4px;">서비스별 활용</div>
            <div style="font-size:13px;color:var(--gray-500);margin-bottom:16px;">Top 5 서비스</div>
            ${svcBarsHtml}
            <div style="margin-top:24px;padding:16px;background:var(--gray-50);border-radius:12px;">
              <div style="font-size:13px;font-weight:600;margin-bottom:8px;">요약 통계</div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;">
                <div>총 활동: <strong>${cuTotal}건</strong></div>
                <div>활용 콘텐츠: <strong>${cuUnique}개</strong></div>
                <div>활동 유형: <strong>${cuByType.length}종</strong></div>
                <div>연동 서비스: <strong>${cuByService.length}개</strong></div>
              </div>
            </div>
          </div>
        </div>`;
    }
  }

  // ===== 오늘의 학습 상세 테이블 로드 =====
  const DAY_NAMES = ['일','월','화','수','목','금','토'];
  const pad2 = (n) => String(n).padStart(2, '0');
  const ymd = (y, m, d) => y + '-' + pad2(m) + '-' + pad2(d);
  window.loadDailyLearning = async function(mode) {
    if (mode === 'weekly' || mode === 'monthly') dailyMode = mode;

    // 선택 월(상단 단일 기준)에서 기간 범위 계산
    const Y = selectedYear, M = selectedMonth;
    const lastDay = new Date(Y, M, 0).getDate();
    const isCurrentMonth = (Y === now.getFullYear() && M === now.getMonth() + 1);
    let start, end, labelHtml, weekNo = null, weekRange = '';
    if (dailyMode === 'monthly') {
      start = ymd(Y, M, 1);
      end = ymd(Y, M, lastDay);
      labelHtml = '<strong style="font-weight:700;color:var(--gray-700);">' + Y + '년 ' + M + '월</strong> · 월간';
    } else {
      // 주간: 선택 월의 한 주(월~일). 이번 달이면 오늘 포함 주, 과거/미래 달이면 첫째 주.
      let base = isCurrentMonth ? new Date() : new Date(Y, M - 1, 1);
      const dow = base.getDay();
      const monOffset = (dow === 0 ? -6 : 1 - dow);
      const mon = new Date(base.getFullYear(), base.getMonth(), base.getDate() + monOffset);
      const sun = new Date(mon.getFullYear(), mon.getMonth(), mon.getDate() + 6);
      start = ymd(mon.getFullYear(), mon.getMonth() + 1, mon.getDate());
      end = ymd(sun.getFullYear(), sun.getMonth() + 1, sun.getDate());
      weekNo = Math.ceil((base.getDate() + (new Date(Y, M - 1, 1).getDay() === 0 ? 6 : new Date(Y, M - 1, 1).getDay() - 1)) / 7);
      weekRange = pad2(mon.getMonth() + 1) + '.' + pad2(mon.getDate()) + '~' + pad2(sun.getMonth() + 1) + '.' + pad2(sun.getDate());
      labelHtml = '<strong style="font-weight:700;color:var(--gray-700);">' + Y + '년 ' + M + '월</strong> · ' + weekNo + '주차 <span style="color:var(--gray-400);">(' + weekRange + ')</span>';
    }

    // 버튼 활성화 토글
    document.getElementById('dailyBtnWeekly').classList.toggle('active', dailyMode === 'weekly');
    document.getElementById('dailyBtnMonthly').classList.toggle('active', dailyMode === 'monthly');

    // 기간 라벨 (상단 월과 항상 일치)
    document.getElementById('dailyPeriodLabel').innerHTML = labelHtml;

    const wrap = document.getElementById('dailyLearningTableWrap');
    wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">데이터 로딩 중...</div>';

    // '오늘' 비교는 로컬(KST) 기준 — UTC(toISOString)는 KST 자정~오전에 전날로 어긋남. BE dates와 동일 포맷.
    const todayStr = ymd(now.getFullYear(), now.getMonth() + 1, now.getDate());
    const monthFirstStr = ymd(Y, M, 1);
    const isFutureMonth = monthFirstStr > todayStr;

    try {
      const classId = currentClassId;
      const res = await fetch(`/api/growth/report/class/${classId}/daily-learning?period=${dailyMode}&startDate=${start}&endDate=${end}`);
      const data = await res.json();
      if (!data.success) throw new Error(data.message);

      const { students, dates, sets } = data;

      // 요약 카드를 매트릭스와 동일 기간(주간/월간) 데이터로 갱신 → 요약 ↔ 매트릭스 일관성
      if (data.summary) renderDailySummaryCards(data.summary);
      else renderDailySummaryCards({});

      const setCount = Array.isArray(sets) ? sets.length : 0;
      const hasParticipation = data.summary && data.summary.hasData;
      if (!students || students.length === 0 || !dates || dates.length === 0 || setCount === 0 || !hasParticipation) {
        let icon = '📭', main = '', sub = '';
        if (isFutureMonth) {
          main = '아직 오지 않은 달이에요.';
          sub = Y + '년 ' + M + '월의 학습 현황은 그 달이 되면 채워집니다.';
        } else if (setCount === 0) {
          main = "이 달에는 등록된 '오늘의 학습'이 없어요.";
          sub = '관리자 또는 선생님이 학습을 배포하면 여기에 표시됩니다.';
        } else {
          main = '학습은 배포됐지만 아직 참여한 학생이 없어요.';
          sub = "학생들이 '오늘의 학습'을 시작하면 채워집니다.";
        }
        wrap.innerHTML = '<div style="text-align:center;padding:40px;">' +
          '<div style="font-size:36px;line-height:1;margin-bottom:12px;">' + icon + '</div>' +
          '<div style="font-size:15px;color:var(--gray-500);font-weight:600;">' + main + '</div>' +
          '<div style="font-size:14px;color:var(--gray-400);margin-top:6px;">' + sub + '</div>' +
          '</div>';
        return;
      }

      // 학습 세트가 있는 날짜 세트
      const setDates = new Set(sets.map(s => s.targetDate));

      // 테이블 생성
      let html = '<table style="width:100%;border-collapse:collapse;font-size:13px;min-width:600px;">';

      // 헤더 1: 날짜
      html += '<thead><tr>';
      html += '<th style="position:sticky;left:0;background:#fff;z-index:2;padding:8px 12px;border-bottom:2px solid var(--gray-200);text-align:left;min-width:100px;font-weight:600;">학생</th>';
      dates.forEach(d => {
        const dt = new Date(d + 'T00:00:00');
        const dayName = DAY_NAMES[dt.getDay()];
        const dayNum = dt.getDate();
        const isToday = d === todayStr;
        const hasSet = setDates.has(d);
        const isWeekend = dt.getDay() === 0 || dt.getDay() === 6;
        html += '<th style="padding:6px 4px;border-bottom:2px solid var(--gray-200);text-align:center;min-width:52px;font-weight:500;' +
          (isToday ? 'background:var(--primary-light);' : '') +
          (isWeekend ? 'color:var(--gray-400);' : '') + '">' +
          '<div style="font-size:12px;' + (isToday ? 'color:var(--primary);font-weight:700;' : '') + '">' + dayNum + '</div>' +
          '<div style="font-size:11px;color:' + (isToday ? 'var(--primary)' : 'var(--gray-400)') + ';">' + dayName + '</div>' +
          (hasSet ? '<div style="width:6px;height:6px;background:var(--primary);border-radius:50%;margin:2px auto 0;"></div>' : '') +
          '</th>';
      });
      html += '<th style="padding:6px 8px;border-bottom:2px solid var(--gray-200);text-align:center;min-width:60px;font-weight:600;">참여율</th>';
      html += '<th style="padding:6px 8px;border-bottom:2px solid var(--gray-200);text-align:center;min-width:60px;font-weight:600;">정답률</th>';
      html += '</tr></thead>';

      // 바디: 학생별 행 — 모든 셀 고정 높이로 통일하여 행 높이 일관성 유지
      const ROW_H = 56; // px — 학생당 행 높이
      const CELL_INNER = 'display:flex;flex-direction:column;align-items:center;justify-content:center;height:' + ROW_H + 'px;line-height:1.2;';
      html += '<tbody>';
      students.forEach(st => {
        html += '<tr style="height:' + ROW_H + 'px;">';
        html += '<td style="position:sticky;left:0;background:#fff;z-index:1;padding:0 12px;border-bottom:1px solid var(--gray-100);font-weight:500;white-space:nowrap;height:' + ROW_H + 'px;vertical-align:middle;font-size:14px;">' + escapeHtml(st.name) + '</td>';
        dates.forEach(d => {
          const info = st.daily[d];
          // 학생별 세트 유무 판정 (클래스 전체가 아니라 이 학생의 학년 매칭 세트 기준)
          const studentHasSet = !!(info && info.hasSet);
          const isToday = d === todayStr;
          let inner = '';
          let cellBg = '';
          let clickable = false;
          if (!studentHasSet) {
            cellBg = 'var(--gray-50)';
            inner = '<span style="color:var(--gray-300);font-size:14px;">-</span>';
          } else if (info && info.participated) {
            clickable = true;
            // 점수 줄은 항상 1줄 예약 — 점수 있으면 'N점', 없으면 회색 '–'(채점 점수 없음).
            // 모든 참여 셀이 2행(기호+점수줄)을 가져 행 전체 기호 baseline이 세로 정렬되고,
            // '점수 자리는 있으나 채점 점수 없음'을 회색 –로 명시(0점/실패 오해 차단).
            const scoreLine = info.score != null
              ? '<div style="font-size:11px;margin-top:2px;color:' + (info.accuracy >= 100 ? '#059669' : '#d97706') + ';">' + info.score + '점</div>'
              : '<div style="font-size:11px;margin-top:2px;color:#9ca3af;" aria-label="채점 점수 없음">–</div>';
            if (info.accuracy >= 100) {
              cellBg = '#d1fae5';
              inner = '<span style="color:#059669;font-weight:700;font-size:15px;">✓</span>' + scoreLine;
            } else {
              cellBg = '#fef3c7';
              inner = '<span style="color:#d97706;font-weight:700;font-size:13px;">' + info.accuracy + '%</span>' + scoreLine;
            }
          } else {
            cellBg = '#fee2e2';
            inner = '<span style="color:#dc2626;font-weight:700;font-size:14px;">✕</span>';
          }
          const cellContent = '<div style="' + CELL_INNER + '">' + inner + '</div>';
          // 셀 상태 요약 tooltip: "완료 N/M · 점수/사유 · 클릭하여 상세"
          let cellTitle = '정오답 상세 보기';
          if (clickable && info) {
            const doneTxt = '완료 ' + (info.completedItems || 0) + '/' + (info.totalItems || 0);
            const scoreTxt = info.score != null ? info.score + '점' : '점수 없음(영상·자료 시청)';
            cellTitle = doneTxt + ' · ' + scoreTxt + ' · 클릭하여 상세';
          }
          const clickAttr = clickable && info && info.setId != null ? ` onclick="openDailyResultModal(${st.id}, ${info.setId}, '${escapeHtml(st.name)}', '${d}')" title="${cellTitle}"` : '';
          html += '<td' + clickAttr + ' style="padding:0;border-bottom:1px solid var(--gray-100);text-align:center;vertical-align:middle;background:' + cellBg + ';height:' + ROW_H + 'px;' +
            (isToday ? 'box-shadow:inset 0 0 0 2px var(--primary-light);' : '') +
            (clickable ? 'cursor:pointer;' : '') + '">' + cellContent + '</td>';
        });

        // 참여율
        const prColor = st.participationRate >= 80 ? '#059669' : st.participationRate >= 50 ? '#d97706' : '#dc2626';
        html += '<td style="padding:0 8px;border-bottom:1px solid var(--gray-100);text-align:center;vertical-align:middle;font-weight:700;font-size:14px;color:' + prColor + ';height:' + ROW_H + 'px;">' + st.participationRate + '%</td>';

        // 평균 정답률
        const scoreColor = st.avgScore == null ? 'var(--gray-400)' : st.avgScore >= 80 ? '#059669' : st.avgScore >= 50 ? '#d97706' : '#dc2626';
        html += '<td style="padding:0 8px;border-bottom:1px solid var(--gray-100);text-align:center;vertical-align:middle;font-weight:700;font-size:14px;color:' + scoreColor + ';height:' + ROW_H + 'px;">' + (st.avgScore != null ? st.avgScore + '점' : '-') + '</td>';
        html += '</tr>';
      });
      html += '</tbody>';

      // 하단 요약 행: 날짜별 참여 학생 수 — 학생 행과 동일 높이/정렬
      html += '<tfoot><tr style="height:' + ROW_H + 'px;">';
      html += '<td style="position:sticky;left:0;background:var(--gray-50);z-index:1;padding:0 12px;border-top:2px solid var(--gray-200);font-weight:700;font-size:14px;color:var(--gray-600);height:' + ROW_H + 'px;vertical-align:middle;">참여 학생</td>';
      dates.forEach(d => {
        const hasSet = setDates.has(d);
        if (!hasSet) {
          html += '<td style="padding:0 4px;border-top:2px solid var(--gray-200);text-align:center;vertical-align:middle;background:var(--gray-50);font-size:14px;color:var(--gray-300);height:' + ROW_H + 'px;">-</td>';
        } else {
          const participated = students.filter(s => s.daily[d]?.participated).length;
          const total = students.length;
          const pct = total > 0 ? Math.round(participated / total * 100) : 0;
          const c = pct >= 80 ? '#059669' : pct >= 50 ? '#d97706' : '#dc2626';
          html += '<td style="padding:0 4px;border-top:2px solid var(--gray-200);text-align:center;vertical-align:middle;background:var(--gray-50);font-size:15px;font-weight:700;color:' + c + ';height:' + ROW_H + 'px;">' + participated + '/' + total + '</td>';
        }
      });
      html += '<td colspan="2" style="border-top:2px solid var(--gray-200);background:var(--gray-50);"></td>';
      html += '</tr></tfoot>';

      html += '</table>';

      // 학습 세트 요약: 칩 목록은 상단 매트릭스(날짜별 세트 유무 점 표시)와 정보가 중복되고
      // 세트 수가 많을 때 화면을 도배하므로 제거. 대신 기간 내 세트 개수만 간단히 안내.
      if (sets.length > 0) {
        html += '<div style="margin-top:14px;font-size:12px;color:var(--gray-400);text-align:right;">' +
          '기간 내 학습 세트 ' + sets.length + '개' + '</div>';
      }

      wrap.innerHTML = html;
    } catch (err) {
      console.error('Daily learning load error:', err);
      wrap.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">데이터를 불러올 수 없습니다.</div>';
    }
  };

  // ===== 교사용 정오답 상세 모달 =====
  window.openDailyResultModal = async function(studentId, setId, studentName, dateStr) {
    let modal = document.getElementById('dailyResultModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'dailyResultModal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10001;display:flex;align-items:center;justify-content:center;padding:20px;';
      modal.innerHTML = '<div id="dailyResultBox" style="background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;"></div>';
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
      document.body.appendChild(modal);
    }
    const box = modal.querySelector('#dailyResultBox');
    box.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">로딩 중...</div>';

    try {
      const itemsRes = await fetch(`/api/growth/report/student/${studentId}/daily-set/${setId}/items`).then(r => r.json());
      if (!itemsRes.success) throw new Error(itemsRes.message);
      const { set, student, items } = itemsRes;

      let html = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;">
          <div>
            <div style="font-size:18px;font-weight:800;color:#1e293b;">${escapeHtml(student.display_name || student.username)} · ${escapeHtml(set.title)}</div>
            <div style="font-size:12px;color:#64748b;margin-top:4px;">📅 ${set.target_date} · ${escapeHtml(set.target_subject||'')}</div>
          </div>
          <button onclick="document.getElementById('dailyResultModal').remove();" style="background:none;border:none;font-size:24px;color:#94a3b8;cursor:pointer;line-height:1;">×</button>
        </div>
      `;

      // ===== 상단 요약 배너 (items 기반 FE 계산) — 완료수·평균점수, 점수 없으면 사유 안내 =====
      const totalN = items.length;
      const completedN = items.filter(it => it.status === 'completed').length;
      const scored = items.filter(it => it.status === 'completed' && it.score != null).map(it => it.score);
      const avgScore = scored.length > 0 ? Math.round(scored.reduce((a, b) => a + b, 0) / scored.length) : null;
      const hasScore = avgScore != null;
      const bannerBg = hasScore ? '#eff6ff' : '#fffbeb';
      const bannerBorder = hasScore ? '#3b82f6' : '#f59e0b';
      const avgTxt = hasScore ? ('평균 ' + avgScore + '점') : '채점 점수 없음';
      html += `
        <div style="background:${bannerBg};border-left:4px solid ${bannerBorder};border-radius:10px;padding:12px 16px;margin:0 0 16px;">
          <div style="font-size:14px;font-weight:700;color:#1e293b;">완료 ${completedN}/${totalN} · ${avgTxt}</div>
          ${hasScore ? '' : `<div style="font-size:13px;color:#92400e;line-height:1.5;margin-top:4px;">완료한 항목이 영상·자료 시청이라 채점 점수가 없어요. 점수는 퀴즈형 문항을 풀면 표시됩니다.</div>`}
        </div>
      `;

      // 항목별 카드
      for (const it of items) {
        const isQuiz = it.source_type === 'content' && (it.total_questions || it.answers_json);
        const completed = it.status === 'completed';
        const statusBadge = completed ? '<span style="background:#16A34A;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;">완료</span>' : '<span style="background:#94A3B8;color:#fff;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;">미참여</span>';
        html += `
          <div style="border:1px solid #E5E7EB;border-radius:10px;padding:14px 16px;margin-bottom:10px;">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
              <div style="font-weight:700;font-size:14px;color:#1e293b;">${it.sort_order}. ${escapeHtml(it.item_title)}</div>
              <div style="display:flex;gap:8px;align-items:center;">
                ${it.score != null ? `<span style="font-size:12px;color:#4A7CFF;font-weight:700;">${it.score}점</span>` : ''}
                ${statusBadge}
              </div>
            </div>
        `;

        if (it.answers_json) {
          let ansList = [];
          try { ansList = JSON.parse(it.answers_json); } catch(e) {}
          if (ansList.length > 0) {
            const correctN = ansList.filter(a => a.isCorrect).length;
            html += `<div style="font-size:12px;color:#475569;margin-bottom:8px;">정답 <strong style="color:#16A34A;">${correctN}</strong> / 오답 <strong style="color:#DC2626;">${ansList.length - correctN}</strong> · 총 ${ansList.length}문항</div>`;
            ansList.forEach((d, i) => {
              const okBg = d.isCorrect ? '#F0FDF4' : '#FEF2F2';
              const okBd = d.isCorrect ? '#86EFAC' : '#FCA5A5';
              const badge = d.isCorrect ? '<span style="color:#16A34A;font-weight:700;">✓</span>' : '<span style="color:#DC2626;font-weight:700;">✕</span>';
              html += `
                <div style="border:1px solid ${okBd};background:${okBg};border-radius:8px;padding:10px 12px;margin-bottom:6px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                    <div style="font-weight:600;font-size:13px;">문제 ${d.questionNumber || (i+1)} ${badge}</div>
                  </div>
                  <div style="font-size:13px;color:#1e293b;margin-bottom:6px;">${escapeHtml(d.questionText || '')}</div>`;
              if (d.options && d.options.length > 0) {
                html += '<div style="display:grid;gap:4px;">';
                d.options.forEach((opt, oi) => {
                  const isMine = String(d.myAnswer) === String(oi);
                  const isCorrect = String(d.correctAnswer) === String(oi);
                  let bg = '#fff', bd = '#E5E7EB', mark = '';
                  if (isCorrect) { bg = '#DCFCE7'; bd = '#22C55E'; mark = '<span style="color:#16A34A;font-weight:700;margin-left:6px;font-size:11px;">정답</span>'; }
                  if (isMine && !isCorrect) { bg = '#FEE2E2'; bd = '#EF4444'; mark += '<span style="color:#DC2626;font-weight:700;margin-left:6px;font-size:11px;">학생답</span>'; }
                  else if (isMine && isCorrect) { mark += '<span style="color:#16A34A;font-weight:700;margin-left:6px;font-size:11px;">학생답</span>'; }
                  html += `<div style="padding:6px 10px;border:1px solid ${bd};background:${bg};border-radius:6px;font-size:12px;">${oi+1}. ${escapeHtml(opt)} ${mark}</div>`;
                });
                html += '</div>';
              } else {
                html += `<div style="font-size:12px;color:#475569;">학생답: <strong style="color:${d.isCorrect?'#16A34A':'#DC2626'};">${escapeHtml(d.myAnswerText || '-')}</strong> · 정답: <strong style="color:#16A34A;">${escapeHtml(d.correctAnswerText || '-')}</strong></div>`;
              }
              if (d.explanation) html += `<div style="margin-top:6px;padding:6px 10px;background:#F1F5F9;border-radius:5px;font-size:11px;color:#475569;">💡 ${escapeHtml(d.explanation)}</div>`;
              html += '</div>';
            });
          } else {
            html += '<div style="font-size:12px;color:#94a3b8;">정오답 상세가 저장되지 않았습니다 (영상/문서 등 비문항 항목)</div>';
          }
        } else if (it.score != null) {
          html += '<div style="font-size:12px;color:#94a3b8;">이 항목은 정오답 상세 데이터가 없습니다 (구버전 응시 기록).</div>';
        } else {
          html += '<div style="font-size:12px;color:#94a3b8;">이 항목은 별도 정답 데이터가 없습니다 (영상/자료 시청 항목).</div>';
        }
        html += '</div>';
      }

      box.innerHTML = html;
    } catch (err) {
      console.error('Daily result modal error:', err);
      box.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">데이터를 불러올 수 없습니다.</div>';
    }
  };

  // ===== 기초학력 표 필터/정렬 =====
  window.filterBasicStudents = function(query) {
    const q = (query || '').trim().toLowerCase();
    const rows = document.querySelectorAll('#basicResultTable .basic-row');
    let visible = 0;
    rows.forEach(r => {
      const name = (r.dataset.name || '').toLowerCase();
      const show = !q || name.includes(q);
      r.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    const el = document.getElementById('basicVisibleCount');
    if (el) el.textContent = visible;
  };
  window.sortBasicStudents = function(mode) {
    const tbody = document.querySelector('#basicResultTable tbody');
    if (!tbody) return;
    const rows = Array.from(tbody.querySelectorAll('.basic-row'));
    if (mode === 'avg-desc') rows.sort((a, b) => parseInt(b.dataset.avg) - parseInt(a.dataset.avg));
    else if (mode === 'avg-asc') rows.sort((a, b) => parseInt(a.dataset.avg) - parseInt(b.dataset.avg));
    else if (mode === 'min-asc') rows.sort((a, b) => parseInt(a.dataset.min) - parseInt(b.dataset.min));
    else rows.sort((a, b) => (a.dataset.name || '').localeCompare(b.dataset.name || '', 'ko'));
    rows.forEach(r => tbody.appendChild(r));
  };

  // ===== 감정별 응답자 모달 (정서 발달 탭 word-tag 클릭) =====
  window.showEmotionRespondents = async function(emotion, label, totalCount) {
    let modal = document.getElementById('emotionRespondentsModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'emotionRespondentsModal';
      modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10001;display:flex;align-items:center;justify-content:center;padding:20px;';
      modal.innerHTML = '<div id="emotionRespondentsBox" style="background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;"></div>';
      modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
      document.body.appendChild(modal);
    }
    const box = modal.querySelector('#emotionRespondentsBox');
    box.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">로딩 중...</div>';

    try {
      if (!currentClassId) throw new Error('클래스가 선택되지 않았습니다.');
      const res = await fetch(`/api/attendance/${currentClassId}/emotion-respondents?emotion=${encodeURIComponent(emotion)}`).then(r => r.json());
      if (!res.success) throw new Error(res.message);
      const list = res.respondents || [];

      // 학생별 그룹화
      const byUser = {};
      list.forEach(r => {
        const k = r.user_id;
        if (!byUser[k]) byUser[k] = { name: r.display_name || r.username, dates: [], reasons: [] };
        byUser[k].dates.push(r.attendance_date);
        if (r.emotion_reason) byUser[k].reasons.push({ date: r.attendance_date, reason: r.emotion_reason });
      });
      const users = Object.values(byUser).sort((a, b) => b.dates.length - a.dates.length);

      let html = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;border-bottom:1px solid var(--gray-100);padding-bottom:12px;">
          <div>
            <div style="font-size:18px;font-weight:800;color:#1e293b;">${label} 응답 학생</div>
            <div style="font-size:12px;color:#64748b;margin-top:4px;">총 ${list.length}건 응답 · ${users.length}명 학생</div>
          </div>
          <button onclick="document.getElementById('emotionRespondentsModal').remove();" style="background:none;border:none;font-size:24px;color:#94a3b8;cursor:pointer;line-height:1;">×</button>
        </div>
      `;

      if (list.length === 0) {
        html += '<div style="text-align:center;padding:40px;color:#94a3b8;">해당 감정 응답 기록이 없습니다.</div>';
      } else {
        html += '<div style="display:flex;flex-direction:column;gap:10px;">';
        users.forEach(u => {
          const dateChips = u.dates.map(d => `<span style="display:inline-block;background:#eff6ff;color:#1d4ed8;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600;margin:2px;">${d.replace(/-/g, '.')}</span>`).join('');
          const reasonsHtml = u.reasons.length > 0
            ? '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--gray-100);">' +
              u.reasons.map(r => `<div style="font-size:11px;color:var(--gray-500);"><span style="color:#94a3b8;">${r.date.replace(/-/g, '.')}</span> · ${escapeHtml(r.reason)}</div>`).join('') +
              '</div>'
            : '';
          html += `
            <div style="border:1px solid var(--gray-100);border-radius:10px;padding:12px 14px;background:#fff;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                <div style="font-weight:700;font-size:14px;color:#1e293b;">${escapeHtml(u.name)}</div>
                <span style="background:#f1f5f9;color:#475569;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;">${u.dates.length}회</span>
              </div>
              <div>${dateChips}</div>
              ${reasonsHtml}
            </div>`;
        });
        html += '</div>';
      }

      box.innerHTML = html;
    } catch (err) {
      console.error('Emotion respondents modal error:', err);
      box.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">데이터를 불러올 수 없습니다.<br><span style="font-size:12px;color:#94a3b8;">' + (err.message || '') + '</span></div>';
    }
  };
})();
</script>
