<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다채움 - 오답노트</title>
  <link rel="stylesheet" href="/css/common-nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --primary: #4A7CFF; --primary-light: #E8F0FF; --primary-dark: #3A5FCC;
      --accent: #FF6B6B; --accent-light: #FFE8E8;
      --secondary: #7C4DFF; --secondary-light: #EDE7FF;
      --success: #00C48C; --success-light: #E0FFF5;
      --warning: #FFB800; --warning-light: #FFF8E0;
      --gray-50: #F8FAFC; --gray-100: #F1F5F9; --gray-200: #E2E8F0; --gray-300: #CBD5E1;
      --gray-400: #94A3B8; --gray-500: #64748B; --gray-600: #475569; --gray-700: #334155; --gray-800: #1E293B;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 16px; --radius-xl: 24px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Pretendard','Noto Sans KR',system-ui,sans-serif; background: linear-gradient(135deg, #F0F4FF 0%, #FAFBFF 100%); color: var(--gray-800); min-height: 100vh; }

    .app-layout { display: flex; min-height: calc(100vh - 60px); }
    .sidebar-nav { width: 220px; background: #fff; border-right: 1px solid var(--gray-200); padding: 20px 0; flex-shrink: 0; }
    .sidebar-menu { list-style: none; }
    .sidebar-menu li { padding: 10px 20px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 10px; color: var(--gray-600); transition: all .15s; text-decoration: none; }
    .sidebar-menu li:hover { background: var(--gray-50); }
    .sidebar-menu li.active { background: var(--primary-light); color: var(--primary); font-weight: 600; border-right: 3px solid var(--primary); }
    .sidebar-menu li i { width: 18px; text-align: center; }
    .sidebar-menu a { text-decoration: none; color: inherit; display: flex; align-items: center; gap: 10px; width: 100%; }
    /* .main-content max-width / padding 제거 — wrapper(.page-shell)에서 토큰으로 처리 */
    .main-content { flex: 1; }

    /* Page Header */
    /* .page-header 자체 정의 폐기 — dacheum-common.css 의 .page-header 표준 사용 */

    /* Tabs */
    .tab-bar { display: flex; gap: 4px; background: var(--gray-100); border-radius: var(--radius-md); padding: 4px; margin-bottom: 24px; width: fit-content; }
    .tab-btn { padding: 8px 20px; border: none; background: none; font-size: 14px; font-weight: 500; color: var(--gray-500); cursor: pointer; border-radius: var(--radius-sm); transition: all .2s; font-family: inherit; }
    .tab-btn.active { background: #fff; color: var(--primary); box-shadow: var(--shadow-sm); font-weight: 600; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Dashboard Cards */
    .dash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .dash-card { background: #fff; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); text-align: center; }
    .dash-card .dash-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 20px; }
    .dash-card .dash-value { font-size: 28px; font-weight: 700; }
    .dash-card .dash-label { font-size: 13px; color: var(--gray-500); margin-top: 4px; }

    /* Charts Row */
    .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .chart-card { background: #fff; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); }
    .chart-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .chart-wrap { position: relative; height: 240px; }

    /* Filter Bar */
    .filter-bar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .filter-bar select, .filter-bar input { padding: 8px 14px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: #fff; color: var(--gray-700); }
    .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--primary); }
    .btn { padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
    .btn-secondary:hover { background: var(--gray-200); }
    .btn-success { background: var(--success); color: #fff; }
    .btn-success:hover { background: #00a87a; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-accent:hover { background: #e55a5a; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .filter-spacer { flex: 1; }

    /* Wrong Note Cards */
    .wrong-note-list { display: flex; flex-direction: column; gap: 16px; }
    .wn-card { background: #fff; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; border-left: 4px solid var(--accent); transition: all .2s; }
    .wn-card.resolved { border-left-color: var(--success); }
    .wn-card:hover { box-shadow: var(--shadow-md); }
    .wn-card-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; cursor: pointer; }
    .wn-card-header-left { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; }
    .wn-status-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .wn-status-badge.unresolved { background: var(--accent-light); color: var(--accent); }
    .wn-status-badge.resolved { background: var(--success-light); color: var(--success); }
    .wn-subject-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: var(--primary-light); color: var(--primary); white-space: nowrap; }
    .wn-source-badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 700; background: #CCFBF1; color: #0F766E; white-space: nowrap; }
    .wn-diag-banner { display: flex; align-items: center; gap: 10px; padding: 14px 18px; margin-bottom: 20px; border-radius: 12px; background: #CCFBF1; color: #0F766E; font-size: 15px; font-weight: 600; border: 1px solid #99F6E4; }
    .wn-diag-banner i { font-size: 18px; }
    .wn-question-preview { font-size: 14px; font-weight: 500; color: var(--gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .wn-card-header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .wn-attempt-count { font-size: 12px; color: var(--gray-500); display: flex; align-items: center; gap: 4px; }
    .wn-expand-btn { background: none; border: none; cursor: pointer; color: var(--gray-400); font-size: 14px; transition: transform .2s; }
    .wn-card.expanded .wn-expand-btn { transform: rotate(180deg); }
    .wn-card-body { display: none; padding: 0 20px 20px; }
    .wn-card.expanded .wn-card-body { display: block; }
    .wn-detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .wn-detail-box { background: var(--gray-50); border-radius: var(--radius-md); padding: 14px; }
    .wn-detail-box.correct { background: var(--success-light); }
    .wn-detail-box.wrong { background: var(--accent-light); }
    .wn-detail-label { font-size: 12px; color: var(--gray-500); margin-bottom: 6px; font-weight: 500; }
    .wn-detail-value { font-size: 14px; font-weight: 600; }
    .wn-question-full { background: var(--gray-50); border-radius: var(--radius-md); padding: 16px; margin-bottom: 16px; font-size: 14px; line-height: 1.6; }
    .wn-tags-area { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .wn-tag { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 500; background: var(--secondary-light); color: var(--secondary); display: flex; align-items: center; gap: 4px; }
    .wn-tag .remove-tag { cursor: pointer; opacity: .7; }
    .wn-tag .remove-tag:hover { opacity: 1; }
    .wn-tag-input { padding: 4px 10px; border: 1px dashed var(--gray-300); border-radius: 12px; font-size: 11px; background: none; color: var(--gray-500); cursor: pointer; }
    .wn-tag-input:hover { border-color: var(--secondary); color: var(--secondary); }
    .wn-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .wn-explanation { background: #FFF9E6; border-radius: var(--radius-md); padding: 14px; margin-top: 12px; font-size: 13px; line-height: 1.6; border-left: 3px solid var(--warning); }

    /* Pagination */
    .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 24px; }
    .page-btn { width: 36px; height: 36px; border: 1px solid var(--gray-200); background: #fff; border-radius: var(--radius-sm); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 13px; font-family: inherit; color: var(--gray-600); }
    .page-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page-btn:hover:not(.active) { background: var(--gray-50); }

    /* Problem Sets */
    .ps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .ps-card { background: #fff; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow-sm); transition: all .2s; cursor: pointer; border: 2px solid transparent; }
    .ps-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .ps-card-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
    .ps-card-meta { font-size: 13px; color: var(--gray-500); display: flex; gap: 16px; margin-bottom: 12px; }
    .ps-card-meta span { display: flex; align-items: center; gap: 4px; }
    .ps-progress-bar { height: 6px; background: var(--gray-100); border-radius: 3px; overflow: hidden; margin-bottom: 10px; }
    .ps-progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width .3s; }
    .ps-card-footer { display: flex; justify-content: space-between; align-items: center; }
    .ps-score { font-size: 14px; font-weight: 600; color: var(--primary); }

    /* Problem Set Detail */
    .ps-detail { background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); }
    .ps-detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .ps-detail-title { font-size: 18px; font-weight: 700; }
    .ps-item-list { display: flex; flex-direction: column; gap: 12px; }
    .ps-item { display: flex; align-items: center; gap: 14px; padding: 14px; background: var(--gray-50); border-radius: var(--radius-md); }
    .ps-item-num { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-light); color: var(--primary); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ps-item-text { flex: 1; font-size: 14px; }
    .ps-item-subject { font-size: 11px; padding: 3px 8px; border-radius: 12px; background: var(--primary-light); color: var(--primary); }
    .ps-item-remove { background: none; border: none; color: var(--gray-400); cursor: pointer; font-size: 14px; }
    .ps-item-remove:hover { color: var(--accent); }

    /* Solving mode */
    .ps-solving { display: none; }
    .ps-solving.active { display: block; }
    .ps-solve-question { background: #fff; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
    .ps-solve-progress { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    .ps-solve-progress-bar { flex: 1; height: 8px; background: var(--gray-100); border-radius: 4px; overflow: hidden; }
    .ps-solve-progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
    .ps-solve-progress-text { font-size: 13px; color: var(--gray-500); white-space: nowrap; }
    .ps-solve-q-text { font-size: 16px; font-weight: 500; margin-bottom: 20px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .ps-solve-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .ps-solve-option { padding: 14px 18px; border: 2px solid var(--gray-200); border-radius: var(--radius-md); cursor: pointer; font-size: 14px; transition: all .2s; }
    .ps-solve-option:hover { border-color: var(--primary); background: var(--primary-light); }
    .ps-solve-option.selected { border-color: var(--primary); background: var(--primary-light); font-weight: 600; }
    .ps-solve-input { width: 100%; padding: 12px 16px; border: 1px solid var(--gray-200); border-radius: var(--radius-md); font-size: 14px; font-family: inherit; margin-bottom: 20px; }
    .ps-solve-actions { display: flex; gap: 10px; justify-content: flex-end; }

    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 10001; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: #fff; border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--gray-100); }
    .modal-header h3 { font-size: 16px; font-weight: 600; }
    .modal-close { background: none; border: none; font-size: 18px; color: var(--gray-400); cursor: pointer; }
    .modal-body { padding: 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 500; color: var(--gray-600); margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--primary); }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--gray-100); }

    /* Empty State */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--gray-400); }
    .empty-state i { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 14px; }

    /* Tag Stats */
    .tag-stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-stat-item { padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; background: var(--secondary-light); color: var(--secondary); display: flex; align-items: center; gap: 6px; }
    .tag-stat-count { background: var(--secondary); color: #fff; border-radius: 10px; padding: 1px 7px; font-size: 11px; font-weight: 600; }

    /* Loading */
    .loading-spinner { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--gray-400); font-size: 14px; gap: 10px; }

    /* ===== 출처(source) 배지 — 카드·플레이어 공용 ===== */
    .wn-src { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 99px; font-size: 13px; font-weight: 700; white-space: nowrap; line-height: 1.4; }
    .wn-src.src-exam      { background: #DBEAFE; color: #1E40AF; }
    .wn-src.src-diagnosis { background: #CCFBF1; color: #0F766E; }
    .wn-src.src-ai        { background: #EDE7FF; color: #7C3AED; }
    .wn-src.src-content   { background: #FEF3C7; color: #B45309; }
    .wn-src.src-today     { background: #DCFCE7; color: #15803D; }
    .wn-src.src-manual    { background: #F1F5F9; color: #475569; }

    /* 카드 헤더 우측 CTA */
    .wn-replay-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; min-width: 104px; justify-content: center; transition: all .15s; }
    .wn-replay-btn.primary { background: var(--primary); color: #fff; }
    .wn-replay-btn.primary:hover { background: var(--primary-dark); }
    .wn-replay-btn.ghost { background: var(--gray-100); color: var(--gray-600); }
    .wn-replay-btn.ghost:hover { background: var(--gray-200); }
    .wn-group-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border: 1px dashed var(--primary); border-radius: 99px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; background: var(--primary-light); color: var(--primary); white-space: nowrap; transition: all .15s; }
    .wn-group-btn:hover { background: #DBEAFE; }
    .wn-group-banner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 16px; margin: 0 20px 12px; border-radius: 12px; background: linear-gradient(135deg,#EFF6FF,#F5F3FF); border: 1px solid #DBEAFE; font-size: 13px; color: var(--gray-700); }

    /* 복습 모드 안내(아코디언 펼침 시) */
    .wn-review-hint { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* ===== 플레이어 모달 (90vw × 90vh) — CLAUDE.md 표준 ===== */
    .wn-player-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 10000; align-items: center; justify-content: center; padding: 20px; }
    .wn-player-overlay.show { display: flex; }
    .wn-player-modal { width: 90vw; height: 90vh; max-width: 1280px; background: #fff; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 64px rgba(0,0,0,.5); }

    /* 헤더 (고정) */
    .wnp-header { flex-shrink: 0; height: 64px; padding: 0 28px; border-bottom: 1px solid var(--gray-200); background: #F9FAFB; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .wnp-header-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
    .wnp-header-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .wnp-subject { font-size: 15px; font-weight: 600; color: var(--gray-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wnp-unit { font-size: 13px; color: var(--gray-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wnp-progress { display: flex; align-items: center; gap: 10px; }
    .wnp-progress-bar { width: 160px; height: 8px; background: var(--gray-200); border-radius: 4px; overflow: hidden; }
    .wnp-progress-fill { height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
    .wnp-progress-text { font-size: 13px; font-weight: 600; color: var(--gray-600); white-space: nowrap; }
    .wnp-close { width: 40px; height: 40px; flex-shrink: 0; border: none; background: none; font-size: 22px; line-height: 1; color: var(--gray-400); cursor: pointer; border-radius: 10px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .wnp-close:hover { color: var(--gray-800); background: var(--gray-100); }

    /* 본문 (스크롤) */
    .wnp-body { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 28px 32px; }
    .wnp-col { max-width: 760px; margin: 0 auto; }
    .wnp-fallback-note { background: var(--gray-100); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--gray-600); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
    .wnp-q-meta { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    .wnp-q-num { font-size: 13px; font-weight: 600; color: var(--gray-500); }
    .wnp-type-badge { padding: 4px 12px; border-radius: 99px; font-size: 12px; font-weight: 700; }
    .wnp-type-badge.choice { background: var(--primary-light); color: var(--primary); }
    .wnp-type-badge.short { background: var(--success-light); color: #059669; }
    .wnp-instruction { background: var(--gray-50); border-radius: 10px; padding: 14px 16px; font-size: 15px; color: var(--gray-700); line-height: 1.7; margin-bottom: 16px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
    .wnp-q-text { font-size: 20px; font-weight: 600; line-height: 1.75; color: var(--gray-800); margin-bottom: 24px; word-break: break-word; white-space: pre-wrap; overflow-wrap: anywhere; }

    /* 객관식 보기 */
    .wnp-options { display: flex; flex-direction: column; gap: 12px; }
    .wnp-option { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border: 2px solid var(--gray-200); border-radius: 12px; cursor: pointer; background: #fff; transition: all .15s; min-height: 56px; text-align: left; font-family: inherit; width: 100%; }
    .wnp-option:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .wnp-option.selected { border-color: var(--primary); background: var(--primary-light); }
    .wnp-option.selected .wnp-option-text { font-weight: 600; }
    .wnp-option:disabled { cursor: default; }
    .wnp-option.review-correct { border-color: #6ee7b7; background: #ecfdf5; }
    .wnp-option.review-wrong { border-color: #fca5a5; background: #fef2f2; }
    .wnp-option-num { width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: var(--gray-100); color: var(--gray-600); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; transition: all .15s; }
    .wnp-option.selected .wnp-option-num { background: var(--primary); color: #fff; }
    .wnp-option.review-correct .wnp-option-num { background: #16a34a; color: #fff; }
    .wnp-option.review-wrong .wnp-option-num { background: #ef4444; color: #fff; }
    .wnp-option-text { font-size: 16px; color: var(--gray-700); line-height: 1.6; flex: 1; }
    @keyframes wnpPulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .wnp-option.review-correct .wnp-option-num { animation: wnpPulse .35s ease; }

    /* 단답 입력 */
    .wnp-short-input { width: 100%; padding: 14px 16px; border: 2px solid var(--gray-200); border-radius: 12px; font-size: 16px; font-family: inherit; color: var(--gray-800); }
    .wnp-short-input:focus { outline: none; border-color: var(--primary); }
    .wnp-short-input:disabled { background: var(--gray-50); color: var(--gray-600); }

    /* 채점 결과 배너 */
    .wnp-result { padding: 16px 20px; border-radius: 12px; font-weight: 700; font-size: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; animation: wnpSlide .2s ease; }
    @keyframes wnpSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .wnp-result.correct { background: linear-gradient(135deg,#ecfdf5,#d1fae5); border: 1.5px solid #6ee7b7; color: #16a34a; }
    .wnp-result.wrong { background: #fef2f2; border: 1.5px solid #fca5a5; color: #ef4444; }
    .wnp-explanation { background: #FFF9E6; border-left: 3px solid var(--warning); border-radius: 10px; padding: 14px 16px; font-size: 15px; line-height: 1.7; color: var(--gray-700); margin-bottom: 16px; }
    .wnp-explanation strong { color: var(--gray-800); }

    /* 상태 (로딩/에러/풀이불가) */
    .wnp-state { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 14px; padding: 60px 20px; color: var(--gray-500); min-height: 240px; }
    .wnp-state i { font-size: 44px; color: var(--gray-300); }
    .wnp-state h4 { font-size: 18px; font-weight: 700; color: var(--gray-700); }
    .wnp-state p { font-size: 15px; line-height: 1.6; }

    /* 푸터 (고정) */
    .wnp-footer { flex-shrink: 0; padding: 16px 28px; border-top: 1px solid var(--gray-100); background: #F8FAFC; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .wnp-footer-left { display: flex; gap: 10px; }
    .wnp-footer-right { display: flex; gap: 10px; align-items: center; }
    .wnp-btn { display: inline-flex; align-items: center; gap: 6px; padding: 12px 24px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: all .15s; }
    .wnp-btn.primary { background: var(--primary); color: #fff; }
    .wnp-btn.primary:hover:not(:disabled) { background: var(--primary-dark); }
    .wnp-btn.primary:disabled { background: var(--gray-300); color: #fff; cursor: not-allowed; }
    .wnp-btn.success { background: var(--success); color: #fff; }
    .wnp-btn.success:hover { background: #00a87a; }
    .wnp-btn.ghost { background: #fff; color: var(--gray-600); border: 1px solid var(--gray-200); }
    .wnp-btn.ghost:hover { background: var(--gray-50); }
    .wnp-btn .fa-spinner { animation: fa-spin 1s linear infinite; }

    @media (max-width: 768px) {
      .sidebar-nav { display: none; }
      .dash-grid { grid-template-columns: repeat(2, 1fr); }
      .charts-row { grid-template-columns: 1fr; }
      .wn-detail-grid { grid-template-columns: 1fr; }
      .filter-bar { flex-direction: column; align-items: stretch; }
      .ps-grid { grid-template-columns: 1fr; }

      /* 플레이어 모달 모바일 */
      .wn-player-modal { width: 96vw; height: 94vh; border-radius: 14px; }
      .wnp-header { height: auto; padding: 12px 16px; gap: 10px; }
      .wnp-progress-bar { width: 90px; }
      .wnp-body { padding: 20px 16px; }
      .wnp-q-text { font-size: 18px; }
      .wnp-option { padding: 14px 16px; min-height: 52px; }
      .wnp-footer { padding: 12px 16px; flex-wrap: wrap; }
      .wnp-footer-left, .wnp-footer-right { flex: 1; }
      .wnp-footer-right { justify-content: flex-end; }
      .wnp-btn { padding: 12px 18px; flex: 1; justify-content: center; }
      .wn-card-header { flex-wrap: wrap; }
      .wn-replay-btn { min-width: 92px; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <main class="main-content" style="padding:0;">
      <header class="page-header">
        <div class="page-header__main">
          <div class="page-header__title-row">
            <span class="page-header__icon" aria-hidden="true">❌</span>
            <h1 class="page-header__title">오답노트</h1>
          </div>
          <p class="page-header__subtitle">틀린 문제를 분석하고 다시 도전하세요.</p>
        </div>
      </header>

      <!-- Tabs (역할에 따라 동적 생성) -->
      <div class="tab-bar" id="mainTabBar">
        <!-- JS에서 역할별 탭 생성 -->
      </div>
      <!-- 학생 탭 (숨김 처리, JS에서 전환) -->
      <div class="tab-bar student-tabs" style="display:none;">
        <button class="tab-btn active" data-tab="wrong-notes"><i class="fas fa-list"></i> 오답 목록</button>
        <button class="tab-btn" data-tab="problem-sets"><i class="fas fa-book"></i> 내 문제집</button>
      </div>

      <!-- ========== TAB 1: 오답 목록 ========== -->
      <div id="tab-wrong-notes" class="tab-panel active">

        <!-- 진단 진입 안내 배너 (?from=diagnosis 시 노출) -->
        <div class="wn-diag-banner" id="diagEntryBanner" style="display:none;">
          <i class="fas fa-compass"></i>
          <span>진단검사에서 담은 오답을 모았어요. 🧭 진단 배지가 붙은 문제부터 복습해 보세요.</span>
        </div>

        <!-- Dashboard Summary -->
        <div class="dash-grid" id="dashGrid">
          <div class="dash-card">
            <div class="dash-icon" style="background:var(--accent-light);color:var(--accent)"><i class="fas fa-times-circle"></i></div>
            <div class="dash-value" id="dashTotal">0</div>
            <div class="dash-label">전체 오답</div>
          </div>
          <div class="dash-card">
            <div class="dash-icon" style="background:var(--success-light);color:var(--success)"><i class="fas fa-check-circle"></i></div>
            <div class="dash-value" id="dashResolved">0</div>
            <div class="dash-label">해결 완료</div>
          </div>
          <div class="dash-card">
            <div class="dash-icon" style="background:var(--warning-light);color:var(--warning)"><i class="fas fa-redo"></i></div>
            <div class="dash-value" id="dashRetryAvg">0</div>
            <div class="dash-label">평균 재도전 횟수</div>
          </div>
          <div class="dash-card">
            <div class="dash-icon" style="background:var(--primary-light);color:var(--primary)"><i class="fas fa-percentage"></i></div>
            <div class="dash-value" id="dashResolveRate">0%</div>
            <div class="dash-label">해결률</div>
          </div>
        </div>

        <!-- Charts -->
        <div class="charts-row">
          <div class="chart-card">
            <h3><i class="fas fa-chart-pie" style="color:var(--primary)"></i> 과목별 오답 분포</h3>
            <div class="chart-wrap"><canvas id="subjectPieChart"></canvas></div>
          </div>
          <div class="chart-card">
            <h3><i class="fas fa-chart-line" style="color:var(--success)"></i> 해결 추이</h3>
            <div class="chart-wrap"><canvas id="resolutionTrendChart"></canvas></div>
          </div>
        </div>

        <!-- Tag Stats -->
        <div class="chart-card" style="margin-bottom:24px" id="tagStatsCard">
          <h3><i class="fas fa-tags" style="color:var(--secondary)"></i> 태그별 통계</h3>
          <div class="tag-stats" id="tagStatsContainer"></div>
        </div>

        <!-- Filter Bar -->
        <div class="filter-bar">
          <select id="filterSubject">
            <option value="">전체 과목</option>
          </select>
          <select id="filterStatus">
            <option value="">전체 상태</option>
            <option value="unresolved">미해결</option>
            <option value="resolved">해결 완료</option>
          </select>
          <select id="filterSort">
            <option value="newest">최신순</option>
            <option value="oldest">오래된순</option>
            <option value="most_attempts">재도전 많은순</option>
          </select>
          <div class="filter-spacer"></div>
          <button class="btn btn-primary" onclick="openManualModal()"><i class="fas fa-plus"></i> 수동 등록</button>
        </div>

        <!-- Wrong Note List -->
        <div class="wrong-note-list" id="wrongNoteList">
          <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> 오답 목록을 불러오는 중...</div>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination"></div>
      </div>

      <!-- ========== TAB 2: 내 문제집 ========== -->
      <div id="tab-problem-sets" class="tab-panel">
        <div class="filter-bar" style="margin-bottom:20px">
          <h2 style="font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px"><i class="fas fa-book" style="color:var(--secondary)"></i> 내 문제집</h2>
          <div class="filter-spacer"></div>
          <button class="btn btn-primary" onclick="openCreatePSModal()"><i class="fas fa-plus"></i> 문제집 만들기</button>
        </div>

        <!-- Problem Set List View -->
        <div id="psListView">
          <div class="ps-grid" id="psGrid">
            <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> 문제집을 불러오는 중...</div>
          </div>
        </div>

        <!-- Problem Set Detail View -->
        <div id="psDetailView" style="display:none">
          <div class="ps-detail" id="psDetailContent"></div>
        </div>

        <!-- Problem Set Solving View -->
        <div id="psSolvingView" class="ps-solving"></div>
      </div>
    </main>
  </div>

  <!-- ===== 오답 다시풀기 플레이어 모달 (90vw × 90vh) ===== -->
  <div class="wn-player-overlay" id="wnPlayerModal" aria-modal="true" role="dialog">
    <div class="wn-player-modal">
      <div class="wnp-header">
        <div class="wnp-header-left" id="wnpHeaderLeft"><!-- 출처배지 + 과목/단원 + (묶음)진행 --></div>
        <button class="wnp-close" onclick="closeWnPlayer()" title="닫기" aria-label="닫기">&times;</button>
      </div>
      <div class="wnp-body" id="wnpBody"><!-- 문항/보기/결과 --></div>
      <div class="wnp-footer" id="wnpFooter"><!-- 이전/닫기/제출/다음 --></div>
    </div>
  </div>

  <!-- Manual Wrong Note Modal -->
  <div class="modal-overlay" id="manualModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-plus-circle"></i> 오답 수동 등록</h3>
        <button class="modal-close" onclick="closeManualModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>과목</label>
          <select id="manualSubject">
            <option value="국어">국어</option>
            <option value="수학">수학</option>
            <option value="영어">영어</option>
            <option value="사회">사회</option>
            <option value="과학">과학</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="form-group">
          <label>문제</label>
          <textarea id="manualQuestion" placeholder="틀린 문제를 입력하세요"></textarea>
        </div>
        <div class="form-group">
          <label>정답</label>
          <input type="text" id="manualCorrectAnswer" placeholder="정답을 입력하세요">
        </div>
        <div class="form-group">
          <label>내가 쓴 답</label>
          <input type="text" id="manualMyAnswer" placeholder="내가 쓴 답을 입력하세요">
        </div>
        <div class="form-group">
          <label>해설 (선택)</label>
          <textarea id="manualExplanation" placeholder="해설이 있으면 입력하세요"></textarea>
        </div>
        <div class="form-group">
          <label>태그 (쉼표로 구분)</label>
          <input type="text" id="manualTags" placeholder="예: 분수, 소수, 나눗셈">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeManualModal()">취소</button>
        <button class="btn btn-primary" onclick="submitManualNote()">등록</button>
      </div>
    </div>
  </div>

  <!-- Create Problem Set Modal -->
  <div class="modal-overlay" id="createPSModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-book-medical"></i> 문제집 만들기</h3>
        <button class="modal-close" onclick="closeCreatePSModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>문제집 이름</label>
          <input type="text" id="psTitle" placeholder="예: 수학 오답 모음">
        </div>
        <div class="form-group">
          <label>설명 (선택)</label>
          <textarea id="psDescription" placeholder="문제집에 대한 설명을 입력하세요"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeCreatePSModal()">취소</button>
        <button class="btn btn-primary" onclick="submitCreatePS()">만들기</button>
      </div>
    </div>
  </div>

  <!-- Tag Edit Modal -->
  <div class="modal-overlay" id="tagEditModal">
    <div class="modal">
      <div class="modal-header">
        <h3><i class="fas fa-tags"></i> 태그 수정</h3>
        <button class="modal-close" onclick="closeTagEditModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>태그 (쉼표로 구분)</label>
          <input type="text" id="tagEditInput" placeholder="예: 분수, 소수, 나눗셈">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeTagEditModal()">취소</button>
        <button class="btn btn-primary" onclick="submitTagEdit()">저장</button>
      </div>
    </div>
  </div>

  <script src="/js/common-nav.js"></script>
  <script>
    'use strict';

    let currentUser = null;
    let wrongNotes = [];
    let currentPage = 1;
    let totalPages = 1;
    let dashboardData = null;
    let problemSets = [];
    let currentPSDetail = null;
    let solvingState = null;
    let tagEditNoteId = null;

    // Charts
    let subjectPieChart = null;
    let resolutionTrendChart = null;

    // ===== Auth =====
    async function fetchWithAuth(url, options = {}) {
      const res = await fetch(url, { ...options, headers: { 'Content-Type': 'application/json', ...(options.headers || {}) } });
      if (res.status === 401) { window.location.href = '/login.html'; return null; }
      return res.json();
    }

    window.addEventListener('dacheim:user-loaded', (e) => {
      currentUser = e.detail;
      initTabsByRole();
      maybeShowDiagBanner();
      loadDashboard();
      loadWrongNotes();
    });

    // ?from=diagnosis 진입 시 안내 배너 노출 (학생 뷰 전용)
    function maybeShowDiagBanner() {
      const banner = document.getElementById('diagEntryBanner');
      if (!banner) return;
      const isTeacher = currentUser && (currentUser.role === 'teacher' || currentUser.role === 'admin');
      const from = new URLSearchParams(window.location.search).get('from');
      banner.style.display = (!isTeacher && from === 'diagnosis') ? 'flex' : 'none';
    }

    function initTabsByRole() {
      const tabBar = document.getElementById('mainTabBar');
      if (!tabBar) return;
      const isTeacher = currentUser && (currentUser.role === 'teacher' || currentUser.role === 'admin');
      if (isTeacher) {
        tabBar.innerHTML = `
          <button class="tab-btn active" data-tab="wrong-notes"><i class="fas fa-chart-bar"></i> 학급 오답 대시보드</button>
          <button class="tab-btn" data-tab="exam-analysis"><i class="fas fa-clipboard-list"></i> 평가지별 분석</button>
          <button class="tab-btn" data-tab="question-analysis"><i class="fas fa-search"></i> 문항 분석</button>
          <button class="tab-btn" data-tab="student-status"><i class="fas fa-users"></i> 학생별 현황</button>
        `;
      } else {
        tabBar.innerHTML = `
          <button class="tab-btn active" data-tab="wrong-notes"><i class="fas fa-list"></i> 오답 목록</button>
          <button class="tab-btn" data-tab="problem-sets"><i class="fas fa-book"></i> 내 문제집</button>
        `;
      }
      // 탭 이벤트 재바인딩
      tabBar.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          tabBar.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const tab = btn.dataset.tab;
          document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
          const panel = document.getElementById('panel-' + tab);
          if (panel) panel.classList.add('active');
          if (tab === 'wrong-notes') { loadWrongNotes(); }
          else if (tab === 'problem-sets') { loadProblemSets(); }
          else if (tab === 'exam-analysis') { loadExamAnalysis(); }
          else if (tab === 'question-analysis') { loadQuestionAnalysis(); }
          else if (tab === 'student-status') { loadStudentStatus(); }
        });
      });
    }

    // 교사 전용 탭 로드 함수 (플레이스홀더)
    async function loadExamAnalysis() {
      let panel = document.getElementById('panel-exam-analysis');
      if (!panel) { panel = document.createElement('div'); panel.id = 'panel-exam-analysis'; panel.className = 'tab-panel active'; document.querySelector('.main-content').appendChild(panel); }
      panel.classList.add('active');
      panel.innerHTML = '<div style="text-align:center;padding:60px;color:var(--gray-400);"><i class="fas fa-clipboard-list" style="font-size:48px;margin-bottom:16px;"></i><h3>평가지별 오답 분석</h3><p style="margin-top:8px;">클래스의 평가지를 선택하면 문항별 오답률을 확인할 수 있습니다.</p></div>';
      // TODO: 실제 평가지 목록 로드
    }

    async function loadQuestionAnalysis() {
      let panel = document.getElementById('panel-question-analysis');
      if (!panel) { panel = document.createElement('div'); panel.id = 'panel-question-analysis'; panel.className = 'tab-panel active'; document.querySelector('.main-content').appendChild(panel); }
      panel.classList.add('active');
      panel.innerHTML = '<div style="text-align:center;padding:60px;color:var(--gray-400);"><i class="fas fa-search" style="font-size:48px;margin-bottom:16px;"></i><h3>문항 분석</h3><p style="margin-top:8px;">개별 문항의 오답 패턴과 난이도를 분석합니다.</p></div>';
    }

    async function loadStudentStatus() {
      let panel = document.getElementById('panel-student-status');
      if (!panel) { panel = document.createElement('div'); panel.id = 'panel-student-status'; panel.className = 'tab-panel active'; document.querySelector('.main-content').appendChild(panel); }
      panel.classList.add('active');
      try {
        const data = await fetchWithAuth('/api/self-learn/wrong-notes/teacher-dashboard');
        if (!data || !data.success) { panel.innerHTML = '<div style="text-align:center;padding:40px;color:var(--gray-400);">데이터를 불러올 수 없습니다.</div>'; return; }
        const students = data.students || [];
        panel.innerHTML = `
          <h3 style="margin-bottom:16px;font-size:16px;font-weight:700;"><i class="fas fa-users" style="color:var(--primary);margin-right:6px;"></i>학생별 오답 현황 (${students.length}명)</h3>
          <table style="width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);">
            <thead><tr style="background:var(--gray-50);">
              <th style="padding:12px;font-size:12px;text-align:left;">학생</th>
              <th style="padding:12px;font-size:12px;text-align:center;">전체 오답</th>
              <th style="padding:12px;font-size:12px;text-align:center;">미해결</th>
              <th style="padding:12px;font-size:12px;text-align:center;">해결률</th>
            </tr></thead>
            <tbody>
              ${students.length ? students.map(st => `<tr>
                <td style="padding:10px 12px;font-size:13px;font-weight:500;">${st.display_name || st.username}</td>
                <td style="padding:10px;text-align:center;font-size:13px;">${st.total_wrong || 0}</td>
                <td style="padding:10px;text-align:center;font-size:13px;color:var(--accent);font-weight:600;">${(st.total_wrong||0) - (st.resolved_wrong||0)}</td>
                <td style="padding:10px;text-align:center;font-size:13px;">${st.total_wrong ? Math.round(st.resolved_wrong / st.total_wrong * 100) + '%' : '-'}</td>
              </tr>`).join('') : '<tr><td colspan="4" style="padding:30px;text-align:center;color:var(--gray-400);">오답 데이터가 없습니다.</td></tr>'}
            </tbody>
          </table>
        `;
      } catch { panel.innerHTML = '<div style="padding:40px;text-align:center;color:var(--gray-400);">로드 실패</div>'; }
    }

    // ===== Tabs =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        if (btn.dataset.tab === 'problem-sets') loadProblemSets();
      });
    });

    // ===== Dashboard =====
    async function loadDashboard() {
      const isTeacher = currentUser && (currentUser.role === 'teacher' || currentUser.role === 'admin');

      if (isTeacher) {
        // 교사: 학적 기반 학급 오답 통계 (같은 학교+학년+반)
        const data = await fetchWithAuth('/api/self-learn/wrong-notes/teacher-dashboard');
        if (!data || !data.success) return;

        // 학급 정보 표시 (한번만)
        if (!document.getElementById('classInfo') && (data.schoolName || data.grade)) {
          const infoHtml = `<div id="classInfo" style="margin-bottom:16px;padding:12px 20px;background:linear-gradient(135deg,var(--primary-light),#E0F2FE);border-radius:12px;display:flex;align-items:center;gap:12px;">
            <i class="fas fa-school" style="font-size:20px;color:var(--primary);"></i>
            <div><span style="font-size:15px;font-weight:700;color:var(--gray-800);">${data.schoolName || ''} ${data.grade || ''}학년 ${data.classNumber || ''}반</span>
            <span style="font-size:12px;color:var(--gray-500);margin-left:8px;">담임교사: ${currentUser.display_name}</span></div>
          </div>`;
          document.getElementById('dashGrid').insertAdjacentHTML('beforebegin', infoHtml);
        }
        dashboardData = data;
        const students = data.students || [];
        const totalWrong = students.reduce((s, st) => s + (st.total_wrong || 0), 0);
        const totalResolved = students.reduce((s, st) => s + (st.resolved_wrong || 0), 0);

        document.getElementById('dashTotal').textContent = totalWrong;
        document.getElementById('dashResolved').textContent = totalResolved;
        document.getElementById('dashRetryAvg').textContent = students.length + '명';
        document.getElementById('dashResolveRate').textContent = totalWrong > 0 ? Math.round(totalResolved / totalWrong * 100) + '%' : '0%';

        // 카드 라벨 변경
        document.querySelectorAll('.dash-label').forEach(el => {
          if (el.textContent === '평균 재도전 횟수') el.textContent = '관리 학생';
        });

        renderSubjectChart(data.bySubject || data.by_subject || []);
        renderTrendChart(data.trend || []);
        renderTagStats(data.byTag || data.by_tag || []);
        populateSubjectFilter(data.bySubject || data.by_subject || []);
        return;
      }

      // 학생: 내 오답 통계
      const data = await fetchWithAuth('/api/self-learn/wrong-notes/dashboard');
      if (!data || !data.success) return;
      dashboardData = data;

      const total = data.total || 0;
      const resolved = data.resolved || 0;
      document.getElementById('dashTotal').textContent = total;
      document.getElementById('dashResolved').textContent = resolved;
      document.getElementById('dashRetryAvg').textContent = (data.avg_attempts || 0).toFixed(1);
      document.getElementById('dashResolveRate').textContent = total > 0 ? Math.round((resolved / total) * 100) + '%' : '0%';

      renderSubjectChart(data.bySubject || data.by_subject || []);
      renderTrendChart(data.trend || []);
      renderTagStats(data.byTag || data.by_tag || []);
      populateSubjectFilter(data.bySubject || data.by_subject || []);
    }

    function renderSubjectChart(bySubject) {
      const ctx = document.getElementById('subjectPieChart').getContext('2d');
      if (subjectPieChart) subjectPieChart.destroy();
      const labels = bySubject.map(s => s.subject || '기타');
      const values = bySubject.map(s => s.cnt || s.count || 0);
      const colors = ['#4A7CFF','#FF6B6B','#00C48C','#FFB800','#7C4DFF','#FF9F43','#54A0FF','#5F27CD'];
      subjectPieChart = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: values, backgroundColor: colors.slice(0, labels.length), borderWidth: 0 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 12, family: 'Pretendard' }, padding: 12 } } } }
      });
    }

    function renderTrendChart(trend) {
      const ctx = document.getElementById('resolutionTrendChart').getContext('2d');
      if (resolutionTrendChart) resolutionTrendChart.destroy();
      const labels = trend.map(t => t.date || t.month || t.label || '');
      const added = trend.map(t => t.added || 0);
      const resolvedArr = trend.map(t => t.resolved || 0);
      resolutionTrendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [
            { label: '추가된 오답', data: added, borderColor: '#FF6B6B', backgroundColor: 'rgba(255,107,107,.1)', fill: true, tension: .3 },
            { label: '해결된 오답', data: resolvedArr, borderColor: '#00C48C', backgroundColor: 'rgba(0,196,140,.1)', fill: true, tension: .3 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { font: { size: 12, family: 'Pretendard' } } } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } }
      });
    }

    function renderTagStats(byTag) {
      const container = document.getElementById('tagStatsContainer');
      if (!byTag.length) {
        container.innerHTML = '<span style="color:var(--gray-400);font-size:13px">등록된 태그가 없습니다</span>';
        return;
      }
      container.innerHTML = byTag.map(t =>
        `<div class="tag-stat-item"><span>${t.tag}</span><span class="tag-stat-count">${t.count}</span></div>`
      ).join('');
    }

    function populateSubjectFilter(bySubject) {
      const sel = document.getElementById('filterSubject');
      const existing = new Set([...sel.options].map(o => o.value));
      bySubject.forEach(s => {
        if (s.subject && !existing.has(s.subject)) {
          const opt = document.createElement('option');
          opt.value = s.subject;
          opt.textContent = s.subject;
          sel.appendChild(opt);
        }
      });
    }

    // ===== Wrong Notes List =====
    async function loadWrongNotes() {
      const subject = document.getElementById('filterSubject').value;
      const status = document.getElementById('filterStatus').value;
      const sort = document.getElementById('filterSort').value;
      const params = new URLSearchParams({ page: currentPage });
      if (subject) params.set('subject', subject);
      if (status) params.set('status', status);
      if (sort) params.set('sort', sort);

      const data = await fetchWithAuth('/api/self-learn/wrong-notes?' + params);
      if (!data || !data.success) return;

      wrongNotes = data.notes || data.items || [];
      totalPages = data.totalPages || data.total_pages || 1;
      renderWrongNotes();
      renderPagination();
    }

    // 출처(source) → 배지 메타 (카드·플레이어 공용)
    function wnSourceMeta(source) {
      switch (source) {
        case 'exam':           return { cls: 'src-exam',      icon: 'fa-clipboard-list',  label: '평가' };
        case 'diagnosis':      return { cls: 'src-diagnosis', icon: 'fa-compass',         label: '진단', emoji: '🧭' };
        case 'ai_learning':    return { cls: 'src-ai',        icon: 'fa-robot',           label: 'AI맞춤학습' };
        case 'today_learning': return { cls: 'src-today',     icon: 'fa-calendar-day',    label: '오늘의학습' };
        case 'content':        return { cls: 'src-content',   icon: 'fa-photo-film',      label: '채움콘텐츠' };
        case 'manual':         return { cls: 'src-manual',    icon: 'fa-pen',             label: '직접 추가' };
        default:               return { cls: 'src-manual',    icon: 'fa-circle-question', label: '기타' };
      }
    }
    function wnSourceBadge(source) {
      const m = wnSourceMeta(source);
      const inner = m.emoji ? `${m.emoji} ${m.label}` : `<i class="fas ${m.icon}"></i> ${m.label}`;
      return `<span class="wn-src ${m.cls}" title="출처: ${m.label}">${inner}</span>`;
    }

    function renderWrongNotes() {
      const container = document.getElementById('wrongNoteList');
      if (!wrongNotes.length) {
        const status = document.getElementById('filterStatus').value;
        const subject = document.getElementById('filterSubject').value;
        if (status || subject) {
          container.innerHTML = '<div class="empty-state"><i class="fas fa-filter"></i><p>이 조건에 해당하는 오답이 없어요. 필터를 바꿔보세요.</p></div>';
        } else {
          container.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle" style="color:var(--success)"></i><p>틀린 문제가 없어요! 잘하고 있어요. 🎉</p><a href="/self-learn/today.html" class="btn btn-primary" style="margin-top:16px;text-decoration:none"><i class="fas fa-pen"></i> 오늘의 학습 가기</a></div>';
        }
        return;
      }
      // 같은 평가지 미해결 오답 ≥2건 → 묶음 풀기 안내(그룹 첫 카드 위 배너). exam_id 기준.
      const groupCount = {};
      wrongNotes.forEach(n => {
        const ex = n.exam_id;
        const unresolved = !(n.status === 'resolved' || n.is_resolved);
        if (ex && unresolved) groupCount[ex] = (groupCount[ex] || 0) + 1;
      });
      const groupShown = {};

      container.innerHTML = wrongNotes.map(note => {
        const isResolved = note.status === 'resolved' || note.is_resolved;
        const source = note.source || (note.exam_id != null ? 'exam' : 'manual');
        const tags = (note.tags || '').split(',').filter(t => t.trim());
        const attempt = note.attempt_count || note.retry_count || 0;
        const preview = note.question_text || note.question || '(문제 내용 없음)';

        // 묶음 배너 (그룹 첫 등장 시 1회)
        let banner = '';
        const ex = note.exam_id;
        if (ex && !isResolved && groupCount[ex] >= 2 && !groupShown[ex]) {
          groupShown[ex] = true;
          banner = `<div class="wn-group-banner">
            <i class="fas fa-layer-group" style="color:var(--primary)"></i>
            <span>같은 평가지에서 틀린 문제가 <strong>${groupCount[ex]}개</strong> 있어요.</span>
            <button class="wn-group-btn" onclick="openExamGroupPlayer('${escapeHtml(String(ex))}')"><i class="fas fa-list-ol"></i> 이 평가지 오답 ${groupCount[ex]}개 모아 풀기</button>
          </div>`;
        }

        const cta = isResolved
          ? `<button class="wn-replay-btn ghost" onclick="event.stopPropagation();openWnPlayer(${note.id})" title="한번 더 풀어보기"><i class="fas fa-rotate-right"></i> 한번 더</button>`
          : `<button class="wn-replay-btn primary" onclick="event.stopPropagation();openWnPlayer(${note.id})" title="플레이어로 다시 풀기"><i class="fas fa-play"></i> 다시 풀기</button>`;

        return banner + `
          <div class="wn-card ${isResolved ? 'resolved' : ''}" id="wn-${note.id}">
            <div class="wn-card-header">
              <div class="wn-card-header-left" onclick="openWnPlayer(${note.id})" style="cursor:pointer" title="다시 풀기">
                <span class="wn-status-badge ${isResolved ? 'resolved' : 'unresolved'}">${isResolved ? '해결' : '미해결'}</span>
                ${wnSourceBadge(source)}
                <span class="wn-subject-tag">${escapeHtml(note.subject || '기타')}</span>
                <span class="wn-question-preview">${escapeHtml(preview)}</span>
              </div>
              <div class="wn-card-header-right">
                <span class="wn-attempt-count" title="이 문제를 다시 푼 횟수"><i class="fas fa-redo"></i> 재도전 ${attempt}회</span>
                ${cta}
                <button class="wn-expand-btn" onclick="event.stopPropagation();toggleWNCard(${note.id})" title="정답·해설 보기(복습)" aria-label="복습 모드 펼치기"><i class="fas fa-chevron-down"></i></button>
              </div>
            </div>
            <div class="wn-card-body">
              <div class="wn-review-hint"><i class="fas fa-eye"></i> 복습 모드 — 정답과 해설을 확인하는 화면이에요. 다시 풀려면 <strong>다시 풀기</strong>를 누르세요.</div>
              <div class="wn-question-full">${escapeHtml(preview)}</div>
              <div class="wn-detail-grid">
                <div class="wn-detail-box correct">
                  <div class="wn-detail-label">정답</div>
                  <div class="wn-detail-value">${escapeHtml(note.correct_answer || '')}</div>
                </div>
                <div class="wn-detail-box wrong">
                  <div class="wn-detail-label">내가 쓴 답</div>
                  <div class="wn-detail-value">${escapeHtml(note.my_answer || note.user_answer || '')}</div>
                </div>
              </div>
              ${note.explanation ? `<div class="wn-explanation"><strong>해설:</strong> ${escapeHtml(note.explanation)}</div>` : ''}
              <div class="wn-tags-area">
                <i class="fas fa-tags" style="color:var(--secondary);font-size:13px"></i>
                ${tags.map(t => `<span class="wn-tag">${escapeHtml(t.trim())}</span>`).join('')}
                <button class="wn-tag-input" onclick="event.stopPropagation();openTagEditModal(${note.id}, '${escapeHtml(note.tags || '')}')"><i class="fas fa-pen"></i> 태그 수정</button>
              </div>
              <div class="wn-actions">
                <button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openWnPlayer(${note.id})"><i class="fas fa-play"></i> 다시 풀기</button>
                <button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();addToProblemSet(${note.id})"><i class="fas fa-plus"></i> 문제집에 추가</button>
              </div>
            </div>
          </div>`;
      }).join('');
      renderMathIn(container);
    }

    // KaTeX 수식 렌더링 ($...$, $$...$$, \(...\), \[...\])
    function renderMathIn(el) {
      try {
        if (window.renderMathInElement && el) {
          window.renderMathInElement(el, {
            delimiters: [
              { left: '$$', right: '$$', display: true },
              { left: '$',  right: '$',  display: false },
              { left: '\\(', right: '\\)', display: false },
              { left: '\\[', right: '\\]', display: true }
            ],
            throwOnError: false,
            ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
          });
        }
      } catch (e) {}
    }

    function toggleWNCard(id) {
      const card = document.getElementById('wn-' + id);
      if (card) card.classList.toggle('expanded');
    }

    function renderPagination() {
      const container = document.getElementById('pagination');
      if (totalPages <= 1) { container.innerHTML = ''; return; }
      let html = '';
      if (currentPage > 1) html += `<button class="page-btn" onclick="goToPage(${currentPage - 1})"><i class="fas fa-chevron-left"></i></button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || Math.abs(i - currentPage) <= 2) {
          html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        } else if (Math.abs(i - currentPage) === 3) {
          html += `<button class="page-btn" disabled>...</button>`;
        }
      }
      if (currentPage < totalPages) html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})"><i class="fas fa-chevron-right"></i></button>`;
      container.innerHTML = html;
    }

    function goToPage(page) { currentPage = page; loadWrongNotes(); }

    // Filter events
    document.getElementById('filterSubject').addEventListener('change', () => { currentPage = 1; loadWrongNotes(); });
    document.getElementById('filterStatus').addEventListener('change', () => { currentPage = 1; loadWrongNotes(); });
    document.getElementById('filterSort').addEventListener('change', () => { currentPage = 1; loadWrongNotes(); });

    // ===== 다시풀기 플레이어 =====
    // 플레이어 상태: 단일 또는 묶음(평가지) 풀이
    let wnPlayer = null; // { mode:'single'|'group', queue:[{note_id, source, subject, unit_name, recovery, question, can_retry, ...}], idx, examTitle, selected:{}, graded:{}, resolvedAny }

    function wnpEl(id) { return document.getElementById(id); }

    function openWnPlayer(noteId) {
      // 진입 시 해당 카드 아코디언 자동 접기(정답 노출 차단 — 도전 모드)
      const card = document.getElementById('wn-' + noteId);
      if (card) card.classList.remove('expanded');
      _openPlayerOverlay();
      _showPlayerLoading();
      (async () => {
        const data = await fetchWithAuth('/api/self-learn/wrong-notes/' + noteId + '/question');
        if (!data) return; // 401 처리됨
        if (!data.success) { _showPlayerError(data.message || '문제를 불러오지 못했어요.', () => openWnPlayer(noteId)); return; }
        wnPlayer = {
          mode: 'single',
          examTitle: null,
          queue: [{
            note_id: data.note_id, source: data.source, subject: data.subject, unit_name: data.unit_name,
            recovery: data.recovery, question: data.question, can_retry: data.can_retry,
            attempt_count: data.attempt_count, is_resolved: data.is_resolved,
            explanation_available: data.explanation_available
          }],
          idx: 0, selected: {}, graded: {}, resolvedAny: false
        };
        renderWnPlayer();
      })();
    }

    function openExamGroupPlayer(examId) {
      _openPlayerOverlay();
      _showPlayerLoading();
      (async () => {
        const data = await fetchWithAuth('/api/self-learn/wrong-notes/by-exam/' + encodeURIComponent(examId) + '/questions');
        if (!data) return;
        if (!data.success || !(data.questions && data.questions.length)) {
          _showPlayerError(data && data.message || '이 평가지의 풀 수 있는 오답이 없어요.', null);
          return;
        }
        wnPlayer = {
          mode: 'group',
          examTitle: data.exam_title || '평가지',
          examSubject: data.subject,
          queue: data.questions.map(q => ({
            note_id: q.note_id, source: 'exam', subject: q.subject || data.subject, unit_name: q.unit_name,
            recovery: q.recovery, question: q.question, can_retry: q.can_retry, attempt_count: q.attempt_count
          })),
          idx: 0, selected: {}, graded: {}, resolvedAny: false
        };
        renderWnPlayer();
      })();
    }

    function _openPlayerOverlay() {
      const ov = wnpEl('wnPlayerModal');
      ov.classList.add('show');
      document.body.style.overflow = 'hidden';
      document.addEventListener('keydown', _wnpKeydown);
    }
    function closeWnPlayer() {
      const ov = wnpEl('wnPlayerModal');
      ov.classList.remove('show');
      document.body.style.overflow = '';
      document.removeEventListener('keydown', _wnpKeydown);
      const refresh = wnPlayer && wnPlayer.resolvedAny;
      wnPlayer = null;
      if (refresh) { loadDashboard(); loadWrongNotes(); }
    }
    function _wnpKeydown(e) {
      if (e.key === 'Escape') { closeWnPlayer(); return; }
      // 1~9 보기 단축 선택 (제출 전 객관식)
      if (!wnPlayer) return;
      const item = wnPlayer.queue[wnPlayer.idx];
      if (!item || !item.question || item.question.type !== 'choice') return;
      if (wnPlayer.graded[item.note_id]) return;
      const n = parseInt(e.key);
      if (Number.isInteger(n) && n >= 1 && item.question.options && n <= item.question.options.length) {
        wnSelectOption(item.note_id, n - 1);
      }
    }

    function _showPlayerLoading() {
      wnpEl('wnpHeaderLeft').innerHTML = '<span class="wnp-subject" style="color:var(--gray-400)">문제 준비 중…</span>';
      wnpEl('wnpBody').innerHTML = '<div class="wnp-state"><i class="fas fa-spinner fa-spin"></i><p>문제를 불러오는 중…</p></div>';
      wnpEl('wnpFooter').innerHTML = '<div class="wnp-footer-left"></div><div class="wnp-footer-right"><button class="wnp-btn ghost" onclick="closeWnPlayer()">닫기</button></div>';
    }
    function _showPlayerError(msg, retryFn) {
      wnpEl('wnpHeaderLeft').innerHTML = '<span class="wnp-subject">오답 다시 풀기</span>';
      wnpEl('wnpBody').innerHTML = `<div class="wnp-state"><i class="fas fa-triangle-exclamation"></i><h4>문제를 불러오지 못했어요</h4><p>${escapeHtml(msg)}</p></div>`;
      wnpEl('wnpFooter').innerHTML = `<div class="wnp-footer-left"></div><div class="wnp-footer-right">${retryFn ? '<button class="wnp-btn primary" id="wnpRetryLoad"><i class="fas fa-rotate-right"></i> 다시 시도</button>' : ''}<button class="wnp-btn ghost" onclick="closeWnPlayer()">닫기</button></div>`;
      if (retryFn) wnpEl('wnpRetryLoad').onclick = retryFn;
    }

    // 현재 문항 렌더
    function renderWnPlayer() {
      if (!wnPlayer) return;
      const p = wnPlayer;
      const item = p.queue[p.idx];
      const graded = p.graded[item.note_id] || null;

      // ── 헤더 ──
      const srcBadge = wnSourceBadge(item.source);
      const subj = item.subject || (p.mode === 'group' ? p.examSubject : null) || '기타';
      const unit = item.unit_name || (p.mode === 'group' ? p.examTitle : '') || '';
      let progress = '';
      if (p.mode === 'group') {
        const pct = Math.round(((p.idx) / p.queue.length) * 100);
        progress = `<div class="wnp-progress">
          <div class="wnp-progress-bar"><div class="wnp-progress-fill" style="width:${pct}%"></div></div>
          <span class="wnp-progress-text">${p.idx + 1} / ${p.queue.length}</span>
        </div>`;
      }
      wnpEl('wnpHeaderLeft').innerHTML = `
        ${srcBadge}
        <div class="wnp-header-meta">
          <span class="wnp-subject">${escapeHtml(subj)}</span>
          ${unit ? `<span class="wnp-unit">${escapeHtml(unit)}</span>` : ''}
        </div>
        ${progress}`;

      // ── 본문: 복구 불가(폴백 D) ──
      if (item.recovery === 'unavailable' || !item.question) {
        wnpEl('wnpBody').innerHTML = `<div class="wnp-col"><div class="wnp-state">
          <i class="fas fa-circle-question"></i>
          <h4>원본 문제를 불러올 수 없어요</h4>
          <p>이 문제는 원본을 찾지 못해 다시 풀 수 없어요.<br>오답 목록에서 정답·해설을 확인해 주세요.</p>
        </div></div>`;
        _renderFooter(item, graded, /*unavailable*/ true);
        return;
      }

      const q = item.question;
      const isChoice = q.type === 'choice' && Array.isArray(q.options) && q.options.length;
      const sel = p.selected[item.note_id];

      let fallbackNote = '';
      if (item.recovery === 'fallback_short') {
        fallbackNote = `<div class="wnp-fallback-note"><i class="fas fa-circle-info"></i> 이 문제는 직접 입력으로 풀어요.</div>`;
      }

      // 채점 결과 배너 + 해설 (제출 후)
      let resultBanner = '';
      let explanation = '';
      if (graded) {
        if (graded.is_correct) {
          const pts = graded.points_awarded ? `  +${graded.points_awarded}점 획득` : '';
          resultBanner = `<div class="wnp-result correct"><i class="fas fa-circle-check"></i> 정답이에요! 🎉${pts}</div>`;
        } else {
          resultBanner = `<div class="wnp-result wrong"><i class="fas fa-circle-xmark"></i> 아쉬워요. 다시 한번 도전해 볼까요?</div>`;
        }
        if (graded.explanation) {
          explanation = `<div class="wnp-explanation"><strong>해설</strong> · ${escapeHtml(graded.explanation)}</div>`;
        }
      }

      // 보기/입력 본문
      let answerArea = '';
      if (isChoice) {
        answerArea = `<div class="wnp-options" id="wnpOptions">` + q.options.map((opt, i) => {
          let cls = 'wnp-option';
          let disabled = '';
          if (graded) {
            disabled = 'disabled';
            // 정답 보기는 항상 초록, 내가 고른 오답 보기는 빨강
            if (graded.correct_index != null && i === graded.correct_index) cls += ' review-correct';
            else if (i === sel && !graded.is_correct) cls += ' review-wrong';
            // correct_index 없을 때(텍스트 정답) — 정답이면 내 선택을 초록
            if (graded.correct_index == null && graded.is_correct && i === sel) cls += ' review-correct';
          } else if (i === sel) {
            cls += ' selected';
          }
          return `<button type="button" class="${cls}" ${disabled} ${graded ? '' : `onclick="wnSelectOption(${item.note_id}, ${i})"`}>
            <span class="wnp-option-num">${i + 1}</span>
            <span class="wnp-option-text">${escapeHtml(String(opt))}</span>
          </button>`;
        }).join('') + `</div>`;
      } else {
        const val = sel != null ? sel : '';
        answerArea = `<input type="text" class="wnp-short-input" id="wnpShortInput" placeholder="정답을 입력하세요" value="${escapeHtml(String(val))}" ${graded ? 'disabled' : ''}
          oninput="wnShortInput(${item.note_id}, this.value)"
          onkeydown="if(event.key==='Enter'){event.preventDefault();wnSubmitCurrent();}">`;
      }

      const numLabel = q.number != null ? `문항 ${q.number}` : '문항';
      const ptsLabel = q.points != null ? ` · ${q.points}점` : '';
      wnpEl('wnpBody').innerHTML = `<div class="wnp-col">
        ${fallbackNote}
        ${resultBanner}
        <div class="wnp-q-meta">
          <span class="wnp-q-num">${numLabel}${ptsLabel}</span>
          <span class="wnp-type-badge ${isChoice ? 'choice' : 'short'}">${isChoice ? '객관식' : '단답형'}</span>
        </div>
        ${q.instruction ? `<div class="wnp-instruction">${escapeHtml(q.instruction)}</div>` : ''}
        ${q.passage ? `<div class="wnp-instruction">${escapeHtml(q.passage)}</div>` : ''}
        <div class="wnp-q-text">${escapeHtml(q.text || '')}</div>
        ${answerArea}
        ${explanation}
      </div>`;
      renderMathIn(wnpEl('wnpBody'));

      _renderFooter(item, graded, false);
    }

    function _renderFooter(item, graded, unavailable) {
      const p = wnPlayer;
      const isGroup = p.mode === 'group';
      const isLast = p.idx >= p.queue.length - 1;
      const hasPrev = isGroup && p.idx > 0;

      let left = '';
      if (hasPrev) left = `<button class="wnp-btn ghost" onclick="wnPrev()"><i class="fas fa-arrow-left"></i> 이전</button>`;

      let right = `<button class="wnp-btn ghost" onclick="closeWnPlayer()">닫기</button>`;

      if (unavailable) {
        if (isGroup && !isLast) right += `<button class="wnp-btn primary" onclick="wnNext()">다음 문제 <i class="fas fa-arrow-right"></i></button>`;
      } else if (!graded) {
        // 제출 전
        const sel = p.selected[item.note_id];
        const hasAnswer = (item.question && item.question.type === 'choice')
          ? (sel != null)
          : (sel != null && String(sel).trim() !== '');
        right += `<button class="wnp-btn primary" id="wnpSubmitBtn" ${hasAnswer ? '' : 'disabled'} onclick="wnSubmitCurrent()"><i class="fas fa-paper-plane"></i> 제출하기</button>`;
      } else {
        // 제출 후
        if (!graded.is_correct) {
          right += `<button class="wnp-btn ghost" onclick="wnRetrySame(${item.note_id})"><i class="fas fa-rotate-right"></i> 다시 풀기</button>`;
        }
        if (isGroup && !isLast) {
          right += `<button class="wnp-btn primary" onclick="wnNext()">다음 문제 <i class="fas fa-arrow-right"></i></button>`;
        } else if (isGroup && isLast) {
          right += `<button class="wnp-btn success" onclick="wnShowGroupSummary()"><i class="fas fa-flag-checkered"></i> 결과 보기</button>`;
        } else {
          right += `<button class="wnp-btn success" onclick="closeWnPlayer()"><i class="fas fa-check"></i> 완료</button>`;
        }
      }
      wnpEl('wnpFooter').innerHTML = `<div class="wnp-footer-left">${left}</div><div class="wnp-footer-right">${right}</div>`;
    }

    function wnSelectOption(noteId, idx) {
      if (!wnPlayer) return;
      const item = wnPlayer.queue.find(q => q.note_id === noteId);
      if (!item || wnPlayer.graded[noteId]) return;
      wnPlayer.selected[noteId] = idx;
      // 선택 표시 갱신 + 제출 버튼 활성화
      const opts = document.querySelectorAll('#wnpOptions .wnp-option');
      opts.forEach((el, i) => el.classList.toggle('selected', i === idx));
      const btn = wnpEl('wnpSubmitBtn');
      if (btn) btn.disabled = false;
    }

    // 단답형 입력 — 값 저장 + 제출 버튼 활성/비활성 동기화 (객관식과 동일 동작)
    function wnShortInput(noteId, value) {
      if (!wnPlayer) return;
      if (wnPlayer.graded[noteId]) return;
      wnPlayer.selected[noteId] = value;
      const btn = wnpEl('wnpSubmitBtn');
      if (btn) btn.disabled = (String(value).trim() === '');
    }

    async function wnSubmitCurrent() {
      if (!wnPlayer) return;
      const p = wnPlayer;
      const item = p.queue[p.idx];
      if (!item || !item.question || p.graded[item.note_id]) return;
      const isChoice = item.question.type === 'choice';
      const sel = p.selected[item.note_id];

      let body;
      if (isChoice) {
        if (sel == null) return;
        body = { answer: String(item.question.options[sel]), answerIndex: sel };
      } else {
        const text = (sel != null ? String(sel) : (wnpEl('wnpShortInput') ? wnpEl('wnpShortInput').value : '')).trim();
        if (!text) return;
        body = { answer: text };
      }

      const btn = wnpEl('wnpSubmitBtn');
      if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner"></i> 채점 중…'; }

      const data = await fetchWithAuth('/api/self-learn/wrong-notes/' + item.note_id + '/retry', {
        method: 'POST', body: JSON.stringify(body)
      });
      if (!data) return;
      if (!data.success) {
        if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> 제출하기'; }
        _toast(data.message || '채점에 실패했어요. 잠시 후 다시 시도해 주세요.', true);
        return;
      }
      p.graded[item.note_id] = {
        is_correct: data.is_correct,
        resolved: data.resolved,
        correct_index: data.correct_index,
        correct_answer: data.correct_answer,
        explanation: data.explanation,
        points_awarded: data.points_awarded,
        attempt_count: data.attempt_count
      };
      item.attempt_count = data.attempt_count;
      if (data.is_correct && data.resolved) p.resolvedAny = true;
      renderWnPlayer();
    }

    // 오답 후 같은 문항 다시 풀기 (채점 상태 초기화)
    function wnRetrySame(noteId) {
      if (!wnPlayer) return;
      delete wnPlayer.graded[noteId];
      delete wnPlayer.selected[noteId];
      renderWnPlayer();
    }

    function wnNext() { if (wnPlayer && wnPlayer.idx < wnPlayer.queue.length - 1) { wnPlayer.idx++; renderWnPlayer(); } }
    function wnPrev() { if (wnPlayer && wnPlayer.idx > 0) { wnPlayer.idx--; renderWnPlayer(); } }

    // 묶음 결과 요약
    function wnShowGroupSummary() {
      if (!wnPlayer) return;
      const p = wnPlayer;
      const total = p.queue.length;
      const gradedList = p.queue.map(it => p.graded[it.note_id]).filter(Boolean);
      const correct = gradedList.filter(g => g.is_correct).length;
      const answered = gradedList.length;
      const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
      const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📚';

      wnpEl('wnpHeaderLeft').innerHTML = `<span class="wnp-subject">${escapeHtml(p.examTitle || '평가지')} — 결과</span>`;
      const rows = p.queue.map((it, i) => {
        const g = p.graded[it.note_id];
        const mark = !g ? '<span style="color:var(--gray-400)">미응답</span>'
          : g.is_correct ? '<span style="color:#16a34a;font-weight:700"><i class="fas fa-circle-check"></i> 정답</span>'
          : '<span style="color:#ef4444;font-weight:700"><i class="fas fa-circle-xmark"></i> 오답</span>';
        const txt = (it.question && it.question.text) || '문항';
        const expl = (g && g.explanation)
          ? `<div style="margin-top:8px;padding:10px 12px;background:var(--gray-50,#f8fafc);border-radius:8px;font-size:14px;line-height:1.7;color:var(--gray-600)"><strong style="color:var(--gray-700)">해설</strong> · ${escapeHtml(g.explanation)}</div>`
          : '';
        return `<div style="padding:12px 14px;border:1px solid var(--gray-200);border-radius:10px;margin-bottom:8px">
          <div style="display:flex;align-items:center;gap:12px">
            <span class="wnp-option-num" style="background:var(--gray-100)">${i + 1}</span>
            <span style="flex:1;font-size:15px;color:var(--gray-700);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(txt)}</span>
            ${mark}
          </div>
          ${expl}
        </div>`;
      }).join('');
      wnpEl('wnpBody').innerHTML = `<div class="wnp-col">
        <div style="text-align:center;margin-bottom:24px">
          <div style="font-size:48px;margin-bottom:8px">${emoji}</div>
          <h3 style="font-size:22px;font-weight:700;color:var(--gray-800);margin-bottom:6px">평가지 오답 풀이 완료!</h3>
          <p style="font-size:16px;color:var(--gray-500)">${correct} / ${total} 정답 · ${answered}문항 풀이</p>
        </div>
        ${rows}
      </div>`;
      renderMathIn(wnpEl('wnpBody'));
      wnpEl('wnpFooter').innerHTML = `<div class="wnp-footer-left"></div><div class="wnp-footer-right"><button class="wnp-btn success" onclick="closeWnPlayer()"><i class="fas fa-check"></i> 완료</button></div>`;
    }

    // 가벼운 토스트 (모달 위, z-index 10001)
    function _toast(msg, isErr) {
      const t = document.createElement('div');
      t.style.cssText = `position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:10001;background:${isErr ? '#ef4444' : '#1E293B'};color:#fff;padding:12px 20px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .2s`;
      t.textContent = msg;
      document.body.appendChild(t);
      requestAnimationFrame(() => t.style.opacity = '1');
      setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 250); }, 2600);
    }

    // ===== Tag Edit =====
    function openTagEditModal(noteId, tags) {
      tagEditNoteId = noteId;
      document.getElementById('tagEditInput').value = tags;
      document.getElementById('tagEditModal').classList.add('show');
    }
    function closeTagEditModal() { document.getElementById('tagEditModal').classList.remove('show'); tagEditNoteId = null; }

    async function submitTagEdit() {
      if (!tagEditNoteId) return;
      const tags = document.getElementById('tagEditInput').value.trim();
      const data = await fetchWithAuth('/api/self-learn/wrong-notes/' + tagEditNoteId + '/tags', {
        method: 'PUT',
        body: JSON.stringify({ tags })
      });
      if (data && data.success) {
        closeTagEditModal();
        loadDashboard();
        loadWrongNotes();
      } else {
        alert((data && data.message) || '태그 수정에 실패했습니다.');
      }
    }

    // ===== Manual Wrong Note =====
    function openManualModal() { document.getElementById('manualModal').classList.add('show'); }
    function closeManualModal() { document.getElementById('manualModal').classList.remove('show'); }

    async function submitManualNote() {
      const body = {
        subject: document.getElementById('manualSubject').value,
        question_text: document.getElementById('manualQuestion').value.trim(),
        correct_answer: document.getElementById('manualCorrectAnswer').value.trim(),
        my_answer: document.getElementById('manualMyAnswer').value.trim(),
        explanation: document.getElementById('manualExplanation').value.trim(),
        tags: document.getElementById('manualTags').value.trim()
      };
      if (!body.question_text || !body.correct_answer) { alert('문제와 정답을 입력해주세요.'); return; }
      const data = await fetchWithAuth('/api/self-learn/wrong-notes/manual', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      if (data && data.success) {
        closeManualModal();
        document.getElementById('manualQuestion').value = '';
        document.getElementById('manualCorrectAnswer').value = '';
        document.getElementById('manualMyAnswer').value = '';
        document.getElementById('manualExplanation').value = '';
        document.getElementById('manualTags').value = '';
        loadDashboard();
        loadWrongNotes();
      } else {
        alert((data && data.message) || '등록에 실패했습니다.');
      }
    }

    // ===== Problem Sets =====
    async function loadProblemSets() {
      const data = await fetchWithAuth('/api/self-learn/problem-sets');
      if (!data || !data.success) return;
      problemSets = data.sets || [];
      renderProblemSets();
    }

    function renderProblemSets() {
      const grid = document.getElementById('psGrid');
      document.getElementById('psListView').style.display = '';
      document.getElementById('psDetailView').style.display = 'none';
      document.getElementById('psSolvingView').style.display = 'none';
      document.getElementById('psSolvingView').classList.remove('active');

      if (!problemSets.length) {
        grid.innerHTML = '<div class="empty-state"><i class="fas fa-book-open"></i><p>아직 문제집이 없습니다. 문제집을 만들어보세요!</p></div>';
        return;
      }
      grid.innerHTML = problemSets.map(ps => {
        const itemCount = ps.item_count || ps.items_count || 0;
        const solvedCount = ps.solved_count || 0;
        const pct = itemCount > 0 ? Math.round((solvedCount / itemCount) * 100) : 0;
        return `
          <div class="ps-card" onclick="openPSDetail(${ps.id})">
            <div class="ps-card-title">${escapeHtml(ps.title)}</div>
            <div class="ps-card-meta">
              <span><i class="fas fa-list"></i> ${itemCount}문항</span>
