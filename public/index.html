<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다채움 - 포털</title>
  <link rel="stylesheet" href="/css/common-nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #4A7CFF;
      --primary-light: #6B94FF;
      --primary-dark: #3A5FCC;
      --secondary: #10B981;
      --accent: #F59E0B;
      --danger: #EF4444;
      --purple: #8B5CF6;
      --pink: #EC4899;
      --gray-50: #F9FAFB;
      --gray-100: #F3F4F6;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
      --radius: 12px;
      --radius-lg: 16px;
      --radius-xl: 24px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: linear-gradient(135deg, #F0F4FF 0%, #FAFBFF 100%);
      min-height: 100vh;
      color: var(--gray-800);
      line-height: 1.6;
      font-size: 17px;
    }

    /* .main-container 자체 max-width / padding 정의 제거 — page-shell 토큰으로 위임 */

    /* ===== 컴팩트 히어로 헤더 (배너 슬라이더 폐기) — .welcome-card 별칭 ===== */
    .welcome-card,
    .hero-compact {
      position: relative;
      height: 140px;
      border-radius: var(--radius-lg);
      padding: 24px 32px;
      margin-bottom: 24px;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      color: white; overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .hero-compact[data-role="teacher"] { background: linear-gradient(135deg, #4A7CFF 0%, #7C5CFC 100%); }
    .hero-compact[data-role="student"] { background: linear-gradient(135deg, #10B981 0%, #06B6D4 100%); }
    .hero-compact[data-role="parent"]  { background: linear-gradient(135deg, #F59E0B 0%, #EC4899 100%); }
    .hero-compact[data-role="staff"]   { background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%); }
    .hero-compact[data-role="admin"]   { background: linear-gradient(135deg, #1E293B 0%, #475569 100%); }
    .hero-compact[data-role="principal"] { background: linear-gradient(135deg, #0EA5E9 0%, #2563EB 100%); }

    .hero-bg-shapes { position: absolute; inset: 0; pointer-events: none; }
    .shape { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.08); }
    .shape-1 { width: 180px; height: 180px; top: -60px; right: -40px; animation: float 5s ease-in-out infinite alternate; }
    .shape-2 { width: 130px; height: 130px; bottom: -50px; left: 10%; background: rgba(255,255,255,0.06); animation: drift 6s ease-in-out infinite alternate; animation-delay: 1s; }

    @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-12px) rotate(8deg); } }
    @keyframes drift { 0% { transform: translateX(0) scale(1); } 100% { transform: translateX(20px) scale(1.04); } }

    .hero-content { position: relative; z-index: 1; max-width: 70%; }
    .hero-greeting {
      font-size: 28px; font-weight: 700; line-height: 1.3;
      margin-bottom: 6px; text-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }
    .hero-desc { font-size: 16px; opacity: 0.92; }
    .hero-role-badge {
      position: relative; z-index: 1;
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 22px;
      background: rgba(255,255,255,0.22); backdrop-filter: blur(8px);
      font-size: 14px; font-weight: 600; color: white;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* ===== 게스트(비로그인) 히어로 ===== */
    .hero-compact[data-role="guest"] {
      background: linear-gradient(135deg, #4A7CFF 0%, #7C5CFC 100%);
      height: auto; min-height: 160px; padding: 28px 32px;
    }
    .guest-hero-cta {
      position: relative; z-index: 1;
      display: flex; gap: 10px; flex-shrink: 0;
    }
    .guest-hero-cta .btn-login,
    .guest-hero-cta .btn-signup {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 12px 22px; border-radius: 10px;
      font-size: 16px; font-weight: 700;
      text-decoration: none; transition: all 0.2s;
      white-space: nowrap;
    }
    .guest-hero-cta .btn-login {
      background: white; color: #4A7CFF;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    .guest-hero-cta .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
    .guest-hero-cta .btn-signup {
      background: rgba(255,255,255,0.18); color: white;
      border: 1.5px solid rgba(255,255,255,0.5); backdrop-filter: blur(6px);
    }
    .guest-hero-cta .btn-signup:hover { background: rgba(255,255,255,0.28); }

    /* 비로그인 안내 카드 */
    .guest-info-card {
      background: white; border-radius: var(--radius-lg);
      padding: 18px 22px; box-shadow: var(--shadow);
      border-left: 4px solid var(--primary);
      margin-bottom: 24px;
      display: flex; align-items: center; gap: 16px;
    }
    .guest-info-card .ico {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(74,124,255,0.12); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .guest-info-card .body { flex: 1; min-width: 0; }
    .guest-info-card .ttl { font-size: 17px; font-weight: 700; color: var(--gray-800); margin-bottom: 3px; }
    .guest-info-card .desc { font-size: 15px; color: var(--gray-600); line-height: 1.5; }

    /* ===== 교장·교감 학교 관리자 바로가기 CTA ===== */
    .principal-cta-card {
      display: flex; align-items: center; gap: 18px;
      background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);
      border-radius: var(--radius-lg);
      padding: 22px 26px; margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(14,165,233,0.28);
      color: #fff; text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .principal-cta-card:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(14,165,233,0.38); }
    .principal-cta-card .ico {
      width: 56px; height: 56px; border-radius: 16px; flex-shrink: 0;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center; font-size: 26px;
    }
    .principal-cta-card .body { flex: 1; min-width: 0; }
    .principal-cta-card .ttl { font-size: 20px; font-weight: 800; margin-bottom: 4px; }
    .principal-cta-card .desc { font-size: 15px; opacity: 0.92; line-height: 1.5; }
    .principal-cta-card .go {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 8px;
      background: #fff; color: #0284C7; font-weight: 700; font-size: 16px;
      padding: 12px 22px; border-radius: 10px; white-space: nowrap;
    }
    @media (max-width: 768px) {
      .principal-cta-card { flex-wrap: wrap; gap: 14px; padding: 18px 20px; }
      .principal-cta-card .body { flex-basis: calc(100% - 74px); }
      .principal-cta-card .go { width: 100%; justify-content: center; margin-top: 4px; }
    }

    /* ===== 오늘 할 일 카드 (히어로 1순위) ===== */
    .today-action-card {
      background: white; border-radius: var(--radius-lg);
      padding: 20px 24px; box-shadow: var(--shadow);
      border-left: 4px solid var(--accent);
      margin-bottom: 24px;
    }
    .today-action-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .today-action-title {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700; color: var(--gray-900);
    }
    .today-action-title .ico { color: var(--accent); font-size: 20px; }
    .today-action-empty {
      padding: 18px 16px; background: var(--gray-50); border-radius: 12px;
      text-align: center; color: var(--gray-600);
    }
    .today-action-empty .em { font-size: 17px; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
    .today-action-empty .sub { font-size: 15px; color: var(--gray-500); }
    .today-action-list { display: flex; flex-direction: column; gap: 8px; }
    .today-action-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; background: var(--gray-50);
      border-radius: 12px; border: 1px solid transparent;
      cursor: pointer; transition: all 0.2s;
      text-decoration: none; color: inherit;
    }
    .today-action-item:hover {
      background: white; border-color: rgba(74, 124, 255, 0.3);
      transform: translateX(4px); box-shadow: var(--shadow-sm);
    }
    .today-action-item .idx {
      font-size: 18px; font-weight: 700; color: var(--gray-400);
      min-width: 22px; text-align: center;
    }
    .today-action-item .body { flex: 1; min-width: 0; }
    .today-action-item .ttl {
      font-size: 17px; font-weight: 600; color: var(--gray-800);
    }
    .today-action-item .meta {
      font-size: 14px; color: var(--gray-500); margin-top: 3px;
    }
    .today-action-item .arrow {
      width: 32px; height: 32px; border-radius: 50%;
      background: rgba(74, 124, 255, 0.12); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      transition: all 0.2s;
    }
    .today-action-item:hover .arrow { background: var(--primary); color: white; }
    .today-action-item[data-severity="urgent"] .arrow { background: rgba(239,68,68,0.12); color: var(--danger); }
    .today-action-item[data-severity="urgent"]:hover .arrow { background: var(--danger); color: white; }
    .today-action-item[data-severity="warning"] .arrow { background: rgba(245,158,11,0.14); color: var(--accent); }
    .today-action-item[data-severity="warning"]:hover .arrow { background: var(--accent); color: white; }
    .today-action-item .count-badge {
      padding: 4px 10px; border-radius: 12px;
      font-size: 14px; font-weight: 700;
      background: rgba(74, 124, 255, 0.12); color: var(--primary);
    }
    .today-action-item[data-severity="urgent"] .count-badge { background: rgba(239,68,68,0.12); color: var(--danger); }
    .today-action-item[data-severity="warning"] .count-badge { background: rgba(245,158,11,0.16); color: #B45309; }

    /* ===== 퀵메뉴 (1줄 풀와이드) + 대시보드 (별도 줄) ===== */
    .top-section {
      display: flex; flex-direction: column; gap: 24px; margin-bottom: 24px;
    }

    .quick-menu-card {
      background: white; border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow);
    }
    .quick-menu-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;
    }
    .quick-menu-title {
      display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; color: var(--gray-800);
    }
    .quick-menu-edit {
      display: flex; align-items: center; gap: 4px; padding: 6px 12px;
      background: var(--gray-100); border: none; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 500; color: var(--gray-600); transition: all 0.2s; font-family: inherit;
    }
    .quick-menu-edit:hover { background: var(--gray-200); color: var(--gray-800); }

    .quick-menu-grid { display: grid; gap: 10px; }
    .quick-menu-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
    .quick-menu-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
    .quick-menu-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
    .quick-menu-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
    .quick-menu-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
    .quick-menu-grid.cols-7 { grid-template-columns: repeat(7, 1fr); }
    .quick-menu-grid.cols-8 { grid-template-columns: repeat(8, 1fr); }
    @media (max-width: 1024px) {
      .quick-menu-grid.cols-6, .quick-menu-grid.cols-7, .quick-menu-grid.cols-8 { grid-template-columns: repeat(4, 1fr); }
    }
    @media (max-width: 640px) {
      .quick-menu-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }

    .quick-menu-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 16px 12px; background: var(--gray-50); border-radius: var(--radius);
      cursor: pointer; transition: all 0.2s; text-decoration: none; color: var(--gray-700);
      border: 1px solid transparent;
    }
    .quick-menu-item:hover {
      transform: translateY(-3px); box-shadow: var(--shadow-md);
      border-color: var(--primary); background: white;
    }
    .quick-menu-icon {
      width: 48px; height: 48px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    }
    .quick-menu-label { font-size: 15px; font-weight: 600; text-align: center; }

    /* 개인 대시보드 (4슬롯) */
    .personal-dashboard {
      background: white; border-radius: var(--radius-lg); padding: 20px;
      box-shadow: var(--shadow); border-left: 4px solid var(--primary);
      display: flex; flex-direction: column;
    }
    .personal-dashboard[data-role="student"] { border-left-color: #10B981; }
    .personal-dashboard[data-role="teacher"] { border-left-color: #4F46E5; }
    .personal-dashboard[data-role="parent"]  { border-left-color: #F59E0B; }
    .personal-dashboard[data-role="staff"]   { border-left-color: #6366F1; }
    .personal-dashboard[data-role="admin"]   { border-left-color: #475569; }

    .dashboard-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .dashboard-title { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; color: var(--gray-800); }

    .stats-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; flex: 1;
    }
    @media (max-width: 1199px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      border-radius: var(--radius); padding: 18px 16px;
      display: flex; flex-direction: column; gap: 4px;
      transition: all 0.2s; cursor: pointer;
      border: 1px solid transparent;
      position: relative;
    }
    .stat-card:nth-child(1) { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); }
    .stat-card:nth-child(2) { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); }
    .stat-card:nth-child(3) { background: linear-gradient(135deg, #FFFBEB, #FEF3C7); }
    .stat-card:nth-child(4) { background: linear-gradient(135deg, #F5F3FF, #EDE9FE); }
    .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: rgba(74,124,255,0.25); }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--gray-900); line-height: 1.1; }
    .stat-label { font-size: 15px; color: var(--gray-700); font-weight: 600; margin-top: 2px; }
    .stat-sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
    .stat-card .stat-arrow {
      position: absolute; top: 14px; right: 14px;
      width: 26px; height: 26px; border-radius: 50%;
      background: rgba(255,255,255,0.7); color: var(--gray-500);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; opacity: 0; transition: all 0.2s;
    }
    .stat-card:hover .stat-arrow { opacity: 1; transform: translateX(2px); }

    /* ===== 활동 요약 (3분할) ===== */
    .activity-summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) { .activity-summary { grid-template-columns: 1fr; } }
    .activity-card {
      background: white; border-radius: var(--radius-lg);
      padding: 24px; box-shadow: var(--shadow);
      border-top: 4px solid #4F46E5;
      display: flex; flex-direction: column; gap: 14px;
    }
    .activity-card[data-area="class"]    { border-top-color: #4F46E5; }
    .activity-card[data-area="content"]  { border-top-color: #059669; }
    .activity-card[data-area="self"]     { border-top-color: #EC4899; }
    .activity-card[data-area="lrs"]      { border-top-color: #06B6D4; }
    .activity-card-header {
      display: flex; align-items: center; gap: 10px;
      font-size: 19px; font-weight: 700; color: var(--gray-800);
    }
    .activity-card-header .ico { font-size: 22px; }
    .activity-card[data-area="class"]   .activity-card-header .ico { color: #4F46E5; }
    .activity-card[data-area="content"] .activity-card-header .ico { color: #059669; }
    .activity-card[data-area="self"]    .activity-card-header .ico { color: #EC4899; }
    .activity-card[data-area="lrs"]     .activity-card-header .ico { color: #06B6D4; }
    .activity-card-body { display: flex; flex-direction: column; gap: 6px; flex: 1; }
    .activity-stat-row {
      display: flex; align-items: baseline; justify-content: space-between;
      padding: 8px 0; font-size: 16px; color: var(--gray-700);
    }
    .activity-stat-row .num {
      font-size: 20px; font-weight: 700; color: var(--gray-900);
    }
    .activity-card[data-area="class"]   .activity-stat-row .num { color: #4F46E5; }
    .activity-card[data-area="content"] .activity-stat-row .num { color: #059669; }
    .activity-card[data-area="self"]    .activity-stat-row .num { color: #EC4899; }
    .activity-card[data-area="lrs"]     .activity-stat-row .num { color: #06B6D4; }
    .activity-card-cta {
      width: 100%; padding: 12px; border: none; border-radius: 10px;
      background: rgba(74,124,255,0.12); color: var(--primary);
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-decoration: none;
    }
    .activity-card[data-area="class"]   .activity-card-cta { background: rgba(79,70,229,0.12); color: #4F46E5; }
    .activity-card[data-area="content"] .activity-card-cta { background: rgba(5,150,105,0.12); color: #059669; }
    .activity-card[data-area="self"]    .activity-card-cta { background: rgba(236,72,153,0.12); color: #EC4899; }
    .activity-card[data-area="lrs"]     .activity-card-cta { background: rgba(6,182,212,0.14); color: #06B6D4; }
    .activity-card[data-area="class"]   .activity-card-cta:hover { background: #4F46E5; color: white; }
    .activity-card[data-area="content"] .activity-card-cta:hover { background: #059669; color: white; }
    .activity-card[data-area="self"]    .activity-card-cta:hover { background: #EC4899; color: white; }
    .activity-card[data-area="lrs"]     .activity-card-cta:hover { background: #06B6D4; color: white; }

    /* ===== 명예의 전당 미리보기 (2분할: 클래스/크리에이터) ===== */
    .hall-preview-section {
      display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 1024px) {
      .hall-preview-section { grid-template-columns: 1fr; gap: 16px; }
    }
    .hall-card-block {
      background: white; border-radius: var(--radius-lg);
      padding: 24px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; gap: 14px;
    }
    .hall-card-head {
      display: flex; align-items: center; justify-content: space-between;
    }
    .hall-list {
      display: flex; flex-direction: column; gap: 10px;
      flex: 1;
    }
    /* 리스트형 랭킹 카드 */
    .hall-row {
      position: relative;
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--gray-50); border-radius: 12px;
      border: 1px solid transparent;
      text-decoration: none; color: inherit;
      transition: all 0.18s;
    }
    .hall-row:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--gray-300); background: white; }
    .hall-row.r1 { background: linear-gradient(90deg, #FFFBEB, #FEF3C7); border-color: #FDE68A; }
    .hall-row.r2 { background: linear-gradient(90deg, #F9FAFB, #F3F4F6); border-color: #E5E7EB; }
    .hall-row.r3 { background: linear-gradient(90deg, #FFF7ED, #FFEDD5); border-color: #FDBA74; }

    .hall-rank-num {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; color: white;
      flex-shrink: 0;
    }
    .hall-rank-num.r1 { background: linear-gradient(135deg, #FCD34D, #F59E0B); }
    .hall-rank-num.r2 { background: linear-gradient(135deg, #D1D5DB, #9CA3AF); }
    .hall-rank-num.r3 { background: linear-gradient(135deg, #FBBF24, #D97706); }

    .hall-row-thumb {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 700; color: var(--primary);
      flex-shrink: 0; overflow: hidden;
    }
    .hall-row-thumb.creator {
      background: linear-gradient(135deg, #F3E8FF, #EDE9FE); color: #7C3AED;
    }
    .hall-row-thumb img { width: 100%; height: 100%; object-fit: cover; }

    .hall-row-info { flex: 1; min-width: 0; }
    .hall-row-name {
      font-size: 16px; font-weight: 700; color: var(--gray-800);
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hall-row-meta {
      font-size: 14px; color: var(--gray-500);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hall-row-stats {
      display: flex; gap: 10px; font-size: 13px; color: var(--gray-500);
      flex-shrink: 0; align-items: center;
    }
    .hall-row-stats strong { color: var(--gray-800); font-size: 15px; font-weight: 700; }

    .hall-highlight-badge {
      display: inline-block; padding: 3px 10px; border-radius: 12px;
      background: var(--primary); color: white;
      font-size: 13px; font-weight: 600; line-height: 1.4;
      flex-shrink: 0;
    }
    .hall-highlight-badge.mine { background: #10B981; }
    .hall-highlight-badge.child { background: #F59E0B; }
    .hall-highlight-badge.classmate { background: #4F46E5; }
    .hall-highlight-badge.joined { background: #2563EB; }

    .hall-empty {
      padding: 28px 20px; text-align: center;
      color: var(--gray-600);
      background: var(--gray-50); border-radius: 12px;
    }
    .hall-empty .em { font-size: 16px; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
    .hall-empty .sub { font-size: 14px; color: var(--gray-500); }

    @media (max-width: 600px) {
      .hall-row { padding: 12px 14px; gap: 10px; }
      .hall-row-thumb { width: 42px; height: 42px; font-size: 20px; }
      .hall-row-stats { display: none; }
    }

    /* ===== 카드 공통 ===== */
    .card {
      background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow);
    }
    .card-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;
    }
    .main-container .card-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 19px !important; font-weight: 700; color: var(--gray-800);
    }
    .card-more {
      display: flex; align-items: center; gap: 4px;
      color: var(--gray-500); text-decoration: none; font-size: 15px; font-weight: 500;
    }
    .card-more:hover { color: var(--primary); }

    /* ===== 컨텐츠 그리드 ===== */
    .content-grid {
      display: grid; grid-template-columns: 2fr 1fr; gap: 24px; margin-bottom: 24px; align-items: stretch;
    }
    .content-grid > .card { display: flex; flex-direction: column; }
    .content-grid > .card .content-grid-items,
    .content-grid > .card .popular-class-list { flex: 1; }
    @media (max-width: 1024px) { .content-grid { grid-template-columns: 1fr; } }

    .two-column-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 24px; align-items: stretch;
    }
    .two-column-grid > .card { display: flex; flex-direction: column; }
    /* 카드 내부 컨테이너가 남은 공간을 채우도록 — 같은 행 두 카드 높이 통일 */
    .two-column-grid > .card > #readingContent,
    .two-column-grid > .card > #changeContent,
    .two-column-grid > .card > #recommendContent,
    .two-column-grid > .card > .notice-list { flex: 1; display: flex; flex-direction: column; }
    .two-column-grid > .card > #recommendContent > div { flex: 1; display: flex; flex-direction: column; }
    /* 책/코스 리스트가 카드 하단까지 채우게 */
    #readingContent .book-list,
    #changeContent .change-course-list { flex: 1; }
    @media (max-width: 768px) { .two-column-grid { grid-template-columns: 1fr; } }

    /* 인기 클래스 — 카드 갯수가 적을 때도 컨테이너를 균등 분포로 채움 */
    .popular-class-list { display: flex; flex-direction: column; gap: 14px; justify-content: space-between; }
    .popular-class-list .class-item { flex: 1; }
    .class-item {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      background: var(--gray-50); border-radius: var(--radius);
      cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
    }
    .class-item:hover { background: white; border-color: var(--gray-300); transform: translateX(4px); }
    .class-rank {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; font-weight: 700; flex-shrink: 0;
    }
    .class-rank.gold { background: linear-gradient(135deg, #FCD34D, #F59E0B); color: white; }
    .class-rank.silver { background: linear-gradient(135deg, #D1D5DB, #9CA3AF); color: white; }
    .class-rank.bronze { background: linear-gradient(135deg, #FBBF24, #D97706); color: white; }
    .class-thumb {
      width: 52px; height: 52px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0;
    }
    .class-info { flex: 1; min-width: 0; }
    .class-name { font-size: 16px; font-weight: 600; color: var(--gray-800); margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .class-meta { font-size: 14px; color: var(--gray-500); }
    .class-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
    .class-members { font-size: 14px; font-weight: 700; color: var(--primary); background: rgba(74, 124, 255, 0.1); padding: 3px 10px; border-radius: 12px; }
    .class-activity { font-size: 13px; color: var(--gray-500); }

    /* 인기 콘텐츠 */
    .content-grid-items { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    @media (max-width: 640px) { .content-grid-items { grid-template-columns: 1fr; } }
    .content-item {
      display: flex; gap: 14px; padding: 14px;
      background: var(--gray-50); border-radius: var(--radius);
      cursor: pointer; transition: all 0.2s; border: 1px solid transparent;
    }
    .content-item { cursor: pointer; }
    .content-item:hover { background: white; border-color: var(--gray-300); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    /* 16:9 비율 썸네일 (실제 이미지 + 아이콘 폴백) */
    .content-thumb {
      width: 96px; aspect-ratio: 16/9; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1.4rem; flex-shrink: 0;
      overflow: hidden; position: relative;
      background-size: cover; background-position: center;
      background-color: var(--gray-200);
    }
    .content-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .content-thumb .thumb-icon {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; color: white;
    }
    .content-info { flex: 1; min-width: 0; }
    .content-name { font-size: 16px; font-weight: 600; color: var(--gray-800); margin-bottom: 5px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .content-meta { font-size: 14px; color: var(--gray-500); display: flex; align-items: center; gap: 8px; }

    /* 공지사항 */
    .notice-list { display: flex; flex-direction: column; gap: 10px; }
    .notice-item {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      background: var(--gray-50); border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .notice-item:hover { background: var(--gray-100); transform: translateX(4px); }
    .notice-badge { padding: 4px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; flex-shrink: 0; }
    .notice-badge.important { background: #FEE2E2; color: #DC2626; }
    .notice-badge.event { background: #DBEAFE; color: #2563EB; }
    .notice-badge.normal { background: var(--gray-200); color: var(--gray-600); }
    .notice-text { flex: 1; font-size: 16px; color: var(--gray-700); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .notice-date { font-size: 13px; color: var(--gray-400); flex-shrink: 0; }

    /* 오늘의 일정 */
    .schedule-section { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--gray-200); }
    .schedule-header { font-size: 16px; font-weight: 700; color: var(--gray-700); margin-bottom: 10px; }
    .schedule-item {
      display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; margin-bottom: 6px; background: linear-gradient(135deg, #F0F4FF, #FAFBFF); font-size: 15px;
    }
    .schedule-icon { font-size: 1.05rem; flex-shrink: 0; }
    .schedule-time { font-weight: 700; color: var(--primary); min-width: 46px; flex-shrink: 0; font-size: 14px; }
    .schedule-title { color: var(--gray-700); font-size: 15px; }

    /* 독서 현황 */
    .reading-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
    .reading-stat { text-align: center; padding: 14px 12px; border-radius: var(--radius); }
    .reading-stat:nth-child(1) { background: linear-gradient(135deg, #EFF6FF, #DBEAFE); }
    .reading-stat:nth-child(2) { background: linear-gradient(135deg, #ECFDF5, #D1FAE5); }
    .reading-stat:nth-child(3) { background: linear-gradient(135deg, #FFF7ED, #FFEDD5); }
    .reading-stat-value { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
    .reading-stat-label { font-size: 14px; color: var(--gray-500); margin-top: 4px; }

    .book-list { display: flex; flex-direction: column; gap: 10px; }
    .book-item {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: var(--gray-50); border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .book-item:hover { background: var(--gray-100); transform: translateX(4px); }
    .book-cover {
      width: 40px; height: 56px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 1rem; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .book-info { flex: 1; }
    .book-title { font-size: 16px; font-weight: 600; color: var(--gray-800); }
    .book-author { font-size: 14px; color: var(--gray-500); }

    /* 체인지 활동 */
    .change-stats { display: flex; gap: 14px; margin-bottom: 14px; }
    .change-stat {
      flex: 1; text-align: center; padding: 14px;
      background: linear-gradient(135deg, #ECFDF5, #D1FAE5); border-radius: var(--radius);
    }
    .change-stat-icon { font-size: 1.4rem; margin-bottom: 4px; }
    .change-stat-value { font-size: 1.3rem; font-weight: 700; color: #059669; }
    .change-stat-label { font-size: 14px; color: #047857; }
    .change-course-list { display: flex; flex-direction: column; gap: 10px; }
    .change-course {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      background: var(--gray-50); border-radius: 10px; transition: all 0.2s;
    }
    .change-course:hover { background: var(--gray-100); transform: translateX(4px); }
    .change-course-icon {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #059669);
      display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem;
    }
    .change-course-info { flex: 1; }
    .change-course-name { font-size: 16px; font-weight: 600; color: var(--gray-800); }
    .change-course-meta { font-size: 14px; color: var(--gray-500); }

    /* 전체 서비스 */
    .all-services-section {
      background: white; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow);
    }
    .all-services-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-200);
    }
    .all-services-title { font-size: 19px; font-weight: 700; color: var(--gray-800); display: flex; align-items: center; gap: 8px; }
    .collapse-toggle {
      display: flex; align-items: center; gap: 6px; padding: 8px 14px;
      background: var(--gray-100); border: none; border-radius: 8px;
      cursor: pointer; font-size: 14px; font-weight: 500; color: var(--gray-600); font-family: inherit;
    }
    .collapse-toggle:hover { background: var(--gray-200); }
    .all-services-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px;
    }
    .all-service-item {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      background: var(--gray-50); border-radius: 12px; cursor: pointer;
      transition: all 0.2s; border: 1px solid transparent; text-decoration: none; color: inherit;
      min-width: 0;
    }
    .all-service-item:hover { background: white; border-color: var(--gray-300); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .all-service-item.recommended { background: #FFFBEB; border-color: #FDE68A; }
    .all-service-icon {
      width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 1.2rem; color: white;
    }
    /* 카드 텍스트 영역: 한 줄 유지 + 잘림 방지(자동 폭 + 배지 nowrap) */
    .all-service-text { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
    .all-service-name { font-size: 16px; font-weight: 600; color: var(--gray-800); white-space: nowrap; flex-shrink: 0; }
    .all-service-rec-badge { font-size: 13px; font-weight: 700; padding: 3px 10px; background: #FDE68A; color: #B45309; border-radius: 8px; white-space: nowrap; flex-shrink: 0; }
    .all-service-external { font-size: 13px; color: var(--gray-400); white-space: nowrap; flex-shrink: 0; }

    /* 모달 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: white; border-radius: var(--radius-lg);
      width: 80vw; max-width: 720px; max-height: 85vh; overflow: hidden;
      transform: translateY(20px); transition: all 0.3s;
    }
    .modal-overlay.active .modal-content { transform: translateY(0); }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px; border-bottom: 1px solid var(--gray-200);
    }
    .modal-title { display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: 700; color: var(--gray-900); }
    .modal-close {
      width: 36px; height: 36px; border: none; background: var(--gray-100); border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: var(--gray-600); transition: all 0.2s;
    }
    .modal-close:hover { background: var(--gray-200); }
    .modal-body { padding: 16px 20px; max-height: 60vh; overflow-y: auto; }
    .modal-list { display: flex; flex-direction: column; gap: 8px; }
    .modal-item {
      display: flex; align-items: center; gap: 14px; padding: 14px;
      background: var(--gray-50); border-radius: var(--radius);
      cursor: pointer; transition: all 0.2s; text-decoration: none; color: inherit;
    }
    .modal-item:hover { background: var(--primary); color: white; transform: translateX(4px); }
    .modal-item:hover .modal-item-meta { color: rgba(255,255,255,0.8); }
    .modal-item-icon {
      width: 42px; height: 42px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem; flex-shrink: 0;
    }
    .modal-item-info { flex: 1; min-width: 0; }
    .modal-item-name { font-weight: 600; font-size: 16px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-item-meta { font-size: 14px; color: var(--gray-500); }
    .modal-item-badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }
    .modal-item-badge.member { background: #DBEAFE; color: #1D4ED8; }
    .modal-item-badge.join { background: #10B981; color: white; }
    .modal-item-badge.graded { background: #D1FAE5; color: #059669; }
    .modal-item-badge.pending { background: #FEF3C7; color: #D97706; }
    /* 콘텐츠 상세 모달 확장 */
    .content-detail-section { padding: 16px 0; }
    .content-detail-section + .content-detail-section { border-top: 1px solid var(--gray-200); }
    .content-detail-title { font-size: 1.1rem; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
    .content-detail-desc { font-size: 0.88rem; color: var(--gray-600); line-height: 1.6; margin-bottom: 12px; }
    .content-detail-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .content-detail-tag { padding: 3px 10px; background: var(--gray-100); border-radius: 12px; font-size: 0.75rem; color: var(--gray-600); }
    .content-detail-meta-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
    .content-detail-meta-item { text-align: center; padding: 10px; background: var(--gray-50); border-radius: 10px; }
    .content-detail-meta-item .val { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
    .content-detail-meta-item .lbl { font-size: 0.72rem; color: var(--gray-500); margin-top: 2px; }
    .content-detail-actions { display: flex; gap: 8px; margin-top: 16px; }
    .content-detail-actions .btn { flex: 1; padding: 10px; border: none; border-radius: 10px; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .content-detail-actions .btn-primary { background: var(--primary); color: white; }
    .content-detail-actions .btn-primary:hover { background: #1D4ED8; }
    .content-detail-actions .btn-secondary { background: var(--gray-100); color: var(--gray-700); }
    .content-detail-actions .btn-secondary:hover { background: var(--gray-200); }
    /* 클래스 소개 모달 */
    .class-detail-header { text-align: center; padding: 20px 0; }
    .class-detail-avatar { width: 60px; height: 60px; border-radius: 16px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; }
    .class-detail-name { font-size: 1.2rem; font-weight: 700; color: var(--gray-900); }
    .class-detail-teacher { font-size: 0.85rem; color: var(--gray-500); margin-top: 4px; }
    .class-detail-stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0; }
    .class-detail-stat { text-align: center; }
    .class-detail-stat .num { font-size: 1.3rem; font-weight: 700; color: var(--primary); }
    .class-detail-stat .lbl { font-size: 0.72rem; color: var(--gray-500); }

    /* 편집 모달 */
    .edit-modal-body { padding: 20px; max-height: 50vh; overflow-y: auto; }
    .edit-modal-desc { font-size: 0.88rem; color: var(--gray-600); margin-bottom: 14px; }
    .edit-service-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
    .edit-service-item {
      position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 14px 12px; background: var(--gray-50); border: 2px solid var(--gray-200);
      border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
    }
    .edit-service-item:hover { border-color: var(--gray-400); }
    .edit-service-item.selected { background: #EEF2FF; border-color: var(--primary); }
    .edit-service-item.selected::after {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      position: absolute; top: 4px; right: 4px; width: 18px; height: 18px;
      background: var(--primary); color: white; border-radius: 50%;
      font-size: 0.55rem; display: flex; align-items: center; justify-content: center;
    }
    .edit-service-icon {
      width: 38px; height: 38px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 1.15rem;
    }
    .edit-service-name { font-size: 0.78rem; font-weight: 600; color: var(--gray-700); text-align: center; }
    .edit-modal-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 16px 20px; border-top: 1px solid var(--gray-200);
    }
    .edit-modal-btn {
      padding: 10px 20px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; font-family: inherit; border: none;
    }
    .edit-modal-btn.cancel { background: var(--gray-100); color: var(--gray-600); }
    .edit-modal-btn.cancel:hover { background: var(--gray-200); }
    .edit-modal-btn.save { background: var(--primary); color: white; }
    .edit-modal-btn.save:hover { background: var(--primary-dark); }
    .selected-count { font-size: 0.85rem; color: var(--gray-500); margin-bottom: 10px; }
    .selected-count strong { color: var(--primary); }

    /* 토스트 */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      padding: 12px 28px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;

    let realStats = { slot0: 0, slot1: 0, slot2: 0, slot3: 0 };
    let summaryRaw = {};
    let schoolOverview = null;   // 교장·교감: /api/school/overview KPI

    // 교장·교감 — 우리 학교 한눈요약 KPI 로드 (학생/교사/지원필요/평균도달률)
    async function loadSchoolOverview() {
      try {
        const res = await fetch('/api/school/overview');
        if (!res.ok) return;
        const data = await res.json();
        if (!data || !data.success) return;
        const ov = data.overview || {};
        schoolOverview = ov;
        realStats.slot0 = ov.studentCount || 0;
        realStats.slot1 = ov.teacherCount || 0;
        realStats.slot2 = ov.supportNeeded || 0;
        realStats.slot3 = (ov.avgReachedRate != null) ? (ov.avgReachedRate + '%') : '-';

      try {
        const res = await fetch('/api/portal/my-summary');
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            const role = currentUser?.role || 'student';
            const s = data.summary || data;
            summaryRaw = s;
            if (role === 'student') {
              realStats.slot0 = s.classCount || 0;
              realStats.slot1 = s.weekCompleted || 0;
              realStats.slot2 = s.unreadNotifications || 0;
              realStats.slot3 = s.totalPoints || 0;
            } else if (role === 'teacher') {
              realStats.slot0 = s.classCount || 0;            // 내가 만든 클래스
              realStats.slot1 = s.ungraded || 0;              // 미채점 과제
              realStats.slot2 = s.pendingApprovals || 0;      // 승인 대기
              realStats.slot3 = s.examsDueSoon || 0;          // 마감 임박 평가
            } else if (role === 'parent') {
              realStats.slot0 = s.childrenCount || 0;         // 자녀
              realStats.slot1 = s.todayDueHw || 0;            // 자녀 미제출 과제
              realStats.slot2 = s.unreadNotifications || 0;   // 새 알림
              const ca = s.childAttendance || {};
              const total = (ca.present || 0) + (ca.absent || 0) + (ca.late || 0);
              // 출결 데이터 없을 때 0% 대신 '-' 표시 (학부모 테스터 의견)
              realStats.slot3 = total > 0 ? Math.round(((ca.present || 0) / total) * 100) + '%' : '-';
            } else if (role === 'staff') {
              realStats.slot0 = s.unreadNotices || 0;         // 미확인 공지
              realStats.slot1 = s.pendingApprovals || 0;      // 결재 대기
              realStats.slot2 = s.weeklyEvents || 0;          // 이번 주 학사 일정
              realStats.slot3 = s.ownedClassCount || 0;       // 운영 클래스
            } else if (role === 'admin') {
              realStats.slot0 = s.totalUsers || 0;
              realStats.slot1 = s.classCount || 0;
              realStats.slot2 = s.logToday || 0;
              realStats.slot3 = s.systemAlerts || 0;
            }
          }
        }
        // 교장·교감: 우리 학교 KPI를 학교 관리자 API에서 보강
        if ((currentUser?.role) === 'principal') {
          await loadSchoolOverview();
        }
      } catch(e) {
        // fallback: basic class count
        try {
          const res2 = await fetch('/api/class/my');
          if (res2.ok) {
            const data = await res2.json();
            const cls = data.classes || data || [];
            realStats.slot0 = Array.isArray(cls) ? cls.length : 0;
          }
        } catch(e2) {}
      }
    }

    // ==================== 오늘 할 일 카드 ====================
    async function loadTodayAction() {
      const body = document.getElementById('todayActionBody');
      try {
        const res = await fetch('/api/portal/today-action');
        const data = await res.json();
        if (!data.success) throw new Error('failed');
        const items = data.items || [];
        if (items.length === 0) {
          const msg = data.message || '오늘 할 일이 없어요!';
          body.innerHTML = `
            <div class="today-action-empty">
              <div class="em">${msg}</div>
              <div class="sub">아래 추천 콘텐츠로 새로운 활동을 시작해보세요.</div>
            </div>`;
          return;
        }
        body.innerHTML = `
          <div class="today-action-list">
            ${items.map((it, i) => {
              const sev = it.severity || 'info';
              const indexLabel = ['①','②','③'][i] || `${i+1}`;
              return `
                <a href="${it.href || '#'}" class="today-action-item" data-severity="${sev}">
                  <span class="idx">${indexLabel}</span>
                  <div class="body">
                    <div class="ttl">${it.label} <span class="count-badge">${it.count}건</span></div>
                    <div class="meta">${todayActionMetaForRole(it, data.role)}</div>
                  </div>
                  <span class="arrow"><i class="fas fa-arrow-right"></i></span>
                </a>`;
            }).join('')}
          </div>`;
      } catch(e) {
        body.innerHTML = `
          <div class="today-action-empty">
            <div class="em">잠시 후 다시 시도해 주세요</div>
            <div class="sub">데이터를 불러오는 중 문제가 발생했어요</div>
          </div>`;
      }
    }

    function todayActionMetaForRole(item, role) {
      const map = {
        urgent: '바로 처리하면 좋아요',
        warning: '곧 마감되니 확인해 주세요',
        info: '확인해 주세요'
      };
      return map[item.severity] || '확인해 주세요';
    }

    async function loadTrendingPosts() {
      // 인기 게시글은 공지사항 영역 아래에 별도 표시 (인기 클래스 영역 덮어쓰기 방지)
      try {
        const res = await fetch('/api/portal/trending?limit=5');
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.popular && data.popular.length > 0) {
            const noticeList = document.getElementById('noticeList');
            if (noticeList) {
              // 기존 공지사항 아래에 인기 게시글 추가
              const trendingHtml = `
                <div style="margin-top:16px;padding-top:12px;border-top:1px solid #E5E7EB;">
                  <div style="font-size:16px;font-weight:600;color:#6B7280;margin-bottom:8px;">🔥 인기 게시글</div>
                  ${data.popular.slice(0, 3).map(post => `
                    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;" onclick="location.href='/class/class-home.html?classId=${post.class_id}&tab=board'">
                      <div style="flex:1;font-size:15px;color:#374151;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${post.title || ''}</div>
                      <div style="font-size:13px;color:#9CA3AF;white-space:nowrap;">${post.like_count || 0} ❤ ${post.comment_count || 0} 💬</div>
                    </div>
                  `).join('')}
                </div>
              `;
              noticeList.insertAdjacentHTML('beforeend', trendingHtml);
            }
          }
        }
      } catch(e) {}
    }

    async function loadCalendarEvents() {
      try {
        const now = new Date();
        const start = now.toISOString().slice(0, 10);
        const end = new Date(now.getTime() + 7 * 86400000).toISOString().slice(0, 10);
        const res = await fetch(`/api/portal/calendar?startDate=${start}&endDate=${end}`);
        if (res.ok) {
          const data = await res.json();
          if (data.success && data.events && data.events.length > 0) {
            const scheduleEl = document.querySelector('.schedule-mini');
            if (scheduleEl) {
              const iconMap = { lesson: '📚', homework: '📝', survey: '📊' };
              scheduleEl.innerHTML = `
                <div class="schedule-header"><i class="fas fa-calendar-day" style="color:var(--primary);margin-right:6px;"></i> 이번 주 일정</div>
                ${data.events.slice(0, 5).map(e => `
                  <div class="schedule-item">
                    <span class="schedule-icon">${iconMap[e.type] || '📌'}</span>
                    <span class="schedule-time">${(e.date || '').slice(5)}</span>
                    <span class="schedule-title">${e.title}</span>
                  </div>
                `).join('')}
              `;
            }
          }
        }
      } catch(e) {}
    }

    function renderDashboard() {

      const role = currentUser?.role || 'student';
      const statsConfig = ROLE_STATS[role] || ROLE_STATS.student;
      const values = [realStats.slot0 || 0, realStats.slot1 || 0, realStats.slot2 || 0, realStats.slot3 || 0];

      dash.dataset.role = role;
      // 학부모 슬롯 1: "자녀 N명" 라벨 동적 치환
      const labels = statsConfig.map((cfg, i) => {
        if (role === 'parent' && i === 0) return `자녀 ${values[0]}명`;
        return cfg.label;
      });
      // 학부모 슬롯 4: 출결률 % 표기 ('-' 데이터 없음 시 그대로 노출)
      const displayValues = values.map((v, i) => {
        if (role === 'parent' && i === 3) return v === '-' ? '-' : `${v}%`;
        if (role === 'parent' && i === 0) return v; // 라벨이 N명이라 숫자 그대로
        return v;
      });

      dash.innerHTML = `
        <div class="dashboard-header">
          <div class="dashboard-title">

        <div class="stats-grid">
          ${statsConfig.map((cfg, i) => {
            const v = values[i] || 0;
            const display = displayValues[i];
            const subText = (v === 0) ? `<div class="stat-sub">${cfg.empty}</div>` : '';
            return `
              <div class="stat-card" onclick="onStatCardClick(${i})" role="button" tabindex="0">

                <div class="stat-label">${labels[i]}</div>

              </div>`;
          }).join('')}

    // ==================== 명예의 전당 미리보기 (클래스 + 크리에이터 2분할) ====================
    function escHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function renderHallEmpty(em, sub) {
      return `<div class="hall-empty"><div class="em">${escHtml(em)}</div><div class="sub">${escHtml(sub)}</div></div>`;
    }
    function renderClassRow(c) {
      const rankCls = c.rank === 1 ? 'r1' : (c.rank === 2 ? 'r2' : 'r3');
      let badgeCls = '', badgeText = '';
      if (c.isMine)        { badgeCls = 'mine';     badgeText = '내 클래스'; }
      else if (c.isChildClass) { badgeCls = 'child';    badgeText = '자녀 클래스'; }
      else if (c.isJoined) { badgeCls = 'joined';   badgeText = '참여 중'; }
      const initial = (c.name || '?').charAt(0);
      const thumb = c.thumbnail
        ? `<img src="${escHtml(c.thumbnail)}" alt="">`
        : escHtml(initial);
      const meta = [c.owner_name ? escHtml(c.owner_name) : '', c.school_name ? escHtml(c.school_name) : '']
        .filter(Boolean).join(' · ');
      return `
        <a href="/class/hall-of-fame.html" class="hall-row ${rankCls}">
          <span class="hall-rank-num ${rankCls}">${c.rank}</span>
          <div class="hall-row-thumb">${thumb}</div>
          <div class="hall-row-info">
            <div class="hall-row-name">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(c.name)}</span>
              ${badgeText ? `<span class="hall-highlight-badge ${badgeCls}">${escHtml(badgeText)}</span>` : ''}
            </div>
            <div class="hall-row-meta">${meta || '클래스'}</div>
          </div>
          <div class="hall-row-stats">
            <span title="참여 멤버 수">멤버 <strong>${(c.member_count || 0).toLocaleString()}</strong>명</span>
          </div>
        </a>`;
    }
    function renderCreatorRow(c) {
      const rankCls = c.rank === 1 ? 'r1' : (c.rank === 2 ? 'r2' : 'r3');
      let badgeCls = '', badgeText = '';
      if (c.isMine)         { badgeCls = 'mine';      badgeText = '나'; }
      else if (c.isChild)   { badgeCls = 'child';     badgeText = '자녀'; }
      else if (c.isClassmate){ badgeCls = 'classmate';badgeText = '우리반'; }
      const initial = (c.name || '?').charAt(0);
      const thumb = c.avatar
        ? `<img src="${escHtml(c.avatar)}" alt="">`
        : escHtml(initial);
      const roleLabel = c.role === 'teacher' ? '선생님' : (c.role === 'admin' ? '관리자' : (c.role === 'student' ? '학생' : ''));
      const meta = [c.school_name ? escHtml(c.school_name) : '', roleLabel].filter(Boolean).join(' · ');
      const views = (c.total_views || 0).toLocaleString();
      return `
        <a href="/content/index.html" class="hall-row ${rankCls}">
          <span class="hall-rank-num ${rankCls}">${c.rank}</span>
          <div class="hall-row-thumb creator">${thumb}</div>
          <div class="hall-row-info">
            <div class="hall-row-name">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(c.name)}</span>
              ${badgeText ? `<span class="hall-highlight-badge ${badgeCls}">${escHtml(badgeText)}</span>` : ''}
            </div>
            <div class="hall-row-meta">${meta || '크리에이터'}</div>
          </div>
          <div class="hall-row-stats">
            <span title="공개한 콘텐츠 수">콘텐츠 <strong>${(c.content_count || 0).toLocaleString()}</strong>개</span>
            <span title="총 조회수">조회수 <strong>${views}</strong></span>
          </div>
        </a>`;

    async function loadHallPreview() {
      const classList = document.getElementById('hallClassList');
      const creatorList = document.getElementById('hallCreatorList');
      try {
        // 채움클래스 명예의 전당 페이지(/class/hall-of-fame.html)와 동일한 데이터 사용.
        // /api/portal/highlights는 내부적으로 getHallOfFame()을 호출하므로 Top 3가 일치한다.
        const res = await fetch('/api/portal/highlights', { cache: 'no-store' });
        const data = await res.json();
        if (!data.success) throw new Error('failed');
        const classes = Array.isArray(data.classes) ? data.classes : [];
        const creators = Array.isArray(data.creators) ? data.creators : [];

        if (classes.length === 0) {
          classList.innerHTML = renderHallEmpty('아직 등재된 클래스가 없어요', '활동이 쌓이면 명예의 전당에 등재됩니다');
        } else {
          classList.innerHTML = classes.map(renderClassRow).join('');
        }

        if (creators.length === 0) {
          creatorList.innerHTML = renderHallEmpty('아직 등재된 크리에이터가 없어요', '콘텐츠를 공개하고 명예의 전당에 도전해 보세요');
        } else {
          creatorList.innerHTML = creators.map(renderCreatorRow).join('');
        }
      } catch(e) {
        const msg = renderHallEmpty('잠시 후 다시 시도해 주세요', '데이터를 불러오는 중 문제가 발생했어요');
        classList.innerHTML = msg;
        creatorList.innerHTML = msg;
      }
    }

    // ==================== 인기 콘텐츠 (API) ====================
    async function loadPopularContents() {
      const grid = document.getElementById('popularContentsGrid');
      try {
        // 역할/학년/교과 필터 (서버가 req.user로 자동 보강하지만 명시적으로 전달)
        const role = currentUser?.role || 'student';
        const grade = currentUser?.grade || '';
        const subject = currentUser?.subject || '';
        const qs = new URLSearchParams({ limit: '6' });
        if (role) qs.append('role', role);
        if (grade) qs.append('grade', String(grade));
        if (subject) qs.append('subject', subject);
        const res = await fetch(`/api/contents/recommendations?${qs.toString()}`);
        const data = await res.json();
        if (data.success && data.contents && data.contents.length > 0) {
          // 콘텐츠 type별 단색 아이콘 (썸네일 fallback 용도)
          const TYPE_STYLE = {
            video:    { icon: '🎬', color: '#EF4444', label: '영상' },
            document: { icon: '📄', color: '#3B82F6', label: '문서' },
            image:    { icon: '🖼', color: '#10B981', label: '이미지' },
            link:     { icon: '🔗', color: '#6366F1', label: '링크' },
            quiz:     { icon: '✏️', color: '#F59E0B', label: '문항' },
            exam:     { icon: '📝', color: '#8B5CF6', label: '평가지' },
            package:  { icon: '📦', color: '#0EA5E9', label: '꾸러미' }
          };
          window._popularContents = data.contents.slice(0, 6);
          // YouTube ID 추출 → 자동 썸네일 URL 생성 (서버 thumbnail_url이 우선)
          const ytIdOf = (url) => { const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/); return m ? m[1] : null; };
          grid.innerHTML = data.contents.slice(0, 6).map((c, i) => {
            const st = TYPE_STYLE[c.content_type] || { icon: '📁', color: '#6B7280', label: '기타' };
            const ytId = c.content_type === 'video' ? ytIdOf(c.content_url) : null;
            const imageSelfThumb = (c.content_type === 'image') ? (c.content_url || c.file_path || null) : null;
            const thumbUrl = c.thumbnail_url
              || (ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : null)
              || imageSelfThumb;
            // 썸네일 있으면 <img>로, 실패 시 onerror로 type 아이콘 fallback
            const thumbInner = thumbUrl
              ? `<img src="${thumbUrl}" alt="" onerror="this.parentElement.style.background='${st.color}';this.parentElement.innerHTML='<span class=\\'thumb-icon\\'>${st.icon}</span>';">`
              : `<span class="thumb-icon" style="background:${st.color};">${st.icon}</span>`;
            return `
              <div class="content-item" onclick="openContentDetailModal(${i})" role="button" tabindex="0">
                <div class="content-thumb">${thumbInner}</div>
                <div class="content-info">
                  <div class="content-name">${c.title || '콘텐츠'}</div>
                  <div class="content-meta">
                    <span>${st.label}</span>
                    <span><i class="fas fa-eye"></i> ${(c.view_count || 0).toLocaleString()}</span>
                  </div>
                </div>
              </div>`;
          }).join('');
        } else {
          grid.innerHTML = `<div style="padding:18px;text-align:center;color:#6B7280;font-size:15px;grid-column:1/-1;">
            <div style="font-weight:600;color:#374151;margin-bottom:6px;">추천 콘텐츠를 준비 중이에요</div>
            <a href="/content/index.html" style="display:inline-block;margin-top:6px;padding:8px 16px;background:#4A7CFF;color:white;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;">공개 콘텐츠 둘러보기</a>
          </div>`;
        }
      } catch(e) { grid.innerHTML = '<div style="padding:18px;text-align:center;color:#9CA3AF;font-size:15px;grid-column:1/-1;">잠시 후 다시 시도해 주세요</div>'; }
    }

    async function loadNotices() {
      const container = document.getElementById('noticeList');
      const badgeText = { important: '중요', event: '이벤트', normal: '공지' };
      let noticeHtml = '';
      let scheduleHtml = '';

      // 공지사항 로드 (내 클래스의 최근 공지)
      try {
        const classRes = await fetch('/api/class/my');
        const classData = await classRes.json();
        if (classData.success && classData.classes && classData.classes.length > 0) {
          const firstClass = classData.classes[0];
          const res = await fetch(`/api/notice/${firstClass.id}?limit=5`);
          const data = await res.json();
          if (data.success && data.notices && data.notices.length > 0) {
            noticeHtml = data.notices.map(n => `
              <div class="notice-item">
                <span class="notice-badge ${n.is_pinned ? 'important' : 'normal'}">${n.is_pinned ? '중요' : '공지'}</span>
                <span class="notice-text">${n.title}</span>
                <span class="notice-date">${(n.created_at || '').slice(0, 10)}</span>
              </div>
            `).join('');
          }
        }
      } catch(e) {}

      if (!noticeHtml) {
        noticeHtml = '<div style="padding:14px;text-align:center;color:#6B7280;font-size:15px;">새로운 공지가 없어요. 모두 확인하셨네요!</div>';
      }

      // 일정은 loadCalendarEvents()에서 별도로 처리
      const now = new Date();
      const iconMap = { lesson: '📚', homework: '📝', survey: '📊', exam: '✏️' };
      try {
        const start = now.toISOString().slice(0, 10);
        const end = new Date(now.getTime() + 7 * 86400000).toISOString().slice(0, 10);
        const res = await fetch(`/api/portal/calendar?startDate=${start}&endDate=${end}`);
        const data = await res.json();
        if (data.success && data.events && data.events.length > 0) {
          scheduleHtml = `
            <div class="schedule-section">
              <div class="schedule-header"><i class="fas fa-calendar-day" style="color:var(--primary);margin-right:6px;"></i> 이번 주 일정</div>
              ${data.events.slice(0, 5).map(e => `
                <div class="schedule-item">
                  <span class="schedule-icon">${iconMap[e.type] || '📌'}</span>
                  <span class="schedule-time">${(e.date || '').slice(5)}</span>
                  <span class="schedule-title">${e.title}</span>
                </div>
              `).join('')}
            </div>`;
        } else {
          scheduleHtml = '<div class="schedule-section"><div class="schedule-header"><i class="fas fa-calendar-day" style="color:var(--primary);margin-right:6px;"></i> 이번 주 일정</div><div style="padding:14px;text-align:center;color:#6B7280;font-size:15px;">이번 주에 예정된 일정이 없어요</div></div>';
        }
      } catch(e) {
        scheduleHtml = '<div class="schedule-section"><div class="schedule-header"><i class="fas fa-calendar-day" style="color:var(--primary);margin-right:6px;"></i> 이번 주 일정</div><div style="padding:14px;text-align:center;color:#9CA3AF;font-size:15px;">잠시 후 다시 시도해 주세요</div></div>';
      }

      container.innerHTML = noticeHtml + scheduleHtml;
    }

            const subText = svc.url ? '' : '<div style="font-size:13px;color:#9CA3AF;margin-top:2px;">외부 서비스 — 준비 중</div>';
            return `${tag}
              <div style="width:44px;height:44px;border-radius:12px;background:${svc.color};display:flex;align-items:center;justify-content:center;color:white;font-size:1.2rem;flex-shrink:0;">${svc.icon}</div>
              <div style="flex:1;"><div style="font-weight:600;color:var(--gray-800);font-size:16px;">${svc.name}</div>${subText}</div>
              <span style="font-size:13px;font-weight:700;color:#B45309;background:#FDE68A;padding:3px 10px;border-radius:10px;">추천</span>
            ${closeTag}`;
          }).join('')}
        </div>
      `;
    }

    // ==================== 전체 서비스 ====================
    function renderAllServices() {
      const grid = document.getElementById('allServicesGrid');
      const role = currentUser?.role || 'student';
      const order = ROLE_SERVICE_ORDER[role] || ROLE_SERVICE_ORDER.teacher;
      const recommended = ROLE_RECOMMEND[role] || [];

      grid.innerHTML = order.map(id => {
        const svc = SERVICES[id];
        if (!svc) return '';
        if (id === 'admin' && role !== 'admin') return '';
        const isRec = recommended.includes(id);
        const href = svc.url || '#';
        const onclick = svc.url ? '' : ` onclick="showToast('${svc.name} 서비스는 준비 중입니다.');return false;"`;
        const externalTag = svc.url ? '' : '<span class="all-service-external">외부</span>';
        const recTag = isRec ? '<span class="all-service-rec-badge">추천</span>' : '';
        return `<a href="${href}" class="all-service-item ${isRec ? 'recommended' : ''}"${onclick}>
          <div class="all-service-icon" style="background:${svc.color}">${svc.icon}</div>
          <span class="all-service-text">
            <span class="all-service-name">${svc.name}</span>
            ${externalTag}
            ${recTag}
          </span>
        </a>`;
      }).join('');

      grid.style.display = isServicesExpanded ? 'grid' : 'none';
    }

    function toggleAllServices() {
      isServicesExpanded = !isServicesExpanded;
      document.getElementById('allServicesGrid').style.display = isServicesExpanded ? 'grid' : 'none';
      document.getElementById('collapseIcon').className = isServicesExpanded ? 'fas fa-chevron-down' : 'fas fa-chevron-right';
      document.getElementById('collapseText').textContent = isServicesExpanded ? '접기' : '펼치기';
    }

    // ==================== 편집 모달 ====================
    function openEditModal() {
      tempSelectedKeys = [...selectedQuickKeys];
      renderEditGrid();
      document.getElementById('editModalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeEditModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('editModalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    function renderEditGrid() {
      const allKeys = Object.keys(SERVICES).filter(k => k !== 'admin');
      document.getElementById('editServiceGrid').innerHTML = allKeys.map(key => {
        const svc = SERVICES[key];
        const sel = tempSelectedKeys.includes(key);
        return `<div class="edit-service-item ${sel ? 'selected' : ''}" onclick="toggleEditService('${key}')">
          <div class="edit-service-icon" style="background:${svc.color}15;color:${svc.color}">${svc.icon}</div>
          <span class="edit-service-name">${svc.name}</span>
        </div>`;
      }).join('');
      document.getElementById('selectedCount').textContent = tempSelectedKeys.length;
    }

    function toggleEditService(key) {
      const idx = tempSelectedKeys.indexOf(key);
      if (idx > -1) { tempSelectedKeys.splice(idx, 1); }
      else if (tempSelectedKeys.length < 15) { tempSelectedKeys.push(key); }
      else { showToast('최대 15개까지 선택할 수 있습니다.'); return; }
      renderEditGrid();
    }

    function saveQuickMenu() {
      if (tempSelectedKeys.length === 0) { showToast('최소 1개 이상 선택해주세요.'); return; }
      selectedQuickKeys = [...tempSelectedKeys];
      renderQuickMenu();
      closeEditModal();
      showToast('바로가기가 저장되었습니다.');
    }

    // (deprecated) 4슬롯 클릭은 onStatCardClick(index)로 단일화 — renderDashboard 부근 정의

    // ==================== 인기 콘텐츠 상세 모달 ====================
    async function openContentDetailModal(index) {
      const contents = window._popularContents || [];
      if (!contents[index]) return;
      const c = contents[index];
      const modal = document.getElementById('modalOverlay');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitleText');
      const list = document.getElementById('modalList');

      const typeNames = { video:'영상', document:'문서', image:'이미지', link:'링크', quiz:'문항', exam:'평가지', assessment:'평가지', package:'수업꾸러미' };
      const typeIcons = { video:'🎬', document:'📄', image:'🖼', link:'🔗', quiz:'✏️', exam:'📝', assessment:'📝', package:'📦' };

      icon.textContent = typeIcons[c.content_type] || '📁';
      title.textContent = '콘텐츠 상세';

      list.innerHTML = `
        <div class="content-detail-section">
          <div class="content-detail-title">${c.title || '콘텐츠'}</div>
          <div class="content-detail-desc">${c.description || '설명이 없습니다.'}</div>
          <div class="content-detail-tags">
            <span class="content-detail-tag">${typeNames[c.content_type] || c.content_type}</span>
            ${c.subject ? `<span class="content-detail-tag">${c.subject}</span>` : ''}
            ${c.grade ? `<span class="content-detail-tag">${c.grade}학년</span>` : ''}
            ${c.tags ? (Array.isArray(c.tags) ? c.tags : String(c.tags).split(',')).map(t => `<span class="content-detail-tag">${String(t).trim()}</span>`).join('') : ''}
          </div>
        </div>
        <div class="content-detail-section">
          <div class="content-detail-meta-grid">
            <div class="content-detail-meta-item">
              <div class="val">${(c.view_count || 0).toLocaleString()}</div>
              <div class="lbl">조회수</div>
            </div>
            <div class="content-detail-meta-item">
              <div class="val">${(c.like_count || 0).toLocaleString()}</div>
              <div class="lbl">좋아요</div>
            </div>
            <div class="content-detail-meta-item">
              <div class="val">${c.author_name || '-'}</div>
              <div class="lbl">등록자</div>
            </div>
          </div>
        </div>
        <div class="content-detail-actions">
          <button class="btn btn-secondary" onclick="likeContent(${c.id})"><i class="fas fa-heart"></i> 좋아요</button>
          <button class="btn btn-secondary" onclick="saveToCollection(${c.id})"><i class="fas fa-bookmark"></i> 보관함</button>
          <button class="btn btn-primary" onclick="viewContent(${c.id}, '${c.content_type}')"><i class="fas fa-play"></i> 보기</button>
        </div>
      `;

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    async function likeContent(contentId) {
      if (!currentUser) { location.href = '/login.html?redirect=' + encodeURIComponent('/'); return; }
      try {
        const res = await fetch('/api/contents/' + contentId + '/like', { method: 'POST', headers: {'Content-Type':'application/json'} });
        const data = await res.json();
        showToast(data.success ? '좋아요를 눌렀습니다! ❤️' : (data.message || '처리 실패'));
      } catch { showToast('오류가 발생했습니다.'); }
    }

    async function saveToCollection(contentId) {
      if (!currentUser) { location.href = '/login.html?redirect=' + encodeURIComponent('/'); return; }
      try {
        const res = await fetch('/api/contents/collection/' + contentId, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ folder: '포털에서 담기' })
        });
        const data = await res.json();
        showToast(data.success ? '보관함에 담았습니다! 📚' : (data.message || '처리 실패'));
      } catch { showToast('오류가 발생했습니다.'); }
    }

    function viewContent(contentId, type) {
      closeModal();
      location.href = '/content/index.html?id=' + contentId;
    }

    // ==================== 인기 클래스 상세 모달 ====================
    async function openClassDetailModal(index) {
      const classes = window._popularClasses || [];
      if (!classes[index]) return;
      const cls = classes[index];
      const modal = document.getElementById('modalOverlay');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitleText');
      const list = document.getElementById('modalList');
      const bgs = ['#4F46E5','#A855F7','#059669','#D97706','#14B8A6'];
      const icons = ['📚','📐','🎮','🔤','🌿'];

      icon.textContent = icons[index % icons.length];
      title.textContent = '클래스 소개';

      // Check if user is already a member (비로그인 시 호출 생략)
      let isMember = false;
      if (currentUser) {
        try {
          const myRes = await fetch('/api/class/my');
          if (myRes.ok) {
            const myData = await myRes.json();
            isMember = (myData.classes || []).some(c => c.id === cls.id);
          }
        } catch {}
      }

      list.innerHTML = `
        <div class="class-detail-header">
          <div class="class-detail-avatar" style="background:${bgs[index%bgs.length]}15;color:${bgs[index%bgs.length]}">${icons[index%icons.length]}</div>
          <div class="class-detail-name">${cls.name}</div>
          <div class="class-detail-teacher">${cls.owner_name || '선생님'}</div>
        </div>
        <div class="class-detail-stats">
          <div class="class-detail-stat"><div class="num">${cls.member_count || 0}</div><div class="lbl">멤버</div></div>
          <div class="class-detail-stat"><div class="num">${cls.class_type === 'subject' ? '교과' : '일반'}</div><div class="lbl">유형</div></div>
          <div class="class-detail-stat"><div class="num">${cls.is_public ? '공개' : '비공개'}</div><div class="lbl">공개여부</div></div>
        </div>
        ${cls.description ? `<div class="content-detail-desc" style="text-align:center;padding:0 16px;">${cls.description}</div>` : ''}
        <div class="content-detail-actions" style="margin-top:20px;">
          ${isMember
            ? `<button class="btn btn-primary" onclick="closeModal(); location.href='/class/class-home.html?classId=${cls.id}'">
                <i class="fas fa-arrow-right"></i> 클래스 바로가기
              </button>`
            : `<button class="btn btn-primary" onclick="joinClass(${cls.id}, '${cls.code || ''}')">
                <i class="fas fa-user-plus"></i> 가입 신청
              </button>`
          }
        </div>
      `;

      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    async function joinClass(classId, code) {
      // 비로그인 시: 로그인 페이지로 redirect 매개변수 전달
      if (!currentUser) {
        location.href = '/login.html?redirect=' + encodeURIComponent('/');
        return;
      }
      try {
        const res = await fetch('/api/class/' + classId + '/join', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ code })
        });
        const data = await res.json();
        if (data.success) {
          showToast('클래스에 가입되었습니다! 🎉');
          closeModal();
          loadPopularClasses();
          loadRealStats().then(renderDashboard);
        } else {
          showToast(data.message || '가입에 실패했습니다.');
        }
      } catch { showToast('오류가 발생했습니다.'); }
    }

    // ==================== 모달 ====================
    function closeModal(event) {
      if (event && event.target && event.currentTarget && event.target !== event.currentTarget) return;
      const overlay = document.getElementById('modalOverlay');
      overlay.classList.remove('active');
      document.body.style.overflow = '';
      // 모달 내용 초기화 (다음 열기를 위해)
      setTimeout(() => {
        if (!overlay.classList.contains('active')) {
          document.getElementById('modalList').innerHTML = '';
        }
      }, 350);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { closeModal(); closeEditModal(); }
    });

    // ==================== 토스트 ====================
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }
  </script>
</body>
</html>
