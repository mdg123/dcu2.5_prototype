        if (!data.success) { showToast(data.message || '삭제 실패', 'error'); return; }
        await loadComments(selectedNoticeId);
        renderList();
        showToast('댓글을 삭제했어요.', 'success');
      } catch (e) {
        showToast('네트워크 오류', 'error');
      }
    }

    // ─────────────────────────────────────
    // 작성 / 수정 모달
    // ─────────────────────────────────────
    // ─────────────────────────────────────
    // Phase 3: Quill 위지윅 에디터 고도화
    // ─────────────────────────────────────
    // 색상 팔레트 (16색 + 사용자 지정)
    const NB_COLOR_PALETTE = [
      '#000000','#424242','#9e9e9e','#ffffff',
      '#ef4444','#f59e0b','#fbbf24','#84cc16',
      '#10b981','#06b6d4','#3b82f6','#1d4ed8',
      '#8b5cf6','#d946ef','#ec4899','#f43f5e',
      // 톤별 2단계
      '#fee2e2','#fef3c7','#dbeafe','#d1fae5','#ede9fe','#fce7f3'
    ];

    // 글꼴 whitelist
    const NB_FONT_WHITELIST = ['pretendard','noto','gowun','myeongjo','gothic'];
    // 크기 whitelist (픽셀 단위)
    const NB_SIZE_WHITELIST = ['12px','14px','16px','18px','22px','28px','36px','48px'];

    let nbQuillCustomRegistered = false;
    function registerQuillCustomFormats() {
      if (nbQuillCustomRegistered || !window.Quill) return;
      // 폰트 등록
      const Font = Quill.import('formats/font');
      Font.whitelist = NB_FONT_WHITELIST;
      Quill.register(Font, true);
      // 크기 등록 (Quill 기본 small/normal/large/huge 대신 픽셀 단위)
      const SizeStyle = Quill.import('attributors/style/size');
      SizeStyle.whitelist = NB_SIZE_WHITELIST;
      Quill.register(SizeStyle, true);

      // 수평선 BlockEmbed 등록
      const BlockEmbed = Quill.import('blots/block/embed');
      class HrBlot extends BlockEmbed {
        static blotName = 'hr';
        static tagName = 'hr';
      }
      Quill.register(HrBlot);

      // 표 BlockEmbed — Quill이 자체 편집은 못해도 보존만 되도록
      // table 전체 블록을 하나의 embed로 다룸
      class TableBlot extends BlockEmbed {
        static blotName = 'tablewrap';
        static tagName = 'div';
        static className = 'nb-table-wrap';
        static create(value) {
          const node = super.create();
          node.setAttribute('contenteditable', 'true');
          node.innerHTML = value || '';
          return node;
        }
        static value(node) { return node.innerHTML; }
      }
      Quill.register(TableBlot);

      // Phase 4: 일반 웹페이지 iframe BlockEmbed
      // value = { url } — sandbox 속성으로 안전성 확보, 상단 출처 바 함께 렌더
      class WebEmbedBlot extends BlockEmbed {
        static blotName = 'webembed';
        static tagName = 'div';
        static className = 'nb-embed-wrap';
        static create(value) {
          const node = super.create();
          const url = (typeof value === 'string') ? value : (value && value.url) || '';
          node.setAttribute('data-url', url);
          node.setAttribute('contenteditable', 'false');
          try {
            const host = new URL(url).host;
            node.innerHTML = `
              <div class="nb-embed-bar">
                <i class="fas fa-globe"></i>
                <span class="src">${host}</span>
                <a href="${url}" target="_blank" rel="noopener">새 탭에서 열기 <i class="fas fa-external-link-alt"></i></a>
              </div>
              <iframe class="nb-embed-web" src="${url}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer" loading="lazy"></iframe>`;
          } catch (e) {
            node.innerHTML = `<iframe class="nb-embed-web" src="${url}" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" loading="lazy"></iframe>`;
          }
          return node;
        }
        static value(node) { return { url: node.getAttribute('data-url') || '' }; }
      }
      Quill.register(WebEmbedBlot);

      nbQuillCustomRegistered = true;
    }

    function initQuill() {
      if (!window.Quill) return;
      if (quill) return;
      registerQuillCustomFormats();

      const toolbarOptions = [
        [{ 'font': NB_FONT_WHITELIST }, { 'header': [1, 2, 3, 4, false] }, { 'size': NB_SIZE_WHITELIST }],
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': NB_COLOR_PALETTE }, { 'background': NB_COLOR_PALETTE }],
        [{ 'list': 'ordered'}, { 'list': 'bullet' }, { 'indent': '-1'}, { 'indent': '+1' }],
        [{ 'align': [] }],
        ['blockquote', 'code-block'],
        ['link', 'image', 'imageUpload', 'youtube', 'webEmbed', 'hr', 'table'],
        ['clean']
      ];

      quill = new Quill('#nbQuill', {
        theme: 'snow',
        placeholder: '알림장 내용을 입력하세요... (유튜브·이미지·웹페이지 URL을 붙여넣으면 자동 임베드)',
        modules: {
          toolbar: {
            container: toolbarOptions,
            handlers: {
              'hr': nbInsertHr,
              'table': nbOpenTablePopover,
              'image': nbInsertImageByUrl,
              'imageUpload': nbInsertImageByUpload,
              'youtube': nbInsertYoutubePrompt,
              'webEmbed': nbInsertWebEmbedPrompt,
              'link': nbInsertLinkPrompt
            }
          },
          clipboard: {
            // hr 태그는 'hr' embed로 매핑
            matchers: [
              ['hr', function(node, delta) {
                return new Quill.imports.delta()
                  .insert({ hr: true });
              }],
              ['table', function(node, delta) {
                // 표 전체 HTML을 tablewrap embed로 보존
                return new Quill.imports.delta()
                  .insert({ tablewrap: node.outerHTML });
              }]
            ]
          }
        }
      });
      quill.on('text-change', () => {
        scheduleDraftAutoSave();
        // 소스 모드일 경우 동기화는 토글에서만
      });

      // Phase 4: 클립보드 paste 가로채기 — 이미지 blob / 유튜브·일반 URL 자동 임베드
      nbAttachPasteHandler(quill);
      // Phase 4: 드래그&드롭 — 이미지 파일 업로드 후 본문 삽입
      nbAttachDropHandler(quill);

      // 툴바 버튼 title 한글화 + 커스텀 버튼 라벨
      setTimeout(() => {
        const toolbar = document.querySelector('#composeModal .ql-toolbar');
        if (!toolbar) return;
        const tipMap = {
          'ql-bold':'굵게','ql-italic':'기울임','ql-underline':'밑줄','ql-strike':'취소선',
          'ql-blockquote':'인용구','ql-code-block':'코드 블록','ql-link':'링크','ql-image':'이미지(URL)',
          'ql-imageUpload':'이미지 업로드(PC)','ql-youtube':'유튜브 영상','ql-webEmbed':'웹페이지 임베드',
          'ql-hr':'수평선','ql-table':'표 삽입','ql-clean':'서식 지우기',
          'ql-list':'목록','ql-indent':'들여쓰기','ql-align':'정렬',
          'ql-color':'글자색','ql-background':'배경색','ql-font':'글꼴','ql-header':'문단','ql-size':'크기'
        };
        Object.keys(tipMap).forEach(cls => {
          toolbar.querySelectorAll('.' + cls).forEach(el => {
            if (!el.title) el.title = tipMap[cls];
          });
        });
        nbBuildTableGrid();
      }, 50);
    }

    // 수평선 삽입
    function nbInsertHr() {
      if (!quill) return;
      const range = quill.getSelection(true);
      quill.insertEmbed(range.index, 'hr', true, Quill.sources.USER);
      quill.setSelection(range.index + 1, 0, Quill.sources.SILENT);
    }

    // 링크 삽입 — 한글 prompt
    function nbInsertLinkPrompt() {
      if (!quill) return;
      const range = quill.getSelection(true);
      const sel = range && range.length ? quill.getText(range.index, range.length) : '';
      const url = window.prompt('링크 주소를 입력하세요 (https://...)', 'https://');
      if (!url || url === 'https://') return;
      if (range && range.length) {
        quill.format('link', url);
      } else {
        const label = window.prompt('표시할 텍스트 (선택)', url) || url;
        quill.insertText(range.index, label, 'link', url);
        quill.setSelection(range.index + label.length, 0);
      }
    }

    // 이미지(URL) 삽입
    function nbInsertImageByUrl() {
      if (!quill) return;
      const url = window.prompt('이미지 URL을 입력하세요 (https://...)\n- 클립보드의 이미지는 본문에 바로 붙여넣기 가능합니다.\n- PC 파일은 옆의 [이미지 업로드] 버튼을 사용하세요.', 'https://');
      if (!url || url === 'https://') return;
      const range = quill.getSelection(true);
      quill.insertEmbed(range.index, 'image', url);
      quill.setSelection(range.index + 1, 0);
    }

    // ─────────────────────────────────────
    // Phase 4: 미디어 자동 임베드 — 유튜브 / 일반 웹 / 이미지(업로드·paste·drop)
    // ─────────────────────────────────────
    const NB_IMG_PASTE_DATAURL_LIMIT = 256 * 1024; // 256KB 이하만 dataURL, 그 이상은 서버 업로드

    // 유튜브 URL → videoId 추출. youtube.com/watch?v=, youtu.be/, /shorts/, /embed/ 지원
    function nbExtractYoutubeId(url) {
      if (!url || typeof url !== 'string') return null;
      const patterns = [
        /(?:youtube\.com\/watch\?(?:.*&)?v=)([\w-]{11})/i,
        /(?:youtube\.com\/shorts\/)([\w-]{11})/i,
        /(?:youtube\.com\/embed\/)([\w-]{11})/i,
        /(?:youtu\.be\/)([\w-]{11})/i
      ];
      for (const re of patterns) {
        const m = url.match(re);
        if (m && m[1]) return m[1];
      }
      return null;
    }

    // 일반 URL 검출
    function nbIsHttpUrl(s) {
      if (!s || typeof s !== 'string') return false;
      return /^https?:\/\/\S+$/i.test(s.trim());
    }

    // 툴바 — 유튜브 삽입
    function nbInsertYoutubePrompt() {
      if (!quill) return;
      const url = window.prompt('유튜브 영상 URL을 입력하세요\n예) https://www.youtube.com/watch?v=XXXXXXXXXXX\n     https://youtu.be/XXXXXXXXXXX', 'https://');
      if (!url || url === 'https://') return;
      const id = nbExtractYoutubeId(url);
      if (!id) { showToast('유효한 유튜브 URL이 아닙니다.', 'warning'); return; }
      nbInsertYoutubeById(id);
    }

    function nbInsertYoutubeById(id) {
      if (!quill || !id) return;
      const range = quill.getSelection(true) || { index: quill.getLength() };
      const embedUrl = `https://www.youtube.com/embed/${id}`;
      quill.insertEmbed(range.index, 'video', embedUrl, Quill.sources.USER);
      quill.setSelection(range.index + 1, 0, Quill.sources.SILENT);
      showToast('유튜브 영상을 본문에 임베드했습니다.', 'success');
    }

    // 툴바 — 일반 웹페이지 임베드
    function nbInsertWebEmbedPrompt() {
      if (!quill) return;
      const url = window.prompt('임베드할 웹페이지 URL을 입력하세요 (https://...)\n※ 사이트가 X-Frame-Options 으로 임베드를 거부하면 빈 화면이 보일 수 있습니다.', 'https://');
      if (!url || url === 'https://') return;
      if (!nbIsHttpUrl(url)) { showToast('유효한 URL이 아닙니다.', 'warning'); return; }
      if (nbExtractYoutubeId(url)) {
        nbInsertYoutubeById(nbExtractYoutubeId(url));
        return;
      }
      nbInsertWebEmbedAt(url);
    }

    function nbInsertWebEmbedAt(url) {
      if (!quill) return;
      const range = quill.getSelection(true) || { index: quill.getLength() };
      quill.insertEmbed(range.index, 'webembed', { url }, Quill.sources.USER);
      quill.setSelection(range.index + 1, 0, Quill.sources.SILENT);
      showToast('웹페이지를 본문에 임베드했습니다. 사이트에 따라 표시가 제한될 수 있습니다.', 'success');
    }

    // 툴바 — 이미지 파일 업로드 (PC에서 선택)
    function nbInsertImageByUpload() {
      if (!quill) return;
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        await nbUploadAndInsertImage(file);
      };
      input.click();
    }

    // 이미지 업로드 → 본문 삽입 공통
    async function nbUploadAndInsertImage(file) {
      if (!quill || !file) return;
      // 작은 이미지는 dataURL로 즉시 삽입 (서버 부담↓)
      if (file.size && file.size <= NB_IMG_PASTE_DATAURL_LIMIT) {
        try {
          const dataUrl = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result);
            r.onerror = rej;
            r.readAsDataURL(file);
          });
          const range = quill.getSelection(true) || { index: quill.getLength() };
          quill.insertEmbed(range.index, 'image', dataUrl, Quill.sources.USER);
          quill.setSelection(range.index + 1, 0, Quill.sources.SILENT);
          return;
        } catch (e) { /* fall through */ }
      }
      // 서버 업로드
      try {
        const fd = new FormData();
        fd.append('file', file, file.name || 'paste.png');
        const res = await fetchAuth('/api/upload?type=notice-image', { method: 'POST', body: fd });
        const d = await res.json();
        if (d && d.success && d.file && d.file.url) {
          const range = quill.getSelection(true) || { index: quill.getLength() };
          quill.insertEmbed(range.index, 'image', d.file.url, Quill.sources.USER);
          quill.setSelection(range.index + 1, 0, Quill.sources.SILENT);
          showToast('이미지를 본문에 삽입했습니다.', 'success');
        } else {
          showToast((d && d.message) || '이미지 업로드 실패', 'error');
        }
      } catch (e) {
        showToast('이미지 업로드 오류', 'error');
      }
    }

    // 클립보드 paste 핸들러 — 이미지 blob, 유튜브 URL, 일반 URL 자동 처리
    function nbAttachPasteHandler(q) {
      if (!q || !q.root) return;
      q.root.addEventListener('paste', async (e) => {
        if (!e.clipboardData) return;
        // 1) 이미지 blob (스크린샷 / 클립보드 이미지)
        const items = e.clipboardData.items || [];
        for (let i = 0; i < items.length; i++) {
          const it = items[i];
          if (it.kind === 'file' && it.type && it.type.startsWith('image/')) {
            e.preventDefault();
            const file = it.getAsFile();
            if (file) await nbUploadAndInsertImage(file);
            return;
          }
        }
        // 2) 텍스트 — URL 자동 인식
        const text = (e.clipboardData.getData('text/plain') || '').trim();
        if (!text) return;
        // 단독 URL 라인인지 (한 줄 + http(s)://)
        const isStandaloneUrl = /^https?:\/\/\S+$/i.test(text);
        if (!isStandaloneUrl) return;

        // 2-a) 유튜브 자동 임베드
        const ytId = nbExtractYoutubeId(text);
        if (ytId) {
          e.preventDefault();
          nbInsertYoutubeById(ytId);
          return;
        }
        // 2-b) 이미지 URL 자동 삽입 (확장자 추정)
        if (/\.(jpg|jpeg|png|gif|webp|svg|bmp)(\?.*)?$/i.test(text)) {
          e.preventDefault();
          const range = q.getSelection(true) || { index: q.getLength() };
          q.insertEmbed(range.index, 'image', text, Quill.sources.USER);
          q.setSelection(range.index + 1, 0, Quill.sources.SILENT);
          return;
        }
        // 2-c) 일반 웹 URL — 사용자 선택 (링크 vs 임베드)
        e.preventDefault();
        nbAskEmbedOrLink(text);
      });
    }

    // 일반 웹 URL paste 시 선택지(인라인 토스트형 다이얼로그) — 기본 toast 위치에 표시
    function nbAskEmbedOrLink(url) {
      if (!quill) return;
      // 간단 confirm 으로 처리 (UI 단순)
      const choice = window.confirm(`이 URL을 어떻게 삽입할까요?\n\n${url}\n\n[확인]  웹페이지로 임베드 (iframe)\n[취소]  단순 링크로 삽입`);
      const range = quill.getSelection(true) || { index: quill.getLength() };
      if (choice) {
        nbInsertWebEmbedAt(url);
      } else {
        quill.insertText(range.index, url, 'link', url, Quill.sources.USER);
        quill.setSelection(range.index + url.length, 0, Quill.sources.SILENT);
      }
    }

    // 드래그&드롭 — 이미지 파일 본문 삽입
    function nbAttachDropHandler(q) {
      if (!q || !q.root) return;
      const host = document.getElementById('nbQuill');
      const editor = q.root;
      const onDragOver = (e) => {
        if (!e.dataTransfer) return;
        const hasFile = (e.dataTransfer.types || []).indexOf('Files') >= 0;
        if (!hasFile) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        if (host) host.classList.add('nb-dropping');
      };
      const onDragLeave = () => { if (host) host.classList.remove('nb-dropping'); };
      const onDrop = async (e) => {
        if (!e.dataTransfer) return;
        const files = e.dataTransfer.files || [];
        if (!files.length) return;
        const imgs = [].slice.call(files).filter(f => f.type && f.type.startsWith('image/'));
        if (!imgs.length) return;
        e.preventDefault();
        if (host) host.classList.remove('nb-dropping');
        for (const f of imgs) {
          await nbUploadAndInsertImage(f);
        }
      };
      editor.addEventListener('dragover', onDragOver);
      editor.addEventListener('dragleave', onDragLeave);
      editor.addEventListener('drop', onDrop);
    }

    // 표 삽입 그리드 팝오버
    function nbBuildTableGrid() {
      const grid = document.getElementById('nbTableGrid');
      if (!grid || grid.children.length) return;
      const ROWS = 8, COLS = 10;
      for (let r = 1; r <= ROWS; r++) {
        for (let c = 1; c <= COLS; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.dataset.r = r; cell.dataset.c = c;
          cell.addEventListener('mouseenter', () => nbHighlightGrid(r, c));
          cell.addEventListener('click', () => { nbInsertTableAt(r, c); nbCloseTablePopover(); });
          grid.appendChild(cell);
        }
      }
      grid.addEventListener('mouseleave', () => nbHighlightGrid(0, 0));
    }
    function nbHighlightGrid(R, C) {
      const grid = document.getElementById('nbTableGrid');
      if (!grid) return;
      [...grid.children].forEach(cell => {
        const r = +cell.dataset.r, c = +cell.dataset.c;
        cell.classList.toggle('hover', r <= R && c <= C);
      });
      document.getElementById('nbTableLabel').textContent = R && C ? `${R} × ${C}` : '0 × 0';
    }
    function nbOpenTablePopover() {
      const pop = document.getElementById('nbTablePopover');
      if (!pop) return;
      // 툴바의 .ql-table 버튼 위치 계산
      const btn = document.querySelector('#composeModal .ql-toolbar .ql-table');
      const body = document.getElementById('nbEditorBody');
      if (!btn || !body) return;
      const bRect = btn.getBoundingClientRect();
      const eRect = body.getBoundingClientRect();
      pop.style.left = (bRect.left - eRect.left) + 'px';
      pop.style.top = (bRect.bottom - eRect.top + 4) + 'px';
      pop.classList.add('show');
      nbHighlightGrid(0, 0);
      // 바깥 클릭 닫기
      setTimeout(() => {
        document.addEventListener('click', nbDocClickClosePopover, { once: true });
      }, 0);
    }
    function nbDocClickClosePopover(e) {
      const pop = document.getElementById('nbTablePopover');
      if (pop && !pop.contains(e.target) && !e.target.closest('.ql-table')) nbCloseTablePopover();
      else if (pop && pop.classList.contains('show')) {
        document.addEventListener('click', nbDocClickClosePopover, { once: true });
      }
    }
    function nbCloseTablePopover() { document.getElementById('nbTablePopover').classList.remove('show'); }

    function nbInsertTableAt(rows, cols) {
      if (!quill || !rows || !cols) return;
      let html = '<table><tbody>';
      for (let r = 0; r < rows; r++) {
        html += '<tr>';
        for (let c = 0; c < cols; c++) {
          html += '<td>&nbsp;</td>';
        }
        html += '</tr>';
      }
      html += '</tbody></table>';
      const range = quill.getSelection(true);
      quill.insertEmbed(range.index, 'tablewrap', html, Quill.sources.USER);
      quill.insertText(range.index + 1, '\n', Quill.sources.USER);
      quill.setSelection(range.index + 2, 0, Quill.sources.SILENT);
    }

    // HTML 소스 편집 모드 토글
    let nbIsSourceMode = false;
    function toggleSourceMode() {
      const btn = document.getElementById('btnSourceToggle');
      const sourceArea = document.getElementById('nbSourceArea');
      const body = document.getElementById('nbEditorBody');
      const textarea = document.getElementById('nbSourceTextarea');
      if (!quill) return;

      if (!nbIsSourceMode) {
        // Quill → Source
        textarea.value = quill.root.innerHTML;
        sourceArea.classList.add('active');
        body.classList.add('nb-source-mode');
        btn.setAttribute('aria-pressed', 'true');
        btn.innerHTML = '<i class="fas fa-eye"></i> 위지윅';
        nbIsSourceMode = true;
        setTimeout(() => textarea.focus(), 30);
      } else {
        // Source → Quill
        const html = textarea.value;
        // dangerouslyPasteHTML 으로 안전하게 주입 — Quill이 허용된 포맷만 유지
        quill.setContents([]);
        quill.clipboard.dangerouslyPasteHTML(0, html || '');
        sourceArea.classList.remove('active');
        body.classList.remove('nb-source-mode');
        btn.setAttribute('aria-pressed', 'false');
        btn.innerHTML = '<i class="fas fa-code"></i> HTML 소스';
        nbIsSourceMode = false;
      }
    }

    // 제출·미리보기 시 — 소스 모드면 textarea 값으로 동기화 후 가져오기
    function nbGetCurrentContent() {
      if (nbIsSourceMode) {
        const txt = document.getElementById('nbSourceTextarea').value || '';
        // Quill로도 동기화해두면 닫고 다시 열 때 일관성 유지
        try {
          quill.setContents([]);
          quill.clipboard.dangerouslyPasteHTML(0, txt);
        } catch (e) {}
        return txt;
      }
      return quill ? quill.root.innerHTML : '';
    }

    async function openCreateModal() {
      if (!isOwner) { showToast('개설자만 작성할 수 있습니다.', 'warning'); return; }
      editingNoticeId = null;
      document.getElementById('composeTitle').textContent = '알림장 작성';
      document.getElementById('cpSubmit').innerHTML = '<i class="fas fa-check"></i> 등록';
      document.getElementById('cpTitle').value = '';
      document.getElementById('cpAutoDate').checked = true;
      document.getElementById('cpPinned').checked = false;
      document.getElementById('cpTheme').value = 'classic';
      pendingAttachments = [];
      renderAttachPending();
      if (quill) quill.setText('');
      nbResetSourceMode();
      document.getElementById('cpDraftBadge').classList.remove('show');

      // 임시저장 불러오기
      try {
        const res = await fetchAuth(`/api/notice/${classId}/draft`);
        const d = await res.json();
        if (d.success && d.draft) {
          document.getElementById('cpTitle').value = d.draft.title || '';
          if (d.draft.theme) document.getElementById('cpTheme').value = d.draft.theme;
          if (quill && d.draft.content) quill.root.innerHTML = d.draft.content;
          pendingAttachments = (d.draft.attachments || []).slice();
          renderAttachPending();
          document.getElementById('cpDraftBadge').classList.add('show');
        }
      } catch (e) {}

      document.getElementById('composeModal').classList.add('show');
    }

    async function openEditModal(id) {
      const notice = (currentDetail && currentDetail.notice && currentDetail.notice.id === id) ? currentDetail.notice : allNotices.find(n => n.id === id);
      if (!notice) return;
      editingNoticeId = id;
      document.getElementById('composeTitle').textContent = '알림장 수정';
      document.getElementById('cpSubmit').innerHTML = '<i class="fas fa-check"></i> 저장';
      document.getElementById('cpTitle').value = notice.title || '';
      document.getElementById('cpAutoDate').checked = !!notice.auto_date;
      document.getElementById('cpPinned').checked = !!notice.is_pinned;
      document.getElementById('cpTheme').value = notice.theme || 'classic';
      pendingAttachments = (notice.attachments || []).slice();
      renderAttachPending();
      if (quill) quill.root.innerHTML = notice.content || '';
      nbResetSourceMode();
      document.getElementById('cpDraftBadge').classList.remove('show');
      document.getElementById('composeModal').classList.add('show');
    }

    function nbResetSourceMode() {
      // 모달 재열림 시 항상 위지윅 모드로 초기화
      if (!nbIsSourceMode) return;
      const btn = document.getElementById('btnSourceToggle');
      const sourceArea = document.getElementById('nbSourceArea');
      const body = document.getElementById('nbEditorBody');
      sourceArea.classList.remove('active');
      body.classList.remove('nb-source-mode');
      btn.setAttribute('aria-pressed', 'false');
      btn.innerHTML = '<i class="fas fa-code"></i> HTML 소스';
      nbIsSourceMode = false;
    }

    function closeCompose() {
      document.getElementById('composeModal').classList.remove('show');
    }

    function updateThemePreview() { /* 미리보기 버튼 누를 때 반영. 실시간 변화는 미리보기 모달이 담당. */ }

    function renderAttachPending() {
      const wrap = document.getElementById('cpAttachPending');
      if (!pendingAttachments.length) { wrap.innerHTML = ''; return; }
      wrap.innerHTML = pendingAttachments.map((a, idx) => `
        <div class="pending-item">
          <i class="fas fa-paperclip" style="color:var(--primary);"></i>
          <span>${escHtml(a.name || a.url)}</span>
          <button onclick="removeAttach(${idx})" title="삭제"><i class="fas fa-times"></i></button>
        </div>`).join('');
    }

    function removeAttach(idx) {
      pendingAttachments.splice(idx, 1);
      renderAttachPending();
    }

    async function addAttachFromFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const fd = new FormData();
        fd.append('file', file);
        const res = await fetchAuth('/api/upload?type=notice', { method: 'POST', body: fd });
        const d = await res.json();
        if (d.success && d.file) {
          pendingAttachments.push({ name: file.name, url: d.file.url });
          renderAttachPending();
          showToast('파일 업로드 완료', 'success');
        } else showToast('업로드 실패', 'error');
      } catch (e) { showToast('업로드 오류', 'error'); }
      input.value = '';
    }

    function addUrlAttach() {
      const v = document.getElementById('cpUrlAttach').value.trim();
      if (!v) return;
      const name = v.split('/').pop().slice(0, 60) || v;
      pendingAttachments.push({ name, url: v });
      renderAttachPending();
      document.getElementById('cpUrlAttach').value = '';
    }

    // 임시저장
    function scheduleDraftAutoSave() {
      if (editingNoticeId) return; // 수정 중일 땐 임시저장 안함
      clearTimeout(draftAutoSaveTimer);
      draftAutoSaveTimer = setTimeout(saveDraftSilent, 2500);
    }
    async function saveDraftSilent() {
      if (editingNoticeId) return;
      const title = document.getElementById('cpTitle').value.trim();
      const content = nbGetCurrentContent();
      const theme = document.getElementById('cpTheme').value;
      if (!title && (stripHtml(content).trim() === '')) return;
      try {
        await fetchAuth(`/api/notice/${classId}/draft`, {
          method: 'PUT', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ title, content, theme, attachments: pendingAttachments })
        });
        document.getElementById('cpDraftBadge').classList.add('show');
      } catch (e) {}
    }
    async function saveDraft() {
      await saveDraftSilent();
      showToast('임시저장 했습니다.', 'success');
    }

    async function submitNotice() {
      const title = document.getElementById('cpTitle').value.trim();
      if (!title) { showToast('제목을 입력하세요.', 'warning'); return; }
      const content = nbGetCurrentContent();
      const theme = document.getElementById('cpTheme').value;
      const is_pinned = document.getElementById('cpPinned').checked;
      const auto_date = document.getElementById('cpAutoDate').checked;
      const payload = { title, content, theme, is_pinned, auto_date, attachments: pendingAttachments };

      try {
        let res;
        if (editingNoticeId) {
          res = await fetchAuth(`/api/notice/${classId}/${editingNoticeId}`, {
            method: 'PUT', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
        } else {
          res = await fetchAuth(`/api/notice/${classId}`, {
            method: 'POST', headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          });
        }
        const d = await res.json();
        if (!d.success) { showToast(d.message || '저장 실패', 'error'); return; }
        showToast(editingNoticeId ? '알림장이 수정되었습니다.' : '알림장이 등록되었습니다.', 'success');
        closeCompose();
        const newId = (d.notice && d.notice.id) || editingNoticeId;
        editingNoticeId = null;
        await loadAllNotices();
        if (newId) openNoticeDetail(newId);
      } catch (e) { showToast('네트워크 오류', 'error'); }
    }

    // ─────────────────────────────────────
    // 미리보기
    // ─────────────────────────────────────
    function openPreview() {
      const title = document.getElementById('cpTitle').value.trim() || '(제목 없음)';
      const content = nbGetCurrentContent();
      const theme = document.getElementById('cpTheme').value;
      const themeCls = `nb-theme-${theme}`;
      const attachHtml = (pendingAttachments.length)
        ? `<div class="nb-attach-list">${pendingAttachments.map(a => `<a class="nb-attach-item" href="${escHtml(a.url||'#')}" target="_blank" rel="noopener"><i class="fas fa-paperclip"></i> ${escHtml(a.name || a.url)}</a>`).join('')}</div>`
        : '';
      document.getElementById('previewBody').innerHTML = `
        <div class="notice-detail-body ${themeCls}">
          <div class="nb-detail-title">${escHtml(title)}</div>
          <div class="nb-detail-meta">
            <span><i class="fas fa-user"></i> ${escHtml(currentUser && currentUser.display_name || currentUser && currentUser.username || '')}</span>
            <span><i class="fas fa-clock"></i> ${fmtDateLong(new Date().toISOString())}</span>
            ${document.getElementById('cpPinned').checked ? '<span class="pin-badge"><i class="fas fa-thumbtack"></i> 고정</span>' : ''}
          </div>
          <div class="nb-detail-content">${content || '<em style="color:#999;">내용이 없습니다.</em>'}</div>
          ${attachHtml}
        </div>`;
      document.getElementById('previewModal').classList.add('show');
    }
    function closePreview() { document.getElementById('previewModal').classList.remove('show'); }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (document.getElementById('previewModal').classList.contains('show')) closePreview();
        else if (document.getElementById('readModal').classList.contains('show')) closeReadModal();
      }
    });

    // ─────────────────────────────────────
    // 삭제
    // ─────────────────────────────────────
    async function deleteNotice(id) {
      const ok = await (typeof classConfirm === 'function'
        ? classConfirm({ title:'알림장 삭제', message:'정말 이 알림장을 삭제하시겠습니까?', okLabel:'삭제', danger:true })
        : Promise.resolve(confirm('정말 삭제하시겠습니까?')));
      if (!ok) return;
      try {
        const res = await fetchAuth(`/api/notice/${classId}/${id}`, { method: 'DELETE' });
        const d = await res.json();
        if (!d.success) { showToast(d.message || '삭제 실패', 'error'); return; }
        showToast('삭제되었습니다.', 'success');
        closeDetail();
        await loadAllNotices();
      } catch (e) { showToast('네트워크 오류', 'error'); }
    }

    // ─────────────────────────────────────
    // 읽음 명단
    // ─────────────────────────────────────
    function openReadModal() {
      if (!currentDetail) return;
      readModalTab = 'unread';
      document.getElementById('rtUnreadCnt').textContent = (currentDetail.unread_members || []).length;
      document.getElementById('rtReadCnt').textContent = (currentDetail.read_members || []).length;
      switchReadTab('unread');
      document.getElementById('readModal').classList.add('show');
    }
    function closeReadModal() { document.getElementById('readModal').classList.remove('show'); }
    function switchReadTab(t) {
      readModalTab = t;
      document.querySelectorAll('.read-tab').forEach(b => b.classList.toggle('active', b.dataset.rtab === t));
      const list = (t === 'unread' ? currentDetail.unread_members : currentDetail.read_members) || [];
      const el = document.getElementById('readMemberList');
      if (!list.length) {
        el.innerHTML = `<div style="padding:30px;text-align:center;color:var(--gray-400);">${t === 'unread' ? '모든 멤버가 확인했습니다.' : '확인한 멤버가 없습니다.'}</div>`;
      } else {
        el.innerHTML = list.map(m => `
          <div class="read-member">
            <div class="avatar">${escHtml((m.display_name || m.username || '?').slice(0,1))}</div>
            <div class="name">${escHtml(m.display_name || m.username)}</div>
            <div class="badge">${m.role === 'owner' ? '개설자' : '학생'}</div>
          </div>`).join('');
      }
      document.getElementById('rtRemindWrap').style.display = (t === 'unread' && list.length > 0) ? '' : 'none';
    }

    async function sendRemind() {
      if (!selectedNoticeId) return;
      try {
        const res = await fetchAuth(`/api/notice/${classId}/${selectedNoticeId}/remind`, { method: 'POST' });
        const d = await res.json();
        if (!d.success) { showToast(d.message || '실패', 'error'); return; }
        showToast(`${d.target_count}명에게 재알림을 보냈습니다.`, 'success');
      } catch (e) { showToast('네트워크 오류', 'error'); }
    }

    // ─────────────────────────────────────
    // Phase 5: 전체 화면(전시) 모드
    // ─────────────────────────────────────
    const NB_FS_MIN = 16, NB_FS_MAX = 56, NB_FS_STEP = 4, NB_FS_DEFAULT = 24;
    let nbFsSize = NB_FS_DEFAULT;
    let nbFsNativeEntered = false;  // native Fullscreen API가 실제로 진입했는지 추적

    function enterFullscreen() {
      if (!currentDetail) { showToast('알림장을 먼저 선택해 주세요.', 'error'); return; }
      const n = currentDetail.notice;
      const theme = (n.theme && ['classic','chalkboard','whiteboard','pastel','note'].includes(n.theme)) ? n.theme : 'classic';

      // 기존 오버레이 제거
      const old = document.getElementById('noticeFullscreen');
      if (old) old.remove();

      // 오버레이 생성
      const fs = document.createElement('div');
      fs.id = 'noticeFullscreen';
      fs.className = `nb-fullscreen nb-theme-${theme}`;
      fs.innerHTML = `
        <div class="nb-fs-controls">
          <button type="button" onclick="changeFsSize(-${NB_FS_STEP})" title="글자 작게" aria-label="글자 작게">
            <span style="font-weight:700;">A−</span>
          </button>
          <span class="nb-fs-size" id="nbFsSizeLabel">${nbFsSize}px</span>
          <button type="button" onclick="changeFsSize(${NB_FS_STEP})" title="글자 크게" aria-label="글자 크게">
            <span style="font-weight:700;font-size:18px;">A+</span>
          </button>
          <button type="button" class="nb-fs-close" onclick="exitFullscreen()" title="전시 모드 종료 (ESC)">
            <i class="fas fa-times"></i> 닫기
          </button>
        </div>
        <div class="nb-fs-scroll">
          <div class="nb-fs-inner">
            <div class="nb-fs-title">${escHtml(n.title)}</div>
            <div class="nb-fs-meta">
              <span><i class="fas fa-user"></i>${escHtml(n.author_name || '')}</span>
              <span><i class="fas fa-clock"></i>${fmtDateLong(n.created_at)}</span>
              ${n.is_pinned ? '<span><i class="fas fa-thumbtack"></i>고정 알림</span>' : ''}
            </div>
            <div class="nb-fs-body">${n.content || '<em>내용이 없습니다.</em>'}</div>
          </div>
        </div>`;
      document.body.appendChild(fs);

      // 글자 크기 초기 적용
      applyFsSize();

      // 표시 및 상태 전환
      requestAnimationFrame(() => {
        fs.classList.add('show');
        document.body.classList.add('nb-fs-active');
      });

      // 네이티브 Fullscreen API (사용자 클릭 직후라 안전)
      try {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().then(() => { nbFsNativeEntered = true; }).catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
          nbFsNativeEntered = !!document.webkitFullscreenElement;
        }
      } catch (e) { /* 권한·환경에 따라 무시 */ }

      // ESC 핸들러
      document.addEventListener('keydown', nbFsKeyHandler);
    }

    function exitFullscreen() {
      const fs = document.getElementById('noticeFullscreen');
      if (fs) fs.remove();
      document.body.classList.remove('nb-fs-active');
      document.removeEventListener('keydown', nbFsKeyHandler);
      nbFsNativeEntered = false;
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (e) {}
    }

    function nbFsKeyHandler(e) {
      if (e.key === 'Escape') { e.preventDefault(); exitFullscreen(); }
      else if (e.key === '+' || e.key === '=') { e.preventDefault(); changeFsSize(NB_FS_STEP); }
      else if (e.key === '-' || e.key === '_') { e.preventDefault(); changeFsSize(-NB_FS_STEP); }
    }

    function changeFsSize(delta) {
      nbFsSize = Math.max(NB_FS_MIN, Math.min(NB_FS_MAX, nbFsSize + delta));
      applyFsSize();
    }

    function applyFsSize() {
      const fs = document.getElementById('noticeFullscreen');
      if (!fs) return;
      fs.style.setProperty('--nb-fs-size', nbFsSize + 'px');
      const lbl = document.getElementById('nbFsSizeLabel');
      if (lbl) lbl.textContent = nbFsSize + 'px';
    }

    // 브라우저 네이티브 풀스크린 해제 시 오버레이도 정리
    // (단, native fullscreen에 한 번이라도 진입했던 경우에만 — 진입 자체가 실패한 케이스 제외)
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && nbFsNativeEntered && document.getElementById('noticeFullscreen')) {
        exitFullscreen();
      }
    });

    // ─────────────────────────────────────
    // Phase 5: 외부 iframe 임베드 (?embed=1)
    // ─────────────────────────────────────
    function applyEmbedMode() {
      try {
        const params = new URLSearchParams(window.location.search);
        const isEmbed = params.get('embed') === '1' || params.get('embed') === 'true';
        if (!isEmbed) return;
        document.body.classList.add('nb-embed');
        // common-nav가 비동기로 GNB를 주입하므로, 주입 후에도 즉시 숨겨지도록 MutationObserver
        const obs = new MutationObserver(() => {
          const gnb = document.getElementById('dacheum-gnb-wrapper');
          if (gnb) { gnb.style.display = 'none'; }
        });
        obs.observe(document.body, { childList: true, subtree: false });
        // 30초 후 옵저버 정리 (GNB가 한 번만 주입되므로)
        setTimeout(() => obs.disconnect(), 30000);
      } catch (e) { /* noop */ }
    }
    applyEmbedMode();
  </script>
</body>
</html>
