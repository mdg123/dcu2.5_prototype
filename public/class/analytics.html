                <div class="empty-state">
                  <i class="fas fa-spinner fa-spin"></i>
                  <h3>게시판 분석 데이터 로드 중…</h3>
                </div>
              </div>
            </div>
          </div>
        `;

        // 차트 렌더링 (AI 맞춤학습은 성장기록 영역으로 이전 — 클래스별 학습분석은 클래스 내 활동만)
        renderCharts(stats, students, avgActivity);
        renderStudentTable(students, avgActivity);

        // P0-2: KPI 카드 바인딩 — Backend summary (RFP 명세 필드) 우선. 0~100 클램프(중복 self_check 보호)
        const summary = (lrsRes.stats && lrsRes.stats.summary) || {};
        const clamp01 = v => v == null ? null : Math.max(0, Math.min(100, v));
        const lessonRateVal = (summary.lessonCompletionRate != null) ? clamp01(summary.lessonCompletionRate) : (students.length ? lessonRate : null);
        const homeworkRateVal = clamp01(summary.homeworkSubmitRate);
        const examRateVal = clamp01(summary.examSubmitRate);
        const avgScoreVal = clamp01(summary.avgScore);
        bindKpiValue('lessonRate', lessonRateVal, lessonRateVal != null ? `참여 학생 ${activeStudents}/${students.length}명` : '');
        bindKpiValue('homeworkRate', homeworkRateVal, homeworkRateVal != null ? '집계 데이터' : '');
        bindKpiValue('examRate', examRateVal, examRateVal != null ? '집계 데이터' : '');
        bindKpiValue('avgScore', avgScoreVal, avgScoreVal != null ? '집계 데이터' : '');

        // P0-7: 통합(overall) 인사이트
        renderAnalyticsInsightInto('#analyticsOverallInsight', 'overall', {
          lessonRate: lessonRateVal,
          homeworkRate: homeworkRateVal,
          examRate: examRateVal,
          examScore: avgScoreVal
        });

        // P0-4: 수업·과제·평가 막대그래프 + 명단 모달 (Backend EP 호출)
        loadBarAnalysis(classId, _periodState.startDate, _periodState.endDate);
        // P1: 게시판 분석 탭 데이터 로드
        loadBoardAnalytics(classId, _periodState.startDate, _periodState.endDate);
      } catch(err) {
        container.innerHTML = '<div class="section-box"><div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>데이터 로드 실패</h3><p>' + err.message + '</p></div></div>';
      }
    }

    // ===== P0-4: 수업·과제·평가 막대그래프 + 명단 모달 =====
    let lessonBarChart = null, homeworkBarChart = null, examBarChart = null;
    const _analyticsBarData = { lessons: [], homework: [], exams: [], classId: null };

    async function loadBarAnalysis(classId, startDate, endDate) {
      _analyticsBarData.classId = classId;
      const qs = (startDate && endDate) ? `?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}` : '';
      try {
        const [lr, hr, er] = await Promise.all([
          fetch(`/api/class/${classId}/analytics/lessons${qs}`).then(r => r.json()).catch(() => ({ items: [] })),
          fetch(`/api/class/${classId}/analytics/homework${qs}`).then(r => r.json()).catch(() => ({ items: [] })),
          fetch(`/api/class/${classId}/analytics/exams${qs}`).then(r => r.json()).catch(() => ({ items: [] })),
        ]);
        _analyticsBarData.lessons = (lr && lr.items) || [];
        _analyticsBarData.homework = (hr && hr.items) || [];
        _analyticsBarData.exams = (er && er.items) || [];
        renderLessonBar();
        renderHomeworkBar();
        renderExamBar();
        // P1: 드롭다운 채우기 (평가/과제 상세 분석용)
        _populateExamDetailPicker();
        _populateHomeworkSubmitTimePicker();
      } catch (e) { console.warn('[bar-analysis] load failed', e); }
    }

    function _barLabels(items, dateField, titleField) {
      return items.map(it => {
        const d = (it[dateField] || '').slice(5, 10);
        const t = String(it[titleField] || '제목 없음').slice(0, 18);
        return [d, t];
      });
    }
    function _rateColor(v) {
      if (v == null) return '#9ca3af';
      if (v >= 80) return '#10b981';
      if (v >= 50) return '#2563eb';
      if (v > 0) return '#f59e0b';
      return '#9ca3af';
    }

    function renderLessonBar() {
      const items = _analyticsBarData.lessons;
      const wrap = document.getElementById('lessonBarWrap');
      const empty = document.getElementById('lessonAnalysisEmpty');
      document.getElementById('lessonAnalysisCount').textContent = items.length ? `· ${items.length}개 수업` : '';
      if (lessonBarChart) { lessonBarChart.destroy(); lessonBarChart = null; }
      if (!items.length) {
        empty.style.display = 'block'; wrap.style.display = 'none';
        renderAnalyticsInsightInto('#lessonAnalysisInsight', 'lesson', { completionRate: 0 });
        return;
      }
      empty.style.display = 'none'; wrap.style.display = 'block';
      wrap.style.height = Math.max(140, items.length * 36) + 'px';
      lessonBarChart = new Chart(document.getElementById('lessonBarChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: _barLabels(items, 'registered_at', 'title'),
          datasets: [{
            label: '이수율(%)',
            data: items.map(it => it.completion_rate || 0),
            backgroundColor: items.map(it => _rateColor(it.completion_rate)),
            borderRadius: 6,
            barThickness: 22,
          }]
        },
        options: {
          indexAxis: 'y', maintainAspectRatio: false, responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => {
              const it = items[ctx.dataIndex];
              const lines = [`이수율: ${it.completion_rate}% (${it.completed_count}/${it.total_members}명)`];
              if (it.avg_correct != null) lines.push(`평균 정답: ${it.avg_correct}문항`);
              lines.push('막대 클릭 → 명단 보기');
              return lines;
            }}}
          },
          scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { ticks: { font: { size: 12 } } } },
          onClick: (e, els) => { if (els.length) { const it = items[els[0].index]; openRosterModal('lessons', it.lesson_id, it.title, it); } },
          onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
        }
      });
      const avg = Math.round(items.reduce((s,it)=>s+(it.completion_rate||0),0) / items.length);
      renderAnalyticsInsightInto('#lessonAnalysisInsight', 'lesson', { completionRate: avg });
    }

    function renderHomeworkBar() {
      const items = _analyticsBarData.homework;
      const wrap = document.getElementById('homeworkBarWrap');
      const empty = document.getElementById('homeworkAnalysisEmpty');
      document.getElementById('homeworkAnalysisCount').textContent = items.length ? `· ${items.length}개 과제` : '';
      if (homeworkBarChart) { homeworkBarChart.destroy(); homeworkBarChart = null; }
      if (!items.length) {
        empty.style.display = 'block'; wrap.style.display = 'none';
        renderAnalyticsInsightInto('#homeworkAnalysisInsight', 'homework', { submitRate: 0, avgScore: 0 });
        return;
      }
      empty.style.display = 'none'; wrap.style.display = 'block';
      wrap.style.height = Math.max(140, items.length * 36) + 'px';
      homeworkBarChart = new Chart(document.getElementById('homeworkBarChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: _barLabels(items, 'registered_at', 'title'),
          datasets: [{
            label: '제출률(%)',
            data: items.map(it => it.submit_rate || 0),
            backgroundColor: items.map(it => _rateColor(it.submit_rate)),
            borderRadius: 6,
            barThickness: 22,
          }]
        },
        options: {
          indexAxis: 'y', maintainAspectRatio: false, responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: ctx => {
              const it = items[ctx.dataIndex];
              const lines = [`제출률: ${it.submit_rate}% (${it.submitted_count}/${it.total_members}명)`];
              if (it.avg_score != null) lines.push(`평균 점수: ${it.avg_score}점`);
              if (it.late_count) lines.push(`지각 ${it.late_count}건`);
              lines.push(`마감: ${(it.due_date||'').slice(0,10)}`);
              lines.push('막대 클릭 → 명단 보기');
              return lines;
            }}}
          },
          scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { ticks: { font: { size: 12 } } } },
          onClick: (e, els) => { if (els.length) { const it = items[els[0].index]; openRosterModal('homework', it.homework_id, it.title, it); } },
          onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
        }
      });
      const avgR = Math.round(items.reduce((s,it)=>s+(it.submit_rate||0),0) / items.length);
      const validScores = items.filter(it => it.avg_score != null);
      const avgS = validScores.length ? Math.round(validScores.reduce((s,it)=>s+it.avg_score,0) / validScores.length) : 0;
      renderAnalyticsInsightInto('#homeworkAnalysisInsight', 'homework', { submitRate: avgR, avgScore: avgS });
    }

    function renderExamBar() {
      const items = _analyticsBarData.exams;
      const wrap = document.getElementById('examBarWrap');
      const empty = document.getElementById('examAnalysisEmpty');
      document.getElementById('examAnalysisCount').textContent = items.length ? `· ${items.length}개 평가` : '';
      if (examBarChart) { examBarChart.destroy(); examBarChart = null; }
      if (!items.length) {
        empty.style.display = 'block'; wrap.style.display = 'none';
        renderAnalyticsInsightInto('#examAnalysisInsight', 'exam', { avgScore: 0, participateRate: 0 });
        return;
      }
      empty.style.display = 'none'; wrap.style.display = 'block';
      wrap.style.height = Math.max(140, items.length * 36) + 'px';
      // 막대(참여율) + 라인(정답률) 혼합
      examBarChart = new Chart(document.getElementById('examBarChart').getContext('2d'), {
        type: 'bar',
        data: {
          labels: _barLabels(items, 'registered_at', 'title'),
          datasets: [
            { label: '참여율(%)', data: items.map(it => it.participate_rate || 0), backgroundColor: items.map(it => _rateColor(it.participate_rate)), borderRadius: 6, barThickness: 22 },
            { label: '평균 정답률(%)', data: items.map(it => it.avg_correct_rate || 0), type: 'line', borderColor: '#dc2626', backgroundColor: '#dc2626', pointRadius: 4, pointHoverRadius: 6, borderWidth: 2, fill: false, xAxisID: 'x' }
          ]
        },
        options: {
          indexAxis: 'y', maintainAspectRatio: false, responsive: true,
          plugins: {
            legend: { display: true, position: 'bottom', labels: { font: { size: 13 }, padding: 12 } },
            tooltip: { callbacks: { label: ctx => {
              const it = items[ctx.dataIndex];
              if (ctx.datasetIndex === 0) return [`참여율: ${it.participate_rate}% (${it.submitted_count}/${it.total_members}명)`, `평균 점수: ${it.avg_score}점`, '막대 클릭 → 명단 보기'];
              return [`정답률: ${it.avg_correct_rate}%`];
            }}}
          },
          scales: { x: { min: 0, max: 100, ticks: { callback: v => v + '%' } }, y: { ticks: { font: { size: 12 } } } },
          onClick: (e, els) => { if (els.length && els[0].datasetIndex === 0) { const it = items[els[0].index]; openRosterModal('exams', it.exam_id, it.title, it); } },
          onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
        }
      });
      const avgR = Math.round(items.reduce((s,it)=>s+(it.participate_rate||0),0) / items.length);
      const avgS = Math.round(items.reduce((s,it)=>s+(it.avg_score||0),0) / items.length);
      renderAnalyticsInsightInto('#examAnalysisInsight', 'exam', { participateRate: avgR, avgScore: avgS });
    }

    // ===== 명단 모달 (수업·과제·평가 공통) =====
    async function openRosterModal(kind, id, title, hint) {
      const modal = document.getElementById('rosterModal');
      const kindLabel = kind === 'lessons' ? '수업 참여' : (kind === 'homework' ? '과제 제출' : '평가 응시');
      document.getElementById('rosterModalTitle').textContent = `${title} — ${kindLabel} 명단`;
      document.getElementById('rosterModalBody').innerHTML = '<div class="roster-empty" style="grid-column:1/-1">불러오는 중…</div>';
      modal.classList.add('active');
      try {
        const classId = _analyticsBarData.classId;
        const r = await fetch(`/api/class/${classId}/analytics/${kind}/${encodeURIComponent(id)}/roster`);
        const d = await r.json();
        if (!d || !d.success) {
          document.getElementById('rosterModalBody').innerHTML = '<div class="roster-empty" style="grid-column:1/-1">명단을 불러오지 못했습니다.</div>';
          return;
        }
        _renderRoster(kind, d);
      } catch(e) {
        document.getElementById('rosterModalBody').innerHTML = '<div class="roster-empty" style="grid-column:1/-1">네트워크 오류</div>';
      }
    }
    function closeRosterModal() { document.getElementById('rosterModal').classList.remove('active'); }
    function _renderRoster(kind, d) {
      const present = d.participants || [];
      const absent = d.absentees || [];
      const renderP = (p) => {
        if (kind === 'lessons') {
          const meta = [
            p.correct_count != null ? `정답 ${p.correct_count}문항` : '',
            p.time_minutes != null ? `${p.time_minutes}분` : '',
            p.completed_at ? p.completed_at.slice(0, 16) : ''
          ].filter(Boolean).join(' · ') || '완료';
          return `<li><div class="name">${escHtml(p.name)}</div><div class="meta">${meta}</div></li>`;
        }
        if (kind === 'homework') {
          const lateTag = p.late ? '<span class="late">지각</span>' : '정시';
          const meta = [
            p.graded ? `채점 완료 · ${p.score ?? '-'}점` : '미채점',
            lateTag,
            p.submitted_at ? p.submitted_at.slice(0, 16) : ''
          ].filter(Boolean).join(' · ');
          return `<li><div class="name">${escHtml(p.name)}</div><div class="meta">${meta}</div></li>`;
        }
        if (kind === 'exams') {
          const meta = [
            `${p.score ?? 0}점`,
            p.rank ? `${p.rank}등` : '',
            (p.correct_count != null && p.total_count != null) ? `${p.correct_count}/${p.total_count}문항` : '',
            p.time_minutes != null ? `${p.time_minutes}분` : ''
          ].filter(Boolean).join(' · ');
          return `<li><div class="name">${escHtml(p.name)}</div><div class="meta">${meta}</div></li>`;
        }
        return `<li><div class="name">${escHtml(p.name)}</div></li>`;
      };
      document.getElementById('rosterModalBody').innerHTML = `
        <div class="roster-list">
          <h4><i class="fas fa-user-check" style="color:var(--success)"></i> 참여 <span class="roster-badge">${present.length}명</span></h4>
          <ul>${present.length ? present.map(renderP).join('') : '<div class="roster-empty">참여자가 없습니다.</div>'}</ul>
        </div>
        <div class="roster-list absentees">
          <h4><i class="fas fa-user-times" style="color:var(--gray-500)"></i> 미참여 <span class="roster-badge">${absent.length}명</span></h4>
          <ul>${absent.length ? absent.map(p => `<li><div class="name">${escHtml(p.name)}</div></li>`).join('') : '<div class="roster-empty">미참여자가 없습니다.</div>'}</ul>
        </div>
      `;
    }

    // ===== P1: 과제 제출시간 분포 =====
    async function loadHomeworkSubmitTime(hwId) {
      const body = document.getElementById('homeworkSubmitTimeBody');
      if (!hwId) { body.innerHTML = '과제를 선택하면 마감 기준 제출 시간 분포가 표시됩니다.'; return; }
      const classId = _analyticsBarData.classId;
      body.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 불러오는 중…';
      try {
        const r = await fetch(`/api/class/${classId}/analytics/homework/${encodeURIComponent(hwId)}/submit-time-distribution`);
        const d = await r.json();
        if (!d.success) { body.innerHTML = '데이터를 불러오지 못했습니다.'; return; }
        const colors = ['#10b981','#2563eb','#f59e0b','#ef4444'];
        const total = d.totalSubmitted || 0;
        const max = Math.max(1, ...d.buckets.map(b => b.count));
        body.innerHTML = `
          <div style="text-align:left">
            <div style="margin-bottom:14px;font-size:14px;color:var(--gray-700)">총 제출 <strong style="color:var(--gray-900)">${total}건</strong> 기준 마감 시점 분포</div>
            ${d.buckets.map((b, i) => `
              <div style="display:grid;grid-template-columns:130px 1fr 90px;gap:12px;align-items:center;margin-bottom:8px">
                <div style="font-size:14px;color:var(--gray-700);font-weight:600">${escHtml(b.label)}</div>
                <div style="background:#fff;border-radius:6px;height:24px;position:relative;border:1px solid var(--gray-200);overflow:hidden">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${b.count ? (b.count/max*100) : 0}%;background:${colors[i]};border-radius:6px 0 0 6px;transition:width 0.3s"></div>
                </div>
                <div style="font-size:14px;font-weight:700;color:${colors[i]};text-align:right">${b.count}건 (${b.ratio}%)</div>
              </div>
            `).join('')}
            <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-200);font-size:13px;color:var(--gray-600)">
              ${(d.buckets[3]?.count || 0) > 0 ? `⚠️ 지각 제출 ${d.buckets[3].count}건. 마감 관리가 필요합니다.` :
                (d.buckets[2]?.count > total/2 ? '📊 마감 직전 제출이 많습니다. 학생들의 제출 패턴 개선을 권장합니다.' :
                '✅ 학생들이 마감 전 여유 있게 제출하고 있습니다.')}
            </div>
          </div>`;
      } catch(e) { body.innerHTML = '네트워크 오류'; }
    }

    // ===== P1: 평가지별 상세 분석 (점수 분포 + 난이도별 정답률 5단계 + 제일 많이 틀린 TOP) =====
    async function loadExamDetail(examId) {
      const body = document.getElementById('examDetailBody');
      if (!examId) { body.innerHTML = '평가지를 선택하면 점수 분포·난이도별 정답률·제일 많이 틀린 문항이 표시됩니다.'; return; }
      const classId = _analyticsBarData.classId;
      body.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 불러오는 중…';
      try {
        const [dist, qs, wq] = await Promise.all([
          fetch(`/api/class/${classId}/analytics/exams/${encodeURIComponent(examId)}/distribution`).then(r=>r.json()).catch(()=>null),
          fetch(`/api/class/${classId}/analytics/exams/${encodeURIComponent(examId)}/questions`).then(r=>r.json()).catch(()=>null),
          fetch(`/api/class/${classId}/analytics/exams/${encodeURIComponent(examId)}/wrong-questions?limit=5`).then(r=>r.json()).catch(()=>null)
        ]);
        const examTitle = _analyticsBarData.exams.find(e => String(e.exam_id) === String(examId))?.title || '평가';
        const bucketColors = ['#ef4444','#f59e0b','#eab308','#2563eb','#10b981'];
        // REWORK 5: 점수 분포 구간 클릭 시 명단 모달
        window._lastExamBuckets = (dist && dist.success) ? dist.buckets : [];
        const distHtml = (dist && dist.success) ? `
          <div style="background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px">
            <h5 style="margin:0 0 12px;font-size:15px;font-weight:700"><i class="fas fa-chart-bar" style="color:#2563eb"></i> 점수별 응시자 분포 (5단계 구간) <span style="font-weight:500;color:var(--gray-500);font-size:12px">— 구간 클릭 시 명단 모달</span></h5>
            <div>${dist.buckets.map((b, i) => {
              const max = Math.max(1, ...dist.buckets.map(x=>x.count));
              const clickable = b.count > 0;
              return `<div onclick="${clickable?`openBucketMembersModal(${i})`:''}" style="display:grid;grid-template-columns:90px 1fr 80px;gap:12px;align-items:center;margin-bottom:6px;padding:6px 8px;border-radius:6px;${clickable?'cursor:pointer;transition:background 0.15s':'opacity:0.6'}" ${clickable?'onmouseenter="this.style.background=\'#f3f4f6\'" onmouseleave="this.style.background=\'transparent\'"':''}>
                <div style="font-size:13px;color:var(--gray-700);font-weight:600">${b.label}</div>
                <div style="background:var(--gray-100);border-radius:6px;height:20px;position:relative;overflow:hidden">
                  <div style="position:absolute;left:0;top:0;bottom:0;width:${b.count ? (b.count/max*100) : 0}%;background:${bucketColors[i]};border-radius:6px 0 0 6px"></div>
                </div>
                <div style="font-size:13px;font-weight:700;color:${bucketColors[i]};text-align:right">${b.count}명</div>
              </div>`;
            }).join('')}</div>
            <div style="margin-top:10px;font-size:13px;color:var(--gray-600)">총 응시 <strong>${(dist.scores||[]).length}명</strong></div>
          </div>` : '';
        // 난이도 5단계 색띠 (RFP) — 카드 클릭 시 해당 난이도 문항 목록 모달
        window._lastExamQuestions = (qs && qs.success) ? (qs.questions || []) : [];
        let difficultyHtml = '';
        if (qs && qs.success && qs.difficultyGroups) {
          const order = ['veryeasy','easy','medium','hard','veryhard'];
          const labels = { veryeasy:'매우 쉬움', easy:'쉬움', medium:'보통', hard:'어려움', veryhard:'매우 어려움' };
          const colors = { veryeasy:'#10b981', easy:'#2563eb', medium:'#eab308', hard:'#f59e0b', veryhard:'#ef4444' };
          difficultyHtml = `
            <div style="background:#fff;border-radius:10px;padding:16px 18px;margin-bottom:14px">
              <h5 style="margin:0 0 12px;font-size:15px;font-weight:700"><i class="fas fa-layer-group" style="color:#8b5cf6"></i> 문항 난이도별 정답률 <span style="font-weight:500;color:var(--gray-500);font-size:12px">— 카드 클릭 시 문항 목록</span></h5>
              <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px">
                ${order.map(k => {
                  const g = qs.difficultyGroups[k] || { count: 0, avg_correct_rate: 0 };
                  const c = colors[k];
                  const width = Math.max(8, g.avg_correct_rate);
                  const clickable = g.count > 0;
                  return `<div onclick="${clickable?`openDifficultyQuestionsModal('${k}','${labels[k]}','${c}')`:''}" style="text-align:center;background:${c}0d;border-radius:8px;padding:10px;border-top:3px solid ${c};${clickable?'cursor:pointer;transition:transform 0.15s,box-shadow 0.15s':'opacity:0.6'}" ${clickable?`onmouseenter="this.style.transform=\'translateY(-2px)\';this.style.boxShadow=\'0 4px 8px ${c}33\'" onmouseleave="this.style.transform=\'translateY(0)\';this.style.boxShadow=\'none\'"`:''}>
                    <div style="font-size:13px;font-weight:700;color:${c};margin-bottom:4px">${labels[k]}</div>
                    <div style="font-size:14px;font-weight:600;color:var(--gray-800)">${g.count}문항</div>
                    <div style="height:6px;background:${c}1a;border-radius:3px;margin:6px 0;overflow:hidden"><div style="height:100%;width:${width}%;background:${c}"></div></div>
                    <div style="font-size:18px;font-weight:800;color:${c}">${g.avg_correct_rate}%</div>
                  </div>`;
                }).join('')}
              </div>
              <div style="margin-top:10px;text-align:right"><button type="button" onclick="openAllQuestionsModal()" style="padding:6px 14px;border-radius:6px;border:1.5px solid var(--gray-200);background:#fff;color:var(--gray-700);font-size:13px;font-weight:600;cursor:pointer"><i class="fas fa-list"></i> 전체 문항 목록 보기</button></div>
            </div>`;
        }
        // 제일 많이 틀린 문항 — 행 클릭 시 문항 뷰어 모달
        let wrongHtml = '';
        if (wq && wq.success && wq.items && wq.items.length) {
          wrongHtml = `
            <div style="background:#fff;border-radius:10px;padding:16px 18px">
              <h5 style="margin:0 0 12px;font-size:15px;font-weight:700"><i class="fas fa-exclamation-triangle" style="color:#ef4444"></i> 제일 많이 틀린 문항 TOP ${wq.items.length} <span style="font-weight:500;color:var(--gray-500);font-size:12px">— 행 클릭 시 문항 뷰어</span></h5>
              <table style="width:100%;border-collapse:collapse;font-size:14px">
                <thead><tr style="background:var(--gray-50)"><th style="padding:8px;text-align:center;width:50px">번호</th><th style="padding:8px;text-align:left">문항</th><th style="padding:8px;text-align:right;width:90px">정답률</th><th style="padding:8px;text-align:right;width:80px">오답수</th></tr></thead>
                <tbody>${wq.items.map(it => `<tr onclick="openQuestionViewerModal(${it.question_no})" style="border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background 0.15s" onmouseenter="this.style.background='#fef2f2'" onmouseleave="this.style.background='transparent'">
                  <td style="padding:8px;text-align:center;font-weight:600">${it.question_no}</td>
                  <td style="padding:8px">${escHtml((it.stem||'').replace(/\s+/g,' ').slice(0,80))}${(it.stem||'').length>80?'…':''}</td>
                  <td style="padding:8px;text-align:right;font-weight:700;color:${it.correct_rate>=50?'#2563eb':'#ef4444'}">${it.correct_rate}%</td>
                  <td style="padding:8px;text-align:right">${it.wrong_count}건</td>
                </tr>`).join('')}</tbody>
              </table>
            </div>`;
        }
        body.innerHTML = `<div style="text-align:left"><div style="margin-bottom:14px;font-size:14px;color:var(--gray-700)"><strong style="color:var(--gray-900)">${escHtml(examTitle)}</strong> 상세 분석</div>${distHtml}${difficultyHtml}${wrongHtml}</div>`;
      } catch(e) { body.innerHTML = '네트워크 오류'; }
    }

    // ===== REWORK 5/6/7: 평가 점수분포 명단 모달 + 난이도 문항 목록 + 문항 뷰어 =====
    function openBucketMembersModal(bucketIdx) {
      const b = (window._lastExamBuckets || [])[bucketIdx];
      if (!b) return;
      const colors = ['#ef4444','#f59e0b','#eab308','#2563eb','#10b981'];
      const members = b.members || [];
      const body = `
        <div style="margin-bottom:10px;font-size:14px;color:var(--gray-700)">${b.label} 구간 — <strong style="color:${colors[bucketIdx]}">${members.length}명</strong></div>
        ${members.length ? `<table style="width:100%;border-collapse:collapse;font-size:14px">
          <thead><tr style="background:var(--gray-50)"><th style="padding:8px;text-align:left">학생</th><th style="padding:8px;text-align:right">점수</th><th style="padding:8px;text-align:right">소요시간</th><th style="padding:8px;text-align:right">등위</th></tr></thead>
          <tbody>${members.map(m => `<tr style="border-bottom:1px solid var(--gray-100)">
            <td style="padding:8px;font-weight:600">${escHtml(m.name||'-')}</td>
            <td style="padding:8px;text-align:right;font-weight:700;color:${colors[bucketIdx]}">${m.score ?? '-'}점</td>
            <td style="padding:8px;text-align:right">${m.time_minutes != null ? m.time_minutes + '분' : '-'}</td>
            <td style="padding:8px;text-align:right">${m.rank ? m.rank + '등' : '-'}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="roster-empty">해당 구간 응시자가 없습니다.</div>'}`;
      _openInfoModal(`${b.label} 구간 응시자 명단`, body);
    }

    function openDifficultyQuestionsModal(diffKey, diffLabel, color) {
      const all = window._lastExamQuestions || [];
      const items = all.filter(q => q.difficulty === diffKey);
      const body = items.length ? `
        <div style="margin-bottom:10px;font-size:14px;color:var(--gray-700)">난이도 <strong style="color:${color}">${diffLabel}</strong> — ${items.length}문항 <span style="color:var(--gray-500);font-size:12px">(행 클릭 시 문항 뷰어)</span></div>
        <table style="width:100%;border-collapse:collapse;font-size:14px">
          <thead><tr style="background:var(--gray-50)"><th style="padding:8px;text-align:center;width:50px">번호</th><th style="padding:8px;text-align:left">문항</th><th style="padding:8px;text-align:right;width:100px">평균 정답률</th><th style="padding:8px;text-align:right;width:90px">풀이시간</th></tr></thead>
          <tbody>${items.map(it => `<tr onclick="openQuestionViewerModal(${it.question_no})" style="border-bottom:1px solid var(--gray-100);cursor:pointer;transition:background 0.15s" onmouseenter="this.style.background='#f9fafb'" onmouseleave="this.style.background='transparent'">
            <td style="padding:8px;text-align:center;font-weight:600">${it.question_no}</td>
            <td style="padding:8px">${escHtml((it.stem||'').replace(/\s+/g,' ').slice(0,80))}${(it.stem||'').length>80?'…':''}</td>
            <td style="padding:8px;text-align:right;font-weight:700;color:${color}">${it.correct_rate}%</td>
            <td style="padding:8px;text-align:right">${it.avg_time_seconds != null ? Math.round(it.avg_time_seconds) + '초' : '-'}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="roster-empty">해당 난이도 문항이 없습니다.</div>';
      _openInfoModal(`난이도: ${diffLabel}`, body);
    }

    function openAllQuestionsModal() {
      const items = window._lastExamQuestions || [];
      const diffLabels = { veryeasy:'매우 쉬움', easy:'쉬움', medium:'보통', hard:'어려움', veryhard:'매우 어려움' };
      const body = items.length ? `
        <div style="margin-bottom:10px;font-size:14px;color:var(--gray-700)">전체 문항 ${items.length}개 — <span style="color:var(--gray-500);font-size:12px">행 클릭 시 문항 뷰어, 정·오답 명단 포함</span></div>
        <table style="width:100%;border-collapse:collapse;font-size:14px">
          <thead><tr style="background:var(--gray-50)"><th style="padding:8px;text-align:center;width:50px">번호</th><th style="padding:8px;text-align:left">문항</th><th style="padding:8px;text-align:right;width:90px">정답률</th><th style="padding:8px;text-align:center;width:90px">난이도</th><th style="padding:8px;text-align:right;width:90px">정답/오답</th></tr></thead>
          <tbody>${items.map(it => `<tr onclick="openQuestionViewerModal(${it.question_no})" style="border-bottom:1px solid var(--gray-100);cursor:pointer" onmouseenter="this.style.background='#f9fafb'" onmouseleave="this.style.background='transparent'">
            <td style="padding:8px;text-align:center;font-weight:600">${it.question_no}</td>
            <td style="padding:8px">${escHtml((it.stem||'').replace(/\s+/g,' ').slice(0,80))}${(it.stem||'').length>80?'…':''}</td>
            <td style="padding:8px;text-align:right;font-weight:700">${it.correct_rate}%</td>
            <td style="padding:8px;text-align:center"><span style="padding:2px 10px;border-radius:99px;background:var(--gray-100);font-size:12px">${diffLabels[it.difficulty]||it.difficulty}</span></td>
            <td style="padding:8px;text-align:right">${it.correct_count}/${it.wrong_count}</td>
          </tr>`).join('')}</tbody>
        </table>` : '<div class="roster-empty">문항이 없습니다.</div>';
      _openInfoModal('전체 문항 목록', body);
    }

    function openQuestionViewerModal(questionNo) {
      const it = (window._lastExamQuestions || []).find(q => q.question_no === questionNo);
      if (!it) { _openInfoModal(`${questionNo}번 문항`, '<div class="roster-empty">문항 정보를 찾을 수 없습니다.</div>'); return; }
      const diffLabels = { veryeasy:'매우 쉬움', easy:'쉬움', medium:'보통', hard:'어려움', veryhard:'매우 어려움' };
      const diffColors = { veryeasy:'#10b981', easy:'#2563eb', medium:'#eab308', hard:'#f59e0b', veryhard:'#ef4444' };
      const dc = diffColors[it.difficulty] || '#64748b';
      const body = `
        <div style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span style="padding:3px 12px;border-radius:99px;background:${dc}1a;color:${dc};font-weight:700;font-size:13px">${diffLabels[it.difficulty]||it.difficulty}</span>
          <span style="font-size:13px;color:var(--gray-600)">정답률 <strong style="color:${it.correct_rate>=50?'#2563eb':'#ef4444'}">${it.correct_rate}%</strong></span>
          ${it.avg_time_seconds!=null?`<span style="font-size:13px;color:var(--gray-600)">평균 풀이 <strong>${Math.round(it.avg_time_seconds)}초</strong></span>`:''}
        </div>
        <div style="background:var(--gray-50);border-radius:8px;padding:14px 16px;margin-bottom:14px">
          <div style="font-size:13px;color:var(--gray-500);font-weight:600;margin-bottom:6px">${questionNo}번 문항</div>
          <div style="font-size:15px;line-height:1.7;color:var(--gray-800);white-space:pre-wrap">${escHtml(it.stem||'(문항 내용 없음)')}</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <div style="background:#f0fdf4;border-radius:8px;padding:12px 14px">
            <h5 style="margin:0 0 8px;font-size:14px;font-weight:700;color:#10b981"><i class="fas fa-check-circle"></i> 정답자 (${it.correct_count}명)</h5>
            ${(it.correct_users||[]).length ? `<ul style="list-style:none;padding:0;margin:0;font-size:13px">${it.correct_users.map(u=>`<li style="padding:4px 0">${escHtml(u.name||'-')}</li>`).join('')}</ul>` : '<div style="color:var(--gray-400);font-size:13px">없음</div>'}
          </div>
          <div style="background:#fef2f2;border-radius:8px;padding:12px 14px">
            <h5 style="margin:0 0 8px;font-size:14px;font-weight:700;color:#ef4444"><i class="fas fa-times-circle"></i> 오답자 (${it.wrong_count}명)</h5>
            ${(it.wrong_users||[]).length ? `<ul style="list-style:none;padding:0;margin:0;font-size:13px">${it.wrong_users.map(u=>`<li style="padding:4px 0">${escHtml(u.name||'-')}</li>`).join('')}</ul>` : '<div style="color:var(--gray-400);font-size:13px">없음</div>'}
          </div>
        </div>`;
      _openInfoModal(`${questionNo}번 문항 뷰어`, body);
    }

    // 평가/과제 분석 데이터 로드 후 드롭다운 채우기 (renderExamBar / renderHomeworkBar 호출 후)
    function _populateExamDetailPicker() {
      const sel = document.getElementById('examDetailPicker');
      if (!sel) return;
      const items = _analyticsBarData.exams || [];
      sel.innerHTML = '<option value="">평가지 선택…</option>' + items.map(it => `<option value="${escHtml(it.exam_id)}">${escHtml((it.title||'').slice(0,40))} (${(it.registered_at||'').slice(5,10)})</option>`).join('');
    }
    function _populateHomeworkSubmitTimePicker() {
      const sel = document.getElementById('homeworkSubmitTimePicker');
      if (!sel) return;
      const items = _analyticsBarData.homework || [];
      sel.innerHTML = '<option value="">과제 선택…</option>' + items.map(it => `<option value="${it.homework_id}">${escHtml((it.title||'').slice(0,40))} (마감 ${(it.due_date||'').slice(0,10)})</option>`).join('');
    }

    // ===== P1: 게시판 분석 (분석 대시보드 + 게시판별 활동 + 인기 게시글 TOP5 + 활발한 멤버 TOP5 + 설문 응답) =====
    async function loadBoardAnalytics(classId, startDate, endDate) {
      const root = document.getElementById('boardAnalyticsSection');
      if (!root) return;
      const qs = (startDate && endDate) ? `?startDate=${encodeURIComponent(startDate)}&endDate=${encodeURIComponent(endDate)}` : '';
      try {
        const [bd, tp, tm, sv] = await Promise.all([
          fetch(`/api/class/${classId}/analytics/board${qs}`).then(r=>r.json()).catch(()=>({summary:{},byBoard:[]})),
          fetch(`/api/class/${classId}/analytics/board/top-posts?limit=5${qs?'&'+qs.slice(1):''}`).then(r=>r.json()).catch(()=>({items:[]})),
          fetch(`/api/class/${classId}/analytics/board/top-members?limit=5${qs?'&'+qs.slice(1):''}`).then(r=>r.json()).catch(()=>({items:[]})),
          fetch(`/api/class/${classId}/analytics/surveys${qs}`).then(r=>r.json()).catch(()=>({items:[]})),
        ]);
        renderBoardAnalytics({ board: bd, posts: tp.items||[], members: tm.items||[], surveys: sv.items||[] }, classId);
      } catch(e) {
        root.innerHTML = '<div class="section-box"><div class="empty-state"><i class="fas fa-exclamation-circle"></i><h3>게시판 분석 로드 실패</h3></div></div>';
      }
    }

    function _boardKpiCard(value, label, color, icon, sub='') {
      return `<div style="background:#fff;border:1.5px solid ${color}33;border-left:4px solid ${color};border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px">
        <div style="width:42px;height:42px;border-radius:50%;background:${color}1a;display:flex;align-items:center;justify-content:center;color:${color};font-size:18px"><i class="${icon}"></i></div>
        <div style="flex:1;min-width:0">
          <div style="font-size:24px;font-weight:800;color:${color};line-height:1">${value}<span style="font-size:13px;color:var(--gray-500);font-weight:600;margin-left:4px">${sub}</span></div>
          <div style="font-size:13px;color:var(--gray-600);margin-top:2px">${label}</div>
        </div>
      </div>`;
    }

    function renderBoardAnalytics(d, classId) {
      const root = document.getElementById('boardAnalyticsSection');
      const s = d.board?.summary || {};
      const byBoard = d.board?.byBoard || [];
      const posts = d.posts || [];
      const members = d.members || [];
      const surveys = d.surveys || [];

      const dashHtml = `
        <div class="section-box">
          <div class="section-header"><h3 class="section-title"><i class="fas fa-chart-bar" style="color:#2563eb"></i> 게시판 분석 대시보드</h3></div>
          <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:6px">
            ${_boardKpiCard(s.totalPosts ?? 0, '총 게시글 수', '#2563eb', 'fas fa-file-alt')}
            ${_boardKpiCard(s.totalComments ?? 0, '총 댓글 수', '#8b5cf6', 'fas fa-comments')}
            ${_boardKpiCard(s.totalLikes ?? 0, '총 좋아요 수', '#ec4899', 'fas fa-heart')}
            ${_boardKpiCard(Math.round(Math.min(100, s.noticeReadRate ?? 0)), '알림장 확인률', '#f59e0b', 'fas fa-bell','%')}
            ${_boardKpiCard(Math.round(Math.min(100, s.surveyResponseRate ?? 0)), '설문 응답률', '#10b981', 'fas fa-poll','%')}
          </div>
          <div class="insight-box" style="margin-top:14px">
            <strong>📋 게시판 활동 분석</strong>
            ${(s.totalPosts ?? 0) === 0 ? '아직 게시글이 없습니다. 클래스 소통을 활성화해보세요.' :
              (s.surveyResponseRate >= 70 ? `설문 응답률 ${Math.round(s.surveyResponseRate)}% — 적극적인 소통이 이루어지고 있습니다.` :
              `게시글 ${s.totalPosts}건 · 댓글 ${s.totalComments}건 · 좋아요 ${s.totalLikes}건. 활동을 더욱 독려해보세요.`)}
          </div>
        </div>
      `;

      const byBoardHtml = `
        <div class="section-box">
          <div class="section-header"><h3 class="section-title"><i class="fas fa-th-list" style="color:#8b5cf6"></i> 게시판별 활동 현황</h3></div>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
            ${byBoard.map(b => {
              const colors = { notice:'#f59e0b', post:'#2563eb', survey:'#10b981' };
              const icons = { notice:'fas fa-bell', post:'fas fa-comments', survey:'fas fa-poll' };
              const c = colors[b.type] || '#64748b';
              return `<div style="background:#fff;border:1.5px solid ${c}33;border-radius:12px;padding:16px 18px">
                <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
                  <i class="${icons[b.type]||'fas fa-folder'}" style="color:${c};font-size:18px"></i>
                  <h4 style="margin:0;font-size:16px;font-weight:700;color:var(--gray-800)">${escHtml(b.label)}</h4>
                </div>
                <div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--gray-700)">
                  <div><div style="font-size:20px;font-weight:700;color:${c}">${b.post_count}</div><div style="font-size:12px;color:var(--gray-500)">게시글</div></div>
                  <div><div style="font-size:20px;font-weight:700;color:${c}">${b.comment_count}</div><div style="font-size:12px;color:var(--gray-500)">댓글</div></div>
                  <div><div style="font-size:20px;font-weight:700;color:${c}">${b.view_count}</div><div style="font-size:12px;color:var(--gray-500)">조회</div></div>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>
      `;

      const topPostsHtml = `
        <div class="section-box">
          <div class="section-header"><h3 class="section-title"><i class="fas fa-fire" style="color:#ef4444"></i> 인기 게시글 TOP 5</h3></div>
          ${posts.length === 0 ? '<div class="empty-state" style="padding:30px"><i class="fas fa-file"></i><p>게시글이 없습니다.</p></div>' : `
          <table style="width:100%;border-collapse:collapse;font-size:14px">
            <thead><tr style="background:var(--gray-50)">
              <th style="padding:10px;text-align:center;width:40px">#</th>
              <th style="padding:10px;text-align:left">제목</th>
              <th style="padding:10px;text-align:left;width:100px">작성자</th>
              <th style="padding:10px;text-align:right;width:80px">조회</th>
              <th style="padding:10px;text-align:right;width:80px">댓글</th>
              <th style="padding:10px;text-align:right;width:80px">좋아요</th>
              <th style="padding:10px;text-align:center;width:90px">유형</th>
            </tr></thead>
            <tbody>${posts.map((p, i) => `
              <tr style="border-bottom:1px solid var(--gray-100);cursor:pointer" onclick="openPostDetailModal(${classId}, '${p.board_type}', ${p.post_id})">
                <td style="padding:10px;text-align:center;font-weight:700;color:var(--primary)">${i+1}</td>
                <td style="padding:10px;font-weight:600">${escHtml(p.title)}</td>
                <td style="padding:10px">${escHtml(p.author_name||'-')}</td>
                <td style="padding:10px;text-align:right">${p.view_count||0}</td>
                <td style="padding:10px;text-align:right">${p.comment_count||0}</td>
                <td style="padding:10px;text-align:right">${p.like_count||0}</td>
                <td style="padding:10px;text-align:center"><span style="padding:2px 10px;border-radius:99px;background:${p.board_type==='notice'?'#fef3c7':'#dbeafe'};color:${p.board_type==='notice'?'#92400e':'#1e40af'};font-size:12px;font-weight:600">${p.board_type==='notice'?'알림장':'게시글'}</span></td>
              </tr>`).join('')}</tbody>
          </table>`}
        </div>
      `;

      const topMembersHtml = `
        <div class="section-box">
          <div class="section-header"><h3 class="section-title"><i class="fas fa-star" style="color:#f59e0b"></i> 활발한 멤버 TOP 5</h3></div>
          ${members.length === 0 ? '<div class="empty-state" style="padding:30px"><i class="fas fa-users"></i><p>활동 멤버가 없습니다.</p></div>' : `
          <table style="width:100%;border-collapse:collapse;font-size:14px">
            <thead><tr style="background:var(--gray-50)">
              <th style="padding:10px;text-align:center;width:40px">#</th>
              <th style="padding:10px;text-align:left">멤버</th>
              <th style="padding:10px;text-align:right;width:100px">게시글</th>
              <th style="padding:10px;text-align:right;width:100px">댓글</th>
              <th style="padding:10px;text-align:right;width:100px">합계</th>
            </tr></thead>
            <tbody>${members.map((m, i) => `
              <tr style="border-bottom:1px solid var(--gray-100);cursor:pointer" onclick="openMemberActivityModal(${classId}, ${m.user_id}, '${escHtml(m.name).replace(/'/g,'\\\'')}')">
                <td style="padding:10px;text-align:center;font-weight:700;color:var(--primary)">${i+1}</td>
                <td style="padding:10px;font-weight:600">${escHtml(m.name)}</td>
                <td style="padding:10px;text-align:right">${m.post_count||0}</td>
                <td style="padding:10px;text-align:right">${m.comment_count||0}</td>
                <td style="padding:10px;text-align:right;font-weight:700;color:var(--primary)">${m.total_activity||0}</td>
              </tr>`).join('')}</tbody>
          </table>`}
        </div>
      `;

      const surveysHtml = `
        <div class="section-box">
          <div class="section-header"><h3 class="section-title"><i class="fas fa-poll-h" style="color:#10b981"></i> 설문 응답 현황</h3></div>
          ${surveys.length === 0 ? '<div class="empty-state" style="padding:30px"><i class="fas fa-poll"></i><p>설문이 없습니다.</p></div>' : `
          <table style="width:100%;border-collapse:collapse;font-size:14px">
            <thead><tr style="background:var(--gray-50)">
              <th style="padding:10px;text-align:left">설문명</th>
              <th style="padding:10px;text-align:right;width:120px">응답</th>
              <th style="padding:10px;text-align:right;width:140px">응답률</th>
              <th style="padding:10px;text-align:center;width:100px">상태</th>
              <th style="padding:10px;text-align:right;width:120px">마감일</th>
            </tr></thead>
            <tbody>${surveys.map(sv => {
              const rate = Math.round(Math.min(100, sv.response_rate || 0));
              const rateColor = rate >= 70 ? '#10b981' : (rate >= 40 ? '#f59e0b' : '#ef4444');
              const statusMap = { active:{c:'#10b981',l:'진행중'}, closed:{c:'#6b7280',l:'완료'}, draft:{c:'#f59e0b',l:'준비'}};
              const st = statusMap[sv.status] || { c: '#64748b', l: sv.status||'-' };
              return `<tr style="border-bottom:1px solid var(--gray-100);cursor:pointer" onclick="openSurveyDetailModal(${classId}, ${sv.survey_id}, '${escHtml(sv.title).replace(/'/g,'\\\'')}')">
                <td style="padding:10px;font-weight:600">${escHtml(sv.title)}</td>
                <td style="padding:10px;text-align:right">${sv.response_count||0} / ${sv.total_members||0}</td>
                <td style="padding:10px;text-align:right"><span style="font-weight:700;color:${rateColor}">${rate}%</span></td>
                <td style="padding:10px;text-align:center"><span style="padding:2px 12px;border-radius:99px;background:${st.c}1a;color:${st.c};font-weight:700;font-size:12px">${st.l}</span></td>
                <td style="padding:10px;text-align:right;font-size:13px;color:var(--gray-500)">${sv.deadline ? sv.deadline.slice(0,10) : '-'}</td>
              </tr>`;
            }).join('')}</tbody>
          </table>`}
        </div>
      `;

      root.innerHTML = dashHtml + byBoardHtml + topPostsHtml + topMembersHtml + surveysHtml;
    }

    // ===== P1: 페이지 내 모달 (인기 게시글/멤버 활동/설문 결과) — RFP 명세 "모달" 요구 충족 =====
    function _openInfoModal(title, bodyHtml, footerHtml) {
      let modal = document.getElementById('infoDetailModal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'infoDetailModal';
        modal.className = 'roster-modal-overlay';
        modal.style.zIndex = '10002';
        modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };
        modal.innerHTML = `
          <div class="roster-modal" style="max-width:840px">
            <div class="roster-modal-header">
              <div class="roster-modal-title" id="infoDetailTitle">상세</div>
              <button type="button" class="roster-modal-close" aria-label="닫기" onclick="document.getElementById('infoDetailModal').classList.remove('active')"><i class="fas fa-times"></i></button>
            </div>
            <div id="infoDetailBody" style="flex:1;overflow:auto;padding:20px 22px"></div>
            <div id="infoDetailFooter" style="padding:14px 22px;border-top:1px solid var(--gray-200);text-align:right;display:none"></div>
          </div>`;
        document.body.appendChild(modal);
      }
      document.getElementById('infoDetailTitle').textContent = title;
      document.getElementById('infoDetailBody').innerHTML = bodyHtml;
      const f = document.getElementById('infoDetailFooter');
      if (footerHtml) { f.innerHTML = footerHtml; f.style.display = 'block'; } else { f.style.display = 'none'; }
      modal.classList.add('active');
    }

    async function openPostDetailModal(classId, boardType, postId) {
      const labelMap = { notice: '알림장', post: '게시글' };
      _openInfoModal(`${labelMap[boardType]||'게시글'} #${postId}`, '<div class="roster-empty">불러오는 중…</div>');
      try {
        const url = boardType === 'notice' ? `/api/notice/${classId}/${postId}` : `/api/board/${classId}/${postId}`;
        const r = await fetch(url);
        const d = await r.json();

    async function openSurveyDetailModal(classId, surveyId, title) {
      _openInfoModal(`설문: ${escHtml(title)}`, '<div class="roster-empty">불러오는 중…</div>');
      try {
        const r = await fetch(`/api/survey/${classId}/${surveyId}`);
        const d = await r.json();
        if (!d || (d.success === false)) { document.getElementById('infoDetailBody').innerHTML = '<div class="roster-empty">설문 결과를 불러오지 못했습니다.</div>'; return; }
        const sv = d.survey || d.item || d;
        const responses = d.responses || [];
        const total = responses.length;
        // questions는 JSON 문자열로 오는 경우 파싱
        let questions = sv.questions || [];
        if (typeof questions === 'string') { try { questions = JSON.parse(questions); } catch(_) { questions = []; } }
        // 각 question별 option count 집계 — 답변은 3가지 포맷 모두 지원:
        // (a) Array [{questionId, answer}, ...]  (실제 DB 포맷)
        // (b) Object { qid: answer, ... }
        // (c) Object { '0': answer, ... } (0-based 인덱스)
        questions.forEach((q, qi) => {
          const counts = (q.options || []).map(() => 0);
          responses.forEach(resp => {
            let ans = resp.answers;
            if (typeof ans === 'string') { try { ans = JSON.parse(ans); } catch(_) { ans = null; } }
            if (!ans) return;
            let a = null;
            if (Array.isArray(ans)) {
              const found = ans.find(x => x && (x.questionId === q.id || x.question_id === q.id || x.qid === q.id));
              a = found ? (found.answer ?? found.value) : null;
            } else if (typeof ans === 'object') {
              a = ans[q.id] ?? ans[String(q.id)] ?? ans['q'+(qi+1)] ?? ans[qi] ?? ans[String(qi)];
              if (a && typeof a === 'object') a = a.answer ?? a.value ?? a.text;
            }
            if (a == null) return;
            if (typeof a === 'number' && a >= 0 && a < counts.length) counts[a]++;
            else if (typeof a === 'string') {
              const idx = (q.options||[]).findIndex(opt => opt === a || (typeof opt === 'object' && (opt.text === a || opt.label === a)));
              if (idx >= 0) counts[idx]++;
            }
          });
          q.counts = counts;
        });
        const body = `
          <div style="margin-bottom:12px;font-size:14px;color:var(--gray-700)">${escHtml(sv.description||'')}</div>
          <div style="margin-bottom:14px;font-size:14px;color:var(--gray-700)">총 응답 <strong style="color:var(--primary)">${total}건</strong> · 상태 <strong>${escHtml(sv.status||'-')}</strong></div>
          ${questions.length ? questions.map((q, qi) => {
            const opts = q.options || q.choices || [];
            return `<div style="margin-bottom:14px;padding:12px;background:var(--gray-50);border-radius:8px">
              <div style="font-weight:700;margin-bottom:8px;font-size:14px">Q${qi+1}. ${escHtml(q.text||q.question||q.question_text||'')}</div>
              ${opts.length ? opts.map((opt, oi) => {
                const cnt = (q.counts || q.tally || q.option_counts || [])[oi] || 0;
                const pct = total ? Math.round(cnt/total*100) : 0;
                const label = typeof opt === 'string' ? opt : (opt.text || opt.label || `옵션 ${oi+1}`);
                return `<div style="display:grid;grid-template-columns:1fr 90px 70px;gap:10px;align-items:center;margin-bottom:4px;font-size:13px">
                  <div>${escHtml(label)}</div>
                  <div style="background:#fff;border-radius:4px;height:14px;border:1px solid var(--gray-200);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--primary)"></div></div>
                  <div style="text-align:right;font-weight:600;color:var(--primary)">${cnt}명 (${pct}%)</div>
                </div>`;
              }).join('') : '<div style="font-size:13px;color:var(--gray-500)">(주관식 응답 — 설문 페이지에서 확인)</div>'}
            </div>`;
          }).join('') : '<div class="roster-empty">문항 정보가 없습니다.</div>'}`;
        document.getElementById('infoDetailBody').innerHTML = body;
        document.getElementById('infoDetailFooter').innerHTML = `<a href="/survey/index.html?survey_id=${surveyId}&class_id=${classId}" target="_blank" style="color:var(--primary);font-size:14px;font-weight:600;text-decoration:none"><i class="fas fa-external-link-alt"></i> 설문 페이지 열기</a>`;
        document.getElementById('infoDetailFooter').style.display = 'block';
      } catch(e) { document.getElementById('infoDetailBody').innerHTML = '<div class="roster-empty">네트워크 오류</div>'; }
    }

    // ===== P0-2: KPI 카드 렌더 =====
    function renderKpiCard(key, label, icon, target) {
      // Backend summary 미배포 상태에서는 모두 --% 로 표시. data-kpi-key 로 향후 바인딩.
      return `
        <div class="analytics-kpi-card" data-kpi-key="${key}" data-target="${target}" onclick="onKpiCardClick(this)">
          <div class="kpi-label"><i class="${icon}" style="color:var(--primary);"></i> ${label}</div>
          <div class="kpi-value is-empty" id="kpi${key.charAt(0).toUpperCase()+key.slice(1)}">--%</div>
          <div class="kpi-bar-bg"><div class="kpi-bar-fill" style="width:0%;background:var(--gray-300);"></div></div>
          <div class="kpi-hint">데이터 준비 중</div>
        </div>
      `;
    }
    function getKpiColor(rate) {
      if (rate >= 80) return 'var(--success)';
      if (rate >= 50) return 'var(--primary)';
      if (rate > 0) return 'var(--warning)';
      return 'var(--gray-400)';
    }
    function bindKpiValue(key, rate, hint) {
      const valEl = document.getElementById('kpi' + key.charAt(0).toUpperCase() + key.slice(1));
      if (!valEl) return;
      const card = valEl.closest('.analytics-kpi-card');
      if (rate == null || isNaN(rate)) {
        valEl.textContent = '--%';
        valEl.classList.add('is-empty');
        if (card) {
          const bar = card.querySelector('.kpi-bar-fill');
          if (bar) { bar.style.width = '0%'; bar.style.background = 'var(--gray-300)'; }
          const hintEl = card.querySelector('.kpi-hint');
          if (hintEl) hintEl.textContent = '데이터 준비 중';
        }
        return;
      }
      const r = Math.round(Number(rate));
      valEl.textContent = r + '%';
      valEl.classList.remove('is-empty');
      if (card) {
        const bar = card.querySelector('.kpi-bar-fill');
        if (bar) { bar.style.width = r + '%'; bar.style.background = getKpiColor(r); }
        const hintEl = card.querySelector('.kpi-hint');
        if (hintEl) hintEl.textContent = hint || '';
      }
    }

    // ===== P0-3: 대시 카드 / KPI 카드 클릭 → 스크롤 + focus highlight =====
    function scrollToTargetWithHighlight(targetSel) {
      if (!targetSel) return;
      // 탭 셀렉터인 경우 해당 탭으로 먼저 전환
      const tabId = targetSel.startsWith('#tab') ? targetSel.slice(1) : null;
      if (tabId) {
        const tabBtn = document.querySelector(`.tab-btn[onclick*="'${tabId.replace('tab','').toLowerCase()}'"]`);
        // tab 식별: id가 tabStudents 면 'students' 인자로 호출됨
        const tabKey = tabId.replace(/^tab/, '');
        const tabKeyLower = tabKey.charAt(0).toLowerCase() + tabKey.slice(1);
        const btn = Array.from(document.querySelectorAll('.tabs-header .tab-btn')).find(b => {
          const oc = b.getAttribute('onclick') || '';
          return oc.includes(`'${tabKeyLower}'`);
        });
        if (btn && !btn.classList.contains('active')) {
          switchAnalyticsTab(btn, tabKeyLower);
        }
      }
      // 약간의 지연 후 스크롤 (탭 전환 후 DOM 보임 보장)
      setTimeout(() => {
        const el = document.querySelector(targetSel);
        if (!el) return;
        const sectionEl = el.closest('.section-box') || el;
        sectionEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        sectionEl.classList.add('analytics-focus-highlight');
        setTimeout(() => sectionEl.classList.remove('analytics-focus-highlight'), 1400);
      }, tabId ? 120 : 0);
    }
    function onDashCardClick(card) {
      const t = card.getAttribute('data-target');
      scrollToTargetWithHighlight(t);
    }
    function onKpiCardClick(card) {
      const t = card.getAttribute('data-target');
      scrollToTargetWithHighlight(t);

    // ===== P0-5: 표시 행 제한 (3·5·10·전체) + localStorage 저장 =====
    const _rowLimits = {};
    const _rowLimitSelectIds = { students: 'studentsRowLimit' };
    function setRowLimit(tableKey, value) {
      _rowLimits[tableKey] = value;
      try { localStorage.setItem('analytics:limit:' + tableKey, value); } catch (e) {}
      // select 자체도 sync
      const selId = _rowLimitSelectIds[tableKey];
      if (selId) {
        const sel = document.getElementById(selId);
        if (sel && sel.value !== value) sel.value = value;
      }
      applyTableLimit(tableKey);
    }
    function getRowLimit(tableKey, fallback) {
      if (_rowLimits[tableKey]) return _rowLimits[tableKey];
      try {
        const v = localStorage.getItem('analytics:limit:' + tableKey);
        if (v) return v;
      } catch (e) {}
      return fallback || 'all';
    }
    function applyTableLimit(tableKey) {
      const wrap = document.querySelector(`[data-table="${tableKey}"]`);
      if (!wrap) return;
      const tbody = wrap.querySelector('tbody');
      if (!tbody) return;
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const limit = getRowLimit(tableKey);
      if (limit === 'all') { rows.forEach(r => r.style.display = ''); return; }
      const n = Number(limit);
      rows.forEach((r, i) => r.style.display = (i < n) ? '' : 'none');
    }
    function restoreRowLimitSelector(tableKey, selectId) {
      const sel = document.getElementById(selectId);
      if (!sel) return;
      const v = getRowLimit(tableKey);
      sel.value = v;
    }

    // ===== P0-6: 학생 테이블 정렬 =====
    let _studentTableState = { rows: [], sortKey: null, sortDir: 'desc', avgActivity: 0 };
    function setStudentTableSort(key) {
      if (_studentTableState.sortKey === key) {
        _studentTableState.sortDir = _studentTableState.sortDir === 'desc' ? 'asc' : 'desc';
      } else {
        _studentTableState.sortKey = key;
        _studentTableState.sortDir = (key === 'display_name') ? 'asc' : 'desc';
      }
      // header 표시 갱신
      document.querySelectorAll('#studentsTableEl .analytics-sortable-th').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        const ph = th.querySelector('.sort-arrow-placeholder');
        if (ph) ph.style.display = '';
        if (th.getAttribute('data-sort') === key) {
          th.classList.add(_studentTableState.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
          if (ph) ph.style.display = 'none';
        }
      });
      renderStudentTableSorted();
    }
    function computeStudentParticipation(s, maxActivity) {
      return maxActivity > 0 ? Math.round((s.activityCount / maxActivity) * 100) : 0;
    }
    function computeStudentLevel(s, avgActivity) {
      if (s.activityCount >= avgActivity * 1.5) return { label: '우수', rank: 3 };
      if (s.activityCount >= avgActivity * 0.5) return { label: '보통', rank: 2 };
      return { label: '관심', rank: 1 };
    }
    function renderStudentTableSorted() {
      const { rows, sortKey, sortDir, avgActivity } = _studentTableState;
      let arr = [...rows];
      if (sortKey) {
        const maxActivity = Math.max(...arr.map(s => s.activityCount), 1);
        arr.sort((a, b) => {
          let va, vb;
          if (sortKey === 'participation') {
            va = computeStudentParticipation(a, maxActivity);
            vb = computeStudentParticipation(b, maxActivity);
          } else if (sortKey === 'level') {
            va = computeStudentLevel(a, avgActivity).rank;
            vb = computeStudentLevel(b, avgActivity).rank;
          } else {
            va = a[sortKey] ?? 0;
            vb = b[sortKey] ?? 0;
          }
          if (typeof va === 'string' || typeof vb === 'string') {
            const sa = String(va), sb = String(vb);
            return sortDir === 'asc' ? sa.localeCompare(sb, 'ko') : sb.localeCompare(sa, 'ko');
          }
          return sortDir === 'asc' ? (va - vb) : (vb - va);
        });
      }
      renderStudentTableRows(arr, avgActivity);
      // 정렬 후 row-limit 재적용
      applyTableLimit('students');
    }

    // ===== P0-7: 섹션별 인사이트 멘트 =====
    function buildAnalyticsInsight(kind, data) {
      data = data || {};
      const num = (v) => Math.round(Number(v) || 0);
      if (kind === 'lesson') {
        const r = num(data.completionRate);
        if (r >= 80) return { tone: 'success', html: `✅ 수업 이수가 활발합니다 (평균 <strong>${r}%</strong>). 학생들이 잘 따라오고 있어요!` };
        if (r > 0 && r < 50) return { tone: 'danger', html: `⚠️ 수업 이수율이 <strong>${r}%</strong>로 낮습니다. 미참여 학생을 확인하세요.` };
        if (r === 0) return { tone: 'normal', html: `📊 수업 이수 데이터가 아직 없습니다.` };
        return { tone: 'normal', html: `📊 평균 이수율 <strong>${r}%</strong>. 안정적인 진행이 필요해요.` };
      }
      if (kind === 'homework') {
        const sr = num(data.submitRate), sc = num(data.avgScore);
        if (sr >= 80 && sc >= 80) return { tone: 'success', html: `✅ 과제 제출률 <strong>${sr}%</strong>, 평균 점수 <strong>${sc}점</strong>. 우수한 학습 태도입니다.` };
        if (sr > 0 && sr < 50) return { tone: 'danger', html: `⚠️ 과제 제출률 <strong>${sr}%</strong>로 저조합니다. 마감 관리가 필요해요.` };
        if (sc > 0 && sc < 60) return { tone: 'warning', html: `📊 평균 점수 <strong>${sc}점</strong>. 보충 과제 추천을 검토하세요.` };
        if (sr === 0 && sc === 0) return { tone: 'normal', html: `📊 과제 데이터가 아직 없습니다.` };
        return { tone: 'normal', html: `📊 제출률 <strong>${sr}%</strong>, 평균 <strong>${sc}점</strong>.` };
      }
      if (kind === 'exam') {
        const sc = num(data.avgScore), pr = num(data.participateRate);
        if (sc >= 80) return { tone: 'success', html: `✅ 평가 평균 <strong>${sc}점</strong>, 참여율 <strong>${pr}%</strong>. 학습 목표를 잘 달성했어요.` };
        if (sc > 0 && sc < 60) return { tone: 'danger', html: `⚠️ 평균 <strong>${sc}점</strong>. 학생들의 추가 학습 지원이 필요합니다.` };
        if (sc === 0 && pr === 0) return { tone: 'normal', html: `📊 평가 데이터가 아직 없습니다.` };
        return { tone: 'normal', html: `📊 평균 <strong>${sc}점</strong>, 참여 <strong>${pr}%</strong>.` };
      }
      if (kind === 'overall') {
        // null 은 미집계 — 평균 계산에서 제외
        const known = [];
        if (data.lessonRate != null) known.push(num(data.lessonRate));
        if (data.homeworkRate != null) known.push(num(data.homeworkRate));
        if (data.examRate != null) known.push(num(data.examRate));
        if (data.examScore != null) known.push(num(data.examScore));
        if (known.length === 0) {
          return { tone: 'normal', html: `📊 클래스 종합 활동 분석은 수업·과제·평가 데이터가 누적되면 자동으로 표시됩니다.` };
        }
        const grade = known.reduce((a,b)=>a+b,0) / known.length;
        const partial = known.length < 4 ? ` (집계 가능 영역 ${known.length}/4 기준)` : '';
        if (grade >= 80) return { tone: 'success', html: `✅ 전반적으로 우수한 클래스 활동입니다. 모든 영역이 높은 수준이에요.${partial}` };
        if (grade < 50) return { tone: 'danger', html: `⚠️ 전반적인 학습 참여가 저조합니다. 클래스 전체 점검이 필요합니다.${partial}` };
        return { tone: 'normal', html: `📊 클래스 종합 활동도 <strong>${Math.round(grade)}%</strong>. 균형 잡힌 성장 중입니다.${partial}` };
      }
      return null;
    }
    function renderAnalyticsInsightInto(targetEl, kind, data) {
      const el = (typeof targetEl === 'string') ? document.querySelector(targetEl) : targetEl;
      if (!el) return;
      const r = buildAnalyticsInsight(kind, data);
      if (!r) { el.innerHTML = ''; return; }
      el.innerHTML = `<div class="analytics-insight tone-${r.tone}">${r.html}</div>`;
    }

            <label style="font-size:14px;color:var(--gray-600)">표시:</label>
            <select onchange="setRowLimit('memberStatus', this.value)" style="padding:6px 10px;border-radius:6px;border:1.5px solid var(--gray-200);font-size:14px;background:#fff">
              <option value="3">3명</option><option value="5">5명</option><option value="10">10명</option><option value="all" selected>전체</option>
            </select>
          </div>
          <div style="display:inline-flex;gap:6px;font-size:13px;color:var(--gray-600);align-items:center">
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981"></span> 우수
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-left:8px"></span> 보통
            <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#ef4444;margin-left:8px"></span> 관심
          </div>
        </div>
      </div>
      <div style="flex:1;overflow:auto;padding:0 22px 22px;">
        <table id="memberStatusTable" data-table="memberStatus" style="width:100%;border-collapse:collapse;font-size:14px;">
          <thead>
            <tr style="background:var(--gray-50);position:sticky;top:0;z-index:1">
              <th class="analytics-sortable-th" data-sort="student_no" onclick="sortMemberStatus('student_no')" style="padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--gray-200);font-weight:700">번호</th>
              <th class="analytics-sortable-th" data-sort="name" onclick="sortMemberStatus('name')" style="padding:10px 12px;text-align:left;border-bottom:1.5px solid var(--gray-200);font-weight:700">학생</th>
              <th class="analytics-sortable-th" data-sort="status" onclick="sortMemberStatus('status')" style="padding:10px 12px;text-align:center;border-bottom:1.5px solid var(--gray-200);font-weight:700">상태</th>
              <th class="analytics-sortable-th" data-sort="activity_count" onclick="sortMemberStatus('activity_count')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">활동</th>
              <th class="analytics-sortable-th" data-sort="study_minutes" onclick="sortMemberStatus('study_minutes')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">학습시간(분)</th>
              <th class="analytics-sortable-th" data-sort="lesson_completion_rate" onclick="sortMemberStatus('lesson_completion_rate')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">수업 이수율</th>
              <th class="analytics-sortable-th" data-sort="homework_submit_rate" onclick="sortMemberStatus('homework_submit_rate')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">과제 제출률</th>
              <th class="analytics-sortable-th" data-sort="homework_avg_score" onclick="sortMemberStatus('homework_avg_score')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">과제 평균점수</th>
              <th class="analytics-sortable-th" data-sort="exam_submit_rate" onclick="sortMemberStatus('exam_submit_rate')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">평가 응시율</th>
              <th class="analytics-sortable-th" data-sort="exam_avg_score" onclick="sortMemberStatus('exam_avg_score')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">평가 평균점수</th>
              <th class="analytics-sortable-th" data-sort="understanding_avg" onclick="sortMemberStatus('understanding_avg')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">이해도</th>
              <th class="analytics-sortable-th" data-sort="focus_avg" onclick="sortMemberStatus('focus_avg')" style="padding:10px 12px;text-align:right;border-bottom:1.5px solid var(--gray-200);font-weight:700">집중도</th>
            </tr>
          </thead>
          <tbody id="memberStatusTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // ===== P0-8: 학습 상태별 멤버현황 풀스크린 모달 =====
    const _memberStatus = { rows: [], sortKey: 'student_no', sortDir: 'asc' };

    async function openMemberStatusModal() {
      const modal = document.getElementById('memberStatusModal');
      modal.classList.add('active');
      document.getElementById('memberStatusTbody').innerHTML = '<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--gray-500)">불러오는 중…</td></tr>';
      document.getElementById('memberStatusSummary').innerHTML = '';
      try {
        const classId = document.getElementById('classSelect').value;
        const qs = (_periodState.startDate && _periodState.endDate) ? `?startDate=${_periodState.startDate}&endDate=${_periodState.endDate}` : '';
        const r = await fetch(`/api/class/${classId}/analytics/members${qs}`);
        const d = await r.json();
        if (!d || !d.success) {
          document.getElementById('memberStatusTbody').innerHTML = '<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--gray-500)">데이터를 불러오지 못했습니다.</td></tr>';
          return;
        }
        _memberStatus.rows = d.members || [];
        renderMemberStatusSummary();
        _renderMemberStatusRows();
        // localStorage 복원
        try { document.querySelector('[data-table="memberStatus"] select').value = getRowLimit('memberStatus', 'all'); } catch(_) {}
      } catch(e) {
        document.getElementById('memberStatusTbody').innerHTML = '<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--gray-500)">네트워크 오류</td></tr>';
      }
    }
    function closeMemberStatusModal() { document.getElementById('memberStatusModal').classList.remove('active'); }

    function renderMemberStatusSummary() {
      const rows = _memberStatus.rows;
      const good = rows.filter(r => r.status === 'good').length;
      const warn = rows.filter(r => r.status === 'warn').length;
      const normal = rows.length - good - warn;
      const card = (cnt, label, color, icon) => `
        <div style="background:#fff;border:1.5px solid ${color}33;border-left:4px solid ${color};border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;border-radius:50%;background:${color}1a;display:flex;align-items:center;justify-content:center;color:${color};font-size:20px"><i class="${icon}"></i></div>
          <div>
            <div style="font-size:24px;font-weight:800;color:${color};line-height:1">${cnt}<span style="font-size:14px;color:var(--gray-500);margin-left:4px;font-weight:600">명</span></div>
            <div style="font-size:13px;color:var(--gray-600);margin-top:2px">${label}</div>
          </div>
        </div>`;
      document.getElementById('memberStatusSummary').innerHTML = card(good, '우수 (전 영역 80%↑)', '#10b981', 'fas fa-trophy') + card(normal, '보통', '#2563eb', 'fas fa-user') + card(warn, '관심 필요 (50% 미만 / 활동 없음)', '#ef4444', 'fas fa-exclamation-triangle');
    }

    function sortMemberStatus(key) {
      if (_memberStatus.sortKey === key) {
        _memberStatus.sortDir = _memberStatus.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        _memberStatus.sortKey = key;
        _memberStatus.sortDir = ['name','status'].includes(key) ? 'asc' : 'desc';
      }
      _renderMemberStatusRows();
    }

    function _renderMemberStatusRows() {
      const { rows, sortKey, sortDir } = _memberStatus;
      const sorted = [...rows].sort((a,b) => {
        const av = a[sortKey], bv = b[sortKey];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === 'number' || typeof bv === 'number') return sortDir === 'asc' ? (av - bv) : (bv - av);
        return sortDir === 'asc' ? String(av).localeCompare(String(bv), 'ko') : String(bv).localeCompare(String(av), 'ko');
      });
      const statusBadge = (s) => {
        const map = { good: { color: '#10b981', label: '우수' }, normal: { color: '#2563eb', label: '보통' }, warn: { color: '#ef4444', label: '관심' } };
        const m = map[s] || map.normal;
        return `<span style="display:inline-block;padding:3px 12px;border-radius:99px;background:${m.color}1a;color:${m.color};font-weight:700;font-size:12px">${m.label}</span>`;
      };
      const fmt = (v, suffix='') => v == null ? '—' : (Math.round(v * 10) / 10) + suffix;
      // 백분율 필드는 0~100 클램프 (Backend 중복 카운팅 보호)
      const fmtP = (v) => v == null ? '—' : Math.round(Math.max(0, Math.min(100, v))) + '%';
      const tbody = document.getElementById('memberStatusTbody');
      tbody.innerHTML = sorted.map(r => `
        <tr style="border-bottom:1px solid var(--gray-100)">
          <td style="padding:10px 12px">${r.student_no || '-'}</td>
          <td style="padding:10px 12px;font-weight:600">${escHtml(r.name)}</td>
          <td style="padding:10px 12px;text-align:center">${statusBadge(r.status)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.activity_count)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.study_minutes)}</td>
          <td style="padding:10px 12px;text-align:right">${fmtP(r.lesson_completion_rate)}</td>
          <td style="padding:10px 12px;text-align:right">${fmtP(r.homework_submit_rate)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.homework_avg_score)}</td>
          <td style="padding:10px 12px;text-align:right">${fmtP(r.exam_submit_rate)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.exam_avg_score)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.understanding_avg)}</td>
          <td style="padding:10px 12px;text-align:right">${fmt(r.focus_avg)}</td>
        </tr>`).join('') || '<tr><td colspan="12" style="padding:30px;text-align:center;color:var(--gray-500)">멤버 데이터가 없습니다.</td></tr>';
      // 정렬 화살표 표시
      document.querySelectorAll('#memberStatusTable .analytics-sortable-th').forEach(th => {
        th.classList.remove('sort-asc','sort-desc');
        if (th.dataset.sort === _memberStatus.sortKey) th.classList.add(_memberStatus.sortDir === 'asc' ? 'sort-asc' : 'sort-desc');
      });
      // 행 제한 적용
      applyTableLimit('memberStatus');
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('#memberCsvBtn')) {
        const rows = _memberStatus.rows;
        if (!rows.length) return;
        const headers = ['번호','학생','상태','활동','학습시간(분)','수업이수율(%)','과제제출률(%)','과제평균점수','평가응시율(%)','평가평균점수','이해도','집중도'];
        const map = { good: '우수', normal: '보통', warn: '관심' };
        const csv = [headers.join(',')].concat(rows.map(r => [
          r.student_no || '', r.name || '', map[r.status] || r.status || '',
          r.activity_count ?? '', r.study_minutes ?? '',
          r.lesson_completion_rate ?? '', r.homework_submit_rate ?? '', r.homework_avg_score ?? '',
          r.exam_submit_rate ?? '', r.exam_avg_score ?? '', r.understanding_avg ?? '', r.focus_avg ?? ''
        ].map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))).join('\n');
        const blob = new Blob([new Uint8Array([0xEF,0xBB,0xBF]), csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const ts = new Date().toISOString().slice(0,10);
        a.href = url; a.download = `학습상태별_멤버현황_${ts}.csv`; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }
    });
  </script>
</body>
</html>
