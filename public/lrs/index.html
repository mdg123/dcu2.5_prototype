// 관리자 views 공통: period 파라미터 붙여 호출 (apiGet은 state.period 자동 부착)
async function adminFetchWithPeriod(path, period){
  try {
    const params = new URLSearchParams();
    if (period) params.set('period', period);
    if (_shouldAttachScope(path)){
      const sc = state.scope || computeScope();
      if (sc) params.set('scope', sc);
    }
    const qs = params.toString();
    const r = await fetch(path + (qs?'?'+qs:''), { credentials:'include' });
    if (!r.ok) return null;
    return await r.json();
  } catch(_){ return null; }
}

/* ---- 홈 공용: DoD(어제 대비 오늘) 미니 위젯 ----
   스펙 A(LRS_학생_홈_메뉴_재설계): role 분기.
   - 학생: "오늘 스냅샷" 3카드 스트립(.dc-kpi-card 재사용) = 오늘 배운 것 / 오늘 학습시간 / 연속 학습.
           "활성 사용자"(=항상 1) 제거. 라벨 15px·값 28px·증감 14px(12px 이하 폐지).
   - 교사·관리자: 반/전체 단위라 활성 사용자 유의미 → 기존 미니 띠 유지(파괴 금지). */
async function renderDodMini(root, opts){
  opts = opts || {};
  try {
    // ── 학생: 오늘 스냅샷 3카드 (스펙 A) ─────────────────────────────
    //   period 자동부착 버그(daily-snapshot이 30일로 벌어짐)를 근본 회피:
    //   s-home이 이미 받은 insights.snapshot의 오늘/어제 "학습활동 7종" 필드를 그대로 사용.
    //   "배운 것" = A-0 능동 7종(todayLearnActs). 조회·게시글·출석·설문은 제외.
    if (state.role === 'student') {
      const snap = opts.snapshot || {};
      // 슬롯1 값 = 오늘 학습활동 7종(우선) → 없으면 오늘 전체 활동
      const todayLearn = (snap.todayLearnActs != null) ? Number(snap.todayLearnActs)
                       : (snap.todayActs != null) ? Number(snap.todayActs) : 0;
      const yestLearn  = (snap.yesterdayLearnActs != null) ? Number(snap.yesterdayLearnActs)
                       : (snap.yesterdayActs != null) ? Number(snap.yesterdayActs) : 0;
      const deltaLearn = todayLearn - yestLearn;
      const todayDur   = (opts.todayDurationMin != null) ? Number(opts.todayDurationMin) : 0;
      const yestDur    = (opts.yesterdayDurationMin != null) ? Number(opts.yesterdayDurationMin) : 0;
      const deltaDur   = todayDur - yestDur;
      const streak     = Number(opts.streakDays)||0;
      // 부류 G(부정 프레이밍) 교정: 학생은 감소를 빨강 ▼로 안 찍는다.
      //   오늘=0이면 어제 대비 음수(-N건)를 절대 노출하지 않고 격려로 대체(스펙 A-3).
      // 슬롯1: 오늘 배운 것(학습활동 7종)
      const actsTrend = (todayLearn === 0)
        ? { dir:'flat', text:'오늘 하나만 시작해봐요!' }
        : deltaLearn>0 ? { dir:'up',   text:`어제보다 +${deltaLearn}개 더 배웠어요 — 좋아요!` }
        : deltaLearn<0 ? { dir:'flat', text:'오늘도 배웠어요 — 계속 가봐요' }
        :                { dir:'flat', text:'어제와 비슷해요 — 꾸준해요' };
      // 슬롯2: 오늘 학습시간(분) — 오늘=0이면 음수 숨김
      const durTrend = (todayDur === 0)
        ? { dir:'flat', text:'오늘은 아직이에요 — 지금 시작?' }
        : deltaDur>0 ? { dir:'up',   text:`어제보다 +${deltaDur}분 — 좋아요!` }
        : deltaDur<0 ? { dir:'flat', text:'오늘도 공부했어요 — 좋아요' }
        :              { dir:'flat', text:'어제와 비슷해요' };
      // 슬롯3: 연속 학습(일) — 오늘 활동 여부로 안내 분기
      const streakTrend = todayLearn>0
        ? { dir:'flat', text:'오늘도 이어가요' }
        : { dir:'flat', text:`오늘 하면 ${streak+1}일` };
      // 오늘 콘텐츠 조회(학습활동 아님) — 있으면 슬롯1 하단에 분리 표기(합산 금지)
      const cv = Number(snap.todayContentViews)||0;
      const cvNote = cv>0 ? `<div class="dc-snapshot__cv">콘텐츠 조회 ${cv}회 (학습활동에는 안 세요)</div>` : '';
      const html = `
        <section class="dc-snapshot" aria-label="오늘 스냅샷">
          <div class="dc-snapshot__label">오늘 활동을 어제와 비교했어요
            <span class="dc-snapshot__help" tabindex="0" role="note"
              aria-label="오늘 한 학습활동만 세요 (수업·평가·과제·문항 풀이·오늘의학습·맞춤학습·오답노트). 콘텐츠 조회·게시글·출석은 빼요.">
              <i class="fas fa-circle-question" aria-hidden="true"></i>
              <span class="dc-snapshot__tip">오늘 한 <b>학습활동</b>만 세요 (수업·평가·과제·문항 풀이·오늘의학습·맞춤학습·오답노트). 콘텐츠 조회·게시글·출석은 빼요.</span>
            </span>
          </div>
          <div class="dc-kpi-grid dc-snapshot-strip">
            ${kpiCard('오늘 배운 것',  todayLearn.toLocaleString(), '건', actsTrend,   'primary', cvNote || null)}
            ${kpiCard('오늘 학습시간', todayDur.toLocaleString(),   '분', durTrend,    'success')}
            ${kpiCard('연속 학습',     streak.toLocaleString(),     '일', streakTrend, 'warning')}
          </div>
        </section>`;
      root.insertAdjacentHTML('afterbegin', html);
      return;
    }

    // ── 교사·관리자: 어제 대비 오늘 미니 띠 (daily-snapshot 사용 유지) ──
    const dd = await apiGet('/api/lrs/stats/daily-snapshot');
    if (!dd || !dd.success) return;
    const t = dd.today || {};
    const y = dd.yesterday || {};
    const deltaActs = (Number(t.totalActs)||0) - (Number(y.totalActs)||0);
    const deltaUsers = (Number(t.uniqueUsers)||0) - (Number(y.uniqueUsers)||0);
    const deltaDur = (Number(t.durationMin)||0) - (Number(y.durationMin)||0);
    {

    // ── 교사·관리자: 기존 미니 띠 유지(활성 사용자 유의미) ──
    const colorOf = v => (v>=0?'var(--lrs-success, #10b981)':'var(--lrs-danger, #ef4444)');
    const arrow = v => (v>0?'▲':(v<0?'▼':'■'));
    const html = `
      <section class="dc-dod-mini" aria-label="어제 대비 오늘 요약"
        style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;padding:12px 14px;background:var(--gray-50);border-radius:8px;border:1px solid var(--gray-100);">
        <div style="min-width:140px;">
          <span class="label" style="font-size:var(--fs-cap);color:var(--gray-500);">오늘 활동</span>
          <strong style="font-size:var(--fs-h2);display:block;">${(Number(t.totalActs)||0).toLocaleString()}건</strong>
          <span style="font-size:var(--fs-sm);color:${colorOf(deltaActs)};">${arrow(deltaActs)} 어제 대비 ${deltaActs>=0?'+':''}${deltaActs}</span>
        </div>
        <div style="min-width:140px;">
          <span class="label" style="font-size:var(--fs-cap);color:var(--gray-500);">활성 사용자</span>
          <strong style="font-size:var(--fs-h2);display:block;">${(Number(t.uniqueUsers)||0).toLocaleString()}명</strong>
          <span style="font-size:var(--fs-sm);color:${colorOf(deltaUsers)};">${arrow(deltaUsers)} 어제 ${(Number(y.uniqueUsers)||0)}명 → ${deltaUsers>=0?'+':''}${deltaUsers}</span>
        </div>
        <div style="min-width:140px;">
          <span class="label" style="font-size:var(--fs-cap);color:var(--gray-500);">학습시간</span>
          <strong style="font-size:var(--fs-h2);display:block;">${(Number(t.durationMin)||0).toLocaleString()}분</strong>
          <span style="font-size:var(--fs-sm);color:${colorOf(deltaDur)};">${arrow(deltaDur)} 어제 대비 ${deltaDur>=0?'+':''}${deltaDur}분</span>
        </div>
      </section>`;
    root.insertAdjacentHTML('afterbegin', html);
    }
  } catch(e) { console.warn('[LRS] DoD mini 렌더 실패', e); }
}

/* ---- 빈 상태(실데이터만에서 표본 작을 때) 안내 ---- */
function _seedHintEmpty(msg){
  const hint = state.realOnly
    ? '<p style="font-size:var(--fs-sm);color:var(--gray-600);margin-top:6px;">실데이터만 보기에서는 표본이 작을 수 있어요. <strong>시드 포함</strong>으로 전환해 보세요.</p>'
    : '';
  return `<div class="dc-state-panel" role="status"><i class="fas fa-inbox" aria-hidden="true"></i>
    <p>${escapeHtml(msg||'표시할 데이터가 없어요')}</p>${hint}</div>`;
}

/* ---- 증감 화살표 trend 객체 (전주/직전 대비) ---- */
function _arrowTrend(delta, unit){
  const d = Number(delta)||0;
  return { dir: d>0?'up':d<0?'down':'flat', text: `${d>=0?'+':''}${d}${unit||''}` };
}

/* ======================================================================

VIEWS['a-home'] = async function(root){
  root.innerHTML = tplLoading(3);

  const k = d.kpi || {};
  const wt = d.weeklyTrend || [];
  // 주간 추이 캡션 정합(P0): 차트가 그리는 '전체' 선은 weeklyTrendByLevel.total(학습활동 7종·학생 스코프)이다.
  //   캡션 숫자도 반드시 같은 소스(byLevel total)로 산출해야 "캡션 9,345 vs 선 972" 모순이 사라진다.
  //   weeklyTrendByLevel 미제공 시에만 구 weeklyTrend(count)로 폴백.
  const _wtbl = Array.isArray(d.weeklyTrendByLevel) ? d.weeklyTrendByLevel : [];
  const _wkThis = _wtbl.find(w => Number(w.weeksAgo) === 0);
  const _wkPrev = _wtbl.find(w => Number(w.weeksAgo) === 1);
  const lastWk = _wtbl.length ? (Number(_wkThis && _wkThis.total) || 0)
                              : (wt.length ? (Number(wt[wt.length-1].count) || 0) : 0);
  const prevWk = _wtbl.length ? (Number(_wkPrev && _wkPrev.total) || 0)
                              : (wt.length > 1 ? (Number(wt[wt.length-2].count) || 0) : 0);
  const wkDelta = lastWk - prevWk;

  // ── 라벨 정직화(포렌식 P0): '활동량'은 정본 학습활동 7종(조회 제외) 집계임을 라벨·부제·각주로 드러낸다. ──
  const ACT_BASIS = '수업이수·평가·과제·문항풀이·오늘의학습·AI 학습맵·오답노트 · 조회 제외';
  // 누적 학습시간 각주: 실데이터만 토글이 꺼져 있으면(예시 포함) '예시 데이터 포함' 보조표기.
  //   BE learnHoursSeedShare(%) 주면 비중까지 명시. 없으면 문구만. 실데이터만(realOnly)이면 각주 생략.
  const _seedShare = (d.learnHoursSeedShare != null && !isNaN(Number(d.learnHoursSeedShare)))
    ? Number(d.learnHoursSeedShare) : null;
  const learnHoursSeedExtra = (!state.realOnly)
    ? `<i class="fas fa-circle-info kpi-extra-ico" aria-hidden="true"></i> 예시 데이터 포함${_seedShare!=null?` (약 ${_seedShare}%)`:''}`
    : '';

  root.innerHTML = `
    <div class="dc-kpi-grid">
      ${kpiCard('가입 학교',    (k.schools||0).toLocaleString(),  '개', {dir:'flat',text:'학생 소속 기준'}, 'primary')}

      ${kpiCard('가입 학생',    (k.students||0).toLocaleString(), '명', {dir:'flat',text:'role=student'},  'primary')}
      ${kpiCard('DAU',          (k.dau||0).toLocaleString(),      '명', {dir:'flat',text:'오늘 활동자'},    'success')}
      ${kpiCard('WAU',          (k.wau||0).toLocaleString(),      '명', {dir:'flat',text:'최근 7일'},       'success')}
      ${kpiCard('누적 학습시간', (k.totalLearnHours||0).toLocaleString(), '시간', {dir:'flat',text:'전체 누적'}, 'warning', learnHoursSeedExtra)}
      ${kpiCard('오늘 학습활동',  (k.todayActs||0).toLocaleString(),'건', {dir:'flat',text:'오늘 하루 · 학습활동 7종'}, 'warning')}
      ${kpiCard('7일 활성률',   (k.activeRate||0),                '%', {dir:(k.activeRate||0)>=50?'up':'flat',text:'WAU/가입학생'}, 'primary')}
    </div>
    <p class="a-home-basis" style="font-size:13px;color:var(--gray-500);line-height:1.5;margin:2px 0 var(--space-4);">
      <i class="fas fa-circle-info" aria-hidden="true" style="color:var(--gray-400);"></i>

    </p>
    <div class="grid-2">
      ${chartWrap('aHomeWeek','주간 활동 추이','최근 8주 · 전체 및 초·중·고 학교급별',`이번 주 ${lastWk.toLocaleString()}건 (직전주 대비 ${wkDelta>=0?'+':''}${wkDelta.toLocaleString()})`)}
      <section class="dc-chart-wrapper">
        <header><h2>오늘 활동 스냅샷</h2><div class="subtitle">실시간 요약</div></header>
        <div id="aHomeSnapshot"></div>
      </section>
    </div>
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>학교급 요약</h2><div class="subtitle">학생 수 · 학습활동(7종 · 조회 제외)</div></header>

      label, data: wtByLevel.map(w => Number(w[key])||0),
      borderColor:color, backgroundColor:'transparent', fill:false,
      tension:.3, pointRadius:3, borderWidth:width

    mkChart(document.getElementById('aHomeWeek'),'line',{

      datasets:[

        mkLine('초등학교','elementary','#10b981',2),

    document.getElementById('aHomeWeek').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>주간 활동 추이</h2></header>` + _seedHintEmpty();

      <li style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">최근 7일 활동자(WAU) <strong>${(k.wau||0).toLocaleString()}명</strong></li>
      <li style="display:flex;justify-content:space-between;padding:10px 0;">${escapeHtml(periodLabelKo())} 학습활동 <strong>${(k.periodActs||0).toLocaleString()}건</strong></li>
    </ul>`;

  // 학교급 미니카드
  const lv = d.byLevel || [];
  document.getElementById('aHomeLevels').innerHTML = lv.map(l => `
    <div class="mini">
      <div class="lv">${escapeHtml(l.label)}</div>
      <div class="row"><span>학생 수</span><b>${(l.students||0).toLocaleString()}명</b></div>
      <div class="row"><span>학습활동</span><b>${(l.acts||0).toLocaleString()}건</b></div>
    </div>`).join('') || _seedHintEmpty('학교급 데이터가 없어요');

  // 학교급 요약 각주 — 학교급별 학생 합 ≠ 가입 학생이면 '미분류 N명 제외' 각주(합계 착시 방지).
  //   BE studentUnleveledCount/unleveledActs 주면 그 값 우선, 없으면 (가입 학생 − 학교급 합)으로 추정.
  try {
    const _lvStuSum = lv.reduce((s,l)=> s + (Number(l.students)||0), 0);
    const _unStu = (d.studentUnleveledCount != null && !isNaN(Number(d.studentUnleveledCount)))
      ? Number(d.studentUnleveledCount)
      : Math.max(0, (Number(k.students)||0) - _lvStuSum);
    const _unActs = (d.unleveledActs != null && !isNaN(Number(d.unleveledActs))) ? Number(d.unleveledActs) : null;
    const foot = document.getElementById('aHomeLevelsFoot');
    if (foot && _unStu > 0) {
      const actPart = (_unActs != null) ? ` · 학습활동 ${_unActs.toLocaleString()}건` : '';
      foot.innerHTML = `<i class="fas fa-circle-info" aria-hidden="true" style="color:var(--gray-400);"></i> `
        + `학교급 미분류 학생 ${_unStu.toLocaleString()}명${actPart}은 위 학교급 합계에서 제외되었습니다.`;
      foot.hidden = false;
    }
  } catch(_){}
};

/* ======================================================================
 * ② 서비스 운영 진단 (a-svc-ops)
 *    사용률 가로 막대 랭킹 + 추세Δ 칩 + 룰베이스 진단 카드 + 운영 점수 표
 * ==================================================================== */
// 진단 권고 문구 룰 (기획서 4-1·E장) — status/severity/reason → 한국어 자연문
function _svcRecommendation(s){
  const name = s.service_label || s.service;
  const share = s.share;
  // 2-C(soft): 시드 톤다운 대상(caution 강등 또는 status에 '예시 영향' 포함)은
  //   '장애·정책 점검' 대신 예시데이터 착시 가능성을 안내하는 부드러운 문구로.
  const isSoft = s.severity === 'caution' || (typeof s.status === 'string' && s.status.indexOf('예시') !== -1);
  if (isSoft){
    return `${name} 활동이 직전 기간 대비 ${Math.abs(s.trendDelta)}% 감소했습니다. 예시(시드) 데이터가 특정 기간에 몰린 영향일 수 있어요. 절대 활동량과 함께 확인하세요.`;
  }
  switch (s.status){
    case '거의 미사용':
      return `${name} 사용률이 전체의 ${share}%에 그칩니다. 진입 동선 노출을 점검하거나 교사 연수·안내를 권고합니다.`;
    case '저활용·정체':
      return `${name}이(가) 최근 ${state.period.replace('d','일')} 정체 상태입니다. 활용 사례·템플릿 제공을 검토하세요.`;
    case '저활용·성장중':
      return `${name}은(는) 점유율은 낮으나(${share}%) 추세가 상승 중입니다. 노출을 확대하면 안착이 기대됩니다.`;
    case '사용 급감':
      return `${name} 활동이 직전 기간 대비 ${Math.abs(s.trendDelta)}% 감소했습니다. 장애·정책 변경 여부 점검이 필요합니다.`;
    default:
      return `${name}은(는) 정상 범위입니다.`;
  }
}
function _deltaChip(delta, dataSufficient){
  const d = Number(delta)||0;
  // 2-C: 표본 부족(dataSufficient===false)이면 추세Δ chip을 회색 처리(경보 색 남발 방지)
  if (dataSufficient === false){
    const arrow = d>0?'▲':d<0?'▼':'·';
    return `<span class="delta flat" title="표본 부족 — 판단 보류">${arrow} ${d>=0?'+':''}${d}%</span>`;
  }
  const cls = d>0?'up':d<0?'down':'flat';
  const arrow = d>0?'▲':d<0?'▼':'·';
  return `<span class="delta ${cls}">${arrow} ${d>=0?'+':''}${d}%</span>`;
}
VIEWS['a-svc-ops'] = async function(root){

  const legacyUnderused = d.underused || [];
  const hardList = Array.isArray(d.underusedList) ? d.underusedList
    : legacyUnderused.filter(s => s.severity==='warn' || s.severity==='critical');
  const softList = Array.isArray(d.watchList) ? d.watchList
    : legacyUnderused.filter(s => s.severity==='caution');

  root.innerHTML = `

      ${kpiCard('최다 서비스', escapeHtml(top.service_label||top.service), '', {dir:'up',text:`${top.count.toLocaleString()}건 · ${top.share}%`}, 'success')}
      ${kpiCard('최소 서비스', escapeHtml(bottom.service_label||bottom.service), '', {dir:'down',text:`${bottom.count.toLocaleString()}건 · ${bottom.share}%`}, 'warning')}
      ${kpiCard('개선 필요',   hardCount, '종', {dir:hardCount?'down':'flat',text:watchCount>0?`관찰 ${watchCount}종`:'진단 발동'}, hardCount?'danger':'primary')}
    </div>
    <section class="dc-chart-wrapper">
      <header><h2>서비스별 사용률 랭킹</h2><div class="subtitle">활동 건수 ·
        <span class="dc-def-term">추세Δ<i class="fas fa-circle-info" aria-hidden="true" title="성장추세(추세Δ)=직전 동기간 대비 활동 건수 증감률(%). +는 증가, -는 감소예요."></i></span>(직전 동기간 대비) ·
        <span class="dc-def-term">재방문율<i class="fas fa-circle-info" aria-hidden="true" title="재방문율=기간 내 2일 이상 활동한 사용자 비중이에요."></i></span></div></header>
      <div class="dc-svc-rank" id="aSvcRank"></div>
      <p class="proj-disclaimer" style="margin-top:10px;"><i class="fas fa-circle-info" aria-hidden="true"></i> 최근 급증·급감은 예시(시드) 데이터가 특정 기간에 몰려 생긴 착시일 수 있어요. 절대 활동량과 함께 보세요.</p>
    </section>
    <section style="margin-top:var(--space-4);">
      <h2 id="aSvcDiagTitle" style="font-size:var(--fs-h2);margin:0 0 10px;">${hardList.length ? '개선 필요 서비스 진단' : (softList.length ? '관찰 대상 서비스' : '개선 필요 서비스 진단')}</h2>
      <div class="dc-diag-grid" id="aSvcDiag"></div>
      <div class="dc-diag-grid" id="aSvcWatch" style="margin-top:${softList.length && hardList.length ? '16px' : '0'};"></div>
    </section>
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>서비스 활용 점수표</h2><div class="subtitle">건수·고유사용자·평균시간·
        <span class="dc-def-term">추세Δ<i class="fas fa-circle-info" aria-hidden="true" title="성장추세(추세Δ)=직전 동기간 대비 활동 건수 증감률(%)."></i></span>·
        <span class="dc-def-term">재방문율<i class="fas fa-circle-info" aria-hidden="true" title="재방문율=기간 내 2일 이상 활동한 사용자 비중."></i></span>·상태 (정렬 가능)</div></header>
      <div id="aSvcTable"></div>
    </section>

    <!-- A-WEAK 취약 성취기준 추세 랭킹 -->
    <section class="mastery-section" id="aWeakSection" style="margin-top:var(--space-4);">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2"><i class="fas fa-arrow-trend-down" aria-hidden="true" style="color:#ea7317;"></i> 취약 성취기준 추세 랭킹</h2>
          <div class="mastery-sub">도달률이 낮고 하락 중인 성취기준이에요. 표본이 클수록 신뢰돼요.</div>
        </div>
        <div class="ms-controls" id="aWeakConf"></div>
      </div>
      <div id="aWeakFilters" class="dc-eq-filterbar" style="margin:6px 0 14px;"></div>
      <div id="aWeakHost"></div>
      <div id="aWeakFoot"></div>
    </section>`;

  // 가로 막대 랭킹
  document.getElementById('aSvcRank').innerHTML = services.map(s => {
    const pct = Math.round((s.count/maxCnt)*100);
    const rowCls = s.service===top.service ? 'top' : s.service===bottom.service ? 'bottom' : '';
    return `<div class="row ${rowCls}">
      <span class="name" title="${escapeAttr(s.service_label||s.service)}">${escapeHtml(s.service_label||s.service)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;"></span></span>
      <span class="meta"><span class="cnt">${s.count.toLocaleString()}</span><span style="color:var(--gray-500);font-size:var(--fs-sm);">${s.share}%</span>${_deltaChip(s.trendDelta, s.dataSufficient)}</span>
    </div>`;
  }).join('');

  // 진단 카드 (룰베이스 권고) — 2-C: 개선 필요(hard)와 관찰 대상(soft) 2그룹 분리
  const diagCard = (s) => `
      <div class="dc-diag-card" data-sev="${escapeAttr(s.severity)}">
        <div class="dc-diag-head">
          <span class="dc-diag-svc">${escapeHtml(s.service_label||s.service)}</span>
          <span class="dc-diag-status">${escapeHtml(s.status)}</span>
        </div>
        <div class="dc-diag-msg">${escapeHtml(_svcRecommendation(s))}</div>
        <div class="dc-diag-metrics">
          <span>점유율 <b>${s.share}%</b></span>
          <span>추세 <b>${s.trendDelta>=0?'+':''}${s.trendDelta}%</b></span>
          <span>고유사용자 <b>${(s.uniqueUsers||0).toLocaleString()}명</b></span>
        </div>
      </div>`;
  const diagEl = document.getElementById('aSvcDiag');
  const watchEl = document.getElementById('aSvcWatch');
  // 개선 필요(hard: warn/critical) — 기존 카드 스타일
  if (hardList.length){
    diagEl.innerHTML = hardList.map(diagCard).join('');
  } else if (!softList.length){
    diagEl.innerHTML = `<div class="dc-diag-card" data-sev="ok">
      <div class="dc-diag-head"><span class="dc-diag-svc">전체 정상</span><span class="dc-diag-status" style="color:#15803d;background:#dcfce7;">정상</span></div>
      <div class="dc-diag-msg">현재 기간 기준 저활용·미사용으로 진단된 서비스가 없습니다.</div>
    </div>`;
  } else {
    diagEl.innerHTML = '';
  }
  // 관찰 대상(soft: caution·예시데이터 영향) — 회색/청록 톤, 빨강 금지
  if (watchEl && softList.length){
    const subhead = hardList.length
      ? `<div style="grid-column:1/-1;font-size:var(--fs-body);font-weight:600;color:var(--gray-700);margin:2px 0 2px;">관찰 대상 (예시데이터 영향 가능)</div>`

    watchEl.innerHTML = subhead + softList.map(s => `
      <div class="dc-diag-card" data-sev="caution">

        </div>
        <div class="dc-diag-msg">${escapeHtml(_svcRecommendation(s))}</div>
        <div class="dc-diag-metrics">
          <span>점유율 <b>${s.share}%</b></span>
          <span>추세 <b>${s.trendDelta>=0?'+':''}${s.trendDelta}%</b></span>
          <span>고유사용자 <b>${(s.uniqueUsers||0).toLocaleString()}명</b></span>
        </div>
      </div>`).join('');
  } else if (watchEl){
    watchEl.innerHTML = '';

  // 운영 점수표
  renderDataTable(document.getElementById('aSvcTable'), {
    columns:[
      { key:'service_label', label:'서비스', format:(v,r)=>escapeHtml(v||r.service) },
      { key:'count',         label:'건수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'share',         label:'점유율', align:'right', format:v=>escapeHtml(v+'%') },
      { key:'uniqueUsers',   label:'고유사용자', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'avgMinPerUser', label:'평균시간(분)', align:'right', format:v=>escapeHtml(String(v??0)) },
      { key:'trendDelta',    label:'추세Δ', align:'right', format:v=>escapeHtml((v>=0?'+':'')+v+'%') },
      { key:'revisitRate',   label:'재방문율', align:'right', format:v=>escapeHtml(v+'%') },
      { key:'status',        label:'상태', format:(v,r)=>{
          const color = r.severity==='critical'?'#dc2626':r.severity==='warn'?'#b45309':r.severity==='caution'?'#a16207':'#15803d';

  });

/* A-WEAK 후행 로드(학교급·교과 필터) — 칩 변경 시 부분 재조회(전 뷰 리로드 없음) */
async function loadWeakTrend(){
  const params = { scope:'all', limit:15 };
  const lv = state._weakLevel || 'all';
  const subj = state._weakSubject || 'all';
  if (lv !== 'all')   params.school_level = lv;
  if (subj !== 'all') params.subject = subj;
  const w = await apiGet('/api/lrs/weak-trend', params);
  renderWeakFilters(w);
  renderWeakTrend(w);
}

/* A-WEAK 필터 칩(학교급·교과) — equity 통합뷰와 동일 chip 컴포넌트 재사용 */
function renderWeakFilters(w){
  const host = document.getElementById('aWeakFilters');
  if (!host) return;
  const lv = state._weakLevel || 'all';
  const subj = state._weakSubject || 'all';
  const avail = (w && Array.isArray(w.availableSubjects)) ? w.availableSubjects.filter(s=>s && s.present) : [];
  const subjToggle = avail.length
    ? `<div class="dc-unit-toggle" id="aWeakSubjectToggle" role="group" aria-label="교과 선택">
         <span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(avail, subj)}</div>`
    : '';
  host.innerHTML = `
    <div class="dc-eq-filters">
      <div class="dc-unit-toggle" id="aWeakLevelToggle" role="group" aria-label="학교급 선택">
        <span class="dc-eq-flabel">학교급</span>${_eqLevelChipsHtml(lv)}
      </div>
      ${subjToggle}
    </div>
    ${_eqSummaryChip(lv, subj, null)}`;
  host.querySelectorAll('#aWeakLevelToggle button[data-lv]').forEach(b=>{
    b.onclick = ()=>{ if (state._weakLevel===b.dataset.lv) return; state._weakLevel = b.dataset.lv; loadWeakTrend(); };
  });
  host.querySelectorAll('#aWeakSubjectToggle button[data-subj]').forEach(b=>{
    b.onclick = ()=>{ if (state._weakSubject===b.dataset.subj) return; state._weakSubject = b.dataset.subj; loadWeakTrend(); };
  });
}

/* A-WEAK 렌더(관리자) — renderDataTable + 인라인 도달 Bar(4상태색) + 추세 화살표 + 표본수 */
function renderWeakTrend(w){
  const host = document.getElementById('aWeakHost');
  const confHost = document.getElementById('aWeakConf');
  const foot = document.getElementById('aWeakFoot');
  if (!host) return;
  if (!w || !w.success){
    host.innerHTML = `<div class="mastery-empty"><i class="fas fa-arrow-trend-down me-icon"></i><p>취약 추세 데이터를 불러오지 못했어요.</p></div>`;
    return;
  }
  const rows = (w.ranking || []);
  if (!rows.length){
    const cond = _eqSummaryText(state._weakLevel, state._weakSubject);
    if (confHost) confHost.innerHTML = '';
    host.innerHTML = `<div class="mastery-empty"><i class="fas fa-face-smile me-icon" style="color:#86efac;"></i>
      <p>${cond ? `선택한 조건(${escapeHtml(cond)})에서 ` : ''}하락 중인 성취기준이 없어요. 안정적인 추세예요.</p></div>`;
    return;
  }
  // 전체 신뢰(표본 기준) — 가장 보수적 단위로 표시
  if (confHost){
    const conf = w.masked ? 'low' : 'high';
    confHost.innerHTML = confBadge(conf, w.masked ? '낮음' : '높음', `전체 학생 ${w.studentCount||0}명${w.masked?' · 표본 적어 참고용':''}`);
  }

  function barState(rate){ return rate>=80 ? 'reached' : rate>=50 ? 'partial' : 'notReached'; }
  function inlineBar(rate){
    const st = barState(rate);
    return `<span class="weak-bar"><span class="wb-num">${rate}%</span><span class="wb-track"><span class="wb-fill" data-state="${st}" style="width:${Math.max(0,Math.min(100,rate))}%;"></span></span></span>`;
  }

  // 데스크탑 표(renderDataTable) + 모바일 카드
  host.innerHTML = `<div class="weak-table-wrap" id="aWeakTable"></div><div class="weak-cards" id="aWeakCards"></div>`;
  const tableRows = rows.map((r, i) => Object.assign({}, r, { _rank: i+1 }));

  renderDataTable(document.getElementById('aWeakTable'), {
    columns:[
      { key:'_rank', label:'#', align:'right', format:v=>escapeHtml(String(v)) },
      { key:'label', label:'성취기준', format:(_,r)=>{
          const codeBare = String(r.code||'').replace(/^\[|\]$/g,'');
          const lbl = r.label && r.label !== r.code ? r.label : codeBare;
          const short = lbl.length>18 ? lbl.slice(0,18)+'…' : lbl;
          return `<div style="max-width:280px;"><div style="font-weight:600;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(short)}</div><div style="font-size:13px;color:#9ca3af;">[${escapeHtml(codeBare)}]</div></div>`;
        } },
      { key:'subject', label:'교과', format:v=>escapeHtml(v||'-') },
      { key:'reachedRate', label:'도달률', format:(v)=> inlineBar(v==null?0:v) },
      { key:'direction', label:'추세', format:(v,r)=>{
          if ((r.observedWeeks||0) < 3) return `<span class="trend-note">관측 ${r.observedWeeks||0}주</span>`;
          const hint = `최근 ${r.observedWeeks||0}주 정답률 기울기 ${r.slope==null?'-':((r.slope>0?'+':'')+r.slope)}%p/주`;
          return trendArrow(v, r.slope, hint);
        } },
      { key:'evaluatedStudents', label:'표본', align:'right', format:(v)=>{
          const n = Number(v)||0;
          if (n < 10) return `${n} ${lowSampleChip('표본 부족')}`;
          return escapeHtml(String(n));
        } }
    ],
    // 초기 정렬: BE가 준 배열 순서 보존(_rank asc). 취약 BE 순서(표본충분 티어→Wilson 상한→도달률 오름차)를
    //   FE reachedRate 재정렬로 덮어쓰는 리스크를 원천 차단(순위 컬럼 정합). 헤더 클릭 재정렬은 유지.
    rows: tableRows, initialSort:'_rank', initialDir:'asc'
  });

  // 모바일 카드
  document.getElementById('aWeakCards').innerHTML = tableRows.map(r => {
    const codeBare = String(r.code||'').replace(/^\[|\]$/g,'');
    const lbl = r.label && r.label !== r.code ? r.label : codeBare;
    const low = (r.observedWeeks||0) < 3;
    const arrow = low ? `<span class="trend-note">관측 ${r.observedWeeks||0}주</span>`
      : trendArrow(r.direction, r.slope, `최근 ${r.observedWeeks||0}주 ${r.slope==null?'-':((r.slope>0?'+':'')+r.slope)}%p/주`);
    const sampleLow = (Number(r.evaluatedStudents)||0) < 10;
    return `<div class="weak-card">
      <div class="wc-title">${r._rank}. ${escapeHtml(lbl)}</div>
      <div class="wc-sub">[${escapeHtml(codeBare)}] · ${escapeHtml(r.subject||'-')}</div>
      <div style="margin:8px 0;">${inlineBar(r.reachedRate==null?0:r.reachedRate)}</div>
      <div class="wc-row">${arrow}<span class="trend-note">표본 ${Number(r.evaluatedStudents)||0}명${sampleLow?' · 참고용':''}</span></div>
    </div>`;
  }).join('');

  if (foot) foot.innerHTML = projDisclaimer((w && w.disclaimer) || '취약은 평가 표본이 충분한(5명 이상) 성취기준을 우선 배치하고, 그 안에서 도달률이 낮고 하락하는 순입니다. 표본이 적은 단위는 아래에 참고로 표시됩니다.');
}

/* ======================================================================
 * ③ 지역별 성취수준 비교 (a-macro) — 통합 뷰 공용 헬퍼
 *    (구 거시 비교 5단 드릴 + 형평성 뷰를 하나로 통합. 렌더 본체는 아래 VIEWS['a-macro'].)
 *    학교급·교과·기간 3필터 칩 · 필터 요약 · 학교 1단 인라인 드릴을 공용 헬퍼로 제공.
 *    aWeak(취약 성취기준) 필터와 동일 chip 컴포넌트를 공유한다.
 * ==================================================================== */
const EQ_LEVELS = [['all','전체'],['elementary','초'],['middle','중'],['high','고']];
const EQ_SUBJECT_ORDER = ['korean','math','english','science','social','moral','music','art','pe','practical'];
const EQ_SUBJECT_LABEL = { korean:'국어', math:'수학', english:'영어', science:'과학', social:'사회', moral:'도덕', music:'음악', art:'미술', pe:'체육', practical:'실과' };
function _eqLevelLabelOf(v){ return v==='elementary'?'초등학교':v==='middle'?'중학교':v==='high'?'고등학교':null; }
function _eqSubjectLabelOf(k){ return (k && k!=='all') ? (EQ_SUBJECT_LABEL[k]||k) : null; }
function _eqPeriodLabelOf(p){ return p==='90d'?'최근 90일':p==='30d'?'최근 30일':null; }

/* 학교급 칩(전체/초/중/고) — data-lv. equity·aWeak 공용 */
function _eqLevelChipsHtml(active){
  return EQ_LEVELS.map(([v,l])=>`<button class="chip" type="button" data-lv="${v}" aria-pressed="${active===v?'true':'false'}">${l}</button>`).join('');
}
/* 교과 칩(전체 + 데이터 존재 교과만) — availableSubjects(present) 데이터 주도로 죽은 칩 방지. data-subj */
function _eqSubjectChipsHtml(avail, active){
  const present = new Map((avail||[]).map(s=>[s.key, s.label || EQ_SUBJECT_LABEL[s.key] || s.key]));
  const ordered = EQ_SUBJECT_ORDER.filter(k=>present.has(k))
    .concat([...present.keys()].filter(k=>EQ_SUBJECT_ORDER.indexOf(k)<0));
  const chips = [`<button class="chip" type="button" data-subj="all" aria-pressed="${active==='all'?'true':'false'}">전체</button>`]
    .concat(ordered.map(k=>`<button class="chip" type="button" data-subj="${escapeAttr(k)}" aria-pressed="${active===k?'true':'false'}">${escapeHtml(present.get(k))}</button>`));
  return chips.join('');
}
/* 적용 필터 요약 텍스트("초등학교 · 수학 · 최근 30일") — state 값 기준(BE 미반영 폴백 안전) */
function _eqSummaryText(level, subject, period){
  const parts = [];
  const l = _eqLevelLabelOf(level);     if (l) parts.push(l);
  const s = _eqSubjectLabelOf(subject); if (s) parts.push(s);
  const p = _eqPeriodLabelOf(period);   if (p) parts.push(p);
  return parts.join(' · ');
}
/* 적용 필터 요약칩(현재위치 피드백) — 학교급·교과가 전체가 아닐 때만 노출(기간 단독은 미노출) */
function _eqSummaryChip(level, subject, period){
  const hasScope = (level && level!=='all') || (subject && subject!=='all');
  if (!hasScope) return '';
  const t = _eqSummaryText(level, subject, period);
  return t ? `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(t)}</div>` : '';
}

/* ======================================================================
 * 리포트(a-export) 블록4 — 성취기준 강·약 Top 10 공유 필터 (학교급→학년→교과)
 *   칩 변경 시 부분 재조회(loadReportWeakStrong)로 취약·우수 두 표만 동시 갱신(전체 리포트 리로드 없음).
 *   상태 네임스페이스 _wsLevel/_wsGrade/_wsSubject — A-WEAK 뷰(_weakLevel/_weakSubject)와 분리.
 *   칩·표·화살표·뱃지·요약칩은 equity/aWeak 공용 헬퍼를 그대로 재사용, 학년 칩만 신설.
 * ==================================================================== */
/* 학년 칩(전체/1/2…) — data-grade. availableGrades 데이터 주도. 학교급=all이면 미출력(빈 문자열). */
function _wsGradeChipsHtml(availGrades, active){
  const grades = (Array.isArray(availGrades) ? availGrades : [])
    .map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
  if (!grades.length) return '';
  const act = (active==null || active==='all') ? 'all' : String(active);
  const chips = [`<button class="chip" type="button" data-grade="all" aria-pressed="${act==='all'?'true':'false'}">전체</button>`]
    .concat(grades.map(g=>`<button class="chip" type="button" data-grade="${g}" aria-pressed="${act===String(g)?'true':'false'}">${g}학년</button>`));
  return chips.join('');
}
/* 적용 필터 요약 텍스트(학교급·학년·교과) — 화면 요약칩용. state 기준(BE 미반영 폴백 안전). */
function _wsSummaryText(){
  const parts = [];
  const l = _eqLevelLabelOf(state._wsLevel); if (l) parts.push(l);
  if (state._wsLevel!=='all' && state._wsGrade && state._wsGrade!=='all') parts.push(state._wsGrade+'학년');
  const s = _eqSubjectLabelOf(state._wsSubject); if (s) parts.push(s);
  return parts.join(' · ');
}
/* 적용 필터 요약칩(현재 위치 피드백) — 학교급/교과가 전체가 아닐 때만 노출 */
function _wsSummaryChip(){
  const hasScope = (state._wsLevel && state._wsLevel!=='all') || (state._wsSubject && state._wsSubject!=='all');
  if (!hasScope) return '';
  const t = _wsSummaryText();
  return t ? `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(t)}</div>` : '';
}
/* 인쇄용 적용 필터 캡션 — 항상 전체 문장으로 스코프를 못박음("전체"까지 명시). noprint 아님. */
function _wsCaptionText(){
  const lv = _eqLevelLabelOf(state._wsLevel);
  const gr = (state._wsLevel!=='all' && state._wsGrade && state._wsGrade!=='all') ? state._wsGrade+'학년' : null;
  const sj = _eqSubjectLabelOf(state._wsSubject);
  const parts = [];
  parts.push('학교급: ' + (lv||'전체'));
  if (state._wsLevel!=='all') parts.push('학년: ' + (gr||'전체'));
  parts.push('교과: ' + (sj||'전체'));
  const anyScope = lv||gr||sj;
  return anyScope ? ('적용 필터 · ' + parts.join(' / ')) : '적용 필터 · 전체 대상 (학교급·학년·교과 전체)';
}
/* 부분 재조회 파라미터(학교급·학년·교과 AND) */
function _wsParams(){
  const p = { scope:'all', limit:10 };
  const lv = state._wsLevel || 'all';
  if (lv !== 'all') p.school_level = lv;
  if (lv !== 'all' && state._wsGrade && state._wsGrade !== 'all') p.grade = state._wsGrade;
  if (state._wsSubject && state._wsSubject !== 'all') p.subject = state._wsSubject;
  return p;
}
/* 취약·우수 두 표 동시 부분 재조회(전체 리포트 리로드 없음) */
async function loadReportWeakStrong(){
  const p = _wsParams();
  const [w, s] = await Promise.all([
    apiGet('/api/lrs/weak-trend', p),
    apiGet('/api/lrs/strong-trend', p)
  ]);
  renderWSFilters(w || s);       // availableSubjects/Grades 는 두 응답 동일(둘 다 실패 시 폴백)
  renderRptRanking('weak', w);
  renderRptRanking('strong', s);
}
/* 공유 필터바 렌더(학교급→학년→교과) + 요약칩 + 인쇄 캡션. 칩 클릭 → 부분 재조회. */
function renderWSFilters(data){
  const host = document.getElementById('rptWSFilters');
  const cap  = document.getElementById('rptWSCaption');
  // 캡션은 필터바가 없어도(이론상) 항상 갱신
  if (cap) cap.innerHTML = `<i class="fas fa-filter" aria-hidden="true"></i> ${escapeHtml(_wsCaptionText())}`;
  if (!host) return;
  const d = data || {};
  const lv = state._wsLevel || 'all';
  // 교과: availableSubjects.present 데이터 주도. 현재 subject가 present에 없으면 전체로 강등(죽은 칩·빈 결과 방지).
  const avail = Array.isArray(d.availableSubjects) ? d.availableSubjects.filter(x=>x && x.present) : [];
  if (state._wsSubject && state._wsSubject!=='all' && avail.length && !avail.some(x=>x.key===state._wsSubject)){
    state._wsSubject = 'all';
  }
  const subj = state._wsSubject || 'all';
  // 학년: availableGrades 데이터 주도. 미수신 시 학교급으로 정적 유도(초등 1~6 / 중·고 1~3) — 화면이 죽지 않게(폴백 안전).
  let availGrades = Array.isArray(d.availableGrades) ? d.availableGrades : null;
  if (!availGrades && lv!=='all') availGrades = (lv==='elementary') ? [1,2,3,4,5,6] : [1,2,3];
  if (lv!=='all' && state._wsGrade && state._wsGrade!=='all' && Array.isArray(availGrades)
      && !availGrades.map(String).includes(String(state._wsGrade))){
    state._wsGrade = 'all';                         // 급 변경 등으로 없는 학년이면 전체로 강등
  }
  const grade = state._wsGrade || 'all';

  const gradeChips  = (lv!=='all') ? _wsGradeChipsHtml(availGrades, grade) : '';
  const gradeToggle = gradeChips
    ? `<div class="dc-unit-toggle" id="rptWSGradeToggle" role="group" aria-label="학년 선택"><span class="dc-eq-flabel">학년</span>${gradeChips}</div>`
    : '';
  const subjToggle  = avail.length
    ? `<div class="dc-unit-toggle" id="rptWSSubjectToggle" role="group" aria-label="교과 선택"><span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(avail, subj)}</div>`
    : '';
  host.innerHTML = `
    <div class="dc-eq-filters">
      <div class="dc-unit-toggle" id="rptWSLevelToggle" role="group" aria-label="학교급 선택">
        <span class="dc-eq-flabel">학교급</span>${_eqLevelChipsHtml(lv)}
      </div>
      ${gradeToggle}
      ${subjToggle}
    </div>
    ${_wsSummaryChip()}`;
  // 이벤트 바인딩 — 동일 칩 재클릭은 무시(가드), 학교급 변경 시 학년 전체 리셋
  host.querySelectorAll('#rptWSLevelToggle button[data-lv]').forEach(b=>{
    b.onclick = ()=>{
      if ((state._wsLevel||'all')===b.dataset.lv) return;
      state._wsLevel = b.dataset.lv;
      state._wsGrade = 'all';
      loadReportWeakStrong();
    };
  });
  host.querySelectorAll('#rptWSGradeToggle button[data-grade]').forEach(b=>{
    b.onclick = ()=>{
      if (String(state._wsGrade||'all')===b.dataset.grade) return;
      state._wsGrade = b.dataset.grade;
      loadReportWeakStrong();
    };
  });
  host.querySelectorAll('#rptWSSubjectToggle button[data-subj]').forEach(b=>{
    b.onclick = ()=>{
      if ((state._wsSubject||'all')===b.dataset.subj) return;
      state._wsSubject = b.dataset.subj;
      loadReportWeakStrong();
    };
  });
}
/* 취약/우수 랭킹 표 렌더(공통) — renderDataTable 6컬럼 + 신뢰뱃지 + 각주. 빈·오류 상태는 §8 문구.
 *   opts.audience==='teacher'(교사 t-weakstrong 뷰): 신뢰뱃지 대신 중립 "우리 반 N명" 표본뱃지,
 *   각주는 반 관점 문구, 빈결과 조건문구는 opts.condText(선택 교과) 사용. 미지정(관리자)=기존(회귀 0). */
function renderRptRanking(kind, data, opts){
  opts = opts || {};
  const audience  = opts.audience;
  const isWeak    = (kind==='weak');
  const tableHost = document.getElementById(isWeak?'rptWeakTable':'rptStrongTable');
  const disc      = document.getElementById(isWeak?'rptWeakDisc':'rptStrongDisc');
  const confHost  = document.getElementById(isWeak?'rptWeakConf':'rptStrongConf');
  if (!tableHost) return;
  // 로드 실패(예: strong-trend 미배포 404 → apiGet null)
  if (!data || !data.success){
    if (confHost) confHost.innerHTML = '';
    tableHost.innerHTML = _seedHintEmpty(isWeak?'취약 성취기준 데이터를 불러오지 못했어요':'우수 성취기준 데이터를 불러오지 못했어요');
    if (disc) disc.innerHTML = '';
    return;
  }
  // 신뢰 뱃지(섹션 헤더 우측) — 교사는 중립 "우리 반 N명" 표본뱃지(신뢰 높음/낮음 오도 방지)
  if (confHost){
    if (audience === 'teacher'){
      const n = Number(data.studentCount)||0;
      confHost.innerHTML = `<span class="dc-badge dc-badge--muted" title="개설한 클래스를 통합한 우리 반 학생 수예요"><i class="fas fa-users" aria-hidden="true"></i> 우리 반 ${n.toLocaleString()}명</span>`;
    } else {
      const conf = data.masked ? 'low' : 'high';
      confHost.innerHTML = confBadge(conf, data.masked?'낮음':'높음',
        `전체 학생 ${(Number(data.studentCount)||0).toLocaleString()}명${data.masked?' · 표본 적어 참고용':''}`);
    }
  }
  const ranking = data.ranking || [];
  // 빈 결과(조건 삽입) — 교사는 선택 교과(opts.condText), 관리자는 공유 필터 요약
  if (!ranking.length){
    const cond = (audience === 'teacher') ? (opts.condText || '') : _wsSummaryText();
    if (isWeak){
      tableHost.innerHTML = `<p class="rb-goodnote"><i class="fas fa-face-smile" aria-hidden="true"></i> ${cond?`선택한 조건(${escapeHtml(cond)})에서 `:''}하락 중인 취약 성취기준이 없어요. 안정적인 추세예요.</p>`;
    } else {
      tableHost.innerHTML = `<p class="rb-foot" style="margin-top:0;"><i class="fas fa-circle-info" aria-hidden="true"></i> ${cond?`선택한 조건(${escapeHtml(cond)})에서 `:''}도달률이 높은 성취기준을 아직 집계할 표본이 부족해요. 표본이 더 쌓인 뒤 확인해 주세요.</p>`;
    }
    if (disc) disc.innerHTML = '';
    return;
  }
  // 표 렌더(Top 10) — reachBadge 값 기준 색(취약↔우수 통일)
  const rows = ranking.slice(0,10).map((r,i)=>Object.assign({}, r, { _rank:i+1 }));
  const reachBadge = (rate)=>{
    const v = rate==null?0:Number(rate);
    const t = v>=80?'dc-badge--success':v>=50?'dc-badge--warning':'dc-badge--danger';
    return `<span class="dc-badge ${t}">${v}%</span>`;
  };
  renderDataTable(tableHost, {
    columns:[
      { key:'_rank', label:'#', align:'right', format:v=>escapeHtml(String(v)) },
      { key:'label', label:'성취기준', format:(_,r)=>{
          const code  = String(r.code||'').replace(/^\[|\]$/g,'');
          const lbl   = (r.label && r.label!==r.code) ? r.label : code;
          const short = lbl.length>24 ? lbl.slice(0,24)+'…' : lbl;
          return `<div style="max-width:320px;"><div style="font-weight:600;color:#1f2937;">${escapeHtml(short)}</div><div style="font-size:13px;color:#9ca3af;">[${escapeHtml(code)}]</div></div>`;
        } },
      { key:'subject', label:'교과', format:v=>escapeHtml(v||'-') },
      { key:'reachedRate', label:'도달률', align:'right', format:v=>reachBadge(v) },
      { key:'evaluatedStudents', label:'평가 학생수', align:'right', format:v=>{
          const n = Number(v)||0;
          if (n < 10) return `${n} ${lowSampleChip('참고')}`;
          return escapeHtml(String(n));
        } },
      { key:'direction', label:'추세', format:(v,r)=>{
          if ((r.observedWeeks||0) < 3) return `<span class="trend-note">관측 ${r.observedWeeks||0}주</span>`;
          const hint = `최근 ${r.observedWeeks||0}주 정답률 기울기 ${r.slope==null?'-':((r.slope>0?'+':'')+r.slope)}%p/주`;
          return trendArrow(v, r.slope, hint);
        } }
    ],

async function _toggleEquitySchoolDrill(row){
  const table = document.getElementById('aEquityTable');
  if (!table || !row || row.masked) return;
  let targetTr = null;
  table.querySelectorAll('tbody tr[data-row-id]').forEach(tr=>{
    if (tr.getAttribute('data-row-id') === String(row.id)) targetTr = tr;
  });

  const existing = table.querySelector('tr.eq-drill-row');

  if (existing) existing.remove();
  if (openedFor === String(row.id)){ state._eqDrillRegion = null; return; }
  state._eqDrillRegion = String(row.id);

  const panel = document.createElement('tr');
  panel.className = 'eq-drill-row';

  if (state._eqLevel && state._eqLevel!=='all')     params.school_level = state._eqLevel;
  if (state._eqSubject && state._eqSubject!=='all') params.subject = state._eqSubject;
  const d = await apiGet('/api/lrs/stats/macro-drill', params);
  const cell = panel.querySelector('.eq-drill');
  if (!cell) return;
  const subjLabel = _eqSubjectLabelOf(state._eqSubject);
  const scoreNoun = subjLabel ? `${subjLabel} 정답률` : '정답률';
  if (!d || !d.success){
    cell.innerHTML = `<div class="eq-drill-empty">${escapeHtml(row.label)} 학교별 ${escapeHtml(scoreNoun)} 데이터를 불러오지 못했어요.</div>`;

    return;

  }).join('');

    <div class="eq-drill-head"><i class="fas fa-school" aria-hidden="true"></i> ${escapeHtml(row.label)} · 학교별 ${escapeHtml(scoreNoun)}
      <span class="eq-drill-sub">정답률 내림차순 · 학생 10명 미만 학교는 표본 부족</span></div>

/* ======================================================================

 *    ① 필터바(학교급·교과·기간 3필터) + 정의 캡션·요약칩
 *    ② 격차 헤드라인 KPI 4칸  ③ 지역별 성취수준(정답률) 막대(1차 비교)

// 격차 크기 → tone (성취·도달률·활성률 %p 기준: gap<8 작음(success)·8~15 중간(warning)·≥15 큼(danger))
function _equityGapTone(gap){
  const g = Math.abs(Number(gap)||0);
  if (g >= 15) return 'danger';
  if (g >= 8)  return 'warning';
  return 'success';
}
// 1인당 활동(배수)용 tone: <1.5배 작음·1.5~2.5배 중간·≥2.5배 큼
function _equityGapToneX(gapX){
  const x = Number(gapX)||0;
  if (x >= 2.5) return 'danger';
  if (x >= 1.5) return 'warning';
  return 'success';
}
// 규칙기반 분석멘트 (renderInsights/_crossInsight 톤·구조) — BE는 숫자만, 문장은 FE 생성
// 받침 유무로 조사 선택 (a=받침있음, b=받침없음). 한글 아니면 a.
function _josa(word, a, b){
  const c = (word || '').trim().slice(-1);
  if (!c) return a;
  const code = c.charCodeAt(0);
  if (code < 0xAC00 || code > 0xD7A3) return a;
  return ((code - 0xAC00) % 28 !== 0) ? a : b;
}
function _equityInsight(d, dimLabelArg){
  // 비교 단위 라벨 인자화(기본 '지역' = 관리자 지역비교, 회귀 무변경). 교사 반별비교는 '반'을 넘긴다.
  const dimLabel = dimLabelArg || '지역';
  const isRegion = (dimLabel === '지역');
  const dimJosaIga = _josa(dimLabel, '이', '가'); // '지역'→이 · '반'→이 (둘 다 받침 있음)
  const subjLabel = (d && d.appliedSubjectLabel) ? d.appliedSubjectLabel : null;
  const scoreNoun = subjLabel ? `${subjLabel} 정답률` : '정답률';
  const ms = (d && d.metrics) || {};
  const sc = ms.avgScore || {};
  const out = { headline:'', trend:'', priority:'' };
  const gapWord = isRegion ? '격차' : '차이';

  // 헤드라인: 평균 정답률 격차 중심
  if (sc.gapPP == null || !sc.top || !sc.bottom){
    out.headline = `${dimLabel} 간 ${scoreNoun} ${gapWord}를 산출할 표본이 부족합니다.`;
  } else {
    const gap = Number(sc.gapPP);
    const topL = sc.top.label, botL = sc.bottom.label;
    let verdict;
    if (isRegion){
      if (gap >= 15) verdict = '격차가 큽니다. 하위 지역 집중 지원을 검토하세요.';
      else if (gap >= 8) verdict = '중간 수준 격차입니다. 추세를 함께 확인하세요.';
      else verdict = '격차가 크지 않습니다.';
    } else {
      if (gap >= 15) verdict = '반 사이 차이가 큽니다. 가장 낮은 반을 먼저 살펴보세요.';
      else if (gap >= 8) verdict = '차이가 어느 정도 있어요. 낮은 반을 확인해 보세요.';
      else verdict = '반 사이 차이는 크지 않아요.';
    }
    out.headline = `${dimLabel} 간 평균 ${scoreNoun} ${gapWord}는 ${gap}%p입니다. ${escapeHtml(topL)}(최상위)${_josa(topL,'과','와')} ${escapeHtml(botL)}(최하위)의 차이로, ${verdict}`;
  }

  // 추세: 최근 3개 기간 헤드라인 격차 변화
  const pts = (d && d.trend && Array.isArray(d.trend.points)) ? d.trend.points.filter(p=>!p.masked && p.gapPP!=null) : [];
  if (pts.length >= 2){
    const first = Number(pts[0].gapPP), last = Number(pts[pts.length-1].gapPP);
    const delta = Math.round((last - first) * 10) / 10;
    let dir;
    if (delta > 1) dir = '벌어짐';
    else if (delta < -1) dir = '좁혀짐';
    else dir = '유지';
    const prev = pts[pts.length-2] ? Number(pts[pts.length-2].gapPP) : first;
    const dPrev = Math.round((last - prev) * 10) / 10;
    out.trend = `최근 ${pts.length}개 기간 격차가 ${dir}. 직전 대비 ${dPrev>=0?'+':''}${dPrev}%p`;
  } else {
    out.trend = '격차 추세를 산출할 표본이 부족합니다.';
  }

  // 우선 지원: both_low(활용도·정답률 동반 저조)
  const pu = (d && Array.isArray(d.priorityUnits)) ? d.priorityUnits : [];
  if (pu.length){
    const names = pu.slice(0,3).map(u=>u.label).join(', ');
    const tail = isRegion
      ? '콘텐츠 보급·연수·기기 지원 등 투입 우선순위 후보입니다.'
      : '먼저 살펴보고 수업·과제 참여를 함께 챙겨보면 좋아요.';
    out.priority = `${escapeHtml(names)}${pu.length>3?' 등':''} ${pu.length}개 ${dimLabel}${dimJosaIga} '활용도·${scoreNoun} 동반 저조' 구간입니다. ${tail}`;
  } else {
    out.priority = `'활용도·${scoreNoun} 동반 저조' 구간에 해당하는 ${dimLabel}${dimJosaIga} 없습니다.`;
  }
  return out;
}

VIEWS['a-macro'] = async function(root){
  root.innerHTML = tplLoading(3);
  if (!state._eqLevel)   state._eqLevel = 'all';
  if (!state._eqSubject) state._eqSubject = 'all';
  if (!state._eqPeriod)  state._eqPeriod = '30d';
  state._eqDrillRegion = null; // 전체 재렌더 시 학교 드릴 접힘
  const level = state._eqLevel, subject = state._eqSubject, period = state._eqPeriod;
  const dimLabel = '지역'; // 통합 뷰는 비교 단위를 지역으로 고정

  // apiGet은 state.period를 자동부착하나, 통합뷰는 자체 기간(30d/90d)을 쓴다 → 명시 전달(자동값 덮어씀)
  const qp = { dim:'region', period };
  if (level !== 'all')   qp.school_level = level;
  if (subject !== 'all') qp.subject = subject;
  const d = await apiGet('/api/lrs/stats/equity', qp);
  if (!d || !d.success){ root.innerHTML = tplError('지역별 성취수준 데이터를 불러오지 못했습니다', ()=>VIEWS['a-macro'](root)); return; }

  // 성취수준=정답률 라벨(교과 선택 시 "○○ 정답률"로 적응)
  const subjLabel  = d.appliedSubjectLabel || _eqSubjectLabelOf(subject);
  const scoreLabel = subjLabel ? `${subjLabel} 정답률` : '성취수준(정답률)';
  const scoreShort = subjLabel ? `${subjLabel} 정답률` : '정답률';
  const axisTitle  = subjLabel ? `${subjLabel} 정답률(0~100점)` : '성취수준(정답률, 0~100점)';

  const units = Array.isArray(d.units) ? d.units : [];
  const visible = units.filter(u => !u.masked);
  const maskedCnt = units.length - visible.length;
  // 빈 상태: 표본 충족 지역 < 2면 격차 산출 불가
  if (visible.length < 2){
    const cond = _eqSummaryText(level, subject, period);
    const msg = cond
      ? `선택하신 조건(${cond})에는 집계할 정답률 데이터가 부족해요. 학교급이나 교과를 바꿔보세요.`
      : `격차를 산출할 지역 표본이 부족합니다(최소 2개 지역, 각 ${d.minSample||10}명 이상)`;
    root.innerHTML = _renderEquityChips(d) + _seedHintEmpty(msg);
    _bindEquityChips(root);
    return;
  }

  const ms = d.metrics || {};
  const mScore = ms.avgScore || {};
  const mActive = ms.activeRate || {};
  const mActs = ms.actsPerStu || {};
  const mReach = ms.reachRate || {};
  const ins = _equityInsight(d);
  const fmtPP = (v)=> (v==null?'-':Number(v).toFixed(1));
  const fmtX  = (v)=> (v==null?'-':Number(v).toFixed(1));
  // CV(변동계수, %) 보조 노출 — 헤드라인은 격차(gap) 유지, CV는 "산포(고른 정도)"를 kpi-extra 한 줄로.
  //   BE 미반영(cv 없음)이면 라인 자체를 생략(폴백 안전).
  const cvExtra = (cv)=>{
    const n = Number(cv);
    if (cv==null || isNaN(n)) return '';
    return `<i class="fas fa-arrows-left-right-to-line kpi-extra-ico" aria-hidden="true"></i>`
      + `<span>지역 간 산포(변동계수) <b>${n.toFixed(0)}%</b> · 낮을수록 고름</span>`;
  };

  root.innerHTML = `
    ${_renderEquityChips(d)}
    <div class="dc-kpi-grid">
      ${kpiCard(`${scoreLabel} 격차`, fmtPP(mScore.gapPP), '%p',
        {dir:'flat', text: mScore.top&&mScore.bottom ? `${escapeHtml(mScore.top.label)}↔${escapeHtml(mScore.bottom.label)}` : '최상위↔최하위'},
        _equityGapTone(mScore.gapPP), cvExtra(mScore.cv))}
      ${kpiCard('활성률 격차', fmtPP(mActive.gapPP), '%p',
        {dir:'flat', text: mActive.top&&mActive.bottom ? `${escapeHtml(mActive.top.label)}↔${escapeHtml(mActive.bottom.label)}` : '주간활동 학생비중'},
        _equityGapTone(mActive.gapPP), cvExtra(mActive.cv))}
      ${kpiCard('1인당 활동', fmtX(mActs.gapX), '배',
        {dir:'flat', text: mActs.top&&mActs.bottom ? `${escapeHtml(mActs.top.label)}↔${escapeHtml(mActs.bottom.label)}` : '최다÷최소'},
        _equityGapToneX(mActs.gapX), cvExtra(mActs.cv))}
      ${kpiCard('도달률 격차', fmtPP(mReach.gapPP), '%p',
        {dir:'flat', text: mReach.top&&mReach.bottom ? `${escapeHtml(mReach.top.label)}↔${escapeHtml(mReach.bottom.label)}` : '성취기준 도달 학생비중'},
        _equityGapTone(mReach.gapPP), cvExtra(mReach.cv))}
    </div>

    <section class="dc-insight-banner" style="margin-bottom:var(--space-4);">
      <span class="ib-icon">💡</span>
      <div>
        <div style="font-weight:700;color:var(--gray-900);margin-bottom:4px;">지역 간 ${escapeHtml(scoreShort)} 격차</div>
        <div style="line-height:1.7;">${ins.headline}</div>
      </div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>지역별 ${escapeHtml(scoreLabel)}</h2><div class="subtitle">평균 정답률 내림차순 · 하위 3개 지역 빨강 강조${maskedCnt?` · 표본 부족 ${maskedCnt}개 제외`:''}</div></header>
      <div class="chart-body" style="height:${Math.max(280, visible.length*34)}px;"><canvas id="aEquityBar" role="img" aria-label="지역별 ${escapeAttr(scoreLabel)} 막대"></canvas></div>
    </section>

    <section class="dc-chart-wrapper" id="aEquityCrossLevelSec">
      <header><h2>학교급별 지역 격차</h2><div class="subtitle">초·중·고 각 학교급에서 지역 간 평균 ${escapeHtml(scoreShort)}이 얼마나 벌어졌는지 · 셀 색: 초록(높음)↔빨강(낮음), 회색 대각선(표본 부족)</div></header>
      <div id="aEquityCrossLevel"></div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>우선 지원 후보 지역</h2><div class="subtitle">${subjLabel ? `${escapeHtml(subjLabel)} 활용도와 정답률이` : '활용도와 성취(정답률)가'} 함께 낮아 먼저 지원이 필요한 지역이에요.</div></header>
      <div id="aEquityPriority"></div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>격차 추세</h2><div class="subtitle">최근 3개 기간 ${escapeHtml(scoreShort)} 격차(%p) 추이</div></header>
      <div class="chart-body" style="height:260px;"><canvas id="aEquityTrend" role="img" aria-label="격차 추세 라인"></canvas></div>
      <div class="insight" aria-live="polite" style="margin-top:10px;">📈 ${escapeHtml(ins.trend)}</div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>지역별 상세</h2><div class="subtitle">행을 누르면 그 지역 학교별 정답률을 펼쳐 볼 수 있어요 · 열 머리글로 정렬${maskedCnt?` · 표본 부족 ${maskedCnt}개 회색 표기`:''}</div></header>
      <div id="aEquityTable"></div>
    </section>`;

  _bindEquityChips(root);

  // ③ 지역별 성취수준(정답률) 막대 (정답률 내림차순, 최하위 3개 빨강)
  const barRows = visible.slice().sort((a,b)=>(b.avgScore||0)-(a.avgScore||0));
  const lowSet = new Set(barRows.slice(-3).map(u=>u.id));
  mkChart(document.getElementById('aEquityBar'),'bar',{
    labels: barRows.map(u=>u.label),
    datasets:[{ label: scoreLabel, data: barRows.map(u=>u.avgScore),
      backgroundColor: barRows.map(u=> lowSet.has(u.id) ? '#dc2626' : 'var(--chart-1)') }]
  }, {
    indexAxis:'y',
    scales:{ x:{ min:0, max:100, title:{display:true,text:axisTitle} } },
    plugins:{ legend:{display:false},
      tooltip:{ callbacks:{
        label:(item)=> `${item.label} · ${scoreShort} ${Number(item.raw).toFixed(1)}점`,
        afterLabel:(item)=> lowSet.has(barRows[item.dataIndex].id) ? '하위 3개 — 집중 지원 후보' : '' } } }
  });

  // ④ 학교급×지역 교차 격차 히트맵 — 학교급=전체일 때만(특정 급 안 급×지역 교차는 무의미)
  if (level === 'all'){
    _renderEquityCrossLevel(d);
  } else {
    const clSec = document.getElementById('aEquityCrossLevelSec');
    if (clSec) clSec.style.display = 'none';
  }

  // ⑤ 우선 지원 후보 지역 (목록 카드만 — 산점도 제거) · d.priorityUnits(both_low) 그대로
  const pri = Array.isArray(d.priorityUnits) ? d.priorityUnits : [];
  const priHost = document.getElementById('aEquityPriority');
  if (priHost){
    if (pri.length){
      priHost.innerHTML = `
        <div class="dc-state-panel" role="status" style="text-align:left;border-left:4px solid #dc2626;background:#fef2f2;margin:0;">
          <div style="font-weight:700;color:#991b1b;margin-bottom:6px;"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i> 우선 지원 후보 지역</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;">
            ${pri.map(u=>`<span class="dc-badge dc-badge--danger">${escapeHtml(u.label)}</span>`).join('')}
          </div>
          <div style="line-height:1.7;color:var(--gray-800);">${ins.priority}</div>
        </div>`;
    } else {
      priHost.innerHTML = `<div class="dc-state-panel" role="status" style="text-align:left;border-left:4px solid #15803d;background:#f0fdf4;margin:0;">
        <div style="line-height:1.7;color:var(--gray-800);">${ins.priority}</div></div>`;
    }
  }

  // ⑥ 격차 추세 라인 (3점, masked 점 생략)
  const tPts = (d.trend && Array.isArray(d.trend.points)) ? d.trend.points : [];
  if (tPts.length){
    mkChart(document.getElementById('aEquityTrend'),'line',{
      labels: tPts.map(p=>p.periodLabel || p.label || ''),
      datasets:[{
        label:`${scoreShort} 격차(%p)`,
        // masked 구간은 점·선 생략(null)
        data: tPts.map(p=> p.masked ? null : (p.gapPP==null?null:Number(p.gapPP))),
        borderColor:'#dc2626', backgroundColor:'rgba(220,38,38,0.12)',
        spanGaps:false, tension:0.25, fill:true, pointRadius:5, pointHoverRadius:7
      }]
    }, {
      scales:{ y:{ beginAtZero:true, title:{display:true,text:'격차(%p)'} } },
      plugins:{ legend:{display:false},
        tooltip:{ callbacks:{ label:(item)=> item.raw==null ? '표본 부족' : `격차 ${Number(item.raw).toFixed(1)}%p` } } }
    });
    // masked 구간 안내 캡션
    const maskedPts = tPts.filter(p=>p.masked).length;
    if (maskedPts){
      const wrap = document.getElementById('aEquityTrend').closest('.dc-chart-wrapper');
      const cap = document.createElement('div');
      cap.style.cssText = 'font-size:var(--fs-sm);color:var(--gray-600);margin-top:6px;';
      cap.textContent = `표본 부족 ${maskedPts}개 기간은 점 생략`;
      if (wrap) wrap.appendChild(cap);
    }
  } else {
    document.getElementById('aEquityTrend').closest('.dc-chart-wrapper').querySelector('.chart-body').innerHTML =
      _seedHintEmpty('격차 추세 표본이 부족해요');
  }

  // ⑦ 상세 표 (마스킹 행 회색 표기, 정렬 가능) — 행 클릭 시 학교 1단 인라인 드릴
  const QUAD_BADGE = {
    both_low: { cls:'dc-badge--danger',  label:'동반 저조' },
    use_low:  { cls:'dc-badge--warning', label:'활용 저조' },
    ach_low:  { cls:'dc-badge--warning', label:'성취 저조' },
    good:     { cls:'dc-badge--success', label:'양호' }
  };
  renderDataTable(document.getElementById('aEquityTable'), {
    columns:[
      { key:'label', label:dimLabel },
      { key:'students', label:'학생수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'activeRate', label:'활성률(%)', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">표본 부족</span>' : escapeHtml(v==null?'-':Number(v).toFixed(1)) },
      { key:'avgActsPerStudent', label:'1인당활동(건)', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml(v==null?'-':Number(v).toFixed(1)) },
      { key:'avgLearnMin', label:'평균학습시간(분)', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'avgScore', label:scoreLabel, align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml(v==null?'-':Number(v).toFixed(1)) },
      { key:'reachRate', label:'도달률(%)', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml(v==null?'-':Number(v).toFixed(1)) },
      { key:'quadrant', label:'구간', align:'center', format:(v,r)=>{
          if (r.masked) return '<span style="color:var(--gray-400);">·</span>';
          const q = QUAD_BADGE[v] || QUAD_BADGE.good;
          return `<span class="dc-badge ${q.cls}">${q.label}</span>`;
        } }
    ],
    rows: units, initialSort:'avgScore', initialDir:'desc',
    onRowClick:(row)=>{ _toggleEquitySchoolDrill(row); }
  });
};

/* 통합 뷰 필터바 — 학교급·교과·기간 3필터 + 정의 캡션 + 적용 필터 요약칩(현재위치 피드백).
   교과 칩은 availableSubjects(present) 데이터 주도(죽은 칩 방지). aWeak 필터와 동일 chip 컴포넌트. */
function _renderEquityChips(d){
  const lv = state._eqLevel || 'all';
  const subj = state._eqSubject || 'all';
  const per = state._eqPeriod || '30d';
  const avail = (d && Array.isArray(d.availableSubjects)) ? d.availableSubjects.filter(s=>s && s.present) : [];
  const subjToggle = avail.length ? `
        <div class="dc-unit-toggle" id="aEquitySubjectToggle" role="group" aria-label="교과 선택">
          <span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(avail, subj)}
        </div>` : '';
  return `
    <div class="dc-chart-wrapper dc-eq-filterbar" style="margin-bottom:var(--space-4);">
      <div class="dc-eq-filters">
        <div class="dc-unit-toggle" id="aEquityLevelToggle" role="group" aria-label="학교급 선택">
          <span class="dc-eq-flabel">학교급</span>${_eqLevelChipsHtml(lv)}
        </div>${subjToggle}
        <div class="dc-unit-toggle" id="aEquityPeriodToggle" role="group" aria-label="기간 선택">
          <span class="dc-eq-flabel">기간</span>
          <button class="chip" type="button" data-eperiod="30d" aria-pressed="${per==='30d'}">30일</button>
          <button class="chip" type="button" data-eperiod="90d" aria-pressed="${per==='90d'}">90일</button>
        </div>
      </div>
      <div class="dc-eq-caption">성취수준 = 채점형 학습활동(평가·과제·문항풀이·오늘의 학습 등)의 평균 정답률(0~100점)이에요.</div>
      ${_eqSummaryChip(lv, subj, per)}
    </div>`;
}
function _bindEquityChips(root){
  root.querySelectorAll('#aEquityLevelToggle button[data-lv]').forEach(btn=>{
    btn.onclick = ()=>{ if (state._eqLevel===btn.dataset.lv) return; state._eqLevel = btn.dataset.lv; VIEWS['a-macro'](root); };
  });
  root.querySelectorAll('#aEquitySubjectToggle button[data-subj]').forEach(btn=>{
    btn.onclick = ()=>{ if (state._eqSubject===btn.dataset.subj) return; state._eqSubject = btn.dataset.subj; VIEWS['a-macro'](root); };
  });
  root.querySelectorAll('#aEquityPeriodToggle button[data-eperiod]').forEach(btn=>{
    btn.onclick = ()=>{ if (state._eqPeriod===btn.dataset.eperiod) return; state._eqPeriod = btn.dataset.eperiod; VIEWS['a-macro'](root); };
  });
}

/* 평균성취(0~100) → 히트맵 셀 배경색: 낮음(빨강) ↔ 높음(초록). 도달선 60 부근을 노랑으로.
   masked 셀은 CSS(.dc-clr-cell.masked)가 회색 대각선 처리하므로 여기선 유효 셀만 색칠. */
function _equityScoreColor(score){
  const s = Math.max(0, Math.min(100, Number(score)||0));
  // 3구간 보간: 0~50 빨강→주황, 50~75 주황→연두, 75~100 연두→초록
  let r,g,b;
  if (s < 50){ const t=s/50; r=220; g=Math.round(38+(158-38)*t); b=38; }        // #dc2626 → #dc9e26(주황)
  else if (s < 75){ const t=(s-50)/25; r=Math.round(220+(132-220)*t); g=Math.round(158+(179-158)*t); b=Math.round(38+(45-38)*t); } // 주황 → #84b32d(연두)
  else { const t=(s-75)/25; r=Math.round(132+(21-132)*t); g=Math.round(179+(128-179)*t); b=Math.round(45+(61-45)*t); }         // 연두 → #15803d(초록)
  return `rgb(${r},${g},${b})`;
}

/* ⑤-½ 학교급×지역 교차 격차 — crossLevelRegion(초·중·고 3행) 컴팩트 히트맵 + 행별 격차 요약 + 분석멘트.
   BE 미반영(crossLevelRegion 없음/빈배열)이면 섹션 통째로 숨김(폴백 안전, 다른 뷰 회귀 없음). */
function _renderEquityCrossLevel(d){
  const host = document.getElementById('aEquityCrossLevel');
  const sec  = document.getElementById('aEquityCrossLevelSec');
  if (!host) return;
  const rows = (d && Array.isArray(d.crossLevelRegion)) ? d.crossLevelRegion : [];
  // BE 미반영 → 섹션 숨김(빈 껍데기 방지)
  if (!rows.length){ if (sec) sec.style.display = 'none'; return; }
  if (sec) sec.style.display = '';

  // 열(지역) 순서: 모든 행 cells를 합쳐 지역 등장 순서를 안정적으로 수집(중복 제거).
  const colOrder = [];
  const colLabel = {};
  rows.forEach(r=>{
    (Array.isArray(r.cells)?r.cells:[]).forEach(c=>{
      const key = String(c.region);
      if (!(key in colLabel)){ colLabel[key] = c.regionLabel || key; colOrder.push(key); }
    });
  });

  // 헤더
  const headCells = colOrder.map(k=>`<th scope="col" title="${escapeAttr(colLabel[k])}">${escapeHtml(colLabel[k])}</th>`).join('');
  const thead = `<thead><tr>
      <th scope="col" class="dc-clr-corner">학교급 \\ 지역</th>
      ${headCells}
      <th scope="col" style="text-align:left;">지역 간 격차</th>
    </tr></thead>`;

  // 본문 3행
  const bodyRows = rows.map(r=>{
    const cellByRegion = {};
    (Array.isArray(r.cells)?r.cells:[]).forEach(c=>{ cellByRegion[String(c.region)] = c; });
    const tds = colOrder.map(k=>{
      const c = cellByRegion[k];
      if (!c || c.masked || c.avgScore==null){
        return `<td class="dc-clr-cell masked" title="${escapeAttr(colLabel[k])} · 표본 부족" aria-label="${escapeAttr(colLabel[k])} 표본 부족">-</td>`;
      }
      const v = Number(c.avgScore);
      const stu = c.students!=null ? ` · ${Number(c.students).toLocaleString()}명` : '';
      return `<td class="dc-clr-cell" style="background:${_equityScoreColor(v)};"`
        + ` title="${escapeAttr(r.levelLabel||r.level)} · ${escapeAttr(colLabel[k])} · 평균 ${v.toFixed(1)}점${stu}">`
        + `${v.toFixed(0)}</td>`;
    }).join('');
    // 행별 격차 요약(최상위↔최하위)
    const gap = (r.regionGapPP==null) ? null : Number(r.regionGapPP);
    const gapTone = gap==null ? 'muted' : (gap>=15?'danger':gap>=8?'warning':'success');
    const gapColor = { danger:'#dc2626', warning:'#b45309', success:'#15803d', muted:'var(--gray-500)' }[gapTone];
    let gapHtml;
    if (gap==null){
      gapHtml = `<span style="color:var(--gray-400);">표본 부족</span>`;
    } else {
      const topL = r.top && r.top.label ? escapeHtml(r.top.label) : '최상위';
      const botL = r.bottom && r.bottom.label ? escapeHtml(r.bottom.label) : '최하위';
      gapHtml = `<span class="dc-clr-gap-v" style="color:${gapColor};">${gap.toFixed(1)}%p</span>`
        + `<span style="color:var(--gray-500);"> (${topL}↔${botL})</span>`;
    }
    return `<tr>
      <th scope="row" class="dc-clr-rowlab">${escapeHtml(r.levelLabel||r.level||'-')}</th>
      ${tds}
      <td class="dc-clr-gap">${gapHtml}</td>
    </tr>`;
  }).join('');

  const legend = `<div class="dc-clr-legend">
      <span class="sw"><i style="background:${_equityScoreColor(90)};"></i>높음</span>
      <span class="sw"><i style="background:${_equityScoreColor(62)};"></i>보통</span>
      <span class="sw"><i style="background:${_equityScoreColor(35)};"></i>낮음</span>
      <span class="sw"><i style="background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 4px,#cbd5e1 4px,#cbd5e1 8px);"></i>표본 부족</span>
    </div>`;

  // 분석멘트: 격차가 가장 큰 학교급 지목(규칙기반, _equityInsight 톤)
  const insight = _equityCrossLevelInsight(rows);

  host.innerHTML = `
    <div class="dc-clr-wrap">
      <table class="dc-clr-table" aria-label="학교급별 지역 평균 성취 히트맵">
        ${thead}
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
    ${legend}
    ${insight ? `<div class="insight" aria-live="polite" style="margin-top:12px;line-height:1.7;">💡 ${insight}</div>` : ''}`;
}

/* 학교급×지역 교차 분석멘트 — "격차가 가장 큰 학교급"을 규칙기반으로 지목 */
function _equityCrossLevelInsight(rows){
  const valid = (rows||[]).filter(r=>r.regionGapPP!=null && !isNaN(Number(r.regionGapPP)));
  if (!valid.length) return '학교급별 지역 격차를 산출할 표본이 부족합니다.';
  const sorted = valid.slice().sort((a,b)=>Number(b.regionGapPP)-Number(a.regionGapPP));
  const worst = sorted[0];
  const gap = Number(worst.regionGapPP);
  const lvl = escapeHtml(worst.levelLabel || worst.level || '해당 학교급');
  const bot = (worst.bottom && worst.bottom.label) ? escapeHtml(worst.bottom.label) : '하위 지역';
  let tail;
  if (gap >= 15) tail = `해당 학교급 하위 지역(${bot} 등) 우선 지원을 검토하세요.`;
  else if (gap >= 8) tail = `추세와 함께 하위 지역 지원 필요성을 확인하세요.`;
  else tail = `학교급 간 지역 격차는 크지 않습니다.`;
  return `지역 격차는 <b>${lvl}</b>에서 가장 큽니다(${gap.toFixed(1)}%p). ${tail}`;
}

/* ======================================================================
 * [교사] 반별 비교 (VIEWS['t-classcompare']) — 관리자 지역별 성취수준 비교(a-macro)의 반(클래스)판.
 *   비교 단위 = 교사 본인 담당 active 반. 지역비교와 동일 형상(막대+표+우선목록) 재사용으로 인지 전이.
 *   단순화: 학교급 필터·CV·격차추세·산점도 없음(반 2~3개엔 과함). 교과·기간 2필터.
 *   프라이버시 마스킹 미적용(교사는 자기 반 학생을 이미 실명 열람) — 소표본 반만 "표본 적음·참고용" 캡션.
 *   성취수준 = 채점형 학습활동 평균 정답률(0~100점) — 전 라벨·툴팁 병기.
 *   BE 계약: GET /api/lrs/stats/class-compare?subject=&period=  (routes/lrs.js, 다른 에이전트 구현)
 * ==================================================================== */

/* BE 필드명 방어 정규화 — 렌더러(_equityInsight·renderDataTable)가 쓰는 {id,label}로 통일.
   (task 계약: classId/className · spec: id/label 혼재 가능성 대비) */
function _ccNorm(u){
  if (!u) return u;
  return { ...u,
    id:    (u.id    != null ? u.id    : u.classId),
    label: (u.label != null ? u.label : u.className) };
}
/* 적용 필터 요약 텍스트("수학 · 최근 30일") — state 값 기준 폴백 안전 */
function _ccSummaryText(subject, period){
  const parts = [];
  const s = _eqSubjectLabelOf(subject); if (s) parts.push(s);
  const p = _eqPeriodLabelOf(period);   if (p) parts.push(p);
  return parts.join(' · ');
}
/* BE metrics 누락 대비 폴백 격차 산출(값 배열 [{label,v}] → gapPP/gapX/top/bottom) */
function _ccFallbackMetric(vals){
  const arr = (vals||[]).filter(u=>u.v!=null && !isNaN(Number(u.v)));
  if (arr.length < 2) return { gapPP:null, gapX:null, top:null, bottom:null };
  const sorted = arr.slice().sort((a,b)=>a.v-b.v);
  const bottom = sorted[0], top = sorted[sorted.length-1];
  return {
    gapPP: Math.round((top.v - bottom.v) * 10) / 10,
    gapX:  bottom.v > 0 ? Math.round((top.v / bottom.v) * 10) / 10 : null,
    top:    { label: top.label,    v: top.v },
    bottom: { label: bottom.label, v: bottom.v }
  };
}

/* 반별 비교 필터바(교과·기간 2필터, 학교급 없음) — _renderEquityChips 경량 복제.
   교과 칩은 availableSubjects(present) 데이터 주도(죽은 칩 방지). 정의·다중소속·요약 캡션 포함. */
function _renderClassCmpChips(d){
  const subj = state._ccSubject || 'all';
  const per  = state._ccPeriod  || '30d';
  const avail = (d && Array.isArray(d.availableSubjects)) ? d.availableSubjects.filter(s=>s && s.present) : [];
  const subjToggle = avail.length ? `
        <div class="dc-unit-toggle" id="ccSubjectToggle" role="group" aria-label="교과 선택">
          <span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(avail, subj)}
        </div>` : '';
  const summary = (subj && subj!=='all')
    ? `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(_ccSummaryText(subj, per))}</div>`
    : '';
  return `
    <div class="dc-chart-wrapper dc-eq-filterbar" style="margin-bottom:var(--space-4);">
      <div class="dc-eq-filters">
        ${subjToggle}
        <div class="dc-unit-toggle" id="ccPeriodToggle" role="group" aria-label="기간 선택">
          <span class="dc-eq-flabel">기간</span>
          <button class="chip" type="button" data-ccperiod="30d" aria-pressed="${per==='30d'}">30일</button>
          <button class="chip" type="button" data-ccperiod="90d" aria-pressed="${per==='90d'}">90일</button>
        </div>
      </div>
      <div class="dc-eq-caption">성취수준 = 채점형 학습활동(평가·과제·문항풀이·오늘의 학습 등)의 평균 정답률(0~100점)이에요. <span style="color:var(--gray-500);">한 학생이 두 반에 속하면 각 반 통계에 모두 반영돼요.</span></div>
      ${summary}
    </div>`;
}
function _bindClassCmpChips(root){
  root.querySelectorAll('#ccSubjectToggle button[data-subj]').forEach(btn=>{
    btn.onclick = ()=>{ if (state._ccSubject===btn.dataset.subj) return; state._ccSubject = btn.dataset.subj; VIEWS['t-classcompare'](root); };
  });
  root.querySelectorAll('#ccPeriodToggle button[data-ccperiod]').forEach(btn=>{
    btn.onclick = ()=>{ if (state._ccPeriod===btn.dataset.ccperiod) return; state._ccPeriod = btn.dataset.ccperiod; VIEWS['t-classcompare'](root); };
  });
}

/* ⑥(선택) 반×교과 미니 히트맵 — 행=반, 열=교과, 셀=평균 정답률. 교과=전체일 때만.
   BE classSubjectMatrix 미반영/빈배열이면 섹션 숨김(폴백 안전). _equityScoreColor·.dc-clr-* 재사용. */
function _renderClassSubjectHeat(d){
  const host = document.getElementById('ccHeat');
  const sec  = document.getElementById('ccHeatSec');
  if (!host) return;
  const rows = (d && Array.isArray(d.classSubjectMatrix)) ? d.classSubjectMatrix : [];
  if (!rows.length){ if (sec) sec.style.display = 'none'; return; }
  if (sec) sec.style.display = '';
  // 열(교과) 순서: EQ_SUBJECT_ORDER 우선, 그 외 뒤
  const colOrder = []; const colLabel = {};
  rows.forEach(r=>{ (Array.isArray(r.cells)?r.cells:[]).forEach(c=>{
    const key = String(c.subjectKey);
    if (!(key in colLabel)){ colLabel[key] = c.subjectLabel || EQ_SUBJECT_LABEL[key] || key; colOrder.push(key); }
  }); });
  colOrder.sort((a,b)=>{ const ia=EQ_SUBJECT_ORDER.indexOf(a), ib=EQ_SUBJECT_ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib); });
  if (!colOrder.length){ if (sec) sec.style.display = 'none'; return; }

  const headCells = colOrder.map(k=>`<th scope="col" title="${escapeAttr(colLabel[k])}">${escapeHtml(colLabel[k])}</th>`).join('');
  const thead = `<thead><tr>
      <th scope="col" class="dc-clr-corner">반 \\ 교과</th>
      ${headCells}
      <th scope="col" style="text-align:left;">교과 간 격차</th>
    </tr></thead>`;
  const bodyRows = rows.map(r=>{
    const byS = {}; (Array.isArray(r.cells)?r.cells:[]).forEach(c=>{ byS[String(c.subjectKey)] = c; });
    const vals = [];
    const tds = colOrder.map(k=>{
      const c = byS[k];
      if (!c || c.masked || c.avgScore==null){
        return `<td class="dc-clr-cell masked" title="${escapeAttr(colLabel[k])} · 표본 적음" aria-label="${escapeAttr(colLabel[k])} 표본 적음">-</td>`;
      }
      const v = Number(c.avgScore); vals.push({ label:colLabel[k], v });
      const stu = c.students!=null ? ` · ${Number(c.students).toLocaleString()}명` : '';
      const nm = r.className || r.label || '';
      return `<td class="dc-clr-cell" style="background:${_equityScoreColor(v)};" title="${escapeAttr(nm)} · ${escapeAttr(colLabel[k])} · 평균 ${v.toFixed(1)}점${stu}">${v.toFixed(0)}</td>`;
    }).join('');
    let gapHtml;
    if (vals.length >= 2){
      vals.sort((a,b)=>a.v-b.v);
      const lo = vals[0], hi = vals[vals.length-1];
      const gap = Math.round((hi.v - lo.v) * 10) / 10;
      const tone = gap>=15 ? '#dc2626' : gap>=8 ? '#b45309' : '#15803d';
      gapHtml = `<span class="dc-clr-gap-v" style="color:${tone};">${gap.toFixed(1)}%p</span>`
        + `<span style="color:var(--gray-500);"> (${escapeHtml(hi.label)}↔${escapeHtml(lo.label)})</span>`;
    } else {
      gapHtml = `<span style="color:var(--gray-400);">표본 적음</span>`;
    }
    const nm = r.className || r.label || '-';
    return `<tr><th scope="row" class="dc-clr-rowlab">${escapeHtml(nm)}</th>${tds}<td class="dc-clr-gap">${gapHtml}</td></tr>`;
  }).join('');
  const legend = `<div class="dc-clr-legend">
      <span class="sw"><i style="background:${_equityScoreColor(90)};"></i>높음</span>
      <span class="sw"><i style="background:${_equityScoreColor(62)};"></i>보통</span>
      <span class="sw"><i style="background:${_equityScoreColor(35)};"></i>낮음</span>
      <span class="sw"><i style="background:repeating-linear-gradient(45deg,#e2e8f0,#e2e8f0 4px,#cbd5e1 4px,#cbd5e1 8px);"></i>표본 적음</span>
    </div>`;
  host.innerHTML = `<div class="dc-clr-wrap"><table class="dc-clr-table" aria-label="반별 교과 평균 정답률 히트맵">${thead}<tbody>${bodyRows}</tbody></table></div>${legend}`;
}

/* ④ 반 상세표 행 클릭 → 그 반 교과별 정답률 인라인 드릴(모달 아님, 재클릭 접힘).
   응답 내장 classSubjectMatrix 재사용 → 추가 API 호출 0. .eq-drill-* 스타일 재사용. */
function _toggleClassSubjectDrill(row, d){
  const table = document.getElementById('ccTable');
  if (!table || !row) return;
  let targetTr = null;
  table.querySelectorAll('tbody tr[data-row-id]').forEach(tr=>{
    if (tr.getAttribute('data-row-id') === String(row.id)) targetTr = tr;
  });
  if (!targetTr) return;
  const colspan = targetTr.children.length;
  const existing = table.querySelector('tr.eq-drill-row');
  const openedFor = existing ? existing.getAttribute('data-drill-for') : null;
  if (existing) existing.remove();
  if (openedFor === String(row.id)){ state._ccDrillClass = null; return; } // 재클릭 접힘
  state._ccDrillClass = String(row.id);

  const matrix = (d && Array.isArray(d.classSubjectMatrix)) ? d.classSubjectMatrix : [];
  const mrow = matrix.find(m => String(m.classId!=null?m.classId:(m.id!=null?m.id:'')) === String(row.id));
  const cells = (mrow && Array.isArray(mrow.cells)) ? mrow.cells.slice() : [];
  const valid = cells.filter(c => !c.masked && c.avgScore!=null);

  let inner;
  if (!valid.length){
    const subjActive = (state._ccSubject && state._ccSubject!=='all');
    inner = `<div class="eq-drill-empty">${subjActive
      ? '교과 <b>전체</b>를 선택하면 이 반의 교과별 정답률을 펼쳐 볼 수 있어요.'
      : `${escapeHtml(row.label)}에 표시할 교과별 정답률이 아직 부족해요.`}</div>`;
  } else {
    const ordered = cells.slice().sort((a,b)=>{
      const av = (a.masked || a.avgScore==null) ? -1 : a.avgScore;
      const bv = (b.masked || b.avgScore==null) ? -1 : b.avgScore;
      return bv - av;
    });
    const bars = ordered.map(c=>{
      const low = c.masked || c.avgScore==null;
      const sc = low ? null : Number(c.avgScore);
      const w = low ? 0 : Math.max(0, Math.min(100, sc));
      const barColor = low ? 'var(--gray-300)' : _equityScoreColor(sc);
      const valTxt = low ? '<span class="edb-low">표본 적음</span>' : `${sc.toFixed(1)}점`;
      const stu = (c.students!=null) ? ` · ${Number(c.students).toLocaleString()}명` : '';
      const nm = c.subjectLabel || EQ_SUBJECT_LABEL[c.subjectKey] || c.subjectKey || '-';
      return `<div class="eq-drill-bar${low?' is-low':''}">
          <span class="edb-name" title="${escapeAttr(nm)}${escapeAttr(stu)}">${escapeHtml(nm)}</span>
          <span class="edb-track"><span class="edb-fill" style="width:${w}%;background:${barColor};"></span></span>
          <span class="edb-val">${valTxt}</span>
        </div>`;
    }).join('');
    inner = `<div class="eq-drill-head"><i class="fas fa-book" aria-hidden="true"></i> ${escapeHtml(row.label)} · 교과별 정답률
        <span class="eq-drill-sub">정답률 내림차순 · 표본 적은 교과는 회색</span></div>
      <div class="eq-drill-bars">${bars}</div>`;
  }
  const panel = document.createElement('tr');
  panel.className = 'eq-drill-row';
  panel.setAttribute('data-drill-for', String(row.id));
  panel.innerHTML = `<td colspan="${colspan}"><div class="eq-drill">${inner}</div></td>`;
  targetTr.after(panel);
}

VIEWS['t-classcompare'] = async function(root){
