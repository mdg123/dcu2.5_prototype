/* ===== 학생: 내 학습 요약 ===== */
VIEWS['s-home'] = async function(root){
  root.innerHTML = tplLoading(4);
  const uid = state.me && state.me.id;
  const [insights, daily, dash, snapNow] = await Promise.all([
    uid ? apiGet(`/api/lrs/insights/${uid}`) : Promise.resolve(null),
    apiGet('/api/lrs/stats/daily'),
    apiGet('/api/lrs/dashboard'),
    // 오늘/어제 학습시간 델타용 — period 미부착 직접 호출(apiGet 우회로 30일 벌어짐 방지)
    _fetchNoPeriod('/api/lrs/stats/daily-snapshot')
  ]);

  // API shape: {snapshot:{streakDays, periodDurationMin, weeklyTarget, periodScoreAvg, scoreBasis,
  //             completedAssignments, todayLearnActs, todayActs, todayContentViews,
  //             yesterdayLearnActs, weeklyScoreAvg, engagementIndex}, weaknesses:[...]}
  const snap = (insights && insights.snapshot) || {};
  const weakList = (insights && insights.weaknesses) || [];
  const dashStats = (dash && dash.stats) || {};
  const totalMinutes = snap.periodDurationMin != null
    ? Number(snap.periodDurationMin)
    : (snap.weeklyDurationMin != null ? Number(snap.weeklyDurationMin) : (dashStats.totalDurationMinutes || 0));
  // 평균 성취: 0~100 정규화 평균(periodScoreAvg). 채점 데이터 0이면 null → "—"로 표기(0점으로 찍지 않음).
  const periodScoreAvg = (snap.periodScoreAvg != null && !isNaN(Number(snap.periodScoreAvg)))
    ? Math.round(Number(snap.periodScoreAvg) * 10) / 10
    : null;
  const scoreBasis = snap.scoreBasis || '채점된 평가·문항의 평균 정답률';
  const streakDays = snap.streakDays || 0;
  // "낸 과제" = 실제 과제 제출/이수 건수(completedAssignments). 총 활동수(totalActivities) 아님.
  const submittedAssignments = Number(snap.completedAssignments)||0;
  // 기간 내 "학습한 날"(활동일 수) = 일별 데이터에서 활동 1건↑ 있던 날 수.
  const activeDays = ((daily && daily.data) || []).filter(d => (Number(d.count)||0) > 0).length;
  // 오늘/어제 학습시간(분) — 스냅샷 3카드 슬롯2 델타용
  const snapT = (snapNow && snapNow.today) || {};
  const snapY = (snapNow && snapNow.yesterday) || {};
  const todayDurationMin = Number(snapT.durationMin)||0;
  const yesterdayDurationMin = Number(snapY.durationMin)||0;
  const summary = { total_minutes: totalMinutes, avg_score: periodScoreAvg, score_basis: scoreBasis,
                    streak_days: streakDays, active_days: activeDays, submitted_assignments: submittedAssignments };

  // 관리자 계정이 학생 뷰 (scope=mine) 로 볼 때 전부 0이면 안내
  const allZero = !totalMinutes && !submittedAssignments && !periodScoreAvg && !streakDays;
  const isAdminAsStudent = (state.me && state.me.role === 'admin') && state.role === 'student';
  const adminHintHtml = (allZero && isAdminAsStudent) ? `
    <div class="dc-state-panel" role="status" style="border-left:4px solid var(--lrs-primary);background:rgba(37,99,235,.06);margin-bottom:12px;">
      <i class="fas fa-lightbulb" aria-hidden="true"></i>
      <p>관리자 계정의 개인 학습 데이터가 없습니다. 실제 학생 화면을 보려면 학생 계정으로 로그인하거나 <button type="button" class="btn" id="sHomeSampleBtn" style="margin-left:6px;"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기</button> 버튼을 클릭하세요.</p>
    </div>` : '';

  // ── B. 기간 KPI 4카드 — "무엇을 세는지" 명확화(스펙 B-1) ──
  //   슬롯3 평균 성취: periodScoreAvg(0~100). null이면 "—"·단위 숨김·"아직 채점된 평가가 없어요".
  const scoreVal = (summary.avg_score != null) ? String(summary.avg_score) : '—';
  const scoreUnit = (summary.avg_score != null) ? '점' : '';
  const scoreTrend = (summary.avg_score != null)
    ? { dir:'flat', text: summary.score_basis }
    : { dir:'flat', text:'아직 채점된 평가가 없어요' };
  const assignTrend = (summary.submitted_assignments > 0)
    ? { dir:'flat', text:'이번 기간 제출·이수한 과제' }
    : { dir:'flat', text:'이번 기간 낸 과제가 없어요' };
  const kpiHtml = `
    <div class="dc-kpi-grid">
      ${kpiCard('이번 기간 학습시간', (summary.total_minutes||0).toLocaleString(), '분', {dir:'flat', text:'이번 기간 공부한 시간'}, 'primary',
        '<div class="dc-gauge" id="sHomeGauge"></div>')}
      ${kpiCard('낸 과제',           (summary.submitted_assignments||0).toLocaleString(), '건', assignTrend, 'success')}
      ${kpiCard('평균 성취',          scoreVal, scoreUnit, scoreTrend, 'primary')}
      ${kpiCard('학습한 날',          (summary.active_days||0),                 '일', {dir:'flat', text:'이번 기간 공부한 날 수'}, 'warning')}
    </div>`;

  // ── C. 일별 추이(전폭) + 통합 약점 순위 리스트(전폭) — 막대·카드 중복 제거 ──
  const dailyHtml = `
    <section class="dc-chart-wrapper" aria-label="일별 학습시간 추이">
      <header><div><h2>일별 학습시간 추이</h2><div class="subtitle">최근 기간</div></div></header>
      <div class="chart-body"><canvas id="sHomeDaily" role="img" aria-label="일별 학습시간 추이 차트"></canvas></div>
    </section>`;
  const weakHtml = `
    <section class="dc-chart-wrapper" aria-label="보완 추천 단원">
      <header><div><h2>보완 추천 단원</h2>
        <div class="subtitle">정답률이 낮거나 아직 채점 전이라 더 연습하면 좋은 단원이에요</div></div></header>
      <div id="sWeakList" class="s-weak-list"></div>
    </section>`;

  // ── P1-1: 3구간 IA(KERIS 개선① — 이력·현황·계획) — 스펙 §2-4 ──
  //   기존 요소 순서 변경 0: 구간 3개로 래핑 + 회색 헤더 + 4px 액센트 바만 추가.
  //   구간 라벨은 전 학령 공통(LEVEL_CONFIG 확장 없음). 격식어(이력/현황/계획) 화면 노출 금지.
  //   "이력" 최근 활동 타임라인은 홈 신설 금지 — 구간② 헤더 우측 링크(setView('s-perform'))로 대체.
  const ZONES = {   // 라벨·액센트 색 단일 정의(향후 학령 차등 필요 시 이 객체만 확장)
    now:  { label:'지금 나의 학습',   bar:'#2563eb' },   // primary
    flow: { label:'지금까지의 흐름',  bar:'#16a34a' },   // success(도달 초록과 동일 계열)
    next: { label:'다음에 할 것',     bar:'#f59e0b' },   // warning(권장 노랑과 동일 계열)
  };
  root.innerHTML = adminHintHtml + `
    <div class="sh-zone" data-zone="now">
      <div class="sh-zone__head"><span class="sh-zone__bar" style="background:${ZONES.now.bar};"></span>${ZONES.now.label}</div>
      <div class="sh-zone__body" id="shZoneNowBody">${kpiHtml}</div>
    </div>
    <div class="sh-zone" data-zone="flow">
      <div class="sh-zone__head"><span class="sh-zone__bar" style="background:${ZONES.flow.bar};"></span>${ZONES.flow.label}
        <button type="button" class="sh-zone__link" id="shZoneFlowLink">최근 활동 자세히 보기 ›</button></div>
      <div class="sh-zone__body">${dailyHtml}</div>
    </div>
    <div class="sh-zone" data-zone="next">
      <div class="sh-zone__head"><span class="sh-zone__bar" style="background:${ZONES.next.bar};"></span>${ZONES.next.label}</div>
      <div class="sh-zone__body">${weakHtml}</div>
    </div>`;

  // 구간② 헤더 링크 → 활동 유형별 수행(s-perform). location.hash 방식 금지(해시 단독 변경으로는 뷰 전환 안 됨 — 스펙 §2-4).
  const flowLink = document.getElementById('shZoneFlowLink');
  if (flowLink) flowLink.addEventListener('click', () => setView('s-perform'));

  // 샘플 학생 보기 버튼 바인딩 (관리자-as-학생 힌트)
  const sampleBtn = document.getElementById('sHomeSampleBtn');
  if (sampleBtn){
    sampleBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      setRole('teacher');
      await setView('t-drill');
      setTimeout(() => {
        const first = (LRS._warnCache||[])[0];
        if (first) LRS.openDrilldown(first);
      }, 300);
    });
  }

  // 게이지 (학습시간 목표 대비 달성률) — 기본 목표치: 7d 60분*7일, 30d 60*30 등
  const targetMin = Number(snap.weeklyTarget) || (state.period==='7d'?420: state.period==='30d'?1800: state.period==='90d'?5400: 1800);
  renderGauge(document.getElementById('sHomeGauge'), summary.total_minutes||0, targetMin, '목표 대비');

  // 일별 추이 차트
  const dailyData = (daily && daily.data) || [];
  if (dailyData.length) {
    mkChart(document.getElementById('sHomeDaily'), 'line', {
      labels: dailyData.map(d => fmtDate(d.stat_date)),
      datasets: [{
        label:'학습시간(분)',
        data: dailyData.map(d => toMinutes(d.total_duration_sec || d.total_duration)),
        borderColor: 'var(--chart-1)', backgroundColor:'rgba(37,99,235,.12)',
        tension:.3, fill:true
      }]
    });
  } else {
    document.getElementById('sHomeDaily').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>일별 학습시간 추이</h2></header>` + tplEmpty('선택한 기간의 데이터가 없어요');
  }

  // ── C. 통합 약점 순위 리스트 (막대 캔버스·중복 카드 제거 → 단일 렌더) ──
  //   weaknesses:[{achievement_code, label, fullLabel, subject_label, attempt_count, avg_score, hasScore}]
  //   한 행: [순위뱃지][단원명+코드][교과배지][지표(정답률 미니바 or 연습 N회)][CTA]
  const weakHost = document.getElementById('sWeakList');
  if (weakList.length) {
    const top5 = weakList.slice(0,5);
    const nameOf = w => (w.label && String(w.label).trim()) || w.achievement_code || '성취기준';
    weakHost.innerHTML = top5.map((w,i)=>{
      const rank = i+1;
      const code = w.achievement_code||'';
      const name = nameOf(w);
      const subjLabel = w.subject_label || '기타';
      const subjCls = _subjectBadgeClass(subjLabel);
      // 지표영역: hasScore면 정답률 미니바, 아니면 "연습 N회"(정직 표기 — 없는 정답률 암시 금지)
      const hasScore = (w.hasScore === true) || (w.avg_score != null);
      const attempts = Number(w.attempt_count)||0;
      let metricHtml;
      if (hasScore) {
        const pct = Math.max(0, Math.min(100, Math.round(Number(w.avg_score)||0)));
        metricHtml = `<div class="s-weak-metric">
          <span class="s-weak-bar" aria-hidden="true"><span class="s-weak-bar__fill" style="width:${pct}%;"></span></span>
          <span class="s-weak-metric__num">정답률 ${pct}%</span>
        </div>`;
      } else {
        metricHtml = `<div class="s-weak-metric"><span class="s-weak-metric__num">연습 ${attempts}회</span></div>`;
      }
      const href = '/self-learn/?achievement_code=' + encodeURIComponent(code);
      // P0-2(추천 리치화, Compact 표기): BE SSOT(insights.weaknesses[].priority/reasonText/estMinutes) 바인딩.
      //   우선순위 뱃지는 교과 배지 왼쪽(시급 빨강/권장 노랑), 이유+예상시간은 코드 줄 아래 둘째 줄.
      //   priority=null(또는 BE 미착륙으로 필드 부재) 행은 뱃지·이유 줄 없음 — FE 자체 재산정 금지.
      const priMap = { urgent:{cls:'pri-urgent', label:'시급'}, recommended:{cls:'pri-recommended', label:'권장'} };
      const pri = priMap[w.priority] || null;
      const priHtml = pri ? `<span class="s-weak-pri ${pri.cls}">${pri.label}</span>` : '';
      const reasonBits = [];
      if (w.reasonText) reasonBits.push(escapeHtml(w.reasonText));
      if (w.estMinutes != null && Number(w.estMinutes) > 0) reasonBits.push(`약 ${Math.round(Number(w.estMinutes))}분`);
      const reasonHtml = reasonBits.length ? `<div class="s-weak-name__reason">${reasonBits.join(' · ')}</div>` : '';
      return `<div class="s-weak-row"${rank===1?' data-top="1"':''}>
        <span class="s-weak-rank"${rank===1?' data-top="1"':''}>${rank}</span>
        <div class="s-weak-name">
          <div class="s-weak-name__title" title="${escapeAttr(w.fullLabel||name)}">${escapeHtml(name)}</div>
          ${code?`<div class="s-weak-name__code">성취기준 ${escapeHtml(code)}</div>`:''}
          ${reasonHtml}
        </div>
        <span class="s-weak-badges">${priHtml}<span class="dc-badge ${subjCls}">${escapeHtml(subjLabel)}</span></span>
        ${metricHtml}
        <a role="button" href="${escapeAttr(href)}" class="btn btn-sm s-weak-cta">
          <i class="fas fa-book-open-reader" aria-hidden="true"></i> 맞춤학습으로 이동
        </a>
      </div>`;
    }).join('');
  } else {
    weakHost.innerHTML = `<div class="dc-state-panel" role="status">
      <i class="fas fa-circle-check" aria-hidden="true" style="color:var(--lrs-secondary);font-size:28px;"></i>
      <p>지금은 더 연습할 단원이 없어요. 잘하고 있어요!</p>
      <a class="btn" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 둘러보기</a>
    </div>`;
  }
  // P1-1(필수): 스냅샷 마운트를 구간① 본문으로 — root 전달 시 afterbegin 삽입이 구간 밖(관리자 힌트 위)으로 새므로 반드시 구간① 내부에 마운트(스펙 §2-4).
  await renderDodMini(document.getElementById('shZoneNowBody') || root, {
    snapshot: snap,
    todayDurationMin, yesterdayDurationMin,
    streakDays: summary.streak_days || 0
  });

  // P0-3(학령 차등): 홈 헤드라인 톤 — LEVEL_CONFIG.headline. 오늘 스냅샷 위 최상단.
  //   (renderDodMini가 afterbegin으로 스냅샷을 넣으므로, 그 뒤에 다시 afterbegin으로 넣어 맨 위 배치)
  root.insertAdjacentHTML('afterbegin',
    `<div class="s-home-headline">${escapeHtml(levelCfg().headline)}</div>`);
};

/* 교과 배지 색 클래스 매핑(스펙 C-5) — .dc-badge에 교과별 색 modifier 부여 */
function _subjectBadgeClass(label){
  const m = { '수학':'subj-math', '국어':'subj-korean', '영어':'subj-english', '과학':'subj-science', '사회':'subj-social' };
  return m[String(label||'').trim()] || 'subj-etc';
}

/* period 미부착 직접 fetch (apiGet의 state.period 자동부착 우회) — daily-snapshot '진짜 오늘' 보장 */
async function _fetchNoPeriod(path){
  try {
    const r = await fetch(path, { credentials:'include' });
    if (!r.ok) return null;
    return await r.json();
  } catch(_){ return null; }
}

/* =====================================================================
 * s-achieve (학생 성취 분석 = 홈) — S1 한눈 + S2 강약 + S4 다음에 뭘?
 *   API: GET /api/lrs/mastery/student/:id
 *   기획서: LRS_성취수준_P0_시각스펙 §3(S2)·§4(S4)·§5(S1)
 * ===================================================================== */
VIEWS['s-achieve'] = async function(root){
  root.innerHTML = tplLoading(3);
  const uid = state.me && state.me.id;
  if (!uid){ root.innerHTML = tplEmpty('로그인 정보를 확인할 수 없어요'); return; }

  // P0-1(재풀이 전·후)·P0-2(추천 SSOT) — mastery와 병렬 페치. apiGet은 실패 시 null(방어).
  const [m, insightsForReco, retryGrowth] = await Promise.all([
    apiGet('/api/lrs/mastery/student/' + encodeURIComponent(uid), {}),
    apiGet('/api/lrs/insights/' + encodeURIComponent(uid)),
    apiGet('/api/lrs/retry-growth/' + encodeURIComponent(uid))
  ]);
  if (!m || !m.success){
    root.innerHTML = tplError('성취 데이터를 불러오지 못했습니다', () => setView('s-achieve'));
    return;
  }

  const counts = m.counts || { total:0, reached:0, partial:0, notReached:0, insufficient:0 };
  const dist = m.distribution || {};
  const bySubject = (m.bySubject || []).filter(x => x.avgRate != null || x.evaluatedCount > 0);
  // P1-2: 스택바는 레이더용 필터를 쓰지 않는다 — 평가부족만 있는 교과(국어형)도 회색 바로 반드시 노출(스펙 §3-3 주의).
  const bySubjectAll = m.bySubject || [];
  // P1-2(학령 분기): 중·고 = 좌측 카드를 교과별 성취수준 스택바로 대체 / 초등 = 현행 레이더(막대 폴백) 유지.
  const useStackbar = !!levelCfg().subjectStackbar;
  const standards = m.standards || [];
  const weaknesses = m.weaknesses || [];
  const strengths = m.strengths || [];

  const evaluatedCount = (counts.reached||0) + (counts.partial||0) + (counts.notReached||0);
  const allInsufficient = counts.total > 0 && evaluatedCount === 0;
  const noData = !counts.total;

  // ── 전체 빈 상태 (데이터 0건) ─────────────────────────────────────────
  if (noData){
    const isAdmin = state.me && state.me.role === 'admin';
    root.innerHTML = `<section class="mastery-section"><div class="mastery-empty">
      <i class="fas fa-award me-icon" aria-hidden="true"></i>
      <p>성취 데이터를 모으는 중이에요. 학습을 진행하면 교과별 성취가 채워져요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        ${isAdmin ? `<button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" id="sAchGotoDrill"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기(교사 뷰)</button>` : ''}
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 풀러 가기</a>
      </div>
    </div></section>`;
    const go = document.getElementById('sAchGotoDrill');
    if (go) go.addEventListener('click', async () => {
      setRole('teacher'); await setView('t-warnings');
    });
    return;
  }

  // ── P1-2: 좌측 카드 분기(스펙 §3-4) — 중·고 스택바 / 초등 현행 레이더 카드 ──
  //   KERIS에서 가져오는 것은 "가로 스택바" 시각 형식뿐 — A~E 등급 매핑 금지, 우리 4상태 어휘·MASTERY_HEX 색 그대로.
  const leftCardHtml = useStackbar ? `
      <section class="mastery-section">
        <div class="ms-head"><div class="ms-titles">
          <h2 class="mastery-h2">교과별 성취수준</h2>
          <div class="mastery-sub">지금까지 배운 성취기준이 교과 안에서 어떤 상태인지 개수로 보여줘요 — 막대 조각을 누르면 목록이 열려요.</div>
        </div></div>
        <div class="subj-stack" id="sSubjStack" role="list" aria-label="교과별 성취수준 분포"></div>
      </section>` : `
      <section class="mastery-section">
        <div class="ms-head"><div class="ms-titles">
          <h2 class="mastery-h2">교과별 평균 정답률</h2>
          <div class="mastery-sub">교과별 맞힌 비율(0~100). 도달률과는 다른 값이에요.</div>
        </div></div>
        <div class="chart-body" style="height:300px;">
          <canvas id="sMastRadar" role="img" aria-label="교과별 평균 성취 레이더"></canvas>
        </div>
      </section>`;

  // ── 화면 골격 (S1 → S2 → S4) ─────────────────────────────────────────
  root.innerHTML = `
    <!-- S1: 내 성취 한눈 -->
    <div class="mastery-grid2">
      ${leftCardHtml}
      <section class="mastery-section">
        <div class="ms-head"><div class="ms-titles">
          <h2 class="mastery-h2">성취기준 도달률</h2>
          <div class="mastery-sub">전체 ${counts.total}개 성취기준 중 도달한 비율 (평가 부족 ${counts.insufficient||0}개 포함)</div>
        </div></div>
        <div class="chart-body donut-wrap" style="height:300px;">
          <canvas id="sMastDonut" role="img" aria-label="성취기준 도달률 도넛"></canvas>
          ${donutCenterHtml((counts.reached||0) + ' / ' + counts.total, '성취기준 도달')}
        </div>
      </section>
    </div>
    ${masteryLegend()}

    <!-- S-TREND + S-PROJ: 내 성취 추이 + 도달 예상 (무위험·자기효능) -->
    <section class="mastery-section" id="sTrendSection" style="margin-top:16px;">
      <div class="ms-head"><div class="ms-titles">
        <h2 class="mastery-h2"><i class="fas fa-seedling" aria-hidden="true" style="color:#16a34a;"></i> 내 정답률 추이</h2>
        <div class="mastery-sub">주별 정답률(맞힌 비율)이에요. 꾸준히 풀수록 올라가요 — 이번 주가 진하게 표시돼요.</div>
      </div></div>
      <div class="chart-body" id="sTrendBody" style="height:280px;">
        <canvas id="sTrendChart" role="img" aria-label="내 정답률 추이"></canvas>
      </div>
      <div class="sproj-chips" id="sTrendChips"></div>
      <!-- P1-3: 자연어 처방 박스(규칙 기반 템플릿 — 스펙 §4-4). 전 학령 마크업 공통, 내용만 분기. 생략 시 hidden 유지. -->
      <div class="strend-rx" id="sTrendRx" hidden>
        <i class="fas fa-compass" aria-hidden="true"></i>
        <p id="sTrendRxText"></p>
      </div>
      <div id="sTrendFoot"></div>
    </section>

    <!-- P0-1: 재풀이 전·후 비교 "오답 재풀이 정답률" — KERIS 고등 62→80 계승 (추이 카드 바로 아래) -->
    <section class="mastery-section" id="sRetrySection" style="margin-top:16px;"></section>

    <!-- S2: 강약 다이버징 Bar -->
    <section class="mastery-section" id="sDivergeSection" style="margin-top:16px;">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2">성취기준 강·약 분석</h2>
          <div class="mastery-sub">정답률 기준 — 오른쪽이 강점, 왼쪽이 약점. 평가된 성취기준만 표시해요(평가 부족 ${counts.insufficient||0}개 제외).</div>
        </div>
        <div class="ms-controls">
          <label class="ms-controls__lbl" for="sDivergeTopN">표시 개수</label>
          <select class="ms-select" id="sDivergeTopN" aria-label="강점·약점 각각 표시할 개수">
            <option value="5">강점·약점 각 5개</option>
            <option value="10">강점·약점 각 10개</option>
            <option value="15">강점·약점 각 15개</option>
          </select>
        </div>
      </div>
      <div class="chart-body" id="sDivergeBody" style="height:360px;">
        <canvas id="sMastDiverge" role="img" aria-label="성취기준 강약 다이버징 차트"></canvas>
      </div>
      ${masteryLegend()}
    </section>

    <!-- S4: 다음에 뭘? -->
    <section class="mastery-section" id="sNextSection" style="margin-top:16px;">
      <div class="ms-head"><div class="ms-titles">
        <h2 class="mastery-h2">맞춤 학습 추천</h2>
        <div class="mastery-sub">약한 성취기준을 채울 학습이에요. 하나씩 풀어 도달로 바꿔봐요.</div>
      </div>
      <div class="ms-controls"><span class="mastery-sub">미도달·부분 ${weaknesses.length}개</span></div>
      </div>
      <!-- P0-2: 우선순위 추천 3장(시급·권장·선택, KERIS 3열) — 잔여 미도달 카드는 그 아래 -->
      <div id="sRecoGrid"></div>
      <div id="sNextGrid"></div>
    </section>

    <!-- A4: 다음 한 걸음 (선수→후속 경로) -->
    <section id="sNextStepHost"></section>`;

  // ── P1-2: 교과별 성취수준 스택바 렌더(중·고) — 스펙 §3-3·§3-4 ──
  //   데이터 = mastery 응답 standards[] 단일 소스 FE 파생(BE 0) — 세그먼트 카운트와 드릴 내역이
  //   같은 배열에서 나오므로 표시값=내역이 구조적으로 보장된다(count==items.length 필터 정의상 항상 참).
  function deriveSubjStack(stds){
    const map = new Map();  // subject → { reached, partial, notReached, insufficient, total }
    for (const s of stds){
      const k = (s.subject && String(s.subject).trim()) || '기타';
      if (!map.has(k)) map.set(k, { reached:0, partial:0, notReached:0, insufficient:0, total:0 });
      const b = map.get(k); b[normStatus(s.status)]++; b.total++;   // normStatus: not_reached→notReached(기존 헬퍼)
    }
    return map;
  }
  function renderSubjStack(){
    const host = document.getElementById('sSubjStack');
    if (!host) return;
    _subjStackStandards = standards;   // 드릴(문서 위임)용 최신 데이터 — 클라이언트 드릴(fetch 없음)
    const derived = deriveSubjStack(standards);
    // 행 순서·총계 = bySubject 배열 그대로(standardCount 내림차순으로 옴 — 재정렬 금지). standardCount>0 전 행 렌더.
    let rows = bySubjectAll.filter(s => Number(s.standardCount) > 0);
    if (!rows.length && derived.size){
      // 방어: bySubject가 비고 standards만 있는 비정상 응답 — 파생 맵 기준으로 행 구성(스펙 §3-4 빈 상태).
      rows = [...derived.entries()].map(([subject, b]) => ({ subject, standardCount:b.total, avgRate:null, evaluatedCount:0 }));
    }
    const SEG_ORDER = ['reached','partial','notReached','insufficient'];   // 도넛·범례와 동일 순서 고정
    host.innerHTML = rows.map(s => {
      const subj = (s.subject && String(s.subject).trim()) || '기타';
      const b = derived.get(subj) || { reached:0, partial:0, notReached:0, insufficient:0, total:0 };
      if (Number(s.standardCount) !== b.total){
        // 개발 중 정합 감시(스펙 §3-3) — 화면은 파생값 기준.
        console.warn('[LRS P1-2] 스택바 정합 경고:', subj, 'bySubject.standardCount=', s.standardCount, '≠ standards 파생=', b.total);
      }
      // 레이더의 "교과별 평균 정답률" 정보 승계(스펙 §3-2) — 단, 미평가 교과에 0% 암시 금지(정직 표기).
      const labelTitle = (Number(s.evaluatedCount) > 0 && s.avgRate != null)
        ? `평균 정답률 ${s.avgRate}%` : '아직 평가 전이에요';
      // 세그먼트 폭 = flex:{count} 1 14px — 비례 기본 + 최소 14px(1개 조각도 클릭·시인). count===0은 렌더하지 않음.
      const segs = SEG_ORDER.filter(k => b[k] > 0).map(k => {
        const ko = MASTERY_KO[k];
        return `<button type="button" class="subj-stack__seg" data-subject="${escapeAttr(subj)}" data-status="${k}"
          style="flex:${b[k]} 1 14px; background:${MASTERY_HEX[k]};"
          aria-label="${escapeAttr(subj + ' ' + ko + ' ' + b[k] + '개 — 목록 보기')}" title="${escapeAttr(ko + ' ' + b[k] + '개')}"></button>`;
      }).join('');
      return `<div class="subj-stack__row" role="listitem">
        <span class="subj-stack__label" title="${escapeAttr(labelTitle)}">${escapeHtml(subj)}</span>
        <div class="subj-stack__bar">${segs}</div>
        <button type="button" class="subj-stack__total" data-subject="${escapeAttr(subj)}"
          aria-label="${escapeAttr(subj + ' 성취기준 ' + b.total + '개 전체 목록 보기')}">총 ${b.total}개</button>
      </div>`;
    }).join('');
    bindSubjStackDrill();
  }
  if (useStackbar){
    renderSubjStack();
  }

  // ── S1 레이더 (교과별 평균 성취) — 초등 현행 유지(P1-2 분기: 중·고는 위 스택바) ──
  //   AC1·AC2·부류 F 교정: null(미평가) 교과를 0으로 찍어 중심으로 붕괴(스파이크)시키지 않는다.
  //   전 교과 정본 축(국어·수학·사회·과학·영어)을 항상 표시하고, 데이터 있는 교과에만 실제 avgRate를 매핑.
  //   미평가 교과는 null(spanGaps:false로 선을 끊음) → "0점"이 아니라 "아직 평가 전"으로 회색 축 자리표시.
  if (!useStackbar) {
    const CORE_SUBJECTS = ['국어','수학','사회','과학','영어'];   // 초등 핵심 5교과 정본 축
    const rateBySubj = new Map();
    (bySubject || []).forEach(s => {
      const name = (s.subject && String(s.subject).trim()) || '기타';
      // 미평가 판정: evaluatedCount===0(평가 표본 없음)이면 avgRate가 0으로 와도 "0점"이 아니라 미평가(null).
      //   BE가 미평가 교과에 avgRate:0을 실어보내므로 avgRate만으로는 0점과 미평가를 구분 못함 → evaluatedCount로 판정.
      const evaluated = Number(s.evaluatedCount) > 0;
      rateBySubj.set(name, (!evaluated || s.avgRate == null) ? null : s.avgRate);
    });
    // 축 = 정본 5교과 ∪ 데이터에 등장한 그 밖의 교과(예: 예술) — 순서: 정본 먼저, 그다음 기타.
    const extra = [...rateBySubj.keys()].filter(k => !CORE_SUBJECTS.includes(k));
    const axes = CORE_SUBJECTS.concat(extra);
    const dataVals = axes.map(a => rateBySubj.has(a) ? rateBySubj.get(a) : null);
    const evaluatedAxes = axes.filter(a => rateBySubj.get(a) != null);

    if (evaluatedAxes.length >= 3){
      // 3교과 이상 평가됨 → 레이더. 미평가 축은 null(끊김)로 스파이크 방지.
      // 점 표시: 값 있는 축은 파란 점, 없는 축은 투명(0점처럼 안 보이게).
      const ptColors = dataVals.map(v => v == null ? 'rgba(0,0,0,0)' : '#2563eb');
      const hasGap = dataVals.some(v => v == null);
      mkChart(document.getElementById('sMastRadar'), 'radar', {
        labels: axes,
        datasets: [{
          label:'평균 정답률', data: dataVals, spanGaps:false,
          borderColor:'var(--lrs-primary)', backgroundColor:'rgba(37,99,235,.15)',
          pointBackgroundColor:ptColors, pointBorderColor:ptColors, borderWidth:2,
        }]
      }, { scales:{ r:{ min:0, max:100, ticks:{ stepSize:20, font:{size:12} }, pointLabels:{ font:{size:13} } } },
           plugins:{ legend:{ display:false },
             tooltip:{ callbacks:{ label:(ctx)=> ctx.raw == null ? `${ctx.label}: 아직 평가 전` : `${ctx.label}: ${ctx.raw}%` } } } });
      if (hasGap){
        const cap = document.createElement('div');
        cap.className = 'mastery-sub';
        cap.style.cssText = 'margin-top:6px;text-align:center;';
        cap.textContent = '점이 없는 교과는 아직 평가 전이에요.';
        document.getElementById('sMastRadar').closest('.chart-body').after(cap);
      }
    } else if (evaluatedAxes.length){
      // 평가 교과 3개 미만 → 레이더는 스파이크로 왜곡되므로 가로 Bar 폴백(평가된 교과만, 0값 스파이크 없음).
      const barSubj = evaluatedAxes;
      mkChart(document.getElementById('sMastRadar'), 'bar', {
        labels: barSubj,
        datasets: [{ label:'평균 정답률', data: barSubj.map(a => rateBySubj.get(a)),
          backgroundColor:'var(--lrs-primary)' }]
      }, { indexAxis:'y', scales:{ x:{ min:0, max:100, title:{display:true,text:'평균 정답률(%)'} } },
           plugins:{ legend:{ display:false },
             tooltip:{ callbacks:{ label:(ctx)=> `${ctx.raw}%` } } } });
      const cap = document.createElement('div');
      cap.className = 'mastery-sub';
      cap.style.cssText = 'margin-top:8px;text-align:center;';
      cap.textContent = evaluatedAxes.length === 1
        ? '아직 한 교과만 평가됐어요. 다른 교과도 풀면 교과별 비교가 나타나요.'
        : '평가된 교과만 표시했어요. 더 풀면 나머지 교과도 채워져요.';
      document.getElementById('sMastRadar').closest('.chart-body').after(cap);
    } else {
      document.getElementById('sMastRadar').closest('.chart-body').innerHTML =
        '<div class="mastery-empty"><i class="fas fa-chart-pie me-icon"></i><p>교과별 평균을 낼 성취 데이터가 아직 부족해요.</p></div>';
    }
  }

  // ── S1 도넛 (4상태) ──────────────────────────────────────────────────
  if (allInsufficient){
    // 평가부족만 — 회색 1색 + 안내
    document.getElementById('sMastDonut').closest('.donut-wrap').querySelector('.donut-center').innerHTML =
      `<span class="dc-num">${counts.insufficient} / ${counts.total}</span><span class="dc-lbl">평가 부족</span>`;
    mkChart(document.getElementById('sMastDonut'), 'doughnut', {
      labels:['평가 부족'],
      datasets:[{ data:[counts.insufficient], backgroundColor:[MASTERY_HEX.insufficient] }]
    }, Object.assign({ cutout:'62%' }, donutLegendOpts('개')));
  } else {
    mkChart(document.getElementById('sMastDonut'), 'doughnut', {
      labels:['도달','부분 도달','미도달','평가 부족'],
      datasets:[{
        data:[counts.reached||0, counts.partial||0, counts.notReached||0, counts.insufficient||0],
        backgroundColor:[MASTERY_HEX.reached, MASTERY_HEX.partial, MASTERY_HEX.notReached, MASTERY_HEX.insufficient]
      }]
    }, Object.assign({ cutout:'62%' }, donutLegendOpts('개')));
  }

  // ── S2 다이버징 Bar (재그림 함수) ────────────────────────────────────
  //   [PM P0 — 약점 은폐 방지] 미도달(not_reached)·부분도달 저조 단원은 기간 창에서
  //   시도<3회라 status가 'insufficient'로 강등될 수 있다. avg_score/rate가 0(0정답)이라도
  //   "평가 부족"으로 필터링하면 화면이 전부 초록(강점)만 남아 "약점 없음"으로 오인된다.
  //   → 표시용 rate(BE가 주는 rate = correct/attempts, 0정답=0%)를 그대로 써서 미도달을
  //     빨간 막대로 반드시 노출. 시도한 적 있는(attempts>0) 비-강점은 모두 약점 후보.
  const _attempts = s => Number(s.attempts != null ? s.attempts : s.attempt_count) || 0;
  const _rate = s => (s.rate != null ? Number(s.rate) : null);
  // 강점: 도달 또는 부분도달이면서 정답률 ≥70 (실제로 잘하는 것만).
  const isStrong = s => { const st = normStatus(s.status); return (st === 'reached') || (st === 'partial' && _rate(s) != null && _rate(s) >= 70); };
  // 약점: 시도한 적 있고(attempts>0) rate가 낮은(<70) 단원 — status가 '평가 부족'으로
  //       강등됐어도 실제로 풀어 0~저조 정답이면 빨간 막대로 반드시 노출(은폐 금지).
  //       rate≥70인 '평가 부족'(우연히 다 맞음)은 약점 아님 → 제외.
  const isWeakCandidate = s => _attempts(s) > 0 && _rate(s) != null && _rate(s) < 70 && !isStrong(s);
  // 중복 std(같은 label) 제거 — 최저 rate 우선 유지(약점은 가장 낮은 값 대표).
  const dedupeByLabel = (arr, keepLowest) => {
    const seen = new Map();
    arr.forEach(s => { const k = s.label || s.code; const cur = seen.get(k);
      if (!cur) { seen.set(k, s); return; }
      const better = keepLowest ? (_rate(s) < _rate(cur)) : (_rate(s) > _rate(cur));
      if (better) seen.set(k, s); });
    return [...seen.values()];
  };
  // 강점/약점에 동시 등장하는 label(예: 도달 100 + 평가부족 0 중복)은 강점으로 우선 귀속.
  const strongRaw = dedupeByLabel(standards.filter(isStrong), false);
  const strongLabels = new Set(strongRaw.map(s => s.label || s.code));
  const weakRaw = dedupeByLabel(standards.filter(s => isWeakCandidate(s) && !strongLabels.has(s.label || s.code)), true);
  const strong = strongRaw.sort((a,b)=> _rate(b) - _rate(a));
  const weak = weakRaw.sort((a,b)=> _rate(a) - _rate(b));

  function clampLabel(s, n){
    // AC3 교정: 축 라벨은 단원명(label)만. 성취기준 코드는 부착하지 않는다(툴팁으로만 노출).
    const lbl = (s.label && s.label !== s.code) ? s.label : (s.subject || '');
    if (lbl) return lbl.length > n ? lbl.slice(0, n) + '…' : lbl;
    // 라벨이 전혀 없을 때만(BE label·subject 모두 없음) 최후 폴백으로 코드 사용.
    const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
    return codeBare || '성취기준';
  }

  function drawDiverge(){
    destroyDivergeChart();
    // value = 강점·약점 "각각" 표시할 개수(Top-N per side). 라벨과 동작 일치.
    const perSide = parseInt(document.getElementById('sDivergeTopN').value, 10) || 5;
    const pickStrong = strong.slice(0, perSide);
    const pickWeak = weak.slice(0, perSide);

    const labelClamp = window.innerWidth < 768 ? 12 : (window.innerWidth < 1200 ? 14 : 18);
    // 강점은 위(rate 내림차) → 가운데 0선 → 약점은 아래(rate 오름차 = 최저 맨 아래)
    const ordered = pickStrong.slice().concat(pickWeak.slice().reverse());
    const bodyEl = document.getElementById('sDivergeBody');

    if (!ordered.length){
      bodyEl.innerHTML = `<div class="mastery-empty"><i class="fas fa-scale-balanced me-icon"></i>
        <p>아직 강·약을 가를 데이터가 부족해요. 성취기준당 3회 이상 풀면 강점·약점이 나타나요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 풀러 가기</a></div>`;
      return;
    }
    bodyEl.innerHTML = '<canvas id="sMastDiverge" role="img" aria-label="성취기준 강약 다이버징 차트"></canvas>';
    bodyEl.style.height = (Math.max(360, ordered.length * 34 + 40)) + 'px';

    // 약점 여부는 status 문자열이 아니라 "어느 버킷(weak/strong)에 담겼는지"로 판정.
    //   (평가부족으로 강등된 미도달도 weak 버킷에 있으면 왼쪽 빨강으로 그린다.)
    //   0정답(rate=0) 약점은 -0이라 막대가 안 보이므로 최소 표시폭(-8)을 줘 빨간 막대가 반드시 보이게.
    const weakSet = new Set(pickWeak);
    const values = ordered.map(s => { const r = _rate(s)||0; return weakSet.has(s) ? -Math.max(r, 8) : r; });
    const colors = ordered.map(s => {
      if (weakSet.has(s)) return MASTERY_HEX.notReached;              // 약점 = 빨강(미도달 톤)
      const st = normStatus(s.status);
      return st === 'reached' ? MASTERY_HEX.reached : MASTERY_HEX.partial; // 강점 = 초록/주황(부분)
    });

    LRS._divergeChart = new Chart(document.getElementById('sMastDiverge'), {
      type:'bar',
      data:{ labels: ordered.map(s => clampLabel(s, labelClamp)),
        datasets:[{ data: values, backgroundColor: colors, borderRadius:4, _meta: ordered }] },
      options:{
        responsive:true, maintainAspectRatio:false, indexAxis:'y',
        animation:{ duration:500 },
        scales:{
          x:{ min:-100, max:100, ticks:{ callback:v=>Math.abs(v)+'%', font:{size:12} },
              grid:{ color:(ctx)=> ctx.tick.value === 0 ? '#9ca3af' : '#f1f5f9' } },
          y:{ ticks:{ font:{size:12} } }
        },
        plugins:{
          legend:{ display:false },
          // 툴팁: 단원명(제목) → 정답률·시도(본문) → 성취기준 코드(맨 끝 회색 부기). 코드가 앞에 안 오게.
          tooltip:{ callbacks:{
            title:(items)=>{ const s = ordered[items[0].dataIndex]; return (s.label && s.label!==s.code) ? s.label : (s.subject || '성취기준'); },
            label:(ctx)=>{ const s = ordered[ctx.dataIndex];
              // 마감1 방어: rate null 이면 "시도 N회"만(없는 정답률 암시 금지).
              //   rate 존재 시엔 correct/attempts 실채점 값이라 "(N회 중 M정답)" 병기로 정직 표기 유지(PM P0 약점 은폐 방지 결정).
              if (s.rate == null) return `시도 ${_attempts(s)}회 · ${masteryKo(s.status)}`;
              return `정답률 ${s.rate}% (${s.attempts}회 중 ${s.correct}정답) · ${masteryKo(s.status)}`; },
            afterLabel:(ctx)=>{ const s = ordered[ctx.dataIndex];
              const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
              return codeBare ? `성취기준 ${codeBare}` : ''; }
          } }
        },
        onClick:(e, els)=>{ if (!els.length) return; const s = ordered[els[0].index];
          // 약점 막대 클릭 → S4 추천 학습으로 스크롤. 강점 클릭 → 해당 단원 학습으로.
          if (weakSet.has(s)){
            const sec = document.getElementById('sNextSection'); if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
          } else {
            location.href = '/self-learn/?achievement_code=' + encodeURIComponent(s.code);
          }
        }
      }
    });
  }
  function destroyDivergeChart(){ if (LRS._divergeChart){ try{ LRS._divergeChart.destroy(); }catch(_){} LRS._divergeChart = null; } }
  document.getElementById('sDivergeTopN').addEventListener('change', drawDiverge);
  drawDiverge();

  // ── P0-1: 재풀이 전·후 비교 카드 (KERIS P2 Growth Visibility) ────────
  renderRetryGrowth(document.getElementById('sRetrySection'), retryGrowth);

  // ── S-TREND + S-PROJ (분석·예측 P0, 무위험·자기효능) — 후행 로드 ──────
  //   P1-3(윤리 — 네트워크 레벨 가드): 중·고만 withClass=1 옵트인. 초등은 withClass 요청 자체를
  //   보내지 않는다 → 응답에 비교 데이터가 없어 DOM·devtools 어디에도 반 비교 값이 존재하지 않음(스펙 §4-3).
  (async () => {
    const wantClassOverlay = !!levelCfg().trendClassOverlay;
    const td = await apiGet('/api/lrs/trend/student/' + encodeURIComponent(uid),
      wantClassOverlay ? { withClass: 1 } : undefined);
    renderStudentTrend(td);
  })();

  function renderStudentTrend(td){
    const body = document.getElementById('sTrendBody');
    const chips = document.getElementById('sTrendChips');
    const foot = document.getElementById('sTrendFoot');
    if (!body) return;
    const trend = td && td.trend;
    const proj = td && td.proj || (td && td.projection);  // 라우트는 projection 키
    const target = (td && td.target) || 80;

    // [PM P1 — 2점이라도 연결] 선을 그릴 수 있는 유효 포인트(rate 있는 점) 개수로 판정.
    //   status가 'ok'가 아니어도(관측 1~2주라도) 점이 2개 이상이면 '최근 기록' 선을 그린다.
    //   예측·전망(기울기/도달주차) 문구만 3주 이상일 때 노출.
    const seriesAll = (trend && trend.series) || [];
    const valuedPts = seriesAll.filter(p => p && p.rate != null);
    const canDrawLine = valuedPts.length >= 2;
    const observedWeeks = (trend && trend.observedWeeks) || valuedPts.length;
    const canPredict = (trend && trend.status === 'ok') && observedWeeks >= 3;

    // ★ 윤리(P6): 위험점수·등수·"위험" 어휘·신뢰배지 절대 미표기. 하락도 파랑 유지.
    //   선을 못 그리는 경우(점<2)에만 히어로 단독 폴백.
    if (!td || !td.success || !trend || !canDrawLine){
      // 관측 주차 부족(<3주)이라 '추세선'은 못 그려도, 이번 주 실제 도달률은 반드시 보여준다(학생 노력 반영).
      const sec = document.getElementById('sTrendSection');
      const s0 = trend && (trend.series||[]).filter(p=>p && p.attempts>0).slice(-1)[0];
      const curRate = (trend && trend.currentRate!=null) ? trend.currentRate
                      : (s0 ? s0.rate : null);
      const obsW = (trend && trend.observedWeeks) || (s0 ? 1 : 0);
      if (sec){
        if (curRate != null && s0){
          // 데이터는 있으나 아직 1~2주 → 이번 주 도달률을 큰 숫자로, 추세선은 왜 아직 안 뜨는지 안내
          sec.querySelector('#sTrendBody').outerHTML =
            `<div class="mastery-empty" id="sTrendBody" style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 18px;">
               <div style="display:flex;align-items:center;gap:16px;">
                 <div style="font-size:44px;font-weight:800;color:#2563eb;line-height:1;">${Math.round(curRate)}<span style="font-size:22px;font-weight:700;">%</span></div>
                 <div style="text-align:left;font-size:15px;color:#374151;line-height:1.5;">이번 주 정답률<br><span style="font-size:13px;color:#6b7280;">(${s0.attempts}문제 중 맞힌 비율)</span></div>
               </div>
               <p style="font-size:15px;color:#374151;line-height:1.7;margin:0;max-width:440px;text-align:center;">
                 <i class="fas fa-seedling" style="color:#16a34a;"></i> 이번 주 학습은 잘 반영됐어요! <b>추세 그래프</b>는 <b>3주 이상</b> 기록이 쌓이면 나타나요(현재 ${obsW}주). 꾸준히 하면 곧 흐름이 보여요.</p>
               <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습 계속하기</a>
             </div>`;
        } else {
          // 진짜 기록 없음
          sec.querySelector('#sTrendBody').outerHTML =
            `<div class="mastery-empty" id="sTrendBody"><i class="fas fa-seedling me-icon" style="color:#86efac;"></i>
               <p>아직 성취 기록이 없어요. <b>오늘의 학습</b>이나 문제풀이를 하면 여기에 도달률이 쌓여요!</p>
               <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습 시작하기</a></div>`;
        }
      }
      if (chips) chips.innerHTML = '';
      return;
    }

    // 추이 라인 — 기존 "일별 추이" 톤(파랑) 그대로. 마지막 점만 크게.
    //   (status 'ok' 아니어도 점 ≥2면 '최근 기록' 선을 그린다.)
    const series = seriesAll;
    const labels = series.map(s => s.week || '');
    const vals = series.map(s => (s.rate == null ? null : s.rate));
    const curRate = (trend.currentRate != null) ? trend.currentRate : (valuedPts.slice(-1)[0] || {}).rate;

    // ── P1-3: 학급 평균 오버레이(중·고) — 스펙 §4-3 ──
    //   생략 조건(전부 조용히 현행 차트로 폴백 — 에러 패널 금지): classTrend 부재(BE 미착륙 포함)·status≠ok·유효 주<2.
    const ct = (levelCfg().trendClassOverlay && td && td.classTrend) ? td.classTrend : null;
    const ctSeries = (ct && ct.status === 'ok' && Array.isArray(ct.series))
      ? ct.series.filter(p => p && p.rate != null) : [];
    const drawOverlay = ctSeries.length >= 2;

    // 주 정렬(align): labels = 내 주 ∪ 반 주 — %Y-%W는 사전순=시간순. 없는 주는 null(spanGaps).
    let chartLabels = labels, myVals = vals, classVals = null;
    if (drawOverlay){
      const myMap = new Map(series.map(p => [String(p.week || ''), (p.rate == null ? null : p.rate)]));
      const ctMap = new Map(ctSeries.map(p => [String(p.week || ''), p.rate]));
      chartLabels = [...new Set([...myMap.keys(), ...ctMap.keys()])].sort();
      myVals = chartLabels.map(w => myMap.has(w) ? myMap.get(w) : null);
      classVals = chartLabels.map(w => ctMap.has(w) ? ctMap.get(w) : null);
    }
    // 마지막 강조점: 비오버레이=현행 그대로(마지막 인덱스), 오버레이=합집합 축에서 내 값이 있는 마지막 인덱스.
    const lastI = drawOverlay
      ? myVals.reduce((acc, v, i) => (v != null ? i : acc), -1)
      : vals.length - 1;

    const datasets = [{
      label:'내 정답률(%)', data: myVals,
      borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.15)',   // 내 라인 파랑 유지(변경 금지 — 파랑=나, 회색=참조가 전 카드 공통 문법)
      borderWidth:2.5, tension:.3, fill:true, spanGaps:true, order:1,
      pointRadius:(c)=> c.dataIndex === lastI ? 6 : 3,
      pointBackgroundColor:'#2563eb', pointBorderColor:'#fff', pointBorderWidth:2
    }];
    if (drawOverlay){
      datasets.push({
        label:'우리 반 평균(%)', data: classVals,
        borderColor:'#9ca3af', borderDash:[6,4], borderWidth:2,   // 회색 점선 = 익명 참조선
        fill:false, tension:.3, spanGaps:true, order:2,           // 내 라인을 가리지 않게 아래로
        pointRadius:0, pointHitRadius:8
      });
    }
    mkChart(document.getElementById('sTrendChart'), 'line', {
      labels: chartLabels,
      datasets
    }, {
      scales:{ y:{ min:0, max:100, ticks:{ callback:v=>v+'%', font:{size:12} } }, x:{ ticks:{ font:{size:11}, maxTicksLimit: window.innerWidth<768?6:10 } } },
      plugins:{
        // 범례는 오버레이가 실제로 그려질 때만(선 2개 식별 필요) — 아니면 현행 display:false 유지.
        legend: drawOverlay
          ? { display:true, position:'bottom', labels:{ boxWidth:18, font:{ size:13 } } }
          : { display:false },
        tooltip:{ callbacks:{ label:(c)=> c.parsed.y==null ? null :
          (drawOverlay ? `${String(c.dataset.label||'').replace('(%)','').trim()} ${c.parsed.y}%` : `정답률 ${c.parsed.y}%`) } }
      }
    });

    let chipHtml = '';
    if (canPredict){
      // ── 3주 이상 관측: 추세·전망 문구 노출 ──
      const dir = normTrendDir(trend.direction);
      if (dir === 'up'){
        chipHtml += `<span class="sproj-chip good"><i class="fas fa-wand-magic-sparkles"></i> 꾸준히 오르고 있어요!</span>`;
      } else {
        chipHtml += `<span class="sproj-chip soft"><i class="fas fa-hand-holding-heart"></i> 최근 조금 어려워졌네요. 이걸 같이 볼까요?</span>`;
      }
      if (proj && proj.reachable && proj.weeksToReach != null && proj.weeksToReach > 0){
        chipHtml += `<span class="sproj-chip proj"><i class="fas fa-bullseye"></i> 이 속도면 약 ${proj.weeksToReach}주 후 정답률 ${target}% 예상이에요! 👍</span>`;
      } else if (proj && proj.reachable && proj.weeksToReach === 0){
        chipHtml += `<span class="sproj-chip good"><i class="fas fa-star"></i> 이미 정답률 ${target}% 수준이에요. 이대로 꾸준히!</span>`;
      } else {
        chipHtml += `<span class="sproj-chip proj"><i class="fas fa-seedling"></i> 조금만 더 풀면 가까워져요.</span>`;
      }
    } else {
      // ── 2주(2점) 이하: '최근 기록' 선만. 전망·기울기 문구는 아직 숨김 ──
      if (curRate != null){
        chipHtml += `<span class="sproj-chip good"><i class="fas fa-chart-line"></i> 이번 주 정답률 ${Math.round(curRate)}%예요.</span>`;
      }
      chipHtml += `<span class="sproj-chip soft"><i class="fas fa-seedling"></i> 최근 기록을 이어 그렸어요. 3주 이상 쌓이면 전망도 보여드릴게요(현재 ${observedWeeks}주).</span>`;
    }
    if (chips) chips.innerHTML = chipHtml;
    const lowSample = (observedWeeks||0) < 6 || trend.confidence === 'low';

    // 학생용 순화 disclaimer — 전망을 낼 때만 '추정' 문구, 최근 기록만 그릴 땐 중립 안내.
    if (foot){
      foot.innerHTML = canPredict
        ? `<p class="proj-disclaimer"><i class="fas fa-circle-info"></i> 이 추정은 함께 참고하는 거예요.${lowSample ? ' 표본이 적어 대략적인 추정이에요.' : ''}</p>`
        : `<p class="proj-disclaimer"><i class="fas fa-circle-info"></i> 지금은 최근 기록만 이어 그렸어요. 전망은 3주 이상 쌓이면 보여드려요.</p>`;
      // P1-3 안내문(스펙 §4-3): 오버레이 렌더 시 익명 안내(14px) / 표본 부족(status='insufficient')일 때만 격려 안내 1줄.
      if (drawOverlay){
        foot.insertAdjacentHTML('beforeend',
          `<p class="proj-disclaimer strend-anon"><i class="fas fa-user-group" aria-hidden="true"></i> 반 평균은 같은 반 친구들의 익명 평균이에요.</p>`);
      } else if (levelCfg().trendClassOverlay && ct && ct.status === 'insufficient'){
        foot.insertAdjacentHTML('beforeend',
          `<p class="proj-disclaimer strend-anon"><i class="fas fa-user-group" aria-hidden="true"></i> 반 친구가 5명 이상 함께 기록을 쌓으면 반 평균 비교도 보여드려요.</p>`);
      }
    }

    // ── P1-3: 자연어 처방 문장(규칙 기반 템플릿 — 스펙 §4-4, 임의 변형·유의어 금지) ──
    //   비교(중·고, 겹치는 주≥2) 3분기 + 자기 기준(초등·폴백) 3분기. 금칙어(등수·순위·위험·뒤처·낮은 편 등) 금지.
    //   생략 규칙: 내 유효 점<2 → 미노출(hidden 유지) / weak0 없음 → 대체 절 / 비교 불가 → 자기 기준 폴백.
    (function renderTrendRx(){
      const box = document.getElementById('sTrendRx');
      const txt = document.getElementById('sTrendRxText');
      if (!box || !txt) return;
      if (valuedPts.length < 2){ box.hidden = true; return; }   // 방어(이 경로는 항상 ≥2이긴 함)

      // weak0 = insights.weaknesses[0] — s-achieve가 이미 페치한 스코프 변수(추가 fetch 금지).
      const weak0 = (insightsForReco && Array.isArray(insightsForReco.weaknesses) && insightsForReco.weaknesses[0]) || null;

      // 비교 델타(중·고, 오버레이 렌더 시): 겹치는 주(둘 다 non-null) ≥2 한정 평균 차 — 마지막 주 단독 노이즈 회피.
      let mode = null, delta = null;
      if (drawOverlay){
        const mine = [], cls = [];
        chartLabels.forEach((w, i) => {
          if (myVals[i] != null && classVals[i] != null){ mine.push(myVals[i]); cls.push(classVals[i]); }
        });
        if (mine.length >= 2){
          const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
          delta = Math.round(mean(mine) - mean(cls));
          mode = 'compare';
        }
      }
      if (mode === null){
        // 자기 델타(초등 + 폴백): 내 series에서 rate 있는 점 마지막 2개 차.
        const pts = valuedPts.map(p => p.rate);
        delta = Math.round(pts[pts.length - 1] - pts[pts.length - 2]);
        mode = 'self';
      }

      const unitHtml = weak0
        ? `<a class="strend-rx__link" href="${escapeAttr('/self-learn/?achievement_code=' + encodeURIComponent(String(weak0.achievement_code||'').replace(/^\[|\]$/g,'')))}">${escapeHtml(weak0.label || weak0.achievement_code || '추천 단원')}</a>`
        : null;
      const dailyLink = `<a class="strend-rx__link" href="/self-learn/">오늘의 학습</a>`;

      let sentence;
      if (mode === 'compare'){
        if (delta >= 5)       sentence = unitHtml ? `반 평균보다 정답률이 ${delta}점 정도 높아요. ${unitHtml} 학습으로 이 흐름을 이어가요!` : `반 평균보다 정답률이 ${delta}점 정도 높아요. 지금처럼 꾸준히 하면 돼요!`;
        else if (delta >= -4) sentence = unitHtml ? `반 평균과 비슷하게 가고 있어요. ${unitHtml} 학습을 추가로 해보길 권해요.` : `반 평균과 비슷하게 가고 있어요. 지금처럼 꾸준히 하면 돼요!`;
        else                  sentence = unitHtml ? `반 평균을 따라잡는 중이에요 — ${unitHtml}부터 하면 빨라져요.` : `반 평균을 따라잡는 중이에요 — ${dailyLink}부터 가볍게 시작해요.`;
      } else {
        if (delta >= 5)       sentence = unitHtml ? `지난주보다 정답률이 ${delta}점 올랐어요! ${unitHtml} 공부로 이어가 볼까요?` : `지난주보다 정답률이 ${delta}점 올랐어요! 지금처럼 꾸준히 하면 돼요!`;
        else if (delta >= -4) sentence = unitHtml ? `지난주와 비슷하게 가고 있어요. ${unitHtml} 공부를 하면 더 늘어나요.` : `지난주와 비슷하게 가고 있어요. 지금처럼 꾸준히 하면 돼요!`;
        else                  sentence = unitHtml ? `다시 오를 준비 시간이에요 — ${unitHtml}부터 같이 시작해요.` : `다시 오를 준비 시간이에요 — ${dailyLink}부터 가볍게 시작해요.`;
      }
      txt.innerHTML = sentence;
      box.hidden = false;
    })();
  }

  // ── S4 추천 카드 ─────────────────────────────────────────────────────
  // P0-2(추천 리치화, Rich 표기): insights.recommendations[](BE SSOT, 최대 3건)를
  //   우선순위 카드(①시급 ②권장 ③선택)로 먼저 렌더. FE 자체 재산정 금지.
  //   recommendations 필드 부재(BE 미착륙) → null: 리치 그리드 생략, 현행 그리드 유지(방어 폴백).
  const recoHost = document.getElementById('sRecoGrid');
  const recos = (insightsForReco && Array.isArray(insightsForReco.recommendations))
    ? insightsForReco.recommendations.slice(0, 3) : null;
  const recoCodesUsed = new Set();
  if (recos && recos.length && recoHost){
    renderRecoCards(recoHost, recos);
    recos.forEach(r => recoCodesUsed.add(String(r.achievement_code || r.code || '').replace(/^\[|\]$/g, '')));
  }

  const nextGrid = document.getElementById('sNextGrid');
  // 미도달 우선 → 부분 도달 (평가부족은 카드 만들지 않음).
  //   추천 3장에 이미 든 성취기준은 잔여 그리드에서 제외(중복 카드 금지 — 우선순위 카드가 항상 먼저).
  const cards = weaknesses.slice()
    .filter(w => !recoCodesUsed.has(String(w.code || '').replace(/^\[|\]$/g, '')))
    .sort((a,b)=>{
      const rank = s => normStatus(s.status) === 'notReached' ? 0 : 1;
      return rank(a) - rank(b) || (a.rate||0) - (b.rate||0);
    });
  if (!cards.length && recos && recos.length){
    // 추천 3장이 약점 전부를 흡수 → 잔여 그리드는 비워둠(빈상태 패널 불필요)
    nextGrid.innerHTML = '';
  } else if (!cards.length && recos && !recos.length && !noData && !allInsufficient){
    // P0-2 (e) 빈상태: recommendations 0건(약점·강점 모두 없음)
    nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-circle-check me-icon" style="color:#86efac;"></i>
      <p>지금은 추천할 단원이 없어요. 새 단원을 배우면 여기서 알려드릴게요</p>
      <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 둘러보기</a></div>`;
  } else if (!cards.length){
    // 빈 상태 3분기: 데이터없음 / 평가부족만(아직 미평가) / 진짜 약점없음(모두 도달)
    if (noData){
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-seedling me-icon" style="color:#9ca3af;"></i>
        <p>아직 성취 데이터가 없어요. 학습을 풀면 강·약과 다음 할 일이 나타나요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    } else if (allInsufficient){
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-hourglass-half me-icon" style="color:#9ca3af;"></i>
        <p>아직 평가된 성취기준이 없어요. 성취기준당 3번 이상 풀면 강·약을 가릴 수 있어요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    } else {
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-circle-check me-icon" style="color:#86efac;"></i>
        <p>지금 보충할 약점이 없어요! 새로운 학습에 도전해볼까요?</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    }
  } else {
    nextGrid.className = 'next-grid';
    nextGrid.innerHTML = cards.map((w, i) => {
      const st = normStatus(w.status);
      const codeBare = String(w.code||'').replace(/^\[|\]$/g,'');
      const recs = w.recommendations || [];
      const first = recs[0];
      const moreCount = Math.max(0, recs.length - 1);
      const hasRec = !!first;
      const itemRow = first ? `<div class="nc-item"><i class="fas ${recTypeIcon(first.type)}" aria-hidden="true"></i>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(first.title||'추천 학습')}</span></div>`
        : `<div class="nc-item" style="color:#9ca3af;"><i class="fas fa-hourglass-half"></i> 이 성취기준 추천 콘텐츠를 준비 중이에요</div>`;
      const moreRow = moreCount > 0 ? `<button type="button" class="nc-more" data-more="${i}">+${moreCount}개 더 보기</button>
        <div class="nc-more-list" id="ncMore-${i}" hidden style="display:flex;flex-direction:column;gap:6px;">
          ${recs.slice(1).map(r=>`<div class="nc-item"><i class="fas ${recTypeIcon(r.type)}"></i>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.title||'추천 학습')}</span></div>`).join('')}
        </div>` : '';
      return `<div class="next-card" data-idx="${i}">
        <div class="nc-badgerow">
          <span class="mastery-badge ${st}">${masteryKo(w.status)}</span>
          <span class="nc-subject">${escapeHtml(w.subject||'')}</span>
        </div>
        <div class="nc-title">${escapeHtml(w.label || codeBare)}</div>
        <div class="nc-meta">[${escapeHtml(codeBare)}] · 현재 ${w.rate==null?'-':w.rate}%</div>
        <hr class="nc-divider">
        ${itemRow}
        ${moreRow}
        <div class="nc-cta">
          <button type="button" class="mastery-btn" data-play="${i}" ${hasRec?'':'disabled'}>
            ${hasRec ? '이 학습 풀기 <i class="fas fa-arrow-right"></i>' : '추천 준비 중'}
          </button>
        </div>
      </div>`;
    }).join('');

    // 카드 이벤트: 풀기 / 더보기
    nextGrid.querySelectorAll('button[data-play]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.getAttribute('data-play'),10);
        const w = cards[i]; const first = (w.recommendations||[])[0];
        const url = recPlayUrl(first);
        MasteryPlayer.open(w.label || (w.code||'학습'), url);
      });
    });
    nextGrid.querySelectorAll('button[data-more]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = btn.getAttribute('data-more');
        const list = document.getElementById('ncMore-'+i);
        if (list){ const open = !list.hidden; list.hidden = open; btn.textContent = open ? `+${list.children.length}개 더 보기` : '접기'; }
      });
    });
  }

  // A4 "다음 한 걸음" — 선수→후속 경로 사슬 + CTA (학생 본인, 정상 렌더 경로 말미)
  await renderNextStep(document.getElementById('sNextStepHost'));
};

/* =====================================================================
 * P0-2 우선순위 추천 카드 (Rich 표기) — LRS_개선로드맵_KERIS벤치마킹.md §3 P0-2 ③(c)
 *   KERIS 고등 3열: 숫자 원형 뱃지 28px(①#ef4444 ②#f59e0b ③#2563eb) + 상태 라벨 +
 *   교과 배지 + 제목 17px + 이유 15px + ⏱예상 소요시간 14px + CTA 풀폭.
 *   라벨·CTA 문구는 LEVEL_CONFIG(recoLabels/recoCta) — 초등 이모지형 / 중·고 시급·권장·선택.
 *   어휘·색 통일: "다음 한 걸음" 시급 빨강(#ef4444 계열)과 동일. "긴급"·"중요" 유의어 금지.
 * ===================================================================== */
function renderRecoCards(host, recos){
  if (!host || !Array.isArray(recos) || !recos.length) return;
  const lv = levelCfg();
  const NUM_BG  = { urgent:'#ef4444', recommended:'#f59e0b', optional:'#2563eb' };
  const LBL_CO  = { urgent:'#ef4444', recommended:'#b45309', optional:'#1d4ed8' };
  const ORDER   = ['urgent','recommended','optional'];
  host.className = 'reco-grid';
  host.innerHTML = recos.map((r, i) => {
    const pri = ORDER.includes(r.priority) ? r.priority : ORDER[Math.min(i, 2)];
    const codeRaw = r.achievement_code || r.code || '';
    const codeBare = String(codeRaw).replace(/^\[|\]$/g, '');
    const title = r.label || r.title || codeBare || '추천 학습';
    const subj = r.subject_label || r.subject || '';
    const subjCls = _subjectBadgeClass(subj);
    const reason = r.reasonText || '';
    const mins = (r.estMinutes != null && Number(r.estMinutes) > 0) ? Math.round(Number(r.estMinutes)) : null;
    // CTA 목적지: 시급·권장·선택 모두 맞춤학습(해당 성취기준) — s-home 약점 CTA와 동일 패턴.
    const href = '/self-learn/?achievement_code=' + encodeURIComponent(codeRaw);
    return `<div class="reco-card" data-pri="${escapeAttr(pri)}">
      <div class="reco-head">
        <span class="reco-num" style="background:${NUM_BG[pri]};" aria-hidden="true">${i+1}</span>
        <span class="reco-pri-label" style="color:${LBL_CO[pri]};">${escapeHtml(lv.recoLabels[pri] || pri)}</span>
        ${subj ? `<span class="dc-badge ${subjCls}">${escapeHtml(subj)}</span>` : ''}
      </div>
      <div class="reco-title" title="${escapeAttr(r.fullLabel || title)}">${escapeHtml(title)}</div>
      ${reason ? `<div class="reco-reason">${escapeHtml(reason)}</div>` : ''}
      ${mins != null ? `<div class="reco-time"><i class="fas fa-stopwatch" aria-hidden="true"></i> 예상 소요시간 ${mins}분</div>` : ''}
      <a class="mastery-btn reco-cta" href="${escapeAttr(href)}">${escapeHtml(lv.recoCta)}</a>
    </div>`;
  }).join('');
}

/* =====================================================================
 * P0-1 재풀이 전·후 비교 — "오답 재풀이 정답률" 카드 (제목 격식화: 구 "오답을 다시 풀었더니")
 *   기획서: LRS_개선로드맵_KERIS벤치마킹.md §3 P0-1 (KERIS 고등 62%→80% 계승)
 *   데이터: GET /api/lrs/retry-growth/:uid → { questions:N, succeeded:M, attempts,
 *           retryRate(0~100|null), wrongTotal, wrongResolved }
 *   전(처음)=0% 고정(오답노트 문항은 정의상 첫 시도 전부 오답) / 후=문항 단위 M/N.
 *   드릴: 기존 perform/detail 모달 셸 재사용 + activityType=wrong_note_retry.
 * ===================================================================== */
function renderRetryGrowth(host, d){
  if (!host) return;
  const lv = levelCfg();
  bindRetryDrill();   // 문서 위임 1회 바인딩(SPA 재렌더 견고 — bindPerfDrilldown 패턴)

  const headHtml = (badgeHtml, showMore) => `
    <div class="ms-head">
      <div class="ms-titles">
        <h2 class="mastery-h2">오답 재풀이 정답률</h2>
        <div class="mastery-sub" id="sRetrySub"></div>
      </div>
      <div class="ms-controls">
        ${badgeHtml || ''}
        ${showMore ? `<button type="button" class="retry-more" data-retry-drill aria-label="다시 푼 문항 자세히 보기">자세히 보기 ›</button>` : ''}
      </div>
    </div>`;

  // ── 로딩 실패(BE 미착륙 포함): 카드 숨김이 아니라 오류 패널 재사용(기획서 (d)) ──
  if (!d || d.success === false){
    host.removeAttribute('data-drillable');
    host.innerHTML = headHtml('', false) + tplError('불러오지 못했어요 — 새로고침 해보세요', () => setView('s-achieve'));
    const sub = host.querySelector('#sRetrySub');
    if (sub) sub.textContent = periodLabelKo();
    return;
  }

  const N = Number(d.questions) || 0;
  const M = Number(d.succeeded) || 0;
  const rate = (d.retryRate != null && !isNaN(Number(d.retryRate))) ? Math.max(0, Math.min(100, Math.round(Number(d.retryRate)))) : null;
  const subText = String(lv.retrySub || '').replace('{N}', String(N)) + ' · ' + periodLabelKo();

  // ── 빈 상태(N=0): retryRate 0% 표기 금지("다 틀림" 오독) — 격려 + 오답노트 CTA ──
  if (!N || rate == null){
    host.removeAttribute('data-drillable');
    host.innerHTML = headHtml('', false) + `
      <div class="mastery-empty">
        <i class="fas fa-rotate-right me-icon" style="color:#2563eb;"></i>
        <p>오답노트에서 틀린 문항을 다시 풀면, 여기에 성장이 보여요</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/wrong-note.html"><i class="fas fa-book-open-reader" aria-hidden="true"></i> 오답노트 가기</a><!-- 감리 D2: .btn은 dc-state-panel 스코프 전용이라 무스타일 렌더 → mastery-btn으로 교체 -->
      </div>`;
    const sub = host.querySelector('#sRetrySub');
    if (sub) sub.textContent = String(lv.retrySub || '').replace('{N}', '0') + ' · ' + periodLabelKo();
    return;
  }

  // ── 기본형: 전(0% 도트) vs 후(파란 바) + 델타 배지 ──
  const deltaBadge = M > 0 ? `<span class="retry-delta">+${M}문항 극복 🎉</span>` : '';
  const afterCap = rate === 100 ? '전부 다시 맞혔어요! 🎉' : `${M}문항을 다시 맞혔어요`;
  const footHtml = (Number(d.wrongTotal) > 0) ? `
    <div class="retry-foot">내 오답노트: 전체 ${Number(d.wrongTotal)}문항 중 ${Number(d.wrongResolved)||0}문항 해결
      <a href="/self-learn/wrong-note.html" class="retry-foot-link">오답노트 가기 →</a></div>` : '';

  host.setAttribute('data-drillable', '1');
  host.innerHTML = headHtml(deltaBadge, true) + `
    <div class="retry-rows" role="img" aria-label="처음 풀었을 때 0%, 다시 풀었을 때 ${rate}%">
      <div class="retry-row">
        <div class="retry-lbl">처음 풀었을 때</div>
        <div class="retry-track"><span class="retry-dot" aria-hidden="true"></span></div>
        <div class="retry-val is-zero">0%</div>
      </div>
      <div class="retry-cap is-first">모두 틀렸던 문항이에요</div>
      <div class="retry-row">
        <div class="retry-lbl">다시 풀었을 때</div>
        <div class="retry-track"><span class="retry-fill" style="width:${rate}%;"></span></div>
        <div class="retry-val is-after">${rate}%</div>
      </div>
      <div class="retry-cap is-after">${escapeHtml(afterCap)}</div>
    </div>
    ${footHtml}`;
  const sub = host.querySelector('#sRetrySub');
  if (sub) sub.textContent = subText;
  // 로드 애니메이션은 CSS keyframes(retryFillGrow, from 0)가 담당 — 폭 자체는 인라인 값이 정본.
}

/* 재풀이 카드 드릴 — 문서 레벨 위임 1회 바인딩(SPA 재렌더에 견고, bindPerfDrilldown 교훈 계승) */
function bindRetryDrill(){
  if (bindRetryDrill._bound) return;
  bindRetryDrill._bound = true;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-retry-drill]');
    if (btn){ e.preventDefault(); openRetryDetail(btn); return; }
    const sec = e.target.closest('#sRetrySection[data-drillable="1"]');
    if (sec && !e.target.closest('a,button')) openRetryDetail(sec);
  });
}

/* 재풀이 드릴 모달 — 기존 perform/detail 모달 셸(#lrsPerfDetailModal) 재사용.
 * BE: GET /api/lrs/perform/detail?activityType=wrong_note_retry (+기간·scope rangeQS 재사용)
 * 행 = 문항 텍스트(1줄 클램프) · 결과 뱃지(맞힘 초록 / 아직 회색 — "틀림" 빨강 금지) · 일시.
 * 계약: count == 카드 N == items.length */
function openRetryDetail(triggerEl){
  const overlay = _pdEl('lrsPerfDetailModal');
  if (!overlay) return;
  _pdBucket = null; _pdSegment = null; _pdData = null;
  if (triggerEl) _pdLastTrigger = triggerEl;

  _pdEl('lrsDmTitleIco').textContent = '🔁';
  _pdEl('lrsDmTitleText').textContent = '다시 푼 문항';
  _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 불러오는 중…`;
  const seg = _pdEl('lrsDmSeg'); seg.hidden = true; seg.innerHTML = '';
  _pdEl('lrsDmBody').innerHTML =
    '<div class="lrs-dm-loading">' +
      Array(3).fill(0).map(() =>
        '<div class="lrs-dm-skel-row"><div class="lrs-dm-skel-ico"></div>' +
        '<div class="lrs-dm-skel-body"><div class="lrs-dm-skel-line"></div><div class="lrs-dm-skel-line short"></div></div></div>'
      ).join('') +
    '</div>';
  if (!overlay.classList.contains('open')){
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { try { _pdEl('lrsDmClose').focus(); } catch(_){} }, 0);
  }

  const seq = ++_pdReqSeq;
  const url = '/api/lrs/perform/detail' + rangeQS({ activityType:'wrong_note_retry' }, '/api/lrs/perform/detail');
  fetch(url, { credentials:'include' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(data => {
      if (seq !== _pdReqSeq) return;
      const items = (data && data.items) || [];
      const count = (data && typeof data.count === 'number') ? data.count : items.length;
      _pdEl('lrsDmTitleText').textContent = `다시 푼 문항 ${count}개`;
      _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 총 ${count}개 · 최신순`;
      if (!items.length){
        _pdEl('lrsDmBody').innerHTML =
          '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">📭</div>' +
          '<div class="lrs-dm-empty-title">이 기간에 다시 푼 문항이 없어요</div>' +
          '<div class="lrs-dm-empty-text">오답노트에서 틀린 문항을 다시 풀어보세요.</div>' +
          '<div class="lrs-dm-empty-cta"><a class="primary" href="/self-learn/wrong-note.html">오답노트 가기 →</a></div></div>';
        return;
      }
      _pdEl('lrsDmBody').innerHTML = items.map(it => {
        const title = escapeHtml(it.title || it.question_text || '문항');
        const ok = (it.result_success != null) ? Number(it.result_success) === 1
                 : (it.success != null) ? !!it.success
                 : (it.badge && /맞/.test(it.badge.text || ''));
        const badge = ok
          ? '<span class="lrs-dm-row-badge lrs-dm-badge-success">맞힘</span>'
          : '<span class="lrs-dm-row-badge lrs-dm-badge-neutral">아직</span>';
        const dateTxt = it.date || it.created_at ? `<span class="lrs-dm-row-date">${_pdFmtDate(it.date || it.created_at)}</span>` : '';
        return `<div class="lrs-dm-row">
          <div class="lrs-dm-row-icon">🔁</div>
          <div class="lrs-dm-row-body"><div class="lrs-dm-row-primary">${title}</div></div>
          <div class="lrs-dm-row-tail">${badge}${dateTxt}</div>
        </div>`;
      }).join('');
      _pdEl('lrsDmBody').scrollTop = 0;
    })
    .catch(() => {
      if (seq !== _pdReqSeq) return;
      _pdEl('lrsDmCount').textContent = periodLabelKo();
      _pdEl('lrsDmBody').innerHTML =
        '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">⚠️</div>' +
        '<div class="lrs-dm-empty-title">내역을 불러올 수 없어요</div>' +
        '<div class="lrs-dm-empty-text">잠시 후 다시 시도해 주세요.</div></div>';
    });
}

/* ── P1-2: 교과별 성취수준 스택바 드릴 — 스펙 §3-5 ──
 * #lrsPerfDetailModal 셸 재사용, 클라이언트 드릴(fetch 없음 — mastery standards[] 동일 배열에서 필터).
 * 표시값=내역 구조적 보장: 세그먼트 카운트와 items가 같은 필터 정의에서 나옴(count===items.length 항상 참). */
let _subjStackStandards = null;   // s-achieve 렌더 시 최신 mastery.standards[] 보관

/* 세그먼트·총계 클릭 — 문서 레벨 위임 1회 바인딩(SPA 재렌더에 견고, bindRetryDrill 교훈 계승) */
function bindSubjStackDrill(){
  if (bindSubjStackDrill._bound) return;
  bindSubjStackDrill._bound = true;
  document.addEventListener('click', (e) => {
    const seg = e.target.closest('.subj-stack__seg');
    if (seg){ e.preventDefault(); openSubjStackDetail(seg.getAttribute('data-subject'), seg.getAttribute('data-status'), seg); return; }
    const tot = e.target.closest('.subj-stack__total');
    if (tot){ e.preventDefault(); openSubjStackDetail(tot.getAttribute('data-subject'), null, tot); }
  });
}

/* 스택바 드릴 모달 — subject×상태(statusKey null=전체) 성취기준 목록.
 * 정렬 = rate 오름차순(null 뒤) → label 가나다. 행 클릭 → 맞춤학습(Action Bridge — 약점 리스트 CTA와 동일 목적지).
 * 카운트 줄 "누적 기준" — mastery는 기간칩 무반영(누적)이 정책이므로 기간 라벨 금지(스펙 §3-5). */
function openSubjStackDetail(subject, statusKey, triggerEl){
  const overlay = _pdEl('lrsPerfDetailModal');
  if (!overlay) return;
  const stds = _subjStackStandards || [];
  _pdBucket = null; _pdSegment = null; _pdData = null;
  ++_pdReqSeq;   // 진행 중인 perform/detail fetch 무효화(경합 가드)
  if (triggerEl) _pdLastTrigger = triggerEl;

  const items = stds
    .filter(s => (((s.subject && String(s.subject).trim()) || '기타') === subject)
      && (statusKey ? normStatus(s.status) === statusKey : true))
    .sort((a,b) => {
      const ra = (a.rate == null) ? Infinity : Number(a.rate);
      const rb = (b.rate == null) ? Infinity : Number(b.rate);
      if (ra !== rb) return ra - rb;
      return String(a.label||'').localeCompare(String(b.label||''), 'ko');
    });

  _pdEl('lrsDmTitleIco').textContent = '📊';
  _pdEl('lrsDmTitleText').textContent = `${subject} · ${statusKey ? (MASTERY_KO[statusKey] || '전체') : '전체'} ${items.length}개`;
  _pdEl('lrsDmCount').textContent = `누적 기준 · 총 ${items.length}개`;
  const seg = _pdEl('lrsDmSeg'); seg.hidden = true; seg.innerHTML = '';

  // 빈 세그먼트는 렌더 자체가 없어 빈 드릴 발생 불가(구조적) — 아래 빈 상태는 순수 방어.
  _pdEl('lrsDmBody').innerHTML = items.length ? items.map(s => {
    const st = normStatus(s.status);
    const name = s.label || s.code || '성취기준';
    const rate = (s.rate == null) ? null : Math.round(Number(s.rate));
    const attempts = Number(s.attempts) || 0;
    // 마감1(P2 공통 규칙): insufficient 또는 rate null → "시도 N회"만 — 미채점을 "정답률 0%"로 오독 금지.
    //   (reachRate가 success 0·avg null에 0을 반환해 평가부족 행이 "정답률 0%"로 렌더되던 결함 봉합)
    const tailTxt = (rate != null && st !== 'insufficient') ? `정답률 ${rate}% · ${attempts}회` : `시도 ${attempts}회`;
    const href = '/self-learn/?achievement_code=' + encodeURIComponent(String(s.code||'').replace(/^\[|\]$/g,''));
    return `<a class="lrs-dm-row is-clickable subj-dm-row" href="${escapeAttr(href)}">
      <div class="lrs-dm-row-body">
        <div class="lrs-dm-row-primary" title="${escapeAttr(s.fullLabel || name)}">
          <span class="mastery-badge ${st}">${masteryKo(s.status)}</span><span class="subj-dm-name">${escapeHtml(name)}</span>
        </div>
        ${s.code ? `<div class="lrs-dm-row-meta subj-dm-code">${escapeHtml(s.code)}</div>` : ''}
      </div>
      <div class="lrs-dm-row-tail"><span class="subj-dm-tail">${tailTxt}</span></div>
    </a>`;
  }).join('') :
    '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">📭</div>' +
    '<div class="lrs-dm-empty-title">해당 성취기준이 없어요</div></div>';
  _pdEl('lrsDmBody').scrollTop = 0;

  if (!overlay.classList.contains('open')){
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { try { _pdEl('lrsDmClose').focus(); } catch(_){} }, 0);
  }
}

VIEWS['s-trend'] = async function(root){
  root.innerHTML = tplLoading(1);
  // 기간칩(state.period) 반영 — apiGet이 rangeQS로 현재 기간을 자동 부착. (구 period:'90d' 하드코딩 제거)
  const daily = await apiGet('/api/lrs/stats/daily');
  const rows = (daily && daily.data) || [];
  const periodTitle = periodLabelKo();   // "최근 30일" 등 선택 기간과 일치

  // 추이 차트 + P0-4 "주 학습 시간대" 습관 카드 + A6 "감정체크-학습성취 연관 분석" 카드
  root.innerHTML = `<div id="sTrendChartHost"></div><div id="sHabitHost"></div><div id="sEmotionMirrorHost"></div>`;

    chartHost.innerHTML = tplEmpty('추이 데이터가 없어요');

    mkChart(document.getElementById('sTrendLine'),'line',{
      labels: rows.map(r=>fmtDate(r.stat_date)),
      datasets:[
        { label:'학습시간(분)', data: rows.map(r=>toMinutes(r.total_duration_sec || r.total_duration)), borderColor:'var(--chart-1)', tension:.3 },
        { label:'활동 건수',    data: rows.map(r=>r.count||0),                   borderColor:'var(--chart-5)', tension:.3, yAxisID:'y2' },
        { label:'평균 점수',    data: rows.map(r=>Number(r.avg_score)||0),       borderColor:'var(--chart-3)', tension:.3, yAxisID:'y2' }
      ]
    }, { scales:{ y:{title:{display:true,text:'분'}}, y2:{position:'right', title:{display:true,text:'건/점'}, grid:{drawOnChartArea:false}} }});

  await renderStudyHours(document.getElementById('sHabitHost'));

  // A6 "감정체크-학습성취 연관 분석" — 정서×성취(학습 점수) (학생 본인)

/* =====================================================================
 * P0-4 "내가 주로 공부하는 시간" 습관 카드 — LRS_개선로드맵_KERIS벤치마킹.md §3 P0-4 ③2
 *   데이터: /api/lrs/stats/daily (apiGet이 기간칩 period + scope=mine 자동 부착)
 *           → 응답 byHour[24] — **학습활동 7종 화이트리스트** 기준 기간 시간대 집계(정본).
 *   ⚠ 감리 D1: daily-snapshot byHour는 전 유형(조회·게시글 혼입)이라 정본 위반 → /stats/daily로 교체.
 *   시각: 24칸 세로 막대(높이 120px, 최빈 #2563eb·나머지 #dbeafe) + 자연어 한 줄 16px.
 *   격려 톤 유지 — 훈계 문구 금지. 활동 0건이면 "아직 이번 기간 기록이 없어요".
 * ===================================================================== */
async function renderStudyHours(host){
  if (!host) return;
  host.innerHTML = tplLoading(1);
  const d = await apiGet('/api/lrs/stats/daily');
  const byHour = (d && Array.isArray(d.byHour)) ? d.byHour : [];
  const counts = [];
  for (let h = 0; h < 24; h++){
    const row = byHour.find(b => Number(b.hour) === h);
    counts.push(row ? (Number(row.count) || 0) : 0);
  }
  const total = counts.reduce((a, b) => a + b, 0);

  const headHtml = `
    <header><div>
      <h2>주 학습 시간대</h2>
      <div class="subtitle">이번 기간에 내가 주로 언제 공부했는지 모아봤어요</div>
    </div></header>`;

  if (!d || !total){
    host.innerHTML = `<section class="dc-chart-wrapper" aria-label="내가 주로 공부하는 시간">
      ${headHtml}
      ${tplEmpty('아직 이번 기간 기록이 없어요', {href:'/self-learn/', label:'오늘의 학습 시작하기'})}
    </section>`;
    return;
  }

  const max = Math.max(...counts);
  const peak = counts.indexOf(max);   // 최빈 시간대(동률이면 이른 시간)
  const colsHtml = counts.map((c, h) => {
    const pct = max > 0 ? Math.round(c / max * 100) : 0;
    const isPeak = h === peak;
    return `<div class="hh-col" title="${h}시 ${c}건">
      <span class="hh-bar${isPeak ? ' is-peak' : ''}" style="height:${c > 0 ? Math.max(pct, 6) : 2}%;"></span>
    </div>`;
  }).join('');
  const tickHtml = [0,6,12,18,23].map(h =>
    `<span style="left:${(h + .5) / 24 * 100}%;">${h}시</span>`).join('');

  host.innerHTML = `<section class="dc-chart-wrapper" aria-label="내가 주로 공부하는 시간">
    ${headHtml}
    <div class="habit-hours" role="img" aria-label="시간대별 학습 활동 분포 — 주로 ${peak}시~${peak+1}시">${colsHtml}</div>
    <div class="habit-ticks" aria-hidden="true">${tickHtml}</div>
    <div class="habit-msg">🕒 주로 <b>${peak}시~${peak+1}시</b>에 공부해요</div>
  </section>`;
}

/* ===== A6 "감정체크-학습성취 연관 분석" (학생 · 정서×성취) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드1(A6)
 * GET /api/lrs/emotion-mirror/:userId → { groups:[{key,label,emoji,n,avgScore|null,avgActs|null}]×3, totalDays, coaching }
 * 단일축 bar: 데이터셋 1개 = 평균 학습 점수(파랑#2563eb, y축 0~100 하나). 활동량은 툴팁에만.
 * n<5(avgScore=null) 그룹은 막대 미표시 + 차트 중앙 높이에 회색 "기록 부족"(축 라벨과 분리). 가로스크롤 0. */
async function renderEmotionMirror(host){
  if (!host) return;
  const uid = state.me && state.me.id;
  if (!uid){ host.innerHTML = ''; return; } // 로그인 정보 없으면 조용히 생략

  host.innerHTML = tplLoading(1);
  // 기간칩 반영: apiGet이 period를 자동 부착 + emotion-mirror는 ?days= 계약도 있으므로 days도 함께 전달(BE 매핑 유무와 무관하게 동작).
  const d = await apiGet('/api/lrs/emotion-mirror/' + encodeURIComponent(uid), { days: periodDays() });
  if (!d || d.success === false){
    host.innerHTML = `<section class="dc-chart-wrapper">${tplError('감정체크-학습성취 연관 분석을 불러오지 못했어요', ()=>setView('s-trend'))}</section>`;
    return;
  }

  const groups = Array.isArray(d.groups) ? d.groups : [];
  const totalDays = Number(d.totalDays) || 0;
  // 빈 상태(§⑤): 전체 기록<5일 또는 모든 그룹 소표본(n<5 → 비교할 그룹 없음).
  // n>=5 그룹이 하나라도 있으면 렌더(점수 없이 활동량만 있는 경우도 비교 대상).
  const hasComparableGroup = groups.some(g => g && Number(g.n) >= 5);
  if (totalDays < 5 || !hasComparableGroup || !groups.length){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
      <header style="margin-bottom:12px;"><div>
        <h2 style="font-size:20px;font-weight:700;margin:0;word-break:keep-all;">📊 감정체크-학습성취 수준 연관 분석</h2>
        <div class="subtitle" style="font-size:14px;">기분에 따라 내 성취(학습 점수)가 어떻게 달랐는지 살펴봐요</div>
      </div></header>
      ${tplEmpty('감정 기록이 더 쌓이면 감정체크-학습성취 연관 분석을 보여드릴게요', {href:'/attendance', label:'감정 출석 하러 가기'})}
    </section>`;
    return;
  }

  // 총 감정 기록 일수 꼬리표(mastery-chip-gray)
  const nChip = `<span class="mastery-chip-gray"><i class="fas fa-calendar-check" aria-hidden="true"></i> 감정 기록 ${totalDays}일</span>`;
  const coaching = escapeHtml(d.coaching || '이건 경향일 뿐이에요 — 어떤 날이든 네 노력은 소중해요.');

  host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
    <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0;word-break:keep-all;">📊 감정체크-학습성취 수준 연관 분석</h2>
        <div class="subtitle" style="font-size:14px;">기분에 따라 내 성취(학습 점수)가 어떻게 달랐는지 살펴봐요</div>
      </div>
      <div style="flex:none;">${nChip}</div>
    </header>
    <div class="chart-body" id="sEmoMirrorBody" style="position:relative;max-width:100%;">
      <canvas id="sEmoMirror" role="img" aria-label="감정 그룹별 평균 학습 점수 비교 막대 차트"></canvas>
    </div>
    <div id="sEmoMirrorCoach" style="margin-top:16px;background:#f0f7ff;border-left:4px solid #2563eb;border-radius:8px;padding:16px 20px;font-size:16px;line-height:1.7;color:#1e3a5f;">
      💬 ${coaching}
    </div>
    <div style="margin-top:10px;text-align:right;">
      <a href="/attendance" style="font-size:14px;color:#2563eb;font-weight:600;text-decoration:none;">감정 기록 더 보기 →</a>
    </div>
  </section>`;

  // x라벨 = 이모지+텍스트. n<5(avgScore=null) 그룹은 데이터 null(막대 미표시).
  const labels   = groups.map(g => `${g.emoji || ''} ${g.label || ''}`.trim());
  const scoreData = groups.map(g => (g && g.avgScore != null) ? g.avgScore : null);
  const nList     = groups.map(g => (g && g.n != null) ? Number(g.n) : 0);
  const shortLabelP = window.matchMedia && window.matchMedia('(max-width:768px)').matches ? 13 : 14;

  // 데이터라벨(막대 위 수치, 값 있을 때만) + 소표본 "기록 부족"(차트 영역 중앙 높이) — 인라인 플러그인(신규 라이브러리 없음)
  const emoMirrorLabelPlugin = {
    id: 'emoMirrorLabels',
    afterDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const xScale = chart.scales.x;
      const area = chart.chartArea;
      ctx.save();
      // 막대 위 데이터라벨 — 실제 막대(avgScore≠null)에만
      if (meta && !meta.hidden){
        ctx.fillStyle = '#1d4ed8';
        ctx.font = '700 ' + shortLabelP + 'px Pretendard, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const v = scoreData[i];
          if (v == null) return;                          // 값 없으면 라벨 없음(떠다니는 라벨 방지)
          ctx.fillText(String(Math.round(v)) + '점', bar.x, bar.y - 4);
        });
      }
      // 소표본 그룹(n<5) → 차트 영역 중앙 높이에 옅은 회색 "기록 부족"(x축 감정 라벨과 분리)
      ctx.fillStyle = '#9ca3af';
      ctx.font = '600 ' + shortLabelP + 'px Pretendard, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const midY = (area.top + area.bottom) / 2;
      labels.forEach((_, i) => {
        if (nList[i] < 5){
          ctx.fillText('기록 부족', xScale.getPixelForValue(i), midY);
        }
      });
      ctx.restore();
    }
  };

  const canvas = document.getElementById('sEmoMirror');
  const chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'평균 학습 점수', data: scoreData, backgroundColor:'#2563eb', borderRadius:4, maxBarThickness:64 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:18, bottom:8 } },
      animation:{ duration:600, easing:'easeOutCubic' },
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label(c){
              const g = groups[c.dataIndex] || {};
              if (g.avgScore == null) return `${g.label||''} · ${g.n||0}일 · 기록 부족`;
              const acts = g.avgActs != null ? `활동 ${g.avgActs}건 · ` : '';
              return `${g.label||''} · 평균 ${g.avgScore}점 · ${acts}${g.n||0}일`;
            }
          }
        }
      },
      scales:{
        x:{ grid:{ display:false }, ticks:{ font:{size:shortLabelP} } },
        y:{ beginAtZero:true, min:0, max:100, title:{ display:true, text:'점수', font:{size:13} }, ticks:{ stepSize:20, font:{size:12} } }
      }
    },
    plugins: [emoMirrorLabelPlugin]
  });
  state.charts.push(chart);
}

/* ===== B6 "정서-참여 교차" (교사 · 반 2×2 산점) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드2(B6)
 * GET /api/lrs/emotion-engage/class/:id?weeks=2
 *   → { points:[{userId,name,x(0~100·100=참여유지→우),y(0~100·100=긍정↑),quadrant,hasEmotion,engageNote,emotionNote}],
 *       summary:{red,care,motive,stable}, masked, disclaimer }
 * scatter(긍정↑·부정↓ 표준) + 캔버스 뒤 CSS grid 4색 오버레이 + 하단 4칩. 모바일<768=사분면 리스트 폴백. 가로스크롤 0. */
const ENG_QUAD = {
  red:    { ko:'적신호',    emoji:'🔴', color:'#ef4444' },
  care:   { ko:'정서 케어', emoji:'💛', color:'#f59e0b' },
  motive: { ko:'학습 동기', emoji:'🧩', color:'#2563eb' },
  stable: { ko:'안정',      emoji:'🟢', color:'#16a34a' },
};
async function renderEmotionEngage(host){
  if (!host) return;
  host.innerHTML = tplLoading(2);
  const cid = await resolveClassId();
  const d = await apiGet('/api/lrs/emotion-engage/class/' + encodeURIComponent(cid), { weeks:2 });
  if (!d || d.success === false){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">${tplError('정서-참여 교차를 불러오지 못했어요', ()=>setView('t-warnings'))}</section>`;
    return;
  }

  const points = Array.isArray(d.points) ? d.points : [];
  const summary = d.summary || { red:0, care:0, motive:0, stable:0 };
  const masked = !!d.masked;
  const weeks = Number(d.weeks) || 2;

  const maskChip = masked
    ? `<span class="mastery-chip-gray"><i class="fas fa-user-shield" aria-hidden="true"></i> 타 반 — 이름 익명</span>`
