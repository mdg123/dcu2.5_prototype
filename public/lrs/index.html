<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다채움 - LRS 학습분석</title>
  <link rel="stylesheet" href="/css/common-nav.css">
  <link rel="stylesheet" href="/css/lrs-tokens.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html { overflow-x:clip; }
    body { font-family:var(--font-sans); background:var(--gray-50); color:var(--gray-800); margin:0; overflow-x:clip; }
    .toolbar { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
    /* ── 트리맵(간이·CSS) & 드릴다운 브레드크럼 ─────────────────── */
    .dc-treemap { display:flex; flex-wrap:wrap; gap:2px; padding:4px; background:var(--gray-100); border-radius:6px; min-height:260px; }
    .dc-treemap .cell { position:relative; flex-grow:1; min-width:60px; min-height:44px; border-radius:4px;
      padding:6px 8px; color:#fff; font-size:var(--fs-cap); line-height:1.3; overflow:hidden; cursor:default;
      display:flex; flex-direction:column; justify-content:space-between; }
    .dc-treemap .cell b { font-size:var(--fs-sm); font-weight:600; display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
    .dc-treemap .cell small { opacity:.85; }
    .dc-treemap .cell.masked { background:repeating-linear-gradient(45deg,#94a3b8,#94a3b8 6px,#64748b 6px,#64748b 12px); color:#fff; }
    .dc-drill-bc { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:var(--fs-body); margin:4px 0 12px; }
    .dc-drill-bc button { background:transparent; border:1px solid var(--gray-300); border-radius:14px; padding:4px 10px; font-size:var(--fs-h3); cursor:pointer; color:var(--gray-700); }
    .dc-drill-bc button[aria-current="page"] { background:var(--lrs-primary,#2563eb); color:#fff; border-color:var(--lrs-primary,#2563eb); }
    .dc-drill-bc .sep { color:var(--gray-400); }
    .dc-dumbbell-legend { display:flex; gap:12px; font-size:var(--fs-sm); color:var(--gray-600); margin:0 0 8px; }
    .dc-dumbbell-legend .swatch { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }

    /* ── 데이터 범위 토글 (시드 포함 / 실데이터만) ───────────────── */
    .dc-realonly-toggle { display:inline-flex; align-items:center; gap:var(--space-2); margin-left:auto; flex-wrap:wrap; }
    .dc-realonly-toggle[hidden] { display:none; }
    .dc-realonly-toggle .dc-realonly-label { font-size:var(--fs-body); font-weight:600; color:var(--gray-700); }
    .dc-realonly-toggle .chip {
      padding:5px 12px; border-radius:var(--radius-pill); border:1px solid var(--gray-300);
      background:#fff; font-size:var(--fs-body); font-weight:600; color:var(--gray-600); cursor:pointer;
      transition:all var(--dur) var(--ease-out);
    }
    .dc-realonly-toggle .chip:hover { background:var(--gray-50); color:var(--gray-800); }
    .dc-realonly-toggle .chip[aria-pressed="true"] { background:var(--lrs-primary); color:#fff; border-color:var(--lrs-primary); }

    /* ── 단위 토글 (블록 내부 셀렉터 칩) ─────────────────────────── */
    .dc-unit-toggle { display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .dc-unit-toggle .chip {
      padding:4px 12px; border-radius:var(--radius-pill); border:1px solid var(--gray-300);
      background:#fff; font-size:var(--fs-body); font-weight:600; color:var(--gray-600); cursor:pointer;
    }
    .dc-unit-toggle .chip[aria-pressed="true"] { background:var(--lrs-primary); color:#fff; border-color:var(--lrs-primary); }

    /* ── 서비스 사용률 가로 막대 랭킹 ───────────────────────────── */
    .dc-svc-rank { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .dc-svc-rank .row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:12px; }
    .dc-svc-rank .name { font-size:var(--fs-body); font-weight:600; color:var(--gray-800); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dc-svc-rank .bar-track { position:relative; height:24px; background:var(--gray-100); border-radius:6px; overflow:hidden; }
    .dc-svc-rank .bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:6px; min-width:3px; transition:width .5s var(--ease-out); }
    .dc-svc-rank .row.top .bar-fill { background:var(--chart-2); }
    .dc-svc-rank .row.bottom .bar-fill { background:var(--chart-4); }
    .dc-svc-rank .row .bar-fill { background:var(--chart-1); }
    .dc-svc-rank .meta { display:flex; align-items:center; gap:8px; font-size:var(--fs-body); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .dc-svc-rank .cnt { font-weight:700; color:var(--gray-900); }
    .dc-svc-rank .delta { font-size:var(--fs-sm); font-weight:600; padding:2px 8px; border-radius:var(--radius-pill); }
    .dc-svc-rank .delta.up { color:#15803d; background:#dcfce7; }
    .dc-svc-rank .delta.down { color:#b91c1c; background:#fee2e2; }
    .dc-svc-rank .delta.flat { color:var(--gray-600); background:var(--gray-100); }

    /* ── 진단 카드 그리드 ──────────────────────────────────────── */
    .dc-diag-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--space-3); }
    .dc-diag-card { border:1px solid var(--gray-200); border-left-width:4px; border-radius:var(--radius-md); padding:14px 16px; background:#fff; }
    .dc-diag-card[data-sev="critical"] { border-left-color:#dc2626; background:#fef2f2; }
    .dc-diag-card[data-sev="warn"] { border-left-color:#f59e0b; background:#fffbeb; }
    .dc-diag-card[data-sev="caution"] { border-left-color:#eab308; background:#fefce8; }
    .dc-diag-card[data-sev="ok"] { border-left-color:#10b981; }
    .dc-diag-card .dc-diag-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .dc-diag-card .dc-diag-svc { font-size:var(--fs-h2); font-weight:700; color:var(--gray-900); }
    .dc-diag-card .dc-diag-status { font-size:var(--fs-cap); font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); white-space:nowrap; }
    .dc-diag-card[data-sev="critical"] .dc-diag-status { color:#dc2626; background:#fee2e2; }
    .dc-diag-card[data-sev="warn"] .dc-diag-status { color:#b45309; background:#fef3c7; }
    .dc-diag-card[data-sev="caution"] .dc-diag-status { color:#a16207; background:#fef9c3; }
    .dc-diag-card .dc-diag-msg { font-size:var(--fs-body); color:var(--gray-700); line-height:1.6; }
    .dc-diag-card .dc-diag-metrics { display:flex; gap:14px; margin-top:10px; font-size:var(--fs-sm); color:var(--gray-600); flex-wrap:wrap; }
    .dc-diag-card .dc-diag-metrics b { color:var(--gray-900); }

    /* ── 3분위 매트릭스 카드 ───────────────────────────────────── */
    .dc-tertile-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); }
    .dc-tertile-card { border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:16px; text-align:center; color:#fff; }
    .dc-tertile-card.t-hi { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
    .dc-tertile-card.t-mid { background:linear-gradient(135deg,#10b981,#059669); }
    .dc-tertile-card.t-lo { background:linear-gradient(135deg,#f59e0b,#d97706); }
    .dc-tertile-card .t-tier { font-size:var(--fs-body); font-weight:700; opacity:.92; margin-bottom:6px; }
    .dc-tertile-card .t-score { font-size:var(--fs-display); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
    .dc-tertile-card .t-unit { font-size:var(--fs-body); font-weight:500; margin-left:2px; }
    .dc-tertile-card .t-n { font-size:var(--fs-sm); opacity:.85; margin-top:6px; }

    /* ── 인사이트 배너 ─────────────────────────────────────────── */
    .dc-insight-banner { display:flex; align-items:flex-start; gap:12px; background:#eff6ff; border:1px solid #bfdbfe; border-left:4px solid var(--lrs-primary);
      border-radius:var(--radius-md); padding:14px 18px; margin-bottom:var(--space-4); font-size:var(--fs-body); color:var(--gray-800); line-height:1.6; }
    .dc-insight-banner .ib-icon { font-size:20px; line-height:1.2; flex-shrink:0; }
    .dc-insight-banner strong { color:var(--lrs-primary-dark); }
    .dc-insight-banner.small-sample { background:#fffbeb; border-color:#fde68a; border-left-color:#f59e0b; }

    /* ── 학교급 미니카드 ───────────────────────────────────────── */
    .dc-level-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); margin-top:var(--space-4); }
    .dc-level-mini .mini { border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:14px 16px; background:#fff; }
    .dc-level-mini .mini .lv { font-size:var(--fs-body); font-weight:700; color:var(--gray-800); margin-bottom:6px; }
    .dc-level-mini .mini .row { display:flex; justify-content:space-between; font-size:var(--fs-sm); color:var(--gray-600); padding:3px 0; }
    .dc-level-mini .mini .row b { color:var(--gray-900); font-variant-numeric:tabular-nums; }

    @media (max-width:768px){
      .dc-svc-rank .row { grid-template-columns:96px 1fr; grid-template-areas:'name meta' 'bar bar'; row-gap:6px; }
      .dc-svc-rank .name { grid-area:name; }
      .dc-svc-rank .meta { grid-area:meta; justify-self:end; }
      .dc-svc-rank .bar-track { grid-area:bar; }
      .dc-tertile-grid { grid-template-columns:1fr; }
      .dc-level-mini { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>
  <!-- GNB(공통) -->
  <script src="/js/common-nav.js"></script>

  <div id="lrsRoot" class="lrs-shell" hidden>
    <!-- 좌측 서브메뉴 (역할별 동적) -->
    <aside class="lrs-sidemenu" aria-label="LRS 서브메뉴">
      <h3 id="roleMenuTitle" hidden>메뉴</h3>
      <nav id="roleMenu" role="navigation" aria-live="polite"></nav>
    </aside>

    <div class="lrs-main">
      <!-- 표준 페이지 헤더 -->
      <header class="page-header">
        <div class="page-header__main">
          <div class="page-header__title-row">
            <span class="page-header__icon" aria-hidden="true">📈</span>
            <h1 class="page-header__title">LRS 학습분석</h1>
          </div>
          <p class="page-header__subtitle">나의 학습 활동 데이터를 한눈에 분석하세요.</p>
          <div class="breadcrumb" aria-label="현재 위치" style="font-size:13px;color:#6B7280;margin:8px 0 0 40px;">
            LRS &rsaquo; <span id="bcRole">—</span> &rsaquo; <span id="bcMenu">—</span> &rsaquo; <strong id="bcPage">—</strong>
          </div>
        </div>
        <div class="page-header__actions">
          <div class="dc-role-switcher" role="group" aria-label="역할 전환">
            <button type="button" data-role="student" aria-pressed="false" aria-label="학생 뷰로 전환">학생</button>
            <button type="button" data-role="teacher" aria-pressed="false" aria-label="교사 뷰로 전환">교사</button>
            <button type="button" data-role="admin"   aria-pressed="false" aria-label="관리자 뷰로 전환">관리자</button>
          </div>
          <span class="sync-time" id="syncTime" aria-live="polite">동기화: --:--</span>
        </div>
      </header>

      <!-- 공통 필터 바 (기간 피커) -->
      <section class="dc-filter-bar" aria-label="기간 필터">
        <label>기간</label>
        <div class="dc-period-picker" id="periodPicker" role="group" aria-label="기간 빠른선택">
          <button class="chip" type="button" data-period="7d"  aria-pressed="false">최근 7일</button>
          <button class="chip" type="button" data-period="30d" aria-pressed="true">최근 30일</button>
          <button class="chip" type="button" data-period="90d" aria-pressed="false">최근 90일</button>
          <button class="chip" type="button" data-period="custom" aria-pressed="false">사용자 지정</button>
          <span class="custom-range" id="customRange" hidden>
            <input type="date" id="rangeFrom" aria-label="시작일">
            <span>~</span>
            <input type="date" id="rangeTo" aria-label="종료일">
            <button type="button" class="chip" id="applyCustom" style="background:var(--lrs-primary);color:#fff;border-color:var(--lrs-primary);">적용</button>
          </span>
        </div>
        <!-- 데이터 범위 토글 (관리자 전용) — 시드 포함 / 실데이터만 -->
        <div class="dc-realonly-toggle" id="realOnlyToggle" role="group" aria-label="데이터 범위" hidden>
          <span class="dc-realonly-label">데이터</span>
          <button class="chip" type="button" data-real="0" aria-pressed="true">시드 포함</button>
          <button class="chip" type="button" data-real="1" aria-pressed="false">실데이터만</button>
        </div>
      </section>

      <!-- 콘텐츠 영역 (뷰 주입) -->
      <main class="lrs-content page-shell" id="viewRoot" aria-live="polite">
        <div class="dc-state-panel"><i class="fas fa-spinner fa-spin"></i><p>로딩 중…</p></div>
      </main>
    </div>
  </div>

  <!-- Drawer (교사 드릴다운용) -->
  <div class="dc-drawer-overlay" id="drawerOverlay" data-open="false"></div>
  <aside class="dc-drawer" id="drilldownDrawer" data-open="false" aria-hidden="true" aria-label="학생 드릴다운">
    <header>
      <h2 id="drawerTitle">학생 상세</h2>
      <button class="close-btn" type="button" aria-label="닫기" id="drawerCloseBtn">&times;</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

<script>
/* =====================================================================
 * LRS Phase 2 Shell
 * - 역할 기반 IA + dc-period-picker(B4 단일화)
 * - Chart.js 단일 사용, 신규 라이브러리 없음
 * ===================================================================== */
(function(){
'use strict';

const PERIODS = { '7d':7, '30d':30, '90d':90 };

/* ---- 보안 헬퍼: HTML escape (C-1 XSS 방지) ---- */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

const state = {
  me: null,
  role: 'student',          // 'student' | 'teacher' | 'admin'
  view: null,               // 현재 뷰 id
  period: '30d',
  from: null,
  to:   null,
  charts: [],
  classId: null,            // teacher's resolved class_id (lazy)
  scope: 'mine',            // 'mine' | 'class' | 'all' — 역할에 따라 자동 계산
  realOnly: false,          // (관리자) true면 시드 제외 실데이터만(?realOnly=1)
};

/* ---- 역할 → 데이터 스코프 계산 ---- */
function computeScope(){
  if (state.role === 'student') return 'mine';
  if (state.role === 'teacher') return 'class';
  if (state.role === 'admin')   return 'all';
  return 'mine';
}

/* ---- scope 자동 부착 대상 엔드포인트 판별 ---- */
function _shouldAttachScope(path){
  if (!path) return false;
  return /^\/api\/lrs\/(stats\/|dashboard|warnings\/)/.test(path);
}

/* ---- 공통 포맷 헬퍼 ---- */
function toMinutes(sec){ return Math.round((Number(sec)||0)/60); }
function fmtDate(s){
  if (!s) return '-';
  const str = String(s);
  // 'YYYY-MM-DD' 그대로 있으면 뒷 5글자(MM-DD) 사용
  const m = str.match(/\d{4}-(\d{2}-\d{2})/);
  return m ? m[1] : str;
}

/* ---- 교사 class_id 해석 (fallback 1) ---- */
async function resolveClassId(){
  if (state.classId) return state.classId;
  // 실제 prefix: /api/class (single)
  for (const path of ['/api/class/my', '/api/classes/my']){
    try {
      const r = await fetch(path, { credentials:'include' });
      if (r.ok){
        const j = await r.json();
        const list = (j && j.classes) || [];
        if (list.length){ state.classId = list[0].id; return state.classId; }
      }
    } catch(_){}
  }
  state.classId = (state.me && (state.me.class_id || state.me.classId)) || 1;
  return state.classId;
}

/* ---- C안 계층형 IA: 2차 메뉴 카테고리 정의 ---- */
const CATEGORIES = [
  { key:'home',       label:'홈',        roles:['student','teacher','admin'] },
  { key:'analytics',  label:'현황 분석', roles:['student','teacher','admin'] },
  { key:'activities', label:'학습 활동', roles:['student','teacher','admin'] },
  { key:'operations', label:'운영',      roles:['teacher','admin'] },
  { key:'reports',    label:'리포트',    roles:['admin'] },
];
const ROLE_CATEGORIES = {
  student: ['home','analytics','activities'],
  teacher: ['home','analytics','activities','operations'],
  admin:   ['home','analytics','operations','reports'],
};

/* ---- 메뉴 정의 (역할별, category 필드 부여) ---- */
const MENUS = {
  student: [
    { id:'s-home',       label:'홈',              icon:'fa-house',         group:'나의 학습',  category:'home' },
    { id:'s-trend',      label:'활용 현황',       icon:'fa-chart-line',    group:'분석',       category:'analytics' },
    { id:'s-achieve',    label:'성취 분석',       icon:'fa-award',         group:'분석',       category:'analytics' },
    { id:'s-compare',    label:'비교',            icon:'fa-people-group',  group:'분석',       category:'analytics' },
    { id:'s-xapi',       label:'표준체계 분석',    icon:'fa-diagram-project',group:'분석',      category:'analytics' },
    { id:'s-perform',    label:'과제·평가 수행',  icon:'fa-tasks',         group:'학습 활동',  category:'activities' },
    { id:'s-custom',     label:'맞춤학습',        icon:'fa-compass',       group:'학습 활동',  category:'activities' },
    { id:'s-daily',      label:'일일현황',        icon:'fa-calendar-day',  group:'학습 활동',  category:'activities' },
  ],
  teacher: [
    { id:'t-home',       label:'홈',              icon:'fa-gauge',                 group:'우리반',        category:'home' },
    { id:'t-usage',      label:'활용 현황',        icon:'fa-chalkboard',            group:'분석',         category:'analytics' },
    { id:'t-subject',    label:'성취 분석',        icon:'fa-book',                  group:'분석',         category:'analytics' },
    { id:'t-xapi',       label:'표준체계 분석',    icon:'fa-diagram-project',       group:'분석',         category:'analytics' },
    { id:'t-perform',    label:'과제·평가 수행',  icon:'fa-tasks',                 group:'학습 활동',     category:'activities' },
    { id:'t-custom',     label:'맞춤학습 관리',    icon:'fa-compass',               group:'학습 활동',     category:'activities' },
    { id:'t-daily',      label:'일일현황',        icon:'fa-calendar-day',          group:'학습 활동',     category:'activities' },
    { id:'t-warnings',   label:'경고',            icon:'fa-triangle-exclamation',  group:'학습 활동',     category:'activities' },
    { id:'t-drill',      label:'학생 드릴다운',    icon:'fa-user-magnifying-glass', group:'학습 활동',     category:'activities' },
    { id:'t-teacher-idx',label:'교사 활용지수',    icon:'fa-chalkboard-teacher',    group:'운영',         category:'operations' },
  ],
  admin: [
    // ── 핵심 5블록 (정책가의 질문 순서) ──
    { id:'a-home',       label:'한눈 현황',        icon:'fa-globe',                 group:'홈',             category:'home' },
    { id:'a-svc-ops',    label:'서비스 운영 진단',  icon:'fa-gauge-high',            group:'거시 분석',       category:'analytics' },
    { id:'a-macro',      label:'거시 비교',        icon:'fa-layer-group',           group:'거시 분석',       category:'analytics' },
    { id:'a-cross',      label:'활동×성취 교차',    icon:'fa-arrows-to-dot',         group:'거시 분석',       category:'analytics' },

    // ── 보조 (고급/운영) ──

  // 2순위: 다른 역할의 MENUS 탐색 (역할 스위칭 중간 상태 방어)

/* ---- API 헬퍼 ---- */
function rangeQS(extra, path){
  const params = new URLSearchParams();
  if (state.period === 'custom') {
    if (state.from) params.set('from', state.from);
    if (state.to)   params.set('to',   state.to);
  } else {
    params.set('period', state.period);
  }
  // scope 자동 부착: stats/*, dashboard, warnings/*
  if (path === undefined || _shouldAttachScope(path)){
    const sc = state.scope || computeScope();
    if (sc) params.set('scope', sc);
  }
  // realOnly 자동 부착: 관리자 + stats 계열일 때만 (시드 포함=0 / 실데이터만=1)
  if (state.role === 'admin' && state.realOnly && (path === undefined || _shouldAttachScope(path))){
    params.set('realOnly', '1');
  }
  if (extra) Object.entries(extra).forEach(([k,v])=>{ if(v!=null) params.set(k,v); });
  const qs = params.toString();
  return qs ? '?' + qs : '';
}

async function apiGet(path, extra){
  try {
    const r = await fetch(path + rangeQS(extra, path), { credentials:'include' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch (e) {
    console.warn('[LRS] API 실패', path, e.message);
    return null;
  }
}

/* CSS 변수 → 실제 색 해석 (Chart.js는 var(--..) 문자열을 인식 못함) */
const CHART_FALLBACK = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#6366f1'];
function _resolveCssVar(str){
  if (typeof str !== 'string') return str;
  const m = str.match(/^\s*var\(\s*(--[\w-]+)\s*(?:,\s*([^)]+))?\)\s*$/);
  if (!m) return str;
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
    if (v) return v;
  } catch(_){}
  return m[2] ? m[2].trim() : str;
}
function _resolveColorField(val, idx){
  if (Array.isArray(val)) return val.map((v,i)=> _resolveColorField(v, i));
  const r = _resolveCssVar(val);
  if (typeof r === 'string' && /^\s*var\(/.test(r)) return CHART_FALLBACK[(idx||0) % CHART_FALLBACK.length];
  return r;
}
function _resolveDatasetColors(data){
  if (!data || !Array.isArray(data.datasets)) return data;
  data.datasets.forEach((ds, i)=>{
    ['backgroundColor','borderColor','hoverBackgroundColor','hoverBorderColor','pointBackgroundColor','pointBorderColor'].forEach(k=>{
      if (ds[k] !== undefined) ds[k] = _resolveColorField(ds[k], i);
    });
  });
  return data;
}

  for (const k of keys){

}

function donutLegendOpts(unit){

              strokeStyle: 'transparent',

function mkChart(canvas, type, data, opts){
  if (!canvas) return null;
  _resolveDatasetColors(data);
  const base = {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ position:'bottom', labels:{ font:{size:LRS_CHART_FONT_SIZE}, usePointStyle:true, boxWidth:14, padding:10 } } },
    animation:{ duration:600, easing:'easeOutCubic' },
  };
  const chart = new Chart(canvas, { type, data, options: Object.assign(base, opts||{}) });
  state.charts.push(chart);
  return chart;
}

/* =====================================================================
 * dc-data-table 구현 (P1-U-01)
 * ===================================================================== */
function renderDataTable(container, config){
  if (!container) return;
  const cols = (config && config.columns) || [];
  const rows = (config && config.rows) || [];
  const sortKey = (config && config.initialSort) || null;
  const sortDir = (config && config.initialDir) || 'asc';

  const state = { sortKey, sortDir, rows: rows.slice() };

  function applySort(){
    if (!state.sortKey) return;
    const dir = state.sortDir === 'asc' ? 1 : -1;
    state.rows.sort((a,b)=>{
      const va = a[state.sortKey], vb = b[state.sortKey];
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*dir;
      return String(va).localeCompare(String(vb), 'ko') * dir;
    });
  }

  function draw(){
    applySort();
    const thead = cols.map(c => {
      const cls = ['sortable'];
      if (state.sortKey === c.key) cls.push(state.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      return `<th class="${cls.join(' ')}" data-key="${escapeAttr(c.key)}">${escapeHtml(c.label)}</th>`;
    }).join('');
    const tbody = state.rows.map((row, idx) => {
      const tds = cols.map(c => {
        const raw = row[c.key];
        let cell;
        if (typeof c.format === 'function'){
          // format() may return HTML; caller is responsible for escaping
          cell = c.format(raw, row);
        } else {
          cell = escapeHtml(raw == null ? '-' : raw);
        }
        const align = c.align === 'right' ? ' class="num"' : '';
        return `<td${align}>${cell}</td>`;
      }).join('');
      const rowId = row.user_id || row.id || idx;
      return `<tr data-row-id="${escapeAttr(rowId)}" data-row-idx="${idx}">${tds}</tr>`;
    }).join('');

    container.innerHTML = `<div class="dc-data-table-wrap"><table class="dc-data-table">
      <thead><tr>${thead}</tr></thead>
      <tbody>${tbody || `<tr><td colspan="${cols.length}" style="padding:24px;text-align:center;color:var(--gray-500);">표시할 데이터가 없습니다</td></tr>`}</tbody>
    </table></div>`;

    container.querySelectorAll('thead th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        else { state.sortKey = key; state.sortDir = 'asc'; }
        draw();
      });
    });
    if (typeof config.onRowClick === 'function'){
      container.querySelectorAll('tbody tr[data-row-id]').forEach(tr => {
        tr.addEventListener('click', () => {
          const idx = parseInt(tr.getAttribute('data-row-idx'),10);
          config.onRowClick(state.rows[idx]);
        });
      });
    }
  }
  draw();
}

/* =====================================================================
 * dc-heatmap 구현 (요일×시간 7x24)
 * ===================================================================== */
function renderHeatmap(container, dailyRows){
  if (!container) return;
  const matrix = Array.from({length:7}, () => Array(24).fill(0));
  (dailyRows||[]).forEach(r => {
    const d = r.date ? new Date(r.date) : null;
    if (!d || isNaN(d)) return;
    const dow = d.getDay();
    const hour = r.hour != null ? r.hour : (d.getHours());
    const v = r.count || r.total_count || Math.round((r.total_duration||0)/60) || 0;
    matrix[dow][hour] += v;
  });
  let maxV = 0;
  matrix.forEach(row => row.forEach(v => { if (v>maxV) maxV = v; }));
  function bucket(v){
    if (!maxV || v<=0) return 0;
    const r = v/maxV;
    if (r>.75) return 4;
    if (r>.5)  return 3;
    if (r>.25) return 2;
    if (r>0)   return 1;
    return 0;
  }
  const dows = ['일','월','화','수','목','금','토'];
  const ylabels = dows.map(d => `<div>${d}</div>`).join('');
  const cells = matrix.map((row, di) =>
    row.map((v, hi) => `<div class="cell heat-${bucket(v)}" data-h="${bucket(v)}" title="${dows[di]} ${hi}시: ${v}" aria-label="${dows[di]}요일 ${hi}시 활동 ${v}">${v>0?v:''}</div>`).join('')
  ).join('');
  const xlabels = Array.from({length:24}, (_,i) => `<div>${i%3===0?i:''}</div>`).join('');
  container.innerHTML = `
    <div class="dc-heatmap-wrap">
      <div class="hm-ylabels" style="grid-template-rows:repeat(7,1fr);">${ylabels}</div>
      <div class="dc-heatmap" style="grid-template-columns:repeat(24,1fr);">${cells}</div>
      <div></div>
      <div class="hm-xlabels">${xlabels}</div>
    </div>`;
}

/* =====================================================================
 * dc-gauge 구현 (반원 SVG)
 * ===================================================================== */
function renderGauge(container, current, target, label){
  if (!container) return;
  const pct = target>0 ? Math.min(100, Math.round((current/target)*100)) : 0;
  const cx=80, cy=80, r=64;
  const startA = Math.PI, endA = startA + (pct/100)*Math.PI;
  function pt(a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
  const [sx,sy] = pt(startA);
  const [ex,ey] = pt(endA);
  const large = (endA-startA) > Math.PI ? 1 : 0;
  const arcBg = `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  const arcFg = pct>0 ? `M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}` : '';
  container.innerHTML = `
    <div class="gauge-label">${escapeHtml(label||'')}</div>
    <svg viewBox="0 0 160 96" aria-label="${escapeAttr((label||'')+' '+pct+'%')}">
      <path d="${arcBg}" stroke="var(--gray-200)" stroke-width="14" fill="none" stroke-linecap="round"/>
      ${arcFg?`<path d="${arcFg}" stroke="var(--lrs-primary)" stroke-width="14" fill="none" stroke-linecap="round"/>`:''}
    </svg>
    <div class="gauge-value">${pct}%</div>`;
}

/* =====================================================================
 * dc-sparkline 구현 (SVG polyline, 7일)
 * ===================================================================== */
function renderSparkline(container, values, opts){
  if (!container) return;
  const vals = (values||[]).map(v => Number(v)||0);
  if (!vals.length) { container.innerHTML = ''; return; }
  const W=80, H=28, P=2;
  const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  const range = (max-min) || 1;
  const step = vals.length>1 ? (W-P*2)/(vals.length-1) : 0;
  const pts = vals.map((v,i)=> {
    const x = P + i*step;
    const y = H - P - ((v-min)/range)*(H-P*2);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const color = (opts&&opts.color) || 'var(--lrs-primary)';
  container.innerHTML = `<svg class="dc-sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>
  </svg>`;
}

/* =====================================================================
 * 관리자 분석 헬퍼 (집계·분포 전용, 개인식별 금지)
 * ===================================================================== */
// URL test-hook: ?aIdxN=1234 등으로 게이트 경계값 수동 주입
function _adminTestHook(key){
  try { const v = new URLSearchParams(location.search).get(key); return v==null? null : v; } catch(_){ return null; }
}

// 최소표본 가드: n<threshold → 차단 패널 렌더하고 false 반환
function _minSampleGuard(root, n, threshold, label){
  if (Number(n) >= Number(threshold)) return true;
  root.innerHTML = `<div class="dc-state-panel" role="status" style="border-left:4px solid #64748b;background:#f1f5f9;">
    <i class="fas fa-lock" aria-hidden="true" style="color:#64748b;">🔒</i>
    <p><strong>표본 부족 — 개인 식별 방지</strong></p>
    <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.6;">
      ${escapeHtml(label||'선택한 범위')}의 표본 수가 ${n}건으로 최소 기준(${threshold}) 미만입니다.
      개인이 식별될 수 있어 결과를 표시하지 않습니다. 기간이나 범위를 더 넓게 선택하세요.
    </p>
  </div>`;
  return false;
}

// 행 단위 셀 마스킹: n<threshold 행의 민감 컬럼을 '***'로 치환 (원본 n/비율만 유지)
function _cellSuppress(rows, opts){
  opts = opts || {};
  const nKey = opts.nKey || 'n';
  const threshold = opts.threshold || 5;
  const maskKeys = opts.maskKeys || [];
  return rows.map(r => {
    if (Number(r[nKey]) < threshold) {
      const out = Object.assign({}, r, { _masked: true });
      maskKeys.forEach(k => { out[k] = '***'; });
      return out;
    }
    return r;
  });
}

// 퍼센타일 (0-100)
function _percentile(sorted, p){
  if (!sorted || !sorted.length) return 0;
  const idx = (sorted.length - 1) * (p/100);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi]-sorted[lo]) * (idx-lo);
}

// 시드드 PRNG (deterministic mock)
function _mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

// 정규분포 근사 (Box-Muller)
function _gaussian(rng, mean, sd){
  const u = Math.max(1e-9, rng()), v = Math.max(1e-9, rng());
  return mean + sd * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

/* ---- 충북 스케일 상수 ---- */
const CB_REGIONS = ['청주교육지원청','충주교육지원청','제천교육지원청','보은교육지원청','옥천교육지원청','영동교육지원청','증평교육지원청','진천교육지원청','괴산교육지원청','음성교육지원청','단양교육지원청'];
const CB_SCHOOL_LEVELS = ['초등학교','중학교','고등학교'];

/* ---- Mock 교사 분포 (충북 ≈ 11,000명) ---- */
// Phase 2: /api/stats/teacher-index-dist?level=&region=&period= 연결 예정
function _mockTeacherIdxDist(filters){
  const n = Number(_adminTestHook('aIdxN')) || 11042;
  const rng = _mulberry32(20260422 + (filters.level==='초등학교'?1:filters.level==='중학교'?2:filters.level==='고등학교'?3:0));
  const scores = [];
  for (let i=0;i<n;i++){
    let v = _gaussian(rng, 62, 14);
    if (v<0) v=0; if (v>100) v=100;
    scores.push(Math.round(v*10)/10);
  }
  scores.sort((a,b)=>a-b);
  // 학교급별 교사분포
  const byLevel = {};
  CB_SCHOOL_LEVELS.forEach((lv,idx)=>{
    const cnt = Math.round(n * [0.55,0.28,0.17][idx]);
    const arr = [];
    const rng2 = _mulberry32(99 + idx*17);
    for (let i=0;i<cnt;i++){
      let v = _gaussian(rng2, 60+idx*3, 13);
      if (v<0) v=0; if (v>100) v=100;
      arr.push(v);
    }
    arr.sort((a,b)=>a-b);
    byLevel[lv] = arr;
  });
  return { n, scores, byLevel };
}

      ${kpiCard('상위 p90',    p90.toFixed(1),            '점', {dir:'flat',text:'상위 10%'},    'success')}
      ${kpiCard('평균',        mean.toFixed(1),           '점', {dir:'flat',text:`p10=${p10.toFixed(1)} · p95=${p95.toFixed(1)}`}, 'warning')}
    </section>
    <section class="dc-chart-grid">
      ${chartWrap('aIdxHist','실행지수 분포 (히스토그램)',`빈 폭 ${binWidth}점 · p10/p50/p90 기준선`,`중위값 ${p50.toFixed(1)}점, 상위 10% 기준 ${p90.toFixed(1)}점`)}
      ${chartWrap('aIdxBox','학교급별 박스플롯','p25·중위·p75 구간 (학교별 교사<5 셀은 마스킹)')}
    </section>
    ${maskedBins>0? `<p style="font-size:var(--fs-sm);color:var(--gray-600);margin-top:8px;">🔒 빈당 교사<10인 구간 ${maskedBins}개는 개인 식별 방지를 위해 숨겼습니다.</p>`:''}
    <section class="dc-state-panel" role="status" style="margin-top:12px;background:#eff6ff;border-left:4px solid #2563eb;">
      <p style="font-size:var(--fs-sm);color:var(--gray-700);line-height:1.6;">
        본 화면은 <strong>집계·분포</strong>만 제공합니다. 개별 교사 식별·랭킹·Top-K 표는 제공하지 않습니다 (개인정보 보호).
      </p>
    </section>`;

  // 히스토그램 + 기준선
  const lineAt = (val, color, label) => ({
    type:'line', xMin:val/binWidth - 0.5, xMax:val/binWidth - 0.5,
    borderColor:color, borderWidth:2, borderDash:[4,3], label:{display:true, content:label, color}
  });
  mkChart(document.getElementById('aIdxHist'),'bar',{
    labels: histLabels,
    datasets:[{ label:'교사 수', data: histData, backgroundColor:'#2563eb' }]
  }, {
    plugins:{ legend:{display:false},
      tooltip:{ callbacks:{ label:(ctx)=> `${ctx.parsed.y.toLocaleString()}명 (${bins[ctx.dataIndex].lo}-${bins[ctx.dataIndex].hi}점)` } } },
    scales:{ y:{ beginAtZero:true, title:{display:true,text:'교사 수'} }, x:{ title:{display:true,text:'실행지수 구간'} } }
  });

  // 박스플롯: Chart.js 기본만 사용 → floating bar (p25~p75) + p50 별도 점 datasets
  const labels = boxData.map(b=>b.lv);
  const boxes = boxData.map(b => b.masked ? [null,null] : [b.p25, b.p75]);
  const medians = boxData.map(b => b.masked ? null : b.p50);
  const mins = boxData.map(b => b.masked ? null : b.min);
  const maxs = boxData.map(b => b.masked ? null : b.max);
  mkChart(document.getElementById('aIdxBox'),'bar',{
    labels,
    datasets:[
      { label:'p25~p75', data: boxes, backgroundColor:'rgba(37,99,235,.35)', borderColor:'#2563eb', borderWidth:1, borderSkipped:false, barPercentage:.4 },
      { label:'중위(p50)', data: medians, type:'line', borderColor:'#ef4444', borderWidth:3, pointRadius:8, pointHoverRadius:9, pointBackgroundColor:'#ef4444', showLine:false },
      { label:'최소', data: mins, type:'line', borderColor:'#64748b', pointStyle:'triangle', pointRadius:6, showLine:false, backgroundColor:'#64748b' },
      { label:'최대', data: maxs, type:'line', borderColor:'#64748b', pointStyle:'rectRot', pointRadius:6, showLine:false, backgroundColor:'#64748b' }
    ]
  }, { indexAxis:'y', scales:{ x:{ min:0, max:100, title:{display:true,text:'실행지수'} } },
       plugins:{ tooltip:{ callbacks:{ label:(ctx)=> {
         const b = boxData[ctx.dataIndex]; if (b.masked) return '🔒 n<5 마스킹';
         return `${ctx.dataset.label}: ${Array.isArray(ctx.raw)? ctx.raw.join('–') : Number(ctx.raw).toFixed(1)}점 (n=${b.n})`;
       } } } } });
};

/* ---- daily-snapshot 공통 차트 ---- */
function _dailyHourChart(canvasId, today, yesterday){
  const labels = Array.from({length:24}, (_,h)=> h+'시');
  mkChart(document.getElementById(canvasId),'bar', {
    labels,
    datasets:[
      { label:'오늘', data:(today.byHour||[]).map(r=>r.count),       backgroundColor:'#2563eb' },
      { label:'어제', data:(yesterday.byHour||[]).map(r=>r.count),   backgroundColor:'#94a3b8' }
    ]
  });
}
function _deltaTrend(curr, prev){
  const diff = (curr||0) - (prev||0);
  return { dir: diff>0?'up':(diff<0?'down':'flat'), text: `어제 대비 ${diff>=0?'+':''}${diff}` };
}

VIEWS['s-home'] = async function(root){
  root.innerHTML = tplLoading(4);
  const uid = state.me && state.me.id;
  const [insights, daily, dash] = await Promise.all([
    uid ? apiGet(`/api/lrs/insights/${uid}`) : Promise.resolve(null),
    apiGet('/api/lrs/stats/daily'),
    apiGet('/api/lrs/dashboard')
  ]);

  // API shape: {snapshot:{streakDays, weeklyDurationMin, weeklyTarget, weeklyScoreAvg, engagementIndex}, weaknesses:[...]}
  const snap = (insights && insights.snapshot) || {};
  const weakList = (insights && insights.weaknesses) || [];
  const dashStats = (dash && dash.stats) || {};
  const totalMinutes = snap.weeklyDurationMin != null
    ? Number(snap.weeklyDurationMin)
    : (dashStats.totalDurationMinutes || 0);
  const avgScore = Math.round(Number(snap.weeklyScoreAvg || 0) * 10) / 10;
  const streakDays = snap.streakDays || 0;
  const doneTasks = dashStats.totalActivities || 0;
  const summary = { total_minutes: totalMinutes, done_tasks: doneTasks, avg_score: avgScore, streak_days: streakDays };

  // 관리자 계정이 학생 뷰 (scope=mine) 로 볼 때 전부 0이면 안내
  const allZero = !totalMinutes && !doneTasks && !avgScore && !streakDays;
  const isAdminAsStudent = (state.me && state.me.role === 'admin') && state.role === 'student';
  const adminHintHtml = (allZero && isAdminAsStudent) ? `
    <div class="dc-state-panel" role="status" style="border-left:4px solid var(--lrs-primary);background:rgba(37,99,235,.06);margin-bottom:12px;">
      <i class="fas fa-lightbulb" aria-hidden="true"></i>
      <p>관리자 계정의 개인 학습 데이터가 없습니다. 실제 학생 화면을 보려면 학생 계정으로 로그인하거나 <button type="button" class="btn" id="sHomeSampleBtn" style="margin-left:6px;"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기</button> 버튼을 클릭하세요.</p>
    </div>` : '';

  const kpiHtml = `
    <div class="dc-kpi-grid">
      ${kpiCard('이번 기간 학습시간', (summary.total_minutes||0).toLocaleString(), '분', {dir:'up', text:'지난 기간 대비'}, 'primary',
        '<div class="dc-gauge" id="sHomeGauge"></div>')}
      ${kpiCard('완료 과제',         (summary.done_tasks||0).toLocaleString(), '건', {dir:'flat', text:'이번 기간'}, 'success',
        '<div id="sHomeSpark" class="kpi-spark"></div>')}
      ${kpiCard('평균 성취',          (summary.avg_score||0),                   '점', {dir:'up',   text:'지난 기간 대비'}, 'primary')}
      ${kpiCard('연속 학습',          (summary.streak_days||0),                 '일', {dir:'flat', text:'현재'},            'warning')}
    </div>`;

  const chartsHtml = `
    <div class="grid-2">
      ${chartWrap('sHomeDaily',  '일별 학습시간 추이', '최근 기간', null)}
      ${chartWrap('sHomeWeak',   '내 약점 성취기준 Top 5', '정답률 낮은 순', '약점 카드를 눌러 스스로채움 추천 콘텐츠로 이동합니다')}
    </div>
    <section class="dc-chart-wrapper" aria-label="약점 카드 리스트">
      <header><h2>약점 영역 & 추천 액션</h2></header>
      <div id="sWeakCards"></div>
    </section>`;

  root.innerHTML = adminHintHtml + kpiHtml + chartsHtml;

  // 샘플 학생 보기 버튼 바인딩 (관리자-as-학생 힌트)
  const sampleBtn = document.getElementById('sHomeSampleBtn');
  if (sampleBtn){
    sampleBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      setRole('teacher');
      await setView('t-drill');
      setTimeout(() => {
        const first = (LRS._warnCache||[])[0];
        if (first) LRS.openDrilldown(first);
      }, 300);
    });
  }

  // 게이지 (학습시간 목표 대비 달성률) — 기본 목표치: 7d 60분*7일, 30d 60*30 등
  const targetMin = Number(snap.weeklyTarget) || (state.period==='7d'?420: state.period==='30d'?1800: state.period==='90d'?5400: 1800);
  renderGauge(document.getElementById('sHomeGauge'), summary.total_minutes||0, targetMin, '목표 대비');

  // 일별 추이 차트
  const dailyData = (daily && daily.data) || [];
  // 스파크라인: 최근 7일 활동 건수 추이
  const sparkVals = dailyData.slice(-7).map(d => d.count || 0);
  renderSparkline(document.getElementById('sHomeSpark'), sparkVals);
  if (dailyData.length) {
    mkChart(document.getElementById('sHomeDaily'), 'line', {
      labels: dailyData.map(d => fmtDate(d.stat_date)),
      datasets: [{
        label:'학습시간(분)',
        data: dailyData.map(d => toMinutes(d.total_duration_sec || d.total_duration)),
        borderColor: 'var(--chart-1)', backgroundColor:'rgba(37,99,235,.12)',

  // 약점 차트 (weaknesses:[{achievement_code, attempt_count, success_count, avg_score, last_level}])
  if (weakList.length) {
    mkChart(document.getElementById('sHomeWeak'), 'bar', {
      labels: weakList.slice(0,5).map(w=>w.achievement_code||'-'),
      datasets:[{
        label:'시도 횟수',
        data: weakList.slice(0,5).map(w => Number(w.attempt_count)||0),
        backgroundColor:'var(--chart-4)'
      }]
    }, { indexAxis:'y', scales:{ x:{ beginAtZero:true } } });

    // 약점 카드 → self-learn 딥링크
    document.getElementById('sWeakCards').innerHTML = weakList.slice(0,5).map(w=>{
      const code = w.achievement_code||'';
      const accuracy = (w.avg_score != null ? w.avg_score : (w.last_level||'미도달'));
      const attempts = w.attempt_count || '-';
      const href = '/self-learn/?achievement_code=' + encodeURIComponent(code);
      return `<div class="dc-warning-card" data-severity="medium">
        <h3>${escapeHtml(code||'성취기준')}</h3>
        <p>평균 ${escapeHtml(accuracy)} · 시도 ${escapeHtml(attempts)}회</p>
        <div class="actions">
          <a role="button" href="${escapeAttr(href)}" class="dc-badge dc-badge--primary" style="text-decoration:none;">
            <i class="fas fa-book-open-reader"></i> 맞춤학습으로 이동
          </a>
        </div>
      </div>`;
    }).join('');
  } else {
    document.getElementById('sHomeWeak').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>내 약점 성취기준 Top 5</h2></header>` +
      tplEmpty('아직 진단 결과가 충분하지 않아요', {href:'/self-learn/', label:'스스로채움 시작하기'});
    document.getElementById('sWeakCards').innerHTML = '';
  }
  await renderDodMini(root);
};

VIEWS['s-achieve'] = async function(root){
  root.innerHTML = tplLoading(2);
  const uid = state.me && state.me.id;
  // 실제 응답: {standards:[{code, subject_code, attempts, success, avg_score, level, lastAt}]}
  const cid = await resolveClassId();
  const r = await apiGet('/api/lrs/achievement-progress', { userId: uid, classId: cid });
  const standards = (r && (r.standards || r.byAchievement)) || [];

  if (!standards.length) {
    // 역할 전환 힌트 + 샘플 학생 보기 버튼
    const isAdmin = state.me && state.me.role === 'admin';
    const hint = isAdmin
      ? '관리자 계정에는 개인 성취 데이터가 없어요. 학생 계정으로 로그인하거나, 상단 역할 스위처로 <b>교사</b>로 전환 후 "학생 드릴다운"에서 학생을 선택하세요.'
      : '아직 진단 결과가 충분하지 않아요. 학습을 진행하면 성취 데이터가 집계됩니다.';
    root.innerHTML = `
      <div class="dc-state-panel" role="status">
        <i class="fas fa-award" aria-hidden="true"></i>
        <p>${hint}</p>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px;">
          ${isAdmin ? `<button type="button" class="btn" id="sAchGotoDrill"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기</button>` : ''}
          <a class="btn" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움</a>
        </div>
      </div>`;
    const go = document.getElementById('sAchGotoDrill');
    if (go) go.addEventListener('click', async () => {
      // 교사로 전환 후 t-drill → 첫 학생 drawer 자동 오픈
      setRole('teacher');
      await setView('t-drill');
      setTimeout(() => {
        const first = (LRS._warnCache||[])[0];
        if (first) LRS.openDrilldown(first);
      }, 300);
    });
    return;
  }

  // 레벨별 카운트 집계
  const levelMap = { '상':0, '중':0, '하':0, '미도달':0 };
  standards.forEach(s => {
    const lv = s.level || s.last_level || '미도달';
    if (levelMap[lv] != null) levelMap[lv]++; else levelMap['미도달']++;
  });

  // KPI 계산
  const reached = (levelMap['상']||0) + (levelMap['중']||0) + (levelMap['하']||0);
  let accSum=0, accN=0;
  standards.forEach(s => {
    const v = Number(s.avg_score);
    if (!isNaN(v) && v >= 0){ accSum += v; accN++; }
  });
  const avgAcc = accN ? (accSum/accN) : 0;
  // 약점: avg_score < 60 또는 level === '미도달'/'하'
  const weaknesses = standards.filter(s => {
    const v = Number(s.avg_score);
    const lv = s.level || s.last_level;
    return (isFinite(v) && v < 60) || lv === '미도달' || lv === '하';
  });

  root.innerHTML = `
    <div class="dc-kpi-grid">
      ${kpiCard('도달 성취기준', reached, '개', {dir:'flat',text:'상/중/하 합계'}, 'success')}
      ${kpiCard('평균 정답률',   avgAcc.toFixed(1), '%', {dir:'flat',text:'성취기준 전체 평균'}, 'primary')}
      ${kpiCard('약점 성취기준', weaknesses.length, '개', {dir:weaknesses.length?'down':'flat', text:'60점 미만/미도달'}, weaknesses.length?'danger':'primary')}

/* ===== 교사 경고 응답 → 통합 목록 변환 =====
 * 입력: {inactive:[], noData:[], consecutiveWrong:[], weakAchievements:[], summary:{...}}
 * 출력: [{user_id, name, severity, reason, achievement_code?, last_active?, _kind}]
 */
function flattenWarnings(w){
  if (!w) return { all:[], summary:{inactiveCount:0,noDataCount:0,wrongCount:0,weakCount:0} };
  const raw = w.summary || {};
  const summary = {
    inactiveCount: raw.inactiveCount != null ? raw.inactiveCount : (w.inactive||[]).length,
    noDataCount:   raw.noDataCount   != null ? raw.noDataCount   : (w.noData||[]).length,
    wrongCount:    raw.wrongCount    != null ? raw.wrongCount    : (raw.consecutiveWrongCount != null ? raw.consecutiveWrongCount : (w.consecutiveWrong||[]).length),
    weakCount:     raw.weakCount     != null ? raw.weakCount     : (w.weakAchievements||[]).length
  };
  // 공통 helper: 다양한 필드명 허용 (user_id|userId|id), (name|displayName|student_name)
  const uidOf = x => x.user_id || x.userId || x.id || '';
  const nameOf = x => x.name || x.displayName || x.student_name || ('학생 #'+uidOf(x));
  const all = [];
  (w.inactive||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity: x.severity||'medium',
    reason: `미접속 ${x.daysInactive||'-'}일 (최근: ${x.lastActivityDate||'-'})`,
    last_active: x.lastActivityDate||'-', _kind:'inactive'
  }));
  (w.consecutiveWrong||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity: x.severity||'high',
    reason: `연속 오답 ${x.wrongStreak||x.streak||'-'}회`, _kind:'wrong'
  }));
  // weakAchievements: 학생별로 items 배열 — 각 item당 한 행
  (w.weakAchievements||[]).forEach(x => {
    const items = x.items || [{ achievement_code: x.achievement_code, avg_score: x.avg_score, last_level: x.last_level, attempt_count: x.attempt_count }];
    items.forEach(it => all.push({
      user_id: uidOf(x), name: nameOf(x),
      severity: it.severity || (it.avg_score != null && it.avg_score < 50 ? 'high' : 'medium'),
      reason: `${it.achievement_code||'-'} · ${it.last_level||'미도달'}${it.avg_score!=null?` (평균 ${it.avg_score})`:''} · ${it.attempt_count||'-'}회 시도`,
      achievement_code: it.achievement_code, _kind:'weak'
    }));
  });
  (w.noData||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity:'low',
    reason:'학습 데이터 없음', _kind:'noData'
  }));
  return { all, summary, raw: w };
}

VIEWS['t-subject'] = async function(root){
  root.innerHTML = tplLoading(2);
  // 응답: { lessonStats:[], homeworkStats:[], examStats:[] }  — 또는 구버전 { stats:[] }
  const s = await apiGet('/api/lrs/stats/by-subject');
  const lessonStats   = (s && s.lessonStats)   || [];
  const homeworkStats = (s && s.homeworkStats) || [];
  const examStats     = (s && s.examStats)     || [];
  const legacyRows    = (s && (s.stats || s.data)) || [];

  // legacy 응답 fallback: 3갈래로 분리 불가 → 단일 chart만 표시 후 종료
  if (!lessonStats.length && !homeworkStats.length && !examStats.length && legacyRows.length){
    root.innerHTML = chartWrap('tSubjBar','교과별 활동량 & 평균 성취');
    mkChart(document.getElementById('tSubjBar'),'bar',{
      labels: legacyRows.map(r=>pickLabel(r, ['subject_label','subject','subject_code','subject_name'], '(교과 미지정)')),
      datasets:[
        { label:'활동 건수', data:legacyRows.map(r=>r.count||0), backgroundColor:'var(--chart-1)' },
        { label:'평균 성취(%)', data:legacyRows.map(r=>r.avg_score||0), backgroundColor:'var(--chart-2)', yAxisID:'y2' }
      ]
    }, { scales:{ y2:{ position:'right', max:100, grid:{drawOnChartArea:false} } } });
    return;
  }

  if (!lessonStats.length && !homeworkStats.length && !examStats.length){
    root.innerHTML = tplEmpty('교과별 집계 데이터가 없어요');
    return;
  }

  // 교과 라벨 통합 (세 배열의 subject_code/label 합집합)
  const _sKey = r => r.subject_code || r.subject || r.subject_name || '(미지정)';
  const _sLabel = r => pickLabel(r, ['subject_label','subject_name','subject','subject_code'], '(교과 미지정)');
  const codeToLabel = {};
  [lessonStats, homeworkStats, examStats].forEach(arr => {
    arr.forEach(r => { const k=_sKey(r); if(!codeToLabel[k]) codeToLabel[k]=_sLabel(r); });
  });
  const codes = Object.keys(codeToLabel);

  const mapL = Object.fromEntries(lessonStats.map(r=>[_sKey(r), Number(r.count)||0]));
  const mapH = Object.fromEntries(homeworkStats.map(r=>[_sKey(r), Number(r.count)||0]));
  const mapE = Object.fromEntries(examStats.map(r=>[_sKey(r), Number(r.count)||0]));

  // 정렬: 합계 내림차순
  codes.sort((a,b) => ((mapL[b]||0)+(mapH[b]||0)+(mapE[b]||0)) - ((mapL[a]||0)+(mapH[a]||0)+(mapE[a]||0)));

  const tableRows = codes.map(c => ({

// 관리자 views 공통: period 파라미터 붙여 호출 (apiGet은 state.period 자동 부착)
async function adminFetchWithPeriod(path, period){
  try {
    const params = new URLSearchParams();
    if (period) params.set('period', period);
    if (_shouldAttachScope(path)){
      const sc = state.scope || computeScope();
      if (sc) params.set('scope', sc);
    }
    const qs = params.toString();
    const r = await fetch(path + (qs?'?'+qs:''), { credentials:'include' });
    if (!r.ok) return null;
    return await r.json();
  } catch(_){ return null; }
}

/* ======================================================================

// 진단 권고 문구 룰 (기획서 4-1·E장) — status/severity/reason → 한국어 자연문
function _svcRecommendation(s){
  const name = s.service_label || s.service;
  const share = s.share;
  switch (s.status){
    case '거의 미사용':
      return `${name} 사용률이 전체의 ${share}%에 그칩니다. 진입 동선 노출을 점검하거나 교사 연수·안내를 권고합니다.`;
    case '저활용·정체':
      return `${name}이(가) 최근 ${state.period.replace('d','일')} 정체 상태입니다. 활용 사례·템플릿 제공을 검토하세요.`;
    case '저활용·성장중':
      return `${name}은(는) 점유율은 낮으나(${share}%) 추세가 상승 중입니다. 노출을 확대하면 안착이 기대됩니다.`;
    case '사용 급감':
      return `${name} 활동이 직전 기간 대비 ${Math.abs(s.trendDelta)}% 감소했습니다. 장애·정책 변경 여부 점검이 필요합니다.`;
    default:
      return `${name}은(는) 정상 범위입니다.`;
  }
}
function _deltaChip(delta){
  const d = Number(delta)||0;
  const cls = d>0?'up':d<0?'down':'flat';
  const arrow = d>0?'▲':d<0?'▼':'·';
  return `<span class="delta ${cls}">${arrow} ${d>=0?'+':''}${d}%</span>`;
}

/* ======================================================================
 * ③ 거시 비교 (a-macro) — 지역▸학교급▸학교▸학년▸교과 드릴다운
 *    브레드크럼 + KPI 4 + 막대 비교 + 정렬 표. n<10 마스킹("표본 부족").
 *    state._macroPath: [{level, id, label}] 체인
 * ==================================================================== */
const MACRO_LEVEL_LABEL = { region:'지역', school_level:'학교급', school:'학교', grade:'학년', subject:'교과' };
function _macroFiltersFromPath(path){
  // path의 각 단계에서 상위 필터 파라미터 구성
  const f = {};
  path.forEach(p => {
    if (p.level === 'region') f.region = p.id;
    else if (p.level === 'school_level') f.school_level = p.id;
    else if (p.level === 'school') f.school = p.id;
    else if (p.level === 'grade') f.grade = p.id;
  });
  return f;
}
VIEWS['a-macro'] = async function(root){
  root.innerHTML = tplLoading(2);
  if (!state._macroPath) state._macroPath = []; // 비어있으면 region 레벨부터

  const path = state._macroPath;
  // 다음에 조회할 level 결정: 마지막 단계의 nextLevel(없으면 region)
  const last = path[path.length-1];
  const NEXT = { region:'school_level', school_level:'school', school:'grade', grade:'subject', subject:null };
  const queryLevel = last ? NEXT[last.level] : 'region';

  // 브레드크럼
  const crumbs = [`<button type="button" data-idx="-1" ${path.length===0?'aria-current="page"':''}>전체(충북)</button>`]
    .concat(path.map((p,i)=> `<span class="sep">▸</span><button type="button" data-idx="${i}" ${i===path.length-1?'aria-current="page"':''}>${escapeHtml(p.label)}</button>`))
    .join('');

  root.innerHTML = `
    <nav class="dc-drill-bc" id="aMacroBc" aria-label="거시 드릴다운 경로">${crumbs}</nav>
    <div id="aMacroBody">${tplLoading(2)}</div>`;
  root.querySelectorAll('#aMacroBc button').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state._macroPath = idx < 0 ? [] : path.slice(0, idx+1);
      VIEWS['a-macro'](root);
    };
  });

  const body = document.getElementById('aMacroBody');

  // 교과(subject)가 마지막 단계면 더 내려갈 곳이 없음 — 안내
  if (!queryLevel){
    body.innerHTML = `<div class="dc-state-panel" role="status" style="border-left:4px solid #64748b;background:#f1f5f9;">
      <span style="font-size:var(--fs-display);">📊</span>
      <p><strong>최하위 단위(교과)까지 도달했습니다</strong></p>
      <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.6;">개인정보 보호 원칙에 따라 학급·개인 단위는 제공하지 않습니다. 상위 단계로 돌아가 다른 갈래를 살펴보세요.</p>
    </div>`;
    return;
  }

  // API 호출
  const f = _macroFiltersFromPath(path);
  const d = await apiGet('/api/lrs/stats/macro-drill', { level: queryLevel, ...f });
  if (!d || !d.success){ body.innerHTML = tplError('거시 비교 데이터를 불러오지 못했습니다', ()=>VIEWS['a-macro'](root)); return; }
  const children = d.children || [];
  if (!children.length){ body.innerHTML = _seedHintEmpty(`${MACRO_LEVEL_LABEL[queryLevel]||''} 단위 집계가 없어요`); return; }

  const visible = children.filter(c => !c.masked);
  const maskedCnt = children.length - visible.length;
  // 집계 KPI (마스킹 제외 합산)
  const totStu = children.reduce((s,c)=>s+(c.students||0),0);
  const totActs = visible.reduce((s,c)=>s+(c.acts||0),0);
  const wMin = visible.reduce((s,c)=>s+(c.avgLearnMin||0)*(c.students||0),0) / Math.max(1, visible.reduce((s,c)=>s+(c.students||0),0));
  const scored = visible.filter(c=>c.avgScore!=null);
  const wScore = scored.reduce((s,c)=>s+c.avgScore*(c.students||0),0) / Math.max(1, scored.reduce((s,c)=>s+(c.students||0),0));

  body.innerHTML = `
    <div class="dc-kpi-grid">
      ${kpiCard('학생 수', totStu.toLocaleString(), '명', {dir:'flat',text:`${MACRO_LEVEL_LABEL[queryLevel]} ${children.length}개`}, 'primary')}
      ${kpiCard('활동량',  totActs.toLocaleString(), '건', {dir:'flat',text:'표본 충족 합계'}, 'success')}
      ${kpiCard('평균 학습시간', Math.round(wMin).toLocaleString(), '분', {dir:'flat',text:'1인 가중평균'}, 'warning')}
      ${kpiCard('평균 성취', scored.length?wScore.toFixed(1):'-', '점', {dir:'flat',text:'가중평균'}, 'primary')}
    </div>
    <section class="dc-chart-wrapper">
      <header><h2>${escapeHtml(MACRO_LEVEL_LABEL[queryLevel])}별 평균 성취 비교</h2><div class="subtitle">막대 클릭 시 하위 단위로 드릴다운</div></header>
      <div class="chart-body" style="height:${Math.max(280, visible.length*30)}px;"><canvas id="aMacroBar" role="img" aria-label="${escapeAttr(MACRO_LEVEL_LABEL[queryLevel])}별 비교 막대"></canvas></div>
    </section>
    <section class="dc-chart-wrapper">
      <header><h2>${escapeHtml(MACRO_LEVEL_LABEL[queryLevel])} 상세</h2><div class="subtitle">행 클릭 시 드릴다운 · 열 머리글로 정렬${maskedCnt?` · 표본 부족 ${maskedCnt}개 마스킹`:''}</div></header>
      <div id="aMacroTable"></div>
    </section>`;

  // 비교 막대 (마스킹 제외, 성취 내림차순)
  const barRows = visible.slice().sort((a,b)=>(b.avgScore||0)-(a.avgScore||0));
  const drillOf = (c) => {
    if (!NEXT[queryLevel]) return; // 교과면 더 못 내려감
    state._macroPath = state._macroPath.concat([{ level:queryLevel, id:c.id, label:c.label }]);
    VIEWS['a-macro'](root);
  };
  mkChart(document.getElementById('aMacroBar'),'bar',{
    labels: barRows.map(c=>c.label),
    datasets:[{ label:'평균 성취', data: barRows.map(c=>c.avgScore), backgroundColor:'var(--chart-1)' }]
  }, {
    indexAxis:'y',
    scales:{ x:{ min:0, max:100, title:{display:true,text:'평균 성취점수'} } },
    plugins:{ legend:{display:false} },
    onClick:(evt, els)=>{ if (els && els.length) drillOf(barRows[els[0].index]); }
  });

  // 상세 표 (마스킹 행 포함, "표본 부족" 표기)
  renderDataTable(document.getElementById('aMacroTable'), {
    columns:[
      { key:'label', label:MACRO_LEVEL_LABEL[queryLevel] },
      { key:'students', label:'학생수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'acts', label:'활동량', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">표본 부족</span>' : escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'avgLearnMin', label:'평균 학습시간(분)', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'avgScore', label:'평균 성취', align:'right', format:(v,r)=> r.masked ? '<span style="color:var(--gray-400);">·</span>' : escapeHtml(v==null?'-':Number(v).toFixed(1)) }
    ],
    rows: children, initialSort:'students', initialDir:'desc',
    onRowClick:(row)=>{ if (!row.masked) drillOf(row); }
  });
};

/* ======================================================================
 * ④ 활동×성취 교차분석 (a-cross)
 *    인사이트 배너 + 3분위 매트릭스 + 산점도 + 콘텐츠/스스로채움 상하위 비교
 * ==================================================================== */
// 인사이트 문장 룰 (기획서 4-2)
function _crossInsight(label, cmp, smallSample){
  if (!cmp || cmp.gapPP == null) return `${label} 활용과 성취의 관계를 산출할 표본이 부족합니다.`;
  const gap = cmp.gapPP;
  const tail = smallSample ? ' (표본이 작아 참고용입니다)' : '';
  if (gap >= 10) return `${label}을(를) 상위권으로 활용한 학생 집단의 평균 정답률이 하위 집단보다 +${gap}%p 높습니다. 활용이 성취와 양(+)의 상관을 보입니다.${tail}`;
  if (gap > 0) return `${label} 활용 상·하위 집단 간 약한 양의 상관(+${gap}%p)이 관찰됩니다.${tail}`;
  return `이 표본에서는 ${label} 활용과 성취 간 뚜렷한 상관이 관찰되지 않습니다(표본·기간 확대 권장).${tail}`;
}

/* 서버 제공 7×24 매트릭스를 직접 히트맵으로 렌더 (renderHeatmap는 date 파싱 기반이라 별도 함수) */
function renderHeatmapMatrix(container, matrix){
  if (!container) return;
  let maxV = 0;
  (matrix||[]).forEach(row => row.forEach(v => { if (v>maxV) maxV=v; }));
  function bucket(v){
    if (!maxV || v<=0) return 0;
    const r=v/maxV; if (r>.75) return 4; if (r>.5) return 3; if (r>.25) return 2; if (r>0) return 1; return 0;
  }
  const dows = ['일','월','화','수','목','금','토'];
  const ylabels = dows.map(d=>`<div>${d}</div>`).join('');
  const cells = (matrix||[]).map((row,di)=>
    row.map((v,hi)=>`<div class="cell heat-${bucket(v)}" data-h="${bucket(v)}" title="${dows[di]} ${hi}시: ${v}" aria-label="${dows[di]}요일 ${hi}시 활동 ${v}">${v>0?v:''}</div>`).join('')
  ).join('');
  const xlabels = Array.from({length:24},(_,i)=>`<div>${i%3===0?i:''}</div>`).join('');
  container.innerHTML = `
    <div class="dc-heatmap-wrap">
      <div class="hm-ylabels" style="grid-template-rows:repeat(7,1fr);">${ylabels}</div>
      <div class="dc-heatmap" style="grid-template-columns:repeat(24,1fr);">${cells}</div>
      <div></div>
      <div class="hm-xlabels">${xlabels}</div>
    </div>`;
}

      ${kpiCard('학습시간 결측률', missDur.toFixed(1), '%', {dir:missDur>20?'down':'up', text:''}, tone(missDur))}

    </div>
    <div class="dc-kpi-grid">
      ${kpiCard('교과 결측률', missSub.toFixed(1), '%', {dir:missSub>20?'down':'up', text:d.missing_subject_rate==null?'제공 안됨':''}, tone(missSub))}
      ${kpiCard('세션 결측률', missSes.toFixed(1), '%', {dir:missSes>20?'down':'up', text:d.missing_session_rate==null?'제공 안됨':''}, tone(missSes))}
      ${kpiCard('서비스 수', srows.length, '종', {dir:'flat',text:''}, 'primary')}
      ${kpiCard('성취 매핑 수', achRows.length, '개', {dir:'flat',text:''}, 'primary')}
    </div>

    <section class="dc-chart-wrapper">
      <header>
        <h2>서비스별 결측률</h2>
        <div class="subtitle">${perService ? '서비스별 상세 결측 집계' : '서비스별 집계 기반 추정 (로그 수만 표기)'}</div>
      </header>
      <div id="aQSvcTable"></div>
    </section>

    <section class="dc-chart-wrapper">
      <header>
        <h2>성취기준 미매핑 샘플</h2>
        <div class="subtitle">성취기준 코드가 비어 있는 집계 행</div>
      </header>
      <div id="aQAchTable"></div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>집계 재빌드</h2><div class="subtitle">원시 로그 → 일별/서비스별/학급별 집계 테이블 재계산</div></header>
      <p style="color:var(--gray-600);font-size:var(--fs-sm);line-height:1.7;">
        결측률이 개선되지 않거나 일별 집계가 어긋날 때 실행하세요. 서버 부하가 있을 수 있습니다.
      </p>
      <button id="btnRebuildAgg" type="button" class="dc-badge dc-badge--primary"
        style="padding:10px 18px;border:0;cursor:pointer;font-size:var(--fs-body);">
        <i class="fas fa-rotate"></i> 집계 재빌드 실행
      </button>
      <div id="aQRebuildMsg" style="margin-top:var(--space-3);font-size:var(--fs-sm);color:var(--gray-600);"></div>
    </section>

    <section class="dc-chart-wrapper">
      <header><h2>데이터 품질 노트</h2></header>
      <p style="color:var(--gray-600);font-size:var(--fs-sm);line-height:1.7;">
        2단계에서 학습시간(<code>duration_sec</code>) 컬럼을 신설했습니다. 기존 <code>result_duration</code>만 채워진 로그는 자동으로 대체 처리됩니다.
        성취기준 결측률이 20% 이상이면 서비스 로거 풍부화(T-C)를 확인하세요.
      </p>
    </section>`;

  // 서비스별 결측률 테이블
  const qSvcBox = document.getElementById('aQSvcTable');
  if (perService && perService.length){
    renderDataTable(qSvcBox, {
      columns: [
        { key:'service', label:'서비스', format:(_,r)=>escapeHtml(pickLabel(r, ['service_label','service','source_service','service_key','service_name'], '(미분류)')) },
        { key:'total',   label:'로그', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
        { key:'missing_achievement', label:'성취기준 결측', align:'right',
          format:(v,r)=>{ const t=Number(r.total)||0; const m=Number(v)||0; const rate=t?(m/t*100):0; return escapeHtml(m.toLocaleString()+' ('+rate.toFixed(1)+'%)'); } },
        { key:'missing_duration', label:'시간 결측', align:'right',
          format:(v,r)=>{ const t=Number(r.total)||0; const m=Number(v)||0; const rate=t?(m/t*100):0; return escapeHtml(m.toLocaleString()+' ('+rate.toFixed(1)+'%)'); } }
      ],
      rows: perService, initialSort:'total', initialDir:'desc'
    });
  } else if (srows.length) {
    renderDataTable(qSvcBox, {
      columns: [
        { key:'service', label:'서비스', format:(_,r)=>escapeHtml(pickLabel(r, ['service_label','service','source_service','service_key','service_name'], '(미분류)')) },
        { key:'count',   label:'로그', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
        { key:'avg_score', label:'평균점수', align:'right', format:v=>escapeHtml(v==null?'-':Number(v).toFixed(1)) },
        { key:'_note',   label:'비고', format:()=>'<span style="color:var(--gray-500);font-size:var(--fs-sm);">per_service 결측 데이터 미제공</span>' }
      ],
      rows: srows, initialSort:'count', initialDir:'desc'
    });
  } else {
    qSvcBox.innerHTML = tplEmpty();
  }

  // 성취코드 미매핑 샘플 (null/empty)
  const missingAch = achRows.filter(r => !r.achievement_code || String(r.achievement_code).trim() === '');
  const qAchBox = document.getElementById('aQAchTable');
  if (missingAch.length){
    renderDataTable(qAchBox, {
      columns: [
        { key:'achievement_code', label:'코드', format:v=>escapeHtml(v||'(빈 값)') },
        { key:'count',            label:'건수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
        { key:'avg_score',        label:'평균점수', align:'right', format:v=>escapeHtml(v==null?'-':Number(v).toFixed(1)) }
      ],
      rows: missingAch, initialSort:'count', initialDir:'desc'
    });
  } else {
    qAchBox.innerHTML = `<p style="color:var(--gray-600);font-size:var(--fs-sm);padding:12px 0;">모든 성취기준이 매핑되어 있습니다.</p>`;
  }

  // 집계 재빌드 버튼
  const btn = document.getElementById('btnRebuildAgg');
  const msg = document.getElementById('aQRebuildMsg');
  if (btn){
    btn.addEventListener('click', async () => {
      if (!confirm('집계 테이블을 재빌드하시겠습니까? 대용량 로그의 경우 수 분 소요될 수 있습니다.')) return;
      btn.disabled = true;
      msg.textContent = '재빌드 진행 중…';
      msg.style.color = 'var(--gray-600)';
      try {
        const r = await fetch('/api/lrs/rebuild-aggregates', { method:'POST', credentials:'include' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json().catch(()=>({}));
        msg.textContent = '재빌드 완료' + (j && j.duration_ms ? ' (' + j.duration_ms + 'ms)' : '');
        msg.style.color = 'var(--lrs-success)';
      } catch(e){
        msg.textContent = '재빌드 실패: ' + e.message;
        msg.style.color = 'var(--lrs-danger)';
      } finally {
        btn.disabled = false;
      }
    });
  }
};

/* ======== xAPI 표준체계 분석 (Phase E) ======== */
async function _renderXapiAnalysis(root, scope) {
  root.innerHTML = tplLoading(5);
  const qs = scope ? `?scope=${encodeURIComponent(scope)}` : '';
  const [ov, heat, dist, area, recent] = await Promise.all([
    apiGet(`/api/lrs/xapi/overview${qs}`),
    apiGet(`/api/lrs/xapi/std-heatmap${qs}${qs?'&':'?'}depth=2`),
    apiGet(`/api/lrs/xapi/achievement-distribution${qs}`),
    apiGet(`/api/lrs/xapi/area-breakdown${qs}${qs?'&':'?'}days=7`),
    apiGet(`/api/lrs/xapi/recent-events${qs}${qs?'&':'?'}limit=20`),
  ]);
  if (!ov || !ov.success) { root.innerHTML = tplEmpty('xAPI 수집 데이터를 불러오지 못했습니다'); return; }

  // 1) 수집 현황 KPI
  const kpiHtml = `
    <div class="dc-kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
      ${kpiCard('총 xAPI 수집', (ov.total||0).toLocaleString(), '건', {dir:'flat',text:`최근 24시간 ${ov.recent24h||0}건`}, 'primary')}
      ${kpiCard('최근 7일', (ov.recent7d||0).toLocaleString(), '건', {dir:'flat',text:'수집 누적'}, 'success')}
      ${kpiCard('허브 송신 대기', (ov.unsent||0).toLocaleString(), '건', {dir:'flat',text:`송신 완료 ${ov.sent||0}`}, 'warning')}
      ${kpiCard('영역 수', String((ov.byArea||[]).length), '개', {dir:'flat',text:'AIDT 10영역 중'}, 'primary')}
    </div>`;

  // 2) 영역별 분포 막대
  const maxArea = Math.max(1, ...((ov.byArea||[]).map(a=>a.cnt||0)));
  const areaHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>영역별 수집 분포</h2><div class="subtitle">xAPI 10개 AIDT 영역</div></header>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${(ov.byArea||[]).map(a => `
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="width:110px;font-size:var(--fs-caption);color:var(--gray-700);">${a.area}</span>
            <div style="flex:1;background:var(--gray-100);border-radius:4px;overflow:hidden;height:18px;">
              <div style="width:${((a.cnt/maxArea)*100).toFixed(1)}%;background:var(--primary);height:100%;"></div>
            </div>
            <span style="width:70px;text-align:right;font-size:var(--fs-caption);font-variant-numeric:tabular-nums;">${(a.cnt||0).toLocaleString()}</span>
          </div>`).join('') || '<div class="empty">수집된 데이터가 없습니다.</div>'}
      </div>
    </section>`;

  // 3) 성취수준 분포
  const distLevels = ['A','B','C','D','E'];
  const distMap = Object.fromEntries((dist && dist.distribution || []).map(r=>[r.level,r.cnt]));
  const distTotal = distLevels.reduce((s,l)=>s+(distMap[l]||0),0) || 1;
  const distHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>성취수준 분포</h2><div class="subtitle">초 A~C · 중·고 A~E</div></header>
      <div style="display:flex;gap:8px;">
        ${distLevels.map(l => {
          const c = distMap[l]||0;
          const pct = ((c/distTotal)*100).toFixed(1);
          return `<div style="flex:1;text-align:center;padding:var(--space-3);background:var(--gray-50);border-radius:6px;">
            <div style="font-size:var(--fs-h2);font-weight:700;color:var(--primary);">${l}</div>
            <div style="font-size:var(--fs-h3);margin-top:4px;">${c.toLocaleString()}</div>
            <div style="font-size:var(--fs-caption);color:var(--gray-600);">${pct}%</div>
          </div>`;
        }).join('')}
      </div>
    </section>`;

  // 4) 표준체계 히트맵 (상위 20)
  const heatRows = (heat && heat.nodes || []).slice(0,20);
  const heatMax = Math.max(1, ...heatRows.map(r=>r.attempts||0));
  const heatHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>표준체계 노드 히트맵 (Top 20)</h2><div class="subtitle">내용 체계 항목별 학습 빈도 · 정답률</div></header>
      <div style="overflow:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:var(--fs-caption);">
        <thead><tr style="background:var(--gray-100);">
          <th style="text-align:left;padding:8px;">노드</th>
          <th style="text-align:left;padding:8px;">레이블</th>
          <th style="text-align:right;padding:8px;">학습자</th>
          <th style="text-align:right;padding:8px;">시도</th>
          <th style="text-align:right;padding:8px;">정답률</th>
          <th style="padding:8px;">빈도</th>
        </tr></thead>
        <tbody>
        ${heatRows.length ? heatRows.map(n => {
          const rate = n.attempts > 0 ? ((n.correct/n.attempts)*100).toFixed(0) : '-';
          const barW = ((n.attempts/heatMax)*100).toFixed(1);
          const rateColor = n.attempts === 0 ? 'var(--gray-400)'
            : (n.correct/n.attempts) >= 0.8 ? 'var(--success)'
            : (n.correct/n.attempts) >= 0.6 ? 'var(--primary)'
            : 'var(--warning)';
          return `<tr style="border-top:1px solid var(--gray-200);">
            <td style="padding:6px 8px;font-family:monospace;">${n.node_id}</td>
            <td style="padding:6px 8px;">${n.label || '-'}</td>
            <td style="padding:6px 8px;text-align:right;">${n.learners||0}</td>
            <td style="padding:6px 8px;text-align:right;">${n.attempts||0}</td>
            <td style="padding:6px 8px;text-align:right;color:${rateColor};font-weight:600;">${rate}${rate!=='-'?'%':''}</td>
            <td style="padding:6px 8px;width:120px;">
              <div style="background:var(--gray-100);border-radius:3px;height:10px;overflow:hidden;">
                <div style="width:${barW}%;background:${rateColor};height:100%;"></div>
              </div>
            </td>
          </tr>`;
        }).join('') : '<tr><td colspan="6" style="padding:16px;text-align:center;color:var(--gray-500);">수집된 표준체계 데이터가 없습니다.</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>`;

  // 5) 최근 이벤트
  const events = (recent && recent.events) || [];
  const recentHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>최근 수집 이벤트</h2><div class="subtitle">최신 ${events.length}건</div></header>
      <div style="overflow:auto;max-height:400px;">
      <table style="width:100%;border-collapse:collapse;font-size:var(--fs-caption);">
        <thead><tr style="background:var(--gray-100);position:sticky;top:0;">
          <th style="text-align:left;padding:6px;">시각</th>
          <th style="text-align:left;padding:6px;">사용자</th>
          <th style="text-align:left;padding:6px;">영역</th>
          <th style="text-align:left;padding:6px;">동사</th>
          <th style="text-align:left;padding:6px;">표준ID</th>
          <th style="text-align:left;padding:6px;">교과</th>
          <th style="text-align:left;padding:6px;">수준</th>
        </tr></thead>
        <tbody>
        ${events.length ? events.map(e => `
          <tr style="border-top:1px solid var(--gray-200);">
            <td style="padding:4px 6px;white-space:nowrap;">${(e.event_timestamp||'').slice(5,16).replace('T',' ')}</td>
            <td style="padding:4px 6px;">${e.display_name || `user-${e.user_id}`}</td>
            <td style="padding:4px 6px;"><span class="chip">${e.area}</span></td>
            <td style="padding:4px 6px;font-family:monospace;">${e.verb}</td>
            <td style="padding:4px 6px;font-family:monospace;font-size:11px;">${e.primary_std_id||'-'}</td>
            <td style="padding:4px 6px;">${e.subject_code||'-'}</td>
            <td style="padding:4px 6px;">${e.achievement_level||'-'}</td>
          </tr>`).join('') : '<tr><td colspan="7" style="padding:16px;text-align:center;color:var(--gray-500);">이벤트가 없습니다.</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>`;

  root.innerHTML = `
    <section class="dc-chart-wrapper">
      <header>
        <h2>xAPI 표준체계 분석</h2>
        <div class="subtitle">AIDT 기술규격 v2.2 기반 수집 데이터 · 교육부 학습데이터허브 포맷 정합</div>
      </header>
      ${kpiHtml}
    </section>
    ${areaHtml}
    ${distHtml}
    ${heatHtml}
    ${recentHtml}
  `;
}

      <header><h2>최근 다운로드 이력</h2><div class="subtitle">브라우저 LocalStorage · 최대 10건</div></header>
      <div id="exHist"></div>
    </section>`;

  function currentScope(){
    const el = root.querySelector('input[name="exScope"]:checked');
    return el ? el.value : 'all';
  }
  function currentFormat(){
    const el = root.querySelector('input[name="exFormat"]:checked');
    return el ? el.value : 'csv';
  }
  function updateEstimate(){
    const sc = currentScope();
    const est = document.getElementById('exEstimate');
    if (!est) return;
    let n = 0, label = '';
    if (sc === 'all')      { n = totalLogs; label = '원시 로그'; }
    else if (sc === 'daily')   { n = drows.length; label = '일별 집계 행'; }
    else if (sc === 'service') { n = 10; label = '서비스 집계 행(대략)'; }
    else if (sc === 'class')   { n = 30; label = '학급 집계 행(대략)'; }
    else if (sc === 'subject') { n = 20; label = '교과 집계 행(대략)'; }
    est.innerHTML = `약 <strong>${n.toLocaleString()}</strong>행 (${escapeHtml(label)}) · 형식 <strong>${escapeHtml(currentFormat().toUpperCase())}</strong>`;
  }
  root.querySelectorAll('input[name="exScope"],input[name="exFormat"]').forEach(el => {
    el.addEventListener('change', updateEstimate);
  });
  updateEstimate();

  function renderHist(){
    const box = document.getElementById('exHist');
    if (!hist.length){ box.innerHTML = tplEmpty('다운로드 이력이 없습니다'); return; }
    renderDataTable(box, {
      columns: [
        { key:'at',     label:'시각', format:v=>escapeHtml(new Date(v).toLocaleString('ko-KR')) },
        { key:'scope',  label:'범위' },
        { key:'fmt',    label:'형식', format:v=>escapeHtml(String(v).toUpperCase()) },
        { key:'period', label:'기간' }
      ],
      rows: hist, initialSort:'at', initialDir:'desc'
    });
  }
  renderHist();

  document.getElementById('btnExportDo').addEventListener('click', () => {
    LRS.exportData(currentFormat(), currentScope());
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
  document.getElementById('btnExportCsvQuick').addEventListener('click', () => {
    LRS.exportData('csv', 'all');
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
  document.getElementById('btnExportXlsxQuick').addEventListener('click', () => {
    LRS.exportData('xlsx', 'all');
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
};

 * 라우팅/상태 관리

function setRole(role){
  const allowed = state.me && state.me.role === 'admin' ? ['student','teacher','admin']
                 : state.me && state.me.role === 'teacher' ? ['student','teacher']
                 : ['student'];
  if (!allowed.includes(role)) role = allowed[allowed.length-1];
  state.role = role;
  state.scope = computeScope();
  // 이전 역할의 view id가 남아 있으면 새 역할 랜딩 뷰 전환 판정이 어긋나므로 리셋
  state.view = null;

  document.querySelectorAll('.dc-role-switcher button').forEach(b=>{
    const r = b.dataset.role;
    b.setAttribute('aria-pressed', r===role ? 'true':'false');
    b.disabled = !allowed.includes(r);
    if (!allowed.includes(r)) {
      b.title = '이 계정에는 해당 역할 보기 권한이 없습니다';
      b.setAttribute('aria-disabled','true');
    } else {
      b.removeAttribute('title');
      b.removeAttribute('aria-disabled');
    }
  });

  syncRealOnlyToggleVisibility();

  // 역할 전환 시 현재 카테고리가 해당 역할에서 지원되지 않으면 home으로 되돌림
  if (!ROLE_CATEGORIES[role].includes(state.category || 'home')) {
    state.category = 'home';
  }
  renderSideMenu(state.category || 'home');
  const firstId = defaultViewForCategory(role, state.category || 'home') || MENUS[role][0].id;
  setView(firstId);
}

function renderSideMenu(cat){
  const useCat = cat || state.category || 'home';
  state.category = useCat;
  const aside = document.querySelector('.lrs-sidemenu');
  const allItems = MENUS[state.role] || [];
  // 홈 카테고리: 사이드바 전체 숨김 (빈 pill 금지)
  if (useCat === 'home'){
    if (aside) aside.setAttribute('data-hidden', 'true');
    const m = document.getElementById('roleMenu'); if (m) m.innerHTML = '';
    document.getElementById('bcRole').textContent =
      state.role==='student'?'학생':state.role==='teacher'?'교사':'관리자';
    return;
  }
  if (aside) aside.setAttribute('data-hidden', 'false');

  const items = allItems.filter(it => it.category === useCat);
  document.getElementById('roleMenuTitle').textContent = MENU_LABELS[useCat] || '메뉴';

  // group 필드로 묶어 헤더 삽입
  const groups = [];
  const seen = new Map();
  items.forEach(it => {
    const g = it.group || '기타';
    if (!seen.has(g)){ seen.set(g, groups.length); groups.push({ name:g, items:[] }); }
    groups[seen.get(g)].items.push(it);
  });
  const catLabel = MENU_LABELS[useCat] || '';
  document.getElementById('roleMenu').innerHTML = groups.map(g => `
    <div class="dc-sidemenu-group">
      ${(groups.length>1 && g.name !== catLabel) ? `<div class="dc-sidemenu-group-title">${escapeHtml(g.name)}</div>` : ''}
      ${g.items.map(it=>`
        <button class="menu-item" type="button" data-view="${escapeAttr(it.id)}"
          ${state.view===it.id?'aria-current="page"':''}
          aria-label="${escapeAttr(it.label)}로 이동">
          <i class="fas ${escapeAttr(it.icon)}" aria-hidden="true"></i><span class="label">${escapeHtml(it.label)}</span>
        </button>`).join('')}
    </div>`).join('');
  document.getElementById('roleMenu').querySelectorAll('button').forEach(b=>{
    b.onclick = ()=> setView(b.dataset.view);
  });
  document.getElementById('bcRole').textContent =
    state.role==='student'?'학생':state.role==='teacher'?'교사':'관리자';
}

/* 폐기/통합된 구 관리자 뷰 id → 신규 5블록 매핑 (레거시 URL 호환) */
const ADMIN_VIEW_ALIAS = {
  'a-usage':'a-svc-ops', 'a-overview':'a-home',
  'a-achieve':'a-cross', 'a-perform':'a-cross', 'a-custom':'a-cross',
  'a-warnings':'a-macro', 'a-drill':'a-macro', 'a-compare':'a-macro',
  'a-daily':'a-time'
};
async function setView(id){
  // 관리자 뷰 alias 보정: 폐기·통합되어 admin 메뉴에서 빠진 구 뷰 id로 진입하면 신규 블록으로 흡수
  if (state.role === 'admin' && ADMIN_VIEW_ALIAS[id] && !(MENUS.admin||[]).some(it=>it.id===id)) {
    id = ADMIN_VIEW_ALIAS[id];
  }
  state.view = id;
  const items = MENUS[state.role] || [];
  const cur = items.find(it=>it.id===id);
  document.getElementById('bcPage').textContent = cur ? cur.label : '—';
  const menuKey = viewToMenu(id);
  state.category = menuKey || state.category || 'home';
  const bcMenuEl = document.getElementById('bcMenu');
  // 브레드크럼: 홈 카테고리면 "역할 > 홈" 3단, 그 외 4단
  const isHome = state.category === 'home';
  if (bcMenuEl) {
    if (isHome) {
      bcMenuEl.textContent = '';
      bcMenuEl.setAttribute('hidden','');
      // 홈에서는 bcPage만 "홈"으로
      document.getElementById('bcPage').textContent = '홈';
    } else {
      bcMenuEl.removeAttribute('hidden');
      bcMenuEl.textContent = MENU_LABELS[state.category] || '—';
    }
  }
  renderSideMenu(state.category);
  // URL 동기화: hash + ?menu= 둘 다 갱신
  try {
    const url = new URL(location.href);
    url.hash = id;
    if (menuKey) url.searchParams.set('menu', menuKey);
    const next = url.pathname + url.search + url.hash;
    const curr = location.pathname + location.search + location.hash;
    if (next !== curr) {
      history.replaceState(null, '', next);
      try { window.dispatchEvent(new CustomEvent('dacheum:menu-changed', { detail: { menu: menuKey, view: id } })); } catch(_){}
    }
  } catch(_) {
    if (('#'+id) !== location.hash) { try { location.hash = id; } catch(__){} }
  }

  destroyCharts();
  const root = document.getElementById('viewRoot');
  // 클릭 즉시 로딩 표시가 보이도록 프레임 양보 없이 바로 갱신
  root.innerHTML = tplLoading(3);
  try {
    const fn = VIEWS[id] || (r => { r.innerHTML = tplEmpty('준비 중인 화면입니다'); });
    await fn(root);
  } catch (e) {
    console.error('[LRS] 뷰 렌더 실패', e);
    root.innerHTML = tplError(e.message, ()=>setView(id));
  }
  document.getElementById('syncTime').textContent = '동기화: ' + new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
}

 * 기간 피커 (B4 해결)
