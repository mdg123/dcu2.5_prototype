<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>다채움 - LRS 학습분석</title>
  <link rel="stylesheet" href="/css/common-nav.css">
  <link rel="stylesheet" href="/css/lrs-tokens.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    html { overflow-x:clip; }
    body { font-family:var(--font-sans); background:var(--gray-50); color:var(--gray-800); margin:0; overflow-x:clip; }
    .toolbar { display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
    /* ── 트리맵(간이·CSS) & 드릴다운 브레드크럼 ─────────────────── */
    .dc-treemap { display:flex; flex-wrap:wrap; gap:2px; padding:4px; background:var(--gray-100); border-radius:6px; min-height:260px; }
    .dc-treemap .cell { position:relative; flex-grow:1; min-width:60px; min-height:44px; border-radius:4px;
      padding:6px 8px; color:#fff; font-size:var(--fs-cap); line-height:1.3; overflow:hidden; cursor:default;
      display:flex; flex-direction:column; justify-content:space-between; }
    .dc-treemap .cell b { font-size:var(--fs-sm); font-weight:600; display:block; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
    .dc-treemap .cell small { opacity:.85; }
    .dc-treemap .cell.masked { background:repeating-linear-gradient(45deg,#94a3b8,#94a3b8 6px,#64748b 6px,#64748b 12px); color:#fff; }
    .dc-drill-bc { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:var(--fs-body); margin:4px 0 12px; }
    .dc-drill-bc button { background:transparent; border:1px solid var(--gray-300); border-radius:14px; padding:4px 10px; font-size:var(--fs-h3); cursor:pointer; color:var(--gray-700); }
    .dc-drill-bc button[aria-current="page"] { background:var(--lrs-primary,#2563eb); color:#fff; border-color:var(--lrs-primary,#2563eb); }
    .dc-drill-bc .sep { color:var(--gray-400); }
    .dc-dumbbell-legend { display:flex; gap:12px; font-size:var(--fs-sm); color:var(--gray-600); margin:0 0 8px; }
    .dc-dumbbell-legend .swatch { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:middle; }

    /* ── 데이터 범위 토글 (시드 포함 / 실데이터만) ───────────────── */
    .dc-realonly-toggle { display:inline-flex; align-items:center; gap:var(--space-2); margin-left:auto; flex-wrap:wrap; }
    .dc-realonly-toggle[hidden] { display:none; }
    .dc-realonly-toggle .dc-realonly-label { font-size:var(--fs-body); font-weight:600; color:var(--gray-700); }
    .dc-realonly-toggle .chip {
      padding:5px 12px; border-radius:var(--radius-pill); border:1px solid var(--gray-300);
      background:#fff; font-size:var(--fs-body); font-weight:600; color:var(--gray-600); cursor:pointer;
      transition:all var(--dur) var(--ease-out);
    }
    .dc-realonly-toggle .chip:hover { background:var(--gray-50); color:var(--gray-800); }
    .dc-realonly-toggle .chip[aria-pressed="true"] { background:var(--lrs-primary); color:#fff; border-color:var(--lrs-primary); }

    /* ── 단위 토글 (블록 내부 셀렉터 칩) ─────────────────────────── */
    .dc-unit-toggle { display:inline-flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .dc-unit-toggle .chip {
      padding:4px 12px; border-radius:var(--radius-pill); border:1px solid var(--gray-300);
      background:#fff; font-size:var(--fs-body); font-weight:600; color:var(--gray-600); cursor:pointer;
    }
    .dc-unit-toggle .chip[aria-pressed="true"] { background:var(--lrs-primary); color:#fff; border-color:var(--lrs-primary); }

    /* ── 서비스 사용률 가로 막대 랭킹 ───────────────────────────── */
    .dc-svc-rank { display:flex; flex-direction:column; gap:10px; margin-top:4px; }
    .dc-svc-rank .row { display:grid; grid-template-columns:130px 1fr auto; align-items:center; gap:12px; }
    .dc-svc-rank .name { font-size:var(--fs-body); font-weight:600; color:var(--gray-800); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dc-svc-rank .bar-track { position:relative; height:24px; background:var(--gray-100); border-radius:6px; overflow:hidden; }
    .dc-svc-rank .bar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:6px; min-width:3px; transition:width .5s var(--ease-out); }
    .dc-svc-rank .row.top .bar-fill { background:var(--chart-2); }
    .dc-svc-rank .row.bottom .bar-fill { background:var(--chart-4); }
    .dc-svc-rank .row .bar-fill { background:var(--chart-1); }
    .dc-svc-rank .meta { display:flex; align-items:center; gap:8px; font-size:var(--fs-body); font-variant-numeric:tabular-nums; white-space:nowrap; }
    .dc-svc-rank .cnt { font-weight:700; color:var(--gray-900); }
    .dc-svc-rank .delta { font-size:var(--fs-sm); font-weight:600; padding:2px 8px; border-radius:var(--radius-pill); }
    .dc-svc-rank .delta.up { color:#15803d; background:#dcfce7; }
    .dc-svc-rank .delta.down { color:#b91c1c; background:#fee2e2; }
    .dc-svc-rank .delta.flat { color:var(--gray-600); background:var(--gray-100); }

    /* ── 진단 카드 그리드 ──────────────────────────────────────── */
    .dc-diag-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:var(--space-3); }
    .dc-diag-card { border:1px solid var(--gray-200); border-left-width:4px; border-radius:var(--radius-md); padding:14px 16px; background:#fff; }
    .dc-diag-card[data-sev="critical"] { border-left-color:#dc2626; background:#fef2f2; }
    .dc-diag-card[data-sev="warn"] { border-left-color:#f59e0b; background:#fffbeb; }
    .dc-diag-card[data-sev="caution"] { border-left-color:#eab308; background:#fefce8; }
    .dc-diag-card[data-sev="ok"] { border-left-color:#10b981; }
    .dc-diag-card .dc-diag-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .dc-diag-card .dc-diag-svc { font-size:var(--fs-h2); font-weight:700; color:var(--gray-900); }
    .dc-diag-card .dc-diag-status { font-size:var(--fs-cap); font-weight:700; padding:3px 10px; border-radius:var(--radius-pill); white-space:nowrap; }
    .dc-diag-card[data-sev="critical"] .dc-diag-status { color:#dc2626; background:#fee2e2; }
    .dc-diag-card[data-sev="warn"] .dc-diag-status { color:#b45309; background:#fef3c7; }
    .dc-diag-card[data-sev="caution"] .dc-diag-status { color:#a16207; background:#fef9c3; }
    .dc-diag-card .dc-diag-msg { font-size:var(--fs-body); color:var(--gray-700); line-height:1.6; }
    .dc-diag-card .dc-diag-metrics { display:flex; gap:14px; margin-top:10px; font-size:var(--fs-sm); color:var(--gray-600); flex-wrap:wrap; }
    .dc-diag-card .dc-diag-metrics b { color:var(--gray-900); }

    /* ── 3분위 매트릭스 카드 ───────────────────────────────────── */
    .dc-tertile-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); }
    .dc-tertile-card { border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:16px; text-align:center; color:#fff; }
    .dc-tertile-card.t-hi { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
    .dc-tertile-card.t-mid { background:linear-gradient(135deg,#10b981,#059669); }
    .dc-tertile-card.t-lo { background:linear-gradient(135deg,#f59e0b,#d97706); }
    .dc-tertile-card .t-tier { font-size:var(--fs-body); font-weight:700; opacity:.92; margin-bottom:6px; }
    .dc-tertile-card .t-score { font-size:var(--fs-display); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; }
    .dc-tertile-card .t-unit { font-size:var(--fs-body); font-weight:500; margin-left:2px; }
    .dc-tertile-card .t-n { font-size:var(--fs-sm); opacity:.85; margin-top:6px; }

    /* ── 인사이트 배너 ─────────────────────────────────────────── */
    .dc-insight-banner { display:flex; align-items:flex-start; gap:12px; background:#eff6ff; border:1px solid #bfdbfe; border-left:4px solid var(--lrs-primary);
      border-radius:var(--radius-md); padding:14px 18px; margin-bottom:var(--space-4); font-size:var(--fs-body); color:var(--gray-800); line-height:1.6; }
    .dc-insight-banner .ib-icon { font-size:20px; line-height:1.2; flex-shrink:0; }
    .dc-insight-banner strong { color:var(--lrs-primary-dark); }
    .dc-insight-banner.small-sample { background:#fffbeb; border-color:#fde68a; border-left-color:#f59e0b; }

    /* ── 학교급 미니카드 ───────────────────────────────────────── */
    .dc-level-mini { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--space-3); margin-top:var(--space-4); }
    .dc-level-mini .mini { border:1px solid var(--gray-200); border-radius:var(--radius-md); padding:14px 16px; background:#fff; }
    .dc-level-mini .mini .lv { font-size:var(--fs-body); font-weight:700; color:var(--gray-800); margin-bottom:6px; }
    .dc-level-mini .mini .row { display:flex; justify-content:space-between; font-size:var(--fs-sm); color:var(--gray-600); padding:3px 0; }
    .dc-level-mini .mini .row b { color:var(--gray-900); font-variant-numeric:tabular-nums; }

    @media (max-width:768px){
      .dc-svc-rank .row { grid-template-columns:96px 1fr; grid-template-areas:'name meta' 'bar bar'; row-gap:6px; }
      .dc-svc-rank .name { grid-area:name; }
      .dc-svc-rank .meta { grid-area:meta; justify-self:end; }
      .dc-svc-rank .bar-track { grid-area:bar; }
      .dc-tertile-grid { grid-template-columns:1fr; }
      .dc-level-mini { grid-template-columns:1fr; }
    }

    /* ═══════════════════════════════════════════════════════════════════
       성취수준 P0 — 4상태 색상 시스템 (전 위젯 단일 출처)
       기획서: 작업지시서/LRS_성취수준_P0_시각스펙.md §1
       BE status 코드: reached / partial / not_reached / insufficient
       (CSS data-state 키는 카멜 notReached 로 정규화하여 셀에 부착)
       ═══════════════════════════════════════════════════════════════════ */
    :root{
      --mastery-reached:#16a34a;       --mastery-reached-soft:#dcfce7;       --mastery-reached-ink:#15803d;
      --mastery-partial:#f59e0b;       --mastery-partial-soft:#fef3c7;       --mastery-partial-ink:#b45309;
      --mastery-notreached:#ef4444;    --mastery-notreached-soft:#fee2e2;    --mastery-notreached-ink:#b91c1c;
      --mastery-insufficient:#9ca3af;  --mastery-insufficient-soft:#f3f4f6;  --mastery-insufficient-ink:#4b5563;
    }

    /* ═══════════════════════════════════════════════════════════════════
       분석·예측 강화 P0 — 위험 전용 톤 vs 4상태 도달색 구분 (단일 출처)
       기획서: 작업지시서/LRS_분석예측_P0_시각스펙.md §1
       ★ 도달도(채움색)와 위험도(테두리+아이콘+배지)는 다른 축. 절대 혼동 금지.
       ═══════════════════════════════════════════════════════════════════ */
    :root{
      /* 위험 등급(EWS) — 도달 4상태와 혼동 금지: 채움 아닌 테두리/아이콘/배지로 */
      --risk-high:#dc2626;  --risk-high-soft:#fef2f2;  --risk-high-ink:#991b1b;   /* 진빨강(미도달 #ef4444보다 진함) */
      --risk-mid:#f59e0b;   --risk-mid-soft:#fffbeb;   --risk-mid-ink:#b45309;     /* 주황 */
      --risk-low:#9ca3af;   --risk-low-soft:#f9fafb;   --risk-low-ink:#4b5563;     /* 회색 */
      /* 추세(Trend) 화살표 — 빨강 금지(미도달색 충돌 회피). 하락은 호박색 */
      --trend-up:#16a34a;   --trend-flat:#9ca3af;      --trend-down:#ea7317;
      /* 신뢰도(Confidence) 점 */
      --conf-high:#16a34a;  --conf-mid:#f59e0b;        --conf-low:#9ca3af;
      /* 예상 밴드(불확실성) */
      --proj-line:#2563eb;  --proj-band:rgba(37,99,235,.12);  --proj-band-stroke:rgba(37,99,235,.35);
    }

    /* ── 공통: 신뢰 배지 / 소표본 단서 / 예측 한계 고지 ── */
    .conf-badge{ display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600;
      color:#4b5563; padding:3px 10px; border-radius:9999px; background:#f9fafb; border:1px solid #e5e7eb; cursor:help; white-space:nowrap; }
    .conf-badge .conf-dot{ width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
    .conf-badge[data-conf="high"] .conf-dot{ background:var(--conf-high); }
    .conf-badge[data-conf="mid"]  .conf-dot{ background:var(--conf-mid); }
    .conf-badge[data-conf="low"]  .conf-dot{ background:var(--conf-low); }
    .lowsample-chip{ display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
      color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:9999px; padding:3px 10px; white-space:nowrap; }
    .proj-disclaimer{ font-size:13px; color:#9ca3af; margin-top:10px; display:flex; align-items:center; gap:6px; }
    .proj-headline{ font-size:13px; color:#374151; font-weight:600; }
    .proj-headline strong{ color:var(--proj-line); }
    .proj-headline.warn strong{ color:var(--trend-down); }

    /* ── T-EWS: 위험군 조기경보 카드 ── */
    .ews-list{ display:flex; flex-direction:column; gap:12px; }
    .ews-card{ background:#fff; border:1px solid #e5e7eb; border-left-width:4px; border-radius:12px;
      padding:16px 18px; box-shadow:0 1px 3px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:10px;
      transition:box-shadow .15s; min-width:0; }
    .ews-card:hover{ box-shadow:0 4px 12px rgba(0,0,0,.10); }
    .ews-card[data-risk="high"]{ border-left-color:var(--risk-high); }
    .ews-card[data-risk="mid"]{  border-left-color:var(--risk-mid); }
    .ews-card[data-risk="low"]{  border-left-color:var(--risk-low); }
    .ews-card .ews-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .ews-card .ews-name{ font-size:17px; font-weight:700; color:#111827; display:inline-flex; align-items:center; gap:8px; min-width:0; }
    .ews-card .ews-name .risk-icon[data-risk="high"]{ color:var(--risk-high); }
    .ews-card .ews-name .risk-icon[data-risk="mid"]{  color:var(--risk-mid); }
    .ews-card .ews-name .risk-icon[data-risk="low"]{  color:var(--risk-low); }
    .ews-card .ews-badges{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
    /* 위험 배지 — 도달 배지(soft 채움 무테두리)와 달리 테두리+아이콘 강조 */
    .risk-badge{ display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:700;
      padding:3px 11px; border-radius:9999px; border:1.5px solid; background:#fff; line-height:1.4; white-space:nowrap; }
    .risk-badge[data-risk="high"]{ color:var(--risk-high-ink); border-color:var(--risk-high); background:var(--risk-high-soft); }
    .risk-badge[data-risk="mid"]{  color:var(--risk-mid-ink);  border-color:var(--risk-mid);  background:var(--risk-mid-soft); }
    .risk-badge[data-risk="low"]{  color:var(--risk-low-ink);  border-color:var(--risk-low);  background:var(--risk-low-soft); }
    .ews-reasons{ display:flex; flex-wrap:wrap; gap:6px; }
    .ews-reason{ font-size:13px; font-weight:600; color:#374151; background:#f3f4f6; border-radius:8px; padding:4px 10px; cursor:help; }
    .ews-reason[data-key="decline"]{ color:#b45309; background:#fffbeb; }
    .ews-reason[data-key="insufficient"]{ color:#4b5563; background:#f9fafb; }
    .ews-reason:focus-visible{ outline:0; box-shadow:0 0 0 3px rgba(37,99,235,.35); }
    .ews-actions{ display:flex; gap:8px; flex-wrap:wrap; }
    .ews-actions .mastery-btn-sm{ flex:0 0 auto; }

    /* ── T-TREND: 학생별 성취 추세 스파크라인 표 ── */
    .trend-table-wrap{ max-width:100%; min-width:0; }
    .trend-table{ width:100%; border-collapse:collapse; font-size:13px; }
    .trend-table th{ text-align:left; font-size:13px; color:#4b5563; font-weight:600; padding:8px 10px; border-bottom:1px solid #e5e7eb; }
    .trend-table td{ padding:10px; border-bottom:1px solid #f3f4f6; vertical-align:middle; }
    .trend-table td.t-name{ font-size:15px; color:#1f2937; font-weight:600; white-space:nowrap; }
    .spark{ display:block; width:120px; height:32px; max-width:100%; cursor:help; }
    .spark .spark-line{ fill:none; stroke-width:2; }
    .spark .spark-line[data-trend="up"]{ stroke:var(--trend-up); }
    .spark .spark-line[data-trend="flat"]{ stroke:var(--trend-flat); }
    .spark .spark-line[data-trend="down"]{ stroke:var(--trend-down); }
    .spark .spark-area[data-trend="up"]{ fill:var(--trend-up); opacity:.12; }
    .spark .spark-area[data-trend="flat"]{ fill:var(--trend-flat); opacity:.12; }
    .spark .spark-area[data-trend="down"]{ fill:var(--trend-down); opacity:.12; }
    .spark .spark-dot[data-trend="up"]{ fill:var(--trend-up); }
    .spark .spark-dot[data-trend="flat"]{ fill:var(--trend-flat); }
    .spark .spark-dot[data-trend="down"]{ fill:var(--trend-down); }
    .trend-arrow{ display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:700; white-space:nowrap; cursor:help; }
    .trend-arrow[data-trend="up"]{ color:var(--trend-up); }
    .trend-arrow[data-trend="flat"]{ color:var(--trend-flat); }
    .trend-arrow[data-trend="down"]{ color:var(--trend-down); }
    .trend-note{ font-size:13px; color:#9ca3af; }
    /* T-TREND 모바일 카드 전환 */
    .trend-cards{ display:none; }
    .trend-card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
    .trend-card .tc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
    .trend-card .tc-name{ font-size:15px; font-weight:700; color:#1f2937; }
    .trend-card .spark{ width:100%; max-width:240px; }
    @media (max-width:767px){
      .trend-table-wrap{ display:none; }
      .trend-cards{ display:block; }
    }

    /* ── S-TREND/S-PROJ: 학생 도달 예상 칩 (무위험·자기효능) ── */
    .sproj-chips{ display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
    .sproj-chip{ display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:600;
      padding:10px 16px; border-radius:12px; line-height:1.4; }
    .sproj-chip.good{ background:#dcfce7; color:#15803d; }
    .sproj-chip.proj{ background:#eff6ff; color:#1d4ed8; }
    .sproj-chip.soft{ background:#f3f4f6; color:#4b5563; }
    @media (max-width:767px){ .sproj-chips{ flex-direction:column; } .sproj-chip{ width:100%; } }

    /* ── A-WEAK: 취약 성취기준 추세 랭킹 — 인라인 도달 Bar ── */
    .weak-bar{ display:inline-flex; align-items:center; gap:8px; }
    .weak-bar .wb-track{ width:64px; height:8px; border-radius:4px; background:#f3f4f6; overflow:hidden; flex:0 0 auto; }
    .weak-bar .wb-fill{ height:100%; border-radius:4px; display:block; }
    .weak-bar .wb-fill[data-state="reached"]{ background:var(--mastery-reached); }
    .weak-bar .wb-fill[data-state="partial"]{ background:var(--mastery-partial); }
    .weak-bar .wb-fill[data-state="notReached"]{ background:var(--mastery-notreached); }
    .weak-bar .wb-num{ font-size:14px; font-weight:600; color:#374151; min-width:36px; font-variant-numeric:tabular-nums; }
    /* A-WEAK 모바일 카드 */
    .weak-cards{ display:none; }
    .weak-card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:14px 16px; margin-bottom:10px; }
    .weak-card .wc-title{ font-size:15px; font-weight:700; color:#1f2937; margin-bottom:2px; }
    .weak-card .wc-sub{ font-size:13px; color:#9ca3af; margin-bottom:10px; }
    .weak-card .wc-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    @media (max-width:767px){
      .weak-table-wrap{ display:none; }
      .weak-cards{ display:block; }
    }

    /* 신규 위젯 전용 타이포 상향 (lrs/index.html 기본 스케일이 작아 위젯 한정 상향) */
    .mastery-h2{ font-size:19px; font-weight:700; color:#1f2937; margin:0; }
    .mastery-sub{ font-size:13px; color:#6b7280; line-height:1.5; }
    .mastery-section{ background:#fff; border:1px solid #e5e7eb; border-radius:16px; padding:24px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); max-width:100%; min-width:0; }
    .mastery-section > .ms-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
    .mastery-section > .ms-head .ms-titles{ min-width:0; }
    .mastery-section .ms-controls{ display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .mastery-section select.ms-select{ font-size:14px; font-family:inherit; padding:7px 12px; border:1px solid #d1d5db; border-radius:8px; background:#fff; color:#374151; cursor:pointer; }

    /* 4상태 범례 */
    .mastery-legend{ display:flex; flex-wrap:wrap; gap:16px; align-items:center; font-size:13px; color:#4b5563; margin-top:12px; }
    .mastery-legend .item{ display:inline-flex; align-items:center; gap:6px; }
    /* 범례 스와치 = 히트맵 셀이 실제로 보이는 색을 그대로 반영(셀↔범례 1:1) */
    .mastery-legend .dot{ width:12px; height:12px; border-radius:4px; flex:0 0 auto; border:1px solid transparent; }
    .mastery-legend .dot.reached{ background:var(--mastery-reached); }
    .mastery-legend .dot.partial{ background:var(--mastery-partial); }
    .mastery-legend .dot.notReached{ background:var(--mastery-notreached); }
    /* 평가 부족 셀 = soft 배경(#f3f4f6) → 범례도 동일 soft + 가는 테두리 */
    .mastery-legend .dot.insufficient{ background:var(--mastery-insufficient-soft); border-color:#d1d5db; }
    /* 데이터 없음 셀 = 흰색 + 점선 테두리 → 범례도 동일 */
    .mastery-legend .dot.none{ background:#fff; border:1px dashed #d1d5db; }
    .mastery-legend .info{ cursor:help; color:#9ca3af; font-size:13px; }

    /* 신규 버튼/뱃지 (CLAUDE.md 스케일) */
    .mastery-btn{ font-size:16px; font-weight:700; padding:12px 22px; border-radius:10px; border:0; cursor:pointer;
      background:var(--lrs-primary,#2563eb); color:#fff; display:inline-flex; align-items:center; justify-content:center; gap:8px;
      font-family:inherit; transition:background .15s,transform .05s; text-decoration:none; }
    .mastery-btn:hover{ background:#1d4ed8; }
    .mastery-btn:active{ transform:translateY(1px); }
    .mastery-btn:focus-visible{ outline:0; box-shadow:0 0 0 3px rgba(37,99,235,.35); }
    .mastery-btn:disabled{ background:#cbd5e1; color:#fff; cursor:not-allowed; }
    .mastery-btn-sm{ font-size:14px; font-weight:600; padding:8px 14px; border-radius:8px; }
    .mastery-btn-ghost{ background:#fff; color:#2563eb; border:1px solid #93c5fd; }
    .mastery-btn-ghost:hover{ background:#eff6ff; }
    .mastery-badge{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600;
      padding:4px 12px; border-radius:9999px; line-height:1.4; }
    .mastery-badge.reached{ background:var(--mastery-reached-soft); color:var(--mastery-reached-ink); }
    .mastery-badge.partial{ background:var(--mastery-partial-soft); color:var(--mastery-partial-ink); }
    .mastery-badge.notReached{ background:var(--mastery-notreached-soft); color:var(--mastery-notreached-ink); }
    .mastery-badge.insufficient{ background:var(--mastery-insufficient-soft); color:var(--mastery-insufficient-ink); }
    .mastery-chip-gray{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600;
      padding:3px 10px; border-radius:9999px; background:var(--mastery-insufficient-soft); color:var(--mastery-insufficient-ink); }

    /* 빈 상태 (친절 문구 + CTA) */
    .mastery-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
      padding:40px 24px; color:#6b7280; gap:14px; }
    .mastery-empty .me-icon{ font-size:34px; color:#cbd5e1; }
    .mastery-empty p{ font-size:16px; line-height:1.6; margin:0; max-width:460px; }

    /* 2분할 그리드 (S1) */
    .mastery-grid2{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media (max-width:1024px){ .mastery-grid2{ grid-template-columns:1fr; } }

    /* 도넛 중앙 텍스트 래퍼 */
    .donut-wrap{ position:relative; }
    .donut-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
    .donut-center .dc-num{ font-size:24px; font-weight:700; color:#111827; line-height:1.1; }
    .donut-center .dc-lbl{ font-size:13px; color:#6b7280; margin-top:2px; }

    /* ── S4: "다음에 뭘?" CTA 카드 ── */
    .next-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
    .next-card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:20px;
      display:flex; flex-direction:column; gap:10px; box-shadow:0 1px 3px rgba(0,0,0,.08);
      transition:box-shadow .15s,transform .15s; }
    .next-card:hover{ box-shadow:0 8px 18px rgba(0,0,0,.10); transform:translateY(-2px); }
    .next-card:focus-within{ box-shadow:0 0 0 3px rgba(37,99,235,.35); }
    .next-card .nc-badgerow{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .next-card .nc-subject{ font-size:13px; color:#6b7280; font-weight:600; }
    .next-card .nc-title{ font-size:17px; font-weight:700; color:#1f2937; line-height:1.5;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .next-card .nc-meta{ font-size:13px; color:#6b7280; }
    .next-card .nc-divider{ border:0; border-top:1px solid #f3f4f6; margin:2px 0; }
    .next-card .nc-item{ font-size:15px; color:#374151; display:flex; align-items:center; gap:8px; }
    .next-card .nc-item .nc-mins{ margin-left:auto; font-size:13px; color:#6b7280; background:#f3f4f6; border-radius:9999px; padding:2px 8px; }
    .next-card .nc-more{ font-size:13px; color:#2563eb; background:none; border:0; cursor:pointer; padding:0; text-align:left; font-family:inherit; }
    .next-card .nc-prereq{ font-size:13px; color:#6b7280; background:#f9fafb; border-radius:8px; padding:8px 10px; }
    .next-card .nc-cta{ margin-top:auto; }
    .next-card .mastery-btn{ width:100%; }

    /* ── S4: 90vw/90vh 플레이어 모달 (CLAUDE.md 표준) ── */
    .player-modal{ position:fixed; inset:0; z-index:10000; background:rgba(17,24,39,.5); display:none;
      align-items:center; justify-content:center; }
    .player-modal[data-open="true"]{ display:flex; }
    .player-modal .pm-box{ width:90vw; height:90vh; background:#fff; border-radius:16px; overflow:hidden;
      display:flex; flex-direction:column; box-shadow:0 20px 40px rgba(0,0,0,.25); }
    .player-modal .pm-head{ display:flex; align-items:center; justify-content:space-between;
      gap:16px; padding:16px 20px; border-bottom:1px solid #e5e7eb; }
    .player-modal .pm-head h3{ font-size:19px; font-weight:700; color:#1f2937; margin:0;
      max-width:calc(100% - 56px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .player-modal .pm-close{ flex:0 0 auto; width:40px; height:40px; min-width:40px; border:0; background:#f3f4f6; border-radius:8px;
      font-size:20px; line-height:1; color:#4b5563; cursor:pointer; }
    .player-modal .pm-close:hover{ background:#e5e7eb; }
    .player-modal .pm-body{ flex:1; min-height:0; }
    .player-modal .pm-body iframe{ width:100%; height:100%; border:0; display:block; }

    /* ── T1: 성취기준×학생 히트맵 ── */
    .mastery-heatmap-wrap{ overflow-x:auto; -webkit-overflow-scrolling:touch; max-width:100%;
      border:1px solid #e5e7eb; border-radius:12px; }
    .mastery-heatmap{ border-collapse:separate; border-spacing:3px; font-size:13px; }
    .mastery-heatmap thead th{ position:sticky; top:0; z-index:3; background:#fff;
      font-size:12px; color:#4b5563; font-weight:600; padding:6px 4px; white-space:nowrap;
      writing-mode:vertical-rl; text-orientation:mixed; height:96px; vertical-align:bottom; }
    .mastery-heatmap thead th.corner{ left:0; z-index:4; writing-mode:horizontal-tb; width:200px;
      text-align:left; vertical-align:bottom; padding:6px 10px; }
    .mastery-heatmap thead th.summary-h{ writing-mode:horizontal-tb; height:auto; vertical-align:bottom; text-align:center; }
    .mastery-heatmap tbody th{ position:sticky; left:0; z-index:2; background:#fff; text-align:left;
      font-size:13px; color:#1f2937; font-weight:600; padding:6px 10px; width:200px; max-width:200px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
    .mastery-heatmap tbody th:hover{ color:#2563eb; }
    .mastery-heatmap tbody th .mh-code{ color:#9ca3af; font-weight:500; font-size:12px; }
    .mastery-heatmap td.cell{ width:30px; height:30px; min-width:30px; border-radius:6px; cursor:pointer;
      text-align:center; color:#fff; font-weight:600; font-size:11px; transition:transform .1s,box-shadow .1s; }
    .mastery-heatmap td.cell:focus-visible{ outline:0; box-shadow:0 0 0 3px rgba(37,99,235,.45); transform:scale(1.1); position:relative; z-index:5; }
    .mastery-heatmap td.cell:hover{ transform:scale(1.18); box-shadow:0 2px 8px rgba(0,0,0,.25); z-index:5; position:relative; }
    .mastery-heatmap td[data-state="reached"]{ background:var(--mastery-reached); }
    .mastery-heatmap td[data-state="partial"]{ background:var(--mastery-partial); }
    .mastery-heatmap td[data-state="notReached"]{ background:var(--mastery-notreached); }
    .mastery-heatmap td[data-state="insufficient"]{ background:var(--mastery-insufficient-soft); color:#9ca3af; }
    .mastery-heatmap td[data-state="none"]{ background:#fff; border:1px dashed #e5e7eb; color:#d1d5db; }
    .mastery-heatmap td.summary{ background:transparent; color:#374151; font-weight:600; text-align:right;
      padding:0 8px; white-space:nowrap; font-variant-numeric:tabular-nums; }

    /* T1 모바일 카드형 (전치) */
    .mastery-cardview{ display:none; }
    .mastery-card{ background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:16px; margin-bottom:12px; }
    .mastery-card .mc-title{ font-size:16px; font-weight:700; color:#1f2937; margin-bottom:4px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .mastery-card .mc-sub{ font-size:13px; color:#6b7280; margin-bottom:10px; }
    .mastery-stack{ display:flex; height:22px; border-radius:6px; overflow:hidden; background:#f3f4f6; }
    .mastery-stack span{ display:block; min-width:0; }
    .mastery-stack span.reached{ background:var(--mastery-reached); }
    .mastery-stack span.partial{ background:var(--mastery-partial); }
    .mastery-stack span.notReached{ background:var(--mastery-notreached); }
    .mastery-stack span.insufficient{ background:var(--mastery-insufficient); }
    .mastery-card .mc-counts{ font-size:13px; color:#4b5563; margin-top:8px; display:flex; flex-wrap:wrap; gap:10px; }
    .mastery-card .mc-counts b{ color:#1f2937; }
    .mastery-card .mc-action{ margin-top:12px; }

    @media (max-width:767px){
      .mastery-heatmap-wrap{ display:none; }
      .mastery-cardview{ display:block; }
    }

    /* T3 미도달 명단 — 학생 칩 */
    .nr-chips{ display:flex; flex-wrap:wrap; gap:6px; }
    .nr-chip{ display:inline-flex; align-items:center; font-size:13px; font-weight:600; padding:3px 10px; border-radius:9999px;
      background:var(--mastery-notreached-soft); color:var(--mastery-notreached-ink); border:1px solid #fecaca; }
    .nr-chip.insufficient{ background:var(--mastery-insufficient-soft); color:var(--mastery-insufficient-ink); border-color:#e5e7eb; }
    .nr-more{ background:none; border:0; color:#2563eb; font-size:13px; cursor:pointer; font-family:inherit; padding:3px 4px; }
    .rate-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-left:6px; vertical-align:middle; }

    /* 히트맵 커스텀 툴팁 */
    #masteryTooltip{ position:fixed; z-index:10002; max-width:280px; background:#111827; color:#fff;
      font-size:13px; line-height:1.5; padding:8px 12px; border-radius:8px; pointer-events:none;
      box-shadow:0 4px 12px rgba(0,0,0,.3); display:none; }

    /* A6 감정-성취 비교 — 반응형(§⑦): <1200 차트 240px, <768 220px */
    #sEmoMirrorBody{ height:280px; }
    @media (max-width:1200px){ #sEmoMirrorBody{ height:240px; } }
    @media (max-width:768px){
      #sEmoMirrorBody{ height:220px; }
      #sEmoMirrorCoach{ padding:14px 16px; }
    }

    /* ===== B6 정서-참여 교차 (교사 · 2×2 산점) ===== */
    #tEngageChartWrap{ position:relative; height:340px; max-width:100%; }
    @media (max-width:1200px){ #tEngageChartWrap{ height:300px; } }
    /* 사분면 배경 오버레이(캔버스 뒤 CSS grid 2×2) */
    .eng-quad-grid{ position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
      pointer-events:none; z-index:0; border-radius:10px; overflow:hidden; }
    .eng-quad-grid .eq-cell{ position:relative; }
    .eng-quad-grid .eq-cell.red{ background:#fef2f2; }        /* 좌상 적신호 강조 */
    .eng-quad-grid .eq-cell.care{ background:#fffbeb; }       /* 우상 정서케어 은은 */
    .eng-quad-grid .eq-cell.motive{ background:#eff6ff; }     /* 좌하 학습동기 은은 */
    .eng-quad-grid .eq-cell.stable{ background:#f0fdf4; }     /* 우하 안정 은은 */
    .eng-quad-grid .eq-lbl{ position:absolute; font-size:13px; font-weight:600; color:#9ca3af; white-space:nowrap; }
    .eng-quad-grid .eq-cell.red .eq-lbl{ top:8px; left:10px; color:#b91c1c; }
    .eng-quad-grid .eq-cell.care .eq-lbl{ top:8px; right:10px; color:#b45309; }
    .eng-quad-grid .eq-cell.motive .eq-lbl{ bottom:8px; left:10px; color:#1d4ed8; }
    .eng-quad-grid .eq-cell.stable .eq-lbl{ bottom:8px; right:10px; color:#15803d; }
    /* 중앙 십자선 */
    .eng-cross-v, .eng-cross-h{ position:absolute; background:#e5e7eb; z-index:1; pointer-events:none; }
    .eng-cross-v{ left:50%; top:0; bottom:0; width:1px; }
    .eng-cross-h{ top:50%; left:0; right:0; height:1px; }
    #tEngageChartWrap canvas{ position:relative; z-index:2; }
    /* 하단 4칩 */
    .eng-chips{ display:flex; gap:10px; margin-top:16px; flex-wrap:wrap; }
    .eng-chip{ flex:1 1 0; min-width:120px; display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:14px; font-weight:600; padding:10px 12px; border-radius:10px; border:1px solid #e5e7eb; background:#fff;
      color:#374151; cursor:pointer; transition:box-shadow .12s,transform .05s; font-family:inherit; }
    .eng-chip:hover{ box-shadow:0 2px 8px rgba(0,0,0,.10); }
    .eng-chip[aria-pressed="true"]{ box-shadow:0 0 0 2px #2563eb inset; }
    .eng-chip .eng-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
    .eng-chip b{ color:#1f2937; font-weight:700; }
    /* 모바일 사분면 리스트 폴백 */
    .eng-mobile{ display:none; }
    .eng-mob-quad{ border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
    .eng-mob-quad.red{ background:#fef2f2; border-color:#fecaca; }
    .eng-mob-quad .emq-head{ display:flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:#1f2937; }
    .eng-mob-quad .emq-dot{ width:10px; height:10px; border-radius:50%; flex:0 0 auto; }
    .eng-mob-quad .emq-names{ font-size:14px; color:#4b5563; margin-top:6px; line-height:1.6; }
    .eng-mob-quad .emq-empty{ font-size:13px; color:#9ca3af; margin-top:6px; }
    @media (max-width:768px){
      #tEngageChartWrap{ display:none; }
      .eng-mobile{ display:block; }
      .eng-chips{ flex-direction:column; }
      .eng-chip{ flex:1 1 auto; justify-content:flex-start; }
    }

    /* ===== B4 겉핥기 감지 (교사 · 산점 + 표) ===== */
    #tShallowChartWrap{ position:relative; height:300px; max-width:100%; }
    @media (max-width:1200px){ #tShallowChartWrap{ height:260px; } }
    .shallow-table-wrap{ max-width:100%; overflow:hidden; }
    table.shallow-table{ width:100%; border-collapse:collapse; font-size:14px; }
    table.shallow-table th, table.shallow-table td{ text-align:left; padding:10px 12px; border-bottom:1px solid #f0f1f3; white-space:nowrap; }
    table.shallow-table th{ font-size:13px; color:#6b7280; font-weight:600; background:#f9fafb; }
    table.shallow-table td{ color:#374151; }
    table.shallow-table td.st-name{ font-weight:600; color:#1f2937; }
    table.shallow-table .st-ratio{ color:#6b7280; font-size:13px; }
    .shallow-sevbadge{ display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:700; padding:3px 10px; border-radius:9999px; }
    .shallow-sevbadge.high{ background:var(--mastery-notreached-soft); color:var(--mastery-notreached-ink); }
    .shallow-sevbadge.medium{ background:var(--mastery-partial-soft); color:var(--mastery-partial-ink); }
    /* 모바일 카드형 표 */
    .shallow-cards{ display:none; }
    .shallow-card{ border:1px solid #e5e7eb; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
    .shallow-card .sc-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .shallow-card .sc-name{ font-size:15px; font-weight:700; color:#1f2937; }
    .shallow-card .sc-meta{ font-size:14px; color:#4b5563; margin-top:6px; }
    @media (max-width:768px){
      #tShallowChartWrap{ display:none; }
      .shallow-table-wrap{ display:none; }
      .shallow-cards{ display:block; }
    }

    /* ===== A4 다음 한 걸음 (학생 · 경로 사슬 + CTA) ===== */
    .ns-chain{ display:flex; align-items:stretch; gap:6px; flex-wrap:nowrap; overflow:hidden; padding:4px 0; }
    .ns-node{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
      min-width:0; flex:1 1 0; max-width:150px; padding:10px 12px; border-radius:12px; border:2px solid transparent;
      background:#fff; text-align:center; }
    .ns-node.reached{ background:var(--mastery-reached-soft); }
    .ns-node.not_reached{ background:var(--mastery-notreached-soft); }
    .ns-node.insufficient, .ns-node.locked{ background:var(--mastery-insufficient-soft); }
    .ns-node.current{ border-color:#2563eb; box-shadow:0 0 0 3px rgba(37,99,235,.12); }
    .ns-node .nsn-emoji{ font-size:15px; line-height:1; }
    .ns-node .nsn-label{ font-size:14px; font-weight:600; color:#1f2937; max-width:100%; overflow:hidden;
      text-overflow:ellipsis; white-space:nowrap; }
    .ns-node .nsn-pin{ font-size:12px; color:#2563eb; font-weight:700; }
    .ns-arrow{ display:flex; align-items:center; color:#9ca3af; font-size:14px; flex:0 0 auto; }
    /* CTA 카드 */
    .ns-cta-card{ border:2px solid #2563eb; border-radius:14px; padding:20px 22px; margin-top:16px; background:#fff; }
    .ns-cta-card.dim{ border:1px solid #e5e7eb; }
    .ns-cta-head{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .ns-cta-key{ font-size:18px; font-weight:700; color:#1f2937; }
    .ns-cta-msg{ font-size:14px; color:#2563eb; font-weight:600; }

(function(){
'use strict';

const PERIODS = { '7d':7, '30d':30, '90d':90 };

/* ---- 보안 헬퍼: HTML escape (C-1 XSS 방지) ---- */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

const state = {
  me: null,
  role: 'student',          // 'student' | 'teacher' | 'admin'
  view: null,               // 현재 뷰 id
  period: '30d',
  from: null,
  to:   null,
  charts: [],
  classId: null,            // teacher's resolved class_id (lazy)
  scope: 'mine',            // 'mine' | 'class' | 'all' — 역할에 따라 자동 계산
  realOnly: false,          // (관리자) true면 시드 제외 실데이터만(?realOnly=1)
};

/* ---- 역할 → 데이터 스코프 계산 ---- */
function computeScope(){
  if (state.role === 'student') return 'mine';
  if (state.role === 'teacher') return 'class';
  if (state.role === 'admin')   return 'all';
  return 'mine';
}

/* ---- scope 자동 부착 대상 엔드포인트 판별 ---- */
function _shouldAttachScope(path){
  if (!path) return false;
  return /^\/api\/lrs\/(stats\/|dashboard|warnings\/)/.test(path);
}

/* ---- 공통 포맷 헬퍼 ---- */
function toMinutes(sec){ return Math.round((Number(sec)||0)/60); }
function fmtDate(s){
  if (!s) return '-';
  const str = String(s);
  // 'YYYY-MM-DD' 그대로 있으면 뒷 5글자(MM-DD) 사용
  const m = str.match(/\d{4}-(\d{2}-\d{2})/);
  return m ? m[1] : str;
}

/* ---- 교사 class_id 해석 (fallback 1) ---- */
async function resolveClassId(){
  if (state.classId) return state.classId;
  // 실제 prefix: /api/class (single)
  for (const path of ['/api/class/my', '/api/classes/my']){
    try {
      const r = await fetch(path, { credentials:'include' });
      if (r.ok){
        const j = await r.json();
        const list = (j && j.classes) || [];
        if (list.length){ state.classId = list[0].id; return state.classId; }
      }
    } catch(_){}
  }
  state.classId = (state.me && (state.me.class_id || state.me.classId)) || 1;
  return state.classId;
}

/* ---- C안 계층형 IA: 2차 메뉴 카테고리 정의 ---- */

const ROLE_CATEGORIES = {

/* ---- 메뉴 정의 (역할별, category 필드 부여) ---- */

    { id:'t-perform',    label:'학습 활동 수행',  icon:'fa-tasks',                 group:'학습 활동',     category:'activities' },

  ],
  admin: [
    // ── 핵심 5블록 (정책가의 질문 순서) ──
    { id:'a-home',       label:'한눈 현황',        icon:'fa-globe',                 group:'홈',             category:'home' },
    { id:'a-svc-ops',    label:'서비스 운영 진단',  icon:'fa-gauge-high',            group:'거시 분석',       category:'analytics' },
    { id:'a-macro',      label:'거시 비교',        icon:'fa-layer-group',           group:'거시 분석',       category:'analytics' },
    { id:'a-cross',      label:'활동×성취 교차',    icon:'fa-arrows-to-dot',         group:'거시 분석',       category:'analytics' },
    { id:'a-time',       label:'학습시간 분석',     icon:'fa-clock',                 group:'거시 분석',       category:'analytics' },
    // ── 보조 (고급/운영) ──
    { id:'a-xapi',       label:'표준체계 분석',    icon:'fa-diagram-project',       group:'보조 분석',       category:'operations' },
    { id:'a-teacher-idx',label:'교사 실행지수',    icon:'fa-chalkboard-teacher',    group:'보조 분석',       category:'operations' },
    { id:'a-quality',    label:'데이터 품질',      icon:'fa-shield-halved',         group:'보조 분석',       category:'operations' },
    { id:'a-export',     label:'내보내기',        icon:'fa-download',              group:'리포트',         category:'reports' },
  ]
};

/* ---- 카테고리 → 기본 뷰 (role별 첫 항목) ---- */
function defaultViewForCategory(role, cat){
  const items = MENUS[role] || [];
  const found = items.find(it => it.category === cat);
  return found ? found.id : null;
}

/* ---- 뷰 → 카테고리 ---- */
function categoryForView(role, viewId){
  const items = MENUS[role] || [];
  const found = items.find(it => it.id === viewId);
  return found ? found.category : null;
}

/* ---- 상단 2차메뉴 라벨 (브레드크럼 & 배너용) ---- */
const MENU_LABELS = {
  home:'홈', analytics:'현황 분석', activities:'학습 활동', operations:'운영', reports:'리포트'
};

/* ---- common-nav ?menu=<category> → 역할별 카테고리 기본 뷰 매핑 ---- */
const MENU_TO_VIEW = {
  home:       { student:'s-home',    teacher:'t-home',    admin:'a-home' },
  analytics:  { student:'s-achieve', teacher:'t-warnings', admin:'a-svc-ops' },
  activities: { student:'s-perform', teacher:'t-perform', admin:'a-svc-ops' },
  operations: { student:null,        teacher:'t-teacher-idx', admin:'a-xapi' },
  reports:    { student:null,        teacher:null,        admin:'a-export' },
};

/* ---- 레거시 URL 호환: 구 뷰 키 또는 뷰 id → 카테고리 ---- */
const LEGACY_MENU_TO_CATEGORY = {
  usage:'analytics', achieve:'analytics', perform:'activities', custom:'activities',
  daily:'analytics', teacher:'operations', quality:'operations',
  // 구 뷰 id도 수용
  's-home':'home','s-trend':'analytics','s-achieve':'analytics','s-compare':'analytics','s-xapi':'analytics','t-xapi':'analytics','a-xapi':'analytics',
  's-perform':'activities','s-custom':'activities','s-daily':'analytics',
  't-home':'home','t-usage':'analytics','t-subject':'analytics',
  't-perform':'activities','t-custom':'activities','t-daily':'activities',
  't-warnings':'analytics','t-drill':'activities','t-teacher-idx':'operations',
  // 신규 5블록
  'a-home':'home','a-svc-ops':'analytics','a-macro':'analytics','a-cross':'analytics','a-time':'analytics',
  'a-xapi':'operations','a-teacher-idx':'operations','a-quality':'operations','a-export':'reports',
  // 폐기/통합된 구 뷰 id → 신규 블록 카테고리로 호환 리다이렉트
  'a-usage':'analytics','a-achieve':'analytics','a-overview':'analytics',
  'a-perform':'analytics','a-custom':'analytics','a-daily':'analytics',
  'a-warnings':'analytics','a-drill':'analytics','a-compare':'analytics',
};

/* ---- view id → ?menu= 역매핑 (카테고리 기반) ---- */
function viewToMenu(viewId){
  // 1순위: MENUS에서 해당 view의 category 사용
  const cat = categoryForView(state.role, viewId);
  if (cat) return cat;
  // 2순위: 다른 역할의 MENUS 탐색 (역할 스위칭 중간 상태 방어)
  for (const role of Object.keys(MENUS)){
    const found = MENUS[role].find(it => it.id === viewId);
    if (found) return found.category;
  }
  // 3순위: 레거시 매핑
  return LEGACY_MENU_TO_CATEGORY[viewId] || null;
}

/* ---- API 헬퍼 ---- */
function rangeQS(extra, path){
  const params = new URLSearchParams();
  if (state.period === 'custom') {
    if (state.from) params.set('from', state.from);
    if (state.to)   params.set('to',   state.to);
  } else {
    params.set('period', state.period);
  }
  // scope 자동 부착: stats/*, dashboard, warnings/*
  if (path === undefined || _shouldAttachScope(path)){
    const sc = state.scope || computeScope();
    if (sc) params.set('scope', sc);
  }
  // realOnly 자동 부착: 관리자 + stats 계열일 때만 (시드 포함=0 / 실데이터만=1)
  if (state.role === 'admin' && state.realOnly && (path === undefined || _shouldAttachScope(path))){
    params.set('realOnly', '1');
  }
  if (extra) Object.entries(extra).forEach(([k,v])=>{ if(v!=null) params.set(k,v); });
  const qs = params.toString();
  return qs ? '?' + qs : '';
}

async function apiGet(path, extra){
  try {
    const r = await fetch(path + rangeQS(extra, path), { credentials:'include' });
    if (!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch (e) {
    console.warn('[LRS] API 실패', path, e.message);
    return null;
  }
}

/* ---- 상태 패널 ---- */
function tplLoading(n=3){
  let skeletons = '';
  for (let i=0;i<n;i++) skeletons += '<div class="dc-skeleton dc-skeleton-row" style="height:80px;margin-bottom:12px;"></div>';
  return `<div role="status" aria-label="데이터 로딩 중">${skeletons}</div>`;
}
function tplEmpty(msg, cta){
  return `<div class="dc-state-panel" role="status">
    <i class="fas fa-inbox" aria-hidden="true"></i>
    <p>${escapeHtml(msg || '아직 데이터가 없어요')}</p>
    ${cta ? `<a class="btn" href="${escapeAttr(cta.href)}">${escapeHtml(cta.label)}</a>` : ''}
  </div>`;
}
function tplError(msg, onRetry){
  const id = 'retry_'+Math.random().toString(36).slice(2,8);
  setTimeout(()=>{ const b=document.getElementById(id); if(b) b.onclick=onRetry; },0);
  return `<div class="dc-state-panel" role="alert">
    <i class="fas fa-triangle-exclamation" aria-hidden="true" style="color:var(--lrs-danger);"></i>
    <p>${escapeHtml(msg || '데이터를 불러오지 못했습니다')}</p>
    <button id="${id}" class="btn" type="button">다시 시도</button>
  </div>`;
}

/* ---- 차트 라이프사이클 ---- */
function destroyCharts(){
  state.charts.forEach(c=>{ try{c.destroy();}catch(_){} }); state.charts = [];
  // 성취 다이버징 차트(별도 추적)·히트맵 툴팁 정리
  try { if (window.LRS && LRS._divergeChart){ LRS._divergeChart.destroy(); LRS._divergeChart = null; } } catch(_){}
  try { const t = document.getElementById('masteryTooltip'); if (t){ t.style.display='none'; } } catch(_){}

/* CSS 변수 → 실제 색 해석 (Chart.js는 var(--..) 문자열을 인식 못함) */
const CHART_FALLBACK = ['#2563eb','#10b981','#f59e0b','#ef4444','#8b5cf6','#06b6d4','#ec4899','#14b8a6','#f97316','#6366f1'];
function _resolveCssVar(str){
  if (typeof str !== 'string') return str;
  const m = str.match(/^\s*var\(\s*(--[\w-]+)\s*(?:,\s*([^)]+))?\)\s*$/);
  if (!m) return str;
  try {
    const v = getComputedStyle(document.documentElement).getPropertyValue(m[1]).trim();
    if (v) return v;
  } catch(_){}
  return m[2] ? m[2].trim() : str;
}
function _resolveColorField(val, idx){
  if (Array.isArray(val)) return val.map((v,i)=> _resolveColorField(v, i));
  const r = _resolveCssVar(val);
  if (typeof r === 'string' && /^\s*var\(/.test(r)) return CHART_FALLBACK[(idx||0) % CHART_FALLBACK.length];
  return r;
}
function _resolveDatasetColors(data){
  if (!data || !Array.isArray(data.datasets)) return data;
  data.datasets.forEach((ds, i)=>{
    ['backgroundColor','borderColor','hoverBackgroundColor','hoverBorderColor','pointBackgroundColor','pointBorderColor'].forEach(k=>{
      if (ds[k] !== undefined) ds[k] = _resolveColorField(ds[k], i);
    });
  });
  return data;
}

/* ---- 라벨 후보 키 헬퍼 (API 응답 필드명 다양성에 방어) ---- */
function pickLabel(row, keys, fallback){
  if (!row) return fallback || '(미분류)';
  for (const k of keys){
    if (row[k] != null && String(row[k]).trim() !== '') return String(row[k]);
  }
  return fallback || '(미분류)';
}

function mkChart(canvas, type, data, opts){

/* ---- 도넛 중앙 텍스트(.donut-center) 정렬 플러그인 ----
   범례가 오른쪽(position:'right')이면 도넛이 캔버스 왼쪽으로 치우쳐 그려지는데,
   .donut-center 는 wrap 전체폭 기준이라 텍스트가 도넛 구멍에서 어긋난다.
   afterDraw 에서 오버레이를 실제 도넛 그리기영역(chartArea)에 맞춰 재배치 → 범례 위치 무관하게 항상 중앙. */
const donutCenterAlignPlugin = {
  id: 'donutCenterAlign',
  afterDraw(chart){
    try{
      const cv = chart.canvas;
      const wrap = cv && cv.closest ? cv.closest('.donut-wrap') : null;
      if (!wrap) return;
      const overlay = wrap.querySelector('.donut-center');
      const ca = chart.chartArea;
      if (!overlay || !ca) return;
      overlay.style.inset  = 'auto';
      overlay.style.left   = (cv.offsetLeft + ca.left) + 'px';
      overlay.style.top    = (cv.offsetTop  + ca.top)  + 'px';
      overlay.style.width  = (ca.right  - ca.left) + 'px';
      overlay.style.height = (ca.bottom - ca.top)  + 'px';
    } catch(_){ /* 오버레이 없으면 무시 */ }
  }
};
if (window.Chart && Chart.register) { try { Chart.register(donutCenterAlignPlugin); } catch(_){} }

/* =====================================================================
 * dc-data-table 구현 (P1-U-01)
 * ===================================================================== */
function renderDataTable(container, config){
  if (!container) return;
  const cols = (config && config.columns) || [];
  const rows = (config && config.rows) || [];
  const sortKey = (config && config.initialSort) || null;
  const sortDir = (config && config.initialDir) || 'asc';

  const state = { sortKey, sortDir, rows: rows.slice() };

  function applySort(){
    if (!state.sortKey) return;
    const dir = state.sortDir === 'asc' ? 1 : -1;
    state.rows.sort((a,b)=>{
      const va = a[state.sortKey], vb = b[state.sortKey];
      if (va == null && vb == null) return 0;
      if (va == null) return 1;
      if (vb == null) return -1;
      if (typeof va === 'number' && typeof vb === 'number') return (va-vb)*dir;
      return String(va).localeCompare(String(vb), 'ko') * dir;
    });
  }

  function draw(){
    applySort();
    const thead = cols.map(c => {
      const cls = ['sortable'];
      if (c.align === 'right') cls.push('num');      // 헤더도 값(td.num)과 같은 우측정렬로 맞춤
      if (c.align === 'center') cls.push('center');
      if (state.sortKey === c.key) cls.push(state.sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc');
      return `<th class="${cls.join(' ')}" data-key="${escapeAttr(c.key)}">${escapeHtml(c.label)}</th>`;
    }).join('');
    const tbody = state.rows.map((row, idx) => {
      const tds = cols.map(c => {
        const raw = row[c.key];
        let cell;
        if (typeof c.format === 'function'){
          // format() may return HTML; caller is responsible for escaping
          cell = c.format(raw, row);
        } else {
          cell = escapeHtml(raw == null ? '-' : raw);
        }
        const align = c.align === 'right' ? ' class="num"' : '';
        return `<td${align}>${cell}</td>`;
      }).join('');
      const rowId = row.user_id || row.id || idx;
      return `<tr data-row-id="${escapeAttr(rowId)}" data-row-idx="${idx}">${tds}</tr>`;
    }).join('');

    container.innerHTML = `<div class="dc-data-table-wrap"><table class="dc-data-table">
      <thead><tr>${thead}</tr></thead>
      <tbody>${tbody || `<tr><td colspan="${cols.length}" style="padding:24px;text-align:center;color:var(--gray-500);">표시할 데이터가 없습니다</td></tr>`}</tbody>
    </table></div>`;

    container.querySelectorAll('thead th.sortable').forEach(th => {
      th.addEventListener('click', () => {
        const key = th.getAttribute('data-key');
        if (state.sortKey === key) state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        else { state.sortKey = key; state.sortDir = 'asc'; }
        draw();
      });
    });
    if (typeof config.onRowClick === 'function'){
      container.querySelectorAll('tbody tr[data-row-id]').forEach(tr => {
        tr.addEventListener('click', () => {
          const idx = parseInt(tr.getAttribute('data-row-idx'),10);
          config.onRowClick(state.rows[idx]);
        });
      });
    }
  }
  draw();
}

/* =====================================================================
 * dc-heatmap 구현 (요일×시간 7x24)
 * ===================================================================== */
function renderHeatmap(container, dailyRows){
  if (!container) return;
  const matrix = Array.from({length:7}, () => Array(24).fill(0));
  (dailyRows||[]).forEach(r => {
    const d = r.date ? new Date(r.date) : null;
    if (!d || isNaN(d)) return;
    const dow = d.getDay();
    const hour = r.hour != null ? r.hour : (d.getHours());
    const v = r.count || r.total_count || Math.round((r.total_duration||0)/60) || 0;
    matrix[dow][hour] += v;
  });
  let maxV = 0;
  matrix.forEach(row => row.forEach(v => { if (v>maxV) maxV = v; }));
  function bucket(v){
    if (!maxV || v<=0) return 0;
    const r = v/maxV;
    if (r>.75) return 4;
    if (r>.5)  return 3;
    if (r>.25) return 2;
    if (r>0)   return 1;
    return 0;
  }
  const dows = ['일','월','화','수','목','금','토'];
  const ylabels = dows.map(d => `<div>${d}</div>`).join('');
  const cells = matrix.map((row, di) =>
    row.map((v, hi) => `<div class="cell heat-${bucket(v)}" data-h="${bucket(v)}" title="${dows[di]} ${hi}시: ${v}" aria-label="${dows[di]}요일 ${hi}시 활동 ${v}">${v>0?v:''}</div>`).join('')
  ).join('');
  const xlabels = Array.from({length:24}, (_,i) => `<div>${i%3===0?i:''}</div>`).join('');
  container.innerHTML = `
    <div class="dc-heatmap-wrap">
      <div class="hm-ylabels" style="grid-template-rows:repeat(7,1fr);">${ylabels}</div>
      <div class="dc-heatmap" style="grid-template-columns:repeat(24,1fr);">${cells}</div>
      <div></div>
      <div class="hm-xlabels">${xlabels}</div>
    </div>`;
}

/* =====================================================================
 * dc-gauge 구현 (반원 SVG)
 * ===================================================================== */
function renderGauge(container, current, target, label){
  if (!container) return;
  const pct = target>0 ? Math.min(100, Math.round((current/target)*100)) : 0;
  const cx=80, cy=80, r=64;
  const startA = Math.PI, endA = startA + (pct/100)*Math.PI;
  function pt(a){ return [cx + r*Math.cos(a), cy + r*Math.sin(a)]; }
  const [sx,sy] = pt(startA);
  const [ex,ey] = pt(endA);
  const large = (endA-startA) > Math.PI ? 1 : 0;
  const arcBg = `M ${cx-r} ${cy} A ${r} ${r} 0 0 1 ${cx+r} ${cy}`;
  const arcFg = pct>0 ? `M ${sx} ${sy} A ${r} ${r} 0 ${large} 1 ${ex} ${ey}` : '';
  container.innerHTML = `
    <div class="gauge-label">${escapeHtml(label||'')}</div>
    <svg viewBox="0 0 160 96" aria-label="${escapeAttr((label||'')+' '+pct+'%')}">
      <path d="${arcBg}" stroke="var(--gray-200)" stroke-width="14" fill="none" stroke-linecap="round"/>
      ${arcFg?`<path d="${arcFg}" stroke="var(--lrs-primary)" stroke-width="14" fill="none" stroke-linecap="round"/>`:''}
    </svg>
    <div class="gauge-value">${pct}%</div>`;
}

/* =====================================================================
 * dc-sparkline 구현 (SVG polyline, 7일)
 * ===================================================================== */
function renderSparkline(container, values, opts){
  if (!container) return;
  const vals = (values||[]).map(v => Number(v)||0);
  if (!vals.length) { container.innerHTML = ''; return; }
  const W=80, H=28, P=2;
  const max = Math.max.apply(null, vals), min = Math.min.apply(null, vals);
  const range = (max-min) || 1;
  const step = vals.length>1 ? (W-P*2)/(vals.length-1) : 0;
  const pts = vals.map((v,i)=> {
    const x = P + i*step;
    const y = H - P - ((v-min)/range)*(H-P*2);
    return x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
  const color = (opts&&opts.color) || 'var(--lrs-primary)';
  container.innerHTML = `<svg class="dc-sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline fill="none" stroke="${color}" stroke-width="1.5" points="${pts}"/>
  </svg>`;
}

const MASTERY_HEX = {

/* =====================================================================
 * 분석·예측 강화(P0) 공통 헬퍼 — 위험톤·추세·예상밴드·신뢰·스파크라인
 *   기획서: 작업지시서/LRS_분석예측_P0_시각스펙.md §1·§2·§4·§5
 *   ★ BE grade/conf 값: high/medium/low → CSS data 속성은 high/mid/low 로 매핑.
 *   ★ 위험은 면적 채움이 아니라 테두리+아이콘+배지. 추세 하락은 주황(#ea7317, 빨강 금지).
 * ===================================================================== */
/* BE의 medium → CSS mid (high/low는 그대로). 위험 등급·신뢰 공통. */
function gradeKey(g){ return g === 'medium' ? 'mid' : (g === 'high' || g === 'low' ? g : 'mid'); }
/* 신뢰 라벨(KO) — BE confidenceKo 우선, 없으면 매핑 */
const CONF_KO_MAP = { high:'높음', medium:'보통', mid:'보통', low:'낮음' };
function confLabelKo(conf, confKo){ return confKo || CONF_KO_MAP[conf] || '낮음'; }

/* 신뢰 배지(우상단 일관 배치). observed/표본 hover 단서. (학생 화면엔 사용 금지) */
function confBadge(conf, confKo, hint){
  const k = gradeKey(conf);
  const label = confLabelKo(conf, confKo);
  const title = hint ? escapeAttr(hint) : '';
  return `<span class="conf-badge" data-conf="${k}" title="${title}"><span class="conf-dot"></span>신뢰 ${escapeHtml(label)}</span>`;
}

/* 예측 한계 1줄 고지(예측 섹션 하단 의무) */
function projDisclaimer(text){
  return `<p class="proj-disclaimer"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(text || '이 추정은 규칙 기반이며 실제와 다를 수 있어요.')}</p>`;
}

/* 추세 방향(up/flat/down) → 아이콘 클래스 */
const TREND_ICON = { up:'fa-arrow-trend-up', flat:'fa-arrow-right-long', down:'fa-arrow-trend-down' };
function normTrendDir(dir){
  if (dir === 'up' || dir === 'rising') return 'up';
  if (dir === 'down' || dir === 'falling' || dir === 'declining') return 'down';
  if (dir === 'flat' || dir === 'stable') return 'flat';
  return 'flat';
}
/* 추세 화살표(색·기호·기울기). slope 단위 %p/주. */
function trendArrow(dir, slope, hint){
  const d = normTrendDir(dir);
  const icon = TREND_ICON[d] || TREND_ICON.flat;
  let txt;
  if (d === 'flat' || slope == null) txt = '정체';
  else txt = (slope > 0 ? '+' : '') + slope + '%p/주';
  const title = hint ? ` title="${escapeAttr(hint)}"` : '';
  return `<span class="trend-arrow" data-trend="${d}"${title}><i class="fas ${icon}" aria-hidden="true"></i> ${escapeHtml(txt)}</span>`;
}

/* 인라인 SVG 스파크라인 — 120×32, 0~100 고정 스케일(행간 비교 일관).
 *   pts: 정답률 배열(% 또는 null). 결측주는 보간(선 안 끊김), 점은 안 찍음.
 *   trend: up/flat/down 색. 마지막 점 강조. (Chart.js 인스턴스 N개 회피) */
function sparklineSvg(pts, trend, opts){
  const W = 120, H = 32, P = 4;
  const innerW = W - P*2, innerH = H - P*2;
  const series = (pts || []).map(v => (v == null ? null : Number(v)));
  const valid = series.filter(v => v != null);
  if (valid.length < 2) return `<span class="trend-note">추세 데이터 부족</span>`;
  const d = normTrendDir(trend);
  const n = series.length;
  const xAt = i => P + (n === 1 ? innerW/2 : (i/(n-1))*innerW);
  const yAt = v => P + innerH - (Math.max(0, Math.min(100, v))/100)*innerH; // 0~100 고정
  // 결측 보간: 선형 채움(앞/뒤 유효값 사이)
  const filled = series.slice();
  for (let i=0;i<n;i++){
    if (filled[i] != null) continue;
    let a=i-1; while(a>=0 && filled[a]==null) a--;
    let b=i+1; while(b<n && series[b]==null) b++;
    if (a>=0 && b<n && series[b]!=null){ const t=(i-a)/(b-a); filled[i]=series[a]+(series[b]-series[a])*t; }
    else if (a>=0) filled[i]=filled[a];
    else if (b<n) filled[i]=series[b];
  }
  const linePts = filled.map((v,i)=> `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  // 영역 폴리곤(라인 → 하단 baseline)
  const areaPts = `${P},${(H-P).toFixed(1)} ` + linePts + ` ${(W-P)},${(H-P).toFixed(1)}`;
  const lastI = n-1, lastV = filled[lastI];
  const cx = xAt(lastI).toFixed(1), cy = yAt(lastV).toFixed(1);
  const aria = (opts && opts.aria) ? escapeAttr(opts.aria) : '추세 스파크라인';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}" preserveAspectRatio="none">
    <polygon class="spark-area" data-trend="${d}" points="${areaPts}"></polygon>
    <polyline class="spark-line" data-trend="${d}" points="${linePts}"></polyline>
    <circle class="spark-dot" data-trend="${d}" cx="${cx}" cy="${cy}" r="2.5"></circle>
  </svg>`;
}

/* 추세에서 행별 시계열(rate %) 추출. series가 없으면 OLS 기울기로 직선 합성(관측주차만큼). */
function trendSeriesPercents(trend){
  if (trend && Array.isArray(trend.series) && trend.series.length){
    return trend.series.map(s => (s.rate == null ? null : s.rate));
  }
  return null;
}
/* 학생 행: 관측주차·기울기·현재율로 추세 직선 합성(스파크라인용, series 미제공 시) */
function synthLineFromSlope(currentRate, slope, observedWeeks){
  const n = Math.max(2, Math.min(8, observedWeeks || 0));
  if (currentRate == null || slope == null) return null;
  const arr = [];
  for (let i=0;i<n;i++){
    const back = (n-1) - i;            // 마지막이 현재
    const v = currentRate - slope*back; // 과거로 갈수록 slope만큼 역산
    arr.push(Math.max(0, Math.min(100, Math.round(v*10)/10)));
  }
  return arr;
}

/* 예상 밴드(3-dataset) — 실측선 + 점선 외삽 중심선 + 밴드(상/하단 채움).
 *   trend.series(과거) + projection(외삽). 목표선·"지금" 분기선은 호출부에서 옵션. */
function buildProjChartData(trend, projection, opts){
  opts = opts || {};
  const past = (trend && Array.isArray(trend.series)) ? trend.series : [];
  const pastLabels = past.map(s => s.week || '');
  const pastVals = past.map(s => (s.rate == null ? null : s.rate));
  const r0 = (trend && trend.currentRate != null) ? trend.currentRate : (pastVals.length ? pastVals[pastVals.length-1] : null);

  // 외삽 구간 길이: weeksToReach(≤12) 또는 8주
  const reachable = projection && projection.reachable && projection.weeksToReach;
  const wk = reachable ? Math.min(12, projection.weeksToReach) : 8;
  const slope = (projection && projection.slope != null) ? projection.slope : (trend && trend.slope) || 0;
  const projLabels = [];
  for (let i=1;i<=wk;i++) projLabels.push('+' + i + '주');

  const nPast = pastLabels.length;
  const labels = pastLabels.concat(projLabels);

  // 실측선: 과거 구간만 값, 외삽 구간 null
  const dsActual = {
    label:'지금까지', data: pastVals.concat(Array(wk).fill(null)),
    borderColor:'var(--proj-line)', backgroundColor:'var(--proj-line)',
    borderWidth:2.5, tension:.2, pointRadius:3, spanGaps:false, fill:false, order:1
  };
  // 외삽 중심선(점선): 마지막 실측점에서 이어지게 (경계점 공유)
  const projLine = Array(nPast).fill(null);
  if (nPast) projLine[nPast-1] = r0;
  let lo = Array(nPast).fill(null), hi = Array(nPast).fill(null);
  const bandW = Math.max(8, Math.abs(slope)*2);
  if (nPast){ lo[nPast-1] = r0; hi[nPast-1] = r0; }
  for (let i=1;i<=wk;i++){
    const v = Math.max(0, Math.min(100, r0 + slope*i));
    projLine.push(Math.round(v*10)/10);
    lo.push(Math.round(Math.max(0, v - bandW)*10)/10);
    hi.push(Math.round(Math.min(100, v + bandW)*10)/10);
  }
  const dsProj = {
    label:'예상(추정)', data: projLine,
    borderColor:'var(--proj-line)', backgroundColor:'var(--proj-line)',
    borderWidth:2, borderDash:[6,4], tension:.1,
    pointRadius:(ctx)=> ctx.dataIndex === labels.length-1 ? 6 : 0,
    pointBackgroundColor:'var(--proj-line)', spanGaps:true, fill:false, order:2
  };
  // 밴드: hi(상단) fill '+1'(아래=lo dataset)까지 채움
  const dsHi = {
    label:'예상 상단', data: hi, borderColor:'var(--proj-band-stroke)', borderWidth:1, borderDash:[2,3],
    pointRadius:0, tension:.1, fill:'+1', backgroundColor:'var(--proj-band)', spanGaps:true, order:4
  };
  const dsLo = {
    label:'예상 하단', data: lo, borderColor:'var(--proj-band-stroke)', borderWidth:1, borderDash:[2,3],
    pointRadius:0, tension:.1, fill:false, spanGaps:true, order:5
  };
  // 목표선
  const datasets = [dsHi, dsLo, dsActual, dsProj];
  if (opts.target != null){
    datasets.push({ label:'목표 ' + opts.target + '%', data: labels.map(()=> opts.target),
      borderColor:'#9ca3af', borderWidth:1.5, borderDash:[4,4], pointRadius:0, tension:0, fill:false, order:6 });
  }
  return { labels, datasets, boundaryIndex: nPast-1 };
}

      { label:'과제', data:(trend||[]).map(t => t.homework_cnt||0), borderColor:'#2563eb', backgroundColor:'#2563eb', tension:0.3 },
      { label:'자기주도', data:(trend||[]).map(t => t.self_cnt||0), borderColor:'#10b981', backgroundColor:'#10b981', tension:0.3 },
      { label:'콘텐츠 학습', data:(trend||[]).map(t => t.content_cnt||0), borderColor:'#8b5cf6', backgroundColor:'#8b5cf6', tension:0.3 }

/* =====================================================================
 * 관리자 분석 헬퍼 (집계·분포 전용, 개인식별 금지)
 * ===================================================================== */
// URL test-hook: ?aIdxN=1234 등으로 게이트 경계값 수동 주입
function _adminTestHook(key){
  try { const v = new URLSearchParams(location.search).get(key); return v==null? null : v; } catch(_){ return null; }
}

// 최소표본 가드: n<threshold → 차단 패널 렌더하고 false 반환
function _minSampleGuard(root, n, threshold, label){
  if (Number(n) >= Number(threshold)) return true;
  root.innerHTML = `<div class="dc-state-panel" role="status" style="border-left:4px solid #64748b;background:#f1f5f9;">
    <i class="fas fa-lock" aria-hidden="true" style="color:#64748b;">🔒</i>
    <p><strong>표본 부족 — 개인 식별 방지</strong></p>
    <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.6;">
      ${escapeHtml(label||'선택한 범위')}의 표본 수가 ${n}건으로 최소 기준(${threshold}) 미만입니다.
      개인이 식별될 수 있어 결과를 표시하지 않습니다. 기간이나 범위를 더 넓게 선택하세요.
    </p>
  </div>`;
  return false;
}

// 행 단위 셀 마스킹: n<threshold 행의 민감 컬럼을 '***'로 치환 (원본 n/비율만 유지)
function _cellSuppress(rows, opts){
  opts = opts || {};
  const nKey = opts.nKey || 'n';
  const threshold = opts.threshold || 5;
  const maskKeys = opts.maskKeys || [];
  return rows.map(r => {
    if (Number(r[nKey]) < threshold) {
      const out = Object.assign({}, r, { _masked: true });
      maskKeys.forEach(k => { out[k] = '***'; });
      return out;
    }
    return r;
  });
}

// 퍼센타일 (0-100)
function _percentile(sorted, p){
  if (!sorted || !sorted.length) return 0;
  const idx = (sorted.length - 1) * (p/100);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi]-sorted[lo]) * (idx-lo);
}

// 시드드 PRNG (deterministic mock)
function _mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

// 정규분포 근사 (Box-Muller)
function _gaussian(rng, mean, sd){
  const u = Math.max(1e-9, rng()), v = Math.max(1e-9, rng());
  return mean + sd * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

/* ---- 충북 스케일 상수 ---- */
const CB_REGIONS = ['청주교육지원청','충주교육지원청','제천교육지원청','보은교육지원청','옥천교육지원청','영동교육지원청','증평교육지원청','진천교육지원청','괴산교육지원청','음성교육지원청','단양교육지원청'];
const CB_SCHOOL_LEVELS = ['초등학교','중학교','고등학교'];

/* ---- Mock 교사 분포 (충북 ≈ 11,000명) ---- */
// Phase 2: /api/stats/teacher-index-dist?level=&region=&period= 연결 예정
function _mockTeacherIdxDist(filters){
  const n = Number(_adminTestHook('aIdxN')) || 11042;
  const rng = _mulberry32(20260422 + (filters.level==='초등학교'?1:filters.level==='중학교'?2:filters.level==='고등학교'?3:0));
  const scores = [];
  for (let i=0;i<n;i++){
    let v = _gaussian(rng, 62, 14);
    if (v<0) v=0; if (v>100) v=100;
    scores.push(Math.round(v*10)/10);
  }
  scores.sort((a,b)=>a-b);
  // 학교급별 교사분포
  const byLevel = {};
  CB_SCHOOL_LEVELS.forEach((lv,idx)=>{
    const cnt = Math.round(n * [0.55,0.28,0.17][idx]);
    const arr = [];
    const rng2 = _mulberry32(99 + idx*17);
    for (let i=0;i<cnt;i++){
      let v = _gaussian(rng2, 60+idx*3, 13);
      if (v<0) v=0; if (v>100) v=100;
      arr.push(v);
    }
    arr.sort((a,b)=>a-b);
    byLevel[lv] = arr;
  });
  return { n, scores, byLevel };
}

VIEWS['a-teacher-idx'] = async function(root){
  root.innerHTML = tplLoading(3);

  // 필터 상태 보관
  state._aIdxLevel  = state._aIdxLevel  || '';
  state._aIdxRegion = state._aIdxRegion || '';

  // 실 API 우선, n<10이면 mock fallback (프로토타입 단계 데모용)
  let dist = null;
  try {
    const qs = new URLSearchParams();
    if (state._aIdxLevel) qs.set('level', state._aIdxLevel);
    if (state._aIdxRegion) qs.set('region', state._aIdxRegion);
    const r = await fetch('/api/lrs/stats/teacher-index-dist?' + qs.toString(), { credentials:'include' });
    if (r.ok) {
      const d = await r.json();
      if (d && d.success && d.n >= 10) dist = { n:d.n, scores:d.scores, byLevel:d.byLevel };
    }
  } catch(_){}
  if (!dist) dist = _mockTeacherIdxDist({ level: state._aIdxLevel, region: state._aIdxRegion });
  const n = dist.n;

  // 필터 UI(셀렉트)
  const filterBar = `
    <section class="dc-filter-bar" aria-label="교사 분포 필터" style="margin-bottom:12px;">
      <label>학교급
        <select id="aIdxLevel">
          <option value="">전체</option>
          ${CB_SCHOOL_LEVELS.map(l=>`<option value="${escapeAttr(l)}" ${state._aIdxLevel===l?'selected':''}>${escapeHtml(l)}</option>`).join('')}
        </select>
      </label>
      <label style="margin-left:12px;">지역
        <select id="aIdxRegion">
          <option value="">전체</option>
          ${CB_REGIONS.map(r=>`<option value="${escapeAttr(r)}" ${state._aIdxRegion===r?'selected':''}>${escapeHtml(r)}</option>`).join('')}
        </select>
      </label>
    </section>`;

  root.innerHTML = filterBar + '<div id="aIdxBody"></div>';
  document.getElementById('aIdxLevel').onchange = e => { state._aIdxLevel = e.target.value; VIEWS['a-teacher-idx'](root); };
  document.getElementById('aIdxRegion').onchange = e => { state._aIdxRegion = e.target.value; VIEWS['a-teacher-idx'](root); };

  const body = document.getElementById('aIdxBody');
  if (!_minSampleGuard(body, n, 10, '교사 분포')) return;

  // 퍼센타일
  const scores = dist.scores;
  const p10 = _percentile(scores,10), p25 = _percentile(scores,25),
        p50 = _percentile(scores,50), p75 = _percentile(scores,75),
        p90 = _percentile(scores,90), p95 = _percentile(scores,95);
  const mean = scores.reduce((s,v)=>s+v,0)/scores.length;

  // 히스토그램 빈(10개, 빈당 n≥10 보장용 기본 width=10)
  const binWidth = 10;
  const bins = Array.from({length:10}, (_,i)=>({ lo:i*10, hi:(i+1)*10, count:0 }));
  scores.forEach(v=>{
    const i = Math.min(9, Math.floor(v/binWidth));
    bins[i].count += 1;
  });
  // 빈당 n<10이면 마스킹
  const histLabels = bins.map(b => `${b.lo}-${b.hi}`);
  const histData   = bins.map(b => b.count>=10 ? b.count : 0);
  const maskedBins = bins.filter(b => b.count>0 && b.count<10).length;

  // 학교급별 박스플롯 데이터 (min/p25/p50/p75/max), 학교별 n<5 마스킹 (여기서는 학교급 셀)
  const boxData = CB_SCHOOL_LEVELS.map(lv => {
    const arr = dist.byLevel[lv];
    if (!arr || arr.length < 5) return { lv, masked:true };
    return {
      lv,
      min: arr[0],
      p25: _percentile(arr,25),
      p50: _percentile(arr,50),
      p75: _percentile(arr,75),
      max: arr[arr.length-1],
      n: arr.length
    };
  });

  body.innerHTML = `
    <section class="dc-kpi-grid">
      ${kpiCard('교사 n',      n.toLocaleString(),        '명', {dir:'flat',text:'집계 대상'},   'primary')}
      ${kpiCard('중위값 p50',  p50.toFixed(1),            '점', {dir:'flat',text:'분포 중심'},   'primary')}
      ${kpiCard('상위 p90',    p90.toFixed(1),            '점', {dir:'flat',text:'상위 10%'},    'success')}
      ${kpiCard('평균',        mean.toFixed(1),           '점', {dir:'flat',text:`p10=${p10.toFixed(1)} · p95=${p95.toFixed(1)}`}, 'warning')}
    </section>
    <section class="dc-chart-grid">
      ${chartWrap('aIdxHist','실행지수 분포 (히스토그램)',`빈 폭 ${binWidth}점 · p10/p50/p90 기준선`,`중위값 ${p50.toFixed(1)}점, 상위 10% 기준 ${p90.toFixed(1)}점`)}
      ${chartWrap('aIdxBox','학교급별 박스플롯','p25·중위·p75 구간 (학교별 교사<5 셀은 마스킹)')}
    </section>
    ${maskedBins>0? `<p style="font-size:var(--fs-sm);color:var(--gray-600);margin-top:8px;">🔒 빈당 교사<10인 구간 ${maskedBins}개는 개인 식별 방지를 위해 숨겼습니다.</p>`:''}
    <section class="dc-state-panel" role="status" style="margin-top:12px;background:#eff6ff;border-left:4px solid #2563eb;">
      <p style="font-size:var(--fs-sm);color:var(--gray-700);line-height:1.6;">
        본 화면은 <strong>집계·분포</strong>만 제공합니다. 개별 교사 식별·랭킹·Top-K 표는 제공하지 않습니다 (개인정보 보호).
      </p>
    </section>`;

  // 히스토그램 + 기준선
  const lineAt = (val, color, label) => ({
    type:'line', xMin:val/binWidth - 0.5, xMax:val/binWidth - 0.5,
    borderColor:color, borderWidth:2, borderDash:[4,3], label:{display:true, content:label, color}
  });
  mkChart(document.getElementById('aIdxHist'),'bar',{
    labels: histLabels,
    datasets:[{ label:'교사 수', data: histData, backgroundColor:'#2563eb' }]
  }, {
    plugins:{ legend:{display:false},
      tooltip:{ callbacks:{ label:(ctx)=> `${ctx.parsed.y.toLocaleString()}명 (${bins[ctx.dataIndex].lo}-${bins[ctx.dataIndex].hi}점)` } } },
    scales:{ y:{ beginAtZero:true, title:{display:true,text:'교사 수'} }, x:{ title:{display:true,text:'실행지수 구간'} } }
  });

  // 박스플롯: Chart.js 기본만 사용 → floating bar (p25~p75) + p50 별도 점 datasets
  const labels = boxData.map(b=>b.lv);
  const boxes = boxData.map(b => b.masked ? [null,null] : [b.p25, b.p75]);
  const medians = boxData.map(b => b.masked ? null : b.p50);
  const mins = boxData.map(b => b.masked ? null : b.min);
  const maxs = boxData.map(b => b.masked ? null : b.max);
  mkChart(document.getElementById('aIdxBox'),'bar',{
    labels,
    datasets:[
      { label:'p25~p75', data: boxes, backgroundColor:'rgba(37,99,235,.35)', borderColor:'#2563eb', borderWidth:1, borderSkipped:false, barPercentage:.4 },
      { label:'중위(p50)', data: medians, type:'line', borderColor:'#ef4444', borderWidth:3, pointRadius:8, pointHoverRadius:9, pointBackgroundColor:'#ef4444', showLine:false },
      { label:'최소', data: mins, type:'line', borderColor:'#64748b', pointStyle:'triangle', pointRadius:6, showLine:false, backgroundColor:'#64748b' },
      { label:'최대', data: maxs, type:'line', borderColor:'#64748b', pointStyle:'rectRot', pointRadius:6, showLine:false, backgroundColor:'#64748b' }
    ]
  }, { indexAxis:'y', scales:{ x:{ min:0, max:100, title:{display:true,text:'실행지수'} } },
       plugins:{ tooltip:{ callbacks:{ label:(ctx)=> {
         const b = boxData[ctx.dataIndex]; if (b.masked) return '🔒 n<5 마스킹';
         return `${ctx.dataset.label}: ${Array.isArray(ctx.raw)? ctx.raw.join('–') : Number(ctx.raw).toFixed(1)}점 (n=${b.n})`;
       } } } } });
};

/* ---- daily-snapshot 공통 차트 ---- */
function _dailyHourChart(canvasId, today, yesterday){
  const labels = Array.from({length:24}, (_,h)=> h+'시');
  mkChart(document.getElementById(canvasId),'bar', {
    labels,
    datasets:[
      { label:'오늘', data:(today.byHour||[]).map(r=>r.count),       backgroundColor:'#2563eb' },
      { label:'어제', data:(yesterday.byHour||[]).map(r=>r.count),   backgroundColor:'#94a3b8' }
    ]
  });
}
function _deltaTrend(curr, prev){
  const diff = (curr||0) - (prev||0);
  return { dir: diff>0?'up':(diff<0?'down':'flat'), text: `어제 대비 ${diff>=0?'+':''}${diff}` };
}
