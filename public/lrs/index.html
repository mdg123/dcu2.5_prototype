      LRS.openDrilldown(cached);
    } else {
      LRS.teacherAction(action, studentId, code);
    }
  });
}

/* =====================================================================
 * 성취수준(P0) 공통 헬퍼 — 4상태 정규화·범례·도넛 중앙·플레이어 모달
 *   기획서: 작업지시서/LRS_성취수준_P0_시각스펙.md
 *   BE status: reached / partial / not_reached / insufficient
 *   → FE 정규화 키(CSS data-state·뱃지 클래스): reached / partial / notReached / insufficient
 * ===================================================================== */
const MASTERY_HEX = {
  reached:'#16a34a', partial:'#f59e0b', notReached:'#ef4444', insufficient:'#9ca3af',
};
const MASTERY_KO = { reached:'도달', partial:'부분 도달', notReached:'미도달', insufficient:'평가 부족' };

/* BE의 not_reached(snake) → FE notReached(camel) 정규화. 그 외는 그대로. */
function normStatus(s){
  if (s === 'not_reached' || s === 'notReached') return 'notReached';
  if (s === 'reached' || s === 'partial' || s === 'insufficient') return s;
  return 'insufficient';
}
function masteryKo(s){ return MASTERY_KO[normStatus(s)] || '평가 부족'; }

/* 이슈6: 위험학생 드로어 — 약점 교과·성취기준 (insights.weaknesses[]) HTML 생성.
 *   hero(최취약 1건) + 교과별 그룹(취약순). subject_label로 그룹핑, subject_label 우선 색 매핑. */
function _ewsWeakRank(w){
  const st = normStatus(w && w.status);
  return st === 'notReached' ? 0 : (st === 'partial' ? 1 : 2); // 미도달 < 부분 < 평가부족
}
function _ewsWeakSort(a, b){
  const r = _ewsWeakRank(a) - _ewsWeakRank(b);
  if (r !== 0) return r;
  const sa = (a && a.avg_score != null) ? a.avg_score : Infinity; // null은 뒤로
  const sb = (b && b.avg_score != null) ? b.avg_score : Infinity;
  return sa - sb;
}
function _ewsWeakHtml(weaknesses){
  const list = weaknesses.slice().sort(_ewsWeakSort);
  const w0 = list[0];
  const total = list.length;
  const rateHtml = (w) => (w.hasScore && w.avg_score != null && normStatus(w.status) !== 'insufficient')
    ? Math.round(w.avg_score) + '%' : '';
  // (B) hero — 최취약 1건
  const heroSubjCls = _subjectBadgeClass(w0.subject_label);
  const heroRate = (w0.hasScore && w0.avg_score != null)
    ? `<span class="ews-drw-hero__rate">정답률 ${Math.round(w0.avg_score)}%</span>` : '';
  const heroHtml = `
    <div class="ews-drw-hero">
      <div class="ews-drw-hero__cap"><i class="fas fa-flag" aria-hidden="true"></i> 이 학생이 특히 어려워하는 것</div>
      <div class="ews-drw-hero__body">
        <span class="dc-badge ${heroSubjCls}">${escapeHtml(w0.subject_label||'기타')}</span>
        <span class="ews-drw-hero__unit" title="${escapeAttr(w0.fullLabel||'')}">${escapeHtml(w0.label||w0.achievement_code||'-')}</span>
        <span class="mastery-badge ${normStatus(w0.status)}">${escapeHtml(w0.statusLabel||masteryKo(w0.status))}</span>
        ${heroRate}
      </div>
    </div>`;
  // (C) 교과별 그룹핑 — subject_label 키, 그룹 정렬은 대표(첫) 항목 취약순
  const groups = new Map();
  list.forEach(w => {
    const key = (w.subject_label && String(w.subject_label).trim()) || '기타';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(w);
  });
  const groupArr = [...groups.entries()].map(([subject, items]) => {
    items.sort(_ewsWeakSort);
    return { subject, items };
  }).sort((ga, gb) => _ewsWeakSort(ga.items[0], gb.items[0]));
  const groupsHtml = groupArr.map(({subject, items}) => {
    const subjCls = _subjectBadgeClass(subject);
    const itemsHtml = items.map(w => {
      const codeBare = String(w.achievement_code||'').replace(/^\[|\]$/g,'');
      const codeMeta = codeBare ? '['+escapeHtml(codeBare)+'] · ' : '';
      const r = rateHtml(w);
      return `<li class="ews-drw-item">
        <div class="ews-drw-item__top">
          <span class="ews-drw-item__unit" title="${escapeAttr(w.fullLabel||'')}">${escapeHtml(w.label||w.achievement_code||'-')}</span>
          <span class="mastery-badge ${normStatus(w.status)}">${escapeHtml(w.statusLabel||masteryKo(w.status))}</span>
          ${r ? `<span class="ews-drw-item__rate">${r}</span>` : ''}
        </div>
        <div class="ews-drw-item__meta">${codeMeta}${Number(w.attempt_count)||0}회 시도</div>
      </li>`;
    }).join('');
    return `<div class="ews-drw-grp">
      <div class="ews-drw-grp__head">
        <span class="dc-badge ${subjCls}">${escapeHtml(subject)}</span>
        <span class="ews-drw-grp__n">${items.length}개</span>
      </div>
      <ul class="ews-drw-items">${itemsHtml}</ul>
    </div>`;
  }).join('');
  return heroHtml + `
    <div class="ews-drw-sect">
      <div class="ews-drw-sect__title">부족한 교과·성취기준 <span class="ews-drw-sect__n">${total}개</span></div>
      ${groupsHtml}
    </div>`;
}

const MasteryPlayer = {
  open(title, url){
    if (!url){ alert('이 학습의 추천 콘텐츠를 준비 중이에요.'); return; }
    const modal = document.getElementById('masteryPlayer');
    const frame = document.getElementById('masteryPlayerFrame');

    frame.src = url;
    modal.setAttribute('data-open','true');
    document.body.style.overflow = 'hidden';
  },
  close(){
    const modal = document.getElementById('masteryPlayer');
    const frame = document.getElementById('masteryPlayerFrame');
    modal.setAttribute('data-open','false');
    frame.src = 'about:blank';            // 재생 중지 (빈문자열은 현재 페이지 재로드 → about:blank로 완전 비움)
    document.body.style.overflow = '';
  }
};
(function bindPlayerModal(){
  function bind(){
    const modal = document.getElementById('masteryPlayer');
    const closeBtn = document.getElementById('masteryPlayerClose');
    if (closeBtn) closeBtn.addEventListener('click', () => MasteryPlayer.close());
    if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) MasteryPlayer.close(); });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal && modal.getAttribute('data-open') === 'true') MasteryPlayer.close();
    });
  }
  // 스크립트가 body 끝에서 실행되므로 DOM은 이미 준비됨 — 즉시 바인딩(폴백: DOMContentLoaded)
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();

/* ── 히트맵 커스텀 툴팁 ── */
const MasteryTip = {
  el(){ return document.getElementById('masteryTooltip'); },
  show(html, x, y){
    const t = this.el(); if (!t) return;
    t.innerHTML = html; t.style.display = 'block'; t.setAttribute('aria-hidden','false');
    const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
    let left = x + pad, top = y + pad;
    if (left + w > window.innerWidth - 8) left = x - w - pad;
    if (top + h > window.innerHeight - 8) top = y - h - pad;
    t.style.left = Math.max(8,left) + 'px'; t.style.top = Math.max(8,top) + 'px';
  },
  hide(){ const t = this.el(); if (t){ t.style.display = 'none'; t.setAttribute('aria-hidden','true'); } }
};

/* =====================================================================
 * 분석·예측 강화(P0) 공통 헬퍼 — 위험톤·추세·예상밴드·신뢰·스파크라인
 *   기획서: 작업지시서/LRS_분석예측_P0_시각스펙.md §1·§2·§4·§5
 *   ★ BE grade/conf 값: high/medium/low → CSS data 속성은 high/mid/low 로 매핑.
 *   ★ 위험은 면적 채움이 아니라 테두리+아이콘+배지. 추세 하락은 주황(#ea7317, 빨강 금지).
 * ===================================================================== */
/* BE의 medium → CSS mid (high/low는 그대로). 위험 등급·신뢰 공통. */
function gradeKey(g){ return g === 'medium' ? 'mid' : (g === 'high' || g === 'low' ? g : 'mid'); }
/* 신뢰 라벨(KO) — BE confidenceKo 우선, 없으면 매핑 */
const CONF_KO_MAP = { high:'높음', medium:'보통', mid:'보통', low:'낮음' };
function confLabelKo(conf, confKo){ return confKo || CONF_KO_MAP[conf] || '낮음'; }

/* 신뢰 배지(우상단 일관 배치). observed/표본 hover 단서. (학생 화면엔 사용 금지) */
function confBadge(conf, confKo, hint){
  const k = gradeKey(conf);
  const label = confLabelKo(conf, confKo);
  const title = hint ? escapeAttr(hint) : '';
  return `<span class="conf-badge" data-conf="${k}" title="${title}"><span class="conf-dot"></span>신뢰 ${escapeHtml(label)}</span>`;
}

/* 추세 방향(up/flat/down) → 아이콘 클래스 */
const TREND_ICON = { up:'fa-arrow-trend-up', flat:'fa-arrow-right-long', down:'fa-arrow-trend-down' };
function normTrendDir(dir){
  if (dir === 'up' || dir === 'rising') return 'up';
  if (dir === 'down' || dir === 'falling' || dir === 'declining') return 'down';
  if (dir === 'flat' || dir === 'stable') return 'flat';
  return 'flat';
}
/* 추세 화살표(색·기호·기울기). slope 단위 %p/주. */
function trendArrow(dir, slope, hint){
  const d = normTrendDir(dir);
  const icon = TREND_ICON[d] || TREND_ICON.flat;
  let txt;
  if (d === 'flat' || slope == null) txt = '정체';
  else txt = (slope > 0 ? '+' : '') + slope + '%p/주';
  const title = hint ? ` title="${escapeAttr(hint)}"` : '';
  return `<span class="trend-arrow" data-trend="${d}"${title}><i class="fas ${icon}" aria-hidden="true"></i> ${escapeHtml(txt)}</span>`;
}

/* 인라인 SVG 스파크라인 — 120×32, 0~100 고정 스케일(행간 비교 일관).
 *   pts: 정답률 배열(% 또는 null). 결측주는 보간(선 안 끊김), 점은 안 찍음.
 *   trend: up/flat/down 색. 마지막 점 강조. (Chart.js 인스턴스 N개 회피) */
function sparklineSvg(pts, trend, opts){
  const W = 120, H = 32, P = 4;
  const innerW = W - P*2, innerH = H - P*2;
  const series = (pts || []).map(v => (v == null ? null : Number(v)));
  const valid = series.filter(v => v != null);
  if (valid.length < 2) return `<span class="trend-note">추세 데이터 부족</span>`;
  const d = normTrendDir(trend);
  const n = series.length;
  const xAt = i => P + (n === 1 ? innerW/2 : (i/(n-1))*innerW);
  const yAt = v => P + innerH - (Math.max(0, Math.min(100, v))/100)*innerH; // 0~100 고정
  // 결측 보간: 선형 채움(앞/뒤 유효값 사이)
  const filled = series.slice();
  for (let i=0;i<n;i++){
    if (filled[i] != null) continue;
    let a=i-1; while(a>=0 && filled[a]==null) a--;
    let b=i+1; while(b<n && series[b]==null) b++;
    if (a>=0 && b<n && series[b]!=null){ const t=(i-a)/(b-a); filled[i]=series[a]+(series[b]-series[a])*t; }
    else if (a>=0) filled[i]=filled[a];
    else if (b<n) filled[i]=series[b];
  }
  const linePts = filled.map((v,i)=> `${xAt(i).toFixed(1)},${yAt(v).toFixed(1)}`).join(' ');
  // 영역 폴리곤(라인 → 하단 baseline)
  const areaPts = `${P},${(H-P).toFixed(1)} ` + linePts + ` ${(W-P)},${(H-P).toFixed(1)}`;
  const lastI = n-1, lastV = filled[lastI];
  const cx = xAt(lastI).toFixed(1), cy = yAt(lastV).toFixed(1);
  const aria = (opts && opts.aria) ? escapeAttr(opts.aria) : '추세 스파크라인';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="${aria}" preserveAspectRatio="none">
    <polygon class="spark-area" data-trend="${d}" points="${areaPts}"></polygon>
    <polyline class="spark-line" data-trend="${d}" points="${linePts}"></polyline>
    <circle class="spark-dot" data-trend="${d}" cx="${cx}" cy="${cy}" r="2.5"></circle>
  </svg>`;
}

/* 추세에서 행별 시계열(rate %) 추출. series가 없으면 OLS 기울기로 직선 합성(관측주차만큼). */
function trendSeriesPercents(trend){
  if (trend && Array.isArray(trend.series) && trend.series.length){
    return trend.series.map(s => (s.rate == null ? null : s.rate));
  }
  return null;
}
/* 학생 행: 관측주차·기울기·현재율로 추세 직선 합성(스파크라인용, series 미제공 시) */
function synthLineFromSlope(currentRate, slope, observedWeeks){
  const n = Math.max(2, Math.min(8, observedWeeks || 0));
  if (currentRate == null || slope == null) return null;
  const arr = [];
  for (let i=0;i<n;i++){
    const back = (n-1) - i;            // 마지막이 현재
    const v = currentRate - slope*back; // 과거로 갈수록 slope만큼 역산
    arr.push(Math.max(0, Math.min(100, Math.round(v*10)/10)));
  }
  return arr;
}

/* 예상 밴드(3-dataset) — 실측선 + 점선 외삽 중심선 + 밴드(상/하단 채움).
 *   trend.series(과거) + projection(외삽). 목표선·"지금" 분기선은 호출부에서 옵션. */
function buildProjChartData(trend, projection, opts){
  opts = opts || {};
  const past = (trend && Array.isArray(trend.series)) ? trend.series : [];
  const pastLabels = past.map(s => s.week || '');
  const pastVals = past.map(s => (s.rate == null ? null : s.rate));
  const r0 = (trend && trend.currentRate != null) ? trend.currentRate : (pastVals.length ? pastVals[pastVals.length-1] : null);

  // 외삽 구간 길이: weeksToReach(≤12) 또는 8주
  const reachable = projection && projection.reachable && projection.weeksToReach;
  const wk = reachable ? Math.min(12, projection.weeksToReach) : 8;
  const slope = (projection && projection.slope != null) ? projection.slope : (trend && trend.slope) || 0;
  const projLabels = [];
  for (let i=1;i<=wk;i++) projLabels.push('+' + i + '주');

  const nPast = pastLabels.length;
  const labels = pastLabels.concat(projLabels);

  // 실측선: 과거 구간만 값, 외삽 구간 null
  const dsActual = {
    label:'지금까지', data: pastVals.concat(Array(wk).fill(null)),
    borderColor:'var(--proj-line)', backgroundColor:'var(--proj-line)',
    borderWidth:2.5, tension:.2, pointRadius:3, spanGaps:false, fill:false, order:1
  };
  // 외삽 중심선(점선): 마지막 실측점에서 이어지게 (경계점 공유)
  const projLine = Array(nPast).fill(null);
  if (nPast) projLine[nPast-1] = r0;
  let lo = Array(nPast).fill(null), hi = Array(nPast).fill(null);
  const bandW = Math.max(8, Math.abs(slope)*2);
  if (nPast){ lo[nPast-1] = r0; hi[nPast-1] = r0; }
  for (let i=1;i<=wk;i++){
    const v = Math.max(0, Math.min(100, r0 + slope*i));
    projLine.push(Math.round(v*10)/10);
    lo.push(Math.round(Math.max(0, v - bandW)*10)/10);
    hi.push(Math.round(Math.min(100, v + bandW)*10)/10);
  }
  const dsProj = {
    label:'예상(추정)', data: projLine,
    borderColor:'var(--proj-line)', backgroundColor:'var(--proj-line)',
    borderWidth:2, borderDash:[6,4], tension:.1,
    pointRadius:(ctx)=> ctx.dataIndex === labels.length-1 ? 6 : 0,
    pointBackgroundColor:'var(--proj-line)', spanGaps:true, fill:false, order:2
  };
  // 밴드: hi(상단) fill '+1'(아래=lo dataset)까지 채움
  const dsHi = {
    label:'예상 상단', data: hi, borderColor:'var(--proj-band-stroke)', borderWidth:1, borderDash:[2,3],
    pointRadius:0, tension:.1, fill:'+1', backgroundColor:'var(--proj-band)', spanGaps:true, order:4
  };
  const dsLo = {
    label:'예상 하단', data: lo, borderColor:'var(--proj-band-stroke)', borderWidth:1, borderDash:[2,3],
    pointRadius:0, tension:.1, fill:false, spanGaps:true, order:5
  };
  // 목표선
  const datasets = [dsHi, dsLo, dsActual, dsProj];
  if (opts.target != null){
    datasets.push({ label:'목표 ' + opts.target + '%', data: labels.map(()=> opts.target),
      borderColor:'#9ca3af', borderWidth:1.5, borderDash:[4,4], pointRadius:0, tension:0, fill:false, order:6 });
  }
  return { labels, datasets, boundaryIndex: nPast-1 };
}

 *     ★ 드릴 모달(활동 전체 보기·버킷 드릴)은 절대 불변 — 표시값=내역 계약 유지.

 * ===================================================================== */
let _raReqSeq = 0;
async function renderRecentActs(){
  const host = document.getElementById('sRecentActs');
  if (!host) return;
  const seq = ++_raReqSeq;                       // 기간칩 연속 전환 경합 가드
  const extra = { bucket:'all', limit:40, learnOnly:1 };   // [감리 R-1] 7종 정본 + 병합 여유창
  if (levelCfg().timelineClassDelta) extra.withClassAvg = 1;   // 학령 가드 — 초등은 파라미터 자체 미부착
  const d = await apiGet('/api/lrs/perform/detail', extra);
  if (seq !== _raReqSeq) return;
  const raw = (d && d.success && Array.isArray(d.items)) ? d.items : [];
  // [감리 R-1] 카드 한정 연속 중복 병합 — 최신 이벤트의 메타(진도율·점수·날짜)를 대표로 유지
  const merged = [];
  raw.forEach(it => {
    const key = (it.typeLabel || '') + '|' + (it.title || '');
    const last = merged[merged.length - 1];
    if (last && last._key === key) { last._dup += 1; return; }
    merged.push(Object.assign({ _key: key, _dup: 1 }, it));
  });
  const items = merged.slice(0, 8);
  if (!items.length){ host.innerHTML = ''; return; }   // 방어(§3-4 빈 상태: 섹션 미렌더 — s-perform 전체 빈상태가 선처리)

  const rowsHtml = items.map(it => {

    const metaTxt = `${it.sub ? escapeHtml(it.sub) + ' · ' : ''}${escapeHtml(it.typeLabel || '')}${dupTxt}`;
    const inline = _perfInlineMeta(it);
    // tail: 점수칩(평가·자기주도·문항풀이 — 현행 규칙 + 조회는 '-' 칩 유지) → 유형별 메타 1개 → 날짜

    </div>`;
  }).join('');

  host.innerHTML = `
    <section class="dc-chart-wrapper" aria-label="최근 학습 활동">
      <header>
        <div><h2>최근 학습 활동</h2>

      </header>
      <div id="raRows">${rowsHtml}</div>
    </section>`;
  const seeAll = document.getElementById('raSeeAll');
  if (seeAll) seeAll.addEventListener('click', () => openPerfDetail('all', seeAll));
}

 *   성장리포트 #detailModal 의 열기/닫기/스켈레톤/빈상태/포커스복귀/경합가드 로직 계승.
 *   BE: GET /api/lrs/perform/detail?bucket=&segment=&(period/days/from/to)&scope=
 *   불변식: 카드 숫자 == 모달 count == 렌더 행수(200 상한 내).
 * ===================================================================== */
const PERF_BUCKET_META = {
  exam:     { title:'완료 평가',     ico:'🎓', row:'🎓', empty:'완료한 평가' },
  homework: { title:'제출 과제',     ico:'📝', row:'📝', empty:'제출한 과제' },
  self:     { title:'자기주도 학습', ico:'🧭', row:'🧭', empty:'자기주도 학습' },
  content:  { title:'콘텐츠 활동',   ico:'🧩', row:'🎬', empty:'콘텐츠 활동' },
  all:      { title:'학습 활동',     ico:'📊', row:'•',  empty:'학습 활동' }
};
const PERF_SUBTOTAL_ICON = { exam:'🎓', homework:'📝', self:'🧭', content:'🧩' };

let _pdReqSeq = 0;
let _pdLastTrigger = null;
let _pdData = null;         // 현재 열린 bucket 응답(세그먼트 클라이언트 필터용)
let _pdBucket = null;
let _pdSegment = null;      // content 활성 세그먼트 key(null=전체)

function _pdEl(id){ return document.getElementById(id); }

/* 모달용 날짜 포맷 (YYYY.MM.DD) — LRS 페이지엔 formatDate 없음 → 로컬 정의 */
function _pdFmtDate(v){
  if (!v) return '';
  const d = new Date(v);
  if (isNaN(d.getTime())) return String(v).slice(0,10).replace(/-/g,'.');
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}.${m}.${day}`;
}

/* 점수 칩 HTML — ≥80 초록 / 60~79 회색 / <60 주황 / null '-' 회색 (§6) */
function _pdScoreChip(score){
  if (score == null || score === '' || isNaN(Number(score))) {
    return `<span class="lrs-dm-score none" aria-label="점수 없음">-</span>`;
  }
  const n = Math.round(Number(score));
  const cls = n >= 80 ? 'high' : n >= 60 ? 'mid' : 'low';
  return `<span class="lrs-dm-score ${cls}">${n}점</span>`;
}

/* 뱃지 tone 정규화 */
function _pdBadge(badge){
  if (!badge || !badge.text) return '';
  const tone = ['info','success','danger','warning','neutral'].indexOf(badge.tone) >= 0 ? badge.tone : 'neutral';
  return `<span class="lrs-dm-row-badge lrs-dm-badge-${tone}">${escapeHtml(badge.text)}</span>`;
}

/* =====================================================================
 * P2-2 인라인 메타 공용 헬퍼 — 타임라인 카드·드릴 모달 행이 같은 함수를 사용
 *   (같은 활동=같은 생김새 구조 보장, 스펙 §3-4 "드릴 모달 행 동기화")
 *   BE 확장 필드(progressPct·hwStatus·classAvg) 미착륙 시 필드 부재 → 메타 생략 폴백.
 * ===================================================================== */
/* 응답 item 의 활동 유형 추정 — activity_type 미포함 응답이라 typeLabel·segment·확장필드로 판별 */
function _perfItemKind(it){
  if (!it) return 'other';
  if (it.hwStatus || it.typeLabel === '과제') return 'homework';
  if (it.classAvg != null || it.typeLabel === '채움클래스 평가') return 'exam';
  if (it.progressPct != null || it.segment === 'lesson' || it.typeLabel === '수업 진행') return 'lesson';
  if (it.segment === 'view' || it.typeLabel === '콘텐츠 학습') return 'view';
  if (it.segment === 'solve' || it.typeLabel === '콘텐츠 문항풀이') return 'solve';
  if (it.typeLabel === '오늘의 학습' || it.typeLabel === 'AI맞춤' || it.typeLabel === '오답노트') return 'self';
  return 'other';
}
/* 유형→아이콘 (드릴 모달 상수와 동일 계열: exam 🎓 / homework 📝 / self 🧭 / content·lesson 🎬) */
const RA_KIND_ICON = { exam:'🎓', homework:'📝', self:'🧭', lesson:'🎬', view:'🎬', solve:'🎬', other:'•' };

/* 유형별 인라인 메타 1개 (스펙 §3-4 표) — 없으면 빈 문자열(생략 폴백) */
function _perfInlineMeta(it){
  const kind = _perfItemKind(it);
  // ① 수업/콘텐츠 = 진도율 게이지 (progressPct 0~100 — BE §3-3 확장 필드)
  if (kind === 'lesson' && it.progressPct != null && isFinite(Number(it.progressPct))){
    const p = Math.max(0, Math.min(100, Math.round(Number(it.progressPct))));
    return `<span class="ra-gauge" role="img" aria-label="진도율 ${p}%">` +
      `<span class="rag-track"><span class="rag-fill" style="width:${p}%"></span></span>` +
      `<span class="rag-num">${p}%</span></span>`;
  }
  // ② 과제 = 상태 뱃지 (graded 채점완료 #dbeafe/#1d4ed8 = info · submitted 제출완료 #d1fae5/#047857 = success)
  if (kind === 'homework' && it.hwStatus){
    return it.hwStatus === 'graded'
      ? `<span class="lrs-dm-row-badge lrs-dm-badge-info">채점완료</span>`
      : `<span class="lrs-dm-row-badge lrs-dm-badge-success">제출완료</span>`;
  }
  // ③ 평가 = 반 평균 대비 델타 — 중·고만(levelCfg 가드 이중 방어; 초등은 withClassAvg 요청 자체 미발송).
  //    음수·0 델타는 중립 표기 "반 평균 {avg}점" 회색 — 마이너스 기호·빨강·부정 어휘 절대 금지(스펙 §0 P2-2).
  if (kind === 'exam' && levelCfg().timelineClassDelta && it.classAvg != null && it.score != null){
    const delta = Math.round(Number(it.score) - Number(it.classAvg));
    if (delta >= 1) return `<span class="ra-delta">반 평균 +${delta}점</span>`;
    return `<span class="ra-delta neutral">반 평균 ${Math.round(Number(it.classAvg))}점</span>`;
  }
  return '';
}

/* KPI 그리드에 위임 리스너 1개 (뷰 재렌더마다 root 새로 바인딩) */
function bindPerfDrilldown(root){
  // 문서 레벨 위임을 1회만 바인딩. 그리드 스코프 리스너는 SPA 재렌더 시 그리드가 교체되며 유실돼
  // 클릭이 안 먹던 버그가 있어, data-bucket 있는 드릴다운 카드에 대해 document 위임으로 견고화한다.
  // (openPerfDetail 이 PERF_BUCKET_META 미등록 bucket 은 무시하므로 다른 카드와 충돌 없음.)
  if (bindPerfDrilldown._bound) return;
  bindPerfDrilldown._bound = true;
  document.addEventListener('click', (e) => {
    const card = e.target.closest('.dc-kpi-card.is-drillable[data-bucket]');
    if (card) { e.preventDefault(); openPerfDetail(card.getAttribute('data-bucket'), card); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const card = e.target && e.target.closest ? e.target.closest('.dc-kpi-card.is-drillable[data-bucket]') : null;
    if (card) { e.preventDefault(); openPerfDetail(card.getAttribute('data-bucket'), card); }
  });
}

/* 모달 열기: 스켈레톤 즉시 → fetch → 렌더 (경합가드 _pdReqSeq) */
function openPerfDetail(bucket, triggerEl, opts){
  opts = opts || {};
  if (!PERF_BUCKET_META[bucket]) return;
  const meta = PERF_BUCKET_META[bucket];
  const overlay = _pdEl('lrsPerfDetailModal');
  if (!overlay) return;
  _pdBucket = bucket;
  _pdSegment = opts.segment || null;
  if (triggerEl) _pdLastTrigger = triggerEl; // 소계 전이 시 트리거 유지

  // 헤더 즉시(아이콘+타이틀) + 스켈레톤
  _pdEl('lrsDmTitleIco').textContent = meta.ico;
  _pdEl('lrsDmTitleText').textContent = meta.title;
  _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 불러오는 중…`;
  const seg = _pdEl('lrsDmSeg'); seg.hidden = true; seg.innerHTML = '';
  _pdEl('lrsDmBody').innerHTML =
    '<div class="lrs-dm-loading">' +
      Array(3).fill(0).map(() =>
        '<div class="lrs-dm-skel-row"><div class="lrs-dm-skel-ico"></div>' +
        '<div class="lrs-dm-skel-body"><div class="lrs-dm-skel-line"></div><div class="lrs-dm-skel-line short"></div></div></div>'
      ).join('') +
    '</div>';
  if (!overlay.classList.contains('open')) {
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { try { _pdEl('lrsDmClose').focus(); } catch(_){} }, 0);
  }

  const seq = ++_pdReqSeq;
  // 기간칩(state.period/from/to) + scope 그대로 전달 — rangeQS 재사용(카드와 동일 기간·스코프).
  const extra = { bucket };
  if (opts.segment) extra.segment = opts.segment;
  // P2-2: 평가 행 반평균 메타 — 중·고만 옵트인. 초등은 요청 자체 미발송(네트워크 레벨 가드, P1-3 방식 계승).
  if ((bucket === 'exam' || bucket === 'all') && levelCfg().timelineClassDelta) extra.withClassAvg = 1;
  const url = '/api/lrs/perform/detail' + rangeQS(extra, '/api/lrs/perform/detail');
  fetch(url, { credentials:'include' })
    .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP '+r.status)))
    .then(data => {
      if (seq !== _pdReqSeq) return;               // 더 최신 요청이 떴으면 무시
      if (!data || !data.success) { renderPerfDetail(bucket, { title: meta.title, count: 0, items: [] }); return; }
      _pdData = data;
      renderPerfDetail(bucket, data);
    })
    .catch(() => {
      if (seq !== _pdReqSeq) return;
      _pdEl('lrsDmCount').textContent = periodLabelKo();
      _pdEl('lrsDmBody').innerHTML =
        '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">⚠️</div>' +
        '<div class="lrs-dm-empty-title">내역을 불러올 수 없어요</div>' +
        '<div class="lrs-dm-empty-text">잠시 후 다시 시도해 주세요.</div></div>';
    });
}

/* 모달 렌더: 헤더 count + (content 세그먼트) + (all 소계) + 내역 리스트/빈상태 */
function renderPerfDetail(bucket, data){
  const meta = PERF_BUCKET_META[bucket] || PERF_BUCKET_META.all;
  _pdEl('lrsDmTitleIco').textContent = meta.ico;
  _pdEl('lrsDmTitleText').textContent = data.title || meta.title;

  const seg = _pdEl('lrsDmSeg');
  const body = _pdEl('lrsDmBody');

  // ── all 버킷: 소계 요약형 (§2-3) ──
  if (bucket === 'all') {
    seg.hidden = true; seg.innerHTML = '';
    const subs = data.subtotals || [];
    const totalCount = (typeof data.count === 'number') ? data.count
      : subs.reduce((a,b)=>a+(b.count||0), 0);
    _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 총 ${totalCount}건 (평가·과제·자기주도·콘텐츠 학습 합계)`;
    if (!subs.length) { _renderPerfEmpty(bucket); return; }
    body.innerHTML = subs.map(su => {
      const ico = PERF_SUBTOTAL_ICON[su.bucket] || '•';
      return `<div class="lrs-dm-row is-clickable" tabindex="0" role="button" data-subbucket="${escapeAttr(su.bucket)}" aria-label="${escapeAttr((su.label||'')+' '+(su.count||0)+'건 자세히 보기')}">
        <div class="lrs-dm-row-icon">${ico}</div>
        <div class="lrs-dm-row-body"><div class="lrs-dm-row-primary">${escapeHtml(su.label||'')}</div></div>
        <div class="lrs-dm-row-tail"><span class="lrs-dm-count-tail">${(su.count||0).toLocaleString()}건</span><span class="lrs-dm-row-chev" aria-hidden="true">›</span></div>
      </div>`;
    }).join('');
    body.scrollTop = 0;
    return;
  }

  // ── content 버킷: 세그먼트 탭 (§2-2) ──
  if (bucket === 'content' && Array.isArray(data.segments) && data.segments.length) {
    _renderPerfSegments(data);
  } else {
    seg.hidden = true; seg.innerHTML = '';
    const count = (typeof data.count === 'number') ? data.count : (data.items ? data.items.length : 0);
    _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 총 ${count}건 · 최신순`;
  }

  // 내역 리스트 (content는 활성 세그먼트로 클라이언트 필터)
  _renderPerfItems(bucket, data);
}

/* content 세그먼트 탭 렌더 + 헤더 count 갱신 */
function _renderPerfSegments(data){
  const seg = _pdEl('lrsDmSeg');
  const segs = data.segments || [];
  // 활성 세그먼트: opts.segment 우선, 없으면 건수 최다
  if (!_pdSegment) {
    _pdSegment = segs.slice().sort((a,b)=>(b.count||0)-(a.count||0))[0];
    _pdSegment = _pdSegment ? _pdSegment.key : null;
  }
  seg.hidden = false;
  seg.innerHTML = segs.map(sg =>
    `<button type="button" class="${sg.key===_pdSegment?'active':''}" data-seg="${escapeAttr(sg.key)}">${escapeHtml(sg.label)} ${(sg.count||0).toLocaleString()}</button>`
  ).join('');
  const active = segs.find(sg => sg.key === _pdSegment);
  const cnt = active ? (active.count||0) : (data.count||0);
  _pdEl('lrsDmCount').textContent = `${periodLabelKo()} · 총 ${cnt}건 · 최신순`;
}

/* 내역 행 렌더 (content면 활성 세그먼트로 필터) */
function _renderPerfItems(bucket, data){
  const meta = PERF_BUCKET_META[bucket] || PERF_BUCKET_META.all;
  const body = _pdEl('lrsDmBody');
  let items = data.items || [];
  // content: 응답 item에 segment 키가 있으면 클라이언트 필터, 없으면 전체(=45) 노출
  if (bucket === 'content' && _pdSegment && items.length && items.some(it => it.segment)) {
    items = items.filter(it => it.segment === _pdSegment);
  }
  const total = (typeof data.count === 'number') ? data.count : items.length;

  if (!items.length) { _renderPerfEmpty(bucket); return; }

  const rowIco = meta.row;
  let rowsHtml = items.map(it => {
    const primary = escapeHtml(it.title || '제목 없음');
    const metaTxt = it.sub ? `<div class="lrs-dm-row-meta">${escapeHtml(it.sub)}</div>` : '';
    const dateTxt = it.date ? _pdFmtDate(it.date) : '';
    // 우측 꼬리: 점수칩 → 인라인 메타 → 뱃지 → 날짜. content 조회는 score null → '-'(칼럼 일관성, §2-2 wireframe).
    //   P2-2 동기화(§3-4): ① lesson 행 '-' 칩 대신 진도 게이지 ② homework 행 상태 뱃지로 대체 ③ exam 행 델타/중립 칩.
    //   확장 필드 미착륙 시 kind·inline 이 비어 기존 렌더와 동일(회귀 0).
    const kind = _perfItemKind(it);
    const inline = _perfInlineMeta(it);
    const lessonGauge = (kind === 'lesson' && it.progressPct != null);   // 게이지가 '-' 칩을 대체
    const hwStatusBadge = (kind === 'homework' && it.hwStatus);          // 상태 뱃지가 기존 '과제' 뱃지를 대체
    let tail = '';
    const showScore = !lessonGauge && (bucket === 'exam' || bucket === 'self' || bucket === 'content' ||
      (bucket === 'all' && it.score != null) || (bucket === 'homework' && it.score != null));
    if (showScore) tail += _pdScoreChip(it.score);
    tail += inline;
    if (!hwStatusBadge) tail += _pdBadge(it.badge);
    if (dateTxt) tail += `<span class="lrs-dm-row-date">${dateTxt}</span>`;
    return `<div class="lrs-dm-row">
      <div class="lrs-dm-row-icon">${rowIco}</div>
      <div class="lrs-dm-row-body"><div class="lrs-dm-row-primary">${primary}</div>${metaTxt}</div>
      ${tail ? `<div class="lrs-dm-row-tail">${tail}</div>` : ''}
    </div>`;
  }).join('');
  if (total > items.length && !(bucket === 'content' && _pdSegment)) {
    rowsHtml += `<div class="lrs-dm-note">최근 ${items.length}건만 표시해요 (전체 ${total}건)</div>`;
  }
  body.innerHTML = rowsHtml;
  body.scrollTop = 0;
}

/* 빈 상태 + 친절 CTA (§8-1) */
function _renderPerfEmpty(bucket){
  const meta = PERF_BUCKET_META[bucket] || PERF_BUCKET_META.all;
  const body = _pdEl('lrsDmBody');
  // 기간 확장 CTA: 90일 미만이면 다음 단계로
  const canWiden = state.period !== 'custom' && state.period !== '90d';
  const nextP = state.period === '7d' ? '30d' : '90d';
  const nextLabel = nextP === '30d' ? '최근 30일로 보기' : '최근 90일로 보기';
  const goto = { self:'/self-learn/', content:'/content/', exam:'/class/', homework:'/class/', all:'/self-learn/' };
  const gotoLabel = { self:'스스로채움 시작하기', content:'콘텐츠 보러가기', exam:'채움클래스 가기', homework:'채움클래스 가기', all:'스스로채움 시작하기' };
  let cta = '<div class="lrs-dm-empty-cta">';
  if (canWiden) cta += `<button type="button" data-widen="${nextP}">${nextLabel}</button>`;
  cta += `<a class="primary" href="${goto[bucket]||'/self-learn/'}">${gotoLabel[bucket]||'학습하러 가기'} →</a>`;
  cta += '</div>';
  body.innerHTML =
    `<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">📭</div>` +
    `<div class="lrs-dm-empty-title">이 기간에 ${escapeHtml(meta.empty)} 기록이 없어요</div>` +
    `<div class="lrs-dm-empty-text">${canWiden ? '기간을 넓혀 보거나, ' : ''}관련 학습을 시작해 보세요.</div>` +
    cta + `</div>`;
}

/* 모달 닫기 — 포커스 트리거 복귀 + 진행요청 무효화 */
function closePerfDetail(){
  const overlay = _pdEl('lrsPerfDetailModal');
  if (!overlay) return;
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  _pdReqSeq++;
  _pdData = null; _pdBucket = null; _pdSegment = null;
  if (_pdLastTrigger && typeof _pdLastTrigger.focus === 'function') {
    try { _pdLastTrigger.focus(); } catch(_){}
  }
  _pdLastTrigger = null;
}

/* 모달 이벤트 바인딩 (×·오버레이·Esc·세그먼트 탭·소계 전이·빈상태 CTA) — 1회 */
(function bindPerfDetailModal(){
  const overlay = _pdEl('lrsPerfDetailModal');
  if (!overlay) return;
  _pdEl('lrsDmClose').addEventListener('click', closePerfDetail);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closePerfDetail(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closePerfDetail();
  });
  // 세그먼트 탭 전환 (content) — 재fetch 없이 활성 세그먼트 교체
  _pdEl('lrsDmSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-seg]');
    if (!btn || !_pdData) return;
    _pdSegment = btn.getAttribute('data-seg');
    // 응답에 item.segment 없으면 세그먼트 재요청, 있으면 클라이언트 필터
    const hasSegKey = (_pdData.items||[]).some(it => it.segment);
    if (hasSegKey) { _renderPerfSegments(_pdData); _renderPerfItems('content', _pdData); }
    else { openPerfDetail('content', null, { segment:_pdSegment }); }
  });
  // 소계 행 클릭(all) → 해당 bucket 상세로 교체 / 빈상태 CTA
  overlay.addEventListener('click', (e) => {
    const sub = e.target.closest('.lrs-dm-row.is-clickable[data-subbucket]');
    if (sub) { _pdSegment = null; openPerfDetail(sub.getAttribute('data-subbucket'), null); return; }
    const widen = e.target.closest('button[data-widen]');
    if (widen) {
      const p = widen.getAttribute('data-widen');
      state.period = p;
      // 상단 기간칩 aria-pressed 동기화
      try {
        document.querySelectorAll('#periodPicker button[data-period]').forEach(b =>
          b.setAttribute('aria-pressed', b.dataset.period===p ? 'true':'false'));
        const cr = document.getElementById('customRange'); if (cr) cr.hidden = true;
      } catch(_){}
      _pdSegment = null;
      openPerfDetail(_pdBucket || 'all', null);  // 넓힌 기간으로 현재 bucket 재조회
      // 배경 뷰도 갱신되도록 (모달은 유지)
      if (state.view) { try { setView(state.view); } catch(_){} }
    }
  });
  // 소계 행 키보드(Enter/Space)
  overlay.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    const sub = e.target.closest('.lrs-dm-row.is-clickable[data-subbucket]');
    if (sub) { e.preventDefault(); _pdSegment = null; openPerfDetail(sub.getAttribute('data-subbucket'), null); }
  });
})();

/* =====================================================================
 * 정서-참여 산점도 점(학생) 클릭 → 상세 팝업
 *   기획서: 보고서/LRS_정서참여_점클릭_상세팝업_기획서_v1.md
 *   BE 계약: GET /api/lrs/emotion-engage/student/:userId?classId=&weeks=2
 *   별도 DOM(#lrsEngageStudentModal)·별도 상태(_eng*) — openPerfDetail 오염 방지
 *   CSS는 .lrs-dm-* 재사용(z-index 10000·닫기 40px 안전영역·모바일 하단 시트 계승)
 * ===================================================================== */
let _engReqSeq = 0;
let _engLastTrigger = null;

function _engEl(id){ return document.getElementById(id); }
function _engFmtMD(v){                      // 목록 행 우측 날짜(MM.DD)
  if (!v) return '';
  const s = String(v).slice(0,10);
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[2] + '.' + m[3];
  const d = new Date(v);
  if (isNaN(d.getTime())) return s.replace(/-/g,'.');
  return String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}

/* 감정 이모지·라벨 FE 폴백 (emotion-checkin.html SSOT 계승 — BE가 emoji/emotionKo를 주면 그걸 우선) */
const ENG_API_EMOJI = { happy:'🤩', excited:'🤩', great:'🤩', good:'😊', calm:'😐', tired:'😕', sad:'😢', angry:'😡', anxious:'😰', frustrated:'😤', bad:'😞' };
const ENG_API_LABEL = { happy:'행복한', excited:'신나는', great:'아주좋은', good:'좋은', calm:'평온한', tired:'피곤한', sad:'슬픈', angry:'화난', anxious:'불안한', frustrated:'답답한', bad:'속상한' };
/* 참여 활동 유형 아이콘 폴백(정본 7종 라벨 계승) — BE typeKo 우선, 아이콘은 type로 매핑 */
const ENG_TYPE_ICON = { exam:'🎓', homework:'📝', content:'🧩', content_view:'🎬', today_learning:'🧭', ai_node:'🧭', wrong_note:'🧭', lesson:'📚', other:'🔹' };
/* 참여 추세 한국어(기획서 §2-3) */
const ENG_TREND_KO = { down:'감소(↓)', flat:'유지(→)', up:'증가(↑)', nodata:'활동 기록 없음' };

/* 팝업 열기: 헤더 즉시(seed) → 스켈레톤 → fetch → 렌더 (경합가드 _engReqSeq) */
function openEngageStudent(seed, triggerEl){
  seed = seed || {};
  const overlay = _engEl('lrsEngageStudentModal');
  if (!overlay) return;
  if (triggerEl) _engLastTrigger = triggerEl;

  // 헤더 즉시 — 이름·사분면 배지는 seed로 바로 채움(로딩 체감 최소)
  _engSetHeader({ name: seed.name, quadrant: seed.quadrant, hasEmotion: seed.hasEmotion, weeks: 2, className: null }, true);
  _engEl('lrsEngBody').innerHTML =
    '<div class="lrs-dm-loading">' +
      Array(3).fill(0).map(() =>
        '<div class="lrs-dm-skel-row"><div class="lrs-dm-skel-ico"></div>' +
        '<div class="lrs-dm-skel-body"><div class="lrs-dm-skel-line"></div><div class="lrs-dm-skel-line short"></div></div></div>'
      ).join('') +
    '</div>';
  if (!overlay.classList.contains('open')){
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { try { _engEl('lrsEngClose').focus(); } catch(_){} }, 0);
  }

  const seq = ++_engReqSeq;
  const uid = seed.userId;
  if (uid == null){ _engRenderError('학생 정보를 확인할 수 없어요'); return; }

  (async () => {
    const cid = await resolveClassId();
    const d = await apiGet('/api/lrs/emotion-engage/student/' + encodeURIComponent(uid), { classId: cid, weeks: 2 });
    if (seq !== _engReqSeq) return;                 // 더 최신 요청이 떴으면 무시
    if (!d || d.success === false){
      // BE 미배포·오류·403 graceful — 에러 없이 안내
      const is403 = d && (d.status === 403 || d.code === 'FORBIDDEN');
      _engRenderError(is403 ? '이 학생의 상세를 볼 권한이 없어요' : '상세를 불러오지 못했어요', seed);
      return;
    }
    renderEngageStudent(d, seed);
  })();
}

/* 헤더(이름 + 사분면 배지 + count줄) 채우기 */
function _engSetHeader(data, isSeed){
  const name = data && data.name ? data.name : (isSeed ? '학생' : '학생');
  _engEl('lrsEngTitleText').textContent = name;
  const badge = _engEl('lrsEngQuadBadge');
  const hasEmo = data && data.hasEmotion;
  const q = data && data.quadrant && ENG_QUAD[data.quadrant] ? ENG_QUAD[data.quadrant] : null;
  if (hasEmo === false || !q){
    badge.textContent = '⚪ 판정 보류';
    badge.style.background = 'var(--gray-100)';
    badge.style.color = 'var(--gray-600)';
  } else {
    badge.textContent = q.emoji + ' ' + q.ko;
    badge.style.background = _engTint(q.color, .12);
    badge.style.color = q.color;
  }
  const weeks = Number(data && data.weeks) || 2;
  const cls = data && data.className ? ' · ' + escapeHtml(data.className) : '';
  _engEl('lrsEngCount').innerHTML = '최근 ' + weeks + '주 기준' + cls;
}
/* hex 색 → rgba 틴트 */
function _engTint(hex, a){
  const h = String(hex||'').replace('#','');
  if (h.length !== 6) return 'rgba(148,163,184,' + a + ')';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* 본문 렌더: §왜 이 사분면인가 → §참여 활동 내역 → §감정 체크 내역 */
function renderEngageStudent(d, seed){
  _engSetHeader(d, false);
  const weeks = Number(d.weeks) || 2;
  const sig = d.signals || {};
  const engagements = Array.isArray(d.engagements) ? d.engagements : [];
  const emotions = Array.isArray(d.emotions) ? d.emotions : [];
  const masked = !!d.masked;

  // ── §왜 이 사분면인가 (정서·참여 2축) ──
  //   ⚠ 정서 근거는 quadrant 산출 창(emotionNegPct + emotionBasisKo)만 표시.
  //   2주 목록 창 필드(emotionDays/negCount)는 서로 다른 창이라 근거 요약에 나란히 두지 않음(자기모순 방지).
  const hasEmo = d.hasEmotion !== false;
  let emoIco, emoMain, emoSub, emoMuted;
  let emoHint = '';   // recentEmotionHint(관찰형 한 줄) — 있으면 노출, null이면 숨김
  if (!hasEmo){
    emoIco = '⚪'; emoMuted = true;
    emoMain = '감정 기록 없음';
    emoSub = '감정 기록이 없어 중립으로 봤어요';
  } else {
    const neg = (sig.emotionNegPct != null) ? sig.emotionNegPct : null;
    emoIco = (neg != null && neg >= 50) ? '🖤' : '💙'; emoMuted = false;
    // "최근 2주" 하드코딩 제거 — negPct 는 카드 quadrant 근거 값 그대로
    emoMain = (neg != null) ? ('부정 감정 ' + neg + '%') : '감정 신호';
    // 보조 라벨 = BE emotionBasisKo(예 "최근 감정 기록 10건 기준"). 없으면 표본수로 폴백, 그것도 없으면 생략
    emoSub = (sig.emotionBasisKo && String(sig.emotionBasisKo).trim())
      ? String(sig.emotionBasisKo).trim()
      : (sig.emotionSampleN != null ? ('최근 감정 기록 ' + sig.emotionSampleN + '건 기준') : '');
    // recentEmotionHint(최근 개선 관찰) — 있으면 관찰형 한 줄(단정 금지 톤), null이면 숨김
    if (sig.recentEmotionHint && String(sig.recentEmotionHint).trim()) emoHint = String(sig.recentEmotionHint).trim();
  }
  const gap = sig.gapDays;
  const isNoData = sig.engageTrend === 'nodata';
  const trendKo = ENG_TREND_KO[sig.engageTrend] || '';
  // nodata는 "활동 추세 ~" 접두어 없이 그대로("활동 기록 없음") — 중복 어휘 방지
  const trendPhrase = trendKo ? (isNoData ? trendKo : ('활동 추세 ' + trendKo)) : '';
  const engIco = (sig.engageTrend === 'down') ? '📉' : (sig.engageTrend === 'up') ? '📈' : isNoData ? '⚪' : '➡️';
  let engMain;
  if (gap != null && trendPhrase) engMain = '무활동 ' + gap + '일 · ' + trendPhrase;
  else if (gap != null)           engMain = '무활동 ' + gap + '일';
  else if (trendPhrase)           engMain = trendPhrase;
  else                            engMain = '참여 신호';
  const ec = sig.engageCount;
  const engSub = (ec != null) ? ('최근 ' + weeks + '주 참여 활동 ' + ec + '건') : '';

  const signalHtml =
    '<div class="lrs-eng-sec-title">■ 이 학생을 이렇게 본 이유</div>' +
    '<div class="lrs-eng-signal">' +
      '<div class="lrs-eng-signal-row' + (emoMuted ? ' is-muted' : '') + '">' +
        '<div class="lrs-eng-signal-ico" aria-hidden="true">' + emoIco + '</div>' +
        '<div class="lrs-eng-signal-body">' +
          '<div class="lrs-eng-signal-axis">정서</div>' +
          '<div class="lrs-eng-signal-main">' + escapeHtml(emoMain) + '</div>' +
          (emoSub ? '<div class="lrs-eng-signal-sub">' + escapeHtml(emoSub) + '</div>' : '') +
          (emoHint ? '<div class="lrs-eng-signal-hint"><i class="fas fa-eye" aria-hidden="true"></i> ' + escapeHtml(emoHint) + '</div>' : '') +
        '</div>' +
      '</div>' +
      '<div class="lrs-eng-signal-row">' +
        '<div class="lrs-eng-signal-ico" aria-hidden="true">' + engIco + '</div>' +
        '<div class="lrs-eng-signal-body">' +
          '<div class="lrs-eng-signal-axis">참여</div>' +
          '<div class="lrs-eng-signal-main">' + escapeHtml(engMain) + '</div>' +
          (engSub ? '<div class="lrs-eng-signal-sub">' + escapeHtml(engSub) + '</div>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="lrs-eng-disclaimer"><i class="fas fa-circle-info" aria-hidden="true"></i> ' +
      escapeHtml(d.disclaimer || '규칙 기반 신호예요. 학생과의 대화로 꼭 확인하세요.') + '</div>';

  // ── §참여 활동 내역 ──
  let engListHtml = '<div class="lrs-eng-sec-title">■ 참여 활동 내역 <span class="lrs-eng-sec-count">(최근 ' + weeks + '주 · ' + engagements.length + '건)</span></div>';
  if (!engagements.length){
    const sub = (gap != null) ? ('무활동 ' + gap + '일') : '활동 기록이 전혀 없어요';
    engListHtml += '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">📭</div>' +
      '<div class="lrs-dm-empty-title">이 기간 참여 활동 기록이 없어요</div>' +
      '<div class="lrs-dm-empty-text">' + escapeHtml(sub) + '</div></div>';
  } else {
    const MAX = 20;
    const shown = engagements.slice(0, MAX);
    engListHtml += shown.map(it => {
      const ico = ENG_TYPE_ICON[it.type] || '🔹';
      const typeKo = it.typeKo || '학습 활동';
      const primary = it.label ? (escapeHtml(typeKo) + ' — ' + escapeHtml(it.label)) : escapeHtml(typeKo);
      const date = _engFmtMD(it.date);
      return '<div class="lrs-dm-row">' +
        '<div class="lrs-dm-row-icon">' + ico + '</div>' +
        '<div class="lrs-dm-row-body"><div class="lrs-dm-row-primary">' + primary + '</div></div>' +
        (date ? '<div class="lrs-dm-row-tail"><span class="lrs-dm-row-date">' + date + '</span></div>' : '') +
        '</div>';
    }).join('');
    if (engagements.length > MAX){
      engListHtml += '<div class="lrs-dm-note">외 ' + (engagements.length - MAX) + '건</div>';
    }
  }

  // ── §감정 체크 내역 ──
  let emoListHtml = '<div class="lrs-eng-sec-title">■ 감정 체크 내역 <span class="lrs-eng-sec-count">(최근 ' + weeks + '주 · ' + emotions.length + '건)</span></div>';
  if (!emotions.length){
    emoListHtml += '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">😶</div>' +
      '<div class="lrs-dm-empty-title">이 기간 감정 체크 기록이 없어요</div>' +
      '<div class="lrs-dm-empty-text">감정출석부에서 감정을 남기면 여기 표시돼요</div></div>';
  } else {
    const MAX = 14;
    const shown = emotions.slice(0, MAX);
    emoListHtml += shown.map(it => {
      const emoji = it.emoji || ENG_API_EMOJI[it.emotion] || '😐';
      const ko = it.emotionKo || ENG_API_LABEL[it.emotion] || (it.emotion ? escapeHtml(it.emotion) : '감정');
      const reason = (it.reason && String(it.reason).trim()) ? String(it.reason).trim() : '';
      // 출처 배지: 현재 감정 원천은 감정출석부 단일(마음채움 미통합 — 허위 출처 금지)
      const srcKo = it.sourceKo || '감정출석부';
      const meta = reason
        ? '<div class="lrs-dm-row-meta">“' + escapeHtml(reason) + '”</div>'
        : '<div class="lrs-dm-row-meta" style="color:var(--gray-400);">(이유 없음)</div>';
      const date = _engFmtMD(it.date);
      return '<div class="lrs-dm-row">' +
        '<div class="lrs-dm-row-icon">' + escapeHtml(emoji) + '</div>' +
        '<div class="lrs-dm-row-body"><div class="lrs-dm-row-primary">' + escapeHtml(ko) + '</div>' + meta + '</div>' +
        '<div class="lrs-dm-row-tail">' +
          '<span class="lrs-dm-row-badge lrs-dm-badge-neutral">' + escapeHtml(srcKo) + '</span>' +
          (date ? '<span class="lrs-dm-row-date">' + date + '</span>' : '') +
        '</div>' +
      '</div>';
    }).join('');
    if (emotions.length > MAX){
      emoListHtml += '<div class="lrs-dm-note">외 ' + (emotions.length - MAX) + '건</div>';
    }
  }

  // ── (선택) 경량 조치 1버튼 — 메시지 보내기(검증된 딥링크만, self-learn 금지) ──
  let actionHtml = '';
  if (!masked && d.userId != null){
    actionHtml = '<div class="lrs-dm-empty-cta" style="justify-content:flex-end;margin-top:18px;">' +
      '<button type="button" id="lrsEngMsgBtn" data-uid="' + escapeAttr(d.userId) + '">✉️ 메시지 보내기</button>' +
      '</div>';
  }

  const maskBanner = masked
    ? '<div class="lrs-eng-disclaimer" style="color:var(--gray-500);"><i class="fas fa-user-shield" aria-hidden="true"></i> 타 반 — 개인정보 보호 중</div>'
    : '';

  _engEl('lrsEngBody').innerHTML = maskBanner + signalHtml + engListHtml + emoListHtml + actionHtml;
  _engEl('lrsEngBody').scrollTop = 0;
}

/* 오류/graceful 상태 (BE 미배포·403·네트워크) — 에러 없이 안내 */
function _engRenderError(msg, seed){
  if (seed) _engSetHeader({ name: seed.name, quadrant: seed.quadrant, hasEmotion: seed.hasEmotion, weeks: 2 }, true);
  _engEl('lrsEngBody').innerHTML =
    '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">⚠️</div>' +
    '<div class="lrs-dm-empty-title">' + escapeHtml(msg || '상세를 불러오지 못했어요') + '</div>' +
    '<div class="lrs-dm-empty-text">잠시 후 다시 시도해 주세요.</div></div>';
}

/* 닫기 — 진행요청 무효화 + 트리거 포커스 복귀 */
function closeEngageStudent(){
  const overlay = _engEl('lrsEngageStudentModal');
  if (!overlay) return;
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  _engReqSeq++;
  if (_engLastTrigger && typeof _engLastTrigger.focus === 'function'){
    try { _engLastTrigger.focus(); } catch(_){}
  }
  _engLastTrigger = null;
}

/* 이벤트 바인딩 (×·오버레이·Esc·메시지 버튼) — 1회 */
(function bindEngageStudentModal(){
  const overlay = _engEl('lrsEngageStudentModal');
  if (!overlay) return;
  _engEl('lrsEngClose').addEventListener('click', closeEngageStudent);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeEngageStudent(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeEngageStudent();
  });
  overlay.addEventListener('click', (e) => {
    const msg = e.target.closest && e.target.closest('#lrsEngMsgBtn');
    if (msg){
      const uid = msg.getAttribute('data-uid');
      try { if (window.LRS && typeof LRS.teacherAction === 'function') LRS.teacherAction('message', uid); } catch(_){}
    }
  });
})();

/* =====================================================================
 * 활용 현황(t-usage) 히트맵 셀 클릭 → 요일×시간 활동 드릴다운 팝업
 *   BE 계약: GET /api/lrs/stats/heatmap-cell?classId=&dow=&hour=&period=
 *   응답 count 는 히트맵 그 칸 값과 동일(멤버십 스코프·demo 제외·기간·셀 필터 동일).
 *   별도 DOM(#lrsHeatCellModal)·별도 상태(_hc*) — 다른 모달 오염 방지.
 *   CSS는 .lrs-dm-* 재사용(z-index 10000·닫기 40px 안전영역·모바일 하단 시트 계승).
 * ===================================================================== */
const HC_DOW_KO = ['일','월','화','수','목','금','토'];
/* 활동유형 → 아이콘(정본 7종 + content_view 등). 라벨은 BE activityKo(masteryDetailTypeLabel) 사용. */
const HC_TYPE_ICON = {
  exam_complete:'🎓', homework_submit:'📝', content_solve:'🧩', content_view:'🎬',
  lesson_progress:'📚', self_learn:'🧭', daily_complete:'🧭', node_complete:'🧭',
  wrong_note_retry:'🔁', problem_attempt:'✏️'
};
let _hcReqSeq = 0;
let _hcLastTrigger = null;
function _hcEl(id){ return document.getElementById(id); }

/* 팝업 열기: 헤더 즉시 → 스켈레톤 → fetch → 렌더 (경합가드 _hcReqSeq) */
function openHeatmapCell(dow, hour, triggerEl){
  const overlay = _hcEl('lrsHeatCellModal');
  if (!overlay) return;
  if (triggerEl) _hcLastTrigger = triggerEl;

  _hcEl('lrsHcTitleText').textContent = `${HC_DOW_KO[dow]}요일 ${hour}시 활동`;
  _hcEl('lrsHcCount').textContent = '';
  _hcEl('lrsHcBody').innerHTML =
    '<div class="lrs-dm-loading">' +
      Array(3).fill(0).map(() =>
        '<div class="lrs-dm-skel-row"><div class="lrs-dm-skel-ico"></div>' +
        '<div class="lrs-dm-skel-body"><div class="lrs-dm-skel-line"></div><div class="lrs-dm-skel-line short"></div></div></div>'
      ).join('') +
    '</div>';
  if (!overlay.classList.contains('open')){
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    setTimeout(() => { try { _hcEl('lrsHcClose').focus(); } catch(_){} }, 0);
  }

  const seq = ++_hcReqSeq;
  (async () => {
    const cid = await resolveClassId();
    const d = await apiGet('/api/lrs/stats/heatmap-cell', { classId: cid, dow, hour });
    if (seq !== _hcReqSeq) return;                  // 더 최신 요청이 떴으면 무시
    if (!d || d.success === false){
      const is403 = d && (d.status === 403 || d.code === 'FORBIDDEN');
      _hcRenderError(is403 ? '이 학급의 활동을 볼 권한이 없어요' : '활동 목록을 불러오지 못했어요');
      return;
    }
    renderHeatmapCell(d, dow, hour);
  })();
}

function renderHeatmapCell(d, dow, hour){
  const total = Number(d.total || 0);
  const items = Array.isArray(d.items) ? d.items : [];
  _hcEl('lrsHcTitleText').textContent = `${HC_DOW_KO[dow]}요일 ${hour}시 활동`;
  _hcEl('lrsHcCount').textContent = total > 0 ? `활동 ${total.toLocaleString()}건` : '';

  if (!items.length){
    _hcEl('lrsHcBody').innerHTML =
      '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">🗒️</div>' +
      '<div class="lrs-dm-empty-title">이 시간대에는 활동 기록이 없어요</div>' +
      '<div class="lrs-dm-empty-text">다른 칸을 눌러 보세요.</div></div>';
    _hcEl('lrsHcBody').scrollTop = 0;
    return;
  }

  const rowsHtml = items.map(it => {
    const ico = HC_TYPE_ICON[it.activityType] || '🔹';
    const who = escapeHtml(it.name || '학생');
    const act = escapeHtml(it.activityKo || '학습 활동');
    const label = it.label ? `<div class="lrs-dm-row-meta">${escapeHtml(it.label)}</div>` : '';
    const time = it.createdAt ? `<span class="lrs-dm-row-date">${escapeHtml(it.createdAt)}</span>` : '';
    return `<div class="lrs-dm-row">
      <div class="lrs-dm-row-icon">${ico}</div>
      <div class="lrs-dm-row-body">
        <div class="lrs-dm-row-primary">${who} · ${act}</div>
        ${label}
      </div>
      <div class="lrs-dm-row-tail">${time}</div>
    </div>`;
  }).join('');

  // 상한(100) 초과 안내
  const moreNote = total > items.length
    ? `<div class="lrs-dm-count" style="padding:10px 16px 4px;">최근 ${items.length}건만 표시 · 외 ${(total - items.length).toLocaleString()}건 더 있어요</div>`
    : '';
  // 비담임 소표본 마스킹 안내
  const maskNote = d.masked
    ? `<div class="lrs-dm-count" style="padding:6px 16px 10px;">개인정보 보호를 위해 이름을 가렸어요(소규모 학급).</div>`
    : '';

  _hcEl('lrsHcBody').innerHTML = maskNote + rowsHtml + moreNote;
  _hcEl('lrsHcBody').scrollTop = 0;
}

function _hcRenderError(msg){
  _hcEl('lrsHcCount').textContent = '';
  _hcEl('lrsHcBody').innerHTML =
    '<div class="lrs-dm-empty"><div class="lrs-dm-empty-ico">⚠️</div>' +
    '<div class="lrs-dm-empty-title">' + escapeHtml(msg || '불러오지 못했어요') + '</div>' +
    '<div class="lrs-dm-empty-text">잠시 후 다시 시도해 주세요.</div></div>';
}

function closeHeatmapCell(){
  const overlay = _hcEl('lrsHeatCellModal');
  if (!overlay) return;
  overlay.classList.remove('open');
  document.body.style.overflow = '';
  _hcReqSeq++;
  if (_hcLastTrigger && typeof _hcLastTrigger.focus === 'function'){
    try { _hcLastTrigger.focus(); } catch(_){}
  }
  _hcLastTrigger = null;
}

(function bindHeatmapCellModal(){
  const overlay = _hcEl('lrsHeatCellModal');
  if (!overlay) return;
  _hcEl('lrsHcClose').addEventListener('click', closeHeatmapCell);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeHeatmapCell(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeHeatmapCell();
  });
})();

/* ---- custom 공통 렌더 ---- */
function _renderCustomCore(root, d, opts){
  opts = opts || {};
  const s = d.summary || {};
  const kpi3 = opts.kpi3 || [
    ['추천받은 학습', (s.recommendedCount||0).toLocaleString(), '건', `고유 학생 ${s.uniqueLearners||0}명`],
    ['완료한 학습',   (s.completedCount||0).toLocaleString(), '건', `평균 ${s.avgScore||0}점`],
    ['이행률',        (s.completionRate||0), '%', '완료/추천']
  ];
  const kpiHtml = kpi3.map((k,i)=> kpiCard(k[0], k[1], k[2], {dir:'flat',text:k[3]}, ['primary','success','warning'][i])).join('');
  root.innerHTML = `
    <section class="dc-kpi-grid">${kpiHtml}</section>
    <section class="dc-chart-grid">
      ${chartWrap('customByDay','일별 추천·완료 추이','맞춤학습')}
    </section>
    <section><h2 style="margin:16px 0 8px;">약점 성취기준 Top 10</h2><div id="customWeak"></div></section>`;
  const days = d.byDay || [];
  if (!days.length) {
    document.getElementById('customByDay').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>일별 추천·완료 추이</h2></header>` + tplEmpty('추이 데이터가 없어요');
  } else {
    mkChart(document.getElementById('customByDay'),'bar', {
      labels: days.map(x=>x.date),
      datasets: [
        { label:'추천', data: days.map(x=>x.recommended||0), backgroundColor:'#2563eb' },
        { label:'완료', data: days.map(x=>x.completed||0),   backgroundColor:'#10b981' }
      ]
    });
  }
  const weak = d.weakTargets || [];
  if (!weak.length) {
    document.getElementById('customWeak').innerHTML = tplEmpty('약점 성취기준이 없습니다');
  } else {
    renderDataTable(document.getElementById('customWeak'), {
      columns:[
        // 1차 표기는 단원명(label). 코드는 회색 소자로만 부기(툴팁 title). BE가 label 미제공 시 code 폴백.
        {key:'label',label:'단원',
          format:(v,row)=>{
            const code = row.achievement_code || '';
            const hasName = v && String(v).trim() && String(v).trim() !== code;   // BE label 있을 때만
            const name = hasName ? String(v).trim() : (code || '성취기준');
            // 코드 소자는 단원명이 별도로 있을 때만 부기(이름이 곧 코드면 중복 노출 방지).
            const codeSub = (hasName && code)
              ? `<span style="display:block;margin-top:2px;font-size:12px;color:var(--gray-400);" title="${escapeAttr(code)}">${escapeHtml(code)}</span>`
              : '';
            return `<span style="font-weight:600;">${escapeHtml(name)}</span>${codeSub}`;
          }},
        {key:'attempts',label:'시도',align:'right'},
        // 평균점수: BE가 0~100으로 정규화(계약). 방어적 폴백 — 값이 0<v≤1로 오면(구 0~1 원점수) ×100.
        //   >1이면 그대로 통과(BE 정규화 후 재변환 방지, 멱등). null은 '-'.
        {key:'avg_score',label:'평균점수',align:'right', format:(v)=>{
          if (v==null) return '-';
          let n = Number(v); if (!isFinite(n)) return '-';
          if (n > 0 && n <= 1) n = n * 100;
          return (Math.round(n*10)/10) + '점';
        }},
        // 풀 타임스탬프 → 날짜(YYYY-MM-DD)만.
        {key:'last_at',label:'최근 학습일', format:(v)=>escapeHtml(fmtFullDate(v))}
      ],
      rows: weak
    });
  }
}

/* ======== t-teacher-idx — '내 활동분석' (4블록: KPI 델타 · 추이 · 구성 · 최근) ========
 * 순위·활용지수·상위 N% 프레이밍 전면 폐기(실측상 항상 100점=죽은 지표).
 * BE 신규 계약(prev/trend/recent/정확한 lessons_held) 소비 + 옛 계약 graceful 폴백. */

// 4지표 고정 색 토큰 (전 블록 통일)
const TIDX_METRICS = [
  { key:'contents_authored', label:'작성 콘텐츠', short:'콘텐츠', unit:'개', color:'#2563eb', tone:'primary', trendKey:'contents' },
  { key:'lessons_held',      label:'진행 수업',   short:'수업',   unit:'건', color:'#10b981', tone:'success', trendKey:'lessons'  },
  { key:'exams_opened',      label:'개설 평가',   short:'평가',   unit:'건', color:'#f59e0b', tone:'warning', trendKey:'exams'    },
  { key:'feedback_count',    label:'피드백',      short:'피드백', unit:'건', color:'#8b5cf6', tone:'purple',  trendKey:'feedback' },
];
// 최근활동 유형 → 아이콘·라벨·색 (4지표 색 토큰 재사용)
const TIDX_TYPE = {
  content:  { label:'콘텐츠', icon:'fa-book',              color:'#2563eb' },
  lesson:   { label:'수업',   icon:'fa-chalkboard',        color:'#10b981' },
  exam:     { label:'평가',   icon:'fa-file-pen',          color:'#f59e0b' },
  feedback: { label:'피드백', icon:'fa-comment-dots',      color:'#8b5cf6' },
};
// KPI 증감 화살표 — prev(직전 동일기간) 있으면 델타, 없으면 기간 라벨
function _tIdxTrend(curr, prev, hasPrev){
  const c = Number(curr)||0;
  if (!hasPrev) return { dir:'flat', text:'기간' };
  const p = Number(prev)||0, diff = c - p;
  if (diff > 0) return { dir:'up',   text:`지난 기간 대비 +${diff.toLocaleString()}` };
  if (diff < 0) return { dir:'down', text:`지난 기간 대비 ${diff.toLocaleString()}` };
  return { dir:'flat', text:'지난 기간과 동일' };
}

VIEWS['t-teacher-idx'] = async function(root){
  root.innerHTML = tplLoading(4);
  const d = await apiGet('/api/lrs/stats/teacher-index');
  if (!d || !d.success) { root.innerHTML = tplEmpty('활동 데이터를 불러오지 못했습니다'); return; }
  const me = d.myIndex || (d.teachers && d.teachers[0]) || null;
  if (!me) { root.innerHTML = tplEmpty('활동 데이터가 없습니다'); return; }

  const prev = d.prev || null;         // 직전 동일기간 델타 (BE 신규)
  const hasPrev = !!prev;
  const trend = Array.isArray(d.trend) ? d.trend : [];    // 활동 추이 버킷 (BE 신규)
  const recent = Array.isArray(d.recent) ? d.recent : []; // 최근 활동 10건 (BE 신규)
  const scopes = d.metricScopes || {};

  // 블록① KPI 4장 — 서브라벨 metricScopes 파생, prev 있으면 델타 화살표
  const kpiHtml = TIDX_METRICS.map(m => {
    const val = Number(me[m.key])||0;
    const tr = _tIdxTrend(val, prev && prev[m.key], hasPrev);
    // 서브라벨: period면 '기간', cumulative면 '누적'. prev 델타가 있으면 델타 문구가 우선.
    if (!hasPrev) tr.text = (scopes[m.key] === 'cumulative') ? '누적' : '기간';
    return kpiCard(m.label, val.toLocaleString(), m.unit, tr, m.tone);
  }).join('');

  // 4지표 합(도넛 중앙 총합)
  const total4 = TIDX_METRICS.reduce((s,m)=> s + (Number(me[m.key])||0), 0);

  root.innerHTML = `
    <section class="dc-kpi-grid">${kpiHtml}</section>
    <section class="dc-chart-grid tidx-chart-grid">
      ${chartWrap('tIdxTrend','내 활동 추이','기간 버킷별 신규 활동 건수')}
      <section class="dc-chart-wrapper">
        <header><div><h2>내 활동 구성</h2><div class="subtitle">유형별 비중</div></div></header>
        <div class="chart-body donut-wrap" style="height:300px;">
          <canvas id="tIdxMix" role="img" aria-label="내 활동 구성 도넛"></canvas>
          ${donutCenterHtml(total4.toLocaleString(), '총 활동(건)')}
        </div>
      </section>
    </section>
    <section class="dc-chart-wrapper" style="margin-top:16px;">
      <header><div><h2>최근 내 활동</h2><div class="subtitle">이 기간 최신 순 (최대 10건)</div></div></header>

/* =====================================================================
 * 관리자 분석 헬퍼 (집계·분포 전용, 개인식별 금지)
 * ===================================================================== */
// URL test-hook: ?aIdxN=1234 등으로 게이트 경계값 수동 주입
function _adminTestHook(key){
  try { const v = new URLSearchParams(location.search).get(key); return v==null? null : v; } catch(_){ return null; }
}

// 최소표본 가드: n<threshold → 차단 패널 렌더하고 false 반환
function _minSampleGuard(root, n, threshold, label){
  if (Number(n) >= Number(threshold)) return true;
  root.innerHTML = `<div class="dc-state-panel" role="status" style="border-left:4px solid #64748b;background:#f1f5f9;">
    <i class="fas fa-lock" aria-hidden="true" style="color:#64748b;">🔒</i>
    <p><strong>표본 부족 — 개인 식별 방지</strong></p>
    <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.6;">
      ${escapeHtml(label||'선택한 범위')}의 표본 수가 ${n}건으로 최소 기준(${threshold}) 미만입니다.
      개인이 식별될 수 있어 결과를 표시하지 않습니다. 기간이나 범위를 더 넓게 선택하세요.
    </p>
  </div>`;
  return false;
}

// 행 단위 셀 마스킹: n<threshold 행의 민감 컬럼을 '***'로 치환 (원본 n/비율만 유지)
function _cellSuppress(rows, opts){
  opts = opts || {};
  const nKey = opts.nKey || 'n';
  const threshold = opts.threshold || 5;
  const maskKeys = opts.maskKeys || [];
  return rows.map(r => {
    if (Number(r[nKey]) < threshold) {
      const out = Object.assign({}, r, { _masked: true });
      maskKeys.forEach(k => { out[k] = '***'; });
      return out;
    }
    return r;
  });
}

// 퍼센타일 (0-100)
function _percentile(sorted, p){
  if (!sorted || !sorted.length) return 0;
  const idx = (sorted.length - 1) * (p/100);
  const lo = Math.floor(idx), hi = Math.ceil(idx);
  if (lo === hi) return sorted[lo];
  return sorted[lo] + (sorted[hi]-sorted[lo]) * (idx-lo);
}

// 시드드 PRNG (deterministic mock)
function _mulberry32(seed){
  return function(){
    let t = seed += 0x6D2B79F5;
    t = Math.imul(t ^ (t>>>15), t | 1);
    t ^= t + Math.imul(t ^ (t>>>7), t | 61);
    return ((t ^ (t>>>14)) >>> 0) / 4294967296;
  };
}

// 정규분포 근사 (Box-Muller)
function _gaussian(rng, mean, sd){
  const u = Math.max(1e-9, rng()), v = Math.max(1e-9, rng());
  return mean + sd * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
}

/* ---- 충북 스케일 상수 ---- */
const CB_REGIONS = ['청주교육지원청','충주교육지원청','제천교육지원청','보은교육지원청','옥천교육지원청','영동교육지원청','증평교육지원청','진천교육지원청','괴산교육지원청','음성교육지원청','단양교육지원청'];
const CB_SCHOOL_LEVELS = ['초등학교','중학교','고등학교'];

/* ---- Mock 교사 분포 (충북 ≈ 11,000명) ---- */
// Phase 2: /api/stats/teacher-index-dist?level=&region=&period= 연결 예정
function _mockTeacherIdxDist(filters){
  const n = Number(_adminTestHook('aIdxN')) || 11042;
  const rng = _mulberry32(20260422 + (filters.level==='초등학교'?1:filters.level==='중학교'?2:filters.level==='고등학교'?3:0));
  const scores = [];
  for (let i=0;i<n;i++){
    let v = _gaussian(rng, 62, 14);
    if (v<0) v=0; if (v>100) v=100;
    scores.push(Math.round(v*10)/10);
  }
  scores.sort((a,b)=>a-b);
  // 학교급별 교사분포
  const byLevel = {};
  CB_SCHOOL_LEVELS.forEach((lv,idx)=>{
    const cnt = Math.round(n * [0.55,0.28,0.17][idx]);
    const arr = [];
    const rng2 = _mulberry32(99 + idx*17);
    for (let i=0;i<cnt;i++){
      let v = _gaussian(rng2, 60+idx*3, 13);
      if (v<0) v=0; if (v>100) v=100;
      arr.push(v);
    }
    arr.sort((a,b)=>a-b);
    byLevel[lv] = arr;
  });
  return { n, scores, byLevel };
}

VIEWS['a-teacher-idx'] = async function(root){

  state._aIdxLevel  = state._aIdxLevel  || '';

  // 실 API 우선, n<10이면 mock fallback (프로토타입 단계 데모용)
  let dist = null;
  try {
    const qs = new URLSearchParams();
    if (state._aIdxLevel) qs.set('level', state._aIdxLevel);
    if (state._aIdxRegion) qs.set('region', state._aIdxRegion);
    const r = await fetch('/api/lrs/stats/teacher-index-dist?' + qs.toString(), { credentials:'include' });

      if (d && d.success && d.n >= 10) dist = { n:d.n, scores:d.scores, byLevel:d.byLevel };

        <select id="aIdxRegion">
          <option value="">전체</option>

  const body = document.getElementById('aIdxBody');

  //   퇴화 분포 → 0.0점 히스토그램만 덩그러니 뜨지 않게 친절 빈상태로 대체.
  const _maxScore = (scores && scores.length) ? Math.max.apply(null, scores) : 0;
  const _nzCount  = (scores || []).filter(v => Number(v) > 0).length;
  const _degenerate = !(_maxScore > 0) || (scores.length >= 10 && (_nzCount / scores.length) < 0.1);
  if (_degenerate) {
    const _msg = !(_maxScore > 0)
      ? `집계 대상 교사(${n.toLocaleString()}명)의 실행 활동(수업·콘텐츠·평가 운영 등)이 아직 없어 지수가 모두 0입니다.`
      : `집계 대상 교사(${n.toLocaleString()}명) 중 실행 활동(수업·콘텐츠·평가 운영 등)이 기록된 교사가 ${_nzCount.toLocaleString()}명뿐이라 분포를 표시하기 어렵습니다.`;
    body.innerHTML = `
      <section class="dc-state-panel" role="status" style="text-align:left;border-left:4px solid var(--lrs-primary);background:rgba(37,99,235,.06);">
        <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;">

            <p style="font-size:var(--fs-body);line-height:1.7;color:var(--gray-700);margin:0 0 6px;">

  const boxData = CB_SCHOOL_LEVELS.map(lv => {
    const arr = dist.byLevel[lv];
    if (!arr || arr.length < 5) return { lv, masked:true };
    return {
      lv,
      min: arr[0],
      p25: _percentile(arr,25),
      p50: _percentile(arr,50),
      p75: _percentile(arr,75),
      max: arr[arr.length-1],
      n: arr.length

  body.innerHTML = `

      ${kpiCard('평균',        mean.toFixed(1),           '점', {dir:'flat',text:`p10=${p10.toFixed(1)} · p95=${p95.toFixed(1)}`}, 'warning')}
    </section>
    <section class="dc-chart-grid">
      ${chartWrap('aIdxHist','실행지수 분포 (히스토그램)',`빈 폭 ${binWidth}점 · p10/p50/p90 기준선`,`중위값 ${p50.toFixed(1)}점, 상위 10% 기준 ${p90.toFixed(1)}점`)}
      ${chartWrap('aIdxBox','학교급별 박스플롯','p25·중위·p75 구간 (학교별 교사<5 셀은 마스킹)')}
    </section>
    ${maskedBins>0? `<p style="font-size:var(--fs-sm);color:var(--gray-600);margin-top:8px;">🔒 빈당 교사<10인 구간 ${maskedBins}개는 개인 식별 방지를 위해 숨겼습니다.</p>`:''}
    <section class="dc-state-panel" role="status" style="margin-top:12px;background:#eff6ff;border-left:4px solid #2563eb;">
      <p style="font-size:var(--fs-sm);color:var(--gray-700);line-height:1.6;">
        본 화면은 <strong>집계·분포</strong>만 제공합니다. 개별 교사 식별·랭킹·Top-K 표는 제공하지 않습니다 (개인정보 보호).
      </p>
    </section>`;

  // 히스토그램 + 기준선
  const lineAt = (val, color, label) => ({
    type:'line', xMin:val/binWidth - 0.5, xMax:val/binWidth - 0.5,
    borderColor:color, borderWidth:2, borderDash:[4,3], label:{display:true, content:label, color}
  });
  mkChart(document.getElementById('aIdxHist'),'bar',{
    labels: histLabels,
    datasets:[{ label:'교사 수', data: histData, backgroundColor:'#2563eb' }]
  }, {

      tooltip:{ callbacks:{ label:(ctx)=> `${ctx.parsed.y.toLocaleString()}명 (${bins[ctx.dataIndex].lo}-${bins[ctx.dataIndex].hi}점)` } } },
    scales:{ y:{ beginAtZero:true, title:{display:true,text:'교사 수'} }, x:{ title:{display:true,text:'실행지수 구간'} } }
  });

  // 박스플롯: Chart.js 기본만 사용 → floating bar (p25~p75) + p50 별도 점 datasets
  const labels = boxData.map(b=>b.lv);
  const boxes = boxData.map(b => b.masked ? [null,null] : [b.p25, b.p75]);
  const medians = boxData.map(b => b.masked ? null : b.p50);
  const mins = boxData.map(b => b.masked ? null : b.min);
  const maxs = boxData.map(b => b.masked ? null : b.max);
  mkChart(document.getElementById('aIdxBox'),'bar',{

function _dailyHourChart(canvasId, today, yesterday){
  const labels = Array.from({length:24}, (_,h)=> h+'시');

function _deltaTrend(curr, prev){
  const diff = (curr||0) - (prev||0);
  // 부류 G(부정 프레이밍) 교정: 학생 뷰에서는 감소를 빨강 ▼로 겁주지 않는다.
  //   감소/동일도 dir을 'flat'(중립 회색·· 기호)로 두고 격려 톤 문구를 붙인다. 교사/관리자는 기존대로.
  if (state.role === 'student'){
    if (diff > 0)  return { dir:'up',   text:`어제보다 +${diff} — 좋아요!` };
    if (diff < 0)  return { dir:'flat', text:`어제보다 ${diff} — 오늘 채워볼까요?` };
    return { dir:'flat', text:'어제와 비슷해요' };
  }
  return { dir: diff>0?'up':(diff<0?'down':'flat'), text: `어제 대비 ${diff>=0?'+':''}${diff}` };
}
