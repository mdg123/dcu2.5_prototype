/* =====================================================================
 * t-warnings → "성취 도달 현황" (중립·실행 프레임)
 *   T1 성취기준×학생 히트맵 + T3 미도달 명단표
 *   API: GET /api/lrs/mastery/class/:id
 *   기획서: LRS_성취수준_P0_시각스펙 §6(T1)·§7(T3)
 * ===================================================================== */
VIEWS['t-warnings'] = async function(root){
  root.innerHTML = tplLoading(3);
  const cid = await resolveClassId();
  const m = await apiGet('/api/lrs/mastery/class/' + encodeURIComponent(cid), {});
  if (!m || !m.success){
    root.innerHTML = tplError('성취 도달 데이터를 불러오지 못했습니다', () => setView('t-warnings'));
    return;
  }

  const students = m.students || [];          // [{id,name}] — masked면 익명
  const standards = m.standards || [];        // 취약순 정렬됨
  const matrix = m.matrix || {};              // {code:{userId:{status,rate}}}
  const dist = m.distribution || {};
  const masked = !!m.masked;

  if (!students.length || !standards.length){
    root.innerHTML = `<section class="mastery-section"><div class="mastery-empty">
      <i class="fas fa-table-cells me-icon" aria-hidden="true"></i>
      <p>아직 반 학생들의 성취 데이터가 충분하지 않아요. 평가·학습이 쌓이면 히트맵이 채워져요.</p>
    </div></section>`;
    return;
  }

  // 교과 필터 옵션 (실데이터에서 추출)
  // ⚠ 같은 교과명(예: "수학")에 학교급별 subject_code가 여러 개(math-e/m/h) 존재 →
  //   교과명 기준으로 묶어 하나의 옵션으로 노출. value = 해당 교과명의 모든 코드(콤마결합).
  //   (코드별 옵션을 그대로 쓰면 "수학" 선택 시 다른 학교급 수학 행이 남아 필터가 망가져 보임)
  const subjGroups = new Map();   // label → Set(subject_code)
  standards.forEach(s => {
    if (!s.subject_code) return;
    const label = s.subject || s.subject_code;
    if (!subjGroups.has(label)) subjGroups.set(label, new Set());
    subjGroups.get(label).add(s.subject_code);
  });
  const subjects = [...subjGroups.entries()].map(([label, codeSet]) => ({
    label, codes: [...codeSet], value: [...codeSet].join(',')
  }));

  const totalEval = (dist.reached||0)+(dist.partial||0)+(dist.not_reached||0);
  root.innerHTML = `
    <!-- T1 히트맵 -->
    <section class="mastery-section" id="tMasterySection">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2">성취기준 × 학생 도달 현황</h2>
          <div class="mastery-sub">셀을 누르면 학생·성취기준 상세를 볼 수 있어요. ${masked ? '<span class="mastery-chip-gray" style="margin-left:6px;"><i class="fas fa-user-shield"></i> 타 반 — 이름 익명</span>' : ''}</div>
        </div>
        <div class="ms-controls">
          <select class="ms-select" id="tMastSort" aria-label="행 정렬">
            <option value="weak">반 평균 낮은 순</option>
            <option value="code">코드순</option>
          </select>
          ${subjects.length > 1 ? `<select class="ms-select" id="tMastSubject" aria-label="교과 필터">
            <option value="">전체 교과</option>
            ${subjects.map(s=>`<option value="${escapeAttr(s.value)}">${escapeHtml(s.label)}</option>`).join('')}
          </select>` : ''}
        </div>
      </div>
      <div id="tHeatmapHost"></div>
      <div id="tHeatmapMore" style="margin-top:12px;text-align:center;"></div>
      ${masteryLegend()}
    </section>

    <!-- T3 미도달 명단표 -->
    <section class="mastery-section" id="tNotReachedSection">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2">보충이 필요한 성취기준</h2>
          <div class="mastery-sub">미도달 학생이 있는 성취기준이에요. 추천 학습을 배정해 도달을 도와요.</div>
        </div>
        <div class="ms-controls"><span class="mastery-btn mastery-btn-sm" style="background:#cbd5e1;cursor:not-allowed;" title="반 전체 보충 배정은 다음 단계(P1)에 제공됩니다" aria-disabled="true"><i class="fas fa-layer-group"></i> 반 전체 배정(준비 중)</span></div>
      </div>
      <div id="tNotReachedTable"></div>
    </section>

    <!-- T-TREND 학생별 성취 추세 스파크라인 -->
    <section class="mastery-section" id="tTrendSection">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2"><i class="fas fa-chart-line" aria-hidden="true" style="color:#2563eb;"></i> 학생별 성취 추세</h2>
          <div class="mastery-sub">최근 8주 정답률 기울기 · <span style="color:var(--trend-up);font-weight:700;">↗ 오르는 중</span> · <span style="color:var(--trend-flat);font-weight:700;">→ 비슷</span> · <span style="color:var(--trend-down);font-weight:700;">↘ 어려워지는 중</span></div>
        </div>
        <div class="ms-controls" id="tTrendConf"></div>
      </div>
      <div id="tTrendHost"></div>
    </section>

    <!-- T-PROG 학기말 도달 외삽 -->
    <section class="mastery-section" id="tProgSection">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2"><i class="fas fa-bullseye" aria-hidden="true" style="color:#2563eb;"></i> 학기말 도달 외삽</h2>
          <div class="mastery-sub" id="tProgHeadline">실선=지금까지, 점선=예상 범위(추정). 폭이 넓을수록 불확실해요.</div>
        </div>
        <div class="ms-controls" id="tProgConf"></div>
      </div>
      <div class="chart-body" id="tProgBody" style="height:280px;">
        <canvas id="tProgChart" role="img" aria-label="학기말 도달 외삽 차트"></canvas>
      </div>
      <div id="tProgFoot"></div>
    </section>

    <!-- B6: 정서-참여 교차 (하단 append) -->
    <div id="tEmotionEngageHost" style="margin-top:16px;"></div>`;

  // ── 상태 관리 (정렬·필터·행수) ─────────────────────────────────────
  const tState = { sort:'weak', subject:'', expanded:false, rowLimit:12 };

  // tState.subject 는 교과명에 묶인 subject_code들의 콤마결합값(예: "math-e,math-m,math-h")
  function subjectMatch(code){
    if (!tState.subject) return true;
    return tState.subject.split(',').includes(code);
  }

  function filterStds(){
    let list = standards.slice();
    if (tState.subject) list = list.filter(s => subjectMatch(s.subject_code));
    if (tState.sort === 'code') list.sort((a,b)=> String(a.code).localeCompare(String(b.code),'ko'));
    else { // weak: 도달률 낮은 순(미평가는 뒤로) — BE 기본정렬이지만 필터 후 재보장
      list.sort((x,y)=>{ const xr = x.reachedRate==null?Infinity:x.reachedRate; const yr = y.reachedRate==null?Infinity:y.reachedRate; return xr-yr; });
    }
    return list;
  }

  function cellState(code, uid){
    const c = matrix[code] && matrix[code][uid];
    if (!c) return { state:'none', rate:null };
    return { state: normStatus(c.status), rate: c.rate };
  }

  // ── T1 데스크탑 히트맵(table) + 모바일 카드형(전치) ─────────────────
  function renderHeatmap(){
    const all = filterStds();
    const rows = tState.expanded ? all : all.slice(0, tState.rowLimit);
    const host = document.getElementById('tHeatmapHost');

    // 데스크탑 table
    const thead = `<thead><tr>
      <th class="corner">성취기준 \\ 학생</th>
      ${students.map(st=>`<th title="${escapeAttr(st.name)}">${escapeHtml(st.name)}</th>`).join('')}
      <th class="summary-h">반 평균</th><th class="summary-h">도달수</th>
    </tr></thead>`;
    const tbody = `<tbody>${rows.map(s => {
      const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
      const cells = students.map(st => {
        const { state, rate } = cellState(s.code, st.id);
        const txt = state==='insufficient' ? '–' : (state==='none' ? '' : (rate==null?'':Math.round(rate)));
        const stateKo = MASTERY_KO[state] || '데이터 없음';
        return `<td class="cell" data-state="${state}" data-code="${escapeAttr(s.code)}" data-uid="${escapeAttr(st.id)}"
          data-sname="${escapeAttr(st.name)}" data-rate="${rate==null?'':rate}" tabindex="0"
          role="button" aria-label="${escapeAttr(st.name+' '+codeBare+' '+stateKo)}">${txt}</td>`;
      }).join('');
      const evalN = s.evaluated || 0;
      const rr = s.reachedRate == null ? '—' : (s.reachedRate + '%');
      return `<tr>
        <th data-code="${escapeAttr(s.code)}" title="${escapeAttr(s.label||codeBare)}">${escapeHtml(s.label||codeBare)} <span class="mh-code">[${escapeHtml(codeBare)}]</span></th>
        ${cells}
        <td class="summary">${rr}</td><td class="summary">${s.reached}/${evalN||'-'}</td>
      </tr>`;
    }).join('')}</tbody>`;

    // 모바일 카드형 (성취기준별 4상태 누적바)
    const cardHtml = rows.map(s => {
      const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
      const tot = (s.reached||0)+(s.partial||0)+(s.notReached||0)+(s.insufficient||0) || 1;
      const seg = (k,n)=> n>0 ? `<span class="${k}" style="flex-basis:${(n/tot*100).toFixed(1)}%"></span>` : '';
      return `<div class="mastery-card">
        <div class="mc-title">${escapeHtml(s.label||codeBare)}</div>
        <div class="mc-sub">[${escapeHtml(codeBare)}] · ${escapeHtml(s.subject||'')} · 반 평균 ${s.reachedRate==null?'—':s.reachedRate+'%'}</div>
        <div class="mastery-stack">${seg('reached',s.reached)}${seg('partial',s.partial)}${seg('notReached',s.notReached)}${seg('insufficient',s.insufficient)}</div>
        <div class="mc-counts">
          <span><b>${s.reached||0}</b> 도달</span><span><b>${s.partial||0}</b> 부분</span>
          <span><b>${s.notReached||0}</b> 미도달</span><span><b>${s.insufficient||0}</b> 평가부족</span>
        </div>
        ${s.notReached>0 ? `<div class="mc-action"><button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" data-nrcode="${escapeAttr(s.code)}"><i class="fas fa-users"></i> 미도달 학생 보기</button></div>`:''}
      </div>`;
    }).join('');

    host.innerHTML = `
      <div class="mastery-heatmap-wrap"><table class="mastery-heatmap">${thead}${tbody}</table></div>
      <div class="mastery-cardview">${cardHtml}</div>`;

    // 더보기 토글
    const moreHost = document.getElementById('tHeatmapMore');
    if (all.length > tState.rowLimit){
      moreHost.innerHTML = `<button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" id="tHeatmapToggle">
        ${tState.expanded ? '접기' : `전체 ${all.length}개 보기`}</button>`;
      document.getElementById('tHeatmapToggle').addEventListener('click', ()=>{ tState.expanded = !tState.expanded; renderHeatmap(); });
    } else moreHost.innerHTML = '';

    bindHeatmapEvents(host);
  }

  function bindHeatmapEvents(host){
    // 셀 hover 툴팁
    host.querySelectorAll('td.cell').forEach(td => {
      const show = (ev) => {
        const state = td.getAttribute('data-state');
        const sname = td.getAttribute('data-sname');
        const code = String(td.getAttribute('data-code')||'').replace(/^\[|\]$/g,'');
        const rate = td.getAttribute('data-rate');
        let body;
        if (state === 'none') body = `${escapeHtml(sname)} · ${escapeHtml(code)}<br>데이터 없음`;
        else if (state === 'insufficient') body = `${escapeHtml(sname)} · ${escapeHtml(code)}<br>평가 부족 · 3회 미만 풀어 판정 불가`;
        else body = `${escapeHtml(sname)} · ${escapeHtml(code)}<br>${MASTERY_KO[state]}${rate!==''?` · 정답률 ${Math.round(rate)}%`:''}`;
        const r = td.getBoundingClientRect();
        MasteryTip.show(body, r.right, r.top);
      };
      td.addEventListener('mouseenter', show);
      td.addEventListener('focus', show);
      td.addEventListener('mouseleave', ()=> MasteryTip.hide());
      td.addEventListener('blur', ()=> MasteryTip.hide());
      const act = () => openCellDetail(td);
      td.addEventListener('click', act);
      td.addEventListener('keydown', (e)=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
    });
    // 행 제목 클릭 → T3로 스크롤
    host.querySelectorAll('.mastery-heatmap tbody th[data-code]').forEach(th => {
      th.addEventListener('click', ()=>{ const sec = document.getElementById('tNotReachedSection'); if (sec) sec.scrollIntoView({behavior:'smooth',block:'start'}); });
    });
    // 모바일 카드 "미도달 학생 보기"
    host.querySelectorAll('button[data-nrcode]').forEach(b => {
      b.addEventListener('click', ()=>{ const sec = document.getElementById('tNotReachedSection'); if (sec) sec.scrollIntoView({behavior:'smooth',block:'start'}); });
    });
  }

  function openCellDetail(td){
    const code = td.getAttribute('data-code');
    const uid = td.getAttribute('data-uid');
    const sname = td.getAttribute('data-sname');
    const state = td.getAttribute('data-state');
    const rate = td.getAttribute('data-rate');
    const std = standards.find(s => s.code === code) || {};
    const codeBare = String(code||'').replace(/^\[|\]$/g,'');
    LRS.openMasteryDrawer({
      title: sname,
      bodyHtml: `
        <p style="font-size:14px;color:#4b5563;line-height:1.7;">
          <strong style="color:#1f2937;">${escapeHtml(std.label||codeBare)}</strong><br>
          [${escapeHtml(codeBare)}] · ${escapeHtml(std.subject||'')}
        </p>
        <div style="margin:14px 0;padding:14px;border-radius:10px;background:var(--mastery-${state==='notReached'?'notreached':state}-soft,#f3f4f6);">
          <span class="mastery-badge ${state}">${MASTERY_KO[state]||'데이터 없음'}</span>
          ${rate!==''?`<span style="margin-left:8px;font-weight:700;color:#1f2937;">정답률 ${Math.round(rate)}%</span>`:''}
        </div>
        <button type="button" class="mastery-btn mastery-btn-sm" id="drwRecommend" data-uid="${escapeAttr(uid)}" data-code="${escapeAttr(code)}">
          <i class="fas fa-wand-magic-sparkles"></i> 이 학생에게 보충 배정
        </button>`
    });
  }

  document.getElementById('tMastSort').addEventListener('change', (e)=>{ tState.sort = e.target.value; tState.expanded=false; renderHeatmap(); });
  const subSel = document.getElementById('tMastSubject');
  if (subSel) subSel.addEventListener('change', (e)=>{ tState.subject = e.target.value; tState.expanded=false; renderHeatmap(); renderNotReached(); });
  window.addEventListener('resize', ()=>{ MasteryTip.hide(); });

  renderHeatmap();

  // ── T3 미도달 명단표 ─────────────────────────────────────────────────
  function renderNotReached(){
    const host = document.getElementById('tNotReachedTable');
    let list = standards.filter(s => (s.notReached||0) > 0);
    if (tState.subject) list = list.filter(s => subjectMatch(s.subject_code));
    list.sort((a,b)=> (a.avgRate==null?Infinity:a.avgRate) - (b.avgRate==null?Infinity:b.avgRate));
    if (!list.length){
      host.innerHTML = `<div class="mastery-empty"><i class="fas fa-face-smile me-icon" style="color:#86efac;"></i>
        <p>보충이 필요한 학생이 없어요. 반 전체가 잘 따라오고 있어요! 🎉</p></div>`;
      return;
    }
    // recommendations 룩업 (weakTop에 추천 포함)
    const recByCode = {};
    (m.weakTop||[]).forEach(w => { recByCode[w.code] = (w.recommendations||[])[0] || null; });

    renderDataTable(host, {
      columns:[
        { key:'label', label:'성취기준', format:(_,r)=>{
            const codeBare = String(r.code||'').replace(/^\[|\]$/g,'');
            return `<div style="max-width:280px;"><div style="font-weight:600;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.label||codeBare)}</div><div style="font-size:12px;color:#9ca3af;">[${escapeHtml(codeBare)}] · ${escapeHtml(r.subject||'')}</div></div>`;
          } },
        { key:'_nr', label:'미도달 학생', format:(_,r)=>{
            const nr = r.notReachedStudents || [];
            const shown = nr.slice(0,3).map(u=>`<span class="nr-chip">${escapeHtml(u.name)}</span>`).join('');
            const more = nr.length>3 ? `<span class="nr-chip" style="background:#f3f4f6;color:#4b5563;border-color:#e5e7eb;">외 ${nr.length-3}명</span>` : '';
            return `<div class="nr-chips">${shown||'<span style="color:#9ca3af;">-</span>'}${more}</div>`;
          } },
        { key:'avgRate', label:'평균 정답률', align:'right', format:(v)=>{
            if (v==null) return '-';
            const color = v<50 ? MASTERY_HEX.notReached : v<80 ? MASTERY_HEX.partial : MASTERY_HEX.reached;
            return `${v}%<span class="rate-dot" style="background:${color};"></span>`;
          } },
        { key:'_rec', label:'추천 보충', format:(_,r)=>{
            const rec = recByCode[r.code];
            if (!rec) return '<span style="color:#9ca3af;font-size:13px;">준비 중</span>';
            return `<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span style="font-size:13px;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;"><i class="fas ${recTypeIcon(rec.type)}"></i> ${escapeHtml(rec.title||'추천 콘텐츠')}</span>
              <button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" data-assign="${escapeAttr(r.code)}" data-recid="${escapeAttr(rec.id)}" data-rectitle="${escapeAttr(rec.title||'')}">배정</button>
            </div>`;
          } }
      ],
      rows: list,
      initialSort:'avgRate', initialDir:'asc'
    });

    // 배정 버튼 — P0: 확인 토스트(목업). 실제 일괄 배정 API는 P1.
    host.querySelectorAll('button[data-assign]').forEach(btn => {
      btn.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const title = btn.getAttribute('data-rectitle') || '추천 콘텐츠';
        if (confirm(`[${title}]을(를) 미도달 학생에게 배정할까요?\n(개별 배정은 다음 단계에서 실제 연동됩니다)`)){
          btn.outerHTML = `<span class="mastery-badge reached"><i class="fas fa-check"></i> 배정됨</span>`;
        }
      });
    });
  }
  renderNotReached();

  // ── T-TREND + T-PROG (분석·예측 P0) — 비동기 후행 로드 ──────────────────
  (async () => {
    const [ews, ctrend] = await Promise.all([
      apiGet('/api/lrs/ews/class/' + encodeURIComponent(cid)),
      apiGet('/api/lrs/trend/class/' + encodeURIComponent(cid))
    ]);
    renderTrendTable(ews);
    renderClassProjection(ctrend);
  })();

  // T-TREND: 학생별 추세 표(데스크탑) + 카드(모바일)
  function renderTrendTable(ews){
    const host = document.getElementById('tTrendHost');
    const confHost = document.getElementById('tTrendConf');
    if (!host) return;
    if (!ews || !ews.success){
      host.innerHTML = `<div class="mastery-empty"><i class="fas fa-chart-line me-icon"></i><p>학생별 추세 데이터를 불러오지 못했어요.</p></div>`;
      return;
    }
    // masked 여부로 빈처리하지 않는다. BE가 준 이름(실명/익명) 그대로 렌더.
    const rows = (ews.risk && ews.risk.list) || [];
    if (!rows.length){
      host.innerHTML = `<div class="mastery-empty"><i class="fas fa-chart-line me-icon"></i><p>아직 추세를 볼 데이터가 부족해요. 더 풀면 학생별 추세가 나타나요.</p></div>`;
      return;
    }
    // 반 전체 신뢰(class trend) 배지를 우상단에 (개별 학생 신뢰는 행별 처리)
    const ct = ews.classTrend;
    if (confHost && ct && ct.status === 'ok'){
      confHost.innerHTML = confBadge(ct.confidence, ct.confidenceKo, `관측 ${ct.observedWeeks||0}주${ct.lowVariance?' · 변동 큼':''}`);
    }
    // masked=true(관리자 거시·타반)면 우상단에 익명 안내칩 1개. 담임(masked=false)은 안내칩 없이 실명.
    if (ews.masked && confHost){
      confHost.insertAdjacentHTML('beforeend', '<span class="mastery-chip-gray" style="margin-left:6px;"><i class="fas fa-user-shield"></i> 타 반 — 이름 익명</span>');
    }
    // 하락 추세 위로(지원 우선), 그다음 정체·상승. lowSample은 맨 아래.
    const order = { down:0, flat:1, up:2, insufficient:3 };
    const sorted = rows.slice().sort((a,b)=>{
      const da = a.observedWeeks < 3 ? 'insufficient' : normTrendDir(a.trendDirection);
      const dbb = b.observedWeeks < 3 ? 'insufficient' : normTrendDir(b.trendDirection);
      return (order[da]-order[dbb]) || ((a.trendSlope||0)-(b.trendSlope||0));
    });

    function rowParts(r){
      const lowSample = (r.observedWeeks||0) < 3;
      const dir = normTrendDir(r.trendDirection);
      const slope = r.trendSlope;
      const r2note = '';
      const hint = lowSample ? `관측 ${r.observedWeeks||0}주 · 표본 적어 참고용`
        : `최근 ${r.observedWeeks||0}주 정답률 기울기 ${slope==null?'-':((slope>0?'+':'')+slope)}%p/주`;
      // 스파크라인: series 미제공이므로 OLS 기울기로 추세 직선 합성(현재율 미상이면 부족 표시)
      const synth = lowSample ? null : synthLineFromSlope(50, slope, r.observedWeeks); // 절대값 미상 → 중앙 기준 상대선
      const sparkOk = !lowSample && synth;
      const spark = sparkOk ? sparklineSvg(synth, dir, { aria:`${r.name} 추세` }) : `<span class="trend-note">추세 데이터 부족</span>`;
      const arrow = lowSample ? '<span class="trend-note">—</span>' : trendArrow(dir, slope, hint);
      const note = lowSample ? `관측 ${r.observedWeeks||0}주` : '';
      return { name:r.name, spark, arrow, note, hint };
    }

    // 데스크탑 표
    const trHtml = sorted.map(r => {
      const p = rowParts(r);
      return `<tr>
        <td class="t-name">${escapeHtml(p.name||'')}</td>
        <td title="${escapeAttr(p.hint||'')}">${p.spark}</td>
        <td>${p.arrow}</td>
        <td class="trend-note">${escapeHtml(p.note||'')}</td>
      </tr>`;
    }).join('');
    // 모바일 카드
    const cardHtml = sorted.map(r => {
      const p = rowParts(r);
      return `<div class="trend-card">
        <div class="tc-top"><span class="tc-name">${escapeHtml(p.name||'')}</span>${p.arrow}</div>
        ${p.spark}
        ${p.note ? `<div class="trend-note" style="margin-top:6px;">${escapeHtml(p.note)}</div>` : ''}
      </div>`;
    }).join('');

    host.innerHTML = `
      <div class="trend-table-wrap">
        <table class="trend-table">
          <thead><tr><th>학생</th><th>최근 8주 추이</th><th>추세</th><th>비고</th></tr></thead>
          <tbody>${trHtml}</tbody>
        </table>
      </div>
      <div class="trend-cards">${cardHtml}</div>`;
  }

  // T-PROG: 반 평균 도달 외삽(점선 밴드)
  function renderClassProjection(ctrend){
    const body = document.getElementById('tProgBody');
    const headline = document.getElementById('tProgHeadline');
    const confHost = document.getElementById('tProgConf');
    const foot = document.getElementById('tProgFoot');
    if (!body) return;
    const trend = ctrend && ctrend.trend;
    const proj = ctrend && ctrend.projection;
    const target = (ctrend && ctrend.target) || 80;
    if (!ctrend || !ctrend.success || !trend || trend.status !== 'ok'){
      body.closest('.mastery-section').querySelector('#tProgBody').outerHTML =
        `<div class="mastery-empty"><i class="fas fa-bullseye me-icon"></i><p>학기말 도달 예상을 그리려면 추세 데이터가 더 필요해요. 학습이 쌓이면 표시됩니다.</p></div>`;
      if (headline) headline.textContent = '실선=지금까지, 점선=예상 범위(추정). 폭이 넓을수록 불확실해요.';
      if (confHost) confHost.innerHTML = '';
      return;
    }
    if (confHost) confHost.innerHTML = confBadge(trend.confidence, trend.confidenceKo, `관측 ${trend.observedWeeks||0}주${trend.lowVariance?' · 변동 큼':''}`);
    const reachable = proj && proj.reachable && proj.weeksToReach != null;
    if (headline){
      if (reachable) headline.innerHTML = `<span class="proj-headline">목표 ${target}% · <strong>이 속도면 약 ${proj.weeksToReach}주 후 도달 예상</strong></span>`;
      else headline.innerHTML = `<span class="proj-headline warn">목표 ${target}% · <strong>현재 추세로는 도달이 어려워요(보충 권장)</strong></span>`;
    }
    const cfg = buildProjChartData(trend, proj, { target });
    const boundaryIndex = cfg.boundaryIndex;
    const ctx = document.getElementById('tProgChart');
    mkChart(ctx, 'line', cfg, {
      scales:{
        y:{ min:0, max:100, ticks:{ callback:v=>v+'%', font:{size:12} } },
        x:{ ticks:{ font:{size:11}, maxRotation:0, autoSkip:true, maxTicksLimit: window.innerWidth<768?6:10 },
            grid:{ color:(c)=> c.index===boundaryIndex ? '#d1d5db' : 'rgba(0,0,0,.04)' } }
      },
      plugins:{
        legend:{ display:true, position:'bottom', labels:{ font:{size:12}, usePointStyle:true, boxWidth:14, padding:10,
          filter:(item)=> !/^예상 (상단|하단)$/.test(item.text) } },
        tooltip:{ callbacks:{ label:(c)=>{ const v=c.parsed.y; if(v==null) return null; return `${c.dataset.label}: ${v}%`; } } }
      }
    });
    if (foot) foot.innerHTML = projDisclaimer((ctrend && ctrend.disclaimer) || '이 추정은 규칙 기반이며 실제와 다를 수 있어요.');
  }

  // B6 "정서-참여 교차" — 반 2×2 산점 (담임/담당, 하단 append)
  await renderEmotionEngage(document.getElementById('tEmotionEngageHost'));
};

// 관리자 views 공통: period 파라미터 붙여 호출 (apiGet은 state.period 자동 부착)
async function adminFetchWithPeriod(path, period){
  try {
    const params = new URLSearchParams();
    if (period) params.set('period', period);
    if (_shouldAttachScope(path)){
      const sc = state.scope || computeScope();
      if (sc) params.set('scope', sc);
    }
    const qs = params.toString();
    const r = await fetch(path + (qs?'?'+qs:''), { credentials:'include' });
    if (!r.ok) return null;
    return await r.json();
  } catch(_){ return null; }
}

/* ---- 증감 화살표 trend 객체 (전주/직전 대비) ---- */
function _arrowTrend(delta, unit){
  const d = Number(delta)||0;

}

      datasets:[{ label:'활동 건수', data: wt.map(w=>w.count||0), borderColor:'var(--chart-1)', backgroundColor:'rgba(37,99,235,.1)', fill:true, tension:.3, pointRadius:3 }]
    }, { scales:{ y:{ beginAtZero:true } } });
  } else {
    document.getElementById('aHomeWeek').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>주간 활동 추이</h2></header>` + _seedHintEmpty();
  }

  // 오늘 스냅샷
  document.getElementById('aHomeSnapshot').innerHTML = `
    <ul style="list-style:none;padding:0;margin:0;font-size:var(--fs-body);">
      <li style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">오늘 활동량 <strong>${(k.todayActs||0).toLocaleString()}건</strong></li>
      <li style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">오늘 활동자(DAU) <strong>${(k.dau||0).toLocaleString()}명</strong></li>
      <li style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--gray-100);">최근 7일 활동자(WAU) <strong>${(k.wau||0).toLocaleString()}명</strong></li>
      <li style="display:flex;justify-content:space-between;padding:10px 0;">기간 활동량(${state.period}) <strong>${(k.periodActs||0).toLocaleString()}건</strong></li>
    </ul>`;

  // 학교급 미니카드
  const lv = d.byLevel || [];
  document.getElementById('aHomeLevels').innerHTML = lv.map(l => `
    <div class="mini">
      <div class="lv">${escapeHtml(l.label)}</div>
      <div class="row"><span>학생 수</span><b>${(l.students||0).toLocaleString()}명</b></div>
      <div class="row"><span>기간 활동</span><b>${(l.acts||0).toLocaleString()}건</b></div>
    </div>`).join('') || _seedHintEmpty('학교급 데이터가 없어요');
};

/* ======================================================================
 * ② 서비스 운영 진단 (a-svc-ops)
 *    사용률 가로 막대 랭킹 + 추세Δ 칩 + 룰베이스 진단 카드 + 운영 점수 표
 * ==================================================================== */
// 진단 권고 문구 룰 (기획서 4-1·E장) — status/severity/reason → 한국어 자연문
function _svcRecommendation(s){
  const name = s.service_label || s.service;
  const share = s.share;
  switch (s.status){
    case '거의 미사용':
      return `${name} 사용률이 전체의 ${share}%에 그칩니다. 진입 동선 노출을 점검하거나 교사 연수·안내를 권고합니다.`;
    case '저활용·정체':
      return `${name}이(가) 최근 ${state.period.replace('d','일')} 정체 상태입니다. 활용 사례·템플릿 제공을 검토하세요.`;
    case '저활용·성장중':
      return `${name}은(는) 점유율은 낮으나(${share}%) 추세가 상승 중입니다. 노출을 확대하면 안착이 기대됩니다.`;
    case '사용 급감':
      return `${name} 활동이 직전 기간 대비 ${Math.abs(s.trendDelta)}% 감소했습니다. 장애·정책 변경 여부 점검이 필요합니다.`;
    default:
      return `${name}은(는) 정상 범위입니다.`;
  }
}
function _deltaChip(delta){
  const d = Number(delta)||0;
  const cls = d>0?'up':d<0?'down':'flat';
  const arrow = d>0?'▲':d<0?'▼':'·';
  return `<span class="delta ${cls}">${arrow} ${d>=0?'+':''}${d}%</span>`;
}
VIEWS['a-svc-ops'] = async function(root){
  root.innerHTML = tplLoading(3);
  const d = await apiGet('/api/lrs/stats/service-ops');
  if (!d || !d.success){ root.innerHTML = tplError('서비스 운영 데이터를 불러오지 못했습니다', ()=>setView('a-svc-ops')); return; }
  const services = (d.services||[]);
  if (!services.length){ root.innerHTML = _seedHintEmpty('집계된 서비스 활동이 없어요'); return; }
  const top = services[0], bottom = services[services.length-1];
  const maxCnt = Math.max.apply(null, services.map(s=>s.count)) || 1;
  const underused = d.underused || [];

  root.innerHTML = `
    <div class="dc-kpi-grid">
      ${kpiCard('운영 서비스', (d.operatingServices||services.length), '종', {dir:'flat',text:'활동 기록 기준'}, 'primary')}
      ${kpiCard('최다 서비스', escapeHtml(top.service_label||top.service), '', {dir:'up',text:`${top.count.toLocaleString()}건 · ${top.share}%`}, 'success')}
      ${kpiCard('최소 서비스', escapeHtml(bottom.service_label||bottom.service), '', {dir:'down',text:`${bottom.count.toLocaleString()}건 · ${bottom.share}%`}, 'warning')}
      ${kpiCard('개선 필요',   (d.underusedCount||underused.length), '종', {dir:underused.length?'down':'flat',text:'진단 발동'}, underused.length?'danger':'primary')}
    </div>
    <section class="dc-chart-wrapper">
      <header><h2>서비스별 사용률 랭킹</h2><div class="subtitle">활동 건수 · 추세Δ(직전 동기간 대비) · 재방문율</div></header>
      <div class="dc-svc-rank" id="aSvcRank"></div>
    </section>
    <section style="margin-top:var(--space-4);">
      <h2 style="font-size:var(--fs-h2);margin:0 0 10px;">개선 필요 서비스 진단</h2>
      <div class="dc-diag-grid" id="aSvcDiag"></div>
    </section>
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>서비스 운영 점수표</h2><div class="subtitle">건수·고유사용자·평균시간·추세·재방문·상태 (정렬 가능)</div></header>
      <div id="aSvcTable"></div>
    </section>

    <!-- A-WEAK 취약 성취기준 추세 랭킹 -->
    <section class="mastery-section" id="aWeakSection" style="margin-top:var(--space-4);">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2"><i class="fas fa-arrow-trend-down" aria-hidden="true" style="color:#ea7317;"></i> 취약 성취기준 추세 랭킹</h2>
          <div class="mastery-sub">도달률이 낮고 하락 중인 성취기준이에요. 표본이 클수록 신뢰돼요.</div>
        </div>
        <div class="ms-controls" id="aWeakConf"></div>
      </div>
      <div id="aWeakHost"></div>
      <div id="aWeakFoot"></div>
    </section>`;

  // 가로 막대 랭킹
  document.getElementById('aSvcRank').innerHTML = services.map(s => {
    const pct = Math.round((s.count/maxCnt)*100);
    const rowCls = s.service===top.service ? 'top' : s.service===bottom.service ? 'bottom' : '';
    return `<div class="row ${rowCls}">
      <span class="name" title="${escapeAttr(s.service_label||s.service)}">${escapeHtml(s.service_label||s.service)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${pct}%;"></span></span>
      <span class="meta"><span class="cnt">${s.count.toLocaleString()}</span><span style="color:var(--gray-500);font-size:var(--fs-sm);">${s.share}%</span>${_deltaChip(s.trendDelta)}</span>
    </div>`;
  }).join('');

  // 진단 카드 (룰베이스 권고)
  const diagEl = document.getElementById('aSvcDiag');
  if (underused.length){
    diagEl.innerHTML = underused.map(s => `
      <div class="dc-diag-card" data-sev="${escapeAttr(s.severity)}">
        <div class="dc-diag-head">
          <span class="dc-diag-svc">${escapeHtml(s.service_label||s.service)}</span>
          <span class="dc-diag-status">${escapeHtml(s.status)}</span>
        </div>
        <div class="dc-diag-msg">${escapeHtml(_svcRecommendation(s))}</div>
        <div class="dc-diag-metrics">
          <span>점유율 <b>${s.share}%</b></span>
          <span>추세 <b>${s.trendDelta>=0?'+':''}${s.trendDelta}%</b></span>
          <span>고유사용자 <b>${(s.uniqueUsers||0).toLocaleString()}명</b></span>
        </div>
      </div>`).join('');
  } else {
    diagEl.innerHTML = `<div class="dc-diag-card" data-sev="ok">
      <div class="dc-diag-head"><span class="dc-diag-svc">전체 정상</span><span class="dc-diag-status" style="color:#15803d;background:#dcfce7;">정상</span></div>
      <div class="dc-diag-msg">현재 기간 기준 저활용·미사용으로 진단된 서비스가 없습니다.</div>
    </div>`;
  }

  // 운영 점수표
  renderDataTable(document.getElementById('aSvcTable'), {
    columns:[
      { key:'service_label', label:'서비스', format:(v,r)=>escapeHtml(v||r.service) },
      { key:'count',         label:'건수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'share',         label:'점유율', align:'right', format:v=>escapeHtml(v+'%') },
      { key:'uniqueUsers',   label:'고유사용자', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
      { key:'avgMinPerUser', label:'평균시간(분)', align:'right', format:v=>escapeHtml(String(v??0)) },
      { key:'trendDelta',    label:'추세Δ', align:'right', format:v=>escapeHtml((v>=0?'+':'')+v+'%') },
      { key:'revisitRate',   label:'재방문율', align:'right', format:v=>escapeHtml(v+'%') },
      { key:'status',        label:'상태', format:(v,r)=>{
          const color = r.severity==='critical'?'#dc2626':r.severity==='warn'?'#b45309':r.severity==='caution'?'#a16207':'#15803d';
          return `<span style="color:${color};font-weight:600;">${escapeHtml(v)}</span>`;
        } }
    ],
    rows: services, initialSort:'count', initialDir:'desc'
  });

  // ── A-WEAK 취약 성취기준 추세 랭킹 — 후행 로드 ─────────────────────────
  (async () => {
    const w = await apiGet('/api/lrs/weak-trend', { scope:'all', limit:15 });
    renderWeakTrend(w);
  })();
};

/* A-WEAK 렌더(관리자) — renderDataTable + 인라인 도달 Bar(4상태색) + 추세 화살표 + 표본수 */
function renderWeakTrend(w){
  const host = document.getElementById('aWeakHost');
  const confHost = document.getElementById('aWeakConf');
  const foot = document.getElementById('aWeakFoot');
  if (!host) return;
  if (!w || !w.success){
    host.innerHTML = `<div class="mastery-empty"><i class="fas fa-arrow-trend-down me-icon"></i><p>취약 추세 데이터를 불러오지 못했어요.</p></div>`;
    return;
  }
  const rows = (w.ranking || []);
  if (!rows.length){
    host.innerHTML = `<div class="mastery-empty"><i class="fas fa-face-smile me-icon" style="color:#86efac;"></i>
      <p>전반적으로 하락 중인 성취기준이 없어요. 안정적인 추세예요.</p></div>`;
    return;
  }
  // 전체 신뢰(표본 기준) — 가장 보수적 단위로 표시
  if (confHost){
    const conf = w.masked ? 'low' : 'high';
    confHost.innerHTML = confBadge(conf, w.masked ? '낮음' : '높음', `전체 학생 ${w.studentCount||0}명${w.masked?' · 표본 적어 참고용':''}`);
  }

  function barState(rate){ return rate>=80 ? 'reached' : rate>=50 ? 'partial' : 'notReached'; }
  function inlineBar(rate){
    const st = barState(rate);
    return `<span class="weak-bar"><span class="wb-num">${rate}%</span><span class="wb-track"><span class="wb-fill" data-state="${st}" style="width:${Math.max(0,Math.min(100,rate))}%;"></span></span></span>`;
  }

  // 데스크탑 표(renderDataTable) + 모바일 카드
  host.innerHTML = `<div class="weak-table-wrap" id="aWeakTable"></div><div class="weak-cards" id="aWeakCards"></div>`;
  const tableRows = rows.map((r, i) => Object.assign({}, r, { _rank: i+1 }));

  renderDataTable(document.getElementById('aWeakTable'), {
    columns:[
      { key:'_rank', label:'#', align:'right', format:v=>escapeHtml(String(v)) },
      { key:'label', label:'성취기준', format:(_,r)=>{
          const codeBare = String(r.code||'').replace(/^\[|\]$/g,'');
          const lbl = r.label && r.label !== r.code ? r.label : codeBare;
          const short = lbl.length>18 ? lbl.slice(0,18)+'…' : lbl;
          return `<div style="max-width:280px;"><div style="font-weight:600;color:#1f2937;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(short)}</div><div style="font-size:12px;color:#9ca3af;">[${escapeHtml(codeBare)}]</div></div>`;
        } },
      { key:'subject', label:'교과', format:v=>escapeHtml(v||'-') },
      { key:'reachedRate', label:'도달률', format:(v)=> inlineBar(v==null?0:v) },
      { key:'direction', label:'추세', format:(v,r)=>{
          if ((r.observedWeeks||0) < 3) return `<span class="trend-note">관측 ${r.observedWeeks||0}주</span>`;
          const hint = `최근 ${r.observedWeeks||0}주 정답률 기울기 ${r.slope==null?'-':((r.slope>0?'+':'')+r.slope)}%p/주`;
          return trendArrow(v, r.slope, hint);
        } },
      { key:'evaluatedStudents', label:'표본', align:'right', format:(v)=>{
          const n = Number(v)||0;
          if (n < 10) return `${n} ${lowSampleChip('표본 부족')}`;
          return escapeHtml(String(n));
        } }
    ],
    rows: tableRows, initialSort:'reachedRate', initialDir:'asc'
  });

  // 모바일 카드
  document.getElementById('aWeakCards').innerHTML = tableRows.map(r => {
    const codeBare = String(r.code||'').replace(/^\[|\]$/g,'');
    const lbl = r.label && r.label !== r.code ? r.label : codeBare;
    const low = (r.observedWeeks||0) < 3;
    const arrow = low ? `<span class="trend-note">관측 ${r.observedWeeks||0}주</span>`
      : trendArrow(r.direction, r.slope, `최근 ${r.observedWeeks||0}주 ${r.slope==null?'-':((r.slope>0?'+':'')+r.slope)}%p/주`);
    const sampleLow = (Number(r.evaluatedStudents)||0) < 10;
    return `<div class="weak-card">
      <div class="wc-title">${r._rank}. ${escapeHtml(lbl)}</div>
      <div class="wc-sub">[${escapeHtml(codeBare)}] · ${escapeHtml(r.subject||'-')}</div>
      <div style="margin:8px 0;">${inlineBar(r.reachedRate==null?0:r.reachedRate)}</div>
      <div class="wc-row">${arrow}<span class="trend-note">표본 ${Number(r.evaluatedStudents)||0}명${sampleLow?' · 참고용':''}</span></div>
    </div>`;
  }).join('');

  if (foot) foot.innerHTML = projDisclaimer((w && w.disclaimer) || '취약·하락 추세는 규칙 기반 신호입니다. 표본이 적은 단위는 참고용으로 보세요.');
}

/* ======================================================================
 * ③ 거시 비교 (a-macro) — 지역▸학교급▸학교▸학년▸교과 드릴다운
 *    브레드크럼 + KPI 4 + 막대 비교 + 정렬 표. n<10 마스킹("표본 부족").
 *    state._macroPath: [{level, id, label}] 체인
 * ==================================================================== */
const MACRO_LEVEL_LABEL = { region:'지역', school_level:'학교급', school:'학교', grade:'학년', subject:'교과' };
function _macroFiltersFromPath(path){
  // path의 각 단계에서 상위 필터 파라미터 구성
  const f = {};
  path.forEach(p => {
    if (p.level === 'region') f.region = p.id;
    else if (p.level === 'school_level') f.school_level = p.id;
    else if (p.level === 'school') f.school = p.id;
    else if (p.level === 'grade') f.grade = p.id;
  });
  return f;
}
VIEWS['a-macro'] = async function(root){
  root.innerHTML = tplLoading(2);
  if (!state._macroPath) state._macroPath = []; // 비어있으면 region 레벨부터

  const path = state._macroPath;
  // 다음에 조회할 level 결정: 마지막 단계의 nextLevel(없으면 region)
  const last = path[path.length-1];
  const NEXT = { region:'school_level', school_level:'school', school:'grade', grade:'subject', subject:null };
  const queryLevel = last ? NEXT[last.level] : 'region';

  // 브레드크럼
  const crumbs = [`<button type="button" data-idx="-1" ${path.length===0?'aria-current="page"':''}>전체(충북)</button>`]
    .concat(path.map((p,i)=> `<span class="sep">▸</span><button type="button" data-idx="${i}" ${i===path.length-1?'aria-current="page"':''}>${escapeHtml(p.label)}</button>`))
    .join('');

  root.innerHTML = `
    <nav class="dc-drill-bc" id="aMacroBc" aria-label="거시 드릴다운 경로">${crumbs}</nav>
    <div id="aMacroBody">${tplLoading(2)}</div>`;
  root.querySelectorAll('#aMacroBc button').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      state._macroPath = idx < 0 ? [] : path.slice(0, idx+1);
      VIEWS['a-macro'](root);
    };
  });

  const body = document.getElementById('aMacroBody');

  // 교과(subject)가 마지막 단계면 더 내려갈 곳이 없음 — 안내
  if (!queryLevel){
    body.innerHTML = `<div class="dc-state-panel" role="status" style="border-left:4px solid #64748b;background:#f1f5f9;">
      <span style="font-size:var(--fs-display);">📊</span>
      <p><strong>최하위 단위(교과)까지 도달했습니다</strong></p>
      <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.6;">개인정보 보호 원칙에 따라 학급·개인 단위는 제공하지 않습니다. 상위 단계로 돌아가 다른 갈래를 살펴보세요.</p>
    </div>`;
    return;
  }

  // API 호출
  const f = _macroFiltersFromPath(path);
  const d = await apiGet('/api/lrs/stats/macro-drill', { level: queryLevel, ...f });
  if (!d || !d.success){ body.innerHTML = tplError('거시 비교 데이터를 불러오지 못했습니다', ()=>VIEWS['a-macro'](root)); return; }
  const children = d.children || [];
  if (!children.length){ body.innerHTML = _seedHintEmpty(`${MACRO_LEVEL_LABEL[queryLevel]||''} 단위 집계가 없어요`); return; }

  const visible = children.filter(c => !c.masked);
  const maskedCnt = children.length - visible.length;
  // 집계 KPI (마스킹 제외 합산)
  const totStu = children.reduce((s,c)=>s+(c.students||0),0);
  const totActs = visible.reduce((s,c)=>s+(c.acts||0),0);
  const wMin = visible.reduce((s,c)=>s+(c.avgLearnMin||0)*(c.students||0),0) / Math.max(1, visible.reduce((s,c)=>s+(c.students||0),0));
  const scored = visible.filter(c=>c.avgScore!=null);
  const wScore = scored.reduce((s,c)=>s+c.avgScore*(c.students||0),0) / Math.max(1, scored.reduce((s,c)=>s+(c.students||0),0));

  body.innerHTML = `
    <div class="dc-kpi-grid">
      ${kpiCard('학생 수', totStu.toLocaleString(), '명', {dir:'flat',text:`${MACRO_LEVEL_LABEL[queryLevel]} ${children.length}개`}, 'primary')}
      ${kpiCard('활동량',  totActs.toLocaleString(), '건', {dir:'flat',text:'표본 충족 합계'}, 'success')}
      ${kpiCard('평균 학습시간', Math.round(wMin).toLocaleString(), '분', {dir:'flat',text:'1인 가중평균'}, 'warning')}
      ${kpiCard('평균 성취', scored.length?wScore.toFixed(1):'-', '점', {dir:'flat',text:'가중평균'}, 'primary')}
    </div>
    <section class="dc-chart-wrapper">
      <header><h2>${escapeHtml(MACRO_LEVEL_LABEL[queryLevel])}별 평균 성취 비교</h2><div class="subtitle">막대 클릭 시 하위 단위로 드릴다운</div></header>

/* ======================================================================
 * ④ 활동×성취 교차분석 (a-cross)
 *    인사이트 배너 + 3분위 매트릭스 + 산점도 + 콘텐츠/스스로채움 상하위 비교
 * ==================================================================== */
// 인사이트 문장 룰 (기획서 4-2)
function _crossInsight(label, cmp, smallSample){
  if (!cmp || cmp.gapPP == null) return `${label} 활용과 성취의 관계를 산출할 표본이 부족합니다.`;
  const gap = cmp.gapPP;
  const tail = smallSample ? ' (표본이 작아 참고용입니다)' : '';
  if (gap >= 10) return `${label}을(를) 상위권으로 활용한 학생 집단의 평균 정답률이 하위 집단보다 +${gap}%p 높습니다. 활용이 성취와 양(+)의 상관을 보입니다.${tail}`;
  if (gap > 0) return `${label} 활용 상·하위 집단 간 약한 양의 상관(+${gap}%p)이 관찰됩니다.${tail}`;
  return `이 표본에서는 ${label} 활용과 성취 간 뚜렷한 상관이 관찰되지 않습니다(표본·기간 확대 권장).${tail}`;
}

/* 서버 제공 7×24 매트릭스를 직접 히트맵으로 렌더 (renderHeatmap는 date 파싱 기반이라 별도 함수) */
function renderHeatmapMatrix(container, matrix){
  if (!container) return;
  let maxV = 0;
  (matrix||[]).forEach(row => row.forEach(v => { if (v>maxV) maxV=v; }));
  function bucket(v){
    if (!maxV || v<=0) return 0;
    const r=v/maxV; if (r>.75) return 4; if (r>.5) return 3; if (r>.25) return 2; if (r>0) return 1; return 0;
  }
  const dows = ['일','월','화','수','목','금','토'];
  const ylabels = dows.map(d=>`<div>${d}</div>`).join('');
  const cells = (matrix||[]).map((row,di)=>
    row.map((v,hi)=>`<div class="cell heat-${bucket(v)}" data-h="${bucket(v)}" title="${dows[di]} ${hi}시: ${v}" aria-label="${dows[di]}요일 ${hi}시 활동 ${v}">${v>0?v:''}</div>`).join('')
  ).join('');
  const xlabels = Array.from({length:24},(_,i)=>`<div>${i%3===0?i:''}</div>`).join('');
  container.innerHTML = `
    <div class="dc-heatmap-wrap">
      <div class="hm-ylabels" style="grid-template-rows:repeat(7,1fr);">${ylabels}</div>
      <div class="dc-heatmap" style="grid-template-columns:repeat(24,1fr);">${cells}</div>
      <div></div>
      <div class="hm-xlabels">${xlabels}</div>
    </div>`;
}

        { key:'missing_achievement', label:'성취기준 결측', align:'right',
          format:(v,r)=>{ const t=Number(r.total)||0; const m=Number(v)||0; const rate=t?(m/t*100):0; return escapeHtml(m.toLocaleString()+' ('+rate.toFixed(1)+'%)'); } },
        { key:'missing_duration', label:'시간 결측', align:'right',
          format:(v,r)=>{ const t=Number(r.total)||0; const m=Number(v)||0; const rate=t?(m/t*100):0; return escapeHtml(m.toLocaleString()+' ('+rate.toFixed(1)+'%)'); } }
      ],
      rows: perService, initialSort:'total', initialDir:'desc'
    });
  } else if (srows.length) {
    renderDataTable(qSvcBox, {
      columns: [
        { key:'service', label:'서비스', format:(_,r)=>escapeHtml(pickLabel(r, ['service_label','service','source_service','service_key','service_name'], '(미분류)')) },
        { key:'count',   label:'로그', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
        { key:'avg_score', label:'평균점수', align:'right', format:v=>escapeHtml(v==null?'-':Number(v).toFixed(1)) },
        { key:'_note',   label:'비고', format:()=>'<span style="color:var(--gray-500);font-size:var(--fs-sm);">per_service 결측 데이터 미제공</span>' }
      ],
      rows: srows, initialSort:'count', initialDir:'desc'
    });
  } else {
    qSvcBox.innerHTML = tplEmpty();
  }

  // 성취코드 미매핑 샘플 (null/empty)
  const missingAch = achRows.filter(r => !r.achievement_code || String(r.achievement_code).trim() === '');
  const qAchBox = document.getElementById('aQAchTable');
  if (missingAch.length){
    renderDataTable(qAchBox, {
      columns: [
        { key:'achievement_code', label:'코드', format:v=>escapeHtml(v||'(빈 값)') },
        { key:'count',            label:'건수', align:'right', format:v=>escapeHtml((Number(v)||0).toLocaleString()) },
        { key:'avg_score',        label:'평균점수', align:'right', format:v=>escapeHtml(v==null?'-':Number(v).toFixed(1)) }
      ],
      rows: missingAch, initialSort:'count', initialDir:'desc'
    });
  } else {
    qAchBox.innerHTML = `<p style="color:var(--gray-600);font-size:var(--fs-sm);padding:12px 0;">모든 성취기준이 매핑되어 있습니다.</p>`;
  }

  // 집계 재빌드 버튼
  const btn = document.getElementById('btnRebuildAgg');
  const msg = document.getElementById('aQRebuildMsg');
  if (btn){
    btn.addEventListener('click', async () => {
      if (!confirm('집계 테이블을 재빌드하시겠습니까? 대용량 로그의 경우 수 분 소요될 수 있습니다.')) return;
      btn.disabled = true;
      msg.textContent = '재빌드 진행 중…';
      msg.style.color = 'var(--gray-600)';
      try {
        const r = await fetch('/api/lrs/rebuild-aggregates', { method:'POST', credentials:'include' });
        if (!r.ok) throw new Error('HTTP '+r.status);
        const j = await r.json().catch(()=>({}));
        msg.textContent = '재빌드 완료' + (j && j.duration_ms ? ' (' + j.duration_ms + 'ms)' : '');
        msg.style.color = 'var(--lrs-success)';
      } catch(e){
        msg.textContent = '재빌드 실패: ' + e.message;
        msg.style.color = 'var(--lrs-danger)';
      } finally {
        btn.disabled = false;
      }
    });
  }
};

/* ======== xAPI 표준체계 분석 (Phase E) ======== */
async function _renderXapiAnalysis(root, scope) {
  root.innerHTML = tplLoading(5);
  const qs = scope ? `?scope=${encodeURIComponent(scope)}` : '';
  const [ov, heat, dist, area, recent] = await Promise.all([
    apiGet(`/api/lrs/xapi/overview${qs}`),
    apiGet(`/api/lrs/xapi/std-heatmap${qs}${qs?'&':'?'}depth=2`),
    apiGet(`/api/lrs/xapi/achievement-distribution${qs}`),
    apiGet(`/api/lrs/xapi/area-breakdown${qs}${qs?'&':'?'}days=7`),
    apiGet(`/api/lrs/xapi/recent-events${qs}${qs?'&':'?'}limit=20`),
  ]);
  if (!ov || !ov.success) { root.innerHTML = tplEmpty('xAPI 수집 데이터를 불러오지 못했습니다'); return; }

  // 1) 수집 현황 KPI
  const kpiHtml = `
    <div class="dc-kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
      ${kpiCard('총 xAPI 수집', (ov.total||0).toLocaleString(), '건', {dir:'flat',text:`최근 24시간 ${ov.recent24h||0}건`}, 'primary')}
      ${kpiCard('최근 7일', (ov.recent7d||0).toLocaleString(), '건', {dir:'flat',text:'수집 누적'}, 'success')}
      ${kpiCard('허브 송신 대기', (ov.unsent||0).toLocaleString(), '건', {dir:'flat',text:`송신 완료 ${ov.sent||0}`}, 'warning')}
      ${kpiCard('영역 수', String((ov.byArea||[]).length), '개', {dir:'flat',text:'AIDT 10영역 중'}, 'primary')}
    </div>`;

  // 2) 영역별 분포 막대
  const maxArea = Math.max(1, ...((ov.byArea||[]).map(a=>a.cnt||0)));
  const areaHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>영역별 수집 분포</h2><div class="subtitle">xAPI 10개 AIDT 영역</div></header>
      <div style="display:flex;flex-direction:column;gap:6px;">
        ${(ov.byArea||[]).map(a => `
          <div style="display:flex;align-items:center;gap:10px;">
            <span style="width:110px;font-size:var(--fs-caption);color:var(--gray-700);">${a.area}</span>
            <div style="flex:1;background:var(--gray-100);border-radius:4px;overflow:hidden;height:18px;">
              <div style="width:${((a.cnt/maxArea)*100).toFixed(1)}%;background:var(--primary);height:100%;"></div>
            </div>
            <span style="width:70px;text-align:right;font-size:var(--fs-caption);font-variant-numeric:tabular-nums;">${(a.cnt||0).toLocaleString()}</span>
          </div>`).join('') || '<div class="empty">수집된 데이터가 없습니다.</div>'}
      </div>
    </section>`;

  // 3) 성취수준 분포
  const distLevels = ['A','B','C','D','E'];
  const distMap = Object.fromEntries((dist && dist.distribution || []).map(r=>[r.level,r.cnt]));
  const distTotal = distLevels.reduce((s,l)=>s+(distMap[l]||0),0) || 1;
  const distHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>성취수준 분포</h2><div class="subtitle">초 A~C · 중·고 A~E</div></header>
      <div style="display:flex;gap:8px;">
        ${distLevels.map(l => {
          const c = distMap[l]||0;
          const pct = ((c/distTotal)*100).toFixed(1);
          return `<div style="flex:1;text-align:center;padding:var(--space-3);background:var(--gray-50);border-radius:6px;">
            <div style="font-size:var(--fs-h2);font-weight:700;color:var(--primary);">${l}</div>
            <div style="font-size:var(--fs-h3);margin-top:4px;">${c.toLocaleString()}</div>
            <div style="font-size:var(--fs-caption);color:var(--gray-600);">${pct}%</div>
          </div>`;
        }).join('')}
      </div>
    </section>`;

  // 4) 표준체계 히트맵 (상위 20)
  const heatRows = (heat && heat.nodes || []).slice(0,20);
  const heatMax = Math.max(1, ...heatRows.map(r=>r.attempts||0));
  const heatHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>표준체계 노드 히트맵 (Top 20)</h2><div class="subtitle">내용 체계 항목별 학습 빈도 · 정답률</div></header>
      <div style="overflow:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:var(--fs-caption);">
        <thead><tr style="background:var(--gray-100);">
          <th style="text-align:left;padding:8px;">노드</th>
          <th style="text-align:left;padding:8px;">레이블</th>
          <th style="text-align:right;padding:8px;">학습자</th>
          <th style="text-align:right;padding:8px;">시도</th>
          <th style="text-align:right;padding:8px;">정답률</th>
          <th style="padding:8px;">빈도</th>
        </tr></thead>
        <tbody>
        ${heatRows.length ? heatRows.map(n => {
          const rate = n.attempts > 0 ? ((n.correct/n.attempts)*100).toFixed(0) : '-';
          const barW = ((n.attempts/heatMax)*100).toFixed(1);
          const rateColor = n.attempts === 0 ? 'var(--gray-400)'
            : (n.correct/n.attempts) >= 0.8 ? 'var(--success)'
            : (n.correct/n.attempts) >= 0.6 ? 'var(--primary)'
            : 'var(--warning)';
          return `<tr style="border-top:1px solid var(--gray-200);">
            <td style="padding:6px 8px;font-family:monospace;">${n.node_id}</td>
            <td style="padding:6px 8px;">${n.label || '-'}</td>
            <td style="padding:6px 8px;text-align:right;">${n.learners||0}</td>
            <td style="padding:6px 8px;text-align:right;">${n.attempts||0}</td>
            <td style="padding:6px 8px;text-align:right;color:${rateColor};font-weight:600;">${rate}${rate!=='-'?'%':''}</td>
            <td style="padding:6px 8px;width:120px;">
              <div style="background:var(--gray-100);border-radius:3px;height:10px;overflow:hidden;">
                <div style="width:${barW}%;background:${rateColor};height:100%;"></div>
              </div>
            </td>
          </tr>`;
        }).join('') : '<tr><td colspan="6" style="padding:16px;text-align:center;color:var(--gray-500);">수집된 표준체계 데이터가 없습니다.</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>`;

  // 5) 최근 이벤트
  const events = (recent && recent.events) || [];
  const recentHtml = `
    <section class="dc-chart-wrapper" style="margin-top:var(--space-4);">
      <header><h2>최근 수집 이벤트</h2><div class="subtitle">최신 ${events.length}건</div></header>
      <div style="overflow:auto;max-height:400px;">
      <table style="width:100%;border-collapse:collapse;font-size:var(--fs-caption);">
        <thead><tr style="background:var(--gray-100);position:sticky;top:0;">
          <th style="text-align:left;padding:6px;">시각</th>
          <th style="text-align:left;padding:6px;">사용자</th>
          <th style="text-align:left;padding:6px;">영역</th>
          <th style="text-align:left;padding:6px;">동사</th>
          <th style="text-align:left;padding:6px;">표준ID</th>
          <th style="text-align:left;padding:6px;">교과</th>
          <th style="text-align:left;padding:6px;">수준</th>
        </tr></thead>
        <tbody>
        ${events.length ? events.map(e => `
          <tr style="border-top:1px solid var(--gray-200);">
            <td style="padding:4px 6px;white-space:nowrap;">${(e.event_timestamp||'').slice(5,16).replace('T',' ')}</td>
            <td style="padding:4px 6px;">${e.display_name || `user-${e.user_id}`}</td>
            <td style="padding:4px 6px;"><span class="chip">${e.area}</span></td>
            <td style="padding:4px 6px;font-family:monospace;">${e.verb}</td>
            <td style="padding:4px 6px;font-family:monospace;font-size:11px;">${e.primary_std_id||'-'}</td>
            <td style="padding:4px 6px;">${e.subject_code||'-'}</td>
            <td style="padding:4px 6px;">${e.achievement_level||'-'}</td>
          </tr>`).join('') : '<tr><td colspan="7" style="padding:16px;text-align:center;color:var(--gray-500);">이벤트가 없습니다.</td></tr>'}
        </tbody>
      </table>
      </div>
    </section>`;

  root.innerHTML = `
    <section class="dc-chart-wrapper">
      <header>
        <h2>xAPI 표준체계 분석</h2>
        <div class="subtitle">AIDT 기술규격 v2.2 기반 수집 데이터 · 교육부 학습데이터허브 포맷 정합</div>
      </header>
      ${kpiHtml}
    </section>
    ${areaHtml}
    ${distHtml}
    ${heatHtml}
    ${recentHtml}
  `;
}

        <label class="chip" style="cursor:pointer;"><input type="radio" name="exScope" value="subject" style="margin-right:6px;">교과별 집계</label>

      <h3 style="font-size:var(--fs-h3);margin:var(--space-4) 0 var(--space-2);">3. 형식</h3>
      <div id="exFormat" role="radiogroup" style="display:flex;gap:var(--space-2);">

    return el ? el.value : 'csv';

    const sc = currentScope();
    const est = document.getElementById('exEstimate');

    let n = 0, label = '';

    est.innerHTML = `약 <strong>${n.toLocaleString()}</strong>행 (${escapeHtml(label)}) · 형식 <strong>${escapeHtml(currentFormat().toUpperCase())}</strong>`;
  }
  root.querySelectorAll('input[name="exScope"],input[name="exFormat"]').forEach(el => {
    el.addEventListener('change', updateEstimate);
  });
  updateEstimate();

  function renderHist(){
    const box = document.getElementById('exHist');
    if (!hist.length){ box.innerHTML = tplEmpty('다운로드 이력이 없습니다'); return; }
    renderDataTable(box, {
      columns: [
        { key:'at',     label:'시각', format:v=>escapeHtml(new Date(v).toLocaleString('ko-KR')) },
        { key:'scope',  label:'범위' },
        { key:'fmt',    label:'형식', format:v=>escapeHtml(String(v).toUpperCase()) },
        { key:'period', label:'기간' }
      ],
      rows: hist, initialSort:'at', initialDir:'desc'
    });

  renderHist();

  document.getElementById('btnExportDo').addEventListener('click', () => {
    LRS.exportData(currentFormat(), currentScope());
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
  document.getElementById('btnExportCsvQuick').addEventListener('click', () => {
    LRS.exportData('csv', 'all');
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
  document.getElementById('btnExportXlsxQuick').addEventListener('click', () => {
    LRS.exportData('xlsx', 'all');
    try { hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]'); } catch(_){ hist = []; }
    renderHist();
  });
};

/* =====================================================================
 * 라우팅/상태 관리
 * ===================================================================== */
function setRole(role){
  const allowed = state.me && state.me.role === 'admin' ? ['student','teacher','admin']
                 : state.me && state.me.role === 'teacher' ? ['student','teacher']
                 : ['student'];
  if (!allowed.includes(role)) role = allowed[allowed.length-1];
  state.role = role;
  state.scope = computeScope();
  // 이전 역할의 view id가 남아 있으면 새 역할 랜딩 뷰 전환 판정이 어긋나므로 리셋
  state.view = null;

  document.querySelectorAll('.dc-role-switcher button').forEach(b=>{
    const r = b.dataset.role;
    b.setAttribute('aria-pressed', r===role ? 'true':'false');
    b.disabled = !allowed.includes(r);
    if (!allowed.includes(r)) {
      b.title = '이 계정에는 해당 역할 보기 권한이 없습니다';
      b.setAttribute('aria-disabled','true');
    } else {
      b.removeAttribute('title');
      b.removeAttribute('aria-disabled');
    }
  });

  syncRealOnlyToggleVisibility();

  // 역할 전환 시 현재 카테고리가 해당 역할에서 지원되지 않으면 home으로 되돌림
  if (!ROLE_CATEGORIES[role].includes(state.category || 'home')) {
    state.category = 'home';
  }
  renderInPageTabs(state.category || 'home');
  const firstId = defaultViewForCategory(role, state.category || 'home') || MENUS[role][0].id;
  setView(firstId);
}

/* 인페이지 가로 탭 렌더 — 사이드바 대체. 카테고리 내 뷰가 2개↑면 탭 바,
   1개(홈/운영·리포트 단일 등)면 탭 바 미렌더(빈 탭 금지). group 필드는 무시하고 flat 순서. */
function renderInPageTabs(cat){
  const useCat = cat || state.category || 'home';
  state.category = useCat;
  const tabs = document.getElementById('lrsTabs');
  document.getElementById('bcRole').textContent =
    state.role==='student'?'학생':state.role==='teacher'?'교사':'관리자';

  const items = (MENUS[state.role] || []).filter(it => it.category === useCat);

  // 뷰 1개 이하: 탭 바 아예 렌더하지 않음
  if (!tabs || items.length < 2){
    if (tabs){ tabs.innerHTML = ''; tabs.hidden = true; }
    return;
  }

  tabs.hidden = false;
  tabs.setAttribute('aria-label', (MENU_LABELS[useCat] || '분석') + ' 하위 메뉴');
  tabs.innerHTML = items.map(it=>{
    const active = state.view === it.id;
    return `<button class="lrs-tab${active?' is-active':''}" type="button" role="tab"
      data-view="${escapeAttr(it.id)}"
      aria-selected="${active?'true':'false'}"${active?' aria-current="page"':''}
      tabindex="${active?'0':'-1'}">${escapeHtml(it.label)}</button>`;
  }).join('');
  tabs.querySelectorAll('button').forEach(b=>{
    b.onclick = ()=> setView(b.dataset.view);
  });
}

/* 하위 호환 별칭 — 기존 호출부(boot 등) 안전. */
function renderSideMenu(cat){ return renderInPageTabs(cat); }

/* 현재 state.view 기준으로 인페이지 탭 활성 상태만 갱신 (hashchange/popstate 대응) */
function refreshTabActive(){
  const tabs = document.getElementById('lrsTabs');
  if (!tabs || tabs.hidden) return;
  tabs.querySelectorAll('button').forEach(b=>{
    const active = b.dataset.view === state.view;
    b.classList.toggle('is-active', active);
    b.setAttribute('aria-selected', active?'true':'false');
    if (active){ b.setAttribute('aria-current','page'); b.tabIndex = 0; }
    else { b.removeAttribute('aria-current'); b.tabIndex = -1; }
  });
}

/* 폐기/통합된 구 관리자 뷰 id → 신규 5블록 매핑 (레거시 URL 호환) */
const ADMIN_VIEW_ALIAS = {
  'a-usage':'a-svc-ops', 'a-overview':'a-home',
  'a-achieve':'a-cross', 'a-perform':'a-cross', 'a-custom':'a-cross',
  'a-warnings':'a-macro', 'a-drill':'a-macro', 'a-compare':'a-macro',
  'a-daily':'a-time'
};
async function setView(id){
  // 관리자 뷰 alias 보정: 폐기·통합되어 admin 메뉴에서 빠진 구 뷰 id로 진입하면 신규 블록으로 흡수
  if (state.role === 'admin' && ADMIN_VIEW_ALIAS[id] && !(MENUS.admin||[]).some(it=>it.id===id)) {
    id = ADMIN_VIEW_ALIAS[id];
  }
  state.view = id;
  const items = MENUS[state.role] || [];
  const cur = items.find(it=>it.id===id);
  document.getElementById('bcPage').textContent = cur ? cur.label : '—';
  const menuKey = viewToMenu(id);
  state.category = menuKey || state.category || 'home';
  const bcMenuEl = document.getElementById('bcMenu');
  // 브레드크럼: 홈 카테고리면 "역할 > 홈" 3단, 그 외 4단
  const isHome = state.category === 'home';
  if (bcMenuEl) {
    if (isHome) {
      bcMenuEl.textContent = '';
      bcMenuEl.setAttribute('hidden','');
      // 홈에서는 bcPage만 "홈"으로
      document.getElementById('bcPage').textContent = '홈';
    } else {
      bcMenuEl.removeAttribute('hidden');
      bcMenuEl.textContent = MENU_LABELS[state.category] || '—';
    }
  }
  renderInPageTabs(state.category);
  // URL 동기화: hash + ?menu= 둘 다 갱신
  try {
    const url = new URL(location.href);
    url.hash = id;
    if (menuKey) url.searchParams.set('menu', menuKey);
    const next = url.pathname + url.search + url.hash;
    const curr = location.pathname + location.search + location.hash;
    if (next !== curr) {
      history.replaceState(null, '', next);
      try { window.dispatchEvent(new CustomEvent('dacheum:menu-changed', { detail: { menu: menuKey, view: id } })); } catch(_){}
    }
  } catch(_) {
    if (('#'+id) !== location.hash) { try { location.hash = id; } catch(__){} }
  }

  destroyCharts();
  const root = document.getElementById('viewRoot');
  // 클릭 즉시 로딩 표시가 보이도록 프레임 양보 없이 바로 갱신
  root.innerHTML = tplLoading(3);
  try {
    const fn = VIEWS[id] || (r => { r.innerHTML = tplEmpty('준비 중인 화면입니다'); });
    await fn(root);
  } catch (e) {
    console.error('[LRS] 뷰 렌더 실패', e);
    root.innerHTML = tplError(e.message, ()=>setView(id));
  }
  document.getElementById('syncTime').textContent = '동기화: ' + new Date().toLocaleTimeString('ko-KR', { hour:'2-digit', minute:'2-digit' });
}

/* =====================================================================
 * 기간 피커 (B4 해결)
 * ===================================================================== */
function bindPeriodPicker(){
  const root = document.getElementById('periodPicker');
  root.querySelectorAll('button[data-period]').forEach(btn => {
    btn.onclick = () => {
      const p = btn.dataset.period;
      root.querySelectorAll('button[data-period]').forEach(b=>b.setAttribute('aria-pressed', b===btn?'true':'false'));
      document.getElementById('customRange').hidden = (p !== 'custom');
      state.period = p;
      if (p !== 'custom' && state.view) setView(state.view);
    };
  });
  document.getElementById('applyCustom').onclick = () => {
    state.from = document.getElementById('rangeFrom').value || null;
    state.to   = document.getElementById('rangeTo').value || null;
    if (state.view) setView(state.view);
  };
}

/* ---- 데이터 범위 토글 (관리자 전용: 시드 포함 / 실데이터만) ---- */
function bindRealOnlyToggle(){
  const root = document.getElementById('realOnlyToggle');
  if (!root) return;
  root.querySelectorAll('button[data-real]').forEach(btn => {
    btn.onclick = () => {
      const on = btn.dataset.real === '1';
      if (state.realOnly === on) return;
      state.realOnly = on;
      root.querySelectorAll('button[data-real]').forEach(b =>
        b.setAttribute('aria-pressed', (b.dataset.real==='1')===on ? 'true':'false'));
      if (state.view) setView(state.view);
    };
  });
}

/* ---- 관리자일 때만 데이터 범위 토글 노출 ---- */
function syncRealOnlyToggleVisibility(){
  const root = document.getElementById('realOnlyToggle');
  if (!root) return;
  if (state.role === 'admin') {
    root.hidden = false;
  } else {
    root.hidden = true;
    // 다른 역할로 가면 시드 포함(기본)으로 리셋
    if (state.realOnly){
      state.realOnly = false;
      root.querySelectorAll('button[data-real]').forEach(b =>
        b.setAttribute('aria-pressed', b.dataset.real==='0' ? 'true':'false'));
    }
  }
}

/* =====================================================================
 * 드로어 & 액션
 * ===================================================================== */
const LRS = window.LRS = {
  _warnCache: [],
  // 관리자 분석 공용 헬퍼 (n<threshold 차단·행 마스킹)
  minSampleGuard: _minSampleGuard,
  cellSuppress:   _cellSuppress,
  openDrilldown(student){
    student = student || {};
    const overlay = document.getElementById('drawerOverlay');
    const drawer  = document.getElementById('drilldownDrawer');
    overlay.setAttribute('data-open','true');
    drawer.setAttribute('data-open','true');
    drawer.setAttribute('aria-hidden','false');
    const displayName = (student.name||student.student_name) || ('학생 #'+(student.user_id||student.id||'?'));
    document.getElementById('drawerTitle').textContent = displayName;
    const uid = student.user_id || student.id || '';
    const code = student.achievement_code || '';
    const body = document.getElementById('drawerBody');
    body.innerHTML = `
      <p style="font-size:var(--fs-sm);color:var(--gray-600);line-height:1.7;">
        최근 학습: ${escapeHtml(student.last_active||'-')}<br>
        사유: ${escapeHtml(student.reason||'-')}
      </p>
      <div class="dc-warning-card" data-severity="${escapeAttr(student.severity||'medium')}">
        <h3>추천 액션</h3>
        <div class="actions" data-student-id="${escapeAttr(uid)}" data-achievement-code="${escapeAttr(code)}">
          <button type="button" data-action="message">메시지</button>
          <button type="button" data-action="homework">과제부과</button>
          <button type="button" data-action="recommend">맞춤학습 추천</button>
        </div>
      </div>
      <h4 style="margin-top:20px;font-size:var(--fs-h2);">최근 활동 로그</h4>
      <div id="drawerActivity" style="font-size:var(--fs-sm);color:var(--gray-500);">불러오는 중…</div>`;
    bindWarningActions(body);
    overlay.onclick = LRS.closeDrawer;

    // 최근 활동 로그를 데이터 테이블로 표시 (best-effort)
    (async () => {
      const act = uid ? await apiGet('/api/lrs/student-activity/'+encodeURIComponent(uid)) : null;
      const rows = (act && (act.data||act.rows)) || [];
      const target = document.getElementById('drawerActivity');
      if (!target) return;
      if (!rows.length){ target.innerHTML = '<em style="color:var(--gray-500);">최근 활동 데이터가 없습니다</em>'; return; }
      // 가능한 필드: stat_date(집계) 또는 created_at(원시 이벤트)
      renderDataTable(target, {
        columns: [
          { key:'date', label:'일자',
            format:(v,row) => escapeHtml(fmtDate(row.stat_date||row.date||row.created_at||'-')) },
          { key:'service', label:'서비스',
            format:(_,row) => escapeHtml(pickLabel(row, ['service_label','service','source_service','service_key','service_name','activity_type'], '(미분류)')) },
          { key:'duration_min', label:'학습(분)', align:'right',
            format:(v,row) => escapeHtml(v!=null?v:toMinutes(row.total_duration||row.duration_sec||0)) },
          { key:'score', label:'점수', align:'right',
            format:(v,row) => escapeHtml(v!=null?v:(row.avg_score||'-')) }
        ],
        rows,
        initialSort:'date', initialDir:'desc'
      });
    })();
  },
  /* 성취 히트맵 셀 상세 드로어 (기존 드로어 재사용) */
  openMasteryDrawer(cfg){
    cfg = cfg || {};
    const overlay = document.getElementById('drawerOverlay');
    const drawer  = document.getElementById('drilldownDrawer');
    overlay.setAttribute('data-open','true');
    drawer.setAttribute('data-open','true');
    drawer.setAttribute('aria-hidden','false');
    document.getElementById('drawerTitle').textContent = cfg.title || '성취 상세';
    const body = document.getElementById('drawerBody');
    body.innerHTML = cfg.bodyHtml || '';
    overlay.onclick = LRS.closeDrawer;
    const rec = document.getElementById('drwRecommend');
    if (rec) rec.addEventListener('click', ()=>{
      LRS.teacherAction('recommend', rec.getAttribute('data-uid'), rec.getAttribute('data-code'));
    });
  },
  closeDrawer(){
    document.getElementById('drawerOverlay').setAttribute('data-open','false');
    const d = document.getElementById('drilldownDrawer');
    d.setAttribute('data-open','false');
    d.setAttribute('aria-hidden','true');
  },
  /* 교사 실액션 딥링크 (UI-P0-1) */
  teacherAction(kind, uid, code){
    if (!uid){
      alert('학생 ID를 확인할 수 없습니다.');
      return;
    }
    const classId = state.classId || (state.me && (state.me.class_id || state.me.classId)) || '';
    const cp = (k,v) => (v?('&'+k+'='+encodeURIComponent(v)):'');
    const classQ = classId ? ('classId='+encodeURIComponent(classId)) : '';
    const sid = encodeURIComponent(uid);
    if (kind === 'message'){
      location.href = '/class/class-home.html?' + classQ + '&tab=message&to=' + sid;
    } else if (kind === 'homework' || kind === 'assign'){
      location.href = '/class/class-home.html?' + classQ + '&tab=homework&new=1&to=' + sid;
    } else if (kind === 'recommend'){
      location.href = '/self-learn/?user_id=' + sid + cp('achievement_code', code||'');
    } else {
      console.warn('[LRS] unknown teacherAction:', kind);
    }
  },
  exportData(fmt, scope){
    const extra = { format: fmt };
    if (scope) extra.scope = scope;
    const qs = rangeQS(extra);
    // 다운로드 이력 LocalStorage 기록 (a-export 뷰에서 사용)
    try {
      const hist = JSON.parse(localStorage.getItem('lrs_export_hist')||'[]');
      hist.unshift({ fmt, scope: scope||'all', at: new Date().toISOString(), period: state.period });
      localStorage.setItem('lrs_export_hist', JSON.stringify(hist.slice(0,10)));
    } catch(_){}
    window.location.href = '/api/lrs/export' + qs;
  }
};

/* =====================================================================
 * 부트스트랩
 * ===================================================================== */
async function boot(){
  let me = null;
  try {
    const r = await fetch('/api/auth/me', { credentials:'include' });
    if (r.ok) me = await r.json();
  } catch(_) {}
  // /api/auth/me returns {success, user:{...}}; older code expected flat
  const user = (me && me.user) ? me.user : me;
  if (!user || !user.id) { location.href = '/login.html'; return; }
  state.me = user;

  document.getElementById('lrsRoot').hidden = false;

  // 역할 스위처 노출 정책: admin만 "미리보기" chip 토글로 노출. 학생/교사는 완전 숨김(로그인 역할 자동).
  const roleSwitcher = document.getElementById('roleSwitcher');
  if (roleSwitcher){
    if (user.role === 'admin'){
      roleSwitcher.hidden = false;
      roleSwitcher.classList.add('is-preview');
      roleSwitcher.setAttribute('aria-label','역할 미리보기(관리자 전용)');
      roleSwitcher.title = '다른 역할이 보는 화면을 미리봅니다';
      const lbl = document.getElementById('roleSwitcherLabel');
      if (lbl) lbl.hidden = false;
    } else {
      roleSwitcher.hidden = true;
    }
  }

  document.querySelectorAll('.dc-role-switcher button').forEach(b=>{
    b.onclick = ()=> {
      const r = b.dataset.role;
      if (!r) return;
      if (state.role === r) return; // 같은 역할이면 무시
      setRole(r);
    };
  });

  bindPeriodPicker();
  bindRealOnlyToggle();

  // 쿼리/해시 기반 초기 뷰
  const urlParams = new URLSearchParams(location.search);
  let menuParam = urlParams.get('menu');
  const hash = (location.hash||'').replace('#','');

  // 레거시 URL 정규화: 구 뷰 키(usage/achieve/...) 또는 구 뷰 id(a-usage, t-warnings...)를 카테고리로 보정
  let legacyHashOverride = null;
  if (menuParam && !MENU_TO_VIEW[menuParam] && LEGACY_MENU_TO_CATEGORY[menuParam]) {
    const mappedCat = LEGACY_MENU_TO_CATEGORY[menuParam];
    // 구 뷰 id였다면 해당 뷰로 진입, 카테고리 키였다면 카테고리 기본 뷰로 진입
    if (VIEWS[menuParam] && !location.hash) {
      legacyHashOverride = menuParam;
      try { history.replaceState(null, '', '/lrs/index.html?menu=' + mappedCat + '#' + menuParam); } catch(_) {}
    } else {
      try { history.replaceState(null, '', '/lrs/index.html?menu=' + mappedCat); } catch(_) {}
    }
    menuParam = mappedCat;
    urlParams.set('menu', mappedCat);
  }

  // 초기 역할 결정: 해시 prefix 우선, 없으면 user.role
  const roleByHash = hash.startsWith('s-')?'student':hash.startsWith('t-')?'teacher':hash.startsWith('a-')?'admin':null;
  const initialRole = roleByHash || (user.role==='admin'?'admin':user.role==='teacher'?'teacher':'student');

  // ?menu= 우선 결정 — setRole의 기본 setView와 레이스 방지를 위해 한 번만 setView 호출
  let overrideViewId = null;
  let denied403Menu = null;
  if (legacyHashOverride && VIEWS[legacyHashOverride]) {
    overrideViewId = legacyHashOverride;
  } else if (hash && VIEWS[hash]) {
    // 사용자 지정 hash가 있으면 최우선 (카테고리 default 무시)
    overrideViewId = hash;
  } else if (menuParam && MENU_TO_VIEW[menuParam]) {
    // 역할 권한 확정 (setRole의 허용 로직 복제)
    const allowed = user.role === 'admin' ? ['student','teacher','admin']
                  : user.role === 'teacher' ? ['student','teacher']
                  : ['student'];
    const effRole = allowed.includes(initialRole) ? initialRole : allowed[allowed.length-1];
    overrideViewId = MENU_TO_VIEW[menuParam][effRole];
    if (!overrideViewId) {
      // 권한 없는 메뉴(예: 학생이 ?menu=teacher) → 홈으로 안내 + 배너
      denied403Menu = menuParam;
      overrideViewId = MENU_TO_VIEW.home[effRole];
    }
    if (overrideViewId && !VIEWS[overrideViewId]) overrideViewId = null;
  } else if (hash && VIEWS[hash]) {
    overrideViewId = hash;
  }

  if (overrideViewId) {
    // setRole이 내부적으로 setView(MENUS[role][0])을 부르지 않도록 수동 처리
    const allowed = user.role === 'admin' ? ['student','teacher','admin']
                  : user.role === 'teacher' ? ['student','teacher']
                  : ['student'];
    const effRole = allowed.includes(initialRole) ? initialRole : allowed[allowed.length-1];
    state.role = effRole;
    state.scope = computeScope();
    state.view = null;
    document.querySelectorAll('.dc-role-switcher button').forEach(b=>{
      const r = b.dataset.role;
      b.setAttribute('aria-pressed', r===effRole ? 'true':'false');
      b.disabled = !allowed.includes(r);
      if (!allowed.includes(r)) {
        b.title = '이 계정에는 해당 역할 보기 권한이 없습니다';
        b.setAttribute('aria-disabled','true');
      } else {
        b.removeAttribute('title');
        b.removeAttribute('aria-disabled');
      }
    });
    syncRealOnlyToggleVisibility();
    renderSideMenu();
    await setView(overrideViewId);
  } else {
    setRole(initialRole);
  }

  // 권한 없는 ?menu= 접근 시 인라인 403 배너
  if (denied403Menu) {
    try {
      const banner = document.createElement('div');
      banner.className = 'dc-state-panel';
      banner.setAttribute('role','alert');
      banner.style.cssText = 'background:#FFF3CD;color:var(--gray-800);margin:12px 0;padding:12px 16px;border-radius:8px;border-left:4px solid #F59E0B;';
      banner.innerHTML = '<strong>접근 권한 없음:</strong> 요청하신 "'
        + escapeHtml(MENU_LABELS[denied403Menu]||denied403Menu)
        + '" 메뉴는 현재 역할에서 이용할 수 없습니다. 홈 화면으로 이동했습니다.';
      const rootEl = document.getElementById('viewRoot');
      if (rootEl) rootEl.insertBefore(banner, rootEl.firstChild);
      setTimeout(()=>{ try{ banner.remove(); }catch(_){} }, 6000);
    } catch(_){}
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') LRS.closeDrawer(); });
  const closeBtn = document.getElementById('drawerCloseBtn');
  if (closeBtn) closeBtn.addEventListener('click', LRS.closeDrawer);

  // 인페이지 탭 활성 상태 보강 갱신 — setView가 이미 탭을 재렌더하므로 보조 안전장치.
  // refreshTabActive는 클래스/속성만 토글(setView·이벤트 재발화 없음) → 무한루프 없음.
  window.addEventListener('dacheum:menu-changed', refreshTabActive);
}

boot();
})();
