/* ======================================================================
 * [Phase 2] 도 전체 벤치마크 — 공통 자산 (t-benchmark · t-daily-benchmark 공유)
 *   기획서: 보고서/LRS_Phase2_벤치마크_UI_기획_v1.md + _방법론_API_v1.md
 *   BE: GET /api/lrs/stats/benchmark · /stats/daily-benchmark (구현·배포 완료)
 *   정직성(§5): 시드 고지 상시 배너 · in-view 실데이터 토글(교사 전역 realOnly 숨김 대체)
 *     · 소표본 마스킹("표본 부족", 0 채움 금지) · 성취기준 초등 코어만 · 상관≠인과.
 * ==================================================================== */
/* 비교 지표 정의 — pct(0~100 트랙) 여부·단위·표기 폭. score/reach=비율(반↔도 공정),
   time/usage=누적량(충북 시드 학생이 많아 절대비교는 참고용 — §정직성 캡션). */
const BM_METRICS = [
  { key:'score', label:'정답률',   unit:'점', pct:true,  vol:false },
  { key:'reach', label:'도달률',   unit:'%',  pct:true,  vol:false },
  { key:'time',  label:'학습시간', unit:'분', pct:false, vol:true  },
  { key:'usage', label:'활용률',   unit:'건', pct:false, vol:true  },
];
const BM_METRIC_BY = Object.fromEntries(BM_METRICS.map(m=>[m.key, m]));
/* 값 표기 — 활용률(건)만 소수1, 나머지 정수 반올림. null 은 '-'. */
function _bmNum(v, m){ if (v==null || isNaN(v)) return '-'; return (m && m.key==='usage') ? Number(v).toFixed(1) : String(Math.round(v)); }
/* 델타 단위 — 비율지표=%p, 그 외=지표단위. */
function _bmDeltaUnit(m){ return m && m.pct ? '%p' : (m ? m.unit : ''); }

/* 담당(개설) active 클래스 목록 — /api/class/my 에서 owner_id=본인 필터. 세션 캐시. */
async function _bmFetchOwnedClasses(){
  if (Array.isArray(state._bmOwnedClasses)) return state._bmOwnedClasses;
  let list = [];
  try {
    const r = await fetch('/api/class/my', { credentials:'include' });
    if (r.ok){ const j = await r.json(); list = (j && j.classes) || []; }
  } catch(_){}
  const meId = state.me && state.me.id;
  const owned = list.filter(c => meId!=null && Number(c.owner_id) === Number(meId));
  state._bmOwnedClasses = owned;
  return owned;
}
/* 담당 클래스 0개 → 전용 빈상태 패널(t-classcompare/t-weakstrong 🏫 패턴 재사용). */
function _bmNoClassPanel(){
  return `<div class="dc-state-panel" role="status" style="text-align:center;">
    <div style="font-size:34px;line-height:1;margin-bottom:10px;" aria-hidden="true">🏫</div>
    <p style="font-size:var(--fs-h3);font-weight:700;color:var(--gray-900);margin:0 0 6px;">아직 담당(개설)한 클래스가 없어요.</p>
    <p style="line-height:1.7;color:var(--gray-700);margin:0;">클래스를 만들고 학생이 학습을 쌓으면 우리 반이 충북 도 전체 같은 학년과 견줘 어디쯤인지 보여드려요.</p>
    <div style="margin-top:16px;"><a class="btn" href="/class/index.html"><i class="fas fa-chalkboard-user" aria-hidden="true"></i> 클래스로 이동</a></div>
  </div>`;
}
/* 클래스 선택 칩(단일선택) — 담당 1개면 호출부에서 미노출. data-bmclass */
function _bmClassChipsHtml(classes, activeId){
  return `<div class="dc-unit-toggle" id="bmClassToggle" role="group" aria-label="클래스 선택">
    <span class="dc-eq-flabel">클래스</span>${classes.map(c=>
      `<button class="chip" type="button" data-bmclass="${escapeAttr(String(c.id))}" aria-pressed="${String(c.id)===String(activeId)?'true':'false'}">${escapeHtml(c.name)}</button>`).join('')}</div>`;
}
/* 교과 present 캐시 — 벤치마크(level=subject·subject=all) cells 에서 파생. 두 뷰 공유(클래스·realOnly 키). */
async function _bmPresentSubjects(classId, realOnly){
  const ck = String(classId) + (realOnly ? '_r' : '');
  state._bmSubjCache = state._bmSubjCache || {};
  if (state._bmSubjCache[ck]) return state._bmSubjCache[ck];
  const d = await apiGet('/api/lrs/stats/benchmark', { classId, level:'subject', subject:'all', metric:'score', realOnly: realOnly?'1':'0' });
  let subs = [];
  if (d && d.success && Array.isArray(d.cells)) subs = d.cells.map(c=>({ key:c.subject, label:c.label, present:true })).filter(s=>s.key);
  state._bmSubjCache[ck] = subs;
  return subs;
}
/* 시드 고지 배너(상단 상시 · §5-1) + in-view 실데이터 토글(교사 전역 realOnly 숨김 대체). realKey=state 키명. */
function _bmSeedBar(seedNotice, realOn, realKey){
  const banner = _reportInsightHtml({ level:'info',
    text: (seedNotice || '도 전체 수치는 시연용 시드 데이터 기반이에요. 실제 학교·학급 데이터가 쌓이면 자동으로 실데이터 비교로 바뀌어요.') });
  return `<div class="bm-topbar">
    <div class="bm-topbar-notice">${banner}</div>
    <div class="dc-unit-toggle bm-realtoggle" id="bmRealToggle" role="group" aria-label="데이터 범위" data-realkey="${escapeAttr(realKey)}">
      <span class="dc-eq-flabel">데이터 범위</span>
      <button class="chip" type="button" data-bmreal="0" aria-pressed="${realOn?'false':'true'}">시드 포함</button>
      <button class="chip" type="button" data-bmreal="1" aria-pressed="${realOn?'true':'false'}">실데이터만</button>
    </div>
  </div>`;
}
/* 백분위 배지(§2-2) — 상대 위치 색 + '순위 배지' 명시(fa-ranking-star + 상위/중간 병기). */
function _bmPctlBadge(pct){
  if (pct == null) return `<span class="bm-badge bm-badge--muted"><i class="fas fa-ranking-star" aria-hidden="true"></i> 표본 부족</span>`;
  const p = Math.max(1, Math.round(pct));
  let tone, text;
  if (pct <= 25){ tone='success'; text='상위 '+p+'%'; }
  else if (pct <= 50){ tone='info'; text='상위 '+p+'%'; }
  else if (pct <= 74){ tone='muted'; text='충북 중간쯤 (상위 '+p+'%)'; }
  else { tone='warning'; text='더 올라갈 여지가 커요 (상위 '+p+'%)'; }
  return `<span class="bm-badge bm-badge--${tone}"><i class="fas fa-ranking-star" aria-hidden="true"></i> ${escapeHtml(text)}</span>`;
}
/* 표 델타 배지 — +초록▲/−빨강▼/0회색. 지표별 단위. */
function _bmDeltaBadge(delta, m){
  if (delta == null || isNaN(delta)) return `<span class="dc-badge dc-badge--muted">-</span>`;
  const du = _bmDeltaUnit(m);
  const av = (m && m.key==='usage') ? Number(Math.abs(delta)).toFixed(1) : String(Math.round(Math.abs(delta)));
  if (delta > 0) return `<span class="dc-badge dc-badge--success">▲ +${av}${du}</span>`;
  if (delta < 0) return `<span class="dc-badge dc-badge--danger">▼ −${av}${du}</span>`;
  return `<span class="dc-badge dc-badge--muted">± 0${du}</span>`;
}
/* 헤드라인 3값 대비 카드(§2-1) — 우리 반=채움 막대, 도 평균=실선 마커, 도 중앙값=점선 마커,
   백분위=우상단 배지, 범례 상시(값 병기, x축 라벨 겹침 회피). */
function _bmHeadlineHero(h, m){
  if (!h || h.mineValue == null){
    return `<div class="bm-hero"><div class="bm-hero-sentence">우리 반의 ${escapeHtml(m.label)} 값을 아직 만들 수 없어요. 학습·평가가 쌓이면 보여드릴게요.</div></div>`;
  }
  const unit = h.unit || m.unit;
  const masked = h.masked || h.provMean == null;
  const mineTxt = _bmNum(h.mineValue, m);
  const badge = masked
    ? `<span class="bm-badge bm-badge--muted"><i class="fas fa-ranking-star" aria-hidden="true"></i> 도 표본 부족</span>`
    : _bmPctlBadge(h.percentile);
  let sentence = `우리 반 <b>${mineTxt}${unit}</b>`;
  sentence += masked
    ? ` · <span style="color:var(--gray-500);">충북 동학년 표본이 아직 적어 평균·중앙값을 숨겼어요</span>`
    : ` · 충북 평균 <b>${_bmNum(h.provMean,m)}${unit}</b> · 중앙값 <b>${_bmNum(h.provMedian,m)}${unit}</b>`;
  const cand = [h.mineValue, h.provMean, h.provMedian, h.provP75].filter(v=>v!=null && !isNaN(v));
  const trackMax = m.pct ? 100 : Math.max(1, Math.ceil(Math.max.apply(null, cand.concat([1])) * 1.15));
  const pos = v => (v==null ? null : Math.max(0, Math.min(100, v / trackMax * 100)));
  const mineW = pos(h.mineValue) || 0;
  const markers = masked ? '' :
    `<span class="bm-marker bm-marker--mean" style="left:${pos(h.provMean)}%;" title="도 평균 ${_bmNum(h.provMean,m)}${unit}"></span>
     <span class="bm-marker bm-marker--median" style="left:${pos(h.provMedian)}%;" title="도 중앙값 ${_bmNum(h.provMedian,m)}${unit}"></span>`;
  const legend = masked
    ? `<span class="sw"><i class="bm-sw-fill"></i> 우리 반 ${mineTxt}${unit}</span>`
    : `<span class="sw"><i class="bm-sw-fill"></i> 우리 반 ${mineTxt}${unit}</span>
       <span class="sw"><i class="bm-sw-mean"></i> 도 평균(실선) ${_bmNum(h.provMean,m)}${unit}</span>
       <span class="sw"><i class="bm-sw-median"></i> 도 중앙값(점선) ${_bmNum(h.provMedian,m)}${unit}</span>`;
  const note = masked ? '' :
    `<div class="bm-hero-note">평균과 중앙값이 다르면 충북 안에 유독 높거나 낮은 반이 섞여 있다는 뜻이에요. 상위%는 충북 같은 학년 학생들 대비 우리 반 평균의 위치예요(시연 시드 기준).</div>`;
  return `<div class="bm-hero">
    <div class="bm-hero-top"><div class="bm-hero-sentence">${sentence}</div>${badge}</div>
    <div class="bm-track" role="img" aria-label="우리 반 ${mineTxt}${unit}${masked?'':', 도 평균 '+_bmNum(h.provMean,m)+unit}">
      <span class="bm-fill" style="width:${mineW}%;">${mineW>=16?mineTxt:''}</span>${markers}
    </div>
    <div class="bm-legend">${legend}</div>${note}
  </div>`;
}
/* KPI 4종(내 클래스 vs 도 평균) — 비율지표(정답률·도달률) 색델타, 누적지표(학습시간·활용률)
   중립 '누적·참고' 톤(충북 시드 학생 활동량↑으로 절대비교 부정직 방지 — §정직성). */
function _bmKpiRow(mine, prov){
  const field = { score:'avgScore', reach:'reachRate', time:'avgLearnMin', usage:'avgActsPerStudent' };
  const cards = BM_METRICS.map(m=>{
    const mv = mine ? mine[field[m.key]] : null;
    const pv = prov ? prov[field[m.key]] : null;
    const val = _bmNum(mv, m);
    let trend, tone;
    if (mv == null || pv == null){ trend={dir:'flat', text:'표본 부족'}; tone='muted'; }
    else if (m.vol){ trend={dir:'flat', text:`도 ${_bmNum(pv,m)}${m.unit} · 누적 참고`}; tone='muted'; }
    else {
      const d = mv - pv, du = _bmDeltaUnit(m);
      const av = Math.abs(Math.round(d));
      trend = { dir: d>0?'up':d<0?'down':'flat', text:`도 ${_bmNum(pv,m)}${m.unit} · ${d>0?'+':d<0?'−':''}${av}${du}` };
      tone = d>0?'success':d<0?'danger':'muted';
    }
    return kpiCard(m.label, val, m.unit, trend, tone);
  }).join('');
  return `<section class="dc-kpi-grid">${cards}</section>`;
}

/* ======================================================================
 * VIEWS['t-benchmark'] — [교사] 도 벤치마크(내 클래스 vs 충북 동학년) · analytics
 * ==================================================================== */
function _bmBindCommon(root, rerun){
  // 클래스 칩 → 전체 재조회(반→학년 매칭 갱신). 교과 present 캐시는 유지.
  root.querySelectorAll('#bmClassToggle button[data-bmclass]').forEach(b=>{
    b.onclick = ()=>{ if (String(state._bmClassId)===b.dataset.bmclass) return; state._bmClassId = b.dataset.bmclass; rerun(); };
  });
  // 실데이터 토글(뷰 내부) → realKey 상태 갱신 후 재조회.
  const rt = root.querySelector('#bmRealToggle');
  if (rt){
    const key = rt.getAttribute('data-realkey');
    rt.querySelectorAll('button[data-bmreal]').forEach(b=>{
      b.onclick = ()=>{ const on = b.dataset.bmreal==='1'; if (!!state[key]===on) return; state[key]=on; rerun(); };
    });
  }
}
VIEWS['t-benchmark'] = async function(root){
  root.innerHTML = tplLoading(3);
  const owned = await _bmFetchOwnedClasses();
  if (!owned.length){ root.innerHTML = BM_STYLE + _bmNoClassPanel(); return; }
  // 상태 기본값
  if (state._bmClassId == null || !owned.some(c=>String(c.id)===String(state._bmClassId))) state._bmClassId = owned[0].id;
  if (!state._bmSubject) state._bmSubject = 'all';
  if (!state._bmLevel) state._bmLevel = 'subject';
  if (!state._bmMetric) state._bmMetric = 'score';
  const realOn = !!state._bmRealOnly;
  const level = state._bmLevel;
  // 성취기준 level 은 도달률 고정(cells 가 도달률 기반)
  const metricKey = level === 'achievement' ? 'reach' : (BM_METRIC_BY[state._bmMetric] ? state._bmMetric : 'score');
  const m = BM_METRIC_BY[metricKey];

  const d = await apiGet('/api/lrs/stats/benchmark', {
    classId: state._bmClassId, level, subject: state._bmSubject, metric: metricKey, realOnly: realOn?'1':'0'
  });
  if (!d || !d.success){ root.innerHTML = tplError('도 벤치마크 데이터를 불러오지 못했습니다', ()=>VIEWS['t-benchmark'](root)); return; }

  // 교과 present 캐시(subject=all 응답일 때 파생) — 칩 죽음 방지
  if (state._bmSubject === 'all' && Array.isArray(d.cells) && level === 'subject'){
    state._bmSubjCache = state._bmSubjCache || {};
    state._bmSubjCache[String(state._bmClassId) + (realOn?'_r':'')] = d.cells.map(c=>({ key:c.subject, label:c.label, present:true })).filter(s=>s.key);
  }
  const availSubs = await _bmPresentSubjects(state._bmClassId, realOn);

  // ── 필터바 구성 ──
  const classChips = owned.length > 1 ? _bmClassChipsHtml(owned, state._bmClassId) : '';
  const subjChips = availSubs.length
    ? `<div class="dc-unit-toggle" id="bmSubjToggle" role="group" aria-label="교과 선택"><span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(availSubs, state._bmSubject)}</div>`
    : '';
  const levelSeg = `<div class="dc-unit-toggle" id="bmLevelToggle" role="group" aria-label="비교 단위">
      <span class="dc-eq-flabel">비교 단위</span>
      <button class="chip" type="button" data-bmlevel="subject" aria-pressed="${level==='subject'?'true':'false'}">교과별</button>
      <button class="chip" type="button" data-bmlevel="achievement" aria-pressed="${level==='achievement'?'true':'false'}">성취기준별</button>
    </div>`;
  const metricSeg = (level === 'subject') ? `<div class="dc-unit-toggle" id="bmMetricToggle" role="group" aria-label="비교 지표">
      <span class="dc-eq-flabel">비교 지표</span>
      ${BM_METRICS.map(mm=>`<button class="chip" type="button" data-bmmetric="${mm.key}" aria-pressed="${mm.key===metricKey?'true':'false'}">${mm.label}</button>`).join('')}
    </div>` : '';
  const clsName = d.className || (owned.find(c=>String(c.id)===String(state._bmClassId))||{}).name || '';
  const subjLabel = state._bmSubject!=='all' ? (_eqSubjectLabelOf(state._bmSubject)||'') : '전체';
  const summary = `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(clsName)} · ${escapeHtml(subjLabel)} · ${level==='achievement'?'성취기준별':'교과별'}${level==='subject'?(' · '+escapeHtml(m.label)):''}</div>`;
  const volCaption = (level==='subject')
    ? `<div class="bm-caption">정답률·도달률은 학생별 비율이라 반↔도 비교가 공정해요. 학습시간·활용률은 충북 시드 학생의 누적 기록이 많아 절대 비교는 참고용이에요.</div>`
    : `<div class="bm-caption">표본이 충분한(도 50명 이상 학습한) 초등 코어 성취기준만 보여드려요. 우리 반이 평가한 기준만 비교표에 담아요.</div>`;

  const filterbar = `<div class="bm-filterbar">
    <div class="bm-frow">${classChips}${levelSeg}</div>
    <div class="bm-frow">${subjChips}${metricSeg}</div>
    ${volCaption}
    ${summary}
  </div>`;

  // ── 도 학년 파생 불가 / 성취기준 초등 전용 안내(정직 빈) ──
  const gradeLine = d.gradeLabel ? `충북 <b>${escapeHtml(d.gradeLabel)}</b>` : '충북 동학년';
  if (d.empty){
    const msg = d.emptyReason === 'achievement_elementary_only'
      ? '성취기준 단위 벤치마크는 초등학교 반만 제공돼요. 이 반은 교과별 비교를 이용해 주세요.'
      : (d.message || '이 반의 학년 정보를 확인할 수 없어 도 비교를 만들 수 없어요.');
    root.innerHTML = BM_STYLE + _bmSeedBar(d.seedNotice, realOn, '_bmRealOnly')
      + `<div class="bm-block"><h2 class="bm-sec-title">도 벤치마크 비교</h2>
         <p class="bm-sec-sub">우리 반이 ${gradeLine} 대비 어디쯤 있는지 성취(정답률·도달률) 중심으로 보여줘요.</p></div>`
      + filterbar + tplEmpty(msg);
    _bmBindCommon(root, ()=>VIEWS['t-benchmark'](root));
    _bmBindBenchToggles(root);
    return;
  }

  const cells = Array.isArray(d.cells) ? d.cells : [];
  // 성취기준: 우리 반이 평가한(mine.n>0) 코드만 비교표에 — 미평가 코어 개수는 캡션.
  const isAch = (level === 'achievement');
  const rowsRaw = isAch ? cells.filter(c=>c.mine && c.mine.value != null) : cells;
  const excludedAch = isAch ? (cells.length - rowsRaw.length) : 0;
  const rows = rowsRaw.map(c=>({
    label: c.label, code: c.code || null, fullLabel: c.fullLabel || null,
    mineVal: c.mine ? c.mine.value : null, mineN: c.mine ? c.mine.n : 0,
    provMean: c.province ? c.province.mean : null, provMedian: c.province ? c.province.median : null,
    delta: c.delta, pctl: c.percentile, provN: c.province ? c.province.n : 0,
    masked: !!c.masked, lowConf: !!c.lowConfidence
  }));

  root.innerHTML = BM_STYLE
    + _bmSeedBar(d.seedNotice, realOn, '_bmRealOnly')
    + `<div class="bm-block"><h2 class="bm-sec-title">도 벤치마크 비교</h2>
       <p class="bm-sec-sub">우리 반이 <b>${escapeHtml(clsName)}</b> · ${gradeLine} 대비 어디쯤 있는지 성취 중심으로 보여줘요. 평균·중앙값·상위%를 함께 봐요.</p></div>`
    + filterbar
    + `<div id="bmHero"></div>`
    + `<div class="bm-block">${_bmKpiRow(d.mine, d.province)}</div>`
    + `<section class="dc-chart-wrapper">
         <header><div><h2>${isAch ? '성취기준별 우리 반 vs 충북' : '교과별 우리 반 vs 충북'}</h2>
         <div class="subtitle">${isAch
            ? '델타(+)=충북보다 잘 도달 · (−)=충북보다 낮음. 우리 반이 평가한 성취기준만 보여요.'
            : '델타(+)=충북보다 높음 · (−)=낮음. 도 표본이 적은 교과는 회색으로 표시돼요.'}</div></div></header>
         <div id="bmCells"></div>
         <p class="rb-foot" id="bmCellsFoot" style="font-size:13px;color:var(--gray-500);line-height:1.6;margin:12px 0 0;"></p>
       </section>`;

  // 헤드라인 3값 대비 + 백분위
  document.getElementById('bmHero').innerHTML = _bmHeadlineHero(d.headline, m);

  // 셀 표(교과별/성취기준별)
  const host = document.getElementById('bmCells');
  if (!rows.length){
    host.innerHTML = tplEmpty(isAch
      ? '아직 우리 반이 평가한 코어 성취기준이 없어요. 교과별 비교부터 확인해 주세요.'
      : '아직 비교할 교과 데이터가 부족해요.');
  } else {
    const labelCol = isAch
      ? { key:'label', label:'성취기준', format:(v,r)=> `<span title="${escapeAttr(r.fullLabel||v)}">${escapeHtml(v)}</span>${r.code?` <span style="font-size:13px;color:var(--gray-500);">[${escapeHtml(String(r.code).replace(/[\[\]]/g,''))}]</span>`:''}` }
      : { key:'label', label:'교과', format:(v)=> escapeHtml(v) };
    const cols = [
      labelCol,
      { key:'mineVal', label:'내 클래스', align:'right', format:(v,r)=> v==null
          ? '<span style="color:var(--gray-400);">기록 없음</span>'
          : `${escapeHtml(_bmNum(v,m))}${m.unit}${r.mineN!=null?`<div style="font-size:13px;color:var(--gray-500);">${r.mineN}명</div>`:''}` },
      { key:'provMean', label:'도 평균', align:'right', format:(v,r)=> r.masked
          ? '<span style="color:var(--gray-400);">표본 부족</span>'
          : `${escapeHtml(_bmNum(v,m))}${m.unit}${(!isAch && r.provMedian!=null)?`<div style="font-size:13px;color:var(--gray-500);">중앙값 ${_bmNum(r.provMedian,m)}${m.unit}</div>`:''}` },
      { key:'delta', label:'델타', align:'right', format:(v,r)=> r.masked ? '<span class="dc-badge dc-badge--muted">-</span>' : _bmDeltaBadge(v, m) },
    ];
    if (!isAch) cols.push({ key:'pctl', label:'백분위', align:'right', format:(v)=> v==null ? '<span style="color:var(--gray-400);">-</span>' : _bmPctlBadge(v) });
    cols.push({ key:'provN', label: isAch ? '도 평가 n' : '도 표본', align:'right', format:(v)=> `${escapeHtml(String(v||0))}명` });
    renderDataTable(host, { columns: cols, rows, initialSort:'delta', initialDir:'desc' });
  }
  // 캡션(저신뢰·미평가 코어)
  const foot = document.getElementById('bmCellsFoot');
  if (foot){
    const bits = [];
    bits.push('<i class="fas fa-circle-info" aria-hidden="true"></i> 우리 반은 6~10명 규모라 표본이 작아요 — 학생 한 명이 값을 크게 좌우할 수 있어요(참고용).');
    if (isAch && excludedAch > 0) bits.push(`우리 반이 아직 평가하지 않은 코어 성취기준 <b>${excludedAch}개</b>는 비교표에서 제외했어요.`);
    foot.innerHTML = bits.join(' ');
  }

  _bmBindCommon(root, ()=>VIEWS['t-benchmark'](root));
  _bmBindBenchToggles(root);
};
/* 벤치마크 전용 토글(교과·비교단위·지표) 바인딩 — 전체 재렌더. */
function _bmBindBenchToggles(root){
  root.querySelectorAll('#bmSubjToggle button[data-subj]').forEach(b=>{
    b.onclick = ()=>{ if ((state._bmSubject||'all')===b.dataset.subj) return; state._bmSubject = b.dataset.subj; VIEWS['t-benchmark'](root); };
  });
  root.querySelectorAll('#bmLevelToggle button[data-bmlevel]').forEach(b=>{
    b.onclick = ()=>{ if (state._bmLevel===b.dataset.bmlevel) return; state._bmLevel = b.dataset.bmlevel;
      if (b.dataset.bmlevel==='achievement') state._bmSubject = 'all'; VIEWS['t-benchmark'](root); };
  });
  root.querySelectorAll('#bmMetricToggle button[data-bmmetric]').forEach(b=>{
    b.onclick = ()=>{ if (state._bmMetric===b.dataset.bmmetric) return; state._bmMetric = b.dataset.bmmetric; VIEWS['t-benchmark'](root); };
  });
}

/* ======================================================================
 * VIEWS['t-daily-benchmark'] — [교사] 오늘의 학습 도 비교(일자별) · activities
 * ==================================================================== */
const DB_RANGES = [['today','오늘'],['7d','최근 7일'],['30d','최근 30일'],['custom','기간 지정']];
function _dbTodayIso(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function _dbRangeFromTo(range){
  const to = _dbTodayIso();
  if (range === 'today') return { from: to, to };
  if (range === '7d'){ const d=new Date(); d.setDate(d.getDate()-6); return { from:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, to }; }
  if (range === '30d'){ const d=new Date(); d.setDate(d.getDate()-29); return { from:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, to }; }
  // custom
  return { from: state._dbFrom || '', to: state._dbTo || to };
}
function _dbRangeLabel(range){ const f=DB_RANGES.find(r=>r[0]===range); return f?f[1]:'최근 30일'; }
function _fmtMD(iso){ const p=String(iso||'').split('-'); return p.length===3 ? `${Number(p[1])}/${Number(p[2])}` : String(iso||''); }

VIEWS['t-daily-benchmark'] = async function(root){
  root.innerHTML = tplLoading(3);
  const owned = await _bmFetchOwnedClasses();
  if (!owned.length){ root.innerHTML = BM_STYLE + _bmNoClassPanel(); return; }
  if (state._dbClassId == null || !owned.some(c=>String(c.id)===String(state._dbClassId))) state._dbClassId = owned[0].id;
  if (!state._dbRange) state._dbRange = '30d';
  if (!state._dbSubject) state._dbSubject = 'all';
  if (!state._dbGran) state._dbGran = 'day';
  const realOn = !!state._dbRealOnly;

  const { from, to } = _dbRangeFromTo(state._dbRange);
  // custom 역순 방어 — 재조회 차단(빈 셸 + 인라인 에러)
  const badRange = (state._dbRange==='custom' && from && to && from > to);

  const availSubs = await _bmPresentSubjects(state._dbClassId, realOn);
  let d = null;
  if (!badRange && from && to){
    d = await apiGet('/api/lrs/stats/daily-benchmark', {
      classId: state._dbClassId, subject: state._dbSubject, from, to, granularity: state._dbGran, realOnly: realOn?'1':'0'
    });
  }

  // ── 필터바 ──
  const classChips = owned.length > 1 ? _bmClassChipsHtml(owned, state._dbClassId) : '';
  const rangeSeg = `<div class="dc-unit-toggle" id="dbRangeToggle" role="group" aria-label="기간">
      <span class="dc-eq-flabel">기간</span>
      ${DB_RANGES.map(([v,l])=>`<button class="chip" type="button" data-dbrange="${v}" aria-pressed="${state._dbRange===v?'true':'false'}">${l}</button>`).join('')}
    </div>`;
  const today = _dbTodayIso();
  const customRow = state._dbRange==='custom'
    ? `<div class="bm-frow"><div class="bm-date-range">
         <input type="date" id="dbFrom" value="${escapeAttr(state._dbFrom||'')}" max="${today}" aria-label="시작일">
         <span>~</span>
         <input type="date" id="dbTo" value="${escapeAttr(state._dbTo||today)}" max="${today}" aria-label="종료일">
         <button class="btn btn-sm" type="button" id="dbApply">적용</button>
         ${badRange?'<span class="bm-date-err">시작일이 종료일보다 늦어요.</span>':''}
       </div></div>`
    : '';
  const subjChips = availSubs.length
    ? `<div class="dc-unit-toggle" id="dbSubjToggle" role="group" aria-label="교과 선택"><span class="dc-eq-flabel">교과</span>${_eqSubjectChipsHtml(availSubs, state._dbSubject)}</div>`
    : '';
  const granSeg = `<div class="dc-unit-toggle" id="dbGranToggle" role="group" aria-label="집계 단위">
      <span class="dc-eq-flabel">단위</span>
      <button class="chip" type="button" data-dbgran="day" aria-pressed="${state._dbGran==='day'?'true':'false'}">일별</button>
      <button class="chip" type="button" data-dbgran="week" aria-pressed="${state._dbGran==='week'?'true':'false'}">주별</button>
    </div>`;
  const clsName = (d && d.className) || (owned.find(c=>String(c.id)===String(state._dbClassId))||{}).name || '';
  const gradeLbl = (d && d.gradeLabel) ? d.gradeLabel : '동학년';
  const subjLbl = state._dbSubject!=='all' ? (_eqSubjectLabelOf(state._dbSubject)||'') : '전체';
  const summary = `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(_dbRangeLabel(state._dbRange))} · ${escapeHtml(clsName)} · ${escapeHtml(subjLbl)}${state._dbGran==='week'?' · 주별':''}</div>`;
  const subjCap = state._dbSubject!=='all' ? `<div class="bm-caption">교과를 좁히면 도 표본이 얇아질 수 있어요(표본이 적은 날은 회색으로 표시돼요).</div>` : '';

  const filterbar = `<div class="bm-filterbar">
    <div class="bm-frow">${rangeSeg}</div>
    ${customRow}
    <div class="bm-frow">${classChips}${subjChips}${granSeg}</div>
    ${subjCap}${summary}
  </div>`;

  const head = `<div class="bm-block"><h2 class="bm-sec-title">오늘의 학습 · 충북 도 비교</h2>
    <p class="bm-sec-sub">우리 반 오늘의 학습이 충북 <b>${escapeHtml(gradeLbl)}</b>와 견줘 일자별로 어떤지 정답률·학습시간으로 보여줘요.</p></div>`;

  // ── 오류/역순/빈 분기 ──
  if (badRange){
    root.innerHTML = BM_STYLE + _bmSeedBar('도 전체 수치는 시연용 시드 데이터 기반이에요. 실데이터가 쌓이면 자동 전환돼요.', realOn, '_dbRealOnly')
      + head + filterbar + tplEmpty('시작일이 종료일보다 늦어요. 날짜를 다시 선택해 주세요.');
    _bmBindDaily(root); return;
  }
  if (!d || !d.success){
    root.innerHTML = BM_STYLE + _bmSeedBar('도 전체 수치는 시연용 시드 데이터 기반이에요. 실데이터가 쌓이면 자동 전환돼요.', realOn, '_dbRealOnly')
      + head + filterbar + tplError('오늘의 학습 도 비교 데이터를 불러오지 못했습니다', ()=>VIEWS['t-daily-benchmark'](root));
    _bmBindDaily(root); return;
  }

  const series = Array.isArray(d.series) ? d.series : [];
  const sm = d.summary || {};
  const clsHasData = series.some(s=>s.class && s.class.n>0);

  // ── 요약 KPI(3장): 오늘/기간 정답률 · 학습시간 · 백분위 ──
  const isSingle = (state._dbRange==='today') || (from===to);
  const accLabel = isSingle ? '오늘 정답률' : '기간 평균 정답률';
  const timeLabel = isSingle ? '오늘 학습시간' : '기간 일평균 학습시간';
  const accTrend = (sm.classAcc!=null && sm.provinceAcc!=null)
    ? { dir: sm.accGapPP>0?'up':sm.accGapPP<0?'down':'flat', text:`충북 ${Math.round(sm.provinceAcc)}% · ${sm.accGapPP>0?'+':sm.accGapPP<0?'−':''}${Math.abs(Math.round(sm.accGapPP||0))}%p` }
    : { dir:'flat', text: sm.provinceAcc!=null?`충북 ${Math.round(sm.provinceAcc)}%`:'표본 부족' };
  const accTone = (sm.classAcc==null||sm.provinceAcc==null)?'muted':(sm.accGapPP>0?'success':sm.accGapPP<0?'danger':'muted');
  const timeTrend = (sm.classTime!=null && sm.provinceTime!=null)
    ? { dir: (sm.classTime-sm.provinceTime)>0?'up':(sm.classTime-sm.provinceTime)<0?'down':'flat', text:`충북 ${sm.provinceTime}분 · ${(sm.classTime-sm.provinceTime)>0?'+':(sm.classTime-sm.provinceTime)<0?'−':''}${Math.abs(sm.classTime-sm.provinceTime)}분` }
    : { dir:'flat', text: sm.provinceTime!=null?`충북 ${sm.provinceTime}분`:'표본 부족' };
  const timeTone = (sm.classTime==null||sm.provinceTime==null)?'muted':((sm.classTime-sm.provinceTime)>0?'success':(sm.classTime-sm.provinceTime)<0?'danger':'muted');
  const pctlVal = sm.percentile!=null ? `상위 ${Math.max(1,Math.round(sm.percentile))}%` : '표본 부족';
  const kpi = `<section class="bm-kpi3">
    ${kpiCard(accLabel, sm.classAcc!=null?Math.round(sm.classAcc):'-', '%', accTrend, accTone)}
    ${kpiCard(timeLabel, sm.classTime!=null?sm.classTime:'-', '분', timeTrend, timeTone)}
    ${kpiCard('충북 동학년 중 위치', pctlVal, '', { dir:'flat', text: isSingle?'오늘 기준':'기간 평균 기준' }, sm.percentile==null?'muted':(sm.percentile<=25?'success':sm.percentile<=50?'primary':sm.percentile<=74?'muted':'warning'))}
  </section>`;

  // 도 커버리지 + 우리 반 빈 안내
  const coverIns = d.coverageNote ? _reportInsightHtml({ level:'info', text:`${d.coverageNote}. 표본이 적은 날의 충북 값은 회색으로 비워 정직하게 표시해요.` }) : '';
  const emptyIns = !clsHasData
    ? _reportInsightHtml({ level:'warn', text:'이 기간에는 우리 반 오늘의 학습 기록이 없어요. 아래 충북 흐름만 참고하시고, 기간을 넓히거나 「기간 지정」으로 학습이 있었던 날짜를 골라보세요.' })
    : '';

  root.innerHTML = BM_STYLE
    + _bmSeedBar(d.seedNotice, realOn, '_dbRealOnly')
    + head + filterbar
    + `<div class="lrs-insight-wrap" style="margin:0 0 var(--space-4);">${coverIns}${emptyIns}</div>`
    + `<div class="bm-block">${kpi}</div>`
    + `<section class="dc-chart-wrapper bm-block">
         <header><div><h2>일자별 정답률</h2><div class="subtitle">실선=우리 반 · 점선=충북 동학년 · 도 표본이 적은 날은 선이 끊겨요</div></div></header>
         <div class="chart-body" style="height:260px;"><canvas id="dbAccChart" role="img" aria-label="일자별 정답률 라인차트"></canvas></div>
       </section>`
    + `<section class="dc-chart-wrapper bm-block">
         <header><div><h2>일자별 학습시간(분)</h2><div class="subtitle">실선=우리 반 · 점선=충북 동학년 · 학생 1인당 하루 평균</div></div></header>
         <div class="chart-body" style="height:260px;"><canvas id="dbTimeChart" role="img" aria-label="일자별 학습시간 라인차트"></canvas></div>
       </section>`
    + `<section class="dc-chart-wrapper">
         <header><div><h2>일자별 상세</h2><div class="subtitle">열 머리글로 정렬 · 도 표본이 적은 날은 회색</div></div></header>
         <div id="dbTable"></div>
       </section>`;

  // ── 라인 차트 2종(정답률·학습시간) — 이중축 금지, 세로 스택 ──
  const labels = series.map(s=>_fmtMD(s.date));
  const mineAcc = series.map(s=> (s.class && s.class.n>0) ? s.class.acc : null);
  const provAcc = series.map(s=> (s.province && !s.province.masked) ? s.province.acc : null);
  const mineTime = series.map(s=> (s.class && s.class.n>0) ? s.class.timeMin : null);
  const provTime = series.map(s=> (s.province && !s.province.masked) ? s.province.timeMin : null);
  const lineOpts = (yMax) => ({
    spanGaps:false,
    scales:{ y:{ min:0, ...(yMax?{max:yMax}:{}), ticks:{ font:{size:LRS_CHART_FONT_SIZE} } },
             x:{ ticks:{ font:{size:LRS_CHART_FONT_SIZE}, maxRotation:0, autoSkip:true } } },
    plugins:{ legend:{ position:'bottom', labels:{ font:{size:LRS_CHART_FONT_SIZE}, usePointStyle:true, boxWidth:14, padding:10 } } }
  });
  const mkLine = (canvasId, mineArr, provArr, yMax) => mkChart(document.getElementById(canvasId), 'line', {
    labels,
    datasets:[
      { label:'우리 반', data:mineArr, borderColor:'var(--lrs-primary)', backgroundColor:'var(--lrs-primary)',
        borderWidth:2.5, pointRadius:2.5, tension:0.25, spanGaps:false },
      { label:'충북 동학년', data:provArr, borderColor:'#9ca3af', backgroundColor:'#9ca3af',
        borderWidth:2, borderDash:[6,4], pointRadius:2, tension:0.25, spanGaps:false }
    ]
  }, lineOpts(yMax));
  mkLine('dbAccChart', mineAcc, provAcc, 100);
  mkLine('dbTimeChart', mineTime, provTime, null);

  // ── 일자별 표 ──
  const tblRows = series.slice().reverse().map(s=>({
    date: s.date, dateLabel: _fmtMD(s.date),
    mineAcc: (s.class && s.class.n>0) ? s.class.acc : null,
    provAcc: (s.province && !s.province.masked) ? s.province.acc : null,
    gap: (s.class && s.class.n>0 && s.province && !s.province.masked) ? Math.round((s.class.acc - s.province.acc)*10)/10 : null,
    mineTime: (s.class && s.class.n>0) ? s.class.timeMin : null,
    provTime: (s.province && !s.province.masked) ? s.province.timeMin : null,
    provN: s.province ? s.province.n : 0
  }));
  renderDataTable(document.getElementById('dbTable'), {
    columns:[
      { key:'dateLabel', label:'일자', format:(v)=> escapeHtml(v) },
      { key:'mineAcc', label:'내 반 정답률', align:'right', format:(v)=> v==null?'<span style="color:var(--gray-400);">-</span>':`${Number(v).toFixed(1)}%` },
      { key:'provAcc', label:'도 정답률', align:'right', format:(v,r)=> v==null?`<span style="color:var(--gray-400);">표본 부족${r.provN?` (${r.provN}명)`:''}</span>`:`${Number(v).toFixed(1)}%` },
      { key:'gap', label:'델타', align:'right', format:(v)=> v==null?'<span class="dc-badge dc-badge--muted">-</span>':(v>0?`<span class="dc-badge dc-badge--success">▲ +${v}%p</span>`:v<0?`<span class="dc-badge dc-badge--danger">▼ −${Math.abs(v)}%p</span>`:'<span class="dc-badge dc-badge--muted">± 0%p</span>') },
      { key:'mineTime', label:'내 반 시간(분)', align:'right', format:(v)=> v==null?'<span style="color:var(--gray-400);">-</span>':escapeHtml(String(v)) },
      { key:'provTime', label:'도 시간(분)', align:'right', format:(v)=> v==null?'<span style="color:var(--gray-400);">-</span>':escapeHtml(String(v)) },
      { key:'provN', label:'도 표본', align:'right', format:(v)=> `${escapeHtml(String(v||0))}명` },
    ],
    rows: tblRows, initialSort:'date', initialDir:'desc'
  });

  _bmBindDaily(root);
};
/* 데일리 벤치마크 필터 바인딩 — 전체 재렌더. */
function _bmBindDaily(root){
  _bmBindCommon(root, ()=>VIEWS['t-daily-benchmark'](root)); // 클래스 칩은 _dbClassId 를 써야 하므로 별도 처리
  // 클래스 칩(_dbClassId) 재바인딩(공통은 _bmClassId 대상)
  root.querySelectorAll('#bmClassToggle button[data-bmclass]').forEach(b=>{
    b.onclick = ()=>{ if (String(state._dbClassId)===b.dataset.bmclass) return; state._dbClassId = b.dataset.bmclass; VIEWS['t-daily-benchmark'](root); };
  });
  // 실데이터 토글(_dbRealOnly)은 _bmBindCommon 이 data-realkey 로 처리(셸에서 '_dbRealOnly' 전달)
  root.querySelectorAll('#dbRangeToggle button[data-dbrange]').forEach(b=>{
    b.onclick = ()=>{ if (state._dbRange===b.dataset.dbrange) return; state._dbRange = b.dataset.dbrange;
      if (b.dataset.dbrange==='custom' && !state._dbFrom){ const r=_dbRangeFromTo('30d'); state._dbFrom=r.from; state._dbTo=r.to; }
      VIEWS['t-daily-benchmark'](root); };
  });
  root.querySelectorAll('#dbSubjToggle button[data-subj]').forEach(b=>{
    b.onclick = ()=>{ if ((state._dbSubject||'all')===b.dataset.subj) return; state._dbSubject = b.dataset.subj; VIEWS['t-daily-benchmark'](root); };
  });
  root.querySelectorAll('#dbGranToggle button[data-dbgran]').forEach(b=>{
    b.onclick = ()=>{ if (state._dbGran===b.dataset.dbgran) return; state._dbGran = b.dataset.dbgran; VIEWS['t-daily-benchmark'](root); };
  });
  const applyBtn = root.querySelector('#dbApply');
  if (applyBtn){
    applyBtn.onclick = ()=>{
      const f = root.querySelector('#dbFrom'), t = root.querySelector('#dbTo');
      state._dbFrom = (f && f.value) || null; state._dbTo = (t && t.value) || null;
      state._dbRange = 'custom';
      VIEWS['t-daily-benchmark'](root);
    };
  }
}

/* ======================================================================
 * [Phase 3] VIEWS['t-behavior'] — [교사] 학습 행동 심화 분석 · activities
 *   기획: 보고서/LRS_Phase3_행동성취_UI_기획_v1.md((a) 흡수·확장) + _방법론_API_v1.md(정직성)
 *   BE: GET /api/lrs/stats/behavior?scope=class&classId=&signal=speed|retry|participation|video
 *   4신호 인페이지 세그먼트 탭. 신호①(풀이속도)은 기존 shallow 카드를 그대로 흡수(renderShallowLearning),
 *     상단에 그룹비교 막대(renderGroupCompare)만 얹음. [Phase 4a] 신호④(영상 학습 행동, video 우산)는
 *     완주율·재시청·건너뛰기 세로 3섹션 스택(renderVideoSignal) + 데모 계측 정직 배너로 활성화.
 *   상관≠인과 3중 안전장치: 상단 고정 캐비어트 배너 + 관찰형 insights + 하단 caveats 배너.
 *   재사용: _bmFetchOwnedClasses·_bmNoClassPanel·_bmSeedBar·_bmBindCommon·renderInsights·
 *     renderShallowLearning·_reportInsightHtml·tplEmpty/Error. 신규는 renderGroupCompare 1개.
 * ==================================================================== */
const BEHAV_SIGNALS = ['speed', 'retry', 'participation', 'video', 'social'];
const BEHAV_PERIOD_DAYS_FE = { '30d': 30, '90d': 90, 'term': 180 };
const BEHAV_SIG_META = {
  speed:         { num:'①', label:'풀이 속도',    icon:'⏱️',
    title:'풀이 속도와 성취의 관계',
    help:'같은 콘텐츠를 푼 우리 반 학생의 중앙값 시간을 기준으로 빠름/보통/느림 3그룹으로 나눠 그룹별 평균 정답률을 견줘요. 아래엔 정답·오답까지 교차한 6칸 매트릭스가 이어져요.' },
  retry:         { num:'②', label:'오답 재풀이',  icon:'🔁',
    title:'오답 재풀이와 성취의 관계',
    help:'오답노트 재풀이 기록의 유무로 두 그룹으로 나눠 그룹별 평균 성취(정답률)를 견줘요. 해결률은 데이터가 적어 사용하지 않아요.' },
  participation: { num:'③', label:'기간 내 참여', icon:'📅',
    title:'기한 내 참여와 성취의 관계',
    help:'실제 제출·이수 기록(과제 제출·평가 응시·수업 이수)의 유무로 참여/미참여를 나눠 그룹별 평균 성취를 견줘요. 기한준수(기한내/지연)는 로그 조인 불가로 계측하지 않아요.' },
  video:         { num:'④', label:'영상 학습 행동', icon:'🎬',
    title:'영상 학습 행동과 성취의 관계',
    help:'영상을 끝까지 봤는지(완주)·다시 봤는지(재시청)·건너뛰었는지(건너뛰기) 3가지를 성취와 견줘요. 현재는 시연용 데모 계측이에요.' },
  social:        { num:'⑤', label:'학급 관계·정서', icon:'🫂',
    title:'학급 관계·정서',
    help:'게시판 댓글·답글로 이어진 학급 관계망과 학급 전체 정서 분위기를 살펴봐요. 개별 학생을 판정하는 자료가 아니라 대화의 출발점이에요.' },
};
/* [Phase 4a] video 우산 3지표(완주율·재시청·건너뛰기) 세로 섹션 메타 — 라벨·(?)·마이크로 caveat(§7 고정 문안, 상관≠인과).
   micro 는 <b> 강조 포함 고정 HTML(사용자 데이터 없음 → 그대로 삽입). key 는 BE metrics[].key(completion|replay|seek). */
const VIDEO_METRIC_META = {
  completion: { num:'①', label:'완주율',   help:'영상을 얼마나 끝까지 봤는지(시청 비율)로 그룹을 나눠 그룹별 평균 도달률을 견줘요.',
    micro:'완주가 성취의 <b>원인</b>은 아니에요 — 이미 잘 아는 학생이 끝까지 볼 수도, 어려워서 오래 붙든 것일 수도 있어요.' },
  replay:     { num:'②', label:'재시청',   help:'같은 영상을 다시 본 횟수로 그룹을 나눠 그룹별 평균 도달률을 견줘요.',
    micro:'재시청은 <b>‘도움 신호’</b>일 수 있어요 — 어려워서 다시 챙겨 본 성실한 학생일 수 있어요(역인과). 재시청 많음을 문제로 보지 마세요.' },
  seek:       { num:'③', label:'건너뛰기', help:'영상 구간을 건너뛴 횟수를 반 중앙값으로 적음/많음으로 나눠 그룹별 평균 도달률을 견줘요.',
    micro:'건너뛰기가 많다고 <b>‘못한다’는 뜻이 아니에요</b> — 이미 아는 부분을 넘겼을 수도 있어요. 낮은 성취의 ‘원인’으로 단정하지 마세요.' },
};
// 그룹 톤 → 색(§6-1 토큰 계열 일치: 막대 채움/글자). BE groups[].tone(good/warn/info/danger).
const BEHAV_TONE = {
  good:   { fill:'#16a34a', text:'#15803d' },
  warn:   { fill:'#f59e0b', text:'#b45309' },
  info:   { fill:'#2563eb', text:'#1d4ed8' },
  danger: { fill:'#ef4444', text:'#b91c1c' },
};

/* ★신규 공통 위젯 — 행동 그룹 × 평균 성취 수평 막대(표본수 병기·소표본 마스킹·저신뢰 배지·반평균 기준선).
   cfg = { metricLabel, unit, groups:[{key,label,value|null,n,masked,lowConf|lowConfidence,tone}], refValue, comparison }.
   의미 순서 고정(정렬 금지) · n 무조건 병기 · masked 회색 해치 · 5≤n<10 '참고' 배지 · role=list 접근성. */
function renderGroupCompare(host, cfg){
  if (!host) return;
  cfg = cfg || {};
  const groups = Array.isArray(cfg.groups) ? cfg.groups : [];
  const unit = cfg.unit || '%';
  const metricLabel = cfg.metricLabel || '평균 성취';
  const refValue = (cfg.refValue != null && !isNaN(cfg.refValue)) ? Number(cfg.refValue) : null;
  if (!groups.length){ host.innerHTML = ''; return; }
  const refPct = refValue != null ? Math.max(0, Math.min(100, refValue)) : null;

  const rows = groups.map(g => {
    const tone = BEHAV_TONE[g.tone] || BEHAV_TONE.info;
    const n = Number(g.n) || 0;
    const low = !!(g.lowConf || g.lowConfidence);
    const nBadge = `<span class="behav-gc-n">· ${n}명</span>`;
    if (g.masked || g.value == null){
      return `<div class="behav-gc-row" role="listitem" aria-label="${escapeAttr(g.label + ', 표본 부족 ' + n + '명')}">
        <div class="behav-gc-label">${escapeHtml(g.label)}</div>
        <div class="behav-gc-track behav-gc-track--masked"><span class="behav-gc-maskn">표본 부족(n&lt;5)</span></div>
        <div class="behav-gc-meta"><span class="behav-gc-val behav-gc-val--muted">–</span>${nBadge}</div>
      </div>`;
    }
    const val = Number(g.value);
    const w = Math.max(2, Math.min(100, val));
    const lowBadge = low ? `<span class="behav-gc-low" title="표본 5~9명 — 참고">참고</span>` : '';
    const aria = `${g.label}, ${metricLabel} ${val}${unit}, ${n}명${low ? ', 참고' : ''}`;
    return `<div class="behav-gc-row" role="listitem" aria-label="${escapeAttr(aria)}">
      <div class="behav-gc-label">${escapeHtml(g.label)}</div>
      <div class="behav-gc-track">
        <span class="behav-gc-fill" style="width:${w}%;background:${tone.fill};"></span>
        ${refPct != null ? `<span class="behav-gc-ref" style="left:${refPct}%;"></span>` : ''}
      </div>
      <div class="behav-gc-meta"><span class="behav-gc-val" style="color:${tone.text};">${escapeHtml(String(val))}${unit}</span>${lowBadge}${nBadge}</div>
    </div>`;
  }).join('');

  const refLegend = refValue != null
    ? `<span class="behav-gc-reflegend"><i aria-hidden="true"></i> 반 평균 ${escapeHtml(String(refValue))}${unit}</span>` : '';
  const cmp = cfg.comparison;
  // 두 그룹이 동일(top===bot·gapPP 0)하면 '‘A’과(와) ‘A’ 격차 0%p' 무의미 라인이 되므로 미표시.
  // comparison 객체는 유지 → insight 는 gapPP≤3 '차이 없음' 로 정상 라우팅.
  const cmpLine = (cmp && cmp.gapPP != null && cmp.topLabel !== cmp.bottomLabel)
    ? `<div class="behav-gc-cmp"><i class="fas fa-left-right" aria-hidden="true"></i> ‘${escapeHtml(cmp.topLabel)}’과(와) ‘${escapeHtml(cmp.bottomLabel)}’ 그룹의 관측 격차 <b>${escapeHtml(String(cmp.gapPP))}%p</b> <span class="behav-gc-cmpnote">(${escapeHtml(cmp.note || '관측된 차이')})</span></div>`
    : '';

  host.innerHTML = `
    <div class="behav-gc-head"><span class="behav-gc-metric">${escapeHtml(metricLabel)}</span>${refLegend}</div>
    <div class="behav-gc" role="list" aria-label="${escapeAttr(metricLabel + ' 그룹 비교')}">${rows}</div>
    ${cmpLine}`;
}

/* 하단 caveats 배너(§4 상관≠인과 안전장치 — 접기 불가·항상 렌더). caveats[0]은 상단 배너로 노출하므로 여기선 나머지. */
function _behavCaveatsHtml(caveats){
  const list = Array.isArray(caveats) ? caveats.filter(Boolean) : [];
  if (!list.length) return '';
  return `<div class="behav-caveats" role="note" aria-label="해석할 때 주의사항">
    <div class="behav-caveats-h"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i> 해석할 때 꼭 기억해 주세요</div>
    <ul>${list.map(c => `<li>${escapeHtml(c)}</li>`).join('')}</ul>
  </div>`;
}

/* [Phase 4a] 영상 학습 행동(video 우산) — 완주율→재시청→건너뛰기 세로 3섹션 스택.
   각 섹션 = 섹션헤더(구분선+번호+라벨+?+표본칩) → renderGroupCompare(그룹×평균 도달률) → 지표별 마이크로 caveat.
   정직 3중: ★데모 계측 배너(신규 강조) + [시연 데모] pill + seedBar(뷰단) + 소표본 마스킹(renderGroupCompare 기존).
   빈 상태는 공유 tplEmpty 1개(3 빈 박스 금지). 성취 축 3지표 공통 '평균 도달률'(스케일 혼재 0). */
function renderVideoSignal(host, d){
  if (!host) return;
  const meta = BEHAV_SIG_META.video;
  const caveats = Array.isArray(d.caveats) ? d.caveats : [];
  const topCaveat = caveats.length ? _reportInsightHtml({ level:'info', text: caveats[0] }) : '';
  const studentCount = Number(d.studentCount) || 0;
  const periodLabel = d.period === '30d' ? '최근 30일' : (d.period === 'term' ? '이번 학기' : '최근 90일');
  const isDemo = d.instrumentation === 'demo' || d.demoInstrumented === true;
  const metrics = Array.isArray(d.metrics) ? d.metrics : [];

  const demoPill = isDemo ? `<span class="behav-demo-pill"><i class="fas fa-flask" aria-hidden="true"></i> 시연 데모</span>` : '';
  const header = `<header class="behav-card-head">
      <div class="behav-card-headmain">
        <h2 class="behav-card-title">${meta.icon} ${escapeHtml(meta.title)}<span class="lrs-help" tabindex="0" role="button" aria-label="${escapeAttr(meta.label)} 설명"><i class="fas fa-circle-question" aria-hidden="true"></i><span class="lrs-help-pop">${escapeHtml(meta.help)}</span></span>${demoPill}</h2>
        ${d.dataNote ? `<div class="behav-card-sub">${escapeHtml(d.dataNote)}</div>` : ''}
      </div>
      <div class="behav-headchips">
        <span class="behav-chip"><i class="fas fa-users" aria-hidden="true"></i> 대상 ${studentCount}명</span>
        <span class="behav-chip"><i class="fas fa-calendar-day" aria-hidden="true"></i> ${periodLabel} 누적</span>
      </div>
    </header>`;

  // ★ 데모 계측 배너(신규·강조) — 이 화면의 최우선 정직 장치. instrumentation:'live' 승격 시 자동 제거.
  const demoBanner = isDemo ? `<div class="behav-demo" role="note" aria-label="시연용 데모 계측 안내">
      <div class="behav-demo-h"><i class="fas fa-flask" aria-hidden="true"></i> 시연용 데모 계측</div>
      <p class="behav-demo-b">영상 완주·재시청·건너뛰기는 현재 <b>‘시연용 데모 계측’</b>이에요. 실제 영상 플레이어 계측(재생 위치·완주·구간 이동)은 향후 연동되면 자동으로 바뀌어요.</p>
    </div>` : '';

  const lowConfBanner = (d.lowConfidence && studentCount > 0)
    ? `<div class="behav-lowconf"><i class="fas fa-circle-info" aria-hidden="true"></i> 우리 반은 표본이 작아(성취 산출 ${studentCount}명) 그룹 경향이 불안정해요. 학습이 쌓이면 더 정확해져요.</div>`
    : '';

  let body;
  if (d.empty || !metrics.length){
    // 우산 전체 빈 — 공유 tplEmpty 1개(§8, 3 빈 박스 아님)
    body = `${tplEmpty(d.emptyReason || '우리 반의 영상 학습 기록이 아직 적어요. 영상 학습이 쌓이면 자동으로 채워져요.')}
      <div class="behav-foot"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(d.disclaimer || '')}</div>`;
  } else {
    const sections = metrics.map((m, i) => {
      const mm = VIDEO_METRIC_META[m.key] || { num:'', label:(m.label || ''), help:'', micro:'' };
      // 섹션 표본 칩 — 지표별 최대 밴드 n(distinct 학생 하한, 로스터 이하) · 전부 마스킹 시 '표본 부족'.
      const maxN = (m.groups || []).reduce((a, g) => Math.max(a, Number(g.n) || 0), 0);
      const sampleChip = m.masked
        ? `<span class="behav-sec-chip behav-sec-chip--muted">표본 부족</span>`
        : `<span class="behav-sec-chip">표본 ${maxN}명</span>`;
      const micro = mm.micro ? `<div class="behav-sec-micro"><i class="fas fa-circle-info" aria-hidden="true"></i> ${mm.micro}</div>` : '';
      return `<section class="behav-metric-sec"${i === 0 ? ' data-first="1"' : ''}>
        <div class="behav-sec-head">
          <span class="behav-sec-title"><span class="behav-sec-num">${mm.num}</span> ${escapeHtml(mm.label)} <span class="behav-sec-arrow">↔ 성취</span><span class="lrs-help" tabindex="0" role="button" aria-label="${escapeAttr(mm.label)} 설명"><i class="fas fa-circle-question" aria-hidden="true"></i><span class="lrs-help-pop">${escapeHtml(mm.help)}</span></span></span>
          ${sampleChip}
        </div>
        <div id="videoGC_${escapeAttr(m.key)}" class="behav-gc-wrap"></div>
        ${micro}
      </section>`;
    }).join('');
    body = sections + `<div class="behav-foot"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(d.disclaimer || '')}</div>`;
  }

  host.innerHTML = `<section class="dc-chart-wrapper behav-card" style="padding:24px 28px;border-radius:16px;">
      ${header}
      ${demoBanner}
      ${topCaveat}
      ${lowConfBanner}
      <div class="lrs-insight-wrap" id="behavInsights" style="display:none;"></div>
      ${body}
      ${_behavCaveatsHtml(caveats.slice(1))}
    </section>`;

  renderInsights(document.getElementById('behavInsights'), d.insights);
  // 3섹션 각각 renderGroupCompare(성취 축 공통 '평균 도달률') — 지표별 refValue/comparison 사용.
  metrics.forEach(m => {
    const gcHost = document.getElementById(`videoGC_${m.key}`);
    if (gcHost) renderGroupCompare(gcHost, {
      metricLabel: m.metricLabel || d.metricLabel, unit: m.unit || d.unit || '%',
      groups: m.groups, refValue: (m.refValue != null ? m.refValue : d.refValue), comparison: m.comparison,
    });
  });
}

/* [Phase 4b] 경량 결정론 소시오그램 SVG — 라이브러리 미도입. viewBox 0 0 680 680, 원형 등간격(12시 시계방향).
   노드 지름 36 균일(참여수 비례 절대 금지) · 엣지 곡선 Q(양방향 부호분리) · comment 실선/reply 파선(색맹 대응).
   노드 aria-label(이름·참여수, 감정 없음) · <title> 호버 · 엣지 aria-hidden. hideLabels 시 이름 pill 미렌더(번호만). */
function _socialSvg(nodes, edges, hideLabels){
  const cx = 340, cy = 340, R = 210, r = 18, n = nodes.length;
  const pos = new Map();
  nodes.forEach((nd, i) => {
    const th = -Math.PI / 2 + 2 * Math.PI * i / n;
    pos.set(nd.id, { x: cx + R * Math.cos(th), y: cy + R * Math.sin(th), th, i });
  });
  // 엣지(노드 아래) — 경계 r+3 에서 시작·끝(화살표 노드 정착), 제어점 수직오프셋 0.14·L·dir(양방향 좌우 분리).
  const edgeParts = [];
  edges.forEach(e => {
    const a = pos.get(e.from), b = pos.get(e.to);
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
    if (L < 1) return;
    const ux = dx / L, uy = dy / L;
    const x1 = a.x + ux * (r + 3), y1 = a.y + uy * (r + 3);
    const x2 = b.x - ux * (r + 3), y2 = b.y - uy * (r + 3);
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const nx = -uy, ny = ux;
    const dir = (Number(e.from) < Number(e.to)) ? 1 : -1;        // 양방향 쌍 좌우 반대 아크
    const k = 0.14 * L * dir;
    const qx = mx + nx * k, qy = my + ny * k;
    const w = Number(e.weight) || 1;
    const sw = (1.5 + Math.min(w, 5) * 0.6).toFixed(2);          // 1.5~4.5(과도 금지)
    const isReply = e.type === 'reply';
    const color = isReply ? '#8b5cf6' : '#64748b';
    const dash = isReply ? ' stroke-dasharray="5 4"' : '';
    const marker = isReply ? 'arw-reply' : 'arw-comment';
    edgeParts.push(`<path d="M ${x1.toFixed(1)} ${y1.toFixed(1)} Q ${qx.toFixed(1)} ${qy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${color}" stroke-width="${sw}"${dash} marker-end="url(#${marker})" opacity="0.72" aria-hidden="true"/>`);
  });
  // 노드(위) — 지름 36 균일. 중앙 색인번호(순위 아님) + (라벨 표시 시) 방사형 바깥 이름 pill. 고립 노드도 동일 스타일.
  const nodeParts = nodes.map((nd, i) => {
    const p = pos.get(nd.id);
    const pa = nd.participation || {};
    const name = String(nd.label || '');
    const aria = `${name}: 쓴 글 ${Number(pa.posts) || 0}, 받은 댓글 ${Number(pa.commentsReceived) || 0}, 보낸 댓글 ${Number(pa.commentsGiven) || 0}`;
    let labelSvg = '';
    if (!hideLabels) {
      const lr = 240, lx = cx + lr * Math.cos(p.th), ly = cy + lr * Math.sin(p.th);
      const disp = name.length > 5 ? name.slice(0, 4) + '…' : name;
      const wpill = Math.min(disp.length, 5) * 13 + 16;
      labelSvg = `<g class="social-name-pill"><rect x="${(lx - wpill / 2).toFixed(1)}" y="${(ly - 11).toFixed(1)}" width="${wpill}" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"></rect><text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#334155">${escapeHtml(disp)}</text></g>`;
    }
    return `<g role="img" aria-label="${escapeAttr(aria)}"><title>${escapeHtml(aria)}</title>` +
      `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="#e5e7eb" stroke="#94a3b8" stroke-width="1.5"></circle>` +
      `<text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="700" fill="#475569">${i + 1}</text>` +
      labelSvg + `</g>`;
  });
  const defs = `<defs>` +
    `<marker id="arw-comment" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"></path></marker>` +
    `<marker id="arw-reply" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#8b5cf6"></path></marker>` +
    `</defs>`;
  return `<svg class="social-svg" viewBox="0 0 680 680" preserveAspectRatio="xMidYMid meet" role="group" aria-label="학급 관계망: 노드 ${n}개, 상호작용 ${edges.length}건" xmlns="http://www.w3.org/2000/svg">${defs}<g>${edgeParts.join('')}</g><g>${nodeParts.join('')}</g></svg>`;
}

/* [Phase 4b] ⑤ 학급 관계·정서 전용 렌더 — 실명 소시오그램 + 정서 병렬 패널(노드 미결합).
   세로 순서: 헤더+pill → 목적제한 → 데모 → 소표본 → 상단caveat → SVG+범례 → 텍스트 등가 표 → 균형칩 → 구분선+정서 스택바 → 하단caveats.
   안전(낙인·재식별 최소화): 노드 크기 균일 · 감정 노드 미결합 · 고립 무강조 · 자동 판정 라벨 0 · 목적제한/유출금지 상시. */
function renderSocialClimate(host, d){
  if (!host) return;
  const meta = BEHAV_SIG_META.social;
  const graph = (d && d.graph) || { nodes: [], edges: [] };
  const nodes = Array.isArray(graph.nodes) ? graph.nodes : [];
  const edges = Array.isArray(graph.edges) ? graph.edges : [];
  const nodeCount = Number(d.nodeCount != null ? d.nodeCount : nodes.length) || 0;
  const edgeCount = edges.length;
  const caveats = Array.isArray(d.caveats) ? d.caveats : [];
  const topCaveat = caveats.length ? _reportInsightHtml({ level: 'info', text: caveats[0] }) : '';
  const periodLabel = d.period === '30d' ? '최근 30일' : (d.period === 'term' ? '이번 학기' : '최근 90일');
  const isDemo = d.instrumentation === 'demo' || d.demoInstrumented === true;
  const smallSample = !!d.smallSample;

  const demoPill = isDemo ? `<span class="behav-demo-pill"><i class="fas fa-flask" aria-hidden="true"></i> 시연 데모</span>` : '';
  const header = `<header class="behav-card-head">
      <div class="behav-card-headmain">
        <h2 class="behav-card-title">${meta.icon} ${escapeHtml(meta.title)}<span class="lrs-help" tabindex="0" role="button" aria-label="${escapeAttr(meta.label)} 설명"><i class="fas fa-circle-question" aria-hidden="true"></i><span class="lrs-help-pop">${escapeHtml(meta.help)}</span></span>${demoPill}</h2>
      </div>
      <div class="behav-headchips">
        <span class="behav-chip"><i class="fas fa-users" aria-hidden="true"></i> 대상 ${nodeCount}명</span>
        <span class="behav-chip"><i class="fas fa-calendar-day" aria-hidden="true"></i> ${periodLabel} 누적</span>
      </div>
    </header>`;

  // 🔒 목적 제한 배너(상시) — 경고 아닌 안내(info 블루). v2 §7 purposeNote 상시 노출.
  const purposeBanner = `<div class="social-purpose" role="note" aria-label="목적 제한 안내">
      <i class="fas fa-lock" aria-hidden="true"></i> <b>담임 교사 전용</b> 자료예요. 학급 관계·정서 지원 목적이며, <b>상담·평가·생활지도 판정 근거로 쓰지 마세요.</b>
    </div>`;

  // 🧪 데모 계측 배너(demoInstrumented 시) — 앰버(.behav-demo 재사용, 문안 교체).
  const demoBanner = isDemo ? `<div class="behav-demo" role="note" aria-label="시연용 합성 데이터 안내">
      <div class="behav-demo-h"><i class="fas fa-flask" aria-hidden="true"></i> 시연용 합성 데이터</div>
      <p class="behav-demo-b">이 학급은 그래프가 충분히 클 때 관계망이 어떻게 읽히는지 보여주는 <b>시연용 합성 데이터</b>예요. <b>실제 학생이 아니에요.</b></p>
    </div>` : '';

  // ⚠ 소표본 배지(smallSample 시) — 하드 마스킹 아님(그래프는 렌더). .behav-lowconf 재사용.
  const lowSampleBadge = smallSample ? `<div class="behav-lowconf"><i class="fas fa-triangle-exclamation" aria-hidden="true"></i> 학생 수가 적어 관계 해석에 <b>주의가 필요해요</b> (노드 ${nodeCount}개·엣지 ${edgeCount}개). 관계망 지표(중심성·응집도)는 산출하지 않으며, 그래프는 <b>참고용</b>이에요.</div>` : '';

  let body;
  if (!nodes.length){
    body = tplEmpty('학급 구성원이 없어요. 학생이 클래스에 참여하면 관계망이 나타나요.');
  } else {
    const ordered = [...nodes].sort((a, b) => Number(a.id) - Number(b.id));   // 결정론 정렬(레이아웃·표 대조 안정)
    const nameById = new Map(ordered.map(nd => [nd.id, String(nd.label || '')]));
    const isNarrow = !!(typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(max-width:767px)').matches);
    const hideLabels = nodeCount > 16 || isNarrow;                            // 과밀·모바일 → 이름 pill 숨김(번호만)
    const svg = _socialSvg(ordered, edges, hideLabels);

    const legend = `<div class="social-legend">
        <span class="social-legend-item"><svg width="30" height="10" aria-hidden="true"><line x1="0" y1="5" x2="21" y2="5" stroke="#64748b" stroke-width="2"></line><path d="M21,1 L30,5 L21,9 Z" fill="#64748b"></path></svg> 댓글</span>
        <span class="social-legend-item"><svg width="30" height="10" aria-hidden="true"><line x1="0" y1="5" x2="21" y2="5" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"></line><path d="M21,1 L30,5 L21,9 Z" fill="#8b5cf6"></path></svg> 답글(대댓글)</span>
        <span class="social-legend-item">화살표 = 댓글을 단 방향(단 사람 → 받은 사람)</span>
        <span class="social-legend-sub">노드 = 학급 구성원(크기 모두 같아요) · 연결 없는 학생도 담담히 함께 표시돼요 · 노드 안 번호는 순위가 아니라 아래 표와 맞춰 보는 색인이에요.</span>
      </div>`;

    const noEdgeNote = edgeCount === 0
      ? `<div class="behav-note"><i class="fas fa-circle-info" aria-hidden="true"></i> 아직 게시판 댓글·답글 상호작용이 없어요. 서로의 글에 댓글을 달면 연결선이 나타나요.</div>`
      : '';

    const rows = ordered.map((nd, i) => {
      const pa = nd.participation || {};
      return `<tr>
          <td class="idx">${i + 1}</td>
          <td class="name">${escapeHtml(String(nd.label || ''))}</td>
          <td class="num">${Number(pa.posts) || 0}</td>
          <td class="num">${Number(pa.commentsReceived) || 0}</td>
          <td class="num">${Number(pa.commentsGiven) || 0}</td>
        </tr>`;
    }).join('');
    const interactions = edgeCount
      ? `<div class="social-int-h">상호작용 목록</div><ul>${edges.map(e =>
          `<li>${escapeHtml(nameById.get(e.from) || '?')} → ${escapeHtml(nameById.get(e.to) || '?')} · ${e.type === 'reply' ? '답글' : '댓글'} ${Number(e.weight) || 0}회</li>`).join('')}</ul>`
      : `<div class="social-int-empty">아직 서로의 글에 댓글·답글을 단 기록이 없어요.</div>`;
    const tableOpen = (nodeCount > 16 || isNarrow) ? ' open' : '';
    const table = `<details class="social-table-wrap"${tableOpen}>
        <summary>표로 보기 (번호·이름·참여수)</summary>
        <div class="social-table-scroll">
          <table class="social-table">
            <thead><tr><th class="num">번호</th><th>이름</th><th class="num">쓴 글</th><th class="num">받은 댓글</th><th class="num">보낸 댓글</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div class="social-interactions">${interactions}</div>
      </details>`;

    // 참여 균형 밴드 칩(보조) — 균형=blue / 다소편중·편중=amber(빨강 금지). null 생략.
    const band = d.balanceBand;
    const bandChip = band
      ? `<div class="social-band-wrap"><span class="social-band-chip ${band === '균형' ? 'social-band-chip--blue' : 'social-band-chip--amber'}"><i class="fas fa-scale-balanced" aria-hidden="true"></i> 참여 균형: ${escapeHtml(band)}</span><span class="lrs-help" tabindex="0" role="button" aria-label="참여 균형 설명"><i class="fas fa-circle-question" aria-hidden="true"></i><span class="lrs-help-pop">상호작용이 소수에 몰려 있는지의 관찰이며, 편중=문제라는 뜻이 아니에요. 정밀 수치는 소표본에서 불안정해 밴드로만 보여드려요.</span></span></div>`
      : '';

    // 정서 병렬 패널(구분선 분리) — 100% 스택 단일 막대(노드 미결합). masked(n<5) 빈 상태.
    const ec = d.emotionClimate || {};
    let climateBody;
    if (ec.masked || ec.positive == null){
      climateBody = `<div class="social-climate-empty"><i class="fas fa-chart-simple" aria-hidden="true"></i> 감정 기록이 아직 적어 학급 정서 분위기를 보여드리기 어려워요(최소 5명·5일 필요). 학생들이 감정 출석을 이어가면 자동으로 채워져요.</div>`;
    } else {
      const pos = Number(ec.positive) || 0, neu = Number(ec.neutral) || 0, neg = Number(ec.negative) || 0;
      climateBody = `<div class="social-climate-bar" role="img" aria-label="학급 정서 분포 — 긍정 ${pos}퍼센트, 중립 ${neu}퍼센트, 부정 ${neg}퍼센트">
          ${pos > 0 ? `<div class="social-climate-seg" style="width:${pos}%;background:#22c55e;">${pos >= 12 ? `긍정 ${pos}%` : ''}</div>` : ''}
          ${neu > 0 ? `<div class="social-climate-seg" style="width:${neu}%;background:#94a3b8;">${neu >= 12 ? `중립 ${neu}%` : ''}</div>` : ''}
          ${neg > 0 ? `<div class="social-climate-seg" style="width:${neg}%;background:#f87171;">${neg >= 12 ? `부정 ${neg}%` : ''}</div>` : ''}
        </div>
        <div class="social-climate-legend">
          <span><span class="social-sw" style="background:#22c55e;"></span> 긍정 ${pos}%</span>
          <span><span class="social-sw" style="background:#94a3b8;"></span> 중립 ${neu}%</span>
          <span><span class="social-sw" style="background:#f87171;"></span> 부정 ${neg}%</span>
        </div>`;
    }
    const climateChip = (ec.n != null)
      ? `<span class="social-climate-chip${ec.masked ? ' social-climate-chip--muted' : ''}">감정 기록 ${Number(ec.n) || 0}건</span>`
      : '';
    const climate = `<div class="social-climate">
        <div class="social-climate-head">
          <div class="social-climate-headmain">
            <div class="social-climate-h">학급 정서 분위기</div>
            <div class="social-climate-sub">관계망과 결합하지 않은 <b>학급 전체 집계</b>예요(개별 학생 감정과 이어 붙이지 않아요).</div>
          </div>
          ${climateChip}
        </div>
        ${climateBody}
      </div>`;

    body = `<div class="social-svg-wrap">${svg}</div>${legend}${noEdgeNote}${table}${bandChip}${climate}`;
  }

  host.innerHTML = `<section class="dc-chart-wrapper behav-card" style="padding:24px 28px;border-radius:16px;">
      ${header}
      ${purposeBanner}
      ${demoBanner}
      ${lowSampleBadge}
      ${topCaveat}
      ${body}
      ${_behavCaveatsHtml(caveats.slice(1))}
    </section>`;
}

/* 신호 카드 렌더 — §3-1 공통 4블록(헤더 → 고정 캐비어트 → 관찰형 insights → 그룹비교 막대(+신호① 매트릭스) → 하단 caveats). */
function renderBehaviorSignal(host, signal, d){
  if (!host) return;
  if (signal === 'video'){ renderVideoSignal(host, d); return; }   // [Phase 4a] 영상 학습 행동 우산 → 세로 3섹션 전용 렌더
  if (signal === 'social'){ renderSocialClimate(host, d); return; } // [Phase 4b] ⑤ 학급 관계·정서 → 소시오그램+정서 병렬 전용 렌더
  const meta = BEHAV_SIG_META[signal] || { icon:'📊', label:'행동 신호', title:'행동 신호', help:'' };
  const caveats = Array.isArray(d.caveats) ? d.caveats : [];
  const topCaveat = caveats.length ? _reportInsightHtml({ level:'info', text: caveats[0] }) : '';
  const studentCount = Number(d.studentCount) || 0;
  const periodLabel = d.period === '30d' ? '최근 30일' : (d.period === 'term' ? '이번 학기' : '최근 90일');

  const header = `<header class="behav-card-head">
      <div class="behav-card-headmain">
        <h2 class="behav-card-title">${meta.icon} ${escapeHtml(meta.title)}<span class="lrs-help" tabindex="0" role="button" aria-label="${escapeAttr(meta.label)} 설명"><i class="fas fa-circle-question" aria-hidden="true"></i><span class="lrs-help-pop">${escapeHtml(meta.help)}</span></span></h2>
        ${d.dataNote ? `<div class="behav-card-sub">${escapeHtml(d.dataNote)}</div>` : ''}
      </div>
      <div class="behav-headchips">
        <span class="behav-chip"><i class="fas fa-users" aria-hidden="true"></i> 대상 ${studentCount}명</span>
        <span class="behav-chip"><i class="fas fa-calendar-day" aria-hidden="true"></i> ${periodLabel} 누적</span>
      </div>
    </header>`;

  const lowConfBanner = (d.lowConfidence && studentCount > 0 && !(signal === 'rewatch' && d.available === false))
    ? `<div class="behav-lowconf"><i class="fas fa-circle-info" aria-hidden="true"></i> 우리 반은 표본이 작아(성취 산출 ${studentCount}명) 그룹 경향이 불안정해요. 학습이 쌓이면 더 정확해져요.</div>`
    : '';

  let body;
  if (signal === 'rewatch' && d.available === false){
    body = `${tplEmpty(d.emptyReason || '우리 반의 영상 재시청 기록이 아직 적어 관계를 보여드리기 어려워요. 영상 학습이 쌓이면 자동으로 채워져요.')}
      <div class="behav-note behav-note--muted"><i class="fas fa-circle-info" aria-hidden="true"></i> 영상 건너뛰기(seek) 분석은 로깅 신설 후 향후 제공 예정이에요.</div>
      <div class="behav-foot"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(d.disclaimer || '')}</div>`;
  } else if (d.empty && signal !== 'speed'){
    body = `${tplEmpty(d.emptyReason || '아직 이 신호를 관측할 기록이 적어요. 학습이 쌓이면 자동으로 채워져요.')}
      <div class="behav-foot"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(d.disclaimer || '')}</div>`;
  } else {
    body = `<div id="behavGroupCompare" class="behav-gc-wrap"></div>`;
    if (signal === 'participation'){
      const ba = d.byActivity || {};
      body += `<div class="behav-byact"><span class="behav-byact-h">참여 집계(실 제출·이수 기록):</span>
          <span class="behav-chip behav-chip--soft">수업 이수 ${Number(ba.lesson && ba.lesson.n) || 0}명</span>
          <span class="behav-chip behav-chip--soft">과제 제출 ${Number(ba.homework && ba.homework.n) || 0}명</span>
          <span class="behav-chip behav-chip--soft">평가 응시 ${Number(ba.exam && ba.exam.n) || 0}명</span></div>`;
      if (d.onTime && d.onTime.available === false){
        body += `<div class="behav-note"><i class="fas fa-circle-info" aria-hidden="true"></i> 기한준수(기한내/지연)는 표시하지 않아요 — ${escapeHtml(d.onTime.reason || '')}</div>`;
      }
    }
    if (signal === 'speed'){
      body += `<details class="behav-matrix-details" open>
          <summary><span class="sd-caret">▶</span> 정답·오답까지 함께 보기 (정오 × 속도 매트릭스)</summary>
          <div id="behavShallowHost" style="margin-top:12px;"></div>
        </details>`;
    }
    body += `<div class="behav-foot"><i class="fas fa-circle-info" aria-hidden="true"></i> ${escapeHtml(d.disclaimer || '')}</div>`;
  }

  host.innerHTML = `<section class="dc-chart-wrapper behav-card" style="padding:24px 28px;border-radius:16px;">
      ${header}
      ${topCaveat}
      ${lowConfBanner}
      <div class="lrs-insight-wrap" id="behavInsights" style="display:none;"></div>
      ${body}
      ${_behavCaveatsHtml(caveats.slice(1))}
    </section>`;

  renderInsights(document.getElementById('behavInsights'), d.insights);
  const gcHost = document.getElementById('behavGroupCompare');
  if (gcHost) renderGroupCompare(gcHost, { metricLabel: d.metricLabel, unit: d.unit || '%', groups: d.groups, refValue: d.refValue, comparison: d.comparison });
  if (signal === 'speed'){
    const mh = document.getElementById('behavShallowHost');
    if (mh) renderShallowLearning(mh, { classId: state._behavClassId, days: BEHAV_PERIOD_DAYS_FE[d.period] || 90 });
  }
}

/* 뷰 스코프 스타일(BM_STYLE 패턴 — 전체 재렌더로 중복 누적 없음). */
const BEHAV_STYLE = `<style>
  .behav-head{ margin:0 0 var(--space-4); }
  .behav-h1{ font-size:var(--fs-h1); font-weight:800; color:var(--gray-900); margin:0 0 6px; }
  .behav-lead{ font-size:16px; line-height:1.7; color:var(--gray-700); margin:0; max-width:900px; }
  .behav-lead b{ color:var(--lrs-primary-dark); font-weight:700; }
  /* 세그먼트 탭 4신호 — 선택 시 primary 배경·흰 글자(현재 위치 피드백). 좁으면 wrap(가로 스크롤 0). */
  .behav-seg{ display:flex; flex-wrap:wrap; gap:8px; width:100%; }
  .behav-seg-btn{ flex:1 1 auto; min-width:0; display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-size:16px; font-weight:600; font-family:inherit; padding:10px 16px; border-radius:10px;
    border:1px solid var(--gray-300); background:#fff; color:var(--gray-700); cursor:pointer;
    white-space:nowrap; transition:background .12s, color .12s, border-color .12s; }
  .behav-seg-btn .behav-seg-num{ font-weight:800; opacity:.8; }
  .behav-seg-btn:hover{ background:var(--lrs-primary-lighter); color:var(--gray-900); }
  .behav-seg-btn:focus-visible{ outline:2px solid var(--lrs-primary); outline-offset:2px; }
  .behav-seg-btn.is-on{ background:var(--lrs-primary); color:#fff; border-color:var(--lrs-primary); }
  .behav-seg-btn.is-on .behav-seg-num{ opacity:1; }
  /* 신호 카드 */

VIEWS['t-behavior'] = async function(root){
  // 세그먼트·클래스 칩은 setView 를 거치지 않고 이 뷰를 직접 재호출 → 신호①(속도) shallow 산점도
  //   Chart.js 인스턴스 누수 방지로 재렌더 진입 시 차트 정리(신규 렌더가 필요분 재생성).
  destroyCharts();
  root.innerHTML = tplLoading(3);
  const owned = await _bmFetchOwnedClasses();
  if (!owned.length){ root.innerHTML = BEHAV_STYLE + _bmNoClassPanel(); return; }
  if (state._behavClassId == null || !owned.some(c => String(c.id) === String(state._behavClassId))) state._behavClassId = owned[0].id;
  if (!BEHAV_SIGNALS.includes(state._behavSignal)) state._behavSignal = 'speed';
  const signal = state._behavSignal;
  const realOn = !!state._behavRealOnly;
  const isSocial = (signal === 'social');   // [Phase 4b] ⑤ 는 relationship 엔드포인트(그래프+정서 병렬 셰이프)

  const d = isSocial
    ? await apiGet('/api/lrs/stats/relationship', { classId: state._behavClassId, period:'90d', realOnly: realOn ? '1' : '0' })
    : await apiGet('/api/lrs/stats/behavior', {
        scope:'class', classId: state._behavClassId, signal, period:'90d', realOnly: realOn ? '1' : '0'
      });

  const clsName = (owned.find(c => String(c.id) === String(state._behavClassId)) || {}).name || (d && d.className) || '';
  const classChips = owned.length > 1
    ? `<div class="dc-unit-toggle" id="behavClassToggle" role="group" aria-label="클래스 선택"><span class="dc-eq-flabel">클래스</span>${owned.map(c =>
        `<button class="chip" type="button" data-behavclass="${escapeAttr(String(c.id))}" aria-pressed="${String(c.id) === String(state._behavClassId) ? 'true' : 'false'}">${escapeHtml(c.name)}</button>`).join('')}</div>`
    : '';
  const segTabs = `<div class="behav-seg" role="tablist" aria-label="행동 신호 선택">${
    BEHAV_SIGNALS.map(s => { const m = BEHAV_SIG_META[s]; const on = s === signal;
      return `<button class="behav-seg-btn${on ? ' is-on' : ''}" type="button" role="tab" data-behavsig="${s}" aria-selected="${on ? 'true' : 'false'}" tabindex="${on ? '0' : '-1'}"><span class="behav-seg-num">${m.num}</span> ${escapeHtml(m.label)}</button>`;
    }).join('')}</div>`;
  const summary = `<div class="dc-eq-summary" role="status"><i class="fas fa-filter" aria-hidden="true"></i> 필터: ${escapeHtml(clsName)} · ${escapeHtml((BEHAV_SIG_META[signal] || {}).label || '')}</div>`;
  const filterbar = `<div class="bm-filterbar">
      ${classChips ? `<div class="bm-frow">${classChips}</div>` : ''}
      <div class="bm-frow">${segTabs}</div>
      ${summary}
    </div>`;
  const headBlock = `<div class="behav-head">
      <h1 class="behav-h1">학습 행동 심화 분석</h1>
      <p class="behav-lead">학습 행동(풀이 속도·오답 재풀이·기간 참여·영상 학습 행동)이 <b>성취</b>와 어떤 관계로 <b>함께 나타나는지</b> 살펴봐요. 아래 값은 <b>‘연관성’이지 ‘원인’이 아니에요</b> — 개별 판단 전에 학생과 대화로 확인해 주세요.</p>
    </div>`;
  // 신호 ①~④: seedBar 상시. ⑤ social: seedNotice(합성 포함) 일 때만 노출(§2 순서 · relationship 은 seedNoticeText 없어 문안 지정).
  const seedBar = isSocial
    ? ((d && d.seedNotice) ? _bmSeedBar('이 관계망·정서 수치에는 시연용 합성 데이터가 포함돼 있어요. 실데이터가 쌓이면 자동 전환돼요.', realOn, '_behavRealOnly') : '')
    : _bmSeedBar(d ? d.seedNoticeText : '', realOn, '_behavRealOnly');

  if (!d || d.success === false){
    root.innerHTML = BEHAV_STYLE + seedBar + headBlock + filterbar + tplError('학습 행동 분석 데이터를 불러오지 못했어요', () => VIEWS['t-behavior'](root));
    _behavBind(root);
    return;
  }

  root.innerHTML = BEHAV_STYLE + seedBar + headBlock + filterbar + `<div id="behavSignalCard"></div>`;
  renderBehaviorSignal(document.getElementById('behavSignalCard'), signal, d);
  _behavBind(root);
};

function _behavBind(root){
  // 클래스 칩 → 선택 반 재조회
  root.querySelectorAll('#behavClassToggle button[data-behavclass]').forEach(b => {
    b.onclick = () => { if (String(state._behavClassId) === b.dataset.behavclass) return; state._behavClassId = b.dataset.behavclass; VIEWS['t-behavior'](root); };
  });
  // 신호 세그먼트 → 신호 전환 재조회
  root.querySelectorAll('.behav-seg button[data-behavsig]').forEach(b => {
    b.onclick = () => { if (state._behavSignal === b.dataset.behavsig) return; state._behavSignal = b.dataset.behavsig; VIEWS['t-behavior'](root); };
  });
  // 실데이터 토글(_bmSeedBar → data-realkey=_behavRealOnly) 재사용. 클래스 쿼리(#bmClassToggle)는 no-op.
  _bmBindCommon(root, () => VIEWS['t-behavior'](root));
}

/* ======================================================================
 * ④ 활동×성취 교차분석 (a-cross)
 *    인사이트 배너 + 3분위 매트릭스 + 산점도 + 콘텐츠/스스로채움 상하위 비교
 * ==================================================================== */
// 인사이트 문장 룰 (기획서 4-2)
function _crossInsight(label, cmp, smallSample){
  if (!cmp || cmp.gapPP == null) return `${label} 활용과 성취의 관계를 산출할 표본이 부족합니다.`;
  const gap = cmp.gapPP;
  const tail = smallSample ? ' (표본이 작아 참고용입니다)' : '';
  if (gap >= 10) return `${label}을(를) 상위권으로 활용한 학생 집단의 평균 정답률이 하위 집단보다 +${gap}%p 높습니다. 활용이 성취와 양(+)의 상관을 보입니다.${tail}`;
  if (gap > 0) return `${label} 활용 상·하위 집단 간 약한 양의 상관(+${gap}%p)이 관찰됩니다.${tail}`;
  return `이 표본에서는 ${label} 활용과 성취 간 뚜렷한 상관이 관찰되지 않습니다(표본·기간 확대 권장).${tail}`;
}

  // hex(#rrggbb) → rgba 알파 문자열 (겹침 완화용 반투명 점)
  const _hexRgba = (hex, a) => {
    const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);

    const xs = scatter.map(p=>p.x).sort((a,b)=>a-b);

        } } }
      }
    });
    // 축 범위 밖 이상치 안내 캡션 (outN>0 일 때만)
    if (outN > 0){
      const wrap = document.getElementById('aCrossScatter').closest('.dc-chart-wrapper');

        wrap.appendChild(cap);

      { label:'하위 33%', data:[content.low?content.low.avgScore:null, self.low?self.low.avgScore:null], backgroundColor:'#f59e0b' }
    ]
  }, { scales:{ y:{ min:0, max:100, title:{display:true,text:'평균 성취점수'} } },
       plugins:{ tooltip:{ callbacks:{ afterBody:(items)=>{
         const i = items[0].dataIndex;
         const cmp = i===0?content:self; const g = cmp.gapPP;
         return g!=null ? `격차: ${g>=0?'+':''}${g}%p` : '';

  // 분위 요약 표
  renderDataTable(document.getElementById('aCrossTable'), {

/* 서버 제공 7×24 매트릭스를 직접 히트맵으로 렌더 (renderHeatmap는 date 파싱 기반이라 별도 함수)
   opts.onCellClick(dow, hour, el) 를 주면 값>0 셀 클릭 드릴다운 활성화(t-usage 전용). */
function renderHeatmapMatrix(container, matrix, opts){
  if (!container) return;
  let maxV = 0;
  (matrix||[]).forEach(row => row.forEach(v => { if (v>maxV) maxV=v; }));
  function bucket(v){
    if (!maxV || v<=0) return 0;
    const r=v/maxV; if (r>.75) return 4; if (r>.5) return 3; if (r>.25) return 2; if (r>0) return 1; return 0;
  }
  const dows = ['일','월','화','수','목','금','토'];
  const ylabels = dows.map(d=>`<div>${d}</div>`).join('');
  // opts.onCellClick 이 있으면 값>0 셀을 클릭 가능(버튼)으로 — t-usage 드릴다운. 빈 셀은 클릭 불가.
  const clickable = opts && typeof opts.onCellClick === 'function';
  const cells = (matrix||[]).map((row,di)=>
    row.map((v,hi)=>{
      const base = `class="cell heat-${bucket(v)}" data-h="${bucket(v)}"`;
      if (clickable && v>0){
        return `<div ${base} data-dow="${di}" data-hour="${hi}" role="button" tabindex="0"`
          + ` title="${dows[di]} ${hi}시: ${v}건 · 클릭하면 누가·무엇을 했는지 볼 수 있어요"`
          + ` aria-label="${dows[di]}요일 ${hi}시 활동 ${v}건, 자세히 보기">${v}</div>`;
      }
      return `<div ${base} title="${dows[di]} ${hi}시: ${v}" aria-label="${dows[di]}요일 ${hi}시 활동 ${v}">${v>0?v:''}</div>`;
    }).join('')
  ).join('');
  const xlabels = Array.from({length:24},(_,i)=>`<div>${i%3===0?i:''}</div>`).join('');
  container.innerHTML = `
    <div class="dc-heatmap-wrap">
      <div class="hm-ylabels" style="grid-template-rows:repeat(7,1fr);">${ylabels}</div>
      <div class="dc-heatmap${clickable?' is-clickable':''}" style="grid-template-columns:repeat(24,1fr);">${cells}</div>
      <div></div>
      <div class="hm-xlabels">${xlabels}</div>
    </div>`;
  if (clickable){
    container.querySelectorAll('.dc-heatmap .cell[role="button"]').forEach(el => {
      const dow = parseInt(el.getAttribute('data-dow'), 10);
      const hour = parseInt(el.getAttribute('data-hour'), 10);
      const fire = () => opts.onCellClick(dow, hour, el);
      el.addEventListener('click', fire);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); fire(); } });
    });
  }
}
