  }
};

/* ===== 학생: 내 학습 요약 ===== */
VIEWS['s-home'] = async function(root){
  root.innerHTML = tplLoading(4);
  const uid = state.me && state.me.id;
  const [insights, daily, dash] = await Promise.all([
    uid ? apiGet(`/api/lrs/insights/${uid}`) : Promise.resolve(null),
    apiGet('/api/lrs/stats/daily'),
    apiGet('/api/lrs/dashboard')
  ]);

  // API shape: {snapshot:{streakDays, weeklyDurationMin, weeklyTarget, weeklyScoreAvg, engagementIndex}, weaknesses:[...]}
  const snap = (insights && insights.snapshot) || {};
  const weakList = (insights && insights.weaknesses) || [];
  const dashStats = (dash && dash.stats) || {};
  const totalMinutes = snap.weeklyDurationMin != null
    ? Number(snap.weeklyDurationMin)
    : (dashStats.totalDurationMinutes || 0);
  const avgScore = Math.round(Number(snap.weeklyScoreAvg || 0) * 10) / 10;
  const streakDays = snap.streakDays || 0;
  const doneTasks = dashStats.totalActivities || 0;
  const summary = { total_minutes: totalMinutes, done_tasks: doneTasks, avg_score: avgScore, streak_days: streakDays };

  // 관리자 계정이 학생 뷰 (scope=mine) 로 볼 때 전부 0이면 안내
  const allZero = !totalMinutes && !doneTasks && !avgScore && !streakDays;
  const isAdminAsStudent = (state.me && state.me.role === 'admin') && state.role === 'student';
  const adminHintHtml = (allZero && isAdminAsStudent) ? `
    <div class="dc-state-panel" role="status" style="border-left:4px solid var(--lrs-primary);background:rgba(37,99,235,.06);margin-bottom:12px;">
      <i class="fas fa-lightbulb" aria-hidden="true"></i>
      <p>관리자 계정의 개인 학습 데이터가 없습니다. 실제 학생 화면을 보려면 학생 계정으로 로그인하거나 <button type="button" class="btn" id="sHomeSampleBtn" style="margin-left:6px;"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기</button> 버튼을 클릭하세요.</p>
    </div>` : '';

  const kpiHtml = `
    <div class="dc-kpi-grid">
      ${kpiCard('이번 기간 학습시간', (summary.total_minutes||0).toLocaleString(), '분', {dir:'up', text:'지난 기간 대비'}, 'primary',
        '<div class="dc-gauge" id="sHomeGauge"></div>')}
      ${kpiCard('완료 과제',         (summary.done_tasks||0).toLocaleString(), '건', {dir:'flat', text:'이번 기간'}, 'success',
        '<div id="sHomeSpark" class="kpi-spark"></div>')}
      ${kpiCard('평균 성취',          (summary.avg_score||0),                   '점', {dir:'up',   text:'지난 기간 대비'}, 'primary')}
      ${kpiCard('연속 학습',          (summary.streak_days||0),                 '일', {dir:'flat', text:'현재'},            'warning')}
    </div>`;

  const chartsHtml = `
    <div class="grid-2">
      ${chartWrap('sHomeDaily',  '일별 학습시간 추이', '최근 기간', null)}
      ${chartWrap('sHomeWeak',   '내 약점 성취기준 Top 5', '정답률 낮은 순', '약점 카드를 눌러 스스로채움 추천 콘텐츠로 이동합니다')}
    </div>
    <section class="dc-chart-wrapper" aria-label="약점 카드 리스트">
      <header><h2>약점 영역 & 추천 액션</h2></header>
      <div id="sWeakCards"></div>
    </section>`;

  root.innerHTML = adminHintHtml + kpiHtml + chartsHtml;

  // 샘플 학생 보기 버튼 바인딩 (관리자-as-학생 힌트)
  const sampleBtn = document.getElementById('sHomeSampleBtn');
  if (sampleBtn){
    sampleBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      setRole('teacher');
      await setView('t-drill');
      setTimeout(() => {
        const first = (LRS._warnCache||[])[0];
        if (first) LRS.openDrilldown(first);
      }, 300);
    });
  }

  // 게이지 (학습시간 목표 대비 달성률) — 기본 목표치: 7d 60분*7일, 30d 60*30 등
  const targetMin = Number(snap.weeklyTarget) || (state.period==='7d'?420: state.period==='30d'?1800: state.period==='90d'?5400: 1800);
  renderGauge(document.getElementById('sHomeGauge'), summary.total_minutes||0, targetMin, '목표 대비');

  // 일별 추이 차트
  const dailyData = (daily && daily.data) || [];
  // 스파크라인: 최근 7일 활동 건수 추이
  const sparkVals = dailyData.slice(-7).map(d => d.count || 0);
  renderSparkline(document.getElementById('sHomeSpark'), sparkVals);
  if (dailyData.length) {
    mkChart(document.getElementById('sHomeDaily'), 'line', {
      labels: dailyData.map(d => fmtDate(d.stat_date)),
      datasets: [{
        label:'학습시간(분)',
        data: dailyData.map(d => toMinutes(d.total_duration_sec || d.total_duration)),
        borderColor: 'var(--chart-1)', backgroundColor:'rgba(37,99,235,.12)',
        tension:.3, fill:true
      }]
    });
  } else {
    document.getElementById('sHomeDaily').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>일별 학습시간 추이</h2></header>` + tplEmpty('선택한 기간의 데이터가 없어요');
  }

  // 약점 차트 (weaknesses:[{achievement_code, attempt_count, success_count, avg_score, last_level}])
  if (weakList.length) {
    mkChart(document.getElementById('sHomeWeak'), 'bar', {
      labels: weakList.slice(0,5).map(w=>w.achievement_code||'-'),
      datasets:[{
        label:'시도 횟수',
        data: weakList.slice(0,5).map(w => Number(w.attempt_count)||0),
        backgroundColor:'var(--chart-4)'
      }]
    }, { indexAxis:'y', scales:{ x:{ beginAtZero:true } } });

    // 약점 카드 → self-learn 딥링크
    document.getElementById('sWeakCards').innerHTML = weakList.slice(0,5).map(w=>{
      const code = w.achievement_code||'';
      const accuracy = (w.avg_score != null ? w.avg_score : (w.last_level||'미도달'));
      const attempts = w.attempt_count || '-';
      const href = '/self-learn/?achievement_code=' + encodeURIComponent(code);
      return `<div class="dc-warning-card" data-severity="medium">
        <h3>${escapeHtml(code||'성취기준')}</h3>
        <p>평균 ${escapeHtml(accuracy)} · 시도 ${escapeHtml(attempts)}회</p>
        <div class="actions">
          <a role="button" href="${escapeAttr(href)}" class="dc-badge dc-badge--primary" style="text-decoration:none;">
            <i class="fas fa-book-open-reader"></i> 맞춤학습으로 이동
          </a>
        </div>
      </div>`;
    }).join('');
  } else {
    document.getElementById('sHomeWeak').closest('.dc-chart-wrapper').innerHTML =
      `<header><h2>내 약점 성취기준 Top 5</h2></header>` +
      tplEmpty('아직 진단 결과가 충분하지 않아요', {href:'/self-learn/', label:'스스로채움 시작하기'});
    document.getElementById('sWeakCards').innerHTML = '';
  }
  await renderDodMini(root);
};

/* =====================================================================
 * s-achieve (학생 성취 분석 = 홈) — S1 한눈 + S2 강약 + S4 다음에 뭘?
 *   API: GET /api/lrs/mastery/student/:id
 *   기획서: LRS_성취수준_P0_시각스펙 §3(S2)·§4(S4)·§5(S1)
 * ===================================================================== */
VIEWS['s-achieve'] = async function(root){
  root.innerHTML = tplLoading(3);
  const uid = state.me && state.me.id;
  if (!uid){ root.innerHTML = tplEmpty('로그인 정보를 확인할 수 없어요'); return; }

  const m = await apiGet('/api/lrs/mastery/student/' + encodeURIComponent(uid), {});
  if (!m || !m.success){
    root.innerHTML = tplError('성취 데이터를 불러오지 못했습니다', () => setView('s-achieve'));
    return;
  }

  const counts = m.counts || { total:0, reached:0, partial:0, notReached:0, insufficient:0 };
  const dist = m.distribution || {};
  const bySubject = (m.bySubject || []).filter(x => x.avgRate != null || x.evaluatedCount > 0);
  const standards = m.standards || [];
  const weaknesses = m.weaknesses || [];
  const strengths = m.strengths || [];

  const evaluatedCount = (counts.reached||0) + (counts.partial||0) + (counts.notReached||0);
  const allInsufficient = counts.total > 0 && evaluatedCount === 0;
  const noData = !counts.total;

  // ── 전체 빈 상태 (데이터 0건) ─────────────────────────────────────────
  if (noData){
    const isAdmin = state.me && state.me.role === 'admin';
    root.innerHTML = `<section class="mastery-section"><div class="mastery-empty">
      <i class="fas fa-award me-icon" aria-hidden="true"></i>
      <p>성취 데이터를 모으는 중이에요. 학습을 진행하면 교과별 성취가 채워져요.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;">
        ${isAdmin ? `<button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" id="sAchGotoDrill"><i class="fas fa-user-magnifying-glass"></i> 샘플 학생 보기(교사 뷰)</button>` : ''}
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 풀러 가기</a>
      </div>
    </div></section>`;
    const go = document.getElementById('sAchGotoDrill');
    if (go) go.addEventListener('click', async () => {
      setRole('teacher'); await setView('t-warnings');
    });
    return;
  }

  // ── 화면 골격 (S1 → S2 → S4) ─────────────────────────────────────────
  root.innerHTML = `
    <!-- S1: 내 성취 한눈 -->
    <div class="mastery-grid2">
      <section class="mastery-section">
        <div class="ms-head"><div class="ms-titles">
          <h2 class="mastery-h2">교과별 평균 성취</h2>
          <div class="mastery-sub">교과별 평균 정답률(0~100)</div>
        </div></div>
        <div class="chart-body" style="height:300px;">
          <canvas id="sMastRadar" role="img" aria-label="교과별 평균 성취 레이더"></canvas>
        </div>
      </section>
      <section class="mastery-section">
        <div class="ms-head"><div class="ms-titles">
          <h2 class="mastery-h2">성취 현황 요약</h2>
          <div class="mastery-sub">전체 ${counts.total}개 성취기준의 도달 상태</div>
        </div></div>
        <div class="chart-body donut-wrap" style="height:300px;">
          <canvas id="sMastDonut" role="img" aria-label="성취 4상태 분포 도넛"></canvas>
          ${donutCenterHtml('도달 ' + (counts.reached||0) + '/' + counts.total, '성취기준')}
        </div>
      </section>
    </div>
    ${masteryLegend()}

    <!-- S-TREND + S-PROJ: 내 성취 추이 + 도달 예상 (무위험·자기효능) -->
    <section class="mastery-section" id="sTrendSection" style="margin-top:16px;">
      <div class="ms-head"><div class="ms-titles">
        <h2 class="mastery-h2"><i class="fas fa-seedling" aria-hidden="true" style="color:#16a34a;"></i> 내 성취 추이</h2>
        <div class="mastery-sub">꾸준히 풀수록 그래프가 올라가요. 이번 주가 진하게 표시돼요.</div>
      </div></div>
      <div class="chart-body" id="sTrendBody" style="height:280px;">
        <canvas id="sTrendChart" role="img" aria-label="내 정답률 추이"></canvas>
      </div>
      <div class="sproj-chips" id="sTrendChips"></div>
      <div id="sTrendFoot"></div>
    </section>

    <!-- S2: 강약 다이버징 Bar -->
    <section class="mastery-section" id="sDivergeSection" style="margin-top:16px;">
      <div class="ms-head">
        <div class="ms-titles">
          <h2 class="mastery-h2">성취기준 강·약 분석</h2>
          <div class="mastery-sub">정답률 기준 — 오른쪽이 강점, 왼쪽이 약점</div>
        </div>
        <div class="ms-controls">
          ${counts.insufficient ? `<span class="mastery-chip-gray"><i class="fas fa-hourglass-half"></i> 평가 부족 ${counts.insufficient}개</span>` : ''}
          <select class="ms-select" id="sDivergeTopN" aria-label="표시 개수">
            <option value="5">강 5 · 약 5</option>
            <option value="10">강·약 합계 10</option>
            <option value="15">합계 15</option>
          </select>
        </div>
      </div>
      <div class="chart-body" id="sDivergeBody" style="height:360px;">
        <canvas id="sMastDiverge" role="img" aria-label="성취기준 강약 다이버징 차트"></canvas>
      </div>
      ${masteryLegend()}
    </section>

    <!-- S4: 다음에 뭘? -->
    <section class="mastery-section" id="sNextSection" style="margin-top:16px;">
      <div class="ms-head"><div class="ms-titles">
        <h2 class="mastery-h2">다음에 이걸 해볼까요?</h2>
        <div class="mastery-sub">약한 성취기준을 채울 학습이에요. 하나씩 풀어 도달로 바꿔봐요.</div>
      </div>
      <div class="ms-controls"><span class="mastery-sub">미도달·부분 ${weaknesses.length}개</span></div>
      </div>
      <div id="sNextGrid"></div>
    </section>

    <!-- A4: 다음 한 걸음 (선수→후속 경로) -->
    <section id="sNextStepHost"></section>`;

  // ── S1 레이더 ────────────────────────────────────────────────────────
  if (bySubject.length >= 3){
    mkChart(document.getElementById('sMastRadar'), 'radar', {
      labels: bySubject.map(s => s.subject || '기타'),
      datasets: [{
        label:'평균 정답률', data: bySubject.map(s => s.avgRate == null ? 0 : s.avgRate),
        borderColor:'var(--lrs-primary)', backgroundColor:'rgba(37,99,235,.15)',
        pointBackgroundColor:'var(--lrs-primary)', borderWidth:2,
      }]
    }, { scales:{ r:{ min:0, max:100, ticks:{ stepSize:20, font:{size:11} }, pointLabels:{ font:{size:13} } } },
         plugins:{ legend:{ display:false } } });
  } else if (bySubject.length){
    // 교과 3개 미만 → 가로 Bar 폴백
    mkChart(document.getElementById('sMastRadar'), 'bar', {
      labels: bySubject.map(s => s.subject || '기타'),
      datasets: [{ label:'평균 정답률', data: bySubject.map(s => s.avgRate == null ? 0 : s.avgRate),
        backgroundColor:'var(--lrs-primary)' }]
    }, { indexAxis:'y', scales:{ x:{ min:0, max:100 } }, plugins:{ legend:{ display:false } } });
  } else {
    document.getElementById('sMastRadar').closest('.chart-body').innerHTML =
      '<div class="mastery-empty"><i class="fas fa-chart-pie me-icon"></i><p>교과별 평균을 낼 성취 데이터가 아직 부족해요.</p></div>';
  }

  // ── S1 도넛 (4상태) ──────────────────────────────────────────────────
  if (allInsufficient){
    // 평가부족만 — 회색 1색 + 안내
    document.getElementById('sMastDonut').closest('.donut-wrap').querySelector('.donut-center').innerHTML =
      `<span class="dc-num">평가 부족 ${counts.insufficient}/${counts.total}</span><span class="dc-lbl">성취기준</span>`;
    mkChart(document.getElementById('sMastDonut'), 'doughnut', {
      labels:['평가 부족'],
      datasets:[{ data:[counts.insufficient], backgroundColor:[MASTERY_HEX.insufficient] }]
    }, Object.assign({ cutout:'62%' }, donutLegendOpts('개')));
  } else {
    mkChart(document.getElementById('sMastDonut'), 'doughnut', {
      labels:['도달','부분 도달','미도달','평가 부족'],
      datasets:[{
        data:[counts.reached||0, counts.partial||0, counts.notReached||0, counts.insufficient||0],
        backgroundColor:[MASTERY_HEX.reached, MASTERY_HEX.partial, MASTERY_HEX.notReached, MASTERY_HEX.insufficient]
      }]
    }, Object.assign({ cutout:'62%' }, donutLegendOpts('개')));
  }

  // ── S2 다이버징 Bar (재그림 함수) ────────────────────────────────────
  const evaluated = standards.filter(s => normStatus(s.status) !== 'insufficient' && s.rate != null);
  const strong = evaluated.filter(s => { const st = normStatus(s.status); return st === 'reached' || (st === 'partial' && s.rate >= 70); })
                          .sort((a,b)=> b.rate - a.rate);
  const weak = evaluated.filter(s => { const st = normStatus(s.status); return st === 'notReached' || (st === 'partial' && s.rate < 70); })
                        .sort((a,b)=> a.rate - b.rate);

  function clampLabel(s, n){
    const lbl = (s.label && s.label !== s.code) ? s.label : (s.subject || '');
    const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
    const short = lbl.length > n ? lbl.slice(0, n) + '…' : lbl;
    return short ? `${short} [${codeBare}]` : `[${codeBare}]`;
  }

  function drawDiverge(){
    destroyDivergeChart();
    const total = parseInt(document.getElementById('sDivergeTopN').value, 10) || 5;
    let pickStrong, pickWeak;
    if (total === 5){ pickStrong = strong.slice(0,5); pickWeak = weak.slice(0,5); }
    else { const half = Math.ceil(total/2); pickStrong = strong.slice(0,half); pickWeak = weak.slice(0,total-Math.min(half,pickStrong.length)); }

    const labelClamp = window.innerWidth < 768 ? 12 : (window.innerWidth < 1200 ? 14 : 18);
    // 강점은 위(rate 내림차) → 가운데 0선 → 약점은 아래(rate 오름차 = 최저 맨 아래)
    const ordered = pickStrong.slice().concat(pickWeak.slice().reverse());
    const bodyEl = document.getElementById('sDivergeBody');

    if (!ordered.length){
      bodyEl.innerHTML = `<div class="mastery-empty"><i class="fas fa-scale-balanced me-icon"></i>
        <p>아직 강·약을 가를 데이터가 부족해요. 성취기준당 3회 이상 풀면 강점·약점이 나타나요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-book-open-reader"></i> 스스로채움 풀러 가기</a></div>`;
      return;
    }
    bodyEl.innerHTML = '<canvas id="sMastDiverge" role="img" aria-label="성취기준 강약 다이버징 차트"></canvas>';
    bodyEl.style.height = (Math.max(360, ordered.length * 34 + 40)) + 'px';

    const values = ordered.map(s => { const st = normStatus(s.status); return st === 'notReached' || (st === 'partial' && s.rate < 70) ? -s.rate : s.rate; });
    const colors = ordered.map(s => { const st = normStatus(s.status); const isWeak = st === 'notReached' || (st === 'partial' && s.rate < 70);
      return isWeak ? MASTERY_HEX.notReached : (st === 'reached' ? MASTERY_HEX.reached : MASTERY_HEX.partial); });

    LRS._divergeChart = new Chart(document.getElementById('sMastDiverge'), {
      type:'bar',
      data:{ labels: ordered.map(s => clampLabel(s, labelClamp)),
        datasets:[{ data: values, backgroundColor: colors, borderRadius:4, _meta: ordered }] },
      options:{
        responsive:true, maintainAspectRatio:false, indexAxis:'y',
        animation:{ duration:500 },
        scales:{
          x:{ min:-100, max:100, ticks:{ callback:v=>Math.abs(v)+'%', font:{size:12} },
              grid:{ color:(ctx)=> ctx.tick.value === 0 ? '#9ca3af' : '#f1f5f9' } },
          y:{ ticks:{ font:{size:12} } }
        },
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label:(ctx)=>{ const s = ordered[ctx.dataIndex];
            const codeBare = String(s.code||'').replace(/^\[|\]$/g,'');
            return `${codeBare} · 정답률 ${s.rate}% (${s.attempts}회 중 ${s.correct}정답) · ${masteryKo(s.status)}`; } } }
        },
        onClick:(e, els)=>{ if (!els.length) return; const s = ordered[els[0].index];
          // 약점 막대 클릭 → S4 추천 학습으로 스크롤
          const st = normStatus(s.status);
          if (st === 'notReached' || (st === 'partial' && s.rate < 70)){
            const sec = document.getElementById('sNextSection'); if (sec) sec.scrollIntoView({ behavior:'smooth', block:'start' });
          } else {
            location.href = '/self-learn/?achievement_code=' + encodeURIComponent(s.code);
          }
        }
      }
    });
  }
  function destroyDivergeChart(){ if (LRS._divergeChart){ try{ LRS._divergeChart.destroy(); }catch(_){} LRS._divergeChart = null; } }
  document.getElementById('sDivergeTopN').addEventListener('change', drawDiverge);
  drawDiverge();

  // ── S-TREND + S-PROJ (분석·예측 P0, 무위험·자기효능) — 후행 로드 ──────
  (async () => {
    const td = await apiGet('/api/lrs/trend/student/' + encodeURIComponent(uid));
    renderStudentTrend(td);
  })();

  function renderStudentTrend(td){
    const body = document.getElementById('sTrendBody');
    const chips = document.getElementById('sTrendChips');
    const foot = document.getElementById('sTrendFoot');
    if (!body) return;
    const trend = td && td.trend;
    const proj = td && td.proj || (td && td.projection);  // 라우트는 projection 키
    const target = (td && td.target) || 80;

    // ★ 윤리(P6): 위험점수·등수·"위험" 어휘·신뢰배지 절대 미표기. 하락도 파랑 유지.
    if (!td || !td.success || !trend || trend.status !== 'ok' || !(trend.series||[]).length){
      // 관측 부족 → 격려 빈상태(숨기지 않되 추이 그릴 데이터 없으면 안내)
      const sec = document.getElementById('sTrendSection');
      if (sec) sec.querySelector('#sTrendBody').outerHTML =
        `<div class="mastery-empty"><i class="fas fa-seedling me-icon" style="color:#86efac;"></i>
          <p>조금 더 풀면 내 성취 그래프가 그려져요. 오늘의 학습부터 시작해볼까요?</p>
          <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
      if (chips) chips.innerHTML = '';
      return;
    }

    // 추이 라인 — 기존 "일별 추이" 톤(파랑) 그대로. 이번주 점만 크게.
    const series = trend.series;
    const labels = series.map(s => s.week || '');
    const vals = series.map(s => (s.rate == null ? null : s.rate));
    const lastI = vals.length - 1;
    mkChart(document.getElementById('sTrendChart'), 'line', {
      labels,
      datasets:[{
        label:'내 정답률(%)', data: vals,
        borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.15)',
        borderWidth:2.5, tension:.3, fill:true, spanGaps:true,
        pointRadius:(c)=> c.dataIndex === lastI ? 6 : 3,
        pointBackgroundColor:'#2563eb', pointBorderColor:'#fff', pointBorderWidth:2
      }]
    }, {
      scales:{ y:{ min:0, max:100, ticks:{ callback:v=>v+'%', font:{size:12} } }, x:{ ticks:{ font:{size:11}, maxTicksLimit: window.innerWidth<768?6:10 } } },
      plugins:{ legend:{ display:false },
        tooltip:{ callbacks:{ label:(c)=> c.parsed.y==null?null:`정답률 ${c.parsed.y}%` } } }
    });

    // 칩 2종 (윤리 문구) — 감소 수치/위험 절대 노출 금지
    const lowSample = (trend.observedWeeks||0) < 6 || trend.confidence === 'low';
    let chipHtml = '';
    const dir = normTrendDir(trend.direction);
    if (dir === 'up'){
      chipHtml += `<span class="sproj-chip good"><i class="fas fa-wand-magic-sparkles"></i> 꾸준히 오르고 있어요!</span>`;
    } else {
      // 정체/하락도 격려·중립 (떨어짐·위험 금지)
      chipHtml += `<span class="sproj-chip soft"><i class="fas fa-hand-holding-heart"></i> 최근 조금 어려워졌네요. 이걸 같이 볼까요?</span>`;
    }
    if (proj && proj.reachable && proj.weeksToReach != null && proj.weeksToReach > 0){
      chipHtml += `<span class="sproj-chip proj"><i class="fas fa-bullseye"></i> 이 속도면 약 ${proj.weeksToReach}주 후 ${target}% 도달 예상이에요! 👍</span>`;
    } else if (proj && proj.reachable && proj.weeksToReach === 0){
      chipHtml += `<span class="sproj-chip good"><i class="fas fa-star"></i> 이미 ${target}% 수준이에요. 이대로 꾸준히!</span>`;
    } else {
      chipHtml += `<span class="sproj-chip proj"><i class="fas fa-seedling"></i> 조금만 더 풀면 가까워져요.</span>`;
    }
    if (chips) chips.innerHTML = chipHtml;

    // 학생용 순화 disclaimer + 소표본 단서(중립, 신뢰배지 없음)
    if (foot){
      foot.innerHTML = `<p class="proj-disclaimer"><i class="fas fa-circle-info"></i> 이 추정은 함께 참고하는 거예요.${lowSample ? ' 표본이 적어 대략적인 추정이에요.' : ''}</p>`;
    }
  }

  // ── S4 추천 카드 ─────────────────────────────────────────────────────
  const nextGrid = document.getElementById('sNextGrid');
  // 미도달 우선 → 부분 도달 (평가부족은 카드 만들지 않음)
  const cards = weaknesses.slice().sort((a,b)=>{
    const rank = s => normStatus(s.status) === 'notReached' ? 0 : 1;
    return rank(a) - rank(b) || (a.rate||0) - (b.rate||0);
  });
  if (!cards.length){
    // 빈 상태 3분기: 데이터없음 / 평가부족만(아직 미평가) / 진짜 약점없음(모두 도달)
    if (noData){
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-seedling me-icon" style="color:#9ca3af;"></i>
        <p>아직 성취 데이터가 없어요. 학습을 풀면 강·약과 다음 할 일이 나타나요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    } else if (allInsufficient){
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-hourglass-half me-icon" style="color:#9ca3af;"></i>
        <p>아직 평가된 성취기준이 없어요. 성취기준당 3번 이상 풀면 강·약을 가릴 수 있어요.</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    } else {
      nextGrid.innerHTML = `<div class="mastery-empty"><i class="fas fa-circle-check me-icon" style="color:#86efac;"></i>
        <p>지금 보충할 약점이 없어요! 새로운 학습에 도전해볼까요?</p>
        <a class="mastery-btn mastery-btn-sm" href="/self-learn/"><i class="fas fa-rocket"></i> 오늘의 학습</a></div>`;
    }
  } else {
    nextGrid.className = 'next-grid';
    nextGrid.innerHTML = cards.map((w, i) => {
      const st = normStatus(w.status);
      const codeBare = String(w.code||'').replace(/^\[|\]$/g,'');
      const recs = w.recommendations || [];
      const first = recs[0];
      const moreCount = Math.max(0, recs.length - 1);
      const hasRec = !!first;
      const itemRow = first ? `<div class="nc-item"><i class="fas ${recTypeIcon(first.type)}" aria-hidden="true"></i>
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(first.title||'추천 학습')}</span></div>`
        : `<div class="nc-item" style="color:#9ca3af;"><i class="fas fa-hourglass-half"></i> 이 성취기준 추천 콘텐츠를 준비 중이에요</div>`;
      const moreRow = moreCount > 0 ? `<button type="button" class="nc-more" data-more="${i}">+${moreCount}개 더 보기</button>
        <div class="nc-more-list" id="ncMore-${i}" hidden style="display:flex;flex-direction:column;gap:6px;">
          ${recs.slice(1).map(r=>`<div class="nc-item"><i class="fas ${recTypeIcon(r.type)}"></i>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.title||'추천 학습')}</span></div>`).join('')}
        </div>` : '';
      return `<div class="next-card" data-idx="${i}">
        <div class="nc-badgerow">
          <span class="mastery-badge ${st}">${masteryKo(w.status)}</span>
          <span class="nc-subject">${escapeHtml(w.subject||'')}</span>
        </div>
        <div class="nc-title">${escapeHtml(w.label || codeBare)}</div>
        <div class="nc-meta">[${escapeHtml(codeBare)}] · 현재 ${w.rate==null?'-':w.rate}%</div>
        <hr class="nc-divider">
        ${itemRow}
        ${moreRow}
        <div class="nc-cta">
          <button type="button" class="mastery-btn" data-play="${i}" ${hasRec?'':'disabled'}>
            ${hasRec ? '이 학습 풀기 <i class="fas fa-arrow-right"></i>' : '추천 준비 중'}
          </button>
        </div>
      </div>`;
    }).join('');

    // 카드 이벤트: 풀기 / 더보기
    nextGrid.querySelectorAll('button[data-play]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = parseInt(btn.getAttribute('data-play'),10);
        const w = cards[i]; const first = (w.recommendations||[])[0];
        const url = recPlayUrl(first);
        MasteryPlayer.open(w.label || (w.code||'학습'), url);
      });
    });
    nextGrid.querySelectorAll('button[data-more]').forEach(btn => {
      btn.addEventListener('click', () => {
        const i = btn.getAttribute('data-more');
        const list = document.getElementById('ncMore-'+i);
        if (list){ const open = !list.hidden; list.hidden = open; btn.textContent = open ? `+${list.children.length}개 더 보기` : '접기'; }
      });
    });
  }

  // A4 "다음 한 걸음" — 선수→후속 경로 사슬 + CTA (학생 본인, 정상 렌더 경로 말미)
  await renderNextStep(document.getElementById('sNextStepHost'));
};

VIEWS['s-trend'] = async function(root){
  root.innerHTML = tplLoading(1);
  // 학생 추이는 90일 고정 요청
  const daily = await apiGet('/api/lrs/stats/daily', { period:'90d' });
  const rows = (daily && daily.data) || [];

  // 추이 차트 영역 + A6 "감정-성취 비교" 카드 자리(하단 append)
  root.innerHTML = `<div id="sTrendChartHost"></div><div id="sEmotionMirrorHost"></div>`;
  const chartHost = document.getElementById('sTrendChartHost');
  if (!rows.length){
    chartHost.innerHTML = tplEmpty('추이 데이터가 없어요');
  } else {
    chartHost.innerHTML = chartWrap('sTrendLine','학습 추이 (최근 90일)','학습시간·활동건수·평균점수');
    mkChart(document.getElementById('sTrendLine'),'line',{
      labels: rows.map(r=>fmtDate(r.stat_date)),
      datasets:[
        { label:'학습시간(분)', data: rows.map(r=>toMinutes(r.total_duration_sec || r.total_duration)), borderColor:'var(--chart-1)', tension:.3 },
        { label:'활동 건수',    data: rows.map(r=>r.count||0),                   borderColor:'var(--chart-5)', tension:.3, yAxisID:'y2' },
        { label:'평균 점수',    data: rows.map(r=>Number(r.avg_score)||0),       borderColor:'var(--chart-3)', tension:.3, yAxisID:'y2' }
      ]
    }, { scales:{ y:{title:{display:true,text:'분'}}, y2:{position:'right', title:{display:true,text:'건/점'}, grid:{drawOnChartArea:false}} }});
  }

  // A6 "감정-성취 비교" — 정서×성취(학습 점수) (학생 본인)
  await renderEmotionMirror(document.getElementById('sEmotionMirrorHost'));
};

/* ===== A6 "감정-성취 비교" (학생 · 정서×성취) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드1(A6)
 * GET /api/lrs/emotion-mirror/:userId → { groups:[{key,label,emoji,n,avgScore|null,avgActs|null}]×3, totalDays, coaching }
 * 단일축 bar: 데이터셋 1개 = 평균 학습 점수(파랑#2563eb, y축 0~100 하나). 활동량은 툴팁에만.
 * n<5(avgScore=null) 그룹은 막대 미표시 + 차트 중앙 높이에 회색 "기록 부족"(축 라벨과 분리). 가로스크롤 0. */
async function renderEmotionMirror(host){
  if (!host) return;
  const uid = state.me && state.me.id;
  if (!uid){ host.innerHTML = ''; return; } // 로그인 정보 없으면 조용히 생략

  host.innerHTML = tplLoading(1);
  const d = await apiGet('/api/lrs/emotion-mirror/' + encodeURIComponent(uid), {});
  if (!d || d.success === false){
    host.innerHTML = `<section class="dc-chart-wrapper">${tplError('감정-성취 비교를 불러오지 못했어요', ()=>setView('s-trend'))}</section>`;
    return;
  }

  const groups = Array.isArray(d.groups) ? d.groups : [];
  const totalDays = Number(d.totalDays) || 0;
  // 빈 상태(§⑤): 전체 기록<5일 또는 모든 그룹 소표본(n<5 → 비교할 그룹 없음).
  // n>=5 그룹이 하나라도 있으면 렌더(점수 없이 활동량만 있는 경우도 비교 대상).
  const hasComparableGroup = groups.some(g => g && Number(g.n) >= 5);
  if (totalDays < 5 || !hasComparableGroup || !groups.length){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
      <header style="margin-bottom:12px;"><div>
        <h2 style="font-size:20px;font-weight:700;margin:0;">📊 감정-성취 비교</h2>
        <div class="subtitle" style="font-size:14px;">기분에 따라 내 성취(학습 점수)가 어떻게 달랐는지 살펴봐요</div>
      </div></header>
      ${tplEmpty('감정 기록이 더 쌓이면 감정-성취 비교를 보여드릴게요', {href:'/attendance', label:'감정 출석 하러 가기'})}
    </section>`;
    return;
  }

  // 총 감정 기록 일수 꼬리표(mastery-chip-gray)
  const nChip = `<span class="mastery-chip-gray"><i class="fas fa-calendar-check" aria-hidden="true"></i> 감정 기록 ${totalDays}일</span>`;
  const coaching = escapeHtml(d.coaching || '이건 경향일 뿐이에요 — 어떤 날이든 네 노력은 소중해요.');

  host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
    <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0;">📊 감정-성취 비교</h2>
        <div class="subtitle" style="font-size:14px;">기분에 따라 내 성취(학습 점수)가 어떻게 달랐는지 살펴봐요</div>
      </div>
      <div style="flex:none;">${nChip}</div>
    </header>
    <div class="chart-body" id="sEmoMirrorBody" style="position:relative;max-width:100%;">
      <canvas id="sEmoMirror" role="img" aria-label="감정 그룹별 평균 학습 점수 비교 막대 차트"></canvas>
    </div>
    <div id="sEmoMirrorCoach" style="margin-top:16px;background:#f0f7ff;border-left:4px solid #2563eb;border-radius:8px;padding:16px 20px;font-size:16px;line-height:1.7;color:#1e3a5f;">
      💬 ${coaching}
    </div>
    <div style="margin-top:10px;text-align:right;">
      <a href="/attendance" style="font-size:14px;color:#2563eb;font-weight:600;text-decoration:none;">감정 기록 더 보기 →</a>
    </div>
  </section>`;

  // x라벨 = 이모지+텍스트. n<5(avgScore=null) 그룹은 데이터 null(막대 미표시).
  const labels   = groups.map(g => `${g.emoji || ''} ${g.label || ''}`.trim());
  const scoreData = groups.map(g => (g && g.avgScore != null) ? g.avgScore : null);
  const nList     = groups.map(g => (g && g.n != null) ? Number(g.n) : 0);
  const shortLabelP = window.matchMedia && window.matchMedia('(max-width:768px)').matches ? 13 : 14;

  // 데이터라벨(막대 위 수치, 값 있을 때만) + 소표본 "기록 부족"(차트 영역 중앙 높이) — 인라인 플러그인(신규 라이브러리 없음)
  const emoMirrorLabelPlugin = {
    id: 'emoMirrorLabels',
    afterDraw(chart){
      const { ctx } = chart;
      const meta = chart.getDatasetMeta(0);
      const xScale = chart.scales.x;
      const area = chart.chartArea;
      ctx.save();
      // 막대 위 데이터라벨 — 실제 막대(avgScore≠null)에만
      if (meta && !meta.hidden){
        ctx.fillStyle = '#1d4ed8';
        ctx.font = '700 ' + shortLabelP + 'px Pretendard, system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'bottom';
        meta.data.forEach((bar, i) => {
          const v = scoreData[i];
          if (v == null) return;                          // 값 없으면 라벨 없음(떠다니는 라벨 방지)
          ctx.fillText(String(Math.round(v)) + '점', bar.x, bar.y - 4);
        });
      }
      // 소표본 그룹(n<5) → 차트 영역 중앙 높이에 옅은 회색 "기록 부족"(x축 감정 라벨과 분리)
      ctx.fillStyle = '#9ca3af';
      ctx.font = '600 ' + shortLabelP + 'px Pretendard, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const midY = (area.top + area.bottom) / 2;
      labels.forEach((_, i) => {
        if (nList[i] < 5){
          ctx.fillText('기록 부족', xScale.getPixelForValue(i), midY);
        }
      });
      ctx.restore();
    }
  };

  const canvas = document.getElementById('sEmoMirror');
  const chart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label:'평균 학습 점수', data: scoreData, backgroundColor:'#2563eb', borderRadius:4, maxBarThickness:64 }
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false,
      layout:{ padding:{ top:18, bottom:8 } },
      animation:{ duration:600, easing:'easeOutCubic' },
      plugins:{
        legend:{ display:false },
        tooltip:{
          callbacks:{
            label(c){
              const g = groups[c.dataIndex] || {};
              if (g.avgScore == null) return `${g.label||''} · ${g.n||0}일 · 기록 부족`;
              const acts = g.avgActs != null ? `활동 ${g.avgActs}건 · ` : '';
              return `${g.label||''} · 평균 ${g.avgScore}점 · ${acts}${g.n||0}일`;
            }
          }
        }
      },
      scales:{
        x:{ grid:{ display:false }, ticks:{ font:{size:shortLabelP} } },
        y:{ beginAtZero:true, min:0, max:100, title:{ display:true, text:'점수', font:{size:13} }, ticks:{ stepSize:20, font:{size:12} } }
      }
    },
    plugins: [emoMirrorLabelPlugin]
  });
  state.charts.push(chart);
}

/* ===== B6 "정서-참여 교차" (교사 · 반 2×2 산점) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드2(B6)
 * GET /api/lrs/emotion-engage/class/:id?weeks=2
 *   → { points:[{userId,name,x(0~100),y(0~100·0=부정↑),quadrant,hasEmotion,engageNote,emotionNote}],
 *       summary:{red,care,motive,stable}, masked, disclaimer }
 * scatter(y reverse) + 캔버스 뒤 CSS grid 4색 오버레이 + 하단 4칩. 모바일<768=사분면 리스트 폴백. 가로스크롤 0. */
const ENG_QUAD = {
  red:    { ko:'적신호',    emoji:'🔴', color:'#ef4444' },
  care:   { ko:'정서 케어', emoji:'💛', color:'#f59e0b' },
  motive: { ko:'학습 동기', emoji:'🧩', color:'#2563eb' },
  stable: { ko:'안정',      emoji:'🟢', color:'#16a34a' },
};
async function renderEmotionEngage(host){
  if (!host) return;
  host.innerHTML = tplLoading(2);
  const cid = await resolveClassId();
  const d = await apiGet('/api/lrs/emotion-engage/class/' + encodeURIComponent(cid), { weeks:2 });
  if (!d || d.success === false){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">${tplError('정서-참여 교차를 불러오지 못했어요', ()=>setView('t-warnings'))}</section>`;
    return;
  }

  const points = Array.isArray(d.points) ? d.points : [];
  const summary = d.summary || { red:0, care:0, motive:0, stable:0 };
  const masked = !!d.masked;
  const weeks = Number(d.weeks) || 2;

  const maskChip = masked
    ? `<span class="mastery-chip-gray"><i class="fas fa-user-shield" aria-hidden="true"></i> 타 반 — 이름 익명</span>`
    : '';
  const periodChip = `<span class="mastery-chip-gray"><i class="fas fa-calendar-week" aria-hidden="true"></i> 기간: 최근 ${weeks}주</span>`;

  // 빈 상태(§⑤)
  if (!points.length){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
      <header style="margin-bottom:12px;"><div>
        <h2 style="font-size:20px;font-weight:700;margin:0;">🧭 정서-참여 교차</h2>
        <div class="subtitle" style="font-size:14px;">마음(세로)과 학습 참여(가로)를 함께 봐요. 점을 누르면 학생이에요.</div>
      </div></header>
      ${tplEmpty('아직 정서·참여를 교차할 데이터가 부족해요')}
    </section>`;
    return;
  }

  const disclaimer = escapeHtml(d.disclaimer || '규칙 기반 신호예요. 학생과의 대화로 꼭 확인하세요.');

  host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
    <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0;">🧭 정서-참여 교차</h2>
        <div class="subtitle" style="font-size:14px;">마음(세로)과 학습 참여(가로)를 함께 봐요. 점을 누르면 학생이에요.</div>
      </div>
      <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap;">${maskChip}${periodChip}</div>
    </header>

    <!-- 데스크탑: 2×2 산점 (캔버스 뒤 CSS grid 4색 오버레이) -->
    <div id="tEngageChartWrap">
      <div class="eng-quad-grid" aria-hidden="true">
        <div class="eq-cell red"><span class="eq-lbl">🔴 적신호</span></div>
        <div class="eq-cell care"><span class="eq-lbl">💛 정서 케어</span></div>
        <div class="eq-cell motive"><span class="eq-lbl">🧩 학습 동기</span></div>
        <div class="eq-cell stable"><span class="eq-lbl">🟢 안정</span></div>
      </div>
      <div class="eng-cross-v" aria-hidden="true"></div>
      <div class="eng-cross-h" aria-hidden="true"></div>
      <canvas id="tEngageChart" role="img" aria-label="정서-참여 교차 산점도"></canvas>
    </div>

    <!-- 모바일 폴백: 사분면별 리스트(적신호 먼저) -->
    <div class="eng-mobile" id="tEngageMobile"></div>

    <!-- 하단 4칩 -->
    <div class="eng-chips" id="tEngageChips">
      ${['red','care','motive','stable'].map(q => `
        <button type="button" class="eng-chip" data-quad="${q}" aria-pressed="false">
          <span class="eng-dot" style="background:${ENG_QUAD[q].color};"></span>
          ${ENG_QUAD[q].emoji} ${ENG_QUAD[q].ko} <b>${Number(summary[q])||0}명</b>
        </button>`).join('')}
    </div>

    <div style="margin-top:14px;font-size:13px;color:#6b7280;line-height:1.6;">
      <i class="fas fa-circle-info" aria-hidden="true"></i> ${disclaimer}
    </div>
  </section>`;

  // ── 모바일 리스트 폴백 채우기(적신호 먼저) ──
  const mob = document.getElementById('tEngageMobile');
  if (mob){
    const order = ['red','care','motive','stable'];
    mob.innerHTML = order.map(q => {
      const names = points.filter(p => p.quadrant === q).map(p => escapeHtml(p.name || '학생'));
      const q0 = ENG_QUAD[q];
      return `<div class="eng-mob-quad ${q}">
        <div class="emq-head"><span class="emq-dot" style="background:${q0.color};"></span>${q0.emoji} ${q0.ko} (${names.length})</div>
        ${names.length ? `<div class="emq-names">▸ ${names.join(' · ')}</div>` : `<div class="emq-empty">해당 학생 없음</div>`}
      </div>`;
    }).join('');
  }

  // ── 산점도(scatter, y reverse) ──
  const canvas = document.getElementById('tEngageChart');
  if (canvas && window.matchMedia && !window.matchMedia('(max-width:768px)').matches){
    const bg = points.map(p => (p.hasEmotion === false) ? '#9ca3af' : (ENG_QUAD[p.quadrant] ? ENG_QUAD[p.quadrant].color : '#9ca3af'));
    const chart = new Chart(canvas, {
      type:'scatter',
      data:{ datasets:[{
        label:'학생',
        data: points.map(p => ({ x: Number(p.x)||0, y: Number(p.y)||0 })),
        backgroundColor: bg, borderColor:'#fff', borderWidth:1.5,
        pointRadius:6, pointHoverRadius:8
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:6 },
        animation:{ duration:500 },
        plugins:{
          legend:{ display:false },
          tooltip:{
            callbacks:{
              label(c){
                const p = points[c.dataIndex] || {};
                const q = ENG_QUAD[p.quadrant] ? ENG_QUAD[p.quadrant].ko : '중립';
                const emo = p.emotionNote ? ` · ${p.emotionNote}` : '';
                const eng = p.engageNote ? ` · 참여 ${p.engageNote}` : '';
                return `${p.name || '학생'}${emo}${eng} · ${q}`;
              }
            }
          }
        },
        scales:{
          x:{ min:0, max:100, title:{ display:true, text:'참여  (← 낮음 · 유지 →)', font:{size:13} },
              ticks:{ stepSize:50, font:{size:12} }, grid:{ display:false } },
          y:{ min:0, max:100, reverse:true, title:{ display:true, text:'정서  (부정 ↑ · 긍정 ↓)', font:{size:13} },
              ticks:{ stepSize:50, font:{size:12} }, grid:{ display:false } }
        }
      }
    });
    state.charts.push(chart);
  }

  // ── 4칩 클릭 → 해당 사분면 점 하이라이트(토글) ──
  const chipHost = document.getElementById('tEngageChips');
  if (chipHost && canvas){
    chipHost.querySelectorAll('.eng-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const q = chip.getAttribute('data-quad');
        const on = chip.getAttribute('aria-pressed') !== 'true';
        chipHost.querySelectorAll('.eng-chip').forEach(c => c.setAttribute('aria-pressed','false'));
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        const chart = state.charts.find(c => c && c.canvas === canvas);
        if (!chart) return;
        const ds = chart.data.datasets[0];
        ds.pointBackgroundColor = points.map(p => {
          const base = (p.hasEmotion === false) ? '#9ca3af' : (ENG_QUAD[p.quadrant] ? ENG_QUAD[p.quadrant].color : '#9ca3af');
          if (!on) return base;
          return p.quadrant === q ? base : 'rgba(203,213,225,.35)';
        });
        ds.pointRadius = points.map(p => (on && p.quadrant === q) ? 8 : 6);
        chart.update();
      });
    });
  }
}

/* ===== B4 "겉핥기 감지" (교사 · 산점 + median 점선 + 속도이상 표) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드3(B4)
 * GET /api/lrs/shallow/class/:id?days=30
 *   → { points:[{userId,name,content,durationSec,median,ratio,correct,flag}],
 *       topStudents:[{userId,name,flagCount,severity}], maskedContentCount, medianThreshold, disclaimer }
 * 빈 상태=긍정 톤. 채워진 경로=콘텐츠 셀렉트+산점(median 세로 점선·좌하 음영)+속도이상 Top표. 모바일<768=표만. 가로스크롤 0. */
async function renderShallowLearning(host){
  if (!host) return;
  host.innerHTML = tplLoading(2);
  const cid = await resolveClassId();
  const d = await apiGet('/api/lrs/shallow/class/' + encodeURIComponent(cid), { days:30 });
  if (!d || d.success === false){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">${tplError('겉핥기 감지를 불러오지 못했어요', ()=>setView('t-usage'))}</section>`;
    return;
  }

  const points = Array.isArray(d.points) ? d.points : [];
  const topStudents = Array.isArray(d.topStudents) ? d.topStudents : [];
  const days = Number(d.days) || 30;
  const maskedContentCount = Number(d.maskedContentCount) || 0;
  const disclaimer = escapeHtml(d.disclaimer || '빠르게 맞힌 게 꼭 부정은 아니에요. 이미 잘 아는 내용일 수도 있어요.');
  const maskChip = maskedContentCount > 0
    ? `<span class="mastery-chip-gray"><i class="fas fa-circle-info" aria-hidden="true"></i> 표본 적음 ${maskedContentCount}건</span>` : '';
  const periodChip = `<span class="mastery-chip-gray"><i class="fas fa-calendar-day" aria-hidden="true"></i> 기간: 최근 ${days}일</span>`;

  const headerHtml = `
    <header style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap;">
      <div>
        <h2 style="font-size:20px;font-weight:700;margin:0;">⏱️ 겉핥기 감지</h2>
        <div class="subtitle" style="font-size:14px;">정답은 맞았지만 표준 시간보다 훨씬 빨리 끝낸 학습을 짚어요.</div>
      </div>
      <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap;">${maskChip}${periodChip}</div>
    </header>`;

  // 빈 상태(§⑤ — 긍정 톤)
  if (!points.length){
    host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
      ${headerHtml}
      ${tplEmpty('최근 겉핥기 신호가 없어요. 학생들이 충분한 시간을 들이고 있어요 👍')}
      <div style="margin-top:14px;font-size:13px;color:#6b7280;line-height:1.6;">
        <i class="fas fa-circle-info" aria-hidden="true"></i> ${disclaimer}
      </div>
    </section>`;
    return;
  }

  // 콘텐츠 유니크 목록(셀렉트)
  const contentSet = [];
  const seen = new Set();
  points.forEach(p => { const c = p.content || '(콘텐츠)'; if (!seen.has(c)){ seen.add(c); contentSet.push(c); } });

  host.innerHTML = `<section class="dc-chart-wrapper" style="padding:24px 28px;border-radius:16px;">
    ${headerHtml}

    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <select class="ms-select" id="tShallowSelect" aria-label="콘텐츠 필터">
        <option value="">전체 콘텐츠</option>
        ${contentSet.map(c => `<option value="${escapeAttr(c)}">${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>

    <!-- 데스크탑: 산점도 -->
    <div id="tShallowChartWrap">
      <canvas id="tShallowChart" role="img" aria-label="소요시간 대비 정답 산점도"></canvas>
    </div>

    <!-- 속도이상 Top 표 (t-warnings 명단 표 톤 재사용) -->
    <div style="margin-top:18px;">
      <div style="font-size:15px;font-weight:700;color:#1f2937;margin-bottom:8px;">속도이상 Top</div>
      <div class="shallow-table-wrap">
        <table class="shallow-table">
          <thead><tr>
            <th>학생</th><th>콘텐츠</th><th>소요 / 기준</th><th>결과</th><th>속도이상</th>
          </tr></thead>
          <tbody id="tShallowTbody"></tbody>
        </table>
      </div>
      <div class="shallow-cards" id="tShallowCards"></div>
      ${maskedContentCount > 0 ? `<div style="margin-top:10px;font-size:13px;color:#9ca3af;"><i class="fas fa-circle-info"></i> 표본 적음 ${maskedContentCount}건 — 중앙값이 불안정해 제외했어요.</div>` : ''}
    </div>

    <div style="margin-top:14px;font-size:13px;color:#6b7280;line-height:1.6;">
      <i class="fas fa-circle-info" aria-hidden="true"></i> ${disclaimer}
    </div>
  </section>`;

  // ── 속도이상 Top 표 채우기(flagCount desc, 이미 정렬돼 옴) ──
  const flagPoints = points.filter(p => p.flag);
  const nameToFirstFlag = new Map();  // userId → 대표 flag 포인트(콘텐츠/소요 표기용)
  flagPoints.forEach(p => { if (!nameToFirstFlag.has(p.userId)) nameToFirstFlag.set(p.userId, p); });
  const topRows = (topStudents.length ? topStudents : []).map(ts => {
    const rep = nameToFirstFlag.get(ts.userId) || {};
    return {
      name: ts.name, content: rep.content || '-',
      durationSec: rep.durationSec, median: rep.median, ratio: rep.ratio,
      correct: rep.correct, flagCount: ts.flagCount, severity: ts.severity
    };
  });

  function sevBadge(sev, count){
    const cls = sev === 'high' ? 'high' : 'medium';
    const dot = sev === 'high' ? '🔴' : '🟠';
    return `<span class="shallow-sevbadge ${cls}">${dot} ${count}건</span>`;
  }
  function durCell(r){
    if (r.durationSec == null || r.median == null) return '-';
    const ratio = (r.ratio != null) ? ` (${Number(r.ratio).toFixed(2)}×)` : '';
    return `${r.durationSec}초 / ${r.median}초<span class="st-ratio">${ratio}</span>`;
  }
  function resultCell(r){
    return r.correct ? '✅ 정답' : '❌';
  }

  const tbody = document.getElementById('tShallowTbody');
  const cards = document.getElementById('tShallowCards');
  if (tbody){
    if (!topRows.length){
      tbody.innerHTML = `<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:18px;">속도이상으로 분류된 학생이 없어요.</td></tr>`;
    } else {
      tbody.innerHTML = topRows.map(r => `<tr>
        <td class="st-name">${escapeHtml(r.name || '학생')}</td>
        <td>${escapeHtml(r.content || '-')}</td>
        <td>${durCell(r)}</td>
        <td>${resultCell(r)}</td>
        <td>${sevBadge(r.severity, r.flagCount)}</td>
      </tr>`).join('');
    }
  }
  if (cards){
    cards.innerHTML = topRows.length ? topRows.map(r => `<div class="shallow-card">
      <div class="sc-top"><span class="sc-name">${escapeHtml(r.name || '학생')}</span>${sevBadge(r.severity, r.flagCount)}</div>
      <div class="sc-meta">${escapeHtml(r.content || '-')} · ${durCell(r)} · ${resultCell(r)}</div>
    </div>`).join('') : `<div style="color:#9ca3af;font-size:14px;padding:8px 2px;">속도이상으로 분류된 학생이 없어요.</div>`;
  }

  // ── 산점도 렌더(콘텐츠 필터 반영) ──
  const isMobile = window.matchMedia && window.matchMedia('(max-width:768px)').matches;
  function drawScatter(selectedContent){
    const canvas = document.getElementById('tShallowChart');
    if (!canvas || isMobile) return;
    // 기존 차트 제거
    const prevIdx = state.charts.findIndex(c => c && c.canvas === canvas);
    if (prevIdx >= 0){ try{ state.charts[prevIdx].destroy(); }catch(_){} state.charts.splice(prevIdx,1); }

    const shown = selectedContent ? points.filter(p => (p.content||'(콘텐츠)') === selectedContent) : points;
    // 특정 콘텐츠 선택 시 median(그 콘텐츠 대표값) → 세로 점선
    let medianX = null;
    if (selectedContent && shown.length){ const m = shown.find(p => p.median != null); if (m) medianX = Number(m.median); }

    // median 세로 점선 + 좌하(빠름+맞음) 음영 플러그인
    const shallowOverlay = {
      id:'shallowOverlay',
      beforeDatasetsDraw(chart){
        if (medianX == null) return;
        const { ctx, chartArea:area, scales } = chart;
        const xPx = scales.x.getPixelForValue(medianX);
        const thrPx = scales.x.getPixelForValue(medianX * 0.4);
        const yMidTop = scales.y.getPixelForValue(0.5);  // 정답(1) 위쪽 = area.top~yMid
        ctx.save();
        // 좌하(x<median*0.4 & 정답=위) 음영
        ctx.fillStyle = '#fef2f2';
        ctx.fillRect(area.left, area.top, Math.max(0, thrPx - area.left), yMidTop - area.top);
        // median 세로 점선
        ctx.strokeStyle = '#2563eb'; ctx.lineWidth = 1.5; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(xPx, area.top); ctx.lineTo(xPx, area.bottom); ctx.stroke();
        ctx.restore();
      }
    };

    const chart = new Chart(canvas, {
      type:'scatter',
      data:{ datasets:[{
        label:'학습 기록',
        data: shown.map(p => ({ x: Number(p.durationSec)||0, y: p.correct ? 1 : 0 })),
        backgroundColor: shown.map(p => p.flag ? '#ef4444' : '#9ca3af'),
        pointRadius: shown.map(p => p.flag ? 7 : 5),
        pointHoverRadius: shown.map(p => p.flag ? 9 : 7),
        borderColor:'#fff', borderWidth:1
      }]},
      options:{
        responsive:true, maintainAspectRatio:false,
        layout:{ padding:6 },
        animation:{ duration:400 },
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label(c){
            const p = shown[c.dataIndex] || {};
            const ratio = (p.ratio != null) ? `(기준 ${p.median}초의 ${Number(p.ratio).toFixed(2)}배)` : '';
            return `${p.name || '학생'} · ${p.content||''} · ${p.durationSec}초 ${ratio} · ${p.correct?'정답':'오답'}`;
          } } }
        },
        scales:{
          x:{ beginAtZero:true, min:0, title:{ display:true, text:'소요(초)', font:{size:13} }, ticks:{ font:{size:12} }, grid:{ color:'rgba(0,0,0,.05)' } },
          y:{ min:-0.2, max:1.2, title:{ display:true, text:'결과', font:{size:13} },
              ticks:{ stepSize:1, callback:v => v===1 ? '정답' : (v===0 ? '오답' : ''), font:{size:12} }, grid:{ color:'rgba(0,0,0,.05)' } }
        }
      },
      plugins:[shallowOverlay]
    });
    state.charts.push(chart);
  }
  drawScatter('');

  const sel = document.getElementById('tShallowSelect');
  if (sel) sel.addEventListener('change', () => drawScatter(sel.value));
}

/* ===== A4 "다음 한 걸음" (학생 · 선수→후속 경로 사슬 + CTA) =====
 * 스펙: 작업지시서/LRS_P0_시각데이터스펙_v1.md 카드4(A4)
 * GET /api/lrs/next-step/:userId?limit=3
 *   → { keyNodes:[{code,label,status,unlocksCount,unlocks,chain:[{code,label,status,current}],
 *       recommendations:[{id,title,type,thumbnail_url}],cta}], readyToChallenge:[...], note }
 * HTML/CSS flex 경로 사슬 + "지금 이거 하나!" CTA(강조 1장). [바로 풀기]=MasteryPlayer.open(90vw×90vh). 모바일<768=세로 스택. */
async function renderNextStep(host){
  if (!host) return;
  const uid = state.me && state.me.id;
  if (!uid){ host.innerHTML = ''; return; }

  host.innerHTML = tplLoading(2);
  const d = await apiGet('/api/lrs/next-step/' + encodeURIComponent(uid), { limit:3 });
  if (!d || d.success === false){
    host.innerHTML = `<section class="mastery-section">${tplError('다음 한 걸음을 불러오지 못했어요', ()=>setView('s-achieve'))}</section>`;
    return;
  }

  const keyNodes = Array.isArray(d.keyNodes) ? d.keyNodes : [];
  const ready = Array.isArray(d.readyToChallenge) ? d.readyToChallenge : [];
  const note = escapeHtml(d.note || '학습 지도를 따라가면 막힌 곳을 넘을 수 있어요.');

  const headerHtml = `
    <div class="ms-head"><div class="ms-titles">
      <h2 class="mastery-h2">🗝️ 다음 한 걸음</h2>
      <div class="mastery-sub">막힌 곳을 넘으면 그다음 학습이 열려요.</div>
    </div></div>`;

  // 빈 상태(§⑤): keyNodes·readyToChallenge 둘 다 0
  if (!keyNodes.length && !ready.length){
    host.innerHTML = `<section class="mastery-section" style="margin-top:16px;">
      ${headerHtml}
      ${tplEmpty('지금은 막힌 곳이 없어요! 잘하고 있어요 🎉 새로운 학습을 이어가 볼까요?', {href:'/self-learn', label:'맞춤학습 하러 가기'})}
    </section>`;
    return;
  }

  // 상태 → 노드 클래스/이모지 (평가부족·후속잠금 = 회색, 빨강 금지)
  function nodeStatusClass(status, isLocked){
    const s = String(status||'');
    if (s === 'reached') return 'reached';
    if (s === 'not_reached') return 'not_reached';
    return 'insufficient';  // insufficient / locked / 그 외 → 회색
  }
  function nodeEmoji(status){
    const s = String(status||'');
    if (s === 'reached') return '✅';
    if (s === 'not_reached') return '🔴';
    return '⬜';
  }

  // 경로 사슬(HTML/CSS flex)
  function chainHtml(chain){
    if (!Array.isArray(chain) || !chain.length) return '';
    const nodes = chain.map(n => {
      const cls = nodeStatusClass(n.status);
      const cur = n.current ? ' current' : '';
      const label = escapeHtml(n.label || String(n.code||'').replace(/^\[|\]$/g,''));
      const titleAttr = escapeAttr(`${n.label || n.code || ''} · ${MASTERY_KO[normStatus(n.status)] || ''}`);
      return `<div class="ns-node ${cls}${cur}" title="${titleAttr}">
        <span class="nsn-emoji" aria-hidden="true">${nodeEmoji(n.status)}</span>
        <span class="nsn-label">${label}</span>
        ${n.current ? '<span class="nsn-pin">📍 지금</span>' : ''}
      </div>`;
    });
    // 노드 사이 화살표
    let out = '';
    nodes.forEach((nd, i) => { out += nd; if (i < nodes.length - 1) out += `<span class="ns-arrow" aria-hidden="true">▶</span>`; });
    return `<div class="ns-chain">${out}</div>`;
  }

  // 추천 콘텐츠 행 (썸네일 or 아이콘 박스 + 제목 + [바로 풀기])
  function recRowHtml(rec, keyLabel){
    if (!rec) return '';
    const title = escapeHtml(rec.title || '추천 학습');
    const thumb = rec.thumbnail_url
      ? `<img src="${escapeAttr(rec.thumbnail_url)}" alt="">`
      : `<i class="fas ${recTypeIcon(rec.type)}" aria-hidden="true"></i>`;
    const url = recPlayUrl(rec);
    const btn = url
      ? `<button type="button" class="mastery-btn mastery-btn-sm ns-play" data-title="${escapeAttr(rec.title || keyLabel || '학습')}" data-url="${escapeAttr(url)}">바로 풀기 <i class="fas fa-arrow-right"></i></button>`
      : `<a class="mastery-btn mastery-btn-sm" href="/self-learn/">바로 풀기 <i class="fas fa-arrow-right"></i></a>`;
    return `<div class="ns-rec-row">
      <div class="ns-rec-thumb">${thumb}</div>
      <div class="ns-rec-info">
        <div class="ns-rec-title">${title}</div>
        <div class="ns-rec-type">${escapeHtml(rec.type || '추천 콘텐츠')}</div>
      </div>
      <div class="ns-rec-cta">${btn}</div>
    </div>`;
  }

  // CTA 카드(keyNodes[0]만 강조, 나머지 톤 다운)
  const ctaCards = keyNodes.map((kn, i) => {
    const label = escapeHtml(kn.label || String(kn.code||'').replace(/^\[|\]$/g,''));
    const cta = escapeHtml(kn.cta || `이걸 풀면 뒤의 ${kn.unlocksCount||0}개가 열려요`);
    const rec = (kn.recommendations || [])[0];
    return `<div class="ns-cta-card ${i === 0 ? '' : 'dim'}">
      <div class="ns-cta-head">
        <span class="ns-cta-key">🗝️ ${label}</span>
        <span class="ns-cta-msg">${cta}</span>
      </div>
      ${chainHtml(kn.chain)}
      ${rec ? recRowHtml(rec, kn.label) : `<div class="ns-rec-row" style="color:#9ca3af;">이 학습의 추천 콘텐츠를 준비 중이에요.</div>`}
    </div>`;
  }).join('');

  // readyToChallenge 섹션(있을 때만 · 초록 강조)
  const readyHtml = ready.length ? ready.map(r => {
    const label = escapeHtml(r.label || String(r.code||'').replace(/^\[|\]$/g,''));
    const msg = escapeHtml(r.message || '선수 학습을 마쳤어요 — 지금 도전해 볼까요?');
    const rec = (r.recommendations || [])[0];
    return `<div class="ns-ready">
      <div class="ns-ready-head"><i class="fas fa-bolt" aria-hidden="true"></i> 지금 도전 · ${label}</div>
      <div class="ns-ready-msg">${msg}</div>
      ${rec ? recRowHtml(rec, r.label) : ''}
    </div>`;
  }).join('') : '';

  host.innerHTML = `<section class="mastery-section" style="margin-top:16px;">
    ${headerHtml}
    ${ctaCards}
    ${readyHtml}
    <div class="ns-note">💬 ${note}</div>
  </section>`;

  // [바로 풀기] → MasteryPlayer(90vw×90vh 모달, GNB 위 z-index 기설정)
  host.querySelectorAll('.ns-play').forEach(btn => {
    btn.addEventListener('click', () => {
      MasteryPlayer.open(btn.getAttribute('data-title') || '학습', btn.getAttribute('data-url'));
    });
  });
}

/* ===== 교사 경고 응답 → 통합 목록 변환 =====
 * 입력: {inactive:[], noData:[], consecutiveWrong:[], weakAchievements:[], summary:{...}}
 * 출력: [{user_id, name, severity, reason, achievement_code?, last_active?, _kind}]
 */
function flattenWarnings(w){
  if (!w) return { all:[], summary:{inactiveCount:0,noDataCount:0,wrongCount:0,weakCount:0} };
  const raw = w.summary || {};
  const summary = {
    inactiveCount: raw.inactiveCount != null ? raw.inactiveCount : (w.inactive||[]).length,
    noDataCount:   raw.noDataCount   != null ? raw.noDataCount   : (w.noData||[]).length,
    wrongCount:    raw.wrongCount    != null ? raw.wrongCount    : (raw.consecutiveWrongCount != null ? raw.consecutiveWrongCount : (w.consecutiveWrong||[]).length),
    weakCount:     raw.weakCount     != null ? raw.weakCount     : (w.weakAchievements||[]).length
  };
  // 공통 helper: 다양한 필드명 허용 (user_id|userId|id), (name|displayName|student_name)
  const uidOf = x => x.user_id || x.userId || x.id || '';
  const nameOf = x => x.name || x.displayName || x.student_name || ('학생 #'+uidOf(x));
  const all = [];
  (w.inactive||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity: x.severity||'medium',
    reason: `미접속 ${x.daysInactive||'-'}일 (최근: ${x.lastActivityDate||'-'})`,
    last_active: x.lastActivityDate||'-', _kind:'inactive'
  }));
  (w.consecutiveWrong||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity: x.severity||'high',
    reason: `연속 오답 ${x.wrongStreak||x.streak||'-'}회`, _kind:'wrong'
  }));
  // weakAchievements: 학생별로 items 배열 — 각 item당 한 행
  (w.weakAchievements||[]).forEach(x => {
    const items = x.items || [{ achievement_code: x.achievement_code, avg_score: x.avg_score, last_level: x.last_level, attempt_count: x.attempt_count }];
    items.forEach(it => all.push({
      user_id: uidOf(x), name: nameOf(x),
      severity: it.severity || (it.avg_score != null && it.avg_score < 50 ? 'high' : 'medium'),
      reason: `${it.achievement_code||'-'} · ${it.last_level||'미도달'}${it.avg_score!=null?` (평균 ${it.avg_score})`:''} · ${it.attempt_count||'-'}회 시도`,
      achievement_code: it.achievement_code, _kind:'weak'
    }));
  });
  (w.noData||[]).forEach(x => all.push({
    user_id: uidOf(x), name: nameOf(x), severity:'low',
    reason:'학습 데이터 없음', _kind:'noData'
  }));
  return { all, summary, raw: w };
}

/* ── T-EWS 위험군 카드 리스트 렌더(공통) ── */
function renderEwsList(host, ews){
  if (!host) return;
  if (!ews.ok){
    host.innerHTML = `<div class="mastery-empty"><i class="fas fa-triangle-exclamation me-icon"></i>
      <p>조기경보 데이터를 불러오지 못했어요. 잠시 후 다시 시도해주세요.</p></div>`;
    return;
  }
  // masked 여부와 무관하게 데이터가 있으면 항상 렌더한다.
  //  - masked=false(담임): BE가 준 실명 그대로
  //  - masked=true(관리자 거시·타반): BE가 이미 익명("학생 A")으로 내려줌 → 그대로 렌더
  // 빈상태는 "진짜 위험 학생 0명"일 때만(아래 flagged 분기).
  const list = (ews.list || []);
  // 위험 가산 신호가 있는 학생만(점수>0 또는 등급 high/mid). 전원 무위험이면 긍정 빈상태.
  const flagged = list.filter(r => (r.score||0) > 0 && r.grade !== 'low');
  const allLowSample = list.length > 0 && list.every(r => r.evaluated < 3 || r.observedWeeks < 3);
  if (!flagged.length){
    if (allLowSample){
      host.innerHTML = `<div class="mastery-empty"><i class="fas fa-hourglass-half me-icon"></i>
        <p>아직 위험 신호를 가릴 데이터가 부족해요. 학습이 더 쌓이면 표시됩니다.</p></div>`;
    } else {
      host.innerHTML = `<div class="mastery-empty"><i class="fas fa-face-smile me-icon" style="color:#86efac;"></i>
        <p>지금 특별히 지원이 필요한 학생이 없어요. 반 전체가 잘 따라오고 있어요! 🎉</p></div>`;
    }
    return;
  }
  LRS._ewsCache = flagged;
  const RISK_ICON = { high:'fa-triangle-exclamation', mid:'fa-circle-exclamation', low:'fa-circle-check' };
  host.innerHTML = `<div class="ews-list">${flagged.slice(0,8).map((r, idx)=>{
    const g = gradeKey(r.grade);
    const icon = RISK_ICON[g] || RISK_ICON.mid;
    const uid = r.userId != null ? r.userId : '';
    const reasons = (r.reasons||[]).filter(x => x.type !== 'insufficient');
    const insuf = (r.reasons||[]).find(x => x.type === 'insufficient');
    const lowSample = (r.evaluated != null && r.evaluated < 3) || (r.observedWeeks != null && r.observedWeeks < 3);
    const reasonChips = reasons.map(rs => {
      let hint = rs.text;
      if (rs.type === 'decline') hint = `${rs.text} (관측 ${r.observedWeeks||0}주)`;
      return `<span class="ews-reason" data-key="${escapeAttr(rs.type)}" tabindex="0" title="${escapeAttr(hint)}">${escapeHtml(rs.text)}</span>`;
    }).join('');
    const insufChip = insuf ? `<span class="ews-reason" data-key="insufficient" title="${escapeAttr(insuf.text)}">참여 부족</span>` : '';
    const confHint = `관측 ${r.observedWeeks||0}주 · 판정 성취기준 ${r.evaluated||0}개`;
    return `<div class="ews-card" data-risk="${g}">
      <div class="ews-top">
        <span class="ews-name"><i class="fas ${icon} risk-icon" data-risk="${g}" aria-hidden="true"></i> ${escapeHtml(r.name||('학생 '+uid))}</span>
        <span class="ews-badges">
          <span class="risk-badge" data-risk="${g}"><i class="fas ${icon}" aria-hidden="true"></i> 위험 ${r.score} · ${escapeHtml(r.gradeKo||'')}</span>
          ${confBadge(r.confidence, r.confidenceKo, confHint)}
        </span>
      </div>
      <div class="ews-reasons">${reasonChips}${insufChip}${lowSample ? lowSampleChip('표본 부족 · 참고용') : ''}</div>
      <div class="ews-actions" data-student-id="${escapeAttr(uid)}" data-warn-idx="${idx}">
        <button type="button" class="mastery-btn mastery-btn-sm" data-action="recommend"><i class="fas fa-wand-magic-sparkles"></i> 맞춤학습</button>
        <button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" data-action="message"><i class="fas fa-envelope"></i> 메시지</button>
        <button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" data-action="homework"><i class="fas fa-clipboard-list"></i> 과제부과</button>
        <button type="button" class="mastery-btn mastery-btn-sm mastery-btn-ghost" data-action="detail"><i class="fas fa-up-right-from-square"></i> 상세</button>
      </div>
    </div>`;
  }).join('')}</div>`;

  // 액션 바인딩
  host.querySelectorAll('.ews-actions button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const wrap = btn.closest('.ews-actions');
      const uid = wrap.getAttribute('data-student-id');
      const idx = parseInt(wrap.getAttribute('data-warn-idx'),10);
      const action = btn.getAttribute('data-action');
      const row = (LRS._ewsCache||[])[idx] || { user_id: uid };
      if (action === 'detail'){
        LRS.openDrilldown({ user_id: uid, name: row.name, reason: (row.reasons||[]).map(x=>x.text).join(' · ') });
      } else {
        LRS.teacherAction(action, uid, '');
      }
    });
  });
}
